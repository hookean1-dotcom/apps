<!DOCTYPE html>
<html lang="en-GB">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Voltage Control Comparison</title>
    <style>
        /* Responsive layout for Fasthosts compatibility */
        body, html {
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: #f0f4f8;
            width: 100%;
            min-height: 100vh;
            color: #333;
            box-sizing: border-box;
        }

        .app-container {
            width: 100%;
            max-width: 1100px;
            margin: 0 auto;
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            padding: 20px;
            box-sizing: border-box;
        }

        .circuit-panel {
            flex: 1 1 400px;
            background: #ffffff;
            border-radius: 12px;
            box-shadow: 0 6px 16px rgba(0,0,0,0.08);
            padding: 25px;
            display: flex;
            flex-direction: column;
        }

        h2 {
            margin-top: 0;
            color: #2c3e50;
            font-size: 1.3rem;
            text-align: center;
            padding-bottom: 15px;
            border-bottom: 2px solid #ecf0f1;
        }

        /* SVG container ensures proportional scaling without squashing */
        .svg-container {
            width: 100%;
            max-width: 400px;
            margin: 10px auto 25px;
            aspect-ratio: 1 / 1;
        }

        svg {
            width: 100%;
            height: 100%;
            display: block;
        }

        /* Standardised SVG component styling */
        .wire { fill: none; stroke: #2d3748; stroke-width: 2.5; stroke-linejoin: round; }
        .component { fill: #ebf8ff; stroke: #2d3748; stroke-width: 2.5; rx: 3; }
        .meter { fill: #ffffff; stroke: #2d3748; stroke-width: 2.5; }
        .text { font-family: 'Segoe UI', system-ui, sans-serif; font-size: 16px; font-weight: 700; text-anchor: middle; dominant-baseline: central; fill: #1a202c; }
        .dot { fill: #2d3748; }

        /* Interactive Switch Styling */
        .switch-group { cursor: pointer; }
        .switch-group:hover .wire { stroke: #3182ce; }
        .switch-group:hover .meter { stroke: #3182ce; }

        .controls {
            margin-bottom: 20px;
            background: #f8fafc;
            padding: 15px;
            border-radius: 8px;
            border: 1px solid #e2e8f0;
        }

        .control-group {
            margin-bottom: 15px;
        }

        .control-group:last-child {
            margin-bottom: 0;
        }

        .control-group label {
            display: flex;
            justify-content: space-between;
            font-weight: 600;
            margin-bottom: 8px;
            color: #4a5568;
            font-size: 0.95rem;
        }

        input[type=range] {
            width: 100%;
            cursor: pointer;
            accent-color: #3182ce;
        }

        select {
            width: 100%;
            padding: 8px 10px;
            border-radius: 6px;
            border: 1px solid #cbd5e1;
            font-family: inherit;
            font-size: 0.95rem;
            background-color: white;
            cursor: pointer;
            color: #2d3748;
        }

        .min-r-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            font-weight: 600;
            color: #4a5568;
            font-size: 0.95rem;
        }

        .min-r-row input[type=number] {
            width: 80px;
            padding: 6px 8px;
            border-radius: 6px;
            border: 1px solid #cbd5e1;
            font-family: inherit;
            font-size: 0.95rem;
            color: #2d3748;
            text-align: right;
        }

        .min-r-hint {
            font-size: 0.8rem;
            color: #64748b;
            margin-top: 4px;
        }

        .readings {
            display: flex;
            gap: 15px;
            margin-top: auto;
        }

        .reading-box {
            flex: 1;
            background: #ebf8ff;
            border: 1px solid #bee3f8;
            padding: 15px;
            border-radius: 8px;
            text-align: center;
            transition: opacity 0.2s ease;
        }

        .reading-box.off {
            opacity: 0.5;
            background: #f1f5f9;
            border-color: #e2e8f0;
        }

        .reading-label {
            font-size: 0.85rem;
            color: #2b6cb0;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 5px;
        }
        
        .reading-box.off .reading-label { color: #64748b; }
        .reading-box.off .reading-value { color: #475569; }

        .reading-value {
            font-size: 1.4rem;
            font-weight: 800;
            color: #2c5282;
            font-family: monospace;
        }
    </style>
</head>
<body>

<div class="app-container">
    
    <div class="circuit-panel">
        <h2>Variable Resistor Control</h2>
        <div class="svg-container">
            <svg viewBox="0 0 300 300" xmlns="http://www.w3.org/2000/svg">
                <defs>
                    <marker id="arrow1" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
                        <path d="M 0 0 L 10 5 L 0 10 z" fill="#2d3748" />
                    </marker>
                </defs>

                <path class="wire" d="M 40 50 L 115 50" />
                <path class="wire" d="M 135 50 L 170 50" />
                <path class="wire" d="M 210 50 L 260 50" />
                <path class="wire" d="M 40 50 L 40 210" />
                <path class="wire" d="M 40 210 L 260 210" />
                <path class="wire" d="M 260 50 L 260 210" />

                <line class="wire" x1="120" y1="30" x2="120" y2="70" />
                <line class="wire" x1="130" y1="40" x2="130" y2="60" stroke-width="4" />

                <circle class="meter" cx="40" cy="110" r="16" />
                <text class="text" x="40" y="112">A</text>

                <g id="switch1-group" class="switch-group">
                    <path id="switch1-wire" class="wire" d="M 170 50 L 200 35" /> <circle class="meter" cx="170" cy="50" r="3" />
                    <circle class="meter" cx="210" cy="50" r="3" />
                    <rect x="150" y="20" width="80" height="60" fill="transparent" />
                    <text class="text" x="190" y="25" font-size="10" fill="#718096">CLICK</text>
                </g>

                <g id="comp1-resistor">
                    <rect class="component" x="100" y="200" width="60" height="20" />
                    <text class="text" x="130" y="210">R</text>
                </g>
                <g id="comp1-bulb" style="display: none;">
                    <circle class="component" cx="130" cy="210" r="16" />
                    <circle id="bulb1-glow" cx="130" cy="210" r="16" fill="#fbbf24" opacity="0" />
                    <line x1="119" y1="199" x2="141" y2="221" stroke="#2d3748" stroke-width="2.5" />
                    <line x1="141" y1="199" x2="119" y2="221" stroke="#2d3748" stroke-width="2.5" />
                </g>

                <rect class="component" x="190" y="200" width="60" height="20" />
                <path class="wire" d="M 180 235 L 255 185" marker-end="url(#arrow1)" />

                <circle class="dot" cx="70" cy="210" r="4" />
                <circle class="dot" cx="170" cy="210" r="4" />
                <path class="wire" d="M 70 210 L 70 270 L 170 270 L 170 210" />
                <circle class="meter" cx="120" cy="270" r="16" />
                <text class="text" x="120" y="272">V</text>
            </svg>
        </div>
        
        <div class="controls">
            <div class="control-group">
                <label><span>Component X</span></label>
                <select id="type-x1">
                    <option value="resistor">Fixed Resistor</option>
                    <option value="bulb">Filament Bulb</option>
                </select>
            </div>
            <div class="control-group">
                <label><span>Component Resistance</span> <span><span id="rx1-val">100</span> Ω</span></label>
                <input type="range" id="rx1" min="10" max="500" value="100" step="10">
            </div>
            <div class="control-group">
                <label><span>Variable Resistor</span> <span><span id="rvar-val">100</span> Ω</span></label>
                <input type="range" id="rvar" min="0" max="500" value="100" step="10">
            </div>
            <div class="control-group">
                <div class="min-r-row">
                    <label for="rmin" style="margin:0;">Minimum Resistance (Ω)</label>
                    <input type="number" id="rmin" min="0.5" max="2" step="0.1" value="1.0">
                </div>
                <div class="min-r-hint">A real rheostat can't reach 0 Ω. Choose a value between 0.5 Ω and 2 Ω.</div>
            </div>
        </div>

        <div class="readings">
            <div class="reading-box off" id="v1-box">
                <div class="reading-label">Voltmeter</div>
                <div class="reading-value" id="v1-read">0.00 V</div>
            </div>
            <div class="reading-box off" id="i1-box">
                <div class="reading-label">Ammeter</div>
                <div class="reading-value" id="i1-read">0.00 mA</div>
            </div>
        </div>
    </div>

    <div class="circuit-panel">
        <h2>Potentiometer Control</h2>
        <div class="svg-container">
            <svg viewBox="0 0 300 300" xmlns="http://www.w3.org/2000/svg">
                <defs>
                    <marker id="arrow2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
                        <path d="M 0 0 L 10 5 L 0 10 z" fill="#2d3748" />
                    </marker>
                </defs>

                <path class="wire" d="M 40 50 L 115 50" />
                <path class="wire" d="M 135 50 L 170 50" />
                <path class="wire" d="M 210 50 L 260 50" />
                <path class="wire" d="M 40 50 L 40 210" />
                <path class="wire" d="M 260 50 L 260 120" />
                <path class="wire" d="M 40 120 L 260 120" />
                <path class="wire" d="M 40 210 L 180 210" />

                <line class="wire" x1="120" y1="30" x2="120" y2="70" />
                <line class="wire" x1="130" y1="40" x2="130" y2="60" stroke-width="4" />

                <g id="switch2-group" class="switch-group">
                    <path id="switch2-wire" class="wire" d="M 170 50 L 200 35" /> <circle class="meter" cx="170" cy="50" r="3" />
                    <circle class="meter" cx="210" cy="50" r="3" />
                    <rect x="150" y="20" width="80" height="60" fill="transparent" />
                    <text class="text" x="190" y="25" font-size="10" fill="#718096">CLICK</text>
                </g>

                <rect class="component" x="60" y="110" width="180" height="20" />

                <circle class="dot" cx="40" cy="120" r="4" />

                <circle class="meter" cx="40" cy="165" r="16" />
                <text class="text" x="40" y="167">A</text>

                <g id="comp2-resistor">
                    <rect class="component" x="100" y="200" width="60" height="20" />
                    <text class="text" x="130" y="210">R</text>
                </g>
                <g id="comp2-bulb" style="display: none;">
                    <circle class="component" cx="130" cy="210" r="16" />
                    <circle id="bulb2-glow" cx="130" cy="210" r="16" fill="#fbbf24" opacity="0" />
                    <line x1="119" y1="199" x2="141" y2="221" stroke="#2d3748" stroke-width="2.5" />
                    <line x1="141" y1="199" x2="119" y2="221" stroke="#2d3748" stroke-width="2.5" />
                </g>

                <circle class="dot" cx="70" cy="210" r="4" />
                <path class="wire" d="M 70 210 L 70 270 L 180 270 L 180 210" />
                <circle class="meter" cx="125" cy="270" r="16" />
                <text class="text" x="125" y="272">V</text>

                <circle class="dot" cx="180" cy="210" r="4" />
                <path class="wire" id="wiper-wire" d="M 180 210 L 180 170 L 150 170 L 150 134" marker-end="url(#arrow2)" />
            </svg>
        </div>

        <div class="controls">
            <div class="control-group">
                <label><span>Component X</span></label>
                <select id="type-x2">
                    <option value="resistor">Fixed Resistor</option>
                    <option value="bulb">Filament Bulb</option>
                </select>
            </div>
            <div class="control-group">
                <label><span>Component Resistance</span> <span><span id="rx2-val">100</span> Ω</span></label>
                <input type="range" id="rx2" min="10" max="500" value="100" step="10">
            </div>
            <div class="control-group">
                <label><span>Wiper Position</span> <span><span id="k-val">50</span> %</span></label>
                <input type="range" id="k" min="0" max="1" value="0.5" step="0.01">
            </div>
        </div>

        <div class="readings">
            <div class="reading-box off" id="v2-box">
                <div class="reading-label">Voltmeter</div>
                <div class="reading-value" id="v2-read">0.00 V</div>
            </div>
            <div class="reading-box off" id="i2-box">
                <div class="reading-label">Ammeter</div>
                <div class="reading-value" id="i2-read">0.00 mA</div>
            </div>
        </div>
    </div>

</div>

<script>
    const vSupply = 10;
    const potTotal = 500; // Fixed 500 Ohm track for potential divider
    
    // Switch States (Start open)
    let s1Closed = false;
    let s2Closed = false;

    // Circuit 1 Elements
    const s1Group = document.getElementById('switch1-group');
    const s1Wire = document.getElementById('switch1-wire');
    const typeX1 = document.getElementById('type-x1');
    const comp1Resistor = document.getElementById('comp1-resistor');
    const comp1Bulb = document.getElementById('comp1-bulb');
    const bulb1Glow = document.getElementById('bulb1-glow');
    
    const rx1Input = document.getElementById('rx1');
    const rvarInput = document.getElementById('rvar');
    const rx1Val = document.getElementById('rx1-val');
    const rvarVal = document.getElementById('rvar-val');
    const v1Read = document.getElementById('v1-read');
    const i1Read = document.getElementById('i1-read');
    const v1Box = document.getElementById('v1-box');
    const i1Box = document.getElementById('i1-box');

    // Circuit 2 Elements
    const s2Group = document.getElementById('switch2-group');
    const s2Wire = document.getElementById('switch2-wire');
    const typeX2 = document.getElementById('type-x2');
    const comp2Resistor = document.getElementById('comp2-resistor');
    const comp2Bulb = document.getElementById('comp2-bulb');
    const bulb2Glow = document.getElementById('bulb2-glow');

    const rx2Input = document.getElementById('rx2');
    const kInput = document.getElementById('k');
    const rx2Val = document.getElementById('rx2-val');
    const kVal = document.getElementById('k-val');
    const v2Read = document.getElementById('v2-read');
    const i2Read = document.getElementById('i2-read');
    const v2Box = document.getElementById('v2-box');
    const i2Box = document.getElementById('i2-box');
    const wiperWire = document.getElementById('wiper-wire');

    // Toggle switch events
    s1Group.addEventListener('click', () => {
        s1Closed = !s1Closed;
        s1Wire.setAttribute('d', s1Closed ? 'M 170 50 L 210 50' : 'M 170 50 L 200 35');
        s1Closed ? v1Box.classList.remove('off') : v1Box.classList.add('off');
        s1Closed ? i1Box.classList.remove('off') : i1Box.classList.add('off');
        updateSimulations();
    });

    s2Group.addEventListener('click', () => {
        s2Closed = !s2Closed;
        s2Wire.setAttribute('d', s2Closed ? 'M 170 50 L 210 50' : 'M 170 50 L 200 35');
        s2Closed ? v2Box.classList.remove('off') : v2Box.classList.add('off');
        s2Closed ? i2Box.classList.remove('off') : i2Box.classList.add('off');
        updateSimulations();
    });

    // Toggle component visuals
    function updateComponentVisuals() {
        if (typeX1.value === 'resistor') {
            comp1Resistor.style.display = 'block';
            comp1Bulb.style.display = 'none';
        } else {
            comp1Resistor.style.display = 'none';
            comp1Bulb.style.display = 'block';
        }

        if (typeX2.value === 'resistor') {
            comp2Resistor.style.display = 'block';
            comp2Bulb.style.display = 'none';
        } else {
            comp2Resistor.style.display = 'none';
            comp2Bulb.style.display = 'block';
        }
    }

    typeX1.addEventListener('change', () => { updateComponentVisuals(); updateSimulations(); });
    typeX2.addEventListener('change', () => { updateComponentVisuals(); updateSimulations(); });

    function updateSimulations() {
        /* --- Circuit 1: Rheostat --- */
        const rx1 = parseFloat(rx1Input.value);
        const rMin = getMinResistance();
        // The rheostat can never go below its minimum resistance
        const rvar = Math.max(parseFloat(rvarInput.value), rMin);

        rx1Val.textContent = rx1;
        rvarVal.textContent = rvar < 10 ? rvar.toFixed(1) : rvar;
        
        let i1 = 0, v1 = 0;
        
        if (s1Closed) {
            i1 = vSupply / (rx1 + rvar);
            v1 = i1 * rx1;
        }
        
        v1Read.textContent = v1.toFixed(2) + ' V';
        i1Read.textContent = (i1 * 1000).toFixed(1) + ' mA';

        // Update bulb brightness based on voltage (Max possible voltage is vSupply)
        if (typeX1.value === 'bulb') {
            const brightness = Math.min(v1 / vSupply, 1);
            bulb1Glow.setAttribute('opacity', brightness);
        } else {
            bulb1Glow.setAttribute('opacity', 0);
        }

        /* --- Circuit 2: Potential Divider --- */
        const rx2 = parseFloat(rx2Input.value);
        const k = parseFloat(kInput.value);
        
        rx2Val.textContent = rx2;
        kVal.textContent = Math.round(k * 100);
        
        let v2 = 0, i2 = 0;

        if (s2Closed) {
            const rLower = k * potTotal;
            const rUpper = (1 - k) * potTotal;
            
            let rParallel = 0;
            if (rLower > 0) {
                rParallel = (rx2 * rLower) / (rx2 + rLower);
            }
            
            const rTotal2 = rUpper + rParallel;
            const iTotal2 = vSupply / rTotal2;
            v2 = iTotal2 * rParallel;
            i2 = rx2 > 0 ? v2 / rx2 : 0;
        }
        
        v2Read.textContent = v2.toFixed(2) + ' V';
        i2Read.textContent = (i2 * 1000).toFixed(1) + ' mA';

        // Update bulb brightness
        if (typeX2.value === 'bulb') {
            const brightness2 = Math.min(v2 / vSupply, 1);
            bulb2Glow.setAttribute('opacity', brightness2);
        } else {
            bulb2Glow.setAttribute('opacity', 0);
        }
        
        // Map Wiper mathematically to the SVG coordinates
        const wiperX = 60 + (k * 180);
        wiperWire.setAttribute('d', `M 180 210 L 180 170 L ${wiperX} 170 L ${wiperX} 134`);
    }

    // Minimum resistance of the rheostat (clamped to 0.5–2 Ω)
    const rminInput = document.getElementById('rmin');

    function getMinResistance() {
        const val = parseFloat(rminInput.value);
        if (isNaN(val)) return 1.0;
        return Math.min(Math.max(val, 0.5), 2);
    }

    rminInput.addEventListener('input', updateSimulations);
    rminInput.addEventListener('change', () => {
        rminInput.value = getMinResistance().toFixed(1);
        updateSimulations();
    });

    // Attach listeners to range inputs
    [rx1Input, rvarInput, rx2Input, kInput].forEach(el => {
        el.addEventListener('input', updateSimulations);
    });

    // Initialise visuals
    updateComponentVisuals();
    updateSimulations();
</script>
</body>
</html>
