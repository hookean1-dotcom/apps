<body style="margin:0;background:#edf2f7">
<div id="xl"></div>
<script>(function(){// Shared content for the Exponentials & Logarithms app and booklet.
// Inline markup: ^{..} superscript, _{..} subscript, *..* italic, **..** bold.
// Block types: p, h, eq, key, tip, we, table, ul, interactive, fig (booklet), quote
// Flags: app:false hides from app; book:false hides from booklet.

const L2 = Math.log10(2), L3 = Math.log10(3);

const chapters = [
// ───────────────────────────────────────── 0
{
  id: "welcome", num: 0, title: "Start here", short: "Start here",
  lede: "Two A-level Physics topics – capacitors and radioactivity – are built on the same piece of mathematics. This guide gives you that mathematics from scratch, with no A-level Maths assumed.",
  blocks: [
    {type:"p", text:"When a capacitor discharges, or a radioactive sample decays, the quantity does not fall at a steady rate. It falls *quickly* at first and then more and more slowly, never quite reaching zero. Curves like this are called **exponential**, and the tool that lets us take them apart is the **logarithm**."},
    {type:"interactive", id:"hero", title:"Same shape, different physics", intro:"Drag the slider. The charge left on a capacitor and the number of undecayed nuclei follow exactly the same curve – only the labels and the constants change.", book:false},
    {type:"fig", src:"hero.png", w:15, app:false},
    {type:"h", text:"By the end you will be able to"},
    {type:"ul", items:[
      "spot exponential change from a table of data using the **constant-ratio** test",
      "use the index laws and the number *e* confidently on your calculator",
      "explain what log_{10} and ln actually mean, and why log scales are used",
      "use the four **laws of logarithms** printed in your A-level Physics data booklet",
      "solve equations such as 3.0 = 12 e^{−*t*/4.7} for *t*",
      "use the equations for capacitor discharge and radioactive decay, including half-life and time constant",
      "turn curved data into a straight-line graph and read off physical constants from the gradient and intercept"
    ]},
    {type:"key", title:"The laws you are working towards", text:[
      "These appear (in this or a very similar form) in the data booklets for AQA, OCR, Edexcel and WJEC/Eduqas A-level Physics:",
      "=log(*AB*) = log *A* + log *B*",
      "=log(*A*/*B*) = log *A* − log *B*",
      "=log(*A*^{*n*}) = *n* log *A*",
      "=ln(e^{*kx*}) = *kx*",
      "Chapter 7 shows where each one comes from. You will not need any calculus."
    ]},
    {type:"h", text:"How to use this"},
    {type:"p", app:true, book:false, text:"Work through the chapters in order using the menu. Each has explanations, interactive models, worked examples and **Try it** questions that are checked as you go. A tick appears next to a chapter once you have answered its questions. Have a scientific calculator to hand – you will be told which keys to press."},
    {type:"p", app:false, text:"Work through the sections in order. Each has explanations, worked examples, an **Activity** and **Try it** questions with space for your working. Answers are at the back. You will need a scientific calculator, a ruler and a pencil. There is an interactive version of this booklet with simulations of every activity."}
  ],
  questions: []
},
// ───────────────────────────────────────── 1
{
  id: "ratio", num: 1, title: "Growing and shrinking by the same factor", short: "Constant ratio",
  lede: "Exponential change means multiplying by the same number again and again. Everything else in this guide follows from that one idea.",
  blocks: [
    {type:"p", text:"Imagine two ways a quantity could change each hour. In **linear** change you *add* the same amount every hour. In **exponential** change you *multiply* by the same factor every hour. That factor is called the **growth ratio** (or growth factor), *r*."},
    {type:"table", head:["Situation","What happens each step","Growth ratio r"], rows:[
      ["Increases by 20%","× 1.20","1.20"],
      ["Doubles","× 2","2"],
      ["Decreases by 30%","× 0.70","0.70"],
      ["Halves","× 0.5","0.5"]
    ]},
    {type:"p", text:"If *r* is bigger than 1 the quantity grows; if *r* is between 0 and 1 it decays. A 30% decrease is *not* × 0.30 – you keep 70%, so *r* = 0.70."},
    {type:"we", title:"Worked example 1.1 – a bacteria colony", q:"A colony of 500 bacteria grows by 20% each hour. How many are there after 3 hours, and after 10 hours?", steps:[
      ["Find the ratio","Growing by 20% means keeping 100% and adding 20%, so *r* = 1.20."],
      ["Write a 'storyline'","0 h: 500 → 1 h: 500 × 1.2 = 600 → 2 h: 500 × 1.2^{2} = 720 → 3 h: 500 × 1.2^{3} = 864"],
      ["Spot the pattern","After *n* hours the number is 500 × 1.2^{*n*}. The power is the number of steps."],
      ["Use it","After 10 h: 500 × 1.2^{10} = 3095.9…, so about 3100 bacteria."]
    ]},
    {type:"key", title:"The exponential rule", text:[
      "=*y* = *a* × *r*^{*n*}",
      "*a* is the starting value (at *n* = 0), *r* is the growth ratio and *n* is the number of steps. Because the number of steps sits in the **power** (the exponent), we call this *exponential*."
    ]},
    {type:"interactive", id:"ratio-builder", title:"Storyline builder", intro:"Choose a starting value and a ratio, then step forward. Compare the exponential column with a linear change that adds the same amount as the first step.",
     booklet:[
       {type:"p", text:"A quantity starts at 100. Complete the table to compare **adding 50** each step (linear) with **multiplying by 1.5** each step (exponential). Give values to 3 significant figures."},
       {type:"table", head:["Step n","Linear: add 50","Exponential: × 1.5"], rows:[["0","100","100"],["1","150","150"],["2","",""],["3","",""],["4","",""],["5","",""],["8","",""]], blank:true},
       {type:"p", text:"Which grows faster in the long run? Describe the difference between the two columns in one sentence."},
       {type:"lines", n:2}
     ]},
    {type:"h", text:"The constant-ratio test"},
    {type:"p", text:"How do you tell whether a set of measurements is exponential? Take readings at **equal time intervals** and divide each value by the one before. If the ratio is the same every time, the change is exponential. (For linear change it is the *differences* that stay constant.)"},
    {type:"we", title:"Worked example 1.2 – light through tinted sheets", q:"Each sheet of tinted plastic lets through 70% of the light that reaches it. Light of intensity 800 W m^{−2} hits a stack of 5 sheets. What intensity gets through?", steps:[
      ["Ratio","Each sheet keeps 70%, so *r* = 0.70."],
      ["Apply five times","800 × 0.70^{5} = 800 × 0.168 07 = 134 W m^{−2}"],
      ["Check the sense","Light is lost at each sheet, so the answer must be less than 800 – it is."]
    ]},
    {type:"we", title:"Worked example 1.3 – finding the ratio from two readings", q:"A count is 1500 on day 2 and 12 000 on day 5. Assuming exponential growth, find the ratio and predict the count on day 8.", steps:[
      ["Storyline from day 2","day 2: 1500 → day 3: 1500*r* → day 4: 1500*r*^{2} → day 5: 1500*r*^{3}"],
      ["Set equal to the data","1500*r*^{3} = 12 000, so *r*^{3} = 8"],
      ["Solve","*r* = ∛8 = 2 (use the x^{1/3} or ∛ key)"],
      ["Predict","Day 8 is three more steps after day 5: 12 000 × 2^{3} = 96 000"]
    ]}
  ],
  questions: [
    {id:"1.1", type:"num", q:"A population of 250 fruit flies grows by 30% each day. How many flies are there after 6 days?", ans:250*Math.pow(1.3,6), tol:0.01, unit:"flies", sol:"*r* = 1.30, so 250 × 1.30^{6} = 1206.7… ≈ 1210 flies."},
    {id:"1.2", type:"num", q:"Each metre of murky water absorbs 15% of the light that enters it. What percentage of the light is left after 4 m?", ans:100*Math.pow(0.85,4), tol:0.01, unit:"%", sol:"Each metre keeps 85%, so *r* = 0.85. 0.85^{4} = 0.522, i.e. 52.2% is left."},
    {id:"1.3", type:"num", q:"A reading is 2000 on day 1 and 4500 on day 3. Assuming exponential growth, what is the growth ratio *r*?", ans:1.5, tol:0.01, unit:"", sol:"2000*r*^{2} = 4500, so *r*^{2} = 2.25 and *r* = 1.5."},
    {id:"1.4", type:"num", q:"Using your answer to 1.3, predict the reading on day 6.", ans:2000*Math.pow(1.5,5), tol:0.01, unit:"", sol:"Day 6 is 5 steps after day 1: 2000 × 1.5^{5} = 15 187.5 ≈ 15 200."},
    {id:"1.5", type:"mc", q:"Readings taken every minute are 80, 60, 45, 33.75. Which statement is correct?", options:["The data are linear – the differences are constant","The data are exponential with r = 0.75","The data are exponential with r = 0.25","There is not enough data to decide"], correct:1, sol:"60/80 = 45/60 = 33.75/45 = 0.75. The ratio is constant, so it is exponential decay with *r* = 0.75. (The differences 20, 15, 11.25 are not constant.)"},
    {id:"1.6", type:"num", q:"A quantity halves every 3 hours. What fraction of it remains after 12 hours? Give a decimal.", ans:1/16, tol:0.01, unit:"", sol:"12 h is 4 halvings: 0.5^{4} = 1/16 = 0.0625."}
  ]
},
// ───────────────────────────────────────── 2
{
  id: "powers", num: 2, title: "Powers and the index laws", short: "Index laws",
  lede: "A quick refresher on powers. The laws of logarithms are just these laws seen from the other side, so it is worth getting them secure.",
  blocks: [
    {type:"p", text:"In 2^{5} the 2 is the **base** and the 5 is the **power** (also called the **index** or **exponent**). It means five 2s multiplied together: 2 × 2 × 2 × 2 × 2 = 32."},
    {type:"table", head:["Law","In symbols","Example"], rows:[
      ["Multiply → add the powers","*a*^{*m*} × *a*^{*n*} = *a*^{*m*+*n*}","10^{3} × 10^{4} = 10^{7}"],
      ["Divide → subtract the powers","*a*^{*m*} ÷ *a*^{*n*} = *a*^{*m*−*n*}","10^{8} ÷ 10^{2} = 10^{6}"],
      ["Power of a power → multiply","(*a*^{*m*})^{*n*} = *a*^{*mn*}","(2^{3})^{2} = 2^{6} = 64"],
      ["Power zero","*a*^{0} = 1","5^{0} = 1"],
      ["Negative power → reciprocal","*a*^{−*n*} = 1/*a*^{*n*}","2^{−3} = 1/8 = 0.125"],
      ["Fractional power → root","*a*^{1/*n*} = ^{*n*}√*a*","9^{1/2} = 3,  8^{1/3} = 2"]
    ]},
    {type:"p", text:"You already use these in physics every time you work in standard form: (3.0 × 10^{8}) × (2.0 × 10^{−3}) = 6.0 × 10^{5}, because 8 + (−3) = 5."},
    {type:"interactive", id:"power-explorer", title:"Power explorer", intro:"Slide the power – including negative and fractional values – and watch how 2^{x} and 10^{x} behave. Notice that every step of +1 in the power multiplies the answer by the base.",
     booklet:[
       {type:"p", text:"Use your calculator (the x^{■} or ^ key) to complete the table. Give answers to 3 significant figures where needed."},
       {type:"table", head:["x","−2","−1","−0.5","0","0.5","1","2","3"], rows:[["2^{x}","","","","","","","",""],["10^{x}","","","","","","","",""]], blank:true},
       {type:"p", text:"What happens to the value of 2^{x} each time *x* increases by 1? What happens to 10^{x}?"},
       {type:"lines", n:2}
     ]},
    {type:"tip", title:"Watch out", text:"2^{−3} is **not** negative. A negative power gives a small positive number: 2^{−3} = 0.125. In fact *a*^{*x*} is positive for every value of *x* – this is why an exponential decay never reaches zero."}
  ],
  questions: [

    {id:"2.2", type:"num", q:"10^{5} ÷ 10^{−2} = 10^{?}  Enter the power.", ans:7, tol:0.001, sol:"Subtract the powers: 5 − (−2) = 7."},
    {id:"2.3", type:"num", q:"Evaluate (2^{3})^{2}.", ans:64, tol:0.001, sol:"Multiply the powers: 2^{6} = 64."},
    {id:"2.4", type:"num", q:"Evaluate 2^{−3} as a decimal.", ans:0.125, tol:0.001, sol:"2^{−3} = 1/2^{3} = 1/8 = 0.125."},
    {id:"2.5", type:"num", q:"Evaluate 27^{1/3}.", ans:3, tol:0.001, sol:"27^{1/3} = ∛27 = 3, because 3 × 3 × 3 = 27."},

// ───────────────────────────────────────── 4
{
  id: "e", num: 4, title: "The number e", short: "The number e",
  lede: "One base turns up everywhere in physics: e = 2.718 28… It is the number that makes the maths of decay and growth as simple as possible.",
  blocks: [
    {type:"h", text:"Where does e come from?"},
    {type:"p", text:"Suppose £1 earns 100% interest a year. Paid once, you end with £2. But if the interest is split into two halves of 50% paid every six months, you get 1.5^{2} = £2.25. Split it into 12 monthly payments of 1/12 each and you get (1 + 1/12)^{12} = £2.61. The more often it is paid, the more you get – but the total does not grow without limit. It settles towards a particular number:"},
    {type:"eq", text:"(1 + 1/*n*)^{*n*} → 2.718 28… = e   as *n* gets very large"},
    {type:"interactive", id:"compound-e", title:"Hunting for e", intro:"Increase how many times the interest is paid. Watch the total close in on e.",
     booklet:[
       {type:"p", text:"Use your calculator to complete the table. Give answers to 5 significant figures."},
       {type:"table", head:["Payments per year, n","1","2","4","12","365","10 000","1 000 000"], rows:[["(1 + 1/n)^{n}","2","2.25","","","","",""]], blank:true},
       {type:"p", text:"Now press the e^{x} key (often SHIFT then ln) and enter 1. Compare with the last value in your table."},
       {type:"lines", n:1}
     ]},
    {type:"h", text:"Why physicists love e"},
    {type:"p", text:"For any exponential curve the gradient (rate of change) at a point is proportional to the height of the curve there. For *y* = 2^{*x*} the gradient is 0.693 × *y*; for *y* = 3^{*x*} it is 1.099 × *y*. For one special base the gradient is **exactly equal to the height**. That base is e."},
    {type:"interactive", id:"tangent-e", title:"Gradient equals height", intro:"Move along the curve. A tangent line shows the gradient at that point. Switch the base between 2, e and 3 and compare the gradient with the value of y.",
     booklet:[
       {type:"p", text:"The graph shows *y* = e^{*x*}. Draw tangents at *x* = 0, 1 and 2, measure their gradients and compare each with the value of *y* at that point."},
       {type:"fig", src:"ex_tangent.png", w:11},
       {type:"table", head:["x","0","1","2"], rows:[["y = e^{x} (calculator)","","",""],["Gradient of tangent (measured)","","",""]], blank:true}
     ]},
    {type:"p", text:"Capacitor discharge and radioactive decay both obey the rule *the rate of decrease is proportional to how much is left*. That is exactly the property of e, which is why both are written with e:"},
    {type:"eq", text:"*Q* = *Q*_{0} e^{−*t*/*RC*}        *N* = *N*_{0} e^{−λ*t*}"},
    {type:"h", text:"Decay with e: the time constant"},
    {type:"p", text:"A decay written as *y* = *y*_{0} e^{−*t*/τ} has a **time constant** τ. After one time constant, *t* = τ and *y* = *y*_{0} e^{−1} = 0.368*y*_{0}. So the quantity falls to about **37%** of its starting value in each time constant."},
    {type:"table", head:["Time","0","τ","2τ","3τ","5τ"], rows:[["Fraction left, e^{−t/τ}","1","0.368","0.135","0.050","0.007"]]},
    {type:"p", text:"After about 5 time constants the quantity has fallen below 1% of its starting value, which is why a capacitor is often treated as 'fully discharged' after 5*RC*."},
    {type:"tip", title:"Calculator", text:"e^{*x*} is usually SHIFT + ln. To find e^{−1.5}, press SHIFT, ln, (−), 1.5, = and you should get 0.2231. Use brackets for anything more complicated, such as e^{(−15/10.3)}."}
  ],
  questions: [
    {id:"4.1", type:"num", q:"Calculate e^{2}.", ans:Math.exp(2), tol:0.005, sol:"e^{2} = 7.389."},
    {id:"4.2", type:"num", q:"Calculate e^{−1.5}.", ans:Math.exp(-1.5), tol:0.005, sol:"e^{−1.5} = 0.2231."},
    {id:"4.3", type:"num", q:"*y* = 50 e^{−0.2*t*}. Find *y* when *t* = 5.", ans:50*Math.exp(-1), tol:0.005, sol:"−0.2 × 5 = −1, so *y* = 50 e^{−1} = 50 × 0.3679 = 18.4."},
    {id:"4.4", type:"num", q:"What percentage of a quantity remains after 3 time constants?", ans:100*Math.exp(-3), tol:0.01, unit:"%", sol:"e^{−3} = 0.0498, so 4.98% ≈ 5.0%."},
    {id:"4.5", type:"mc", q:"On the curve *y* = e^{*x*}, what is the gradient at the point where *y* = 20?", options:["1","2.718","20","e^{20}"], correct:2, sol:"For e^{*x*} the gradient at any point equals the value of *y* there, so the gradient is 20."}
  ]
},

// ───────────────────────────────────────── 7
{
  id: "laws", num: 7, title: "The laws of logarithms", short: "Laws of logs",
  lede: "These four results are the reason logs are so useful. They turn multiplying into adding, dividing into subtracting and powers into multiplying.",
  blocks: [
    {type:"p", text:"Every law of logs is an index law in disguise. Write *A* = 10^{*a*} and *B* = 10^{*b*}, so that log *A* = *a* and log *B* = *b*."},
    {type:"law", n:1, name:"Product law", text:"log(*AB*) = log *A* + log *B*", why:"*AB* = 10^{*a*} × 10^{*b*} = 10^{*a*+*b*}, so log(*AB*) = *a* + *b*.", ex:"log 6 = log 2 + log 3 = 0.301 + 0.477 = 0.778"},
    {type:"law", n:2, name:"Quotient law", text:"log(*A*/*B*) = log *A* − log *B*", why:"*A*/*B* = 10^{*a*} ÷ 10^{*b*} = 10^{*a*−*b*}, so log(*A*/*B*) = *a* − *b*.", ex:"log 5 = log(10/2) = 1 − 0.301 = 0.699"},
    {type:"law", n:3, name:"Power law", text:"log(*A*^{*n*}) = *n* log *A*", why:"*A*^{*n*} = (10^{*a*})^{*n*} = 10^{*na*}, so log(*A*^{*n*}) = *na*.", ex:"log 8 = log 2^{3} = 3 × 0.301 = 0.903"},
    {type:"law", n:4, name:"Log of an exponential", text:"ln(e^{*kx*}) = *kx*", why:"ln asks 'what power of e gives this?' – and the power is already written there: *kx*.", ex:"ln(e^{−λ*t*}) = −λ*t*"},
    {type:"p", text:"All four laws work for ln as well as log_{10} – the base does not matter, as long as you use the same base throughout. (The fourth law also works as log_{10}(10^{*kx*}) = *kx*.)"},
    {type:"interactive", id:"laws-tester", title:"Test the laws", intro:"Pick any positive numbers. Both sides of each law are calculated separately – they always agree.",
     booklet:[
       {type:"p", text:"Choose your own *A* = ____ and *B* = ____ (positive, not 1). Use your calculator to check each law numerically."},
       {type:"table", head:["Law","Left-hand side","Right-hand side"], rows:[["log(AB) = log A + log B","",""],["log(A/B) = log A − log B","",""],["log(A^{3}) = 3 log A","",""],["ln(e^{2A}) = 2A","",""]], blank:true}
     ]},
    {type:"h", text:"Multiplying by adding: the slide rule"},
    {type:"p", text:"Before calculators, engineers multiplied with a **slide rule**: two rulers marked with log scales. Sliding one along the other adds two lengths – and because log *A* + log *B* = log(*AB*), adding the lengths multiplies the numbers. The Apollo engineers used them."},
    {type:"interactive", id:"slide-rule", title:"A working slide rule", intro:"Drag the upper scale so its 1 sits above the first number on the lower scale. Read the answer on the lower scale below the second number.",
     booklet:[
       {type:"p", text:"Cut out the two scales along the dashed lines. Place the 1 on the top scale above 2 on the bottom scale. Below 3 on the top scale, read the answer on the bottom scale. Use it to work out 2 × 3, 1.5 × 4, 2.5 × 3.5 and check with a calculator."},

       {type:"p", text:"Explain, using the product law, why the slide rule works."},
       {type:"lines", n:3}
     ]},
    {type:"tip", title:"Common mistakes", text:"log(*A* + *B*) is **not** log *A* + log *B* – there is no law for the log of a sum. (log *A*)/(log *B*) is **not** log(*A*/*B*). (log *A*)^{2} is **not** 2 log *A* – the power must be *inside* the bracket. Check with numbers if you are unsure."},
    {type:"we", title:"Worked example 7.1 – the law physicists use most", q:"Take natural logs of *N* = *N*_{0} e^{−λ*t*} and simplify.", steps:[

      ["Divide","*x* = log 50 / log 2 = 1.699 / 0.301 = 5.64"],
      ["Check","2^{5.64} = 49.9 ✓ (and 2^{5} = 32, 2^{6} = 64, so between 5 and 6 makes sense)"]

    {type:"we", title:"Worked example 8.2 – a discharging capacitor", q:"The p.d. across a capacitor is *V* = 12 e^{−*t*/4.7}, with *t* in seconds. Find when *V* = 3.0 V.", steps:[

<script>(function(){

var C={teal:"#0a7c78",vio:"#5a3fd0",pink:"#c72c62",amb:"#b36b00",ink:"#0f1c2e",mut:"#4d5b73",grid:"#e3e9f1",axis:"#7b8aa3"};

/* ---------- storage ---------- */

/* ---------- markup ---------- */
function esc(c){return c==="&"?"&amp;":c==="<"?"&lt;":c===">"?"&gt;":c;}
function brace(s,i){var d=1;for(var j=i;j<s.length;j++){if(s[j]==="{")d++;else if(s[j]==="}"){d--;if(!d)return j;}}return s.length;}
function md(s){
  var o="",i=0;
  while(i<s.length){
    if(s.substr(i,2)==="**"){var j=s.indexOf("**",i+2);if(j<0)j=s.length;o+="<b>"+md(s.slice(i+2,j))+"</b>";i=j+2;continue;}
    if(s[i]==="*"){var k=s.indexOf("*",i+1);if(k<0)k=s.length;o+='<span class="v">'+md(s.slice(i+1,k))+"</span>";i=k+1;continue;}
    if((s[i]==="^"||s[i]==="_")&&s[i+1]==="{"){var e=brace(s,i+2);var t=s[i]==="^"?"sup":"sub";o+="<"+t+">"+md(s.slice(i+2,e))+"</"+t+">";i=e+1;continue;}

}
function el(tag,cls,html){var e=document.createElement(tag);if(cls)e.className=cls;if(html!=null)e.innerHTML=html;return e;}

/* ---------- number formatting ---------- */
function sf(x,n){

  var d=n-1-Math.floor(Math.log10(a));d=Math.max(0,Math.min(10,d));
  return fixThousands(x.toFixed(d));
}
function fixThousands(s){var p=s.split(".");var neg=p[0][0]==="-";var int=neg?p[0].slice(1):p[0];if(int.length>4)int=int.replace(/\B(?=(\d{3})+(?!\d))/g," ");return (neg?"−":"")+int+(p[1]?"."+p[1]:"");}
function supnum(n){var m={"-":"⁻","0":"⁰","1":"¹","2":"²","3":"³","4":"⁴","5":"⁵","6":"⁶","7":"⁷","8":"⁸","9":"⁹"};return String(n).split("").map(function(c){return m[c];}).join("");}

/* ---------- canvas helpers ---------- */
function canvasBox(parent,aspect,minH,maxH,draw){
  var w=el("div","cvw");var cv=document.createElement("canvas");w.appendChild(cv);parent.appendChild(w);
  var obj={cv:cv,wrap:w,w:0,h:0,ctx:cv.getContext("2d"),draw:draw};
  function size(){var W=w.clientWidth||600;var H=Math.max(minH,Math.min(maxH,W*aspect));w.style.height=H+"px";var dpr=window.devicePixelRatio||1;cv.width=Math.round(W*dpr);cv.height=Math.round(H*dpr);obj.ctx.setTransform(dpr,0,0,dpr,0,0);obj.w=W;obj.h=H;if(obj.draw)obj.draw(obj);}
  obj.redraw=function(){if(obj.w)obj.draw(obj);};
  if(window.ResizeObserver){var lastW=-1;new ResizeObserver(function(){var W=w.clientWidth;if(W!==lastW&&W>0){lastW=W;size();}}).observe(w);}else{window.addEventListener("resize",size);}
  setTimeout(size,0);

}
function niceStep(range,target){var raw=range/target;var p=Math.pow(10,Math.floor(Math.log10(raw)));var m=raw/p;var s=m<1.5?1:m<3?2:m<7?5:10;return s*p;}
function tickLbl(v,step){var d=0;while(d<8&&Math.abs(step*Math.pow(10,d)-Math.round(step*Math.pow(10,d)))>1e-6)d++;if(Math.abs(v)<step/1e6)v=0;return fx(v,d);}
// axes: returns mapper
function axes(o,ax){
  var ctx=o.ctx,W=o.w,H=o.h;
  var L=ax.left||58,R=ax.right||16,T=ax.top||16,B=ax.bottom||44;
  ctx.clearRect(0,0,W,H);
  var X=function(x){return L+(x-ax.x0)/(ax.x1-ax.x0)*(W-L-R);},Y=function(y){return H-B-(y-ax.y0)/(ax.y1-ax.y0)*(H-T-B);};
  var xs=ax.xstep||niceStep(ax.x1-ax.x0,Math.max(3,Math.round((W-L-R)/80))),ys=ax.ystep||niceStep(ax.y1-ax.y0,Math.max(3,Math.round((H-T-B)/50)));
  ctx.lineWidth=1;ctx.strokeStyle=C.grid;ctx.font="12px "+MONO;ctx.fillStyle=C.mut;
  ctx.textAlign="center";ctx.textBaseline="top";
  for(var x=Math.ceil(ax.x0/xs)*xs;x<=ax.x1+xs*1e-6;x+=xs){var px=X(x);ctx.beginPath();ctx.moveTo(px,T);ctx.lineTo(px,H-B);ctx.stroke();ctx.fillText(ax.xfmt?ax.xfmt(x):tickLbl(x,xs),px,H-B+6);}
  ctx.textAlign="right";ctx.textBaseline="middle";
  for(var y=Math.ceil(ax.y0/ys)*ys;y<=ax.y1+ys*1e-6;y+=ys){var py=Y(y);ctx.beginPath();ctx.moveTo(L,py);ctx.lineTo(W-R,py);ctx.stroke();ctx.fillText(ax.yfmt?ax.yfmt(y):tickLbl(y,ys),L-6,py);}
  ctx.strokeStyle=C.axis;ctx.lineWidth=1.4;
  var zx=(ax.x0<=0&&ax.x1>=0)?X(0):L, zy=(ax.y0<=0&&ax.y1>=0)?Y(0):H-B;
  ctx.beginPath();ctx.moveTo(L,zy);ctx.lineTo(W-R,zy);ctx.moveTo(zx,T);ctx.lineTo(zx,H-B);ctx.stroke();
  ctx.fillStyle=C.ink;ctx.font="italic 14px "+SERIF;
  if(ax.xl){ctx.textAlign="right";ctx.textBaseline="bottom";ctx.fillText(ax.xl,W-R,H-6);}
  if(ax.yl){ctx.save();ctx.translate(14,T);ctx.rotate(-Math.PI/2);ctx.textAlign="right";ctx.textBaseline="middle";ctx.fillText(ax.yl,0,0);ctx.restore();}

}
function clipTo(m){var c=m.ctx;c.save();c.beginPath();c.rect(m.L,m.T,m.R-m.L,m.B-m.T);c.clip();}
function curve(m,f,x0,x1,col,lw,dash){var c=m.ctx;clipTo(m);c.strokeStyle=col;c.lineWidth=lw||2.5;c.setLineDash(dash||[]);c.beginPath();var n=300,first=true;for(var i=0;i<=n;i++){var x=x0+(x1-x0)*i/n,y=f(x);if(!isFinite(y)){first=true;continue;}var py=m.Y(y);if(py<-5000||py>5000){first=true;continue;}if(first){c.moveTo(m.X(x),py);first=false;}else c.lineTo(m.X(x),py);}c.stroke();c.setLineDash([]);c.restore();}
function dot(m,x,y,col,r,ring){var c=m.ctx;c.beginPath();c.arc(m.X(x),m.Y(y),r||5,0,7);c.fillStyle=col;c.fill();if(ring){c.lineWidth=2;c.strokeStyle="#fff";c.stroke();}}
function lbl(m,txt,px,py,col,align,font){var c=m.ctx;c.fillStyle=col||C.ink;c.font=font||"13px "+SANS;c.textAlign=align||"left";c.textBaseline="middle";c.fillText(txt,px,py);}
function pill(ctx,txt,px,py,col){ctx.font="600 12.5px "+MONO;var w=ctx.measureText(txt).width+12;ctx.fillStyle="#fff";ctx.strokeStyle=col;ctx.lineWidth=1.2;ctx.beginPath();if(ctx.roundRect)ctx.roundRect(px,py-11,w,22,6);else ctx.rect(px,py-11,w,22);ctx.fill();ctx.stroke();ctx.fillStyle=col;ctx.textAlign="left";ctx.textBaseline="middle";ctx.fillText(txt,px+6,py);}
function linfit(pts){var n=pts.length,sx=0,sy=0,sxx=0,sxy=0,syy=0;pts.forEach(function(p){sx+=p[0];sy+=p[1];sxx+=p[0]*p[0];sxy+=p[0]*p[1];syy+=p[1]*p[1];});var m=(n*sxy-sx*sy)/(n*sxx-sx*sx);var c=(sy-m*sx)/n;var r=(n*sxy-sx*sy)/Math.sqrt((n*sxx-sx*sx)*(n*syy-sy*sy));return {m:m,c:c,r2:r*r};}

/* ---------- control helpers ---------- */
function slider(parent,label,min,max,step,val,fmt,on){
  var d=el("div","ctl");var l=el("label",null,"<span>"+label+"</span>");var o=document.createElement("output");l.appendChild(o);var r=document.createElement("input");r.type="range";r.min=min;r.max=max;r.step=step;r.value=val;r.setAttribute("aria-label",label.replace(/<[^>]+>/g,""));d.appendChild(l);d.appendChild(r);parent.appendChild(d);

function ro(parent,label,cls){var d=el("div","ro "+(cls||""),label+"<b>—</b>");parent.appendChild(d);var b=d.querySelector("b");return function(v){b.innerHTML=v;};}

/* ======================================================= INTERACTIVES */
var IA={};

IA.hero=function(box){
  var g=el("div","hero");box.appendChild(g);
  var left=el("div");g.appendChild(left);var right=el("div");g.appendChild(right);
  var t=0.0;
  var order=[];for(var i=0;i<100;i++)order.push(i);
  var seed=7;function rnd(){seed=(seed*16807)%2147483647;return seed/2147483647;}
  for(var j=99;j>0;j--){var k=Math.floor(rnd()*(j+1));var tmp=order[j];order[j]=order[k];order[k]=tmp;}
  var rank=[];order.forEach(function(v,i){rank[v]=i;});
  var cvA=canvasBox(left,0.56,240,380,function(o){
    var m=axes(o,{x0:0,x1:5,y0:0,y1:1.05,xstep:1,ystep:0.25,xl:"time / time constants",yl:"fraction left"});
    curve(m,function(x){return Math.exp(-x);},0,5,C.teal,3);
    var y=Math.exp(-t);var c=m.ctx;c.setLineDash([4,4]);c.strokeStyle=C.mut;c.lineWidth=1;c.beginPath();c.moveTo(m.X(t),m.Y(0));c.lineTo(m.X(t),m.Y(y));c.lineTo(m.X(0),m.Y(y));c.stroke();c.setLineDash([]);
    dot(m,t,y,C.pink,7,true);
    pill(c,(y*100).toFixed(1)+"% left",Math.min(m.X(t)+12,o.w-120),Math.max(m.T+14,m.Y(y)-18),C.pink);
  });
  var cvB=canvasBox(right,1.0,240,380,function(o){
    var c=o.ctx,W=o.w,H=o.h;c.clearRect(0,0,W,H);
    var frac=Math.exp(-t);
    // capacitor
    var cx=W*0.5,top=18,ph=H*0.36;
    c.font="600 13px "+SANS;c.fillStyle=C.mut;c.textAlign="center";c.fillText("Capacitor: charge left",cx,top+4);
    var pw=W*0.5,gap=26,py=top+22;
    c.fillStyle="#3a4a63";c.fillRect(cx-pw/2,py,pw,6);c.fillRect(cx-pw/2,py+gap+8,pw,6);
    var nq=Math.round(frac*12);
    for(var i=0;i<12;i++){var x=cx-pw/2+pw*(i+0.5)/12;c.globalAlpha=i<nq?1:0.13;c.fillStyle=C.pink;c.font="700 15px "+MONO;c.fillText("+",x,py-6);c.fillStyle=C.vio;c.fillText("−",x,py+gap+30);}
    c.globalAlpha=1;
    // nuclei
    var gy=py+gap+52;c.font="600 13px "+SANS;c.fillStyle=C.mut;c.fillText("Nuclei: undecayed",cx,gy);
    var size=Math.min((W-40)/10,(H-gy-14)/10);var gx0=cx-size*5;var decayed=Math.round((1-frac)*100);
    for(var n=0;n<100;n++){var r=Math.floor(n/10),q=n%10;c.fillStyle=rank[n]<decayed?"#e6ebf2":C.teal;c.fillRect(gx0+q*size+1.5,gy+12+r*size+1.5,size-3,size-3);}
  });
  var ctr=el("div","ctrls");box.appendChild(ctr);
  slider(ctr,"Time elapsed (in time constants)",0,5,0.01,0,function(v){return v.toFixed(2);},function(v){t=v;cvA.redraw();cvB.redraw();});
};

IA["ratio-builder"]=function(box){
  var ctr=el("div","ctrls");box.appendChild(ctr);
  var a=100,r=1.5,n=8;
  var A=slider(ctr,"Starting value <span class='v'>a</span>",10,500,10,a,null,function(v){a=v;upd();});
  var R=slider(ctr,"Growth ratio <span class='v'>r</span>",0.5,2,0.05,r,function(v){return v.toFixed(2);},function(v){r=v;upd();});
  var N=slider(ctr,"Number of steps",2,15,1,n,null,function(v){n=v;upd();});
  var msg=el("div","msg");box.appendChild(msg);
  var g=el("div","row2");box.appendChild(g);
  var tw=el("div","tbw");g.appendChild(tw);var gw=el("div");g.appendChild(gw);
  var cv=canvasBox(gw,0.8,260,380,function(o){
    var vals=[],lin=[],d=a*(r-1);for(var i=0;i<=n;i++){vals.push(a*Math.pow(r,i));lin.push(Math.max(0,a+d*i));}
    var ymax=Math.max.apply(null,vals.concat(lin))*1.08;

    for(var i=0;i<=n;i++){c.fillStyle=C.teal;c.globalAlpha=.85;c.fillRect(m.X(i)-bw/2,m.Y(vals[i]),bw,m.Y(0)-m.Y(vals[i]));}
    c.globalAlpha=1;c.strokeStyle=C.vio;c.lineWidth=2.5;c.beginPath();for(i=0;i<=n;i++){if(i)c.lineTo(m.X(i),m.Y(lin[i]));else c.moveTo(m.X(i),m.Y(lin[i]));}c.stroke();
    for(i=0;i<=n;i++)dot(m,i,lin[i],C.vio,3.5);
    lbl(m,"■ × r each step (exponential)",m.L+10,m.T+10,C.teal,"left","600 12.5px "+SANS);
    lbl(m,"● + same amount (linear)",m.L+10,m.T+28,C.vio,"left","600 12.5px "+SANS);
  });
  function upd(){
    var d=a*(r-1);var h='<table class="tb"><tr><th>n</th><th>Linear (+'+sf(d,3)+')</th><th>a × r<sup>n</sup></th><th>ratio</th></tr>';
    for(var i=0;i<=n;i++){var v=a*Math.pow(r,i);h+="<tr><td class='mono'>"+i+"</td><td class='mono'>"+sf(Math.max(0,a+d*i),3)+"</td><td class='mono'><b>"+sf(v,4)+"</b></td><td class='mono' style='color:#0a7c78'>"+(i?"× "+r.toFixed(2):"")+"</td></tr>";}
    tw.innerHTML=h+"</table>";
    if(r===1)msg.innerHTML="r = 1: nothing changes.";
    else msg.innerHTML=r>1?"Growth: after "+n+" steps the exponential is "+sf(a*Math.pow(r,n),3)+", the linear one only "+sf(a+d*n,3)+". Multiplying always wins in the end.":"Decay: each step keeps "+Math.round(r*100)+"% of what was there. The exponential never reaches zero; the linear version would hit zero at step "+(Math.ceil(-a/d))+".";
    cv.redraw();
  }
  upd();
};

IA["power-explorer"]=function(box){
  var ctr=el("div","ctrls");box.appendChild(ctr);var b=2,x=1;
  var sd=el("div","ctl");sd.innerHTML="<label><span>Base</span></label>";ctr.appendChild(sd);
  seg(sd,[[2,"2"],[3,"3"],[10,"10"],[0.5,"0.5"]],2,function(v){b=v;upd();});
  slider(ctr,"Power <span class='v'>x</span>",-3,3,0.5,x,function(v){return fx(v,1);},function(v){x=v;upd();});
  var out=el("div","readout");box.appendChild(out);
  var r1=ro(out,"Value","hl"),r2=ro(out,"Meaning"),r3=ro(out,"Next power up");
  var cv=canvasBox(box,0.5,240,360,function(o){
    var ymax=Math.max(Math.pow(b,3),Math.pow(b,-3))*1.05;
    var m=axes(o,{x0:-3.2,x1:3.2,y0:0,y1:ymax,xstep:1,xl:"x",yl:"y = "+b+"^x"});
    curve(m,function(t){return Math.pow(b,t);},-3.2,3.2,C.teal,3);
    for(var i=-3;i<=3;i++)dot(m,i,Math.pow(b,i),"#9bc9c6",3.5);
    dot(m,x,Math.pow(b,x),C.pink,7,true);
    pill(m.ctx,b+"^"+fx(x,1)+" = "+sf(Math.pow(b,x),4),Math.min(m.X(x)+12,o.w-150),Math.max(m.Y(Math.pow(b,x))-18,m.T+12),C.pink);
  });
  function meaning(){

    if(x%1!==0){return "√("+bs+"^"+(x*2)+") = √"+sf(Math.pow(b,2*x),4);}
    return Array(x+1).join(bs+" × ").slice(0,-3);
  }
  function upd(){r1(b+"<sup>"+fx(x,1)+"</sup> = "+sf(Math.pow(b,x),4));r2("<span style='font-size:15px'>"+meaning()+"</span>");r3(b+"<sup>"+fx(x+1,1)+"</sup> = "+sf(Math.pow(b,x),4)+" × "+b);cv.redraw();}
  upd();
};

IA["graph-explorer"]=function(box){
  var ctr=el("div","ctrls");box.appendChild(ctr);var A=2,b=1.6;
  slider(ctr,"<span class='v'>A</span> (y-intercept)",0.5,10,0.5,A,function(v){return v.toFixed(1);},function(v){A=v;upd();});
  slider(ctr,"<span class='v'>b</span> (factor per unit x)",0.2,3,0.05,b,function(v){return v.toFixed(2);},function(v){b=v;upd();});
  var out=el("div","readout");box.appendChild(out);
  var r0=ro(out,"Equation","hl"),r1=ro(out,"Type"),r2=ro(out,"y at x = 0, 1, 2, 3");
  var cv=canvasBox(box,0.52,260,400,function(o){
    var ys=[];for(var i=-1;i<=5;i++)ys.push(A*Math.pow(b,i));
    var ymax=Math.min(Math.max.apply(null,ys),A*40)*1.1;
    var m=axes(o,{x0:-1,x1:5.2,y0:0,y1:ymax,xstep:1,xl:"x",yl:"y"});
    var c=m.ctx;c.strokeStyle=C.pink;c.setLineDash([6,5]);c.lineWidth=1.6;c.beginPath();c.moveTo(m.L,m.Y(0)-1);c.lineTo(m.R,m.Y(0)-1);c.stroke();c.setLineDash([]);

    var m=axes(o,{x0:x0,x1:xb+px,y0:y0,y1:yb+py,xl:lx,yl:ly,left:50});

    P.forEach(function(p){dot(m,p[0],p[1],C.teal,5,true);});});
  function upd(){var d=sets[si],P=pts();
    var h="<table class='tb'><tr><th>"+d.xl+"</th><th>"+d.yl+"</th>"+(mode==="ln"?"<th>ln y</th>":mode==="ll"?"<th>log x</th><th>log y</th>":"")+"</tr>";
    d.x.forEach(function(x,i){h+="<tr><td class='mono'>"+x+"</td><td class='mono'>"+d.y[i]+"</td>"+(mode==="ln"?"<td class='mono'>"+fx(P[i][1],3)+"</td>":mode==="ll"?"<td class='mono'>"+fx(P[i][0],3)+"</td><td class='mono'>"+fx(P[i][1],3)+"</td>":"")+"</tr>";});
    tw.innerHTML=h+"</table>";
    var f=linfit(P),straight=f.r2>0.9995;
    if(mode==="raw"){msg.className="msg";msg.innerHTML="The raw data are curved, so the gradient keeps changing. Try one of the log plots.";}
    else if(straight){var right=(mode==="ln"&&d.kind==="exp")||(mode==="ll"&&d.kind==="pow");msg.className="msg good";msg.innerHTML="<b>Straight line!</b> Gradient = "+fx(f.m,4)+", intercept c = "+fx(f.c,4)+". So this is "+(mode==="ln"?"<b>exponential</b>: ":"a <b>power law</b>: ")+(mode==="ln"?d.phys(f.m,Math.exp(f.c)):d.phys(f.m,Math.pow(10,f.c)));}
    else{msg.className="msg bad";msg.innerHTML="Still curved (the dashed best-fit line does not follow the points). This is not the right plot for these data – try the other one.";}
    cv.redraw();}
  upd();
};

IA["summary-card"]=function(box){
  var g=el("div","sumgrid");box.appendChild(g);
  SUM.forEach(function(s){var b=el("div","sumbox","<h5>"+md(s.h)+"</h5><ul>"+s.items.map(function(i){return "<li>"+md(i)+"</li>";}).join("")+"</ul>");g.appendChild(b);});
};

/* ======================================================= RENDERING */
function parseNum(s){s=String(s).trim().replace(/−/g,"-").replace(/\s/g,"").replace(/[×x]10\^?/i,"e").replace(/,/g,"");if(s==="")return NaN;return Number(s);}
function renderBlock(b,host){
  if(b.app===false)return;
  var t=b.type;
  if(t==="p")host.appendChild(el("p",null,md(b.text)));
  else if(t==="h")host.appendChild(el("h3",null,md(b.text)));
  else if(t==="eq")host.appendChild(el("div","eq",md(b.text)));
  else if(t==="ul"){var u=el("ul","list");b.items.forEach(function(i){u.appendChild(el("li",null,md(i)));});host.appendChild(u);}
  else if(t==="table"){var w=el("div","tbw");var h="<table class='tb'><tr>"+b.head.map(function(x){return "<th>"+md(x)+"</th>";}).join("")+"</tr>";b.rows.forEach(function(r){h+="<tr>"+r.map(function(x){return "<td>"+md(x)+"</td>";}).join("")+"</tr>";});w.innerHTML=h+"</table>";host.appendChild(w);}
  else if(t==="key"||t==="tip"){var c=el("div","card "+t);c.appendChild(el("div","t",md(b.title)));(Array.isArray(b.text)?b.text:[b.text]).forEach(function(x){if(x[0]==="=")c.appendChild(el("div","eq",md(x.slice(1))));else c.appendChild(el("p",null,md(x)));});host.appendChild(c);}
  else if(t==="law"){var c2=el("div","card law");c2.innerHTML="<div class='badge'>"+b.n+"</div><div><div class='t'>"+md(b.name)+"</div><div class='eq'>"+md(b.text)+"</div><div class='why'><b>Why it works:</b> "+md(b.why)+"</div><div class='ex'><b>Example:</b> "+md(b.ex)+"</div></div>";host.appendChild(c2);}
  else if(t==="we"){var c3=el("div","card we");c3.appendChild(el("div","t",md(b.title)));c3.appendChild(el("div","wq",md(b.q)));var st=el("div","steps");c3.appendChild(st);var rows=[];b.steps.forEach(function(s,i){var r=el("div","step hide","<b>"+md(s[0])+"</b><div>"+md(s[1])+"</div>");st.appendChild(r);rows.push(r);});
    var bb=el("div","ctrls");bb.style.marginTop="10px";c3.appendChild(bb);var shown=0;var nb=btn(bb,"Next step →","sm",function(){if(shown<rows.length){var r=rows[shown++];r.classList.remove("hide");requestAnimationFrame(function(){r.classList.add("show");});}if(shown>=rows.length){nb.setAttribute("disabled","");}});
    btn(bb,"Show all","alt sm",function(){rows.forEach(function(r){r.classList.remove("hide");r.classList.add("show");});shown=rows.length;nb.setAttribute("disabled","");});
    var cov=el("span",null,"");cov.style.cssText="font-size:13.5px;color:#4d5b73";cov.textContent="Try it yourself first, then reveal one step at a time.";bb.appendChild(cov);host.appendChild(c3);}
  else if(t==="interactive"){var c4=el("div","card ia");c4.innerHTML="<div class='hd'><span class='tag'>Interactive</span><h4>"+md(b.title)+"</h4></div><div class='intro'>"+md(b.intro)+"</div>";host.appendChild(c4);if(IA[b.id])IA[b.id](c4);}
}
function qKey(ch,q){return ch.id+":"+q.id;}
function renderQuestions(ch,host){
  if(!ch.questions.length)return;
  var sec=el("div","qsec");var h=el("h2",null,(ch.id==="final"?"Twelve questions":"Try it")+" <span class='sc'></span>");sec.appendChild(h);
  sec.appendChild(el("p",null,ch.id==="final"?"Answers are checked to about 1%. Give numbers in decimal form; for standard form you can type e.g. 3.2e-4.":"Use your calculator. Answers are checked to within about 1% – so 3 significant figures is plenty."));
  var sc=h.querySelector(".sc");
  function score(){var n=ch.questions.filter(function(q){return store[qKey(ch,q)];}).length;sc.textContent=n+" / "+ch.questions.length;if(ch.id==="final")finalScore(n);refreshNav();}
  ch.questions.forEach(function(q){
    var d=el("div","q"+(store[qKey(ch,q)]?" ok":""));d.appendChild(el("div","id",q.id));var body=el("div");d.appendChild(body);
    body.appendChild(el("div",null,md(q.q)));
    var fb=el("div","fb");var sol=el("div","sol","<b>Solution.</b> "+md(q.sol));
    function mark(ok){if(ok){store[qKey(ch,q)]=1;save();d.classList.add("ok");}score();}
    if(q.type==="num"){var a=el("div","ans");var i=document.createElement("input");i.className="num";i.placeholder="answer";i.setAttribute("aria-label","Answer to "+q.id);a.appendChild(i);if(q.unit)a.appendChild(el("span","unit",q.unit));
      var chk=function(){var v=parseNum(i.value);if(!isFinite(v)){fb.className="fb bad";fb.textContent="Enter a number.";return;}var tol=q.tol||0.01;var ok=Math.abs(q.ans)<1e-9?Math.abs(v)<0.001:Math.abs(v-q.ans)<=tol*Math.abs(q.ans)+1e-12;
        fb.className="fb "+(ok?"good":"bad");fb.innerHTML=ok?"✓ Correct.":"✗ Not quite – check your working, then try again or see the solution.";mark(ok);if(ok)sol.classList.add("show");};
      btn(a,"Check","teal sm",chk);i.addEventListener("keydown",function(e){if(e.key==="Enter")chk();});var sl=el("button","link","Show solution");sl.type="button";sl.onclick=function(){sol.classList.toggle("show");};a.appendChild(sl);body.appendChild(a);}
    else{var o=el("div","opts");q.options.forEach(function(op,k){var b=el("button","opt",String.fromCharCode(65+k)+".  "+md(op));b.type="button";b.onclick=function(){var ok=k===q.correct;b.classList.add(ok?"right":"wrong");fb.className="fb "+(ok?"good":"bad");fb.innerHTML=ok?"✓ Correct.":"✗ Not that one – try again.";if(ok)sol.classList.add("show");mark(ok);};o.appendChild(b);});body.appendChild(o);}
    body.appendChild(fb);body.appendChild(sol);sec.appendChild(d);
  });
  host.appendChild(sec);setTimeout(score,0);
}
var finalBox=null;
function finalScore(n){if(!finalBox)return;var msg=n===12?"Perfect. You are ready for capacitors and radioactivity.":n>=10?"Excellent – review the solutions to any you missed.":n>=6?"Good progress. Revisit the chapters for the questions you found hard.":"Keep going – each chapter's Try it questions build up to these.";finalBox.innerHTML="<div class='score'>"+n+" / 12</div><div>"+msg+"</div>";}
var main,navUl,progI,progT,curIdx=0;
function chapterDone(ch){return ch.questions.length?ch.questions.every(function(q){return store[qKey(ch,q)];}):!!store["seen:"+ch.id];}
function refreshNav(){var tot=0,done=0;CH.forEach(function(ch,i){var li=navUl.children[i];var d=chapterDone(ch);li.querySelector("button").classList.toggle("done",d);li.querySelector(".n").textContent=d?"✓":ch.num;ch.questions.forEach(function(q){tot++;if(store[qKey(ch,q)])done++;});});progI.style.width=(tot?done/tot*100:0)+"%";progT.textContent=done+" of "+tot+" questions answered";}
function show(i,fromHash){
  curIdx=i;var ch=CH[i];store["seen:"+ch.id]=1;save();
  main.innerHTML="";var w=el("div","wrap");main.appendChild(w);
  w.appendChild(el("div","kicker",ch.num===0?"Exponentials & logarithms for physics":"Chapter "+ch.num));
  w.appendChild(el("h1",null,md(ch.title)));w.appendChild(el("p","lede",md(ch.lede)));
  ch.blocks.forEach(function(b){renderBlock(b,w);});
  if(ch.id==="final"){finalBox=el("div","card key");w.insertBefore(finalBox,w.children[3]);finalScore(0);}else finalBox=null;
  renderQuestions(ch,w);
  if(ch.id==="final"){var rs=el("div","ctrls");rs.style.marginTop="16px";btn(rs,"Clear all my answers","alt sm",function(){store={};save();show(curIdx);});w.appendChild(rs);}
  var pg=el("div","pager");w.appendChild(pg);
  if(i>0)btn(pg,"← "+CH[i-1].short,"alt",function(){go(i-1);});else pg.appendChild(el("span"));
  if(i<CH.length-1)btn(pg,(i===0?"Begin: ":"Next: ")+CH[i+1].short+" →","teal",function(){go(i+1);});
  Array.prototype.forEach.call(navUl.children,function(li,k){li.querySelector("button").classList.toggle("on",k===i);});
  refreshNav();
  try{var li=navUl.children[i];if(navUl.scrollWidth>navUl.clientWidth+4)navUl.scrollLeft=li.offsetLeft-navUl.offsetLeft-16;}catch(e){}
  if(!fromHash){try{if(location.hash!=="#"+ch.id)history.replaceState(null,"","#"+ch.id);}catch(e){}}
}
function go(i){show(i);try{root.scrollIntoView({block:"start"});}catch(e){}var nb=navUl.children[i];if(nb&&nb.scrollIntoView&&window.innerWidth<860)nb.scrollIntoView({inline:"center",block:"nearest"});}
function build(){
  var shell=el("div","shell");root.appendChild(shell);
  var side=el("aside","side");shell.appendChild(side);
  side.appendChild(el("div","brand","<span>A-level Physics toolkit</span>Exponentials &amp; logarithms"));
  var pr=el("div","prog");progI=el("i");pr.appendChild(progI);side.appendChild(pr);progT=el("div","progtxt","");side.appendChild(progT);
  navUl=el("ul","nav");side.appendChild(navUl);
  CH.forEach(function(ch,i){var li=el("li");var b=el("button",null,"<span class='n'>"+ch.num+"</span><span class='lbl'>"+md(ch.short)+"</span>");b.type="button";b.onclick=function(){go(i);};li.appendChild(b);navUl.appendChild(li);});
  main=el("main","main");shell.appendChild(main);
  var h=(location.hash||"").slice(1),idx=0;CH.forEach(function(c,i){if(c.id===h)idx=i;});show(idx,true);
  window.addEventListener("hashchange",function(){var h2=location.hash.slice(1);CH.forEach(function(c,i){if(c.id===h2&&i!==curIdx)show(i,true);});});
}
build();
})();
