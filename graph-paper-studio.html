<title>Graph Paper Studio</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..100,400..700&family=Martian+Mono:wght@400;500&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
/* Layout: drafting desk. Instrument-panel sidebar on the left; the sheet lies on a millimetre-ruled desk on the right. */
:root{
  --desk:#e6ebee; --desk-rule:#d6dde2; --desk-rule-major:#c6cfd6;
  --panel:#f7f9fa; --raised:#ffffff; --ink:#16212a; --ink-2:#54626e; --ink-3:#8593a0;
  --rule:#d5dce2; --accent:#1d6b58; --accent-ink:#ffffff; --accent-soft:#dcebe5;
  --warn:#9a5b00; --warn-soft:#fbefd9;
  --font-ui:"Archivo", "Helvetica Neue", Arial, sans-serif;
  --font-mono:"Martian Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --r:6px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --desk:#0f151a; --desk-rule:#172028; --desk-rule-major:#1e2932;
  --panel:#151d23; --raised:#1b252d; --ink:#e2e8ec; --ink-2:#9fadb8; --ink-3:#6c7a86;
  --rule:#27333d; --accent:#5fc3a4; --accent-ink:#0d1a16; --accent-soft:#183830;
  --warn:#f1b65a; --warn-soft:#3a2c14; color-scheme:dark }}
:root[data-theme="dark"]{
  --desk:#0f151a; --desk-rule:#172028; --desk-rule-major:#1e2932;
  --panel:#151d23; --raised:#1b252d; --ink:#e2e8ec; --ink-2:#9fadb8; --ink-3:#6c7a86;
  --rule:#27333d; --accent:#5fc3a4; --accent-ink:#0d1a16; --accent-soft:#183830;
  --warn:#f1b65a; --warn-soft:#3a2c14; color-scheme:dark }
html,body{height:100%}
body{background:var(--desk);color:var(--ink);font-family:var(--font-ui);font-size:14px;line-height:1.4}
*{box-sizing:border-box}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--panel)}
.app{height:100%;display:grid;grid-template-columns:350px minmax(0,1fr);grid-template-rows:auto minmax(0,1fr)}
.top{grid-column:1/-1;display:flex;align-items:center;gap:16px;flex-wrap:wrap;background:var(--panel);border-bottom:1px solid var(--rule);
  padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.brand{display:flex;align-items:baseline;gap:10px;margin-right:auto;min-width:0}
.brand h1{margin:0;font-size:19px;font-weight:700;font-stretch:80%;letter-spacing:.01em;text-wrap:balance}
.brand span{font-family:var(--font-mono);font-size:11px;color:var(--ink-3)}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.btn{font:inherit;font-weight:600;font-size:13px;border:1px solid var(--rule);background:var(--raised);color:var(--ink);border-radius:var(--r);padding:8px 12px;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.btn:hover{border-color:var(--ink-3)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.08)}
.btn:focus-visible,select:focus-visible,input:focus-visible,.seg button:focus-visible,summary:focus-visible,.tile:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn svg{width:15px;height:15px}

/* Sidebar */
.side{background:var(--panel);border-right:1px solid var(--rule);overflow-y:auto;overscroll-behavior:contain;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:16px;padding-block:14px 40px}
.preset{display:grid;gap:6px;margin-bottom:14px}
.preset label{font-size:11px;font-weight:600;font-stretch:80%;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-2)}
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:6px}
.tile{font:inherit;border:1px solid var(--rule);background:var(--raised);color:var(--ink-2);border-radius:var(--r);padding:8px 2px 6px;cursor:pointer;display:grid;justify-items:center;gap:4px;font-size:11px;font-weight:500}
.tile svg{width:26px;height:26px}
.tile[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);color:var(--ink)}
.tile[aria-pressed="true"] svg{color:var(--accent)}
details{border-top:1px solid var(--rule)}
details:last-of-type{border-bottom:1px solid var(--rule)}
summary{list-style:none;cursor:pointer;display:flex;align-items:center;justify-content:space-between;padding:12px 0;font-weight:700;font-stretch:78%;font-size:13px;text-transform:uppercase;letter-spacing:.1em}
summary::-webkit-details-marker{display:none}
summary::after{content:"";width:8px;height:8px;border-right:1.5px solid var(--ink-3);border-bottom:1.5px solid var(--ink-3);transform:rotate(45deg) translate(-2px,-2px);transition:transform .15s}
details[open] summary::after{transform:rotate(-135deg) translate(-2px,-2px)}
.fields{display:grid;grid-template-columns:1fr 1fr;gap:10px 12px;padding-bottom:16px}
.row{grid-column:1/-1;display:grid;gap:5px;min-width:0}
.row.half{grid-column:auto}
.lbl{font-size:12.5px;color:var(--ink-2)}
.hint{grid-column:1/-1;font-size:12px;color:var(--ink-3);margin-top:-4px}
input[type=number],input[type=text],select{font:inherit;font-size:13px;width:100%;min-width:0;background:var(--raised);color:var(--ink);border:1px solid var(--rule);border-radius:var(--r);padding:7px 8px}
input[type=number]{font-family:var(--font-mono);font-size:12px;font-variant-numeric:tabular-nums}
.inp{display:flex;align-items:center;gap:6px}
.inp em{font-style:normal;font-family:var(--font-mono);font-size:11px;color:var(--ink-3);white-space:nowrap}
.rng{display:flex;align-items:center;gap:10px}
.rng input{flex:1;accent-color:var(--accent);min-width:0}
.rng output{font-family:var(--font-mono);font-size:11px;color:var(--ink-2);min-width:58px;text-align:right;font-variant-numeric:tabular-nums}
.seg{display:flex;border:1px solid var(--rule);border-radius:var(--r);overflow:hidden;background:var(--raised)}
.seg button{flex:1;font:inherit;font-size:12.5px;border:0;background:transparent;color:var(--ink-2);padding:7px 4px;cursor:pointer;border-left:1px solid var(--rule)}
.seg button:first-child{border-left:0}
.seg button[aria-pressed="true"]{background:var(--accent-soft);color:var(--ink);font-weight:600}
.chk{display:flex;align-items:center;gap:10px;cursor:pointer}
.chk input{position:absolute;opacity:0;pointer-events:none}
.sw{width:30px;height:18px;border-radius:9px;background:var(--rule);position:relative;flex:none;transition:background .15s}
.sw::after{content:"";position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:50%;background:var(--raised);box-shadow:0 1px 2px rgba(0,0,0,.25);transition:transform .15s}
.chk input:checked+.sw{background:var(--accent)}
.chk input:checked+.sw::after{transform:translateX(12px)}
.chk input:focus-visible+.sw{outline:2px solid var(--accent);outline-offset:2px}
.chk .lbl{color:var(--ink)}
.col{display:flex;align-items:center;gap:8px}
.col input{width:34px;height:28px;padding:0;border:1px solid var(--rule);border-radius:var(--r);background:none;cursor:pointer}
.col code{font-family:var(--font-mono);font-size:11px;color:var(--ink-2)}
.side-foot{display:flex;gap:8px;margin-top:16px}

/* Stage */
.stage-wrap{display:grid;grid-template-rows:auto minmax(0,1fr) auto;min-width:0;min-height:0}
.toolbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding-block:8px;padding-left:16px;padding-right:max(16px,env(safe-area-inset-right,0px));border-bottom:1px solid var(--rule);background:color-mix(in srgb,var(--panel) 70%,transparent)}
.toolbar .lbl{font-size:12px}
.toolbar select{width:auto}
.zoom{display:flex;align-items:center;gap:8px}
.stage{overflow:auto;min-height:0;position:relative;
  background-color:var(--desk);
  background-image:
    linear-gradient(var(--desk-rule-major) 1px,transparent 1px),linear-gradient(90deg,var(--desk-rule-major) 1px,transparent 1px),
    linear-gradient(var(--desk-rule) 1px,transparent 1px),linear-gradient(90deg,var(--desk-rule) 1px,transparent 1px);
  background-size:50px 50px,50px 50px,10px 10px,10px 10px}
.sheet-holder{min-width:100%;min-height:100%;display:grid;place-items:center;padding:28px}
.sheet{background:#fff;box-shadow:0 1px 2px rgba(10,20,30,.18),0 12px 32px rgba(10,20,30,.18);line-height:0}
.sheet svg{display:block}
.info{display:flex;gap:6px 18px;flex-wrap:wrap;align-items:center;padding-block:8px;padding-left:16px;padding-right:max(16px,env(safe-area-inset-right,0px));border-top:1px solid var(--rule);background:var(--panel);font-family:var(--font-mono);font-size:11px;color:var(--ink-2);font-variant-numeric:tabular-nums}
.info b{font-weight:500;color:var(--ink)}
.warn{color:var(--warn);background:var(--warn-soft);padding:2px 8px;border-radius:4px;font-family:var(--font-ui);font-size:12px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(20px);opacity:0;background:var(--ink);color:var(--panel);padding:10px 16px;border-radius:var(--r);font-size:13px;pointer-events:none;transition:opacity .2s,transform .2s;max-width:calc(100% - 32px);z-index:20}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
@media (max-width:820px){
  html,body{height:auto}
  .app{display:block;height:auto}
  .side{border-right:0;border-bottom:1px solid var(--rule);overflow:visible;padding-right:max(16px,env(safe-area-inset-right,0px))}
  .app{display:flex;flex-direction:column}
  .top{order:-2}
  .stage-wrap{display:block;order:-1}
  .stage{height:62vh}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div class="app" id="app">
  <header class="top">
    <div class="brand"><h1>Graph Paper Studio</h1><span>exact-scale printable paper</span></div>
    <div class="actions">
      <button class="btn primary" id="dl-pdf" type="button"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M8 2v8m0 0-3-3m3 3 3-3M3 13h10"/></svg>Download PDF</button>
      <button class="btn" id="dl-svg" type="button">SVG</button>
      <button class="btn" id="dl-png" type="button">PNG</button>
    </div>
  </header>
  <aside class="side" id="side">
    <div class="preset">
      <label for="preset">Start from a preset</label>
      <select id="preset"></select>
    </div>
    <div class="tiles" id="tiles" role="group" aria-label="Paper type"></div>
    <div id="controls"></div>
    <div class="side-foot"><button class="btn" id="reset" type="button">Reset everything</button></div>
  </aside>
  <main class="stage-wrap">
    <div class="toolbar">
      <div class="zoom"><label class="lbl" for="zoom">Zoom</label>
        <select id="zoom"><option value="fit">Fit page</option><option value="width">Fit width</option><option value="1">Actual size</option><option value="2">200%</option><option value="4">400%</option></select></div>
      <span class="lbl">Print at <b>Actual size</b> (100%), not “Fit to page”, to keep the scale exact.</span>
    </div>
    <div class="stage" id="stage"><div class="sheet-holder"><div class="sheet" id="sheet"></div></div></div>
    <div class="info" id="info"></div>
  </main>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
"use strict";
/* ============================== core: settings ============================== */
const PT = 0.352778; // mm per point
const SIZES = {A3:[297,420],A4:[210,297],A5:[148,210],Letter:[215.9,279.4],Legal:[215.9,355.6]};
const SCHEMES = {
  exam:{name:"Exam grey",minorCol:"#c5cad0",majorCol:"#858d97",axisCol:"#1a2027",textCol:"#1a2027"},
  green:{name:"Classic green",minorCol:"#b4dbc0",majorCol:"#4f9c6b",axisCol:"#1d4a31",textCol:"#1d2a22"},
  blue:{name:"Engineering blue",minorCol:"#bad2ea",majorCol:"#5487c2",axisCol:"#173a62",textCol:"#172636"},
  orange:{name:"Traditional orange",minorCol:"#f4cdb6",majorCol:"#d98055",axisCol:"#5e2812",textCol:"#2e1a10"},
  black:{name:"Photocopy black",minorCol:"#9c9c9c",majorCol:"#3a3a3a",axisCol:"#000000",textCol:"#000000"},
  faint:{name:"Faint",minorCol:"#e2e4e6",majorCol:"#c2c6ca",axisCol:"#6f757b",textCol:"#3c4146"},
};
const DEFAULTS = {
  type:"square",
  size:"A4", customW:200, customH:250, orient:"portrait", margin:12, layout:"1x1", gap:8,
  sizing:"size", minor:2, sub:5, nx:16, ny:22, showMinor:true, showMajor:true, minorStyle:"solid",
  dotR:0.25, majorDots:true, borderW:0.35,
  isoSpacing:5, isoMode:"dots", isoOrient:"vertical",
  hexSize:6, hexOrient:"flat",
  polHalf:"full", polConv:"maths", polRings:10, polMajorEvery:5, polSpokeMinor:5, polSpokeMajor:30, polLabels:true, polRingLabels:false, polRmax:10,
  logX:false, decX:3, linMajX:10, logStartX:0, logY:true, decY:3, linMajY:10, logStartY:0, logLabelStyle:"powers",
  lineSpacing:8, marginLine:true, marginPos:25, lineHand:false, lineTop:true,
  nlCount:8, nlMin:-10, nlMax:10, nlStep:1, nlMinor:2, nlLabels:true, nlArrows:true,
  axes:true, axisPos:"edge", axisCentre:false, xStart:0, xPer:10, yStart:0, yPer:0.5, labelEvery:1, decimals:"auto",
  xTitle:"length / cm", yTitle:"period / s", arrows:false, ticks:true, numSize:8,
  scheme:"exam", minorCol:"#c5cad0", majorCol:"#858d97", axisCol:"#1a2027", textCol:"#1a2027", marginCol:"#d0453f", bgCol:"#ffffff",
  minorW:0.1, majorW:0.3, axisW:0.5,
  title:"Simple pendulum: period against length", fName:true, fDate:true, fClass:false, fCustom:"",
  footer:"", scaleNote:true,
  table:true, tablePos:"top", tableCols:"length / cm, T₁ / s, T₂ / s, T₃ / s, mean T / s", tableRows:7, rowH:7, tableW:80, tableFill:true,
  pdfPages:1, pngDpi:"300", filename:"graph-paper",
};
const PRESETS = [
  {name:"Practical graph with results table", s:{}},
  {name:"Exam-style 2 mm graph paper", s:{axes:false,title:"",fDate:false,table:false,scheme:"green",...SCHEMES.green,scaleNote:true}},
  {name:"Four graphs per page", s:{layout:"2x2",gap:10,title:"Sketching graphs",table:false,axisPos:"zero",axisCentre:true,xPer:1,yPer:1,xTitle:"x",yTitle:"y",arrows:true,numSize:7,labelEvery:2}},
  {name:"Axes through the origin", s:{table:false,title:"",axisPos:"zero",axisCentre:true,xPer:1,yPer:1,xTitle:"x",yTitle:"y",arrows:true,labelEvery:1}},
  {name:"Semi-log: radioactive decay", s:{type:"log",table:false,title:"Radioactive decay",logX:false,linMajX:10,xStart:0,xPer:10,logY:true,decY:3,logStartY:0,xTitle:"time / s",yTitle:"count rate / s⁻¹",scheme:"blue",...SCHEMES.blue}},
  {name:"Log–log paper", s:{type:"log",table:false,title:"",logX:true,decX:3,logY:true,decY:3,logStartX:-1,logStartY:0,xTitle:"length / m",yTitle:"period / s",scheme:"green",...SCHEMES.green}},
  {name:"Engineering 1 mm grid", s:{minor:1,sub:10,axes:false,table:false,title:"",fName:false,fDate:false,scaleNote:true,scheme:"blue",...SCHEMES.blue,minorW:0.08,majorW:0.3}},
  {name:"Dot grid, 5 mm", s:{type:"dot",minor:5,sub:5,axes:false,table:false,title:"",fName:false,fDate:false,scaleNote:false,borderW:0,dotR:0.3,majorDots:false,scheme:"exam",...SCHEMES.exam}},
  {name:"Isometric dot paper", s:{type:"isometric",isoMode:"dots",isoSpacing:5,table:false,title:"",fDate:false,dotR:0.35}},
  {name:"Isometric grid lines", s:{type:"isometric",isoMode:"lines",isoSpacing:5,table:false,title:"",fDate:false,scheme:"blue",...SCHEMES.blue}},
  {name:"Hexagonal grid", s:{type:"hex",hexSize:6,table:false,title:"",fDate:false}},
  {name:"Polar grid with bearings", s:{type:"polar",polConv:"bearing",polHalf:"full",table:false,title:"Bearings",fDate:false,polRings:10,polMajorEvery:5}},
  {name:"Protractor semicircle", s:{type:"polar",polConv:"maths",polHalf:"half",orient:"landscape",table:false,title:"",fName:false,fDate:false,polSpokeMinor:1,polSpokeMajor:10,polRings:4,polMajorEvery:1}},
  {name:"Lined, 8 mm with margin", s:{type:"lined",table:false,title:"",fClass:true,scaleNote:false}},
  {name:"Number lines, −10 to 10", s:{type:"numberline",table:false,title:"Number lines",scaleNote:false}},
];

/* ============================== core: helpers ============================== */
function pageDims(s){
  let [w,h] = s.size==="Custom" ? [Math.max(20,+s.customW||200),Math.max(20,+s.customH||250)] : SIZES[s.size]||SIZES.A4;
  const lo=Math.min(w,h), hi=Math.max(w,h);
  return s.orient==="landscape" ? {W:hi,H:lo} : {W:lo,H:hi};
}
function decs(v){ const t=String(+(+v).toFixed(6)); return t.includes("e")?6:(t.split(".")[1]||"").length; }
function fmtNum(v,dp){ let t=(+v).toFixed(dp); if(/^-0(\.0*)?$/.test(t)) t=t.slice(1); return t.replace("-","−"); }
function dashFor(style,w){ return style==="dashed"?[1.2,0.8]:style==="dotted"?[Math.max(0.12,w),0.55]:null; }
function estW(str,pt){ return String(str).length*0.56*pt*PT; }
function clipLine(R,px,py,dx,dy){
  let t0=-Infinity,t1=Infinity;
  const p=[-dx,dx,-dy,dy], q=[px-R.x,R.x+R.w-px,py-R.y,R.y+R.h-py];
  for(let i=0;i<4;i++){
    if(Math.abs(p[i])<1e-12){ if(q[i]<0) return null; }
    else { const t=q[i]/p[i]; if(p[i]<0) t0=Math.max(t0,t); else t1=Math.min(t1,t); }
  }
  if(!(t0<t1)) return null;
  return [px+dx*t0,py+dy*t0,px+dx*t1,py+dy*t1];
}
function lineFamily(R,ox,oy,dx,dy,sp,out){
  const nx=-dy, ny=dx; const ds=[[R.x,R.y],[R.x+R.w,R.y],[R.x,R.y+R.h],[R.x+R.w,R.y+R.h]].map(([cx,cy])=>(cx-ox)*nx+(cy-oy)*ny);
  const k0=Math.ceil(Math.min(...ds)/sp-1e-9), k1=Math.floor(Math.max(...ds)/sp+1e-9);
  for(let k=k0;k<=k1;k++){ const sg=clipLine(R,ox+nx*k*sp,oy+ny*k*sp,dx,dy); if(sg && Math.hypot(sg[2]-sg[0],sg[3]-sg[1])>0.01) out.push(sg); }
  return out;
}
function arrowHead(pen,x,y,ux,uy,size,col){
  const bx=x-ux*size, by=y-uy*size, px=-uy*size*0.38, py=ux*size*0.38;
  pen.poly([[x,y],[bx+px,by+py],[bx-px,by-py]],{fill:col});
}
function supText(e){ const m={"-":"⁻","0":"⁰","1":"¹","2":"²","3":"³","4":"⁴","5":"⁵","6":"⁶","7":"⁷","8":"⁸","9":"⁹"}; return String(e).split("").map(c=>m[c]||c).join(""); }
function powLabel(pen,x,y,e,o){ // draws 10^e, positioned by anchor (start|middle|end) and base
  const fs=o.size, es=fs*0.72, w1=estW("10",fs), w2=estW(String(e),es)+0.3, tot=w1+w2;
  let x0 = o.anchor==="middle"? x-tot/2 : o.anchor==="end"? x-tot : x;
  pen.text("10",x0,y,{...o,anchor:"start"});
  const yb = o.base==="top"? y-0.6 : o.base==="middle"? y-fs*PT*0.45 : y-fs*PT*0.42;
  pen.text(String(e).replace("-","−"),x0+w1+0.2,yb,{...o,size:es,anchor:"start"});
}

/* ============================== core: page renderer ============================== */
function renderPage(pen,s){
  const {W,H}=pageDims(s); const m=+s.margin||0; const info={W,H,warn:[]};
  if(s.bgCol && s.bgCol.toLowerCase()!=="#ffffff") pen.rect(0,0,W,H,{fill:s.bgCol});
  let top=m, bottom=H-m; const left=m, right=W-m;
  const T={color:s.textCol};
  // header
  if(s.title){ pen.text(s.title,left,top+4.6,{...T,size:14,bold:true}); top+=8; }
  const fields=[s.fName&&"Name",s.fClass&&"Class",s.fDate&&"Date",...String(s.fCustom||"").split(",").map(t=>t.trim()).filter(Boolean)].filter(Boolean);
  if(fields.length){
    const shares=fields.map(f=>f==="Name"?2.2:1), tot=shares.reduce((a,b)=>a+b,0), cw=right-left; let x=left; const y=top+5;
    fields.forEach((f,i)=>{ const w=cw*shares[i]/tot; pen.text(f,x,y,{...T,size:9}); const lx=x+estW(f,9)+2; pen.lines([[lx,y+0.8,x+w-5,y+0.8]],{c:s.textCol,w:0.2}); x+=w; });
    top+=8.5;
  }
  if(s.title||fields.length) top+=3;
  // footer
  const sn = s.scaleNote ? scaleNote(s) : "";
  if(s.footer||sn){ bottom-=6; const y=H-m-0.6; if(s.footer) pen.text(s.footer,left,y,{...T,size:7.5}); if(sn) pen.text(sn,right,y,{...T,size:7,anchor:"end",color:s.majorCol==="#ffffff"?s.textCol:mix(s.textCol)}); }

  {k:"pdfPages",l:"Pages in the PDF",type:"num",min:1,max:100,step:1,half:1},
  {k:"pngDpi",l:"PNG resolution",type:"select",o:[["150","150 dpi"],["300","300 dpi"],["600","600 dpi"]],half:1},
  {hint:"PDF and SVG are vector files at exact size. Use PNG for slides and worksheets."},
 ]},
];

// build tiles
const tilesEl=document.getElementById("tiles");
tilesEl.innerHTML=TYPES.map(([k,l,ic])=>`<button type="button" class="tile" data-type="${k}" aria-pressed="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round">${ic}</svg>${l}</button>`).join("");
tilesEl.addEventListener("click",e=>{ const b=e.target.closest(".tile"); if(!b) return; S.type=b.dataset.type; changed(); });
// presets
const presetEl=document.getElementById("preset");
presetEl.innerHTML=`<option value="">Choose a preset…</option>`+PRESETS.map((p,i)=>`<option value="${i}">${esc(p.name)}</option>`).join("");
presetEl.addEventListener("change",()=>{ const p=PRESETS[+presetEl.value]; if(!p) return; S={...DEFAULTS,...p.s}; syncAll(); changed(); toast(`Loaded “${p.name}”`); presetEl.value=""; });

// build controls
const ctl=document.getElementById("controls");
let uid=0;
const fieldHTML=f=>{
  if(f.hint) return `<p class="hint" data-hint="${uid++}">${esc(f.hint)}</p>`;
  const id=`f-${f.k}-${uid++}`; const cls="row"+(f.half?" half":"");
  const a=`data-k="${f.k}" data-type="${f.type}"`;
  switch(f.type){
    case "num": return `<label class="${cls}" ${a}><span class="lbl">${f.l}</span><span class="inp"><input type="number" id="${id}" ${f.min!==undefined?`min="${f.min}"`:""} ${f.max!==undefined?`max="${f.max}"`:""} step="${f.step??1}">${f.u?`<em>${f.u}</em>`:""}</span></label>`;
    case "range": return `<label class="${cls}" ${a}><span class="lbl">${f.l}</span><span class="rng"><input type="range" id="${id}" min="${f.min}" max="${f.max}" step="${f.step}"><output></output></span></label>`;
    case "select": return `<label class="${cls}" ${a}><span class="lbl">${f.l}</span><select id="${id}">${f.o.map(([v,l])=>`<option value="${v}">${esc(l)}</option>`).join("")}</select></label>`;
    case "seg": return `<div class="${cls}" ${a}><span class="lbl" id="${id}">${f.l}</span><div class="seg" role="group" aria-labelledby="${id}">${f.o.map(([v,l])=>`<button type="button" data-v="${v}" aria-pressed="false">${esc(l)}</button>`).join("")}</div></div>`;
    case "check": return `<label class="${cls} chk" ${a}><input type="checkbox" id="${id}"><span class="sw"></span><span class="lbl">${f.l}</span></label>`;
    case "color": return `<label class="${cls}" ${a}><span class="lbl">${f.l}</span><span class="col"><input type="color" id="${id}"><code></code></span></label>`;
    case "text": return `<label class="${cls}" ${a}><span class="lbl">${f.l}</span><input type="text" id="${id}" ${f.ph?`placeholder="${esc(f.ph)}"`:""} autocomplete="off"></label>`;
  }
};
ctl.innerHTML=SECTIONS.map(sec=>`<details id="sec-${sec.id}" ${sec.open?"open":""}><summary>${sec.title}</summary><div class="fields">${sec.fields.map(fieldHTML).join("")}</div></details>`).join("");
// map DOM rows to field defs in order
const rows=[]; { const els=ctl.querySelectorAll(".fields > *"); let i=0; SECTIONS.forEach(sec=>sec.fields.forEach(f=>{ rows.push({f,el:els[i++],sec}); })); }

const fmtOut=(f,v)=>(+v).toFixed(f.step<0.05?2:f.step<1?(f.step<0.1?2:1):0)+(f.u?" "+f.u:"");
function syncAll(){
  for(const {f,el} of rows){
    if(f.hint) continue; const v=S[f.k];
    if(f.type==="check") el.querySelector("input").checked=!!v;
    else if(f.type==="seg") el.querySelectorAll("button").forEach(b=>b.setAttribute("aria-pressed",String(b.dataset.v===String(v))));
    else if(f.type==="range"){ el.querySelector("input").value=v; el.querySelector("output").textContent=fmtOut(f,v); }
    else if(f.type==="color"){ el.querySelector("input").value=v; el.querySelector("code").textContent=String(v).toUpperCase(); }
    else { const inp=el.querySelector("input,select"); if(document.activeElement!==inp) inp.value=v; }
  }
}
function syncVisibility(){
  tilesEl.querySelectorAll(".tile").forEach(b=>b.setAttribute("aria-pressed",String(b.dataset.type===S.type)));
  for(const {f,el} of rows) el.hidden = f.show ? !f.show(S) : false;
  for(const sec of SECTIONS){ const d=document.getElementById("sec-"+sec.id); const anyRow=rows.some(r=>r.sec===sec&&!r.el.hidden&&!r.f.hint); d.hidden = (sec.show&&!sec.show(S)) || !anyRow; }
}
function readField(f,el,target){
  if(f.type==="check") return el.querySelector("input").checked;
  if(f.type==="seg") return target.dataset.v;
  const inp=el.querySelector("input,select"); const v=inp.value;
  if(f.type==="num"||f.type==="range"){ const n=parseFloat(v); return Number.isFinite(n)?n:S[f.k]; }
  return v;
}
function handle(e){
  const el=e.target.closest("[data-k]"); if(!el) return;
  const rec=rows.find(r=>r.el===el); if(!rec) return; const f=rec.f;
  if(f.type==="seg"){ if(e.type!=="click") return; const b=e.target.closest("button"); if(!b) return; S[f.k]=readField(f,el,b); }
  else { if(e.type==="click") return; S[f.k]=readField(f,el,e.target); }
  if(f.k==="scheme" && SCHEMES[S.scheme]) Object.assign(S,SCHEMES[S.scheme]);
  if(["minorCol","majorCol","axisCol","textCol"].includes(f.k)) S.scheme="custom";
  // keep both axis checkboxes in sync
  changed(f.type!=="text"&&f.type!=="num");
}
ctl.addEventListener("input",handle); ctl.addEventListener("change",handle); ctl.addEventListener("click",handle);

document.getElementById("reset").addEventListener("click",()=>{ S={...DEFAULTS}; syncAll(); changed(); toast("Reset to the starting layout"); });

// rendering
const sheet=document.getElementById("sheet"), stage=document.getElementById("stage"), infoEl=document.getElementById("info"), zoomEl=document.getElementById("zoom");
let raf=0, lastInfo=null;
function changed(full=true){ if(full) syncAll(); syncVisibility(); if(!raf) raf=requestAnimationFrame(()=>{ raf=0; draw(); }); try{ localStorage.setItem(LS,JSON.stringify(S)); }catch(e){} }
function draw(){
  const {svg,info}=buildSvg(S); lastInfo=info;
  sheet.innerHTML=svg; fitZoom(); showInfo(info);
}
function fitZoom(){
  const sv=sheet.querySelector("svg"); if(!sv) return; const {W,H}=pageDims(S);
  const z=zoomEl.value; const pxPerMm=96/25.4;
  let scale;
  const aw=stage.clientWidth-56, ah=stage.clientHeight-56;
  if(z==="fit") scale=Math.min(aw/W,ah/H); else if(z==="width") scale=aw/W; else scale=pxPerMm*+z;
  scale=Math.max(0.2,scale);
  sv.setAttribute("width",(W*scale).toFixed(1)); sv.setAttribute("height",(H*scale).toFixed(1));
}
zoomEl.addEventListener("change",fitZoom);
try{ new ResizeObserver(()=>{ if(zoomEl.value==="fit"||zoomEl.value==="width") fitZoom(); }).observe(stage); }catch(e){ addEventListener("resize",fitZoom); }

function showInfo(info){
  const f=v=>+(+v).toFixed(2);
  const parts=[`<span><b>${S.size==="Custom"?"Custom":S.size}</b> ${S.orient} · ${f(info.W)} × ${f(info.H)} mm</span>`];
  if(info.minor){ parts.push(`<span>small square <b>${f(info.minor)} mm</b>${info.sub>1?` · large <b>${f(info.maj)} mm</b>`:""}</span>`); parts.push(`<span>grid <b>${info.nx} × ${info.ny}</b> large squares · ${f(info.gw)} × ${f(info.gh)} mm</span>`); }
  if(info.iso) parts.push(`<span>spacing <b>${f(info.iso)} mm</b></span>`);
  if(info.hex) parts.push(`<span>hexagon side <b>${f(info.hex)} mm</b></span>`);
  if(info.radius) parts.push(`<span>radius <b>${f(info.radius)} mm</b></span>`);
  if(info.log) parts.push(`<span>grid <b>${f(info.gw)} × ${f(info.gh)} mm</b></span>`);
  if(info.line) parts.push(`<span>line spacing <b>${f(info.line)} mm</b></span>`);
  for(const w of info.warn||[]) parts.push(`<span class="warn">${esc(w)}</span>`);
  infoEl.innerHTML=parts.join("");
}

// toast
const toastEl=document.getElementById("toast"); let tt=0;
function toast(m){ toastEl.textContent=m; toastEl.classList.add("show"); clearTimeout(tt); tt=setTimeout(()=>toastEl.classList.remove("show"),2600); }

// downloads: artifact viewer capability, else a normal browser download
const dlReady = (window.claude && typeof window.claude.use==="function") ? window.claude.use("downloads").catch(()=>null) : Promise.resolve(null);
async function saveFile(name,data,mime){
  const dl=await dlReady;
  if(dl){
    try{ await dl.save({filename:name,data}); toast(`Saved ${name}`); }
    catch(e){ const c=e&&e.code; toast(c==="declined"?"Download cancelled":c==="rate_limited"?"A save is already waiting for you. Try again in a moment.":"This view can’t save files. Open the page in a browser and try again."); }
    return;
  }
  const blob=data instanceof Blob?data:new Blob([data],{type:mime});
  const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download=name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href),4000); toast(`Saved ${name}`);
}
const baseName=()=>(String(S.filename||"graph-paper").trim().replace(/[\\/:*?"<>|]+/g,"-")||"graph-paper");
document.getElementById("dl-svg").addEventListener("click",()=>{ const {svg}=buildSvg(S); saveFile(baseName()+".svg",svg,"image/svg+xml"); });
document.getElementById("dl-pdf").addEventListener("click",()=>{
  if(!window.jspdf){ toast("The PDF tool didn’t load. Check your connection, reload, and try again."); return; }
  const {W,H}=pageDims(S); const o=W>H?"landscape":"portrait";
  const doc=new window.jspdf.jsPDF({unit:"mm",format:[W,H],orientation:o,compress:true});
  const n=Math.max(1,Math.min(100,Math.round(+S.pdfPages||1)));
  for(let i=0;i<n;i++){ if(i) doc.addPage([W,H],o); renderPage(new PdfPen(doc),S); }
  doc.setProperties({title:S.title||"Graph paper",creator:"Graph Paper Studio"});
  saveFile(baseName()+".pdf",doc.output("blob"),"application/pdf");
});
document.getElementById("dl-png").addEventListener("click",async()=>{
  const {W,H}=pageDims(S); const dpi=+S.pngDpi||300; const pw=Math.round(W/25.4*dpi), ph=Math.round(H/25.4*dpi);
  if(pw*ph>60e6){ toast("That image would be too large. Choose a lower resolution."); return; }
  const {svg}=buildSvg(S,pw,ph);
  const url=URL.createObjectURL(new Blob([svg],{type:"image/svg+xml"}));
  try{
    const img=new Image(); img.src=url; await img.decode();
    const c=document.createElement("canvas"); c.width=pw; c.height=ph; const g=c.getContext("2d"); g.fillStyle="#fff"; g.fillRect(0,0,pw,ph); g.drawImage(img,0,0,pw,ph);
    const blob=await new Promise(r=>c.toBlob(r,"image/png"));
    if(!blob) throw new Error("no blob");
    await saveFile(baseName()+".png",blob,"image/png");
  }catch(e){ toast("The PNG couldn’t be made. Try a lower resolution."); }
  finally{ URL.revokeObjectURL(url); }
});

syncAll(); syncVisibility(); draw();
})();
if(typeof module!=="undefined") module.exports={renderPage,buildSvg,DEFAULTS,PRESETS,SvgPen,PdfPen,pageDims};
</script>
