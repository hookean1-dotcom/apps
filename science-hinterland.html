dark dust lanes of the Milky Way, including a huge emu stretching from the Southern Cross. Its changing position through the year signals when emus lay eggs. Some oral traditions describe the variable brightness of red giant stars such as Betelgeuse, and others may record ancient meteorite impacts.","q":"How might sky observations help with hunting and farming?"},{"id":"earth-035","t":"Mayan astronomers and Venus","s":"Physics","tp":"Space","sub":"Ancient astronomy","lv":["KS3","GCSE"],"who":"","f":0,"loc":"Mexico / Central America","rg":["North & Central America"],"yr":1200,"era":"Medieval","tag":"Discovery","x":"The Dresden Codex, one of only a handful of surviving Maya books, contains tables predicting the appearances of Venus. The Maya knew Venus repeats its cycle of morning and evening appearances every 584 days, and that five such cycles equal almost exactly eight years. Their tables include corrections to keep predictions accurate over centuries. Venus was important in Maya ritual and warfare. They also predicted eclipses.","q":"Why does Venus appear as both a morning and an evening star?"},{"id":"phys2-001","t":"Ibn al-Haytham: the scientist who pretended to be mad","s":"Physics","tp":"Waves","sub":"Light and vision","lv":["KS3","GCSE","A-Level"],"who":"Ibn al-Haytham (Alhazen)","f":0,"loc":"Iraq / Egypt","rg":["Africa","Middle East"],"yr":1021,"era":"Medieval","tag":"Discovery","x":"Ibn al-Haytham, born in Basra around 965, reportedly told the Caliph of Egypt he could control the flooding of the Nile. When he saw it was impossible, he feared the Caliph's anger and pretended to be mad, living under house arrest for about ten years. During that time he wrote the 'Book of Optics', showing that we see because light enters the eye, not because the eye sends out rays. He studied the camera obscura and insisted that ideas must be tested by experiment, making him one of the founders of the scientific method.","q":"How does a pinhole camera form an image?"},{"id":"phys2-002","t":"Archimedes and the golden crown","s":"Physics","tp":"Matter","sub":"Density","lv":["KS3","GCSE"],"who":"Archimedes, King Hiero II","f":0,"loc":"Sicily","rg":["Europe"],"yr":-250,"era":"Ancient","tag":"Discovery","x":"According to the Roman writer Vitruvius, writing two centuries later, King Hiero of Syracuse suspected his goldsmith of mixing silver into a crown. Archimedes noticed the water rising as he got into a bath, realised he could measure the crown's volume by the water it displaced, and ran home naked shouting 'Eureka!' – 'I have found it!'. A crown with silver would displace more water than an equal mass of pure gold. Historians doubt the details; Archimedes more likely used his principle of buoyancy. According to legend, he was killed by a Roman soldier while drawing circles in sand, saying 'Do not disturb my circles'.","q":"Why would a crown with silver displace more water?"},{"id":"phys2-003","t":"Galileo's swinging lamp","s":"Physics","tp":"Forces and motion","sub":"Pendulums","lv":["KS3","GCSE"],"who":"Galileo Galilei","f":0,"loc":"Italy","rg":["Europe"],"yr":1583,"era":"1500–1699","tag":"Discovery","x":"According to his first biographer, in 1583 the 19-year-old medical student Galileo was in Pisa Cathedral watching a hanging lamp swing. Timing it against his pulse, he noticed that the time for each swing stayed the same whether the swings were big or small. Pendulums later made accurate clocks possible. Galileo almost certainly didn't drop balls from the Leaning Tower; but he did roll balls down ramps and timed them carefully, finding that distance increases with the square of time.","q":"Does a pendulum's period depend on its mass, length or amplitude?"},{"id":"phys2-004","t":"Galileo's moons and his trial","s":"Physics","tp":"Space","sub":"Solar system","lv":["KS3","GCSE"],"who":"Galileo Galilei","f":0,"loc":"Italy","rg":["Europe"],"yr":1610,"era":"1500–1699","tag":"Discovery","x":"In January 1610, using a telescope he built himself, Galileo saw four tiny stars near Jupiter that moved from night to night – they were moons orbiting Jupiter. It proved that not everything goes round the Earth. He also saw mountains on the Moon, sunspots and the phases of Venus. In 1633 the Catholic Church put him on trial for supporting the Sun-centred model of Copernicus; he was forced to recant and spent his last years under house arrest. The Church formally acknowledged its error in 1992.","q":"Why do the phases of Venus support a Sun-centred model?"},{"id":"phys2-005","t":"Newton's year of wonders","s":"Physics","tp":"Forces and motion","sub":"Gravity","lv":["KS3","GCSE","A-Level"],"who":"Isaac Newton, William Stukeley","f":0,"loc":"UK","rg":["Europe"],"yr":1666,"era":"1500–1699","tag":"Discovery","x":"When plague closed Cambridge University in 1665–66, the young Isaac Newton returned to his family farm at Woolsthorpe in Lincolnshire. There he began developing calculus, split sunlight into a spectrum with prisms, and started thinking about gravity. Late in life he told his friend William Stukeley that seeing an apple fall in the garden made him wonder whether the same force reached the Moon. The apple did not hit his head. A descendant of the tree still grows at Woolsthorpe Manor.","q":"How is the falling apple related to the orbiting Moon?"},{"id":"phys2-006","t":"Einstein's compass","s":"Physics","tp":"Magnetism","sub":"Magnetic fields","lv":["KS3","GCSE"],"who":"Albert Einstein","f":0,"loc":"Germany","rg":["Europe"],"yr":1884,"era":"1800s","tag":"Everyday","x":"When Albert Einstein was about five and ill in bed, his father showed him a compass. He was amazed that the needle always pointed the same way, as if moved by something invisible. He later wrote that it made a deep and lasting impression, and that something hidden must lie behind things. Einstein was slow to start speaking but became a brilliant student at subjects he liked; it is a myth that he failed maths.","q":"What makes a compass needle point north?"},{"id":"phys2-007","t":"The 1919 eclipse that made Einstein famous","s":"Physics","tp":"Space","sub":"Relativity","lv":["GCSE","A-Level"],"who":"Arthur Eddington, Frank Dyson, Andrew Crommelin","f":0,"loc":"Príncipe / Brazil / UK","rg":["Africa","South America","Europe"],"yr":1919,"era":"1900–1949","tag":"Discovery","x":"Einstein's general relativity predicted that the Sun's gravity would bend starlight passing close to it by twice as much as Newton's theory. The only way to see stars near the Sun is during a total eclipse. In May 1919, British expeditions photographed the eclipse from the island of Príncipe off West Africa, where Arthur Eddington battled clouds, and from Sobral in Brazil. The star positions matched Einstein's prediction. Newspapers declared 'Lights all askew in the heavens', and Einstein became world-famous overnight.","q":"Why must the eclipse photographs be compared with photographs of the same stars at night?"},{"id":"phys2-008","t":"Faraday: the bookbinder who built the first motor","s":"Physics","tp":"Magnetism","sub":"Motor effect","lv":["KS3","GCSE","A-Level"],"who":"Michael Faraday, Humphry Davy","f":0,"loc":"UK","rg":["Europe"],"yr":1821,"era":"1800s","tag":"Discovery","x":"Michael Faraday, son of a blacksmith, left school at 13 and became a bookbinder's apprentice. He attended Humphry Davy's lectures, wrote up beautiful notes, bound them and sent them to Davy, who hired him as an assistant. In 1821 Faraday made a wire carrying a current spin around a magnet in a dish of mercury – the first electric motor. In 1831 he discovered electromagnetic induction, the basis of generators and transformers. He started the Royal Institution Christmas Lectures for children, which still run today. He refused a knighthood.","q":"What is the difference between the motor effect and induction?"},{"id":"phys2-009","t":"Faraday's famous replies – probably invented","s":"Physics","tp":"How science works","sub":"Myths","lv":["KS3","GCSE"],"who":"Michael Faraday, William Gladstone","f":0,"loc":"UK","rg":["Europe"],"yr":1850,"era":"1800s","tag":"Everyday","x":"Two quotes are often told about Faraday. Asked what use electricity was, he supposedly replied 'What use is a newborn baby?'; and when the politician William Gladstone asked the same, Faraday allegedly said 'One day, sir, you may tax it'. There is no evidence from the time for either – the baby line was earlier attributed to Benjamin Franklin about hot-air balloons. They are good stories, but show why historians check original sources.","q":"How could you check whether a famous quote is real?"},{"id":"phys2-010","t":"Maxwell: 'Dafty' and the first colour photograph","s":"Physics","tp":"Waves","sub":"EM spectrum","lv":["GCSE","A-Level"],"who":"James Clerk Maxwell, Thomas Sutton","f":0,"loc":"Scotland / UK","rg":["Europe"],"yr":1861,"era":"1800s","tag":"Discovery","x":"At school in Edinburgh, James Clerk Maxwell's country clothes and accent earned him the nickname 'Dafty'. By 14 he had published a paper on drawing ovals. In 1861 he showed the first colour photograph: a tartan ribbon photographed three times through red, green and blue filters by Thomas Sutton, then projected together. In 1865 he combined electricity and magnetism into four equations and calculated that electromagnetic waves would travel at the speed of light – showing that light itself is an electromagnetic wave.","q":"Why does combining red, green and blue light make full colour?"},{"id":"phys2-011","t":"Marconi sends a signal across the Atlantic","s":"Physics","tp":"Waves","sub":"Radio waves","lv":["KS3","GCSE"],"who":"Guglielmo Marconi","f":0,"loc":"UK / Canada / Italy","rg":["North & Central America","Europe"],"yr":1901,"era":"1900–1949","tag":"Discovery","x":"Experts believed radio waves travelled in straight lines and could not follow the curve of the Earth. On 12 December 1901, Guglielmo Marconi, in Newfoundland, held an earphone attached to an aerial lifted by a kite and heard three faint clicks – the letter S in Morse code – sent from his station at Poldhu in Cornwall, over 3,500 km away. The waves had bounced off a then-unknown layer of the upper atmosphere, the ionosphere. Earlier, in 1897, Marconi had sent the first radio message across open sea, between Lavernock Point near Penarth and Flat Holm in the Bristol Channel.","q":"How can the ionosphere help radio waves travel around the Earth?"},{"id":"phys2-012","t":"C. V. Raman and the blue of the sea","s":"Physics","tp":"Waves","sub":"Scattering","lv":["GCSE","A-Level"],"who":"C. V. Raman, K. S. Krishnan","f":0,"loc":"India","rg":["South Asia"],"yr":1928,"era":"1900–1949","tag":"Discovery","x":"On a voyage back to India from Britain in 1921, C. V. Raman used a small prism and polarising filter to look at the Mediterranean and decided that the sea's blue was not just a reflection of the sky, but came from light scattered by water molecules. Back in Calcutta, with K. S. Krishnan, he found in 1928 that when light scatters off molecules, a tiny fraction changes colour, revealing information about the molecule – the Raman effect. In 1930 he became the first Asian to win a Nobel Prize in science. India celebrates 28 February as National Science Day in his honour.","q":"How can scattered light reveal what a substance is made of?"},{"id":"phys2-013","t":"Satyendra Nath Bose writes to Einstein","s":"Physics","tp":"Quantum","sub":"Bosons","lv":["A-Level"],"who":"Satyendra Nath Bose, Albert Einstein","f":0,"loc":"India / Germany","rg":["South Asia","Europe"],"yr":1924,"era":"1900–1949","tag":"Hidden figure","x":"In 1924, Satyendra Nath Bose, a lecturer in Dhaka (now in Bangladesh), worked out a new way to count photons that explained Planck's law for black-body radiation. A British journal rejected his paper, so he sent it directly to Einstein. Einstein was so impressed that he translated it into German himself and got it published, then extended the idea to atoms. This led to the prediction of the Bose–Einstein condensate, first made in 1995. Particles that follow Bose's rules, such as photons and the Higgs boson, are called bosons in his honour.","q":"What is special about how bosons behave?"},{"id":"phys2-014","t":"Hideki Yukawa and the meson","s":"Physics","tp":"Particle physics","sub":"Strong force","lv":["A-Level"],"who":"Hideki Yukawa","f":0,"loc":"Japan","rg":["East Asia"],"yr":1935,"era":"1900–1949","tag":"Discovery","x":"What holds protons and neutrons together in a nucleus, when protons repel each other? In 1935 Hideki Yukawa in Osaka predicted that a new particle, about 200 times heavier than an electron, carries the strong force between them. It became known as the meson. The pion discovered in 1947 matched his prediction. In 1949 Yukawa became the first Japanese person to win a Nobel Prize. He later campaigned against nuclear weapons.","q":"Why does a heavy exchange particle mean the strong force has a short range?"},{"id":"phys2-015","t":"Bibha Chowdhuri: an eye for cosmic rays","s":"Physics","tp":"Particle physics","sub":"Cosmic rays","lv":["GCSE","A-Level"],"who":"Bibha Chowdhuri, Debendra Mohan Bose","f":1,"loc":"India","rg":["South Asia"],"yr":1940,"era":"1900–1949","tag":"Hidden figure","x":"From 1938 to 1942, Bibha Chowdhuri and D. M. Bose at the Bose Institute in Calcutta exposed photographic plates to cosmic rays on mountains in the Himalayas, at Darjeeling and Sandakphu, then studied the tracks under microscopes. Their papers in Nature reported particles from cosmic rays with mass between that of an electron and a proton – mesons. Wartime shortages meant they could only get less sensitive plates, so they could not measure the mass precisely. Powell's team, with better plates, discovered the pion in 1947 and won the Nobel. Chowdhuri later joined Homi Bhabha's institute in Mumbai.","q":"Why are photographic plates useful as particle detectors?"},{"id":"phys2-016","t":"Abdus Salam: from a village to the Nobel","s":"Physics","tp":"Particle physics","sub":"Electroweak theory","lv":["A-Level"],"who":"Abdus Salam","f":0,"loc":"Pakistan / UK / Italy","rg":["South Asia","Europe"],"yr":1979,"era":"1950–1999","tag":"Discovery","x":"Abdus Salam grew up in Jhang, Punjab, in what is now Pakistan, studying by the light of an oil lamp. He won a scholarship to Cambridge and helped show that electromagnetism and the weak nuclear force are two aspects of one 'electroweak' force. In 1979 he became the first Pakistani and first Muslim to win a Nobel Prize in science. He founded the International Centre for Theoretical Physics in Trieste, Italy, so that scientists from developing countries would not have to leave home to do research.","q":"Why does it matter that scientists from all countries can do research?"},{"id":"phys2-017","t":"Cockcroft and Walton split the atom","s":"Physics","tp":"Atoms and radioactivity","sub":"Accelerators","lv":["GCSE","A-Level"],"who":"John Cockcroft, Ernest Walton","f":0,"loc":"UK / Ireland","rg":["Europe"],"yr":1932,"era":"1900–1949","tag":"Discovery","x":"In April 1932, in Cambridge, John Cockcroft and the Irish physicist Ernest Walton fired protons accelerated through several hundred thousand volts at lithium. Walton, sitting in a small darkened hut, saw flashes on a screen: lithium nuclei were splitting into two alpha particles. It was the first nuclear reaction triggered by artificially accelerated particles, and it confirmed E = mc². Rutherford insisted on squeezing into the hut to see it himself. Walton remains Ireland's only Nobel laureate in science.","q":"Write the nuclear equation for a proton hitting lithium-7."},{"id":"phys2-018","t":"John Logie Baird's hatbox television","s":"Physics","tp":"Waves","sub":"Technology","lv":["KS3","GCSE"],"who":"John Logie Baird","f":0,"loc":"Scotland / UK","rg":["Europe"],"yr":1926,"era":"1900–1949","tag":"Invention","x":"John Logie Baird was a sickly Scottish engineer who, after failing at businesses including selling soap and jam, began building a television in Hastings. His first apparatus used a hatbox, a tea chest, darning needles, bicycle lamp lenses and a rotating cardboard disc with holes. In January 1926, in a room in Soho, he demonstrated moving pictures of a ventriloquist's dummy's head, nicknamed Stooky Bill. His mechanical system was soon replaced by electronic television, but in 1928 he sent pictures across the Atlantic.","q":"How does a spinning disc with holes scan a picture?"},{"id":"phys2-019","t":"Robert Recorde from Tenby invents '='","s":"Physics","tp":"Measurement","sub":"Mathematics","lv":["KS3","GCSE"],"who":"Robert Recorde","f":0,"loc":"Wales","rg":["Europe"],"yr":1557,"era":"1500–1699","tag":"Invention","x":"Robert Recorde, born in Tenby, Pembrokeshire, around 1512, was a physician and mathematician who wrote popular textbooks in English rather than Latin. In 'The Whetstone of Witte' in 1557 he introduced the equals sign, explaining that he used a pair of parallel lines because no two things can be more equal. He also introduced the plus and minus signs to English readers. Sadly, he died in a debtors' prison in 1558. A memorial in St Mary's Church, Tenby, honours him.","q":"Why did writing science in English rather than Latin matter?"},{"id":"phys2-020","t":"William Jones of Anglesey and π","s":"Physics","tp":"Measurement","sub":"Mathematics","lv":["KS3","GCSE"],"who":"William Jones, Leonhard Euler","f":0,"loc":"Wales","rg":["Europe"],"yr":1706,"era":"1700s","tag":"Discovery","x":"William Jones was born on Anglesey in 1675, the son of a farmer. Spotted for his talent at mathematics, he became a teacher and a friend of Newton. In 1706 he became the first person to use the Greek letter π for the ratio of a circle's circumference to its diameter. The symbol caught on after the great mathematician Leonhard Euler adopted it in the 1730s. His son, also William Jones, became a famous scholar of languages who noticed the links between Sanskrit, Latin and Greek.","q":"How could you estimate π using string and circular objects?"},{"id":"phys2-021","t":"William Grove's gas battery","s":"Chemistry","tp":"Electrochemistry","sub":"Fuel cells","lv":["GCSE","A-Level"],"who":"William Grove","f":0,"loc":"Wales","rg":["Europe"],"yr":1842,"era":"1800s","tag":"Invention","x":"William Grove, born in Swansea in 1811, was a lawyer and a scientist. In 1842 he built a 'gas voltaic battery': strips of platinum in tubes of hydrogen and oxygen, dipping into dilute acid, produced an electric current, with water as the only product. It was the first fuel cell. Nobody found a practical use for over a century, until fuel cells powered NASA's Gemini and Apollo spacecraft and provided astronauts with drinking water. Grove also invented a powerful battery used in early telegraphs.","q":"Why is a hydrogen fuel cell described as clean?"},{"id":"phys2-022","t":"Edward 'Taffy' Bowen and airborne radar","s":"Physics","tp":"Waves","sub":"Radar","lv":["GCSE"],"who":"Edward George Bowen","f":0,"loc":"Wales / UK / Australia","rg":["Oceania","Europe"],"yr":1937,"era":"1900–1949","tag":"Wartime","x":"Edward Bowen, from Swansea, joined Robert Watson-Watt's secret team developing radar in 1935. His task was to make radar small and light enough to fit in an aircraft. By 1937 his airborne set could detect ships at sea. Airborne radar helped RAF night fighters find enemy bombers and Coastal Command find submarines. In 1940 he carried the top-secret cavity magnetron to the USA in a deed box as part of the Tizard Mission. After the war he moved to Australia and helped build the Parkes radio telescope.","q":"How does radar measure the distance to a target?"},{"id":"phys2-023","t":"Joan Curran's 'Window'","s":"Physics","tp":"Waves","sub":"Radar","lv":["GCSE","A-Level"],"who":"Joan Curran, Samuel Curran, R. V. Jones","f":1,"loc":"Wales / UK","rg":["Europe"],"yr":1942,"era":"1900–1949","tag":"Hidden figure","x":"Joan Strothers was born in Swansea in 1916, the daughter of an optician, and won a scholarship to Cambridge – which then did not award degrees to women. During the Second World War she joined the British radar countermeasures team. She devised 'Window': clouds of strips of aluminium foil, cut to about half the wavelength of enemy radar so that each acted as a resonating dipole, dropped from bombers to swamp German radar screens with false echoes. Window was used in the raids on Hamburg in 1943, and on D-Day to fake an invasion fleet heading for Calais. Today it is called chaff and is still used.","q":"Why must the foil strips be about half a radar wavelength long?"},{"id":"phys2-024","t":"Beatrice Shilling fixes the Spitfire","s":"Physics","tp":"Forces and motion","sub":"Engineering","lv":["KS3","GCSE"],"who":"Beatrice Shilling","f":1,"loc":"UK","rg":["Europe"],"yr":1941,"era":"1900–1949","tag":"Hidden figure","x":"Beatrice 'Tilly' Shilling was an engineer and motorbike racer who lapped Brooklands at over 100 mph. In the Battle of Britain, RAF Spitfire and Hurricane pilots had a deadly problem: when they pushed the nose down sharply into a dive, the negative g-force made fuel flood their carburettors, and the engine spluttered or cut out, while German fighters with fuel injection simply dived away. In 1941 Shilling designed a small metal disc with a hole in it that limited the fuel flow. Pilots called it 'Miss Shilling's orifice'. It was a stopgap until better carburettors arrived, but it saved many lives.","q":"Why does negative g affect fuel in a float carburettor?"},{"id":"phys2-025","t":"Katharine Blodgett's invisible glass","s":"Physics","tp":"Waves","sub":"Interference","lv":["GCSE","A-Level"],"who":"Katharine Burr Blodgett, Irving Langmuir","f":1,"loc":"USA","rg":["North & Central America"],"yr":1938,"era":"1900–1949","tag":"Hidden figure","x":"Katharine Blodgett was the first woman to earn a physics PhD from Cambridge, in 1926, and the first woman scientist hired by General Electric. Building on Irving Langmuir's work, she developed a way to lay down soap-like films on glass one molecule at a time. In 1938 she found that a coating 44 molecules thick – about a quarter of a wavelength of visible light – made reflections from the top and bottom of the film cancel out by destructive interference. The result was 'invisible' non-reflective glass, later used in cameras, spectacles and telescopes.","q":"Why must the coating be a quarter of a wavelength thick?"},{"id":"phys2-026","t":"Mária Telkes, the Sun Queen","s":"Physics","tp":"Energy","sub":"Renewable energy","lv":["KS3","GCSE"],"who":"Mária Telkes, Eleanor Raymond, Amelia Peabody","f":1,"loc":"Hungary / USA","rg":["North & Central America","Europe"],"yr":1948,"era":"1900–1949","tag":"Hidden figure","x":"Mária Telkes, from Budapest, became fascinated by solar energy as a schoolgirl. In 1948, with architect Eleanor Raymond and funded by sculptor Amelia Peabody – three women in an almost all-male field – she built the Dover Sun House in Massachusetts, one of the first homes heated by the Sun. Sunlight warmed air that melted Glauber's salt in the walls; as the salt solidified at night, it released stored energy. She also invented a solar oven and a solar still that turned seawater into drinking water, used in lifeboat kits.","q":"Why does a substance release energy when it freezes?"},{"id":"phys2-027","t":"Emmy Noether: symmetry and conservation","s":"Physics","tp":"Forces and motion","sub":"Conservation laws","lv":["A-Level"],"who":"Emmy Noether, David Hilbert, Albert Einstein","f":1,"loc":"Germany / USA","rg":["North & Central America","Europe"],"yr":1915,"era":"1900–1949","tag":"Hidden figure","x":"Emmy Noether was a brilliant mathematician who, as a woman, was not allowed to hold a paid position at Göttingen University; for years she lectured under David Hilbert's name. Hilbert argued that a university was not a bath-house, so the sex of a lecturer shouldn't matter. In 1915 she proved what is now called Noether's theorem: every symmetry in nature corresponds to a conservation law. Because the laws of physics are the same today as tomorrow, energy is conserved; because they are the same everywhere, momentum is conserved. Einstein called her a creative mathematical genius. As a Jewish woman, she fled Nazi Germany in 1933 to the USA.","q":"Why does symmetry in time lead to conservation of energy?"},{"id":"phys2-028","t":"Laura Bassi: Europe's first woman physics professor","s":"Physics","tp":"How science works","sub":"Women in science","lv":["KS3","GCSE"],"who":"Laura Bassi","f":1,"loc":"Italy","rg":["Europe"],"yr":1732,"era":"1700s","tag":"Hidden figure","x":"In 1732, aged 21, Laura Bassi defended 49 theses in philosophy in a public debate in Bologna and became the second woman in Europe to earn a university degree. She was then appointed to teach at the University of Bologna. She ran a physics laboratory in her home, where she and her husband did experiments on electricity and taught students, and she championed Newton's physics in Italy. In 1776 she became professor of experimental physics, making her the first woman to hold a chair in physics at a European university. She had eight children.","q":"What barriers did women in science face in the 1700s?"},{"id":"phys2-029","t":"Maria Goeppert Mayer: unpaid for years","s":"Physics","tp":"Atoms and radioactivity","sub":"Nuclear shell model","lv":["A-Level"],"who":"Maria Goeppert Mayer, Enrico Fermi","f":1,"loc":"Germany / USA","rg":["North & Central America","Europe"],"yr":1949,"era":"1900–1949","tag":"Hidden figure","x":"Maria Goeppert Mayer earned her physics PhD in Göttingen, but in the USA university rules often barred wives of professors from paid jobs. For years she worked as an unpaid 'volunteer'. In 1949, after Enrico Fermi asked her a question about spin, she worked out the nuclear shell model, explaining why nuclei with certain 'magic numbers' of protons or neutrons are especially stable. In 1963 she became only the second woman to win the Nobel Prize in Physics, after Marie Curie. A local newspaper headline still described her as a mother winning the prize.","q":"Why are some nuclei more stable than others?"},{"id":"phys2-030","t":"Vera Rubin and the galaxies that spin too fast","s":"Physics","tp":"Space","sub":"Dark matter","lv":["GCSE","A-Level"],"who":"Vera Rubin, Kent Ford","f":1,"loc":"USA","rg":["North & Central America"],"yr":1970,"era":"1950–1999","tag":"Hidden figure","x":"As a girl, Vera Rubin watched stars from her bedroom window. Princeton did not accept women into its astronomy graduate programme, so she studied elsewhere. In the 1970s, with Kent Ford, she measured how fast stars orbit in the outer parts of spiral galaxies. Instead of slowing down far from the centre, as with planets around the Sun, they kept moving fast. Galaxies must contain much more mass than we can see – strong evidence for dark matter. When she was first allowed to observe at Palomar Observatory, there was no women's toilet; she cut out a paper skirt and stuck it to the men's toilet sign. The Vera C. Rubin Observatory in Chile is named after her.","q":"How does a flat rotation curve suggest invisible mass?"},{"id":"phys2-031","t":"Donna Strickland and the most intense laser pulses","s":"Physics","tp":"Waves","sub":"Lasers","lv":["GCSE","A-Level"],"who":"Donna Strickland, Gérard Mourou, Theodore Maiman","f":1,"loc":"Canada / France / USA","rg":["North & Central America","Europe"],"yr":1985,"era":"1950–1999","tag":"Discovery","x":"The first laser was built by Theodore Maiman in 1960 using a ruby crystal; it was called a solution looking for a problem. In 1985, PhD student Donna Strickland and her supervisor Gérard Mourou found how to make incredibly short, intense laser pulses without destroying the equipment: stretch the pulse out, amplify it, then compress it again. Their technique is used in laser eye surgery. In 2018 Strickland became only the third woman to win the Nobel Prize in Physics. At the time she was an associate professor, and she did not even have a Wikipedia page until after the announcement.","q":"Why does stretching a pulse protect the amplifier?"},{"id":"phys2-032","t":"Andrea Ghez watches stars orbit a black hole","s":"Physics","tp":"Space","sub":"Black holes","lv":["GCSE","A-Level"],"who":"Andrea Ghez, Reinhard Genzel","f":1,"loc":"USA / Germany / Hawaiʻi","rg":["Oceania","North & Central America","Europe"],"yr":1998,"era":"1950–1999","tag":"Discovery","x":"For over 20 years, Andrea Ghez's team used the Keck telescopes on Mauna Kea in Hawaiʻi, and Reinhard Genzel's group used telescopes in Chile, to track stars near the centre of our galaxy. They used adaptive optics to undo the blurring of Earth's atmosphere. The stars whip around an invisible point at thousands of kilometres per second; one completes an orbit in 16 years. Their speeds reveal a mass of about 4 million Suns packed into a tiny space – a supermassive black hole. Ghez and Genzel shared the 2020 Nobel Prize.","q":"How can you work out a mass from an orbit?"},{"id":"phys2-033","t":"Anne L'Huillier's attosecond flashes","s":"Physics","tp":"Waves","sub":"Light","lv":["A-Level"],"who":"Anne L'Huillier, Pierre Agostini, Ferenc Krausz","f":1,"loc":"France / Sweden","rg":["Europe"],"yr":1987,"era":"1950–1999","tag":"Modern research","x":"Electrons move inside atoms so quickly that studying them is like trying to photograph a hummingbird's wings with a slow camera. In 1987 Anne L'Huillier, in France, found that shining an intense infrared laser through a gas produced many higher 'overtones' of light. These can be combined into flashes lasting attoseconds – billionths of a billionth of a second. She was teaching a class in Sweden when the Nobel committee phoned in 2023 to say she had won the Nobel Prize in Physics; she went back to finish the lecture.","q":"How many attoseconds are there in one second?"},{"id":"phys2-034","t":"Katherine Johnson: 'get the girl to check the numbers'","s":"Physics","tp":"Space","sub":"Orbits","lv":["KS3","GCSE"],"who":"Katherine Johnson, Dorothy Vaughan, Mary Jackson, John Glenn","f":1,"loc":"USA","rg":["North & Central America"],"yr":1962,"era":"1950–1999","tag":"Hidden figure","x":"At NASA's Langley centre, African American women mathematicians worked as 'human computers', at first in a segregated office led by Dorothy Vaughan. Katherine Johnson calculated trajectories for the first American human spaceflight in 1961. In 1962, before John Glenn became the first American to orbit Earth, the orbit had been computed by electronic computers, but Glenn asked for Johnson to check the numbers by hand. Mary Jackson became NASA's first Black female engineer. Their stories were told in the book and film 'Hidden Figures'. Johnson also worked on Apollo 11 and lived to 101.","q":"Why would an astronaut trust a person over a new computer?"},{"id":"phys2-035","t":"Margaret Hamilton saves the Moon landing","s":"Physics","tp":"Space","sub":"Spaceflight","lv":["KS3","GCSE"],"who":"Margaret Hamilton","f":1,"loc":"USA","rg":["North & Central America"],"yr":1969,"era":"1950–1999","tag":"Hidden figure","x":"Margaret Hamilton led the MIT team writing the software for the Apollo guidance computer, and helped invent the term 'software engineering'. Minutes before Apollo 11 landed in July 1969, alarms began flashing as the computer was overloaded with data from a radar. Because her team had designed the software to drop less important tasks and keep the essential ones running, the landing continued. A famous photo shows her standing next to a stack of printed code as tall as herself.","q":"Why is it important to design systems that can cope with errors?"},{"id":"phys2-036","t":"Valentina Tereshkova: the first woman in space","s":"Physics","tp":"Space","sub":"Spaceflight","lv":["KS3","GCSE"],"who":"Valentina Tereshkova, Yuri Gagarin","f":1,"loc":"Russia","rg":["Europe"],"yr":1963,"era":"1950–1999","tag":"Discovery","x":"Valentina Tereshkova worked in a textile factory and was an amateur parachutist when she was chosen for the Soviet space programme. On 16 June 1963, aged 26, she flew alone aboard Vostok 6, orbiting Earth 48 times in nearly three days – longer than all American astronauts' flights up to then combined. Her call sign was Chaika (Seagull). Like Yuri Gagarin two years earlier, she ejected and parachuted to the ground. It was nearly 20 years before another woman went into space.","q":"What forces act on a spacecraft in orbit?"},{"id":"phys2-037","t":"Yuri Gagarin lands in a field","s":"Physics","tp":"Space","sub":"Spaceflight","lv":["KS3","GCSE"],"who":"Yuri Gagarin","f":0,"loc":"Russia","rg":["Europe"],"yr":1961,"era":"1950–1999","tag":"Discovery","x":"On 12 April 1961, Yuri Gagarin became the first human in space, completing one orbit of Earth in 108 minutes aboard Vostok 1. As he lifted off he called out 'Poyekhali!' – 'Let's go!'. He ejected from the capsule at about 7 km and parachuted down near Saratov, where a farmer's wife and her granddaughter saw a man in an orange suit and helmet walking towards them. He reassured them that he was Soviet, and had come from space.","q":"Why does a spacecraft need to reach about 8 km/s to orbit?"},{"id":"phys2-038","t":"The hammer and the feather on the Moon","s":"Physics","tp":"Forces and motion","sub":"Free fall","lv":["KS3","GCSE"],"who":"David Scott","f":0,"loc":"Moon / USA","rg":["Space","North & Central America"],"yr":1971,"era":"1950–1999","tag":"Discovery","x":"Galileo argued that, without air resistance, all objects fall at the same rate. On 2 August 1971, at the end of a moonwalk, Apollo 15 commander David Scott held up a geologist's hammer and a falcon feather – a nod to the mission's lunar module, Falcon – and dropped them together on live television. They hit the dusty surface at the same moment. He remarked that Mr Galileo was correct. In 2014 the BBC filmed a bowling ball and feathers falling together in NASA's giant vacuum chamber in Ohio.","q":"Why does a feather fall slower than a hammer on Earth?"},{"id":"phys2-039","t":"Apollo 13's square peg in a round hole","s":"Biology","tp":"Body systems","sub":"Carbon dioxide","lv":["KS3","GCSE"],"who":"Jim Lovell, Ed Smith","f":0,"loc":"USA / Space","rg":["Space","North & Central America"],"yr":1970,"era":"1950–1999","tag":"Accident","x":"In April 1970, an oxygen tank exploded on Apollo 13 on the way to the Moon. The three astronauts sheltered in the small lunar module, but its filters for removing carbon dioxide were round, while the spare ones from the command module were square. As carbon dioxide levels rose dangerously, engineers on the ground worked out how to connect the square filters using only things on board: plastic bags, cardboard from a flight manual and duct tape. The astronauts built it and survived the journey home.","q":"Why is a build-up of carbon dioxide dangerous?"},{"id":"phys2-040","t":"Sputnik's beep","s":"Physics","tp":"Space","sub":"Satellites","lv":["KS3","GCSE"],"who":"Sergei Korolev","f":0,"loc":"Russia / Kazakhstan","rg":["Central Asia","Europe"],"yr":1957,"era":"1950–1999","tag":"Discovery","x":"On 4 October 1957, the Soviet Union launched Sputnik 1, a polished metal sphere 58 cm across with four long antennae, from Baikonur in Kazakhstan. It orbited Earth every 96 minutes, transmitting a simple beep-beep radio signal that amateur radio operators worldwide could pick up. Its chief designer, Sergei Korolev, was kept secret for most of his life. Sputnik shocked the USA and started the space race. Its batteries died after three weeks and it burned up in the atmosphere in January 1958.","q":"Why does a satellite's orbit slowly decay?"},{"id":"phys2-041","t":"ISRO's Mars mission on a budget","s":"Physics","tp":"Space","sub":"Spaceflight","lv":["KS3","GCSE"],"who":"Ritu Karidhal, Nandini Harinath, Minal Rohit","f":1,"loc":"India","rg":["South Asia"],"yr":2014,"era":"2000 onwards","tag":"Modern research","x":"In September 2014, India's Mangalyaan spacecraft entered orbit around Mars on its first attempt – the first Asian nation to reach Mars orbit. The mission cost about $74 million, less than the budget of the Hollywood space film Gravity. A photo of women scientists at ISRO celebrating in saris went around the world; engineers including Ritu Karidhal, Nandini Harinath and Minal Rohit played key roles. In 2023 India's Chandrayaan-3 made the first landing near the Moon's south pole.","q":"Why does a mission to Mars use gravity and careful timing to save fuel?"},{"id":"phys2-042","t":"Chang'e 4 on the far side of the Moon","s":"Physics","tp":"Space","sub":"The Moon","lv":["KS3","GCSE"],"who":"","f":0,"loc":"China","rg":["East Asia"],"yr":2019,"era":"2000 onwards","tag":"Modern research","x":"We always see the same side of the Moon because it rotates once for every orbit. The far side is not dark – it gets just as much sunlight – but radio signals can't reach Earth from it directly. In January 2019, China's Chang'e 4 made the first soft landing on the far side, relaying signals through a satellite called Queqiao placed beyond the Moon. Its rover, Yutu-2, explored for years, and the lander even sprouted cotton seeds. In 2024, Chang'e 6 brought the first samples from the far side back to Earth.","q":"Why do we always see the same face of the Moon?"},{"id":"phys2-043","t":"Voyager's golden record","s":"Physics","tp":"Space","sub":"Spaceflight","lv":["KS3","GCSE"],"who":"Carl Sagan, Ann Druyan, Linda Salzman Sagan","f":1,"loc":"USA","rg":["North & Central America"],"yr":1977,"era":"1950–1999","tag":"Everyday","x":"Each Voyager spacecraft carries a gold-plated copper record, in case it is ever found by intelligent life. A team led by Carl Sagan, with Ann Druyan as creative director and Linda Salzman Sagan organising greetings, chose 115 images, natural sounds such as surf, thunder and a mother's kiss, greetings in 55 languages and 90 minutes of music from around the world, from Bach to Navajo night chants and Azerbaijani folk music. Instructions engraved on the cover show how to play it and where Earth is, using pulsars as a map.","q":"What would you put on a message to aliens, and why?"},{"id":"phys2-044","t":"Pale Blue Dot","s":"Physics","tp":"Space","sub":"Solar system","lv":["KS3","GCSE"],"who":"Carl Sagan, Candice Hansen-Koharcheck","f":1,"loc":"USA","rg":["North & Central America"],"yr":1990,"era":"1950–1999","tag":"Discovery","x":"On 14 February 1990, at Carl Sagan's suggestion, Voyager 1, then about 6 billion kilometres away, turned its camera back towards the inner solar system and took a family portrait of the planets. In one frame, Earth is a tiny point of light less than a pixel across, caught in a beam of scattered sunlight. Planetary scientist Candice Hansen-Koharcheck helped plan the images. Sagan wrote that every human who ever lived lived on that mote of dust.","q":"How long does light from the Sun take to reach Voyager 1?"},{"id":"phys2-045","t":"LIGO hears two black holes collide","s":"Physics","tp":"Space","sub":"Gravitational waves","lv":["GCSE","A-Level"],"who":"Rainer Weiss, Kip Thorne, Barry Barish, Marco Drago","f":0,"loc":"USA / Italy / Germany","rg":["North & Central America","Europe"],"yr":2015,"era":"2000 onwards","tag":"Discovery","x":"On 14 September 2015, just days after an upgrade, both LIGO detectors in the USA – 3,000 km apart – recorded a tiny chirp. Their 4-km-long arms had changed length by less than a thousandth of a proton's width. The Italian researcher Marco Drago, working in Germany, was first to notice the signal on his screen. It came from two black holes, each around 30 times the Sun's mass, merging 1.3 billion years ago. Einstein had predicted gravitational waves in 1916 but doubted they could ever be detected. The 2017 Nobel Prize followed.","q":"Why are two detectors far apart better than one?"},{"id":"phys2-046","t":"The Millennium Bridge wobble","s":"Physics","tp":"Waves","sub":"Resonance","lv":["KS3","GCSE","A-Level"],"who":"","f":0,"loc":"UK","rg":["Europe"],"yr":2000,"era":"2000 onwards","tag":"Blunder","x":"London's Millennium Bridge, a sleek steel footbridge across the Thames, opened on 10 June 2000. As crowds crossed, it began swaying sideways. People instinctively adjusted their steps to keep their balance, walking in time with the sway, which made it sway more – a feedback loop. It closed after two days and was nicknamed the 'Wobbly Bridge'. Engineers fitted dozens of dampers, like giant shock absorbers, and it reopened in 2002. The famous Tacoma Narrows Bridge collapse of 1940 in the USA was caused by a related problem of wind-driven oscillation.","q":"How do dampers stop a bridge oscillating?"},{"id":"phys2-047","t":"Benjamin Banneker's wooden clock","s":"Physics","tp":"Measurement","sub":"Time","lv":["KS3","GCSE"],"who":"Benjamin Banneker","f":0,"loc":"USA","rg":["North & Central America"],"yr":1753,"era":"1700s","tag":"Hidden figure","x":"Benjamin Banneker, a free Black farmer in Maryland whose grandmother had been an English indentured servant and grandfather a formerly enslaved African, was largely self-taught. In 1753, aged about 22, after studying a borrowed pocket watch, he carved a clock almost entirely from wood, which struck the hours and kept time for decades. He later taught himself astronomy, predicted a solar eclipse and published almanacs. In 1791 he helped survey the land for the new US capital, Washington DC, and wrote to Thomas Jefferson challenging his views on slavery.","q":"What makes a pendulum clock keep good time?"},{"id":"phys2-048","t":"Brian Josephson: the Cardiff-born Nobel winner","s":"Physics","tp":"Quantum","sub":"Superconductors","lv":["A-Level"],"who":"Brian Josephson","f":0,"loc":"Wales / UK","rg":["Europe"],"yr":1962,"era":"1950–1999","tag":"Discovery","x":"Brian Josephson was born in Cardiff in 1940. In 1962, aged 22 and still a PhD student at Cambridge, he predicted that a current could flow between two superconductors separated by a thin insulating barrier, with no voltage applied – a quantum tunnelling effect. It was confirmed soon after, and in 1973, aged 33, he won the Nobel Prize in Physics. Josephson junctions are now used in extremely sensitive magnetic field detectors called SQUIDs, used in brain scanning, and in some quantum computers.","q":"What is quantum tunnelling?"},{"id":"bio3-001","t":"Hooke names the cell","s":"Biology","tp":"Cells","sub":"Microscopy","lv":["KS3","GCSE"],"who":"Robert Hooke","f":0,"loc":"UK","rg":["Europe"],"yr":1665,"era":"1500–1699","tag":"Discovery","x":"In 1665 Robert Hooke sliced a thin piece of cork with a penknife and looked at it through his microscope. He saw tiny empty boxes packed together like a honeycomb and called them 'cells', because they reminded him of the small rooms monks lived in. He was actually seeing the dead cell walls of cork oak bark. His book Micrographia, full of huge engravings of fleas, lice and mould, became a bestseller.","q":"Why did Hooke only see empty boxes and not living contents?"},{"id":"bio3-002","t":"Ernst Ruska's electron microscope","s":"Biology","tp":"Cells","sub":"Microscopy","lv":["GCSE","A-Level"],"who":"Ernst Ruska, Max Knoll, Helmut Ruska","f":0,"loc":"Germany","rg":["Europe"],"yr":1931,"era":"1900–1949","tag":"Invention","x":"Light microscopes cannot show details smaller than about 200 nm, because the wavelength of light is too long. In 1931 the young engineer Ernst Ruska and Max Knoll in Berlin used magnetic coils to focus beams of electrons, which have a much shorter wavelength. By 1933 their microscope beat the best light microscopes. Ruska's brother Helmut, a doctor, used it to take the first pictures of viruses. Ernst Ruska won a Nobel Prize in 1986 – 55 years after his invention.","q":"Why can electron microscopes see smaller objects than light microscopes?"},{"id":"bio3-003","t":"Golgi's black reaction in a kitchen","s":"Biology","tp":"Cells","sub":"Organelles","lv":["GCSE","A-Level"],"who":"Camillo Golgi","f":0,"loc":"Italy","rg":["Europe"],"yr":1873,"era":"1800s","tag":"Accident","x":"In 1873 Camillo Golgi was a doctor at a hospital for the chronically ill in Abbiategrasso, near Milan, and set up a tiny laboratory in his kitchen. Experimenting with stains, he found that soaking brain tissue in potassium dichromate and then silver nitrate turned a few nerve cells completely black – the 'black reaction'. Later he used it to spot a network of membranes in cells, now called the Golgi apparatus. For decades many scientists thought it was just a staining artefact until electron microscopes proved it real.","q":"What does the Golgi apparatus do in a cell?"},{"id":"bio3-004","t":"Peter Mitchell's farmhouse laboratory","s":"Biology","tp":"Cells","sub":"Respiration","lv":["A-Level"],"who":"Peter Mitchell, Jennifer Moyle","f":1,"loc":"UK","rg":["Europe"],"yr":1961,"era":"1950–1999","tag":"Eccentric","x":"How do mitochondria make ATP? In 1961 Peter Mitchell proposed that they pump protons across a membrane, building up a gradient that drives ATP production like water through a mill – chemiosmosis. Most biochemists thought it absurd. Ill with stomach ulcers, Mitchell left Edinburgh, restored a derelict mansion, Glynn House in Cornwall, and set up his own lab there with his long-time collaborator Jennifer Moyle. Their experiments proved him right, and he won the 1978 Nobel Prize.","q":"How is a proton gradient like water behind a dam?"},{"id":"bio3-005","t":"Hans Krebs: rejected by Nature","s":"Biology","tp":"Cells","sub":"Respiration","lv":["A-Level"],"who":"Hans Krebs, William Johnson","f":0,"loc":"Germany / UK","rg":["Europe"],"yr":1937,"era":"1900–1949","tag":"Discovery","x":"Hans Krebs, a Jewish doctor, was dismissed from his job in Germany in 1933 and moved to Britain. In Sheffield in 1937, with his student William Johnson, he worked out the cycle of reactions that breaks down fuel molecules in respiration, releasing carbon dioxide. He sent the paper to Nature, which returned it saying it had too many papers waiting. It was published in a Dutch journal instead. The Krebs cycle won him the 1953 Nobel Prize. Nature later called its rejection one of its most famous mistakes.","q":"Where in the cell does the Krebs cycle take place?"},{"id":"bio3-006","t":"Jean Hanson and sliding muscles","s":"Biology","tp":"Body systems","sub":"Muscles","lv":["A-Level"],"who":"Jean Hanson, Hugh Huxley, Andrew Huxley, Rolf Niedergerke","f":1,"loc":"UK / USA","rg":["North & Central America","Europe"],"yr":1954,"era":"1950–1999","tag":"Hidden figure","x":"How does muscle contract? In 1954 two pairs of researchers published back-to-back papers in Nature: Jean Hanson and Hugh Huxley, using electron and light microscopes at MIT, and Andrew Huxley (no relation) and Rolf Niedergerke in Cambridge. Both showed that muscle filaments do not shorten themselves – instead, thin and thick filaments slide past each other. Hanson became a leading biophysicist and a Fellow of the Royal Society before her early death in 1973.","q":"What happens to the bands of a muscle fibre when it contracts?"},{"id":"bio3-007","t":"Dutrochet names osmosis","s":"Biology","tp":"Cells","sub":"Osmosis","lv":["KS3","GCSE"],"who":"Henri Dutrochet, Wilhelm Pfeffer","f":0,"loc":"France / Germany","rg":["Europe"],"yr":1827,"era":"1800s","tag":"Discovery","x":"In the 1820s the French physiologist Henri Dutrochet tied animal bladders over tubes containing sugar solution and placed them in water. Water moved in and the liquid rose up the tubes. He named the process osmosis, from the Greek for 'push', and suggested it might explain how sap rises and how cells take in water. In 1877 the German botanist Wilhelm Pfeffer made the first membranes that could measure osmotic pressure precisely, inspiring van 't Hoff's laws of solutions.","q":"Which way does water move between a dilute and a concentrated solution?"},{"id":"bio3-008","t":"Jens Skou's crab nerves and the sodium pump","s":"Biology","tp":"Cells","sub":"Active transport","lv":["A-Level"],"who":"Jens Christian Skou","f":0,"loc":"Denmark","rg":["Europe"],"yr":1957,"era":"1950–1999","tag":"Discovery","x":"Every cell constantly pumps sodium out and potassium in, using energy from ATP. In 1957 the Danish doctor Jens Skou, studying how anaesthetics work, used nerves from thousands of shore crabs bought from local fishermen. He found an enzyme in the membrane that splits ATP only when both sodium and potassium are present – the sodium–potassium pump. It uses about a quarter of the energy you burn at rest, and much more in your brain. Skou won the 1997 Nobel Prize.","q":"Why does active transport need energy when diffusion does not?"},{"id":"bio3-009","t":"Buchner's cell-free fermentation","s":"Biology","tp":"Enzymes","sub":"Enzymes","lv":["GCSE","A-Level"],"who":"Eduard Buchner, Hans Buchner, Louis Pasteur","f":0,"loc":"Germany","rg":["Europe"],"yr":1897,"era":"1800s","tag":"Accident","x":"Pasteur believed fermentation needed living yeast cells. In 1897 Eduard Buchner ground yeast with sand and pressed out the juice to study it for his brother's medical work. To preserve the juice he added lots of sugar – and it began to bubble and produce alcohol, with no living cells present. Chemicals inside cells, not life itself, were doing the work. He named the active substance zymase. This launched the study of enzymes, and Buchner won the 1907 Nobel Prize.","q":"Why did Buchner's result surprise scientists who followed Pasteur?"},{"id":"bio3-010","t":"Payen and Persoz find the first enzyme","s":"Biology","tp":"Enzymes","sub":"Amylase","lv":["KS3","GCSE"],"who":"Anselme Payen, Jean-François Persoz","f":0,"loc":"France","rg":["Europe"],"yr":1833,"era":"1800s","tag":"Discovery","x":"In 1833 the French chemists Anselme Payen and Jean-François Persoz extracted a substance from germinating barley that turned starch into sugar. They called it diastase, from the Greek for 'separation', and the '-ase' ending is still used to name enzymes, such as amylase, lipase and protease. Payen worked in a sugar factory and also discovered cellulose. Brewers had used diastase's effects for thousands of years in malting.","q":"How could you show that an enzyme breaks down starch?"},{"id":"bio3-011","t":"James Sumner crystallises an enzyme with one arm","s":"Biology","tp":"Enzymes","sub":"Proteins","lv":["A-Level"],"who":"James Sumner","f":0,"loc":"USA","rg":["North & Central America"],"yr":1926,"era":"1900–1949","tag":"Discovery","x":"James Sumner lost his left arm in a shooting accident as a boy and was told he could never be a chemist. Undeterred, he spent nine years at Cornell trying to purify the enzyme urease from jack beans. In 1926 he got crystals and showed they were protein, proving enzymes are proteins. Leading German chemists said he must be wrong. He was right, and shared the 1946 Nobel Prize in Chemistry.","q":"Why did crystallising urease show enzymes are proteins?"},{"id":"bio3-012","t":"Maud Menten: enzyme maths and the Model T","s":"Biology","tp":"Enzymes","sub":"Enzyme kinetics","lv":["A-Level"],"who":"Maud Menten, Leonor Michaelis","f":1,"loc":"Canada / Germany / USA","rg":["North & Central America","Europe"],"yr":1913,"era":"1900–1949","tag":"Hidden figure","x":"Maud Menten was one of the first women in Canada to qualify as a doctor. Unable to get research jobs at home, she went to Berlin, and in 1913 with Leonor Michaelis worked out an equation describing how the rate of an enzyme reaction depends on substrate concentration – still taught in every biochemistry course. She later developed a staining method for enzymes in cells, did early electrophoresis on haemoglobin, painted, played the clarinet, climbed mountains, and drove a Model T Ford around Pittsburgh.","q":"Why does an enzyme reaction stop speeding up at high substrate concentration?"},{"id":"bio3-013","t":"Emil Fischer's lock and key","s":"Biology","tp":"Enzymes","sub":"Active site","lv":["GCSE","A-Level"],"who":"Emil Fischer, Daniel Koshland","f":0,"loc":"Germany / USA","rg":["North & Central America","Europe"],"yr":1894,"era":"1800s","tag":"Discovery","x":"In 1894 the German chemist Emil Fischer noticed that some enzymes broke down one form of sugar molecule but not its mirror image. He suggested that an enzyme and its substrate fit together like a lock and key. In 1958 the American Daniel Koshland refined this: the enzyme's active site changes shape slightly as the substrate binds – 'induced fit', more like a glove fitting a hand. Fischer also worked out the structures of sugars and won the 1902 Nobel Prize.","q":"Why does a high temperature stop an enzyme working?"},{"id":"bio3-014","t":"Joseph Goldberger's 'filth parties'","s":"Biology","tp":"Nutrition","sub":"Deficiency diseases","lv":["GCSE"],"who":"Joseph Goldberger, Mary Goldberger","f":1,"loc":"USA","rg":["North & Central America"],"yr":1916,"era":"1900–1949","tag":"Eccentric","x":"Pellagra, causing rashes, diarrhoea and confusion, killed thousands in the poor American South, and most doctors thought it was infectious. Joseph Goldberger noticed that staff in orphanages and asylums never caught it from the patients, and suspected the corn-heavy diet. To prove it was not catching, in 1916 he, his wife Mary and volunteers injected themselves with patients' blood and swallowed capsules of their scabs and waste at 'filth parties'. None got ill. It was later shown to be caused by a lack of niacin, a B vitamin.","q":"How did Goldberger's observations of staff point to diet rather than infection?"},{"id":"bio3-015","t":"Cicely Williams names kwashiorkor","s":"Biology","tp":"Nutrition","sub":"Malnutrition","lv":["GCSE"],"who":"Cicely Williams","f":1,"loc":"Jamaica / Ghana / UK","rg":["Africa","North & Central America","Europe"],"yr":1935,"era":"1900–1949","tag":"Hidden figure","x":"Cicely Williams grew up in Jamaica and was one of the first women to study medicine at Oxford. Working in the Gold Coast (now Ghana) in the 1930s, she studied young children with swollen bellies and peeling skin, which doctors had blamed on pellagra or worms. She showed it was a protein deficiency and used the local Ga word 'kwashiorkor', meaning the illness a baby gets when the next child is born and it is weaned too early. She was later held in a Japanese internment camp in Singapore and became the first head of maternal and child health at the World Health Organization.","q":"Why would weaning a baby onto starchy food alone cause protein deficiency?"},{"id":"bio3-016","t":"Edward Mellanby, dogs and cod liver oil","s":"Biology","tp":"Nutrition","sub":"Vitamins","lv":["GCSE"],"who":"Edward Mellanby, May Mellanby","f":1,"loc":"UK","rg":["Europe"],"yr":1919,"era":"1900–1949","tag":"Discovery","x":"Rickets, which bends children's bones, was common in smoky British cities. In 1919 Edward Mellanby kept puppies indoors on a porridge diet and they developed rickets – unless he added cod liver oil. He thought vitamin A was responsible; others soon showed it was a separate vitamin, D. Sunlight also cured rickets, because skin makes vitamin D in ultraviolet light. His wife May Mellanby showed diet affected children's teeth too.","q":"Why were city children in the 1800s more likely to get rickets?"},{"id":"bio3-017","t":"Gabrielle Matthaei and limiting factors","s":"Biology","tp":"Plants","sub":"Photosynthesis","lv":["GCSE","A-Level"],"who":"Gabrielle Matthaei, Frederick Blackman","f":1,"loc":"UK","rg":["Europe"],"yr":1904,"era":"1900–1949","tag":"Hidden figure","x":"In 1904 Gabrielle Matthaei, working in Cambridge, carried out hundreds of careful experiments measuring carbon dioxide uptake by cherry laurel leaves at different temperatures and light levels. She found that each factor only increases the rate up to a point, when something else becomes limiting. Her data underpinned Frederick Blackman's 1905 'principle of limiting factors', which is often credited to him alone. It is why farmers add carbon dioxide and lighting in greenhouses.","q":"Why does adding more light eventually stop increasing the rate of photosynthesis?"},{"id":"bio3-018","t":"Engelmann's bacteria find the light","s":"Biology","tp":"Plants","sub":"Photosynthesis","lv":["A-Level"],"who":"Theodor Engelmann","f":0,"loc":"Germany","rg":["Europe"],"yr":1882,"era":"1800s","tag":"Discovery","x":"In 1882 Theodor Engelmann shone a tiny spectrum of light, split by a prism, across a strand of green alga under his microscope. He added bacteria that swim towards oxygen. They gathered most thickly where red and blue light fell on the alga, and least in the green. With no gadgets for measuring oxygen, he used living bacteria as his detectors and produced the first action spectrum of photosynthesis.","q":"Why do plants look green if they mostly use red and blue light?"},{"id":"bio3-019","t":"Robin Hill's oxygen from chloroplasts","s":"Biology","tp":"Plants","sub":"Photosynthesis","lv":["A-Level"],"who":"Robert (Robin) Hill","f":0,"loc":"UK","rg":["Europe"],"yr":1937,"era":"1900–1949","tag":"Discovery","x":"In 1937 Robin Hill in Cambridge showed that chloroplasts isolated from leaves could release oxygen in light without any carbon dioxide, as long as a chemical was present to accept electrons. This 'Hill reaction' proved that the oxygen released in photosynthesis comes from splitting water, not from carbon dioxide, and separated photosynthesis into light-dependent and light-independent stages. Hill was also a keen painter and made dyes from plants.","q":"What happens to the oxygen in a water molecule during photosynthesis?"},{"id":"bio3-020","t":"Stephen Hales measures sap pressure","s":"Biology","tp":"Plants","sub":"Transpiration","lv":["GCSE","A-Level"],"who":"Stephen Hales","f":0,"loc":"UK","rg":["Europe"],"yr":1727,"era":"1700s","tag":"Discovery","x":"Stephen Hales was the vicar of Teddington near London and an experimenter. In his 1727 book 'Vegetable Staticks' he described cutting a vine and attaching a tall glass tube: sap rose over 7 metres, showing root pressure. He weighed potted plants to measure water lost through leaves (transpiration) and found a sunflower lost more water than a person drinks in a day. He also made the first measurement of blood pressure, by inserting a glass tube into a horse's artery.","q":"How could you measure how much water a plant loses through its leaves?"},{"id":"bio3-021","t":"Dixon and Joly: water pulled up trees","s":"Biology","tp":"Plants","sub":"Transpiration","lv":["A-Level"],"who":"Henry Dixon, John Joly","f":0,"loc":"Ireland","rg":["Europe"],"yr":1894,"era":"1800s","tag":"Discovery","x":"How does water reach the top of a 100-metre tree, when suction can only lift water about 10 metres? In 1894 Henry Dixon and John Joly at Trinity College Dublin proposed the cohesion–tension theory. Water evaporates from leaves, pulling on the column of water below, which holds together because water molecules stick strongly to each other. The whole column is pulled up through the xylem like a rope. It is still the accepted explanation.","q":"Why are hydrogen bonds between water molecules essential for tall trees?"},{"id":"bio3-022","t":"Darwin and son find the light-sensing tip","s":"Biology","tp":"Plants","sub":"Tropisms","lv":["GCSE","A-Level"],"who":"Charles Darwin, Francis Darwin","f":0,"loc":"UK","rg":["Europe"],"yr":1880,"era":"1800s","tag":"Discovery","x":"In 'The Power of Movement in Plants' (1880), Charles Darwin and his son Francis described how grass seedlings bend towards light. When they covered just the tip with a tiny cap of foil or blackened glass, the seedlings no longer bent – yet bending happened further down. Something must travel from the tip. In 1926 the Dutch scientist Frits Went collected this substance in blocks of agar: auxin, the first plant hormone discovered.","q":"Design an experiment to show where light is detected in a shoot."},{"id":"bio3-023","t":"The foolish seedling disease","s":"Biology","tp":"Plants","sub":"Plant hormones","lv":["GCSE","A-Level"],"who":"Eiichi Kurosawa, Teijiro Yabuta","f":0,"loc":"Japan / Taiwan","rg":["East Asia"],"yr":1926,"era":"1900–1949","tag":"Discovery","x":"Japanese rice farmers knew 'bakanae' – foolish seedling disease – where infected plants grew ridiculously tall and spindly, then fell over. In 1926 the plant pathologist Eiichi Kurosawa, working in Taiwan, showed that a fungus produced a chemical that caused it. In 1938 Teijiro Yabuta purified it and called it gibberellin. Western scientists learned of it only after the Second World War. Gibberellins are now used to make seedless grapes grow bigger and to help brew beer.","q":"How could a fungus benefit from making its host grow too tall?"},{"id":"bio3-024","t":"Neljubov's peas and the street lamps","s":"Biology","tp":"Plants","sub":"Plant hormones","lv":["GCSE","A-Level"],"who":"Dimitry Neljubov","f":0,"loc":"Russia","rg":["Europe"],"yr":1901,"era":"1900–1949","tag":"Discovery","x":"In the 1800s, trees near leaking gas street lamps lost their leaves early. In 1901 the Russian student Dimitry Neljubov noticed that pea seedlings in his St Petersburg lab grew oddly sideways, but not those grown outside. He found the cause was ethylene in the coal gas used for lighting. Ethylene turned out to be a plant hormone: fruits such as bananas release it as they ripen, which is why one ripe banana in a bag speeds up the others.","q":"Why does putting an unripe avocado in a bag with a banana help it ripen?"},{"id":"bio3-025","t":"Otto Loewi's dream of two frog hearts","s":"Biology","tp":"Nerves","sub":"Synapses","lv":["GCSE","A-Level"],"who":"Otto Loewi","f":0,"loc":"Austria / Germany","rg":["Europe"],"yr":1921,"era":"1900–1949","tag":"Discovery","x":"Do nerves pass signals electrically or chemically? On the night before Easter Sunday 1921, Otto Loewi dreamed of an experiment, scribbled notes, and in the morning could not read his handwriting. The next night the dream returned, and at 3 am he went straight to his lab in Graz. He stimulated the vagus nerve of a frog heart, slowing it, then transferred fluid from around it to a second heart – which also slowed. A chemical, later identified as acetylcholine, carried the message. He won the 1936 Nobel Prize, and fled the Nazis in 1938.","q":"What happens at a synapse?"},{"id":"bio3-026","t":"Hodgkin, Huxley and the squid's giant axon","s":"Biology","tp":"Nerves","sub":"Action potentials","lv":["A-Level"],"who":"Alan Hodgkin, Andrew Huxley","f":0,"loc":"UK","rg":["Europe"],"yr":1952,"era":"1950–1999","tag":"Discovery","x":"Squid have nerve fibres up to a millimetre wide, big enough to push a wire inside. In 1939 at the Plymouth marine laboratory, Alan Hodgkin and Andrew Huxley recorded the voltage inside a nerve as an impulse passed – an action potential. The Second World War interrupted them; both worked on radar. By 1952 they had worked out how sodium and potassium ions flowing through the membrane produce the impulse, partly by solving equations with a hand-cranked calculator. They shared the 1963 Nobel Prize.","q":"Why are squid giant axons so useful for experiments?"},{"id":"bio3-027","t":"Broca and 'Tan'","s":"Biology","tp":"Nerves","sub":"The brain","lv":["GCSE"],"who":"Paul Broca","f":0,"loc":"France","rg":["Europe"],"yr":1861,"era":"1800s","tag":"Discovery","x":"A patient at a Paris hospital, Louis Leborgne, could understand speech but for over 20 years could say only one syllable, 'tan' – so staff called him Tan. When he died in 1861, the surgeon Paul Broca examined his brain and found damage to a small area in the left frontal lobe. Broca studied other patients and concluded this area controls speech production – Broca's area. It was strong evidence that different parts of the brain have different jobs. Leborgne's brain is still preserved in Paris.","q":"What does damage to a specific brain area tell us?"},{"id":"bio3-028","t":"Brenda Milner and the man who couldn't remember","s":"Biology","tp":"Nerves","sub":"Memory","lv":["GCSE","A-Level"],"who":"Brenda Milner, Henry Molaison","f":1,"loc":"UK / Canada / USA","rg":["North & Central America","Europe"],"yr":1957,"era":"1950–1999","tag":"Hidden figure","x":"In 1953 Henry Molaison had parts of both temporal lobes removed to control severe epilepsy. Afterwards he could not form new long-term memories. The British-born psychologist Brenda Milner, working in Montreal, studied him for decades; each visit, he met her as a stranger. Yet when she asked him to trace a star seen in a mirror, he got better every day without remembering practising. She showed there are different memory systems in different brain areas. Milner was still working past the age of 100.","q":"What is the difference between remembering facts and remembering skills?"},{"id":"bio3-029","t":"Penfield maps the brain while patients are awake","s":"Biology","tp":"Nerves","sub":"The brain","lv":["GCSE"],"who":"Wilder Penfield","f":0,"loc":"Canada","rg":["North & Central America"],"yr":1937,"era":"1900–1949","tag":"Discovery","x":"The brain has no pain receptors, so it can be operated on while a patient is awake. In Montreal from the 1930s, the neurosurgeon Wilder Penfield gently stimulated points on the exposed brains of patients with epilepsy, under local anaesthetic, and asked what they felt. Some twitched a finger; others felt a tingle in the lip or heard music. He mapped which parts of the body each strip of brain controls, producing the famous distorted 'homunculus' with huge hands and lips.","q":"Why do the hands and lips take up so much of the brain's map?"},{"id":"bio3-030","t":"Harold Ridley's Spitfire lenses","s":"Biology","tp":"Senses","sub":"The eye","lv":["KS3","GCSE"],"who":"Harold Ridley, Gordon Cleaver","f":0,"loc":"UK","rg":["Europe"],"yr":1949,"era":"1900–1949","tag":"Invention","x":"During the Second World War, the eye surgeon Harold Ridley treated RAF pilots with splinters of Perspex from shattered cockpit canopies in their eyes. He noticed the plastic did not cause inflammation. When a medical student asked why he removed cloudy lenses in cataract surgery without replacing them, he had an idea. In 1949 at St Thomas' Hospital in London he implanted the first artificial lens made of Perspex. Colleagues were hostile for years, but intraocular lenses now restore sight to millions each year.","q":"What does the lens of the eye do?"},{"id":"bio3-031","t":"Békésy and the cochlea","s":"Biology","tp":"Senses","sub":"Hearing","lv":["GCSE","A-Level"],"who":"Georg von Békésy","f":0,"loc":"Hungary / USA","rg":["North & Central America","Europe"],"yr":1928,"era":"1900–1949","tag":"Discovery","x":"Georg von Békésy worked for the Hungarian telephone company, trying to improve telephone lines, and decided the ear was the best receiver to study. Using fine instruments, he opened the cochlea in ears from corpses and watched the basilar membrane with a microscope as sound played. He saw a wave travel along it, peaking at different places for different pitches – high notes near the base, low notes near the tip. He won the 1961 Nobel Prize in Physiology or Medicine.","q":"How does the cochlea tell high and low notes apart?"},{"id":"bio3-032","t":"Graeme Clark's bionic ear","s":"Biology","tp":"Senses","sub":"Hearing","lv":["KS3","GCSE"],"who":"Graeme Clark, Rod Saunders","f":0,"loc":"Australia","rg":["Oceania"],"yr":1978,"era":"1950–1999","tag":"Invention","x":"Graeme Clark's father was deaf, and as a boy Graeme saw how isolating it was. As a surgeon in Melbourne, he worked on an implant that would stimulate the hearing nerve directly with electrical signals. The problem was how to slide electrodes into the spiralling cochlea. On a beach holiday in 1977 he pushed a blade of grass into a turban shell and found that a flexible, gradually stiffening tip curled round easily. In 1978 Rod Saunders became the first person to receive his multi-channel cochlear implant.","q":"How can electrical signals replace sound for the brain?"},{"id":"bio3-033","t":"Otto Wichterle's toy-set contact lenses","s":"Biology","tp":"Senses","sub":"The eye","lv":["KS3","GCSE"],"who":"Otto Wichterle, Lída Wichterlová","f":1,"loc":"Czech Republic","rg":["Europe"],"yr":1961,"era":"1950–1999","tag":"Invention","x":"The Czech chemist Otto Wichterle invented a soft, water-absorbing gel, hydrogel, that the eye tolerated well. His institute, under the communist government, gave him little support. At Christmas 1961, at home, he built a machine to spin-cast soft contact lenses using his children's Merkur construction set, a bicycle dynamo and a gramophone motor. His wife Lída helped, and they made several lenses that night. Soft contact lenses are now worn by many millions.","q":"Why does a soft lens need to let oxygen through to the eye?"},{"id":"bio3-034","t":"Takamine isolates adrenaline","s":"Biology","tp":"Body systems","sub":"Hormones","lv":["GCSE","A-Level"],"who":"Jokichi Takamine, Keizo Uenaka","f":0,"loc":"Japan / USA","rg":["East Asia","North & Central America"],"yr":1901,"era":"1900–1949","tag":"Discovery","x":"In 1901 the Japanese chemist Jokichi Takamine and his assistant Keizo Uenaka, working in New York, purified the hormone made by the adrenal glands – adrenaline, the first hormone to be isolated in pure crystalline form. It raises heart rate and blood pressure in the 'fight or flight' response. Takamine had also patented a digestive enzyme from fungus, and gave Washington DC the famous cherry trees around the Tidal Basin in 1912.","q":"What changes does adrenaline cause to prepare the body for action?"},{"id":"bio3-035","t":"Luis Miramontes makes the pill's key molecule","s":"Chemistry","tp":"Organic chemistry","sub":"Synthesis","lv":["GCSE","A-Level"],"who":"Luis Miramontes, Carl Djerassi, George Rosenkranz","f":0,"loc":"Mexico","rg":["North & Central America"],"yr":1951,"era":"1950–1999","tag":"Hidden figure","x":"In the 1940s, the Mexico City company Syntex made steroid hormones from a wild Mexican yam. On 15 October 1951, the 26-year-old Mexican chemistry student Luis Miramontes, working with Carl Djerassi and George Rosenkranz, synthesised norethisterone, a powerful hormone that could be taken by mouth. It became an active ingredient in early contraceptive pills. Miramontes' lab notebook entry is recognised as a landmark in Mexican science, though Djerassi received most of the fame.","q":"Why is a medicine that works when swallowed easier to use than one that must be injected?"},{"id":"bio3-036","t":"Claude Bernard and the internal environment","s":"Biology","tp":"Body systems","sub":"Homeostasis","lv":["GCSE","A-Level"],"who":"Claude Bernard, Walter Cannon","f":0,"loc":"France / USA","rg":["North & Central America","Europe"],"yr":1865,"era":"1800s","tag":"Discovery","x":"Claude Bernard first wanted to be a playwright, but a critic advised him to study medicine instead. In the 1850s he showed that the liver stores sugar as glycogen and releases glucose into the blood. He realised that animals keep their 'milieu intérieur' – their internal environment – constant despite changes outside, and that this is the condition for a free, independent life. In 1926 the American physiologist Walter Cannon named this balancing 'homeostasis'.","q":"Name three things the body keeps constant, and how."},{"id":"bio3-037","t":"Yersin and Kitasato chase the plague","s":"Biology","tp":"Disease and immunity","sub":"Bacteria","lv":["GCSE"],"who":"Alexandre Yersin, Kitasato Shibasaburō","f":0,"loc":"Hong Kong / Switzerland / Japan","rg":["East Asia","Europe"],"yr":1894,"era":"1800s","tag":"Rivalry","x":"In 1894 bubonic plague broke out in Hong Kong. The Japanese bacteriologist Kitasato Shibasaburō arrived with a team and lab equipment; the Swiss-French Alexandre Yersin arrived almost alone and was refused access to bodies, so he built a straw hut and bribed sailors for samples. Both reported finding the plague bacterium within days. Yersin's description proved more accurate, and the bacterium is named Yersinia pestis. It was later shown to be spread by rat fleas.","q":"How does the plague bacterium spread from rats to humans?"},{"id":"bio3-038","t":"Carlos Finlay and the yellow fever mosquito","s":"Biology","tp":"Disease and immunity","sub":"Vectors","lv":["GCSE"],"who":"Carlos Finlay, Walter Reed, Jesse Lazear, Clara Maass","f":1,"loc":"Cuba / USA","rg":["North & Central America"],"yr":1900,"era":"1900–1949","tag":"Hidden figure","x":"In 1881 the Cuban doctor Carlos Finlay proposed that yellow fever was spread by a particular mosquito, now called Aedes aegypti. For nearly 20 years he was ignored. In 1900 a US Army commission led by Walter Reed tested his idea in Cuba with volunteers bitten by infected mosquitoes. One team member, Jesse Lazear, died after a bite, and an American nurse, Clara Maass, died after volunteering in a later experiment. The proof allowed mosquito control that made building the Panama Canal possible. Cuba celebrates Finlay's birthday as Doctors' Day.","q":"Why does controlling mosquitoes control yellow fever?"},{"id":"bio3-039","t":"Waldemar Haffkine injects himself","s":"Biology","tp":"Disease and immunity","sub":"Vaccines","lv":["GCSE"],"who":"Waldemar Haffkine","f":0,"loc":"Ukraine / France / India","rg":["South Asia","Europe"],"yr":1892,"era":"1800s","tag":"Discovery","x":"Waldemar Haffkine, born in Odessa, developed a cholera vaccine at the Pasteur Institute in Paris and in 1892 tested it first on himself. He took it to India, then devastated by cholera, and vaccinated tens of thousands of people. When plague struck Bombay in 1896 he developed a plague vaccine in three months, again testing it on himself. The Haffkine Institute in Mumbai still bears his name.","q":"Is it brave or reckless for scientists to test vaccines on themselves?"},{"id":"bio3-040","t":"Janet Parker: the last smallpox death","s":"Biology","tp":"Disease and immunity","sub":"Viruses","lv":["GCSE"],"who":"Ali Maow Maalin, Janet Parker","f":1,"loc":"Somalia / UK","rg":["Africa","Europe"],"yr":1978,"era":"1950–1999","tag":"Tragedy","x":"The last natural case of smallpox was Ali Maow Maalin, a hospital cook in Merca, Somalia, in October 1977. He recovered and later worked to vaccinate people against polio. But in 1978 Janet Parker, a medical photographer at Birmingham University Medical School, caught smallpox from a laboratory on the floor below her darkroom, probably through ventilation ducts. She died, the last person known to die of smallpox. Since then the virus has been kept in only two high-security labs in the world.","q":"Why must dangerous microorganisms be kept in high-security labs?"},{"id":"bio3-041","t":"BCG: 13 years and 230 cultures","s":"Biology","tp":"Disease and immunity","sub":"Vaccines","lv":["GCSE"],"who":"Albert Calmette, Camille Guérin","f":0,"loc":"France","rg":["Europe"],"yr":1921,"era":"1900–1949","tag":"Discovery","x":"From 1908, Albert Calmette and Camille Guérin at the Pasteur Institute in Lille grew a bovine tuberculosis bacterium on a medium of potato, glycerine and ox bile, and transferred it to fresh medium every three weeks. After 13 years and 230 transfers – continued even through the German occupation of Lille in the First World War – it had become harmless but still triggered immunity. The BCG vaccine was first given to a baby in 1921 and is still one of the most widely used vaccines.","q":"Why would a weakened bacterium make a good vaccine?"},{"id":"bio3-042","t":"Streptomycin and the student who wasn't credited","s":"Biology","tp":"Disease and immunity","sub":"Antibiotics","lv":["GCSE","A-Level"],"who":"Albert Schatz, Selman Waksman","f":0,"loc":"USA","rg":["North & Central America"],"yr":1943,"era":"1900–1949","tag":"Rivalry","x":"In 1943 Albert Schatz, a 23-year-old PhD student working in a basement lab at Rutgers University, isolated a soil microbe that produced streptomycin – the first antibiotic effective against tuberculosis. His supervisor Selman Waksman took most of the credit and royalties. Schatz sued and won a share in 1950 and recognition as co-discoverer, but the 1952 Nobel Prize went to Waksman alone. Waksman also coined the word 'antibiotic'.","q":"Who should get credit when a student makes a discovery in a supervisor's lab?"},{"id":"bio3-043","t":"Gerhard Domagk saves his daughter","s":"Biology","tp":"Disease and immunity","sub":"Drugs","lv":["GCSE"],"who":"Gerhard Domagk, Hildegard Domagk","f":1,"loc":"Germany","rg":["Europe"],"yr":1935,"era":"1900–1949","tag":"Discovery","x":"In 1932, at the Bayer company, Gerhard Domagk found that a red dye called Prontosil cured mice infected with streptococcus bacteria. In 1935 his six-year-old daughter Hildegard pricked her hand with a needle and developed a serious infection; doctors suggested amputating her arm. Desperate, he gave her Prontosil, and she recovered. Prontosil led to the sulfa drugs, the first widely used antibacterial medicines. Domagk was awarded the 1939 Nobel Prize, but the Nazi government forced him to decline it.","q":"Why would a dye be tested as a medicine?"},{"id":"bio3-044","t":"Willow bark to aspirin","s":"Chemistry","tp":"Organic chemistry","sub":"Medicines","lv":["KS3","GCSE"],"who":"Edward Stone, Felix Hoffmann","f":0,"loc":"UK / Germany","rg":["Europe"],"yr":1897,"era":"1800s","tag":"Discovery","x":"People in ancient Egypt and Sumer used willow to ease pain. In 1763 the English vicar Edward Stone tasted willow bark, found it bitter like the expensive fever remedy cinchona, and gave dried bark to 50 patients with fevers, reporting success to the Royal Society. The active ingredient, salicylic acid, upset the stomach. In 1897 Felix Hoffmann at Bayer made a gentler version, acetylsalicylic acid, sold as Aspirin. It is now also used in low doses to help prevent heart attacks.","q":"Why might chemists modify a natural medicine?"},{"id":"bio3-045","t":"Withering's foxglove","s":"Biology","tp":"Medicine","sub":"Drugs","lv":["GCSE"],"who":"William Withering","f":0,"loc":"UK","rg":["Europe"],"yr":1785,"era":"1700s","tag":"Discovery","x":"In the 1770s the Shropshire doctor William Withering heard of a family herbal remedy for dropsy – swelling caused by a failing heart – which contained around 20 herbs. He worked out that foxglove was the active ingredient. Over ten years he carefully tried different doses on 163 patients and in 1785 published his results, warning that too much was poisonous. Digoxin, from foxglove, is still used to treat heart conditions.","q":"Why is finding the right dose so important for a medicine from a poisonous plant?"},{"id":"bio3-046","t":"Hanaoka Seishū's general anaesthetic","s":"Biology","tp":"Medicine","sub":"Anaesthesia","lv":["GCSE"],"who":"Hanaoka Seishū, Kae Hanaoka, Otsugi Hanaoka","f":1,"loc":"Japan","rg":["East Asia"],"yr":1804,"era":"1800s","tag":"Hidden figure","x":"Forty years before ether was used in the West, the Japanese surgeon Hanaoka Seishū developed a herbal general anaesthetic, tsūsensan, from plants including thornapple. His mother Otsugi and wife Kae volunteered to test it; his mother died during the trials and his wife went blind. On 13 October 1804 he used it to remove a breast tumour from a 60-year-old woman, Kan Aiya – the first known surgery under general anaesthesia. Japan's isolation meant the West did not learn of it for decades.","q":"Why was general anaesthesia such a breakthrough for surgery?"},{"id":"bio3-047","t":"Simpson's chloroform dinner party","s":"Biology","tp":"Medicine","sub":"Anaesthesia","lv":["KS3","GCSE"],"who":"James Young Simpson, Queen Victoria","f":1,"loc":"UK","rg":["Europe"],"yr":1847,"era":"1800s","tag":"Eccentric","x":"Ether anaesthesia was first demonstrated in Boston in 1846, but it irritated the lungs. In Edinburgh in November 1847, the obstetrician James Young Simpson and two friends sniffed various chemicals after dinner to test them. With chloroform, they became cheerful, then all three slid unconscious under the table. Simpson began using it in childbirth, despite religious objecti
