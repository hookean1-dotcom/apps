<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Science Hinterland</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@500;600;700&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<style>
/* VOICE: curious, warm, classroom-ready; stories first, chrome quiet.
   IDEA: a geological core sample of time - every story is a grain laid down in its year.
   PICTURE: a live beeswarm timeline of all stories on a lemon "specimen label" field; filters thin it out.
   COLOUR and TYPE: lemon field, ink text, four subject inks (cobalt, magenta, leaf, umber); Familjen Grotesk + Atkinson Hyperlegible.
   LAYOUT: title row, full-bleed timeline band, sticky-free control panel, index-card grid, reader view in place. */
#sh{
  --bg:#ffffff;--ink:#15191f;--soft:#4a5260;--line:#dfe3e8;--panel:#f5f6f8;--field:#f7e46b;--fieldink:#2a2400;
  --phy:#2445d6;--che:#c21f6b;--bio:#17853f;--ear:#8a4b12;--focus:#2445d6;--card:#ffffff;
  color-scheme:light;background:var(--bg);color:var(--ink);
  font:17px/1.6 "Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif;
  width:100%;min-height:600px;overflow-x:clip;position:relative;
}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]) #sh{--bg:#12151a;--ink:#eef0f3;--soft:#a9b0bb;--line:#2b313a;--panel:#1a1f26;--field:#3a3410;--fieldink:#f7e46b;--phy:#7d95ff;--che:#ff6fa8;--bio:#53c97c;--ear:#e0a463;--focus:#9fb1ff;--card:#181c22;color-scheme:dark}}
:root[data-theme=dark] #sh{--bg:#12151a;--ink:#eef0f3;--soft:#a9b0bb;--line:#2b313a;--panel:#1a1f26;--field:#3a3410;--fieldink:#f7e46b;--phy:#7d95ff;--che:#ff6fa8;--bio:#53c97c;--ear:#e0a463;--focus:#9fb1ff;--card:#181c22;color-scheme:dark}
#sh *{box-sizing:border-box;min-width:0}
#sh h1,#sh h2,#sh h3{font-family:"Familjen Grotesk",system-ui,sans-serif;line-height:1.08;margin:0;text-wrap:balance}
#sh button,#sh select,#sh input{font:inherit;color:inherit}
#sh :focus-visible{outline:3px solid var(--focus);outline-offset:2px;border-radius:6px}
#sh .wrap{max-width:1240px;margin:0 auto;padding:0 max(4vw,16px)}
#sh .top{padding:28px 0 18px;display:flex;flex-wrap:wrap;gap:12px 28px;align-items:end;justify-content:space-between}
#sh .top h1{font-size:clamp(34px,5vw,52px);font-weight:700;letter-spacing:-.02em}
#sh .top p{margin:6px 0 0;color:var(--soft);max-width:62ch}
#sh .tally{display:flex;gap:22px;flex-wrap:wrap}
#sh .tally div{font-size:14px;color:var(--soft)}
#sh .tally b{display:block;font:700 28px/1 "Familjen Grotesk",sans-serif;color:var(--ink)}
#sh .band{background:var(--field);color:var(--fieldink);padding:18px 0 12px}
#sh .bandhead{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:baseline;font-size:15px}
#sh .bandhead strong{font-family:"Familjen Grotesk",sans-serif;font-size:19px}
#sh .key{display:flex;gap:14px;flex-wrap:wrap}
#sh .key span{display:inline-flex;align-items:center;gap:6px}
#sh .key i{width:11px;height:11px;border-radius:50%;display:inline-block}
#sh .fig{position:relative;height:300px;margin-top:6px}
#sh .fig svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
#sh .fig circle{cursor:pointer;transition:opacity .25s}
#sh .fig circle.off{opacity:.14}
#sh .tip{position:absolute;pointer-events:none;background:var(--ink);color:var(--bg);font-size:14px;line-height:1.35;padding:7px 10px;border-radius:8px;max-width:260px;opacity:0;transition:opacity .12s;z-index:2}
#sh .tip.on{opacity:1}
#sh .controls{padding:22px 0 8px;display:grid;gap:14px}
#sh .searchrow{display:flex;gap:10px;flex-wrap:wrap}
#sh .search{flex:1 1 320px;position:relative}
#sh .search input{width:100%;height:54px;border:2px solid var(--ink);border-radius:12px;padding:0 16px 0 46px;font-size:18px;background:var(--card)}
#sh .search svg{position:absolute;left:15px;top:17px;width:20px;height:20px}
#sh .btn{min-height:44px;padding:0 16px;border-radius:10px;border:2px solid var(--ink);background:var(--card);cursor:pointer;font-weight:700;display:inline-flex;align-items:center;gap:8px}
#sh .btn.solid{background:var(--ink);color:var(--bg)}
#sh .btn:hover{filter:brightness(.96)}
#sh .rows{display:grid;gap:10px}
#sh .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
#sh .row .lab{font-size:14px;color:var(--soft);width:64px}
#sh .chip{min-height:40px;padding:0 14px;border-radius:999px;border:1.5px solid var(--line);background:var(--card);cursor:pointer;display:inline-flex;align-items:center;gap:7px;font-size:15px}
#sh .chip[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
#sh .chip i{width:10px;height:10px;border-radius:50%}
#sh .selects{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
#sh .selects label{display:grid;gap:3px;font-size:14px;color:var(--soft)}
#sh select{height:44px;border:1.5px solid var(--line);border-radius:10px;padding:0 10px;background:var(--card);font-size:16px}
#sh .status{display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px;align-items:center;padding:10px 0 4px;border-top:1px solid var(--line);margin-top:4px}
#sh .status p{margin:0;font-size:15px;color:var(--soft)}
#sh .linkbtn{background:none;border:0;padding:6px 0;text-decoration:underline;cursor:pointer;color:var(--ink);font-size:15px}
#sh .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:18px;padding:12px 0 24px}
#sh .card{background:var(--card);border:1.5px solid var(--line);border-radius:14px;overflow:hidden;display:flex;flex-direction:column;cursor:pointer;text-align:left;padding:0}
#sh .card:hover{border-color:var(--soft)}
#sh .art{aspect-ratio:3/2;width:100%;display:block;background:var(--panel);position:relative;overflow:hidden}
#sh .art img,#sh .art svg{width:100%;height:100%;object-fit:cover;display:block}
#sh .art svg{position:absolute;inset:0}
#sh .card .art{aspect-ratio:2/1}
#sh .art .ov{position:absolute;inset:0;pointer-events:none}
#sh .art .ov b{position:absolute;left:14px;bottom:12px;font-family:'Familjen Grotesk',system-ui,sans-serif;font-weight:700;font-size:28px;line-height:1;letter-spacing:-.02em;white-space:nowrap;background:var(--bg);padding:2px 8px 4px;border-radius:8px}
#sh .art .ov b.sym{font-size:44px;font-family:'Atkinson Hyperlegible','Familjen Grotesk',system-ui,sans-serif;padding:4px 14px 8px;letter-spacing:0}
#sh .art .ov em{position:absolute;top:12px;right:12px;font-style:normal;white-space:nowrap;font-size:13px;font-weight:600;background:var(--bg);padding:3px 9px;border-radius:999px}
#sh .cbody{padding:14px 16px 16px;display:grid;gap:7px}
#sh .subj{font-size:14px;display:flex;align-items:center;gap:7px;color:var(--soft)}
#sh .subj i{width:10px;height:10px;border-radius:50%}
#sh .card h3{font-size:20px;font-weight:600}
#sh .card p{margin:0;font-size:15px;color:var(--soft);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
#sh .pills{display:flex;gap:6px;flex-wrap:wrap}
#sh .pill{font-size:13px;border:1px solid var(--line);border-radius:999px;padding:1px 9px;color:var(--soft)}
#sh .pill.w{border-color:var(--che);color:var(--che)}
#sh .today{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:0;border:2px solid var(--ink);border-radius:16px;overflow:hidden;margin:10px 0 6px;cursor:pointer;background:var(--card);text-align:left;padding:0;width:100%}
#sh .today .cbody{padding:20px 22px}
#sh .today h3{font-size:clamp(24px,3vw,32px)}
#sh .today p{-webkit-line-clamp:5}
#sh .more{display:flex;justify-content:center;padding:0 0 40px}
#sh .empty{padding:40px 0;text-align:center;color:var(--soft)}
#sh .reader{padding:20px 0 48px}
#sh .rnav{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:18px}
#sh .rgrid{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:34px;align-items:start}
#sh .reader h2{font-size:clamp(30px,4.4vw,48px);font-weight:700;letter-spacing:-.015em;margin:6px 0 14px}
#sh .story{font-size:19px;line-height:1.7;max-width:66ch;margin:0}
#sh .ask{margin-top:22px;background:var(--field);color:var(--fieldink);border-radius:14px;padding:16px 18px}
#sh .ask h3{font-size:18px;margin-bottom:4px}
#sh .ask p{margin:0;font-size:18px}
#sh .facts{display:grid;gap:0;margin:16px 0 0;border-top:1px solid var(--line)}
#sh .facts div{display:grid;grid-template-columns:90px minmax(0,1fr);gap:10px;padding:9px 0;border-bottom:1px solid var(--line);font-size:15px}
#sh .facts dt{color:var(--soft);margin:0}
#sh .facts dd{margin:0}
#sh .acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:18px}
#sh .related{margin-top:30px}
#sh .related h3{font-size:20px;margin-bottom:10px}
#sh .rel{display:grid;gap:8px}
#sh .rel button{text-align:left;border:1.5px solid var(--line);background:var(--card);border-radius:10px;padding:10px 12px;cursor:pointer;display:flex;gap:9px;align-items:baseline;min-height:44px;font-size:15px}
#sh .rel i{width:9px;height:9px;border-radius:50%;flex:none}
#sh .toast{position:absolute;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:10px;font-size:15px;opacity:0;transition:opacity .2s;pointer-events:none}
#sh .toast.on{opacity:1}
#sh .present .story{font-size:clamp(22px,2.4vw,30px);max-width:none}
#sh .present .rgrid{grid-template-columns:1fr}
#sh .present .ask p{font-size:clamp(21px,2.2vw,28px)}
#sh .present h2{font-size:clamp(36px,5vw,60px)}
#sh .hide{display:none!important}
#sh .sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
@media (max-width:760px){#sh .rgrid,#sh .today{grid-template-columns:1fr}#sh .fig{height:250px}#sh .row .lab{width:100%}}
@media (prefers-reduced-motion:reduce){#sh *{transition:none!important}}
</style>
</head>
<body style="margin:0">
<div id="sh">
  <div class="wrap top">
    <div>
      <h1>Science Hinterland</h1>
      <p>The human stories behind KS3, GCSE and A-level science: the accidents, rivalries, wrong turns and overlooked people who made the ideas you teach.</p>
    </div>
    <div class="tally" id="tally"></div>
  </div>

  <section class="band" aria-label="Timeline of all stories">
    <div class="wrap">
      <div class="bandhead">
        <strong>Every story, placed in its year</strong>
        <div class="key" id="key"></div>
      </div>
      <div class="fig" id="fig"><svg id="tl" role="img" aria-label="Timeline of stories from ancient times to today"></svg><div class="tip" id="tip"></div></div>
    </div>
  </section>

  <div class="wrap" id="browse">
    <div class="controls">
      <div class="searchrow">
        <div class="search">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" aria-hidden="true"><circle cx="10.5" cy="10.5" r="7"></circle><path d="M16 16l5.5 5.5"></path></svg>
          <label class="sr" for="q">Search stories</label>
          <input id="q" type="search" placeholder="Search a scientist, place or idea, e.g. Faraday, India, resonance" autocomplete="off">
        </div>
        <button class="btn solid" id="surprise" type="button">Surprise me</button>
      </div>
      <div class="rows">
        <div class="row" id="subjRow"><span class="lab">Subject</span></div>
        <div class="row" id="lvRow"><span class="lab">Level</span></div>
        <div class="row" id="colRow"><span class="lab">Collection</span></div>
      </div>
      <div class="selects">
        <label>Topic<select id="tp"></select></label>
        <label>Kind of story<select id="tag"></select></label>
        <label>Part of the world<select id="rg"></select></label>
        <label>When<select id="era"></select></label>
        <label>Sort by<select id="sort">
          <option value="rel">Best match</option><option value="old">Oldest first</option><option value="new">Newest first</option><option value="az">Title A to Z</option><option value="shuf">Shuffle</option>
        </select></label>
      </div>
      <div class="status"><p id="count" aria-live="polite"></p><button class="linkbtn" id="reset" type="button">Clear all filters</button></div>
    </div>
    <div id="todayWrap"></div>
    <div class="grid" id="grid"></div>
    <div class="more"><button class="btn hide" id="moreBtn" type="button">Show more stories</button></div>
  </div>

  <div class="wrap reader hide" id="reader"></div>
  <div class="toast" id="toast" role="status"></div>
</div>

<script>
{
const DATA = [{"id":"wav-001","t":"Hertz and the useless waves","s":"Physics","tp":"Waves","sub":"Radio waves","lv":["GCSE","A-Level"],"who":"Heinrich Hertz","f":0,"loc":"Germany","rg":["Europe"],"yr":1888,"era":"1800s","tag":"Discovery","x":"Heinrich Hertz was the first to produce and detect the electromagnetic waves that Maxwell's equations had predicted. Yet he saw no future in them. Asked by his students what the waves might be good for, he reportedly shrugged and said they only proved Maxwell right – essentially, nothing. Within a decade Marconi was sending messages across the Channel, and today radio, TV, Wi-Fi and mobile phones all ride on Hertz's 'useless' waves. Hertz suffered terrible pain in his teeth, nose and throat, and died of a rare blood-vessel disease aged just 36. The unit of frequency now carries his name.","q":"Why might a scientist fail to see the uses of their own discovery?"},{"id":"wav-002","t":"Pasta-shaped radio beams","s":"Physics","tp":"Waves","sub":"Radio waves","lv":["A-Level"],"who":"Italian and Swedish researchers","f":0,"loc":"Italy / Sweden","rg":["Europe"],"yr":2011,"era":"2000 onwards","tag":"Modern research","x":"The radio spectrum is crowded: every phone, router and broadcaster needs a slice of frequency. A team from Italy and Sweden showed that radio waves can be given a corkscrew twist, so the wavefront spirals around its direction of travel like fusilli pasta. Beams twisted by different amounts – clockwise or anticlockwise – can share the same frequency without interfering, because a receiver can tell the twists apart. In a test in Venice they sent two separate signals across a canal on one channel.","q":"What property of a wave, other than frequency, could be used to carry separate signals?"},{"id":"wav-003","t":"Sferics, tweeks and whistlers","s":"Physics","tp":"Waves","sub":"Radio waves","lv":["GCSE","A-Level"],"who":"","f":0,"loc":"Worldwide","rg":["Worldwide"],"yr":1886,"era":"1800s","tag":"Nature","x":"Every lightning strike is also a radio transmitter. It releases a crackle of very-low-frequency radio waves called a sferic, which can bounce thousands of kilometres between the ground and the ionosphere. Over long distances the different frequencies spread out and arrive at slightly different times, so when converted to sound they chirp like birds – these are 'tweeks'. Some signals escape up into the magnetosphere and spiral along Earth's magnetic field lines, returning as long falling tones called 'whistlers'. Early telephone operators heard them on long lines in the 1880s and had no idea what they were.","q":"Why would different frequencies from the same lightning flash arrive at different times?"},{"id":"wav-004","t":"Radio versus the zebra mussel","s":"Physics","tp":"Waves","sub":"Radio waves","lv":["KS3","GCSE"],"who":"","f":0,"loc":"USA","rg":["North & Central America"],"yr":2000,"era":"2000 onwards","tag":"Modern research","x":"Zebra mussels, an invasive species, have clogged pipes and smothered native wildlife in the Great Lakes of North America. Poisons harm everything else in the water, so researchers tried something different: radio waves. Exposure made the mussels release calcium and other minerals they need to maintain their shells, eventually killing them. Other mussels, crabs and crayfish were affected much less, making radio a possible targeted pest control.","q":"What are the advantages of a 'physical' pest control over a chemical one?"},{"id":"wav-005","t":"The man who wired up a brain to a radio","s":"Physics","tp":"Waves","sub":"Radio waves","lv":["GCSE"],"who":"Archie Frederick Collins","f":0,"loc":"USA","rg":["North & Central America"],"yr":1903,"era":"1900–1949","tag":"Eccentric","x":"In 1903 the radio pioneer Frederick Collins wanted to know whether brain tissue could act as a radio detector. He pushed two needles into an animal brain from a butcher and connected it to his receiver, then repeated the experiment with a cat's brain. He later claimed to have obtained a fresh human brain and, by luck, to have tested it during a thunderstorm, when his meter swung wildly. Collins went on to sell shares in a wireless telephone company, but spent the money on demonstrations rather than technology and was jailed for fraud in 1913. After prison he wrote dozens of popular books about radio.","q":"What would a fair test of 'does brain tissue detect radio waves?' need to include?"},{"id":"wav-006","t":"The town where Wi-Fi is banned","s":"Physics","tp":"Waves","sub":"Radio waves","lv":["KS3","GCSE"],"who":"","f":0,"loc":"USA","rg":["North & Central America"],"yr":1958,"era":"1950–1999","tag":"Everyday","x":"Around the Green Bank Telescope in West Virginia lies the National Radio Quiet Zone, an area of roughly 34,000 square kilometres set up in 1958. The telescope is so sensitive that it can pick up signals with less energy than a snowflake landing. Near the telescope, mobile phones, Wi-Fi, microwave ovens and even some petrol engines (whose spark plugs emit radio noise) are restricted, and staff drive a specially equipped truck to hunt down stray transmissions. Some people with sensitivities to electromagnetic radiation have moved there on purpose.","q":"Why must a radio telescope be protected from local transmitters but not from sunlight?"},{"id":"wav-007","t":"Hedy Lamarr: film star and inventor","s":"Physics","tp":"Waves","sub":"Radio waves","lv":["KS3","GCSE","A-Level"],"who":"Hedy Lamarr","f":1,"loc":"Austria / USA","rg":["North & Central America","Europe"],"yr":1942,"era":"1900–1949","tag":"Hidden figure","x":"Hedy Lamarr was a Hollywood star of the 1930s and 40s, often called the most beautiful woman in the world. Few knew she was also a gifted inventor. Her first husband was an arms dealer, and listening in on his business meetings gave her an interest in weapons technology. During the Second World War, with the composer George Antheil, she patented 'frequency hopping': a radio-guided torpedo would jump between frequencies in a pattern known only to sender and receiver, making it almost impossible to jam. Antheil's idea was to synchronise the hops using piano-roll mechanisms. The US Navy dismissed it, but versions were later used in military communications, and the principle underpins Bluetooth and some Wi-Fi.","q":"Why does frequency hopping make a signal harder to jam?"},{"id":"wav-008","t":"Philo Farnsworth: ploughing lines into television","s":"Physics","tp":"Waves","sub":"Electron beams","lv":["GCSE","A-Level"],"who":"Philo Farnsworth","f":0,"loc":"USA","rg":["North & Central America"],"yr":1927,"era":"1900–1949","tag":"Invention","x":"As a teenager on a farm in Idaho, Philo Farnsworth found a pile of science magazines in the attic and devoured them. He said the idea for electronic television came while ploughing a field in rows: an electron beam could scan an image line by line, just like his furrows. He sketched it for his chemistry teacher at 15. In 1927 he transmitted his first image – a straight line – and later showed backers a dollar sign. When the giant company RCA challenged his patent, his old teacher testified about the schoolboy sketches, and Farnsworth won. He also worked on a small fusion device known as the fusor.","q":"How is scanning an image line by line like ploughing a field?"},{"id":"wav-009","t":"Percy Spencer's melted snack","s":"Physics","tp":"Waves","sub":"Microwaves","lv":["KS3","GCSE"],"who":"Percy Spencer","f":0,"loc":"USA","rg":["North & Central America"],"yr":1945,"era":"1900–1949","tag":"Accident","x":"In 1945 the engineer Percy Spencer was working at Raytheon on magnetrons, the microwave generators used in wartime radar. Standing near one, he noticed the snack bar in his pocket had melted – though he felt no heat. (Many accounts say chocolate; his grandson thinks it was a peanut bar he carried to feed squirrels.) Spencer sent out for popcorn kernels, which popped. Next he tried an egg, which shook, trembled and exploded in the face of a curious colleague. Raytheon's first microwave oven, the 'Radarange', was nearly two metres tall and weighed more than 300 kg.","q":"Why did the egg explode but the popcorn simply pop?"},{"id":"wav-010","t":"Microwave myths and mysteries","s":"Physics","tp":"Waves","sub":"Microwaves","lv":["KS3","GCSE"],"who":"","f":0,"loc":"Worldwide","rg":["Worldwide"],"yr":1970,"era":"1950–1999","tag":"Everyday","x":"Salty food heats a little faster in a microwave because dissolved sodium and chloride ions are pushed back and forth by the oscillating field, as well as water molecules being twisted. Ice, by contrast, absorbs microwaves poorly, which is why defrosting takes so long. And why does the turntable sometimes spin one way and sometimes the other? Not for even heating: the cheap motors used simply start in whichever direction they are nudged.","q":"Why does a frozen block take much longer to warm than the same mass of water?"},{"id":"wav-011","t":"Hearing microwaves","s":"Physics","tp":"Waves","sub":"Microwaves","lv":["GCSE","A-Level"],"who":"Allan Frey","f":0,"loc":"USA","rg":["North & Central America"],"yr":1961,"era":"1950–1999","tag":"Wartime","x":"During the Second World War, some radar operators reported hearing clicks and buzzes when standing near powerful transmitters. In 1961 the scientist Allan Frey studied the effect in the laboratory. Pulses of microwaves cause a tiny, rapid heating of tissue in the head; the tissue expands slightly, launching a pressure wave that the inner ear detects as sound. The 'microwave auditory effect' needs very intense pulses and is not something a phone or oven can do.","q":"How can an electromagnetic wave produce a sound wave?"},{"id":"wav-012","t":"Jagadish Chandra Bose and the timetable polariser","s":"Physics","tp":"Waves","sub":"Microwaves","lv":["GCSE","A-Level"],"who":"Jagadish Chandra Bose","f":0,"loc":"India","rg":["South Asia"],"yr":1895,"era":"1800s","tag":"Hidden figure","x":"In 1895, in Calcutta Town Hall, the Indian physicist Jagadish Chandra Bose sent millimetre-wavelength radio waves – what we would now call microwaves – through walls and through the body of the governor, using them to ring a bell and set off gunpowder. He invented new detectors and horn antennas still used today. To demonstrate polarisation, he built a polariser from a thick railway timetable with sheets of tin foil between the pages. Bose refused to patent much of his work, believing knowledge should be shared, and later became a pioneer of plant physiology.","q":"Why would sheets of metal foil act as a polariser for microwaves but not visible light?"},{"id":"wav-013","t":"The perytons of Parkes","s":"Physics","tp":"Waves","sub":"Microwaves","lv":["KS3","GCSE","A-Level"],"who":"Emily Petroff","f":1,"loc":"Australia","rg":["Oceania"],"yr":2015,"era":"2000 onwards","tag":"Blunder","x":"For seventeen years, the Parkes radio telescope in New South Wales occasionally picked up short, mysterious bursts of radio waves, nicknamed 'perytons'. Some astronomers wondered if they were linked to the newly discovered fast radio bursts from deep space. In 2015, a team including the young astronomer Emily Petroff tracked them down: they happened when someone opened the door of the staff-room microwave oven before it had finished, letting out a brief burst – but only when the telescope was pointing in a particular direction. Real fast radio bursts, it turned out, are genuine cosmic signals.","q":"What steps would you take to rule out a local cause for a strange signal?"},{"id":"wav-014","t":"Purkyně: famous enough for 'Europe'","s":"Biology","tp":"Senses","sub":"Visible light","lv":["GCSE","A-Level"],"who":"Jan Evangelista Purkyně","f":0,"loc":"Czech Republic","rg":["Europe"],"yr":1825,"era":"1800s","tag":"Discovery","x":"The Czech scientist Jan Purkyně noticed that colours change with brightness. In daylight a red flower looks brighter than a blue one, but at dusk the red fades to black while the blue still shows – the Purkinje effect. It happens because in dim light we switch from cone cells to rod cells, which are most sensitive to blue-green light. He also described the four faint reflections from the front and back of the cornea and lens, now used by eye-tracking cameras, and was the first to describe fingerprints scientifically. He was so well known that a letter addressed simply to 'Purkyně, Europe' supposedly reached him.","q":"Why do red objects look darker than blue ones at twilight?"},{"id":"wav-015","t":"Faraday's emergency lecture","s":"Physics","tp":"Waves","sub":"EM spectrum","lv":["GCSE","A-Level"],"who":"Michael Faraday, Charles Wheatstone","f":0,"loc":"UK","rg":["Europe"],"yr":1846,"era":"1800s","tag":"Accident","x":"In 1846, Charles Wheatstone – inventor of the concertina and the Wheatstone bridge – was due to give an evening lecture at the Royal Institution, but lost his nerve and fled just before it began. Michael Faraday stepped in and improvised. Running out of material, he shared a speculation: perhaps light is a vibration of the electric and magnetic lines of force that fill space. Two decades later, James Clerk Maxwell turned that idea into the mathematics of electromagnetic waves and acknowledged Faraday's hunch.","q":"How did Faraday's idea differ from the earlier view of light as a wave in a fluid 'ether'?"},{"id":"wav-016","t":"Forbidden colours","s":"Biology","tp":"Senses","sub":"Colour vision","lv":["GCSE","A-Level"],"who":"Hewitt Crane, Thomas Piantanida","f":0,"loc":"USA","rg":["North & Central America"],"yr":1983,"era":"1950–1999","tag":"Modern research","x":"Our visual system compares colours in opposing pairs – red against green, and blue against yellow – so it was thought impossible to see a 'reddish green' or a 'bluish yellow'. In 1983, two Californian researchers used an eye tracker to keep a red-and-green striped image perfectly still on volunteers' retinas. As the stripes stopped being refreshed by eye movements, the colours appeared to flood into one another and some people reported seeing colours they had no names for. The result is still debated, and repeat studies give mixed results.","q":"What does it mean to say colour is made in the brain, not in the light?"},{"id":"wav-017","t":"Two kinds of yellow","s":"Physics","tp":"Waves","sub":"Visible light","lv":["KS3","GCSE"],"who":"","f":0,"loc":"","rg":["Worldwide"],"yr":1850,"era":"1800s","tag":"Everyday","x":"Light with a wavelength around 580–590 nm looks yellow. But so does an equal mixture of red and green light, which contains no yellow wavelengths at all. Our eyes cannot tell the two apart, because both stimulate our red- and green-sensitive cones in the same proportions. Every phone and TV screen relies on this: there are no yellow pixels, only red, green and blue ones.","q":"Look at a screen through a magnifier. Where is the yellow?"},{"id":"wav-018","t":"Four-cone vision and the island of Pingelap","s":"Biology","tp":"Senses","sub":"Colour vision","lv":["GCSE","A-Level"],"who":"","f":0,"loc":"Micronesia","rg":["Oceania"],"yr":1775,"era":"1700s","tag":"Nature","x":"Most people have three types of cone cell, but some women carry genes for a fourth, and a few may see subtly more colour differences than the rest of us. Men are much more likely to be red–green colour-blind, because the relevant genes sit on the X chromosome. Total colour blindness is extremely rare – except on the Pacific island of Pingelap. After a typhoon in the 1770s left only around twenty survivors, one of whom carried the gene, the condition became common: today several per cent of islanders see the world only in shades of grey.","q":"Why would a disaster that reduced a population to a few survivors change how common a gene is?"},{"id":"wav-019","t":"Where blue disappears","s":"Biology","tp":"Senses","sub":"Colour vision","lv":["GCSE","A-Level"],"who":"","f":0,"loc":"","rg":["Worldwide"],"yr":1900,"era":"1900–1949","tag":"Everyday","x":"The centre of the retina, the fovea, gives our sharpest vision but contains almost no blue-sensitive cones. A tiny blue dot looked at directly can therefore seem colourless, and at a distance some colour pairs become hard to tell apart. Designers of naval signal flags and heraldic shields learned by experience which colour combinations stay distinct when seen from far away.","q":"Why might red-on-white be clearer from a distance than blue-on-black?"},{"id":"wav-020","t":"The mantis shrimp paradox","s":"Biology","tp":"Senses","sub":"Colour vision","lv":["KS3","GCSE","A-Level"],"who":"Hanne Thoen","f":1,"loc":"Australia","rg":["Oceania"],"yr":2014,"era":"2000 onwards","tag":"Nature","x":"Mantis shrimps have up to twelve types of colour receptor, compared with our three, so they were assumed to have extraordinary colour vision. When researchers led by Hanne Thoen tested them in Australia, the shrimps turned out to be worse than humans at telling similar colours apart: they needed colours about 25 nm apart, whereas we can distinguish differences of a few nanometres. The best explanation is speed: rather than comparing signals, each receptor may act like a quick 'yes/no' detector, letting the shrimp recognise colours almost instantly.","q":"Why might speed matter more than precision for a predator?"},{"id":"wav-021","t":"Your body glows","s":"Biology","tp":"Senses","sub":"Visible light","lv":["KS3","GCSE"],"who":"Masaki Kobayashi","f":0,"loc":"Japan","rg":["East Asia"],"yr":2009,"era":"2000 onwards","tag":"Modern research","x":"Japanese researchers using ultra-sensitive cameras in total darkness found that the human body gives off visible light – about a thousand times too faint for our eyes. The glow was strongest from the face, especially the cheeks, and varied through the day, peaking in the late afternoon. It is thought to come from chemical reactions involving free radicals produced in metabolism, which release a few photons as they happen.","q":"How could you design an experiment to detect such a faint light?"},{"id":"wav-022","t":"Seeing the invisible","s":"Biology","tp":"Senses","sub":"Infrared and ultraviolet","lv":["GCSE","A-Level"],"who":"Claude Monet","f":0,"loc":"France","rg":["Europe"],"yr":1923,"era":"1900–1949","tag":"Everyday","x":"Visible light lies in a narrow energy window: enough to trigger a reversible chemical change in the retina, not enough to damage it. Yet the edges blur. Some people see a very powerful infrared laser as a faint green, because two infrared photons are absorbed at once. People whose eye lens has been removed in cataract surgery may see a little into the ultraviolet, because the lens normally blocks it. The painter Claude Monet had a lens removed from one eye in 1923; some researchers think his later paintings look bluer when he used that eye.","q":"What does the lens of the eye do besides focusing light?"},{"id":"wav-023","t":"Snakes, bears and invisible heat","s":"Biology","tp":"Senses","sub":"Infrared","lv":["KS3","GCSE"],"who":"","f":0,"loc":"Worldwide","rg":["Worldwide"],"yr":1990,"era":"1950–1999","tag":"Nature","x":"Pit vipers, pythons and boas have special pits on their faces that detect infrared radiation from warm prey; they can sense temperature differences of around a thousandth of a degree. Polar bears are the opposite: their thick fur traps heat so well that they barely show up on infrared cameras. (A popular claim that their hairs act like optical fibres, channelling light to their black skin, turned out to be false.)","q":"Why would a polar bear be almost invisible on a thermal camera?"},{"id":"wav-024","t":"Cosmic latte","s":"Physics","tp":"Space","sub":"Galaxies","lv":["KS3","GCSE"],"who":"Karl Glazebrook, Ivan Baldry","f":0,"loc":"USA / Australia","rg":["Oceania","North & Central America"],"yr":2002,"era":"2000 onwards","tag":"Blunder","x":"In 2002, two astronomers averaged the light from about 200,000 galaxies to find the colour of the universe. They first announced it was a pale turquoise. Then they found a bug in their software and corrected the answer: the average colour of the cosmos is a creamy beige. They invited suggestions for a name, and 'cosmic latte' won.","q":"Why is it important to share your methods so others can spot mistakes?"},{"id":"wav-025","t":"Pinball protons and UV damage","s":"Biology","tp":"Senses","sub":"Ultraviolet","lv":["GCSE","A-Level"],"who":"","f":0,"loc":"","rg":["Worldwide"],"yr":2000,"era":"2000 onwards","tag":"Modern research","x":"Ultraviolet photons carry enough energy to break bonds in DNA. One proposed route is that UV kicks protons out of the base pairs, and these 'pinball protons' trigger a chain of damage as they move along the molecule. Most people's cells repair this damage constantly, but people with the rare condition xeroderma pigmentosum lack the repair process and must avoid sunlight almost completely.","q":"Why can UV damage DNA when visible light usually cannot?"},{"id":"wav-026","t":"The U-boats that painted themselves visible","s":"Physics","tp":"Waves","sub":"Infrared","lv":["GCSE"],"who":"Karl Dönitz","f":0,"loc":"Germany / UK","rg":["Europe"],"yr":1943,"era":"1900–1949","tag":"Wartime","x":"In the Battle of the Atlantic, the Allies sank more and more German U-boats – largely thanks to breaking the Enigma code and to improved radar. The German admiral Karl Dönitz came to believe the submarines were being found by their infrared heat, a rumour British agents happily encouraged. U-boats were painted with an infrared-reducing coating. Unfortunately for the Germans, the new paint made them easier to spot on radar.","q":"Why is it useful in war to make your enemy believe the wrong explanation?"},{"id":"wav-027","t":"Reindeer that see ultraviolet","s":"Biology","tp":"Senses","sub":"Ultraviolet","lv":["KS3","GCSE"],"who":"Glen Jeffery","f":0,"loc":"Norway / UK","rg":["Europe"],"yr":2011,"era":"2000 onwards","tag":"Nature","x":"Near the poles, snow reflects most of the Sun's ultraviolet, and humans can suffer snow blindness. Most mammals' lenses block UV, but researchers found reindeer can detect it. In the Arctic winter, this helps them spot lichen – one of their main foods – which absorbs UV and appears dark against the bright snow. Wolves' fur also shows up clearly, because it reflects UV differently from snow, giving the reindeer an early warning.","q":"How does seeing UV help an animal in a white, snowy world?"},{"id":"wav-028","t":"Bees prefer Van Gogh","s":"Biology","tp":"Senses","sub":"Colour vision","lv":["KS3"],"who":"Lars Chittka","f":0,"loc":"UK","rg":["Europe"],"yr":2006,"era":"2000 onwards","tag":"Modern research","x":"Researchers showed bumblebees reproductions of paintings of flowers by artists including Van Gogh and Gauguin, as well as a still life by Patrick Caulfield. The bees landed most often on Van Gogh's sunflowers. The study suggested bees are drawn to certain blues and colour patterns because, in nature, these flowers tend to offer more nectar. Bees see in a different range from us, including ultraviolet.","q":"Why might flowers and bees have evolved together?"},{"id":"wav-029","t":"Hippo sunscreen","s":"Biology","tp":"Adaptations","sub":"Ultraviolet","lv":["KS3","GCSE"],"who":"Yoko Saikawa, Kimiko Hashimoto","f":1,"loc":"Japan","rg":["East Asia"],"yr":2004,"era":"2000 onwards","tag":"Nature","x":"Hippos were long said to 'sweat blood'. In fact they ooze a colourless fluid that turns red and then brown within minutes. A Japanese team including Kimiko Hashimoto and Yoko Saikawa collected samples from zoo hippos and found two pigments, which they named hipposudoric acid (red) and norhipposudoric acid (orange). Together they absorb ultraviolet and visible light, acting as natural sunscreen, and seem to have antibacterial properties too.","q":"Why would a large animal that spends hours in the sun need sun protection?"},{"id":"wav-030","t":"Blondlot's N-rays","s":"Physics","tp":"Waves","sub":"X-rays","lv":["GCSE","A-Level"],"who":"Prosper-René Blondlot, Robert W. Wood","f":0,"loc":"France","rg":["Europe"],"yr":1903,"era":"1900–1949","tag":"Blunder","x":"In 1903 the respected French physicist René Blondlot announced a new type of radiation, 'N-rays', named after his university town of Nancy. He said they brightened sparks, came from the Sun and from stressed metal, and passed through aluminium. Dozens of other scientists published confirmations. The American Robert Wood visited Blondlot's darkened lab in 1904 and secretly removed a vital prism from the apparatus – yet Blondlot still 'saw' the effect. N-rays never existed. The episode is a classic case of seeing what you expect to see.","q":"How could Blondlot have designed his experiment so his expectations could not affect the results?"},{"id":"wav-031","t":"Röntgen's shadow of bones","s":"Physics","tp":"Waves","sub":"X-rays","lv":["KS3","GCSE","A-Level"],"who":"Wilhelm Röntgen, Anna Bertha Röntgen","f":1,"loc":"Germany","rg":["Europe"],"yr":1895,"era":"1800s","tag":"Discovery","x":"In November 1895, Wilhelm Röntgen noticed a faint glow on a fluorescent screen across his darkened lab while a covered cathode-ray tube was running. He blocked the path with card, a thick book and wood – the glow remained. Holding a piece of lead, he saw the bones of his own hand. He worked in secret for weeks, barely speaking at meals. The first X-ray photograph was of his wife Anna Bertha's hand, showing her wedding ring; on seeing it she is said to have exclaimed that she had seen her own death. Röntgen called them X-rays because he had no idea what they were, refused to patent them, and won the first Nobel Prize in Physics.","q":"Why did blocking the tube with card and a book help Röntgen decide he had found something new?"},{"id":"wav-032","t":"X-ray panic: lead underwear and opera glasses","s":"Physics","tp":"Waves","sub":"X-rays","lv":["KS3","GCSE"],"who":"","f":0,"loc":"UK / USA","rg":["North & Central America","Europe"],"yr":1896,"era":"1800s","tag":"Everyday","x":"Röntgen's discovery caused a public frenzy in 1896. Newspapers claimed X-rays could turn base metal into gold or photograph thoughts. People feared for their privacy: a London firm advertised X-ray-proof underwear, and a politician in New Jersey reportedly proposed banning X-ray opera glasses in theatres. One hopeful customer wrote to Thomas Edison asking him to send a pound of X-rays.","q":"Which modern technologies have caused similar public fears?"},{"id":"wav-033","t":"Tesla's spoiled photograph of Mark Twain","s":"Physics","tp":"Waves","sub":"X-rays","lv":["GCSE"],"who":"Nikola Tesla, Mark Twain","f":0,"loc":"USA","rg":["North & Central America"],"yr":1894,"era":"1800s","tag":"Accident","x":"Some months before Röntgen's announcement, Nikola Tesla was photographing his friend Mark Twain in his New York laboratory, lit by a glowing discharge tube. The plate came out fogged, apparently showing the image of a metal screw from the camera. When Tesla later read about X-rays, he realised his tube must have produced them and he had missed the discovery. Accounts of the story vary and some details are uncertain.","q":"What makes the difference between noticing something odd and making a discovery?"},{"id":"wav-034","t":"X-rays from sticky tape and sweets","s":"Physics","tp":"Waves","sub":"X-rays","lv":["GCSE","A-Level"],"who":"Seth Putterman, Francis Bacon","f":0,"loc":"USA / UK","rg":["North & Central America","Europe"],"yr":2008,"era":"2000 onwards","tag":"Modern research","x":"In 2008 researchers in California unrolled sticky tape in a vacuum and produced enough X-rays to image a finger. This is an extreme form of triboluminescence – light given off when materials are stressed or pulled apart. It has been noticed for centuries: in 1605 Francis Bacon recorded that scraped sugar sparkles, and crushing a wintergreen mint in a dark room makes a blue flash. Lightning also produces X-rays, though how is still not fully understood.","q":"Where does the energy for the X-rays come from when tape is peeled?"},{"id":"wav-035","t":"Marie Curie's 'little Curies'","s":"Physics","tp":"Atoms and radioactivity","sub":"X-rays","lv":["KS3","GCSE","A-Level"],"who":"Marie Curie, Irène Curie","f":1,"loc":"France","rg":["Europe"],"yr":1914,"era":"1900–1949","tag":"Wartime","x":"When the First World War broke out, Marie Curie realised that X-rays could help surgeons find bullets and shrapnel in wounded soldiers – but few field hospitals had the equipment. She raised money, persuaded wealthy people to donate cars, and fitted them with X-ray tubes powered by generators run from the car engine. She learned to drive and to repair the vehicles, and with her teenage daughter Irène trained around 150 women as radiology operators. The vans, nicknamed 'petites Curies', and fixed units are estimated to have helped over a million soldiers.","q":"What problems would you face running an X-ray machine in a battlefield?"},{"id":"wav-036","t":"Clarence Dally and Edison's fear of X-rays","s":"Physics","tp":"Atoms and radioactivity","sub":"X-rays","lv":["GCSE"],"who":"Thomas Edison, Clarence Dally","f":0,"loc":"USA","rg":["North & Central America"],"yr":1904,"era":"1900–1949","tag":"Tragedy","x":"Thomas Edison raced to develop a fluoroscope, a screen showing live X-ray images. His assistant Clarence Dally tested the tubes for hours each day, often using his own hands. He developed severe burns and ulcers, had both arms amputated, and died of cancer in 1904 – possibly the first American to die from X-ray exposure. Edison's own eyesight was damaged, and he abandoned the work, later saying he was afraid of X-rays.","q":"How do we now protect radiographers from X-rays?"},{"id":"wav-037","t":"Henry Moseley: lost at Gallipoli","s":"Chemistry","tp":"Periodic table","sub":"X-rays","lv":["GCSE","A-Level"],"who":"Henry Moseley","f":0,"loc":"UK / Turkey","rg":["Middle East","Europe"],"yr":1913,"era":"1900–1949","tag":"Tragedy","x":"In 1913, the young British physicist Henry Moseley measured the X-rays given off by different elements and found their frequencies rose in a perfectly regular way. This showed that each element has a whole number – its atomic number, the charge on its nucleus – and that the periodic table should be ordered by it. It explained gaps and predicted missing elements. Colleagues joked that he knew where to get a meal in Manchester at three in the morning. When war broke out he joined the army and was killed by a sniper at Gallipoli in 1915, aged 27. Partly because of his death, Britain later kept scientists away from front-line service.","q":"Why was ordering elements by atomic number better than ordering them by mass?"},{"id":"wav-038","t":"Paul Villard: the forgotten discoverer of gamma rays","s":"Physics","tp":"Atoms and radioactivity","sub":"Gamma rays","lv":["GCSE","A-Level"],"who":"Paul Villard","f":0,"loc":"France","rg":["Europe"],"yr":1900,"era":"1900–1949","tag":"Hidden figure","x":"In 1900 the French chemist Paul Villard was studying radiation from radium borrowed from the Curies. He noticed that, besides rays that a magnet could bend, something else got through: a very penetrating radiation that magnets did not deflect at all. He did not give it a name and moved on to other research. A few years later Ernest Rutherford called it 'gamma radiation', to go alongside the alpha and beta rays he had already named, and Villard's role was largely forgotten for decades.","q":"Why might naming something help a discoverer get remembered?"},{"id":"wav-039","t":"Dark lightning","s":"Physics","tp":"Atoms and radioactivity","sub":"Gamma rays","lv":["GCSE","A-Level"],"who":"C. T. R. Wilson","f":0,"loc":"UK / USA","rg":["North & Central America","Europe"],"yr":1925,"era":"1900–1949","tag":"Nature","x":"In 1925 C. T. R. Wilson, inventor of the cloud chamber, suggested that the strong electric fields inside thunderclouds might accelerate electrons close to the speed of light, releasing gamma rays. Decades later, gamma-ray satellites spotted brief flashes coming from thunderstorms. These 'terrestrial gamma-ray flashes' give off very little visible light, earning the name dark lightning. Passengers in a plane flying through one could receive a radiation dose comparable to several X-ray scans.","q":"How could an electric field give electrons so much energy?"},{"id":"wav-040","t":"Irradiated gems and grapefruits","s":"Physics","tp":"Atoms and radioactivity","sub":"Gamma rays","lv":["GCSE"],"who":"William Crookes","f":0,"loc":"UK / USA","rg":["North & Central America","Europe"],"yr":1904,"era":"1900–1949","tag":"Everyday","x":"Gamma rays can knock atoms out of place in a crystal, changing its colour. William Crookes buried a diamond in radium and found it turned bluish-green, and today colourless quartz and topaz are irradiated to make smoky or blue stones. Radiation is also used in plant breeding: exposing seeds to gamma rays or neutrons creates random mutations, and the deep red 'Rio Red' and 'Star Ruby' grapefruits came from this kind of breeding. The fruit is not radioactive.","q":"Why does eating a grapefruit bred using radiation not expose you to radiation?"},{"id":"wav-041","t":"Gamma-ray bursts and spy satellites","s":"Physics","tp":"Space","sub":"Gamma rays","lv":["GCSE","A-Level"],"who":"Ray Klebesadel","f":0,"loc":"USA","rg":["North & Central America"],"yr":1967,"era":"1950–1999","tag":"Accident","x":"In the 1960s the USA launched the Vela satellites to watch for secret Soviet nuclear tests. On 2 July 1967 they recorded a flash of gamma rays unlike any bomb. The data was filed away and only analysed later; in 1973 scientists announced that the flashes came from deep space. Gamma-ray bursts turned out to be the most powerful explosions in the universe – from merging neutron stars or collapsing giant stars. One might explain an odd spike of carbon-14 in Japanese tree rings from the year 774. Astronomers joke: if you've seen one gamma-ray burst, you've seen one gamma-ray burst.","q":"Why did it take years to realise the bursts came from space?"},{"id":"wav-042","t":"Space telescope parts that hunt bombs","s":"Physics","tp":"Atoms and radioactivity","sub":"Gamma rays","lv":["GCSE"],"who":"","f":0,"loc":"USA","rg":["North & Central America"],"yr":2000,"era":"2000 onwards","tag":"Modern research","x":"NASA's Compton Gamma Ray Observatory was deliberately brought down in 2000 after a gyroscope failed. Its detectors had a valuable ability: they could tell which direction gamma rays came from. Spare parts built for the spacecraft were reused in instruments to locate 'dirty bombs' – conventional explosives mixed with radioactive material – showing how space technology can find uses on the ground.","q":"Why is knowing the direction of radiation more useful than just knowing how much there is?"},{"id":"wav-043","t":"Gamma-ray lenses","s":"Physics","tp":"Waves","sub":"Refraction","lv":["A-Level"],"who":"","f":0,"loc":"Germany / France","rg":["Europe"],"yr":2012,"era":"2000 onwards","tag":"Modern research","x":"Glass lenses bend light, but the higher the frequency of radiation, the less it refracts, so lenses for gamma rays were thought impossible. Experiments in 2012 found that silicon does bend gamma rays very slightly – more than expected – possibly because of short-lived electron–positron pairs flickering near the atomic nuclei. Lenses might one day help focus gamma rays for medical imaging.","q":"Why is it hard to focus very high-frequency radiation?"},{"id":"wav-044","t":"The Goiânia accident","s":"Physics","tp":"Atoms and radioactivity","sub":"Gamma rays","lv":["GCSE","A-Level"],"who":"","f":0,"loc":"Brazil","rg":["South America"],"yr":1987,"era":"1950–1999","tag":"Tragedy","x":"In 1987 two men in Goiânia, Brazil, took apart a radiotherapy machine left in an abandoned clinic, hoping to sell it as scrap. Inside was a small capsule of caesium-137 chloride, a gamma emitter. A scrapyard owner noticed it glowed blue in the dark and showed it to friends and family, some of whom took fragments home. People fell ill but no one realised why, until a relative carried the material by bus to a health office. A visiting physicist borrowed a radiation detector, which went off the scale so far that he assumed it was broken. He stopped firefighters throwing the source into a river. Four people died and 249 were contaminated.","q":"What should be done to stop radioactive sources ending up in scrapyards?"},{"id":"wav-045","t":"Screams, nails and sounds we hate","s":"Biology","tp":"Senses","sub":"Sound","lv":["KS3","GCSE"],"who":"","f":0,"loc":"USA / Switzerland","rg":["North & Central America","Europe"],"yr":2015,"era":"2000 onwards","tag":"Modern research","x":"Why is fingernails on a blackboard so awful? Researchers found that it is not the highest frequencies that bother us, but those in the middle of our hearing range, where the human ear canal amplifies sound most. Others studying screams found that what makes them alarming is 'roughness': the loudness flickers on and off 30–150 times a second, far faster than ordinary speech. Alarms that use this roughness work better.","q":"How could you test which part of a sound makes it unpleasant?"},{"id":"wav-046","t":"LEAF: the loudest room in Europe","s":"Physics","tp":"Waves","sub":"Sound","lv":["KS3","GCSE"],"who":"","f":0,"loc":"Netherlands","rg":["Europe"],"yr":1990,"era":"1950–1999","tag":"Everyday","x":"A rocket launch is deafening, and the vibration can damage satellites. To test them, the European Space Agency built the Large European Acoustic Facility in the Netherlands, a chamber with half-metre-thick reinforced concrete walls and giant horns that blast sound at up to 154 decibels. No person could safely be inside at full volume.","q":"Why is it important to test satellites with sound as well as shaking?"},{"id":"wav-047","t":"Newton fudges the speed of sound","s":"Physics","tp":"Waves","sub":"Sound","lv":["GCSE","A-Level"],"who":"Isaac Newton","f":0,"loc":"UK","rg":["Europe"],"yr":1687,"era":"1500–1699","tag":"Blunder","x":"In the 1600s estimates of the speed of sound varied widely. Isaac Newton measured it in a covered walkway at Trinity College, Cambridge, by clapping and adjusting a pendulum to swing in time with the echoes. His measurements pointed to around 280–330 m/s. He also calculated a theoretical value of about 295 m/s. Rather than admit a mismatch, he quietly adjusted his experimental figures in later editions of the Principia to fit his theory better. His theory was actually missing an effect that Laplace later explained: air heats up slightly as it is compressed.","q":"What should a scientist do when theory and experiment disagree?"},{"id":"wav-048","t":"Physics in pop songs","s":"Physics","tp":"Quantum","sub":"Wave–particle","lv":["A-Level"],"who":"","f":0,"loc":"UK","rg":["Europe"],"yr":2015,"era":"2000 onwards","tag":"Eccentric","x":"Physics students have published tongue-in-cheek papers testing song lyrics. One calculated how slowly a person would have to move for their de Broglie wavelength to fall in the bass sound range – the answer is far, far slower than a snail. Another checked whether screams could power Britain, as in the film Monsters, Inc. Measuring a scream at around 8 W per square metre, it concluded the plan was not viable.","q":"Can you calculate whether a pop lyric is physically possible?"},{"id":"wav-049","t":"Boombox lung","s":"Biology","tp":"Senses","sub":"Sound","lv":["GCSE"],"who":"","f":0,"loc":"Belgium","rg":["Europe"],"yr":2004,"era":"2000 onwards","tag":"Everyday","x":"Doctors have described cases of collapsed lungs (pneumothorax) in young men who listened to very loud bass music – one had installed a 1000-watt subwoofer in his car. Low-frequency, high-intensity sound may set lung tissue vibrating near its resonant frequency, which is in the bass range. The effect is rare and seems to affect people already at risk.","q":"How can a sound wave cause physical damage?"},{"id":"wav-050","t":"The SOFAR channel","s":"Physics","tp":"Waves","sub":"Sound","lv":["GCSE","A-Level"],"who":"Maurice Ewing","f":0,"loc":"USA","rg":["North & Central America"],"yr":1944,"era":"1900–1949","tag":"Nature","x":"In the ocean, the speed of sound first falls with depth as the water gets colder, then rises again as pressure increases. In between, around 1 km deep at mid-latitudes, is a layer where sound is slowest. Sound waves entering this layer are refracted back into it, so they can travel thousands of kilometres with little loss – like light in an optical fibre. The American geophysicist Maurice Ewing explored this during the Second World War. Whales may use it to call across ocean basins, and the military used it to locate downed pilots who dropped small explosive charges.","q":"How is the SOFAR channel similar to an optical fibre?"},{"id":"wav-051","t":"Colladon's bell in Lake Geneva","s":"Physics","tp":"Waves","sub":"Sound","lv":["KS3","GCSE"],"who":"Daniel Colladon, Charles Sturm","f":0,"loc":"Switzerland","rg":["Europe"],"yr":1826,"era":"1800s","tag":"Discovery","x":"In 1826 the Swiss physicist Daniel Colladon and the mathematician Charles Sturm measured the speed of sound in water using two boats on Lake Geneva, about 14 km apart. In one, a bell was struck underwater at the same moment as gunpowder was lit, giving a flash. In the other boat, Colladon timed the gap between seeing the flash and hearing the bell through a listening trumpet in the water. They got about 1435 m/s – remarkably close to modern values. Colladon later showed that light could be guided inside a curving jet of water, an early step towards fibre optics.","q":"Why use a flash of light to mark the start of the timing?"},{"id":"wav-052","t":"Rogue waves: the sailors were right","s":"Physics","tp":"Waves","sub":"Water waves","lv":["KS3","GCSE","A-Level"],"who":"","f":0,"loc":"Norway / UK","rg":["Europe"],"yr":1995,"era":"1950–1999","tag":"Nature","x":"For centuries sailors told of monstrous waves appearing from nowhere, and scientists doubted them. On New Year's Day 1995, instruments on the Draupner gas platform in the North Sea recorded a single wave 25.6 m high while the surrounding waves were around 12 m. It was the first scientific proof. Rogue waves are thought to have sunk many large ships. In 2019 researchers from Oxford and Edinburgh recreated the Draupner wave in a circular wave tank by crossing two groups of waves at an angle.","q":"How could two sets of waves combine to make one huge wave?"},{"id":"wav-053","t":"Internal waves taller than skyscrapers","s":"Physics","tp":"Waves","sub":"Water waves","lv":["GCSE","A-Level"],"who":"","f":0,"loc":"South China Sea","rg":["East Asia"],"yr":2015,"era":"2000 onwards","tag":"Nature","x":"Waves can travel along the boundary between two layers of water with different densities, deep beneath the surface. Because the density difference is small, very little energy is needed to make them huge. In the Luzon Strait, between Taiwan and the Philippines, internal waves up to 170 m high have been measured, though the surface barely moves.","q":"Why do waves between layers of water need less energy than waves at the surface?"},{"id":"wav-054","t":"John Scott Russell chases a wave on horseback","s":"Physics","tp":"Waves","sub":"Water waves","lv":["GCSE","A-Level"],"who":"John Scott Russell, Mary Tsingou","f":1,"loc":"Scotland / USA","rg":["North & Central America","Europe"],"yr":1834,"era":"1800s","tag":"Discovery","x":"In August 1834, the Scottish engineer John Scott Russell watched a horse-drawn boat on the Union Canal near Edinburgh stop suddenly. The water pushed ahead of it rolled on as a single smooth hump, about 10 m long, and kept going. He chased it on horseback for over a mile before losing it. These 'solitary waves' kept their shape and did not merge when one overtook another. Over a century later, a computer simulation at Los Alamos by Fermi, Pasta, Ulam and the programmer Mary Tsingou produced a puzzling result that was eventually explained by 'solitons' – the same kind of wave. Solitons are now used to send pulses down optical fibres.","q":"What is unusual about a wave that does not spread out or change shape?"},{"id":"wav-055","t":"Rossby waves: planet-sized ripples","s":"Earth Science","tp":"Atmosphere and climate","sub":"Waves","lv":["A-Level"],"who":"Carl-Gustaf Rossby","f":0,"loc":"Sweden / USA","rg":["North & Central America","Europe"],"yr":1939,"era":"1900–1949","tag":"Nature","x":"Because Earth spins, moving air and water are deflected sideways (the Coriolis effect). This creates enormous slow meanders called Rossby waves, named after the Swedish-American meteorologist Carl-Gustaf Rossby. In the atmosphere they shape the jet stream and our weather. In the ocean they may be hundreds of kilometres long but only around 10 cm high at the surface, so only satellites can see them, and at mid-latitudes they can take a decade or more to cross the Pacific. Astronomers have also found Rossby waves on the Sun.","q":"How could a wave only 10 cm high be important?"},{"id":"wav-056","t":"Phantom traffic jams","s":"Physics","tp":"Waves","sub":"Waves in everyday life","lv":["KS3","GCSE"],"who":"Yuki Sugiyama","f":0,"loc":"Japan","rg":["East Asia"],"yr":2008,"era":"2000 onwards","tag":"Everyday","x":"Ever been stuck in a jam that cleared with no sign of an accident? In 2008, Japanese researchers asked 22 drivers to drive around a circular track at a steady speed. Within minutes, small variations in braking grew into a stop-start wave that travelled backwards around the circle, even though nothing caused it. Physicists model traffic like a fluid; when the density of cars goes above a critical value, jams form spontaneously.","q":"Why does a traffic jam wave travel backwards while cars travel forwards?"},{"id":"wav-057","t":"The Royal Albert Hall echo","s":"Physics","tp":"Waves","sub":"Reflection","lv":["KS3","GCSE"],"who":"Ken Shearer","f":0,"loc":"UK","rg":["Europe"],"yr":1871,"era":"1800s","tag":"Blunder","x":"When the Royal Albert Hall opened in 1871, the Prince of Wales's speech came back as a mocking echo off the enormous curved dome. Musicians joked it was the only venue where a composer could be sure of hearing their work twice. Fixes such as hanging a huge canvas sail helped only a little. In 1969, after tests led by the BBC's Ken Shearer, the hall installed 135 large fibreglass discs, nicknamed 'mushrooms', hung beneath the dome to scatter and absorb the sound.","q":"Why do curved surfaces cause particularly strong echoes?"},{"id":"wav-058","t":"Red eye","s":"Physics","tp":"Waves","sub":"Reflection","lv":["KS3"],"who":"","f":0,"loc":"","rg":["Worldwide"],"yr":1960,"era":"1950–1999","tag":"Everyday","x":"Red eyes in flash photos happen when the bright flash enters wide-open pupils and reflects off the blood-rich back of the eye straight back to the camera. Red-eye reduction fires a few quick pre-flashes first so the pupils shrink before the picture is taken. Cats' eyes shine green or gold instead because they have a reflecting layer behind the retina.","q":"Why does red-eye happen more in dark rooms?"},{"id":"wav-059","t":"Mirrors made of liquid","s":"Physics","tp":"Waves","sub":"Reflection","lv":["GCSE","A-Level"],"who":"Robert W. Wood","f":0,"loc":"India / Belgium / Canada","rg":["South Asia","North & Central America","Europe"],"yr":2022,"era":"2000 onwards","tag":"Invention","x":"Spin a bowl of liquid and its surface forms a perfect paraboloid – exactly the shape needed for a telescope mirror. With mercury, it becomes a highly reflective mirror at a fraction of the cost of grinding glass. Robert Wood experimented with this in 1908 but struggled with ripples from tiny wobbles. In 2022 the International Liquid Mirror Telescope began observing at Devasthal in the Himalayas of India: a 4 m mirror of mercury, just a few millimetres deep, spinning steadily and staring straight up as the sky drifts overhead.","q":"Why can a liquid mirror telescope only point straight up?"},{"id":"wav-060","t":"The true mirror","s":"Physics","tp":"Waves","sub":"Reflection","lv":["KS3"],"who":"John Walter","f":0,"loc":"USA","rg":["North & Central America"],"yr":1995,"era":"1950–1999","tag":"Invention","x":"An ordinary mirror shows you reversed front-to-back, so when you raise your right hand your reflection seems to raise its left. In the 1990s inventor John Walter made a 'true mirror' from two mirrors joined at a right angle, which undoes the reversal. Some people love seeing themselves as others see them; others find it oddly uncomfortable, because everyone's face is slightly asymmetric.","q":"Draw a ray diagram for two mirrors at 90°. Why does the image not reverse?"},{"id":"wav-061","t":"Hubble's flawed mirror and three washers","s":"Physics","tp":"Waves","sub":"Reflection","lv":["GCSE","A-Level"],"who":"C. Robert O'Dell","f":0,"loc":"USA","rg":["North & Central America"],"yr":1990,"era":"1950–1999","tag":"Blunder","x":"The Hubble Space Telescope's main mirror was ground with extraordinary precision – but to the wrong shape. The instrument used to test it had been assembled with a lens slightly out of position, apparently corrected with ordinary washers. Two other tests disagreed, but were dismissed as less accurate. After launch in 1990 the images were blurred, because the mirror edge was too flat by about one-fiftieth of the width of a human hair. In 1993 astronauts fitted corrective optics – effectively spectacles for the telescope – and Hubble went on to transform astronomy.","q":"What lesson does Hubble teach about ignoring results that disagree?"},{"id":"wav-062","t":"Charles Boys' crossbow fibres","s":"Physics","tp":"Waves","sub":"Total internal reflection","lv":["GCSE","A-Level"],"who":"Charles Vernon Boys","f":0,"loc":"UK","rg":["Europe"],"yr":1887,"era":"1800s","tag":"Eccentric","x":"Doctors were using bent glass rods to light up body cavities by the 1880s. Meanwhile, the British physicist Charles Boys needed incredibly thin fibres to hang delicate instruments. His solution: dip the end of an arrow in molten quartz and fire it from a small crossbow, pulling out a thread up to tens of metres long and only a few thousandths of a millimetre thick. One of his students, H. G. Wells, complained that Boys seemed more interested in his apparatus than in teaching. Thin glass fibres now carry the internet.","q":"Why do thin glass fibres trap light?"},{"id":"wav-063","t":"Bernhard Schmidt: the one-handed lens maker","s":"Physics","tp":"Space","sub":"Telescopes","lv":["GCSE","A-Level"],"who":"Bernhard Schmidt","f":0,"loc":"Estonia / Germany","rg":["Europe"],"yr":1930,"era":"1900–1949","tag":"Eccentric","x":"Bernhard Schmidt grew up on an Estonian island and began making lenses as a boy by grinding bottle bottoms with sand. At 15 he lost his right hand in an accident with homemade explosives, yet became one of the finest optical craftsmen in Europe, testing mirrors on 'artificial stars' made of silver balls hung in trees. In 1930, after returning from an eclipse expedition, he invented the Schmidt camera, which uses a thin corrector plate to give sharp wide-angle views of the sky. When he first tested it, he could read the names on gravestones in a distant cemetery. A Schmidt design flew on the Kepler planet-hunting telescope.","q":"What does a 'wide field of view' let a telescope do?"},{"id":"wav-064","t":"Snell's window","s":"Physics","tp":"Waves","sub":"Refraction","lv":["GCSE","A-Level"],"who":"","f":0,"loc":"","rg":["Worldwide"],"yr":1621,"era":"1500–1699","tag":"Nature","x":"Look up from underwater and the whole sky is squeezed into a bright circle directly overhead, about 97° across. This is Snell's window, caused by refraction at the surface; outside it you see a mirror-like reflection of the bottom due to total internal reflection. Fish see the world above through this window. Anglers who keep low and far away appear squashed and blurry at its edge – one reason fishing advice says to keep a low profile.","q":"Why does the window have a sharp edge?"},{"id":"wav-065","t":"Mirages, looming and the Fata Morgana","s":"Physics","tp":"Waves","sub":"Refraction","lv":["GCSE","A-Level"],"who":"","f":0,"loc":"Italy / Australia / Arctic","rg":["Antarctica & Arctic","Oceania","Europe"],"yr":1900,"era":"1900–1949","tag":"Nature","x":"Air's refractive index changes with temperature, so layers of hot and cold air bend light. A 'puddle' on a hot road is an image of the sky bent upwards. Over cold seas, light bends down, so ships can appear floating above the horizon or towering like castles – the Fata Morgana, named after Morgan le Fay and often seen in the Strait of Messina. In the Arctic, refraction can make the Sun appear days before it should, and in outback Queensland the mysterious 'Min Min lights' are thought to be distant lights bent over the horizon.","q":"Why does the 'water' on a hot road always disappear as you get closer?"},{"id":"wav-066","t":"Alexander's dark band","s":"Physics","tp":"Waves","sub":"Refraction","lv":["GCSE","A-Level"],"who":"Alexander of Aphrodisias","f":0,"loc":"Greece / Turkey","rg":["Middle East","Europe"],"yr":200,"era":"Ancient","tag":"Nature","x":"Around AD 200, the Greek philosopher Alexander of Aphrodisias noticed that the sky between a primary and a secondary rainbow is darker than the sky around it. This 'Alexander's band' happens because raindrops in that part of the sky cannot send refracted and reflected light to your eye at the right angles. Look out for it next time you see a double rainbow – and notice that the colours of the second bow are reversed.","q":"Why are the colours reversed in the secondary bow?"},{"id":"wav-067","t":"A feather as a diffraction grating","s":"Physics","tp":"Waves","sub":"Diffraction","lv":["A-Level"],"who":"James Gregory","f":0,"loc":"Scotland","rg":["Europe"],"yr":1673,"era":"1500–1699","tag":"Discovery","x":"In 1673 the Scottish mathematician James Gregory wrote to a friend describing an experiment he hoped Newton would see: let sunlight through a small hole into a dark room and hold a fine white feather in its path. On the wall appear rings and spots, a white centre surrounded by colours. The regular barbs of the feather were acting as a diffraction grating, nearly a century and a half before diffraction was understood.","q":"Try it: look at a distant streetlight through a feather. What do you see?"},{"id":"wav-068","t":"Glories, coronas and sun dogs","s":"Physics","tp":"Waves","sub":"Diffraction","lv":["GCSE","A-Level"],"who":"","f":0,"loc":"Worldwide","rg":["Worldwide"],"yr":1900,"era":"1900–1949","tag":"Nature","x":"Coloured rings close around the Sun or Moon – a corona – are made by diffraction of light by tiny cloud droplets. A glory is a coloured halo around the shadow of your head, seen from a mountaintop or an aeroplane window, opposite the Sun. Ice crystals shaped like hexagonal prisms in high clouds refract light by 22°, producing a ring around the Sun and bright 'sun dogs' on either side of it.","q":"Why is the halo around the Sun always about the same size?"},{"id":"wav-069","t":"Young's lost bet","s":"Physics","tp":"Waves","sub":"Interference","lv":["A-Level"],"who":"Thomas Young","f":0,"loc":"UK","rg":["Europe"],"yr":1799,"era":"1700s","tag":"Eccentric","x":"Thomas Young was a genius who helped decipher the Rosetta Stone and showed that light is a wave. As a student at Cambridge in 1799, a friend bet that Young would produce a paper on sound better than anything published before he graduated. He did publish on sound and light in 1800 – but the college record shows he was judged to have lost the bet. Legend has it he came up with interference by watching ripples from two swans on the college pond.","q":"What happens where two sets of ripples meet?"},{"id":"wav-070","t":"Newton and the strange tides of Tonkin","s":"Earth Science","tp":"Oceans","sub":"Superposition","lv":["A-Level"],"who":"Isaac Newton, Edmond Halley","f":0,"loc":"Vietnam / UK","rg":["Europe"],"yr":1687,"era":"1500–1699","tag":"Discovery","x":"An English traveller reported that the port of Tonkin, near modern Hanoi in Vietnam, had only one tide a day instead of two, and on some days almost none. Newton explained it in his Principia: tides arrived by two routes of different lengths, from the South China Sea and from the Indian Ocean. Where the peaks of one met the troughs of the other, they cancelled. It was an early use of superposition – though Newton did not apply the same thinking to light.","q":"How can two waves add up to almost nothing?"},{"id":"wav-071","t":"The green flash","s":"Physics","tp":"Waves","sub":"Refraction","lv":["GCSE","A-Level"],"who":"","f":0,"loc":"Worldwide","rg":["Worldwide"],"yr":1882,"era":"1800s","tag":"Nature","x":"Just as the Sun sinks below a clear sea horizon, the last sliver can flash green for a second or two. The atmosphere acts as a weak prism: it bends blue and green light more than red, so the Sun is really a stack of slightly offset coloured images. The red image sets first, and most of the blue is scattered away, leaving green as the final colour seen.","q":"Why does the atmosphere bend different colours by different amounts?"},{"id":"wav-072","t":"A standing wave on Venus","s":"Earth Science","tp":"Space","sub":"Planets","lv":["GCSE","A-Level"],"who":"","f":0,"loc":"Japan","rg":["East Asia"],"yr":2015,"era":"2000 onwards","tag":"Modern research","x":"In 2015, Japan's Akatsuki spacecraft spotted a giant bow-shaped feature in the clouds of Venus, stretching about 10,000 km from pole to pole. It stayed still over a mountainous region even though the cloud tops race around the planet at over 300 km/h. Scientists think winds flowing over the mountains of Aphrodite Terra create a gravity wave in the atmosphere that stays fixed in place.","q":"How can a wave stay still while the air moves through it?"},{"id":"wav-073","t":"Gravitational waves or ravens?","s":"Physics","tp":"Space","sub":"Gravitational waves","lv":["GCSE","A-Level"],"who":"","f":0,"loc":"USA","rg":["North & Central America"],"yr":2017,"era":"2000 onwards","tag":"Everyday","x":"LIGO detects gravitational waves by measuring changes in distance smaller than a proton. In 2017, staff at the Hanford site noticed strange glitches in the data. The culprits were ravens, pecking at ice on pipes carrying cold nitrogen gas; the vibrations reached the vacuum system. The pipes were wrapped in insulation, and one scientist joked that you could hardly blame the birds for wanting shaved ice on a hot desert afternoon.","q":"Why must gravitational wave detectors be isolated from vibrations?"},{"id":"wav-074","t":"Not Newton's rings","s":"Physics","tp":"Waves","sub":"Interference","lv":["A-Level"],"who":"Robert Hooke, Robert Boyle","f":0,"loc":"UK","rg":["Europe"],"yr":1665,"era":"1500–1699","tag":"Rivalry","x":"Put a curved lens on a flat sheet of glass and you see concentric rings, caused by interference between light reflected from the glass and from the lens. They are called Newton's rings, but Robert Hooke and Robert Boyle had described them first. Newton studied them carefully but explained them with his particle theory of light rather than as interference. Hooke and Newton became bitter rivals.","q":"Why do the rings get closer together further from the centre?"},{"id":"wav-075","t":"Clapotis at the cliffs","s":"Earth Science","tp":"Oceans","sub":"Standing waves","lv":["GCSE","A-Level"],"who":"","f":0,"loc":"Worldwide","rg":["Worldwide"],"yr":1900,"era":"1900–1949","tag":"Nature","x":"When waves hit a vertical cliff or sea wall and bounce back, the reflected waves meet the incoming ones and form standing waves, a process called clapotis. Where peaks meet, water can shoot dramatically upward and the extra force erodes sea walls. When waves strike at an angle, the overlapping crests make a criss-cross diamond pattern, poetically called 'clapotis gaufré' after the pattern of a waffle.","q":"Where along a standing wave does the water move most?"},{"id":"wav-076","t":"Malus: the soldier who slept through a massacre","s":"Physics","tp":"Waves","sub":"Polarisation","lv":["A-Level"],"who":"Étienne-Louis Malus","f":0,"loc":"France / Egypt","rg":["Africa","Europe"],"yr":1808,"era":"1800s","tag":"Discovery","x":"Étienne-Louis Malus worked as a labourer during the French Revolution until an engineer noticed his talent and sent him to the École Polytechnique. He joined Napoleon's army in Egypt, survived plague and fighting, and wrote about optics in his spare hours. In 1808, from his home in Paris, he looked through a calcite crystal at sunlight reflected off the windows of the Luxembourg Palace and noticed that one of the two images faded as he turned the crystal. He had discovered that reflection polarises light. His law for how much light gets through a polariser is used today.","q":"How can you show sunlight reflected from water is polarised?"},{"id":"wav-077","t":"Polarised light traps","s":"Biology","tp":"Ecology","sub":"Polarisation","lv":["GCSE","A-Level"],"who":"Gábor Horváth","f":0,"loc":"Hungary","rg":["Europe"],"yr":2009,"era":"2000 onwards","tag":"Modern research","x":"Many insects find water by looking for horizontally polarised light reflecting from its surface. Ecologists, including Hungarian researchers led by Gábor Horváth, have found that shiny dark surfaces – glass buildings, solar panels, asphalt and oil pools – reflect polarised light too, luring mayflies and caddisflies to lay eggs where they cannot survive. Birds then follow the insects into oil. This 'polarised light pollution' can be reduced by using rougher, paler surfaces or white grid lines on panels.","q":"Why would an insect mistake a car roof for a lake?"},{"id":"wav-078","t":"Haidinger's brush: seeing polarisation","s":"Biology","tp":"Senses","sub":"Polarisation","lv":["A-Level"],"who":"Wilhelm Haidinger","f":0,"loc":"Austria","rg":["Europe"],"yr":1844,"era":"1800s","tag":"Everyday","x":"Humans are mostly blind to polarisation, but many people can learn to see a faint yellowish figure-of-eight called Haidinger's brush, first described by the Austrian mineralogist Wilhelm Haidinger in 1844. It is easiest to see by looking at a white computer screen (whose light is polarised) and tilting your head, or at a clear blue sky at 90° to the Sun. It comes from pigment molecules arranged radially in the centre of the retina.","q":"Try it: stare at a white LCD screen and tilt your head. Can you see the brush?"},{"id":"wav-079","t":"Viking sunstones","s":"Physics","tp":"Waves","sub":"Polarisation","lv":["GCSE","A-Level"],"who":"","f":0,"loc":"Scandinavia","rg":["Europe"],"yr":1000,"era":"Medieval","tag":"Nature","x":"How did Vikings navigate when clouds hid the Sun? Sagas mention a 'sunstone', and some researchers have suggested it was a crystal such as Iceland spar or cordierite which, when turned against the sky, reveals the direction of polarised light and therefore where the Sun is. A calcite crystal was found in a 16th-century English shipwreck near the navigation instruments. However, tests suggest that heavily overcast skies are not polarised enough for the method to work well, so the idea remains disputed.","q":"What evidence would convince you the Vikings really used sunstones?"},{"id":"wav-080","t":"Why white horses get fewer bites","s":"Biology","tp":"Adaptations","sub":"Polarisation","lv":["GCSE","A-Level"],"who":"Gábor Horváth, Susanne Åkesson","f":1,"loc":"Hungary / Sweden","rg":["Europe"],"yr":2010,"era":"2000 onwards","tag":"Modern research","x":"White horses are easier for predators to see and are more prone to sunburn, so why does the colour persist? Researchers in Hungary and Sweden found that horseflies, which spread diseases, are strongly attracted to horizontally polarised light, and dark coats reflect more of it. They coated model horses with glue: the brown and black models trapped many times more flies than the white one. It may also explain why zebras have stripes.","q":"How might stripes confuse a fly's polarisation sense?"},{"id":"wav-081","t":"The eyeball that resonates","s":"Biology","tp":"Senses","sub":"Resonance","lv":["GCSE","A-Level"],"who":"Vic Tandy","f":0,"loc":"UK / USA","rg":["North & Central America","Europe"],"yr":1998,"era":"1950–1999","tag":"Eccentric","x":"Research for the US Air Force on vibration suggested the human eyeball resonates at around 19 Hz – sound too low to hear. Vibration at this frequency might blur vision. In 1998 the British engineer Vic Tandy, working in a 'haunted' laboratory, felt uneasy and saw a grey shape in the corner of his eye. He traced it to a fan producing a 19 Hz standing wave. Some researchers have since linked infrasound to 'ghostly' experiences, though this remains controversial.","q":"Why might sound you cannot hear still affect you?"},{"id":"wav-082","t":"Tesla shakes Manhattan","s":"Physics","tp":"Waves","sub":"Resonance","lv":["GCSE","A-Level"],"who":"Nikola Tesla, Mark Twain","f":0,"loc":"USA","rg":["North & Central America"],"yr":1898,"era":"1800s","tag":"Eccentric","x":"Tesla claimed he fixed a small mechanical oscillator to an iron pillar in his New York lab and found it made objects across the room vibrate as he tuned the frequency. The vibrations spread to nearby buildings, windows rattled and police arrived – just after he smashed the device with a hammer. He boasted he could bring down a bridge with a similar machine. He also persuaded Mark Twain to stand on a vibrating platform he thought healthy; Twain soon had to rush to the toilet. Many of these stories come from Tesla himself, so they may be exaggerated.","q":"What does 'resonance' mean, and why can it be dangerous?"},{"id":"wav-083","t":"The skyscraper that shook during an exercise class","s":"Physics","tp":"Waves","sub":"Resonance","lv":["KS3","GCSE"],"who":"","f":0,"loc":"South Korea","rg":["East Asia"],"yr":2011,"era":"2000 onwards","tag":"Everyday","x":"In July 2011, the 39-storey Techno Mart building
