 stresses the thin wire, which is why old bulbs often failed with a flash just as they were switched on. Carbon filaments behave the other way: their resistance falls as they get hotter. Over time tungsten evaporates from the filament and blackens the glass.","q":"Sketch the I–V graph for a filament lamp. Why does it curve?"},{"id":"elm-043","t":"Hertha Ayrton: arc lights and ripples","s":"Physics","tp":"Electricity","sub":"Resistance","lv":["KS3","GCSE","A-Level"],"who":"Hertha Ayrton","f":1,"loc":"UK","rg":["Europe"],"yr":1899,"era":"1800s","tag":"Hidden figure","x":"Hertha Ayrton worked out why electric arc lamps – the street lights of the 1890s – hissed and flickered: oxygen was reaching the hot carbon rods. Because she was a woman, the Institution of Electrical Engineers made her the first female member in 1899, but at the Royal Society a man had to read her paper for her. In 1904 she became the first woman to present her own paper there, on how sand ripples form. She invented an anti-gas fan used in the First World War trenches, campaigned for women's votes, and sheltered Marie Curie and her daughters from the press in 1912. Her obituary in a leading journal still suggested her husband would have been happier if she had had more time to cook.","q":"Why might it matter who is allowed to present a scientific discovery?"},{"id":"elm-044","t":"Dogs, cows and Earth's magnetic field","s":"Biology","tp":"Behaviour","sub":"Magnetism","lv":["KS3","GCSE"],"who":"Sabine Begall, Hynek Burda","f":1,"loc":"Germany / Czech Republic","rg":["Europe"],"yr":2008,"era":"2000 onwards","tag":"Modern research","x":"In 2008 a team including Sabine Begall used Google Earth images to report that grazing cattle and deer tend to line up north–south. In 2013 the same group studied 70 dogs and found they preferred to line up north–south when going to the toilet, but only when Earth's magnetic field was calm. Both results remain debated, and other teams have not always confirmed them. Many animals certainly do sense magnetic fields: bees, pigeons, turtles and some bacteria, which contain tiny crystals of magnetite.","q":"How could you test whether cows really align with the magnetic field?"},{"id":"elm-045","t":"The magnet that lives in a cow","s":"Physics","tp":"Magnetism","sub":"Magnets","lv":["KS3"],"who":"","f":0,"loc":"Worldwide","rg":["Worldwide"],"yr":1950,"era":"1950–1999","tag":"Everyday","x":"Cows swallow food without chewing it much, and sometimes swallow nails, wire or other metal bits from the field. These can pierce the stomach, causing 'hardware disease'. Farmers feed cows a 'cow magnet' – a smooth bar magnet about the size of a finger – which stays in the stomach for life, collecting the iron and steel bits so they can't do harm.","q":"Would a cow magnet catch an aluminium ring pull? Why?"},{"id":"elm-046","t":"Bitter magnets and record fields","s":"Physics","tp":"Magnetism","sub":"Electromagnets","lv":["A-Level"],"who":"Francis Bitter","f":0,"loc":"USA","rg":["North & Central America"],"yr":1933,"era":"1900–1949","tag":"Invention","x":"Electromagnets with iron cores can't go much past 2 tesla, because the iron saturates. In the 1930s the American physicist Francis Bitter designed a magnet made from stacked copper plates with holes for cooling water, carrying tens of thousands of amps. Hybrid magnets combining Bitter coils with superconducting coils at the National High Magnetic Field Laboratory in Florida reach around 45 T – about a million times Earth's field. In fields this strong, even a frog can be levitated, since water is weakly repelled by magnets.","q":"Why do such magnets need so much cooling water?"},{"id":"elm-047","t":"Space tethers","s":"Physics","tp":"Magnetism","sub":"Induction","lv":["A-Level"],"who":"Konstantin Tsiolkovsky","f":0,"loc":"Russia / USA / Italy","rg":["North & Central America","Europe"],"yr":1996,"era":"1950–1999","tag":"Invention","x":"In 1895 the Russian space pioneer Konstantin Tsiolkovsky, inspired by the Eiffel Tower, imagined a 'celestial castle' linked to Earth by an enormous tower. A more practical idea is a conducting cable hanging from a satellite: moving through Earth's magnetic field, it has a voltage induced across it and could generate electricity. In 1996 the Space Shuttle Columbia unreeled a tether nearly 20 km long, generating thousands of volts, before it snapped – probably after an electrical discharge burned through it.","q":"Why would an electricity-generating tether slow the satellite down?"},{"id":"elm-048","t":"Earth's magnetic spike recorded in slag","s":"Earth Science","tp":"Earth's magnetism","sub":"Archaeomagnetism","lv":["GCSE","A-Level"],"who":"Erez Ben-Yosef","f":0,"loc":"Israel / Jordan","rg":["Middle East"],"yr":2009,"era":"2000 onwards","tag":"Modern research","x":"When molten material cools, tiny magnetic minerals inside freeze in line with Earth's magnetic field at the time. Archaeologists led by Erez Ben-Yosef measured the magnetism of slag – waste from ancient copper smelting in the Middle East – and found that around 1000 BCE the magnetic field in the region briefly became about twice as strong, then fell back within a few decades. Nobody expected the field to change so fast.","q":"Why does cooling lava or slag record the magnetic field?"},{"id":"eng-001","t":"Misty Picture: the biggest bang without a bomb","s":"Physics","tp":"Energy","sub":"Energy stores","lv":["GCSE"],"who":"","f":0,"loc":"USA","rg":["North & Central America"],"yr":1987,"era":"1950–1999","tag":"Wartime","x":"To mimic the blast of a small nuclear weapon without radiation, in 1987 the US military piled nearly 4,700 tonnes of ammonium nitrate and fuel oil in a hemisphere at White Sands, New Mexico, and set it off. 'Misty Picture' released about 33 TJ – roughly the energy of 8,000 tonnes of TNT – making it one of the largest planned non-nuclear explosions ever. For comparison, burning a litre of petrol releases about 30 MJ, a million times less.","q":"How many litres of petrol hold the same energy as Misty Picture?"},{"id":"eng-002","t":"Is celery really a negative-calorie food?","s":"Biology","tp":"Nutrition","sub":"Energy in food","lv":["KS3","GCSE"],"who":"","f":0,"loc":"USA","rg":["North & Central America"],"yr":2019,"era":"2000 onwards","tag":"Modern research","x":"Some diets claim celery takes more energy to digest than it provides. Researchers at the University of Alabama tested this with bearded dragons, which digest plants in a similar way to us. They measured the energy in the celery and in the lizards' droppings and found the reptiles kept about a quarter of the energy – so celery is low-calorie, but not negative.","q":"How would you measure the energy an animal gets from food?"},{"id":"eng-003","t":"Émilie du Châtelet: inferior to no one","s":"Physics","tp":"Energy","sub":"Kinetic energy","lv":["GCSE","A-Level"],"who":"Émilie du Châtelet, Voltaire, Willem 's Gravesande","f":1,"loc":"France / Netherlands","rg":["Europe"],"yr":1740,"era":"1700s","tag":"Hidden figure","x":"In the 1700s scientists argued over whether the 'force' of a moving object depended on mv or mv². The Dutch physicist Willem 's Gravesande dropped brass balls into soft clay and found a ball going twice as fast made a dent four times as deep – supporting mv². Émilie du Châtelet, a French mathematician, combined his results with Leibniz's ideas and argued powerfully for what we now call kinetic energy. When women were banned from a Paris café where scientists met, she had a man's suit made and went in anyway. She became the first woman to have a paper published by the Paris Academy of Sciences. Pregnant at 43, she worked through the nights to finish translating Newton's Principia into French – still the standard French version – and died days after giving birth.","q":"Why does a ball moving twice as fast make a dent four times as deep?"},{"id":"eng-004","t":"Scott's fatal miscalculation","s":"Biology","tp":"Nutrition","sub":"Energy in food","lv":["KS3","GCSE"],"who":"Robert Falcon Scott","f":0,"loc":"Antarctica / UK","rg":["Antarctica & Arctic","Europe"],"yr":1912,"era":"1900–1949","tag":"Tragedy","x":"Robert Falcon Scott's team reached the South Pole in January 1912, only to find Roald Amundsen had beaten them. All five died on the way back. One factor was energy. Each man got about 4,400 kcal of food a day, but hauling heavy sledges across ice at altitude in extreme cold used perhaps 6,000–7,000 kcal. They steadily starved, losing weight every week. Their rations were high in protein; modern polar rations contain far more fat, which stores more than twice as much energy per gram.","q":"Why are high-fat foods better for long polar journeys?"},{"id":"eng-005","t":"Joule: brewer, experimenter, risk-taker","s":"Physics","tp":"Energy","sub":"Conservation of energy","lv":["GCSE","A-Level"],"who":"James Joule","f":0,"loc":"UK","rg":["Europe"],"yr":1845,"era":"1800s","tag":"Discovery","x":"James Joule came from a family of brewers in Salford and did his experiments with the brewery's precise thermometers. His most famous showed that falling weights turning a paddle wheel in water warm it by a definite amount – mechanical work and heat are interchangeable. He was not always careful: he loaded a pistol with three times the gunpowder to test an echo in the Lake District, and the recoil threw it into a lake. The story that he measured waterfalls on his honeymoon may be a myth. After surviving a train crash he disliked travelling. His gravestone is engraved with 772.55, his measurement of how much work heats a pound of water by one degree Fahrenheit.","q":"Where does the energy go when the paddle wheel churns the water?"},{"id":"eng-006","t":"Count Rumford: spy, inventor and boring cannons","s":"Physics","tp":"Energy","sub":"Heat","lv":["GCSE","A-Level"],"who":"Benjamin Thompson (Count Rumford), Marie-Anne Paulze Lavoisier","f":1,"loc":"USA / Germany / UK","rg":["North & Central America","Europe"],"yr":1798,"era":"1700s","tag":"Eccentric","x":"Benjamin Thompson was born in Massachusetts, spied for the British during the American Revolution, fled to Europe and became an official in Bavaria, where he was made Count Rumford. Overseeing the boring of cannons in Munich, he noticed that a blunt drill could boil water as long as it kept turning. That showed heat was not a fluid called 'caloric' stored in the metal, but came from motion. He also designed better fireplaces, a drip coffee pot, a nourishing soup for the poor, and helped found the Royal Institution in London. He married Marie-Anne Lavoisier, widow of the chemist who had championed caloric – but they quarrelled bitterly and separated.","q":"How did the never-ending heat from the drill disprove caloric?"},{"id":"eng-007","t":"Joseph Black's 'curious and puzzling thing'","s":"Chemistry","tp":"Particles","sub":"Latent heat","lv":["GCSE","A-Level"],"who":"Joseph Black","f":0,"loc":"Scotland","rg":["Europe"],"yr":1761,"era":"1700s","tag":"Discovery","x":"Joseph Black, a professor in Glasgow, noticed that melting ice soaks up a lot of heat without getting any warmer. Mix equal amounts of ice and very hot water, and the result is barely above freezing. He called this hidden energy 'latent heat', and also showed that different substances need different amounts of heat to warm up – specific heat. Black was also the first to identify carbon dioxide, which he called 'fixed air', and helped his friend James Watt understand the heat losses in steam engines.","q":"Why does ice cool a drink so much better than ice-cold water?"},{"id":"eng-008","t":"How many people built the Great Pyramid?","s":"Physics","tp":"Energy","sub":"Work done","lv":["KS3","GCSE"],"who":"","f":0,"loc":"Egypt","rg":["Africa"],"yr":-2560,"era":"Ancient","tag":"Everyday","x":"The Greek historian Herodotus claimed the Great Pyramid took 100,000 workers twenty years. A physicist estimated the total work needed to lift its 2.3 million stone blocks into place at around 10¹³ J. If each worker could do about 600 kJ of useful work a day, around 10,000 people over 10 years would be enough. Archaeologists today think a workforce of about this size, mostly skilled paid workers rather than slaves, did build it.","q":"Estimate the gravitational potential energy of one 2.5 tonne block lifted 50 m."},{"id":"eng-009","t":"Why one horsepower is more than a horse","s":"Physics","tp":"Energy","sub":"Power","lv":["KS3","GCSE"],"who":"James Watt","f":0,"loc":"UK","rg":["Europe"],"yr":1782,"era":"1700s","tag":"Invention","x":"To sell steam engines to mine and mill owners who used horses, James Watt needed a way to compare them. He watched horses turning a mill wheel, measured how much work they did, and generously rounded up. One horsepower became about 746 W. A typical horse can only keep this up for a few hours, though it can manage several horsepower in short bursts. Watt also invented a copying machine for letters, using special ink and damp paper, after growing tired of copying business correspondence by hand.","q":"Calculate your own power running up a flight of stairs."},{"id":"eng-010","t":"Energy in running tracks and swimming","s":"Biology","tp":"Health","sub":"Energy transfers","lv":["GCSE"],"who":"","f":0,"loc":"","rg":["Worldwide"],"yr":1980,"era":"1950–1999","tag":"Everyday","x":"With each stride, a runner's Achilles tendon stores some elastic energy and returns it, like a spring. Tracks designed to bounce back at the right rate can return a little extra energy and make runners slightly faster. Swimming in cool water burns energy partly because water conducts heat away from your body far faster than air, so more food energy goes into keeping warm.","q":"Why does a swimmer feel colder in water than in air at the same temperature?"},{"id":"eng-011","t":"Norman water mills","s":"Physics","tp":"Energy","sub":"Renewable energy","lv":["KS3","GCSE"],"who":"","f":0,"loc":"England","rg":["Europe"],"yr":1086,"era":"Medieval","tag":"Everyday","x":"The Domesday Book of 1086 recorded around 6,000 water mills in England. A physicist estimated each one produced roughly a kilowatt – about the power of a kettle – adding up to several megawatts nationwide. That is a fraction of the output of a single modern wind turbine, yet it transformed medieval life by grinding grain without human or animal muscle.","q":"How many medieval mills would match a modern 3 MW wind turbine?"},{"id":"eng-012","t":"Solar furnaces and singed birds","s":"Physics","tp":"Energy","sub":"Renewable energy","lv":["GCSE"],"who":"","f":0,"loc":"France / USA","rg":["North & Central America","Europe"],"yr":1970,"era":"1950–1999","tag":"Everyday","x":"At Odeillo in the French Pyrenees, a whole hillside of mirrors reflects sunlight onto a huge curved mirror, which focuses it onto a target reaching about 3,500 °C – used to test spacecraft heat shields. At the Ivanpah solar power plant in California's Mojave Desert, mirrors focus sunlight onto towers to make steam. Birds chasing insects drawn to the bright towers were being burned, so the operators changed how the plant works to protect them.","q":"How do mirrors concentrate energy?"},{"id":"eng-013","t":"The boiling river of the Amazon","s":"Earth Science","tp":"Rocks and geology","sub":"Geothermal energy","lv":["KS3","GCSE"],"who":"Andrés Ruzo","f":0,"loc":"Peru","rg":["South America"],"yr":2011,"era":"2000 onwards","tag":"Discovery","x":"As a boy in Peru, Andrés Ruzo heard his grandfather's legend of a river so hot it boiled. As a geoscientist in 2011 he found it: the Shanay-Timpishka, deep in the Amazon rainforest, flows for several kilometres at around 86 °C – hot enough to cook animals that fall in. Yet the nearest active volcano is hundreds of kilometres away. Ruzo showed the water is rainwater that seeps deep underground along cracks, is heated by Earth's natural heat, and returns through hot springs.","q":"How does Earth's interior heat water without a volcano?"},{"id":"eng-014","t":"Erasto Mpemba's hot ice cream","s":"Physics","tp":"Energy","sub":"Thermal energy","lv":["KS3","GCSE","A-Level"],"who":"Erasto Mpemba, Denis Osborne","f":0,"loc":"Tanzania","rg":["Africa"],"yr":1963,"era":"1950–1999","tag":"Hidden figure","x":"In 1963, Erasto Mpemba, a schoolboy in Tanzania, was making ice cream. In a rush, he put his hot milk mixture in the freezer without cooling it first, and it froze before his friends' cooler mixtures. His teacher laughed and called it 'Mpemba's physics'. When the physicist Denis Osborne visited the school, Mpemba asked him about it. Osborne tested it, and they published a paper together in 1969. Aristotle and Francis Bacon had mentioned similar effects. Whether, and why, hot water can freeze faster is still argued about: evaporation, dissolved gases and convection may play a part, and some careful experiments do not find the effect.","q":"Design a fair test to check the Mpemba effect."},{"id":"eng-015","t":"Einstein's fridge","s":"Physics","tp":"Energy","sub":"Thermal energy","lv":["GCSE","A-Level"],"who":"Albert Einstein, Leo Szilard","f":0,"loc":"Germany","rg":["Europe"],"yr":1926,"era":"1900–1949","tag":"Invention","x":"In 1926 Einstein read about a Berlin family killed by toxic gas leaking from their refrigerator. With his former student Leo Szilard, he designed safer fridges with no moving parts, which they patented. The company Electrolux bought one design, but improved compressor fridges using new, non-toxic refrigerants made it unnecessary. One of their prototypes reportedly made a noise like a howling jackal.","q":"How does evaporation cool a fridge?"},{"id":"eng-016","t":"Lord Kelvin's heaven, purgatory and hell","s":"Physics","tp":"Energy","sub":"Temperature","lv":["GCSE","A-Level"],"who":"William Thomson (Lord Kelvin), Ernest Rutherford","f":0,"loc":"Scotland / Ireland","rg":["Europe"],"yr":1904,"era":"1900–1949","tag":"Eccentric","x":"William Thomson, born in Belfast, attended classes at Glasgow University aged ten and taught there until he was 75. In lectures he kept students' names on cards in a box with three sections – purgatory (not yet asked), heaven (answered correctly) and hell (wrong, to be asked again). He worked on the first transatlantic telegraph cable and the absolute temperature scale that bears his name. But he calculated that Earth was only tens of millions of years old, not knowing about radioactivity. In 1904 the young Ernest Rutherford had to lecture on radium's heat in front of him; seeing Kelvin wake up, he tactfully said Kelvin had allowed for a new source of heat being found. The old man beamed.","q":"Why did the discovery of radioactivity change estimates of Earth's age?"},{"id":"eng-017","t":"Thermodynamics in song","s":"Physics","tp":"Energy","sub":"Thermodynamics","lv":["GCSE","A-Level"],"who":"Flanders and Swann","f":0,"loc":"UK","rg":["Europe"],"yr":1963,"era":"1950–1999","tag":"Everyday","x":"The British comedy duo Flanders and Swann wrote 'First and Second Law', a song explaining that energy cannot be created or destroyed and that heat cannot flow from a cooler body to a hotter one on its own. It ends by predicting that everything in the universe will eventually cool down. Its jokes about heat and work are still used by teachers today.","q":"Why does heat always flow from hot to cold?"},{"id":"eng-018","t":"The Yarkovsky effect","s":"Physics","tp":"Space","sub":"Asteroids","lv":["A-Level"],"who":"Ivan Yarkovsky","f":0,"loc":"Poland / Russia / USA","rg":["North & Central America","Europe"],"yr":1900,"era":"1900–1949","tag":"Discovery","x":"Around 1900, the engineer Ivan Yarkovsky realised that a spinning asteroid warmed by the Sun radiates heat unevenly, as its afternoon side is warmest. The infrared photons carry momentum away, giving the asteroid a tiny push that, over millions of years, changes its orbit. NASA's OSIRIS-REx spacecraft measured this effect on the asteroid Bennu and, in 2023, returned samples of Bennu to Earth. Understanding the push helps predict which asteroids might one day threaten us.","q":"How can light give something a push?"},{"id":"eng-019","t":"A brief history of temperature scales","s":"Physics","tp":"Energy","sub":"Temperature","lv":["KS3","GCSE"],"who":"Anders Celsius, Carl Linnaeus, Daniel Fahrenheit","f":0,"loc":"Sweden / Netherlands","rg":["Europe"],"yr":1742,"era":"1700s","tag":"Everyday","x":"Early thermometers, like those of Galileo, had no fixed scale, and at one stage there were over thirty competing temperature scales. Newton made his own, using linseed oil. Daniel Fahrenheit in the Netherlands made the first reliable mercury thermometers. In 1742 the Swedish astronomer Anders Celsius created a 100-degree scale – but with water boiling at 0 and freezing at 100. After his death the scale was flipped, a change often credited to the botanist Carl Linnaeus.","q":"Why do thermometers need two fixed points?"},{"id":"eng-020","t":"How Kelvin found absolute zero","s":"Physics","tp":"Energy","sub":"Absolute zero","lv":["GCSE","A-Level"],"who":"William Thomson (Lord Kelvin), Sadi Carnot, John Dalton","f":0,"loc":"UK / France","rg":["Europe"],"yr":1848,"era":"1800s","tag":"Discovery","x":"Is there a coldest possible temperature? John Dalton guessed it was thousands of degrees below freezing. Gas experiments suggested gases would shrink to nothing at about –273 °C, but scientists assumed that just meant the gas laws broke down. William Thomson read the forgotten work of the French engineer Sadi Carnot on heat engines and realised there really was an absolute zero, where no more energy could be taken out. In 1848 he proposed the absolute temperature scale now measured in kelvin.","q":"Why can nothing be colder than absolute zero?"},{"id":"eng-021","t":"Julius Mayer and the red blood of the tropics","s":"Physics","tp":"Energy","sub":"Conservation of energy","lv":["GCSE","A-Level"],"who":"Julius Robert Mayer","f":0,"loc":"Germany / Indonesia","rg":["Southeast Asia","Europe"],"yr":1842,"era":"1800s","tag":"Tragedy","x":"In 1840 the German ship's doctor Julius Mayer was bleeding sailors in Java, then part of the Dutch East Indies, and noticed their blood from veins was unusually bright red. He reasoned that in the heat the body needed to burn less food to keep warm, so less oxygen was used up. This led him to the idea that heat, motion and other forms of 'force' are one quantity that can change form but is never lost – conservation of energy. His work was ignored, he lost several children and suffered terrible depression, and others such as Joule got the credit. Late in life, he finally received recognition.","q":"Why would people in hot climates need to 'burn' less food?"},{"id":"eng-022","t":"A cat co-authors a physics paper","s":"Physics","tp":"How science works","sub":"Publishing","lv":["KS3","GCSE"],"who":"Jack Hetherington","f":0,"loc":"USA","rg":["North & Central America"],"yr":1975,"era":"1950–1999","tag":"Eccentric","x":"In 1975 the American physicist Jack Hetherington wrote a paper on low-temperature helium-3, but used 'we' throughout. Rather than retype it, he added a co-author: his Siamese cat, Chester, named as F. D. C. Willard – Felis domesticus, Chester, and Willard after the cat's father. The paper was published in Physical Review Letters. Willard later 'wrote' a paper on his own, and was once offered a visiting professorship.","q":"Why do scientific papers list their authors so carefully?"},{"id":"eng-023","t":"Burnt toast and melting ice","s":"Earth Science","tp":"Atmosphere and climate","sub":"Albedo","lv":["KS3","GCSE"],"who":"","f":0,"loc":"USA / Arctic","rg":["Antarctica & Arctic","North & Central America"],"yr":2017,"era":"2000 onwards","tag":"Everyday","x":"Toast burns quickly at the end because once it starts to darken, it absorbs more infrared and heats up even faster – a runaway effect. Earth has the same problem: bright ice reflects sunlight, but as it melts it exposes dark sea or rock, which absorbs more energy, warming the planet further. Cities can use the effect in reverse: Los Angeles has painted some streets with pale reflective coatings that lowered surface temperatures by several degrees.","q":"Why does a dark surface warm faster in sunlight?"},{"id":"eng-024","t":"Fridges before electricity","s":"Physics","tp":"Energy","sub":"Evaporation","lv":["KS3","GCSE"],"who":"Mohammed Bah Abba, Emily Cummins","f":1,"loc":"Nigeria / Australia / UK","rg":["Oceania","Africa","Europe"],"yr":1995,"era":"1950–1999","tag":"Invention","x":"Evaporation cools. Ancient Egyptians and Indians kept water cold in porous clay pots. Australian gold miners built 'Coolgardie safes': mesh cupboards covered with wet hessian. In the 1990s the Nigerian teacher Mohammed Bah Abba designed the 'pot-in-pot' cooler: a clay pot inside a larger one, with wet sand between, keeping vegetables fresh for weeks without power. The British inventor Emily Cummins later designed an evaporative fridge, built from simple materials, which has been used in southern Africa.","q":"Why does evaporation lower the temperature of what is left behind?"},{"id":"eng-025","t":"Buffon's glowing cannonballs","s":"Earth Science","tp":"Rocks and geology","sub":"Age of the Earth","lv":["GCSE"],"who":"Georges-Louis Leclerc, Comte de Buffon","f":0,"loc":"France","rg":["Europe"],"yr":1778,"era":"1700s","tag":"Discovery","x":"The French naturalist Buffon believed Earth had formed as a molten ball. He heated iron spheres of different sizes until they glowed and timed how long they took to cool enough to touch. Scaling up to Earth's size, he estimated our planet was about 75,000 years old – shockingly old at the time, when many believed it was about 6,000. Privately he thought it might be much older. We now know it is about 4.5 billion years old.","q":"Why do larger objects take longer to cool?"},{"id":"eng-026","t":"Francis Bacon and the frozen chicken","s":"Biology","tp":"Microorganisms","sub":"Food preservation","lv":["KS3"],"who":"Francis Bacon","f":0,"loc":"England","rg":["Europe"],"yr":1626,"era":"1500–1699","tag":"Tragedy","x":"Francis Bacon, who championed experiments as the way to knowledge, is said to have died for one. According to a story later told by the philosopher Thomas Hobbes, on a snowy day in 1626 Bacon wondered whether cold could preserve meat. He bought a chicken, stuffed it with snow, caught a chill and died a few days later. Historians are not sure the story is true, but freezing is now a key way of slowing bacteria in food.","q":"Why does cold slow down food going off?"},{"id":"eng-027","t":"The stack effect","s":"Physics","tp":"Energy","sub":"Convection","lv":["KS3","GCSE"],"who":"","f":0,"loc":"","rg":["Worldwide"],"yr":1950,"era":"1950–1999","tag":"Everyday","x":"In tall buildings, warm air rises and escapes near the top, sucking cold air in at the bottom – the stack effect. In winter this can make ground-floor doors so hard to open that skyscrapers use revolving doors. You can sometimes see it on scaffolding sheeting: pulled inwards at the bottom and pushed outwards at the top.","q":"Why do skyscrapers often have revolving doors?"},{"id":"eng-028","t":"The British Standard cup of tea","s":"Chemistry","tp":"Chemical analysis","sub":"Standard methods","lv":["KS3"],"who":"","f":0,"loc":"UK","rg":["Europe"],"yr":1980,"era":"1950–1999","tag":"Everyday","x":"In 1980 the British Standards Institution published BS 6008, a method for making tea for professional tasters. It specifies a white porcelain pot with a lid, a particular amount of tea for the size of pot, freshly boiled water and six minutes of brewing. It even covers when to add milk – milk first to avoid scalding it, though it allows tea first if poured at 65–80 °C. Standards like this make sure tests are repeatable.","q":"Why do scientists need standard methods?"},{"id":"eng-029","t":"Why the Tube gets so hot","s":"Physics","tp":"Energy","sub":"Thermal energy","lv":["KS3","GCSE"],"who":"","f":0,"loc":"UK","rg":["Europe"],"yr":2019,"era":"2000 onwards","tag":"Everyday","x":"When London's deep Tube lines were built, the clay around them was about 14 °C and the trains were advertised as a cool escape. Over a century, energy from braking trains, motors and passengers has heated the clay to 20–25 °C, so it no longer soaks up heat. Some carriages have topped 35 °C. Engineers are testing ways to reuse braking energy and new lines like the Elizabeth line blow cool air over braking systems in stations.","q":"Where does the kinetic energy of a braking train end up?"},{"id":"eng-030","t":"Pictet reflects the cold","s":"Physics","tp":"Energy","sub":"Infrared radiation","lv":["GCSE"],"who":"Marc-Auguste Pictet","f":0,"loc":"Switzerland","rg":["Europe"],"yr":1790,"era":"1700s","tag":"Discovery","x":"In 1790 the Swiss scientist Marc-Auguste Pictet set two curved metal mirrors facing each other a few metres apart. At the focus of one he put a thermometer, at the other a flask of snow. The thermometer dropped. It seemed 'cold' was being reflected. In fact, the thermometer was radiating heat that the mirrors focused onto the snow, while receiving little back – an early clue to infrared radiation.","q":"What is really travelling between the mirrors?"},{"id":"eng-031","t":"Concorde and the stuck hat","s":"Physics","tp":"Matter","sub":"Thermal expansion","lv":["KS3","GCSE"],"who":"","f":0,"loc":"UK / France","rg":["Europe"],"yr":2003,"era":"2000 onwards","tag":"Everyday","x":"At twice the speed of sound, air friction heated Concorde's skin to over 100 °C, and the aircraft stretched by around 20–30 cm. It was painted brilliant white to reflect sunlight. When Air France painted one blue for an advertising campaign, pilots were told to limit time at top speed. In flight, a gap opened beside the flight engineer's panel; legend says on the last flight in 2003 an engineer put his cap in it, trapping it forever when the plane cooled.","q":"Why does metal expand when heated?"},{"id":"eng-032","t":"The duck curve","s":"Physics","tp":"Energy","sub":"National grid","lv":["GCSE","A-Level"],"who":"","f":0,"loc":"USA","rg":["North & Central America"],"yr":2013,"era":"2000 onwards","tag":"Everyday","x":"Electricity grid operators in California plotted demand minus solar power through the day. The graph dipped at midday as solar panels poured out energy, then rose steeply after sunset when people came home, cooked and switched on lights. The shape looked like a duck. It shows why storing energy – in batteries or pumped water – matters more as solar power grows.","q":"Draw the duck curve. How could storage flatten it?"},{"id":"eng-033","t":"Solar ponds","s":"Physics","tp":"Energy","sub":"Renewable energy","lv":["GCSE","A-Level"],"who":"","f":0,"loc":"Israel","rg":["Middle East"],"yr":1980,"era":"1950–1999","tag":"Invention","x":"An ordinary pond can't store much solar energy because warm water rises and loses heat at the surface. Dissolve lots of salt in the bottom layer and the dense salty water stays put even when hot, while fresher water floats on top as an insulating lid. These solar ponds can reach around 90 °C at the bottom. Israel built a large solar pond power plant near the Dead Sea in the 1980s.","q":"Why does the salt stop convection?"},{"id":"eng-034","t":"Measuring the Sun's power","s":"Physics","tp":"Space","sub":"The Sun","lv":["GCSE","A-Level"],"who":"Claude Pouillet, John Herschel","f":0,"loc":"France / South Africa","rg":["Africa","Europe"],"yr":1838,"era":"1800s","tag":"Discovery","x":"In 1838 the French physicist Claude Pouillet let sunlight fall on a blackened container of water and measured how quickly it warmed. Around the same time, John Herschel at the Cape of Good Hope in South Africa made similar measurements. Both calculated that the Sun's energy reaching Earth in a year could melt a layer of ice many metres thick covering the whole globe. Their value for the 'solar constant' was close to the modern figure of about 1.36 kW per square metre.","q":"How would you measure the power of sunlight with a beaker of water?"},{"id":"eng-035","t":"Kardashev's scale of civilisations","s":"Physics","tp":"Space","sub":"Energy use","lv":["GCSE","A-Level"],"who":"Nikolai Kardashev","f":0,"loc":"Russia","rg":["Europe"],"yr":1964,"era":"1950–1999","tag":"Everyday","x":"In 1964 the Soviet astronomer Nikolai Kardashev suggested ranking alien civilisations by their energy use. Type I uses all the energy reaching its planet; Type II captures all of its star's output, perhaps with a vast shell of solar collectors; Type III harnesses a whole galaxy. Carl Sagan estimated humanity was about Type 0.7 – we still have a long way to go.","q":"What would a Type I civilisation need to do differently from us?"},{"id":"eng-036","t":"Milanković's ice-age cycles","s":"Earth Science","tp":"Atmosphere and climate","sub":"Orbital cycles","lv":["GCSE","A-Level"],"who":"Milutin Milanković","f":0,"loc":"Serbia","rg":["Europe"],"yr":1920,"era":"1900–1949","tag":"Discovery","x":"The Serbian engineer Milutin Milanković spent decades calculating, by hand, how slow changes in Earth's orbit shape the climate: the orbit's stretch changes over about 100,000 years, the tilt of Earth's axis over 41,000 years, and the wobble of the axis over about 26,000 years. Together these cycles alter how much sunlight reaches high northern latitudes in summer and pace the ice ages. Some of his work was done while held as a prisoner of war in Budapest in the First World War. These cycles are far too slow to explain the rapid warming of the past century.","q":"Why can't orbital cycles explain recent global warming?"},{"id":"eng-037","t":"The blunt body that survived re-entry","s":"Physics","tp":"Space","sub":"Re-entry","lv":["GCSE","A-Level"],"who":"H. Julian Allen","f":0,"loc":"USA / USSR","rg":["North & Central America"],"yr":1952,"era":"1950–1999","tag":"Invention","x":"A pointed rocket nose seems best for speed, but on re-entry it would melt. In 1952 the NASA engineer H. Julian Allen showed that a blunt shape is better: it pushes a shock wave in front of it, and the hot compressed air carries much of the heat away instead of passing it into the craft. American Mercury, Gemini and Apollo capsules had broad, rounded heat shields, while Soviet Vostok capsules were spheres.","q":"Why does a blunt shape keep the spacecraft cooler?"},{"id":"qnp-001","t":"Max Planck: told physics was finished","s":"Physics","tp":"Quantum","sub":"Planck","lv":["GCSE","A-Level"],"who":"Max Planck, Philipp von Jolly","f":0,"loc":"Germany","rg":["Europe"],"yr":1900,"era":"1900–1949","tag":"Discovery","x":"When the young Max Planck said he wanted to study physics, his professor Philipp von Jolly advised against it: almost everything had been discovered, and only a few holes remained to be filled. In 1900 Planck found he could only explain the light glowing from hot objects if energy came in tiny packets, or quanta – the beginning of quantum physics. Planck was a fine pianist who played music with Einstein. His life was full of tragedy: his first wife and both daughters died young, one son was killed in the First World War, and another, Erwin, was executed in 1945 for his part in the plot to kill Hitler.","q":"Why might it be unwise to believe a subject is 'finished'?"},{"id":"qnp-002","t":"The napkin bet on Planck's constant","s":"Physics","tp":"Quantum","sub":"Planck constant","lv":["A-Level"],"who":"Shisong Li","f":0,"loc":"USA / China","rg":["East Asia","North & Central America"],"yr":2017,"era":"2000 onwards","tag":"Modern research","x":"In 2013 scientists at the US National Institute of Standards and Technology, who had just measured Planck's constant precisely with a Kibble (watt) balance, each wrote a guess for its final value on a napkin, sealed the napkins in a bottle and buried it in the foundations of a new building. In 2017, when the value was fixed, the winner was Shisong Li of China's National Institute of Metrology. His prize was a rum cake with the constant written in icing. Since 2019, Planck's constant has been fixed exactly, and the kilogram is defined from it.","q":"How can a fundamental constant be used to define the kilogram?"},{"id":"qnp-003","t":"Schrödinger: poet, hiker and a dog","s":"Physics","tp":"Quantum","sub":"Wave mechanics","lv":["A-Level"],"who":"Erwin Schrödinger","f":0,"loc":"Austria / Ireland","rg":["Europe"],"yr":1926,"era":"1900–1949","tag":"Eccentric","x":"Erwin Schrödinger, who wrote the central equation of quantum mechanics, once said he had really wanted to be a poet. He hated formal clothes: at the 1927 Solvay conference he wore a sports jacket, and he once turned up at a conference hotel in hiking gear with a rucksack, looking so scruffy he was nearly refused entry. He is famous for an imaginary cat, but in Dublin, where he lived from 1939, the family kept a collie called Burschie.","q":"What was Schrödinger's cat thought experiment meant to show?"},{"id":"qnp-004","t":"Hertz's puzzling spark","s":"Physics","tp":"Quantum","sub":"Photoelectric effect","lv":["A-Level"],"who":"Heinrich Hertz","f":0,"loc":"Germany","rg":["Europe"],"yr":1887,"era":"1800s","tag":"Accident","x":"While working on radio waves in 1887, Heinrich Hertz noticed that the small spark in his detector was weaker when he put a glass sheet between it and the transmitting spark, but not when he used quartz, which lets ultraviolet through. Ultraviolet light was helping electrons escape from the metal. Hertz wrote that the effect was striking but puzzling. It was the first observation of the photoelectric effect, which Einstein explained in 1905 using photons.","q":"Why did quartz behave differently from glass?"},{"id":"qnp-005","t":"Philipp Lenard: from Nobel winner to Nazi","s":"Physics","tp":"Quantum","sub":"Photoelectric effect","lv":["A-Level"],"who":"Philipp Lenard, Albert Einstein","f":0,"loc":"Germany","rg":["Europe"],"yr":1902,"era":"1900–1949","tag":"Rivalry","x":"Philipp Lenard discovered that the energy of electrons knocked out of a metal by light depends on the light's frequency, not its brightness – a key clue for Einstein. The two were friendly at first, but Lenard became bitterly jealous, especially when Einstein alone won the Nobel Prize for the photoelectric effect. Lenard became a leading Nazi scientist, denouncing relativity and 'Jewish physics'. When the war ended, he was considered too old to be put on trial and spent his last years ignored.","q":"Why did brighter light not give electrons more energy?"},{"id":"qnp-006","t":"Millikan: reluctant supporter of photons","s":"Physics","tp":"Quantum","sub":"Photoelectric effect","lv":["A-Level"],"who":"Robert Millikan","f":0,"loc":"USA","rg":["North & Central America"],"yr":1916,"era":"1900–1949","tag":"Blunder","x":"In 1916 Robert Millikan carefully measured the photoelectric effect and found Einstein's equation worked perfectly. Yet in his paper he called Einstein's light quanta a bold, even reckless, hypothesis, and said it seemed to have been abandoned. Later in life, in his autobiography, he presented his experiments as proof of photons. He was also selective in other ways: in his textbook, a photograph of J. J. Thomson had his cigarette removed.","q":"Can an experiment support an equation without convincing people of the idea behind it?"},{"id":"qnp-007","t":"Compton's balloon-sized electron","s":"Physics","tp":"Quantum","sub":"Photons","lv":["A-Level"],"who":"Arthur Compton, Ernest Rutherford","f":0,"loc":"USA / UK","rg":["North & Central America","Europe"],"yr":1923,"era":"1900–1949","tag":"Blunder","x":"In 1923 Arthur Compton showed that X-rays bounce off electrons like billiard balls, losing energy as they do – convincing evidence that light comes in photons. Earlier, though, he had concluded from data that the electron was huge, about ten million times its accepted size. Introducing him at a Cambridge lecture, Rutherford told the audience to listen attentively but not necessarily believe him, and later burst out that he would not have an electron as big as a balloon in his laboratory.","q":"What changes about an X-ray photon when it scatters off an electron?"},{"id":"qnp-008","t":"Niels Bohr: breaker of glassware","s":"Physics","tp":"Atoms and radioactivity","sub":"Bohr model","lv":["GCSE","A-Level"],"who":"Niels Bohr","f":0,"loc":"Denmark","rg":["Europe"],"yr":1913,"era":"1900–1949","tag":"Eccentric","x":"Niels Bohr's chemistry teacher said he had no equal at breaking glassware; when an explosion rocked the lab, someone said 'That must be Bohr!' He became a great theorist instead, explaining in 1913 how electrons occupy fixed energy levels in atoms. As Denmark's most famous scientist, he lived in a house donated by the Carlsberg brewery. A popular myth says it had a pipe supplying beer from the brewery; archivists say no, though he did receive free beer.","q":"What happens when an electron moves down an energy level in Bohr's model?"},{"id":"qnp-009","t":"Bohr hides the Nobel medals","s":"Chemistry","tp":"Reactivity","sub":"Gold","lv":["GCSE","A-Level"],"who":"Niels Bohr, George de Hevesy","f":0,"loc":"Denmark","rg":["Europe"],"yr":1940,"era":"1900–1949","tag":"Wartime","x":"When German troops invaded Denmark in 1940, Niels Bohr's institute had two gold Nobel medals belonging to the German physicists Max von Laue and James Franck, who had sent them abroad for safety. Taking gold out of Germany was illegal, and the medals were engraved with their names. The Hungarian chemist George de Hevesy dissolved them in aqua regia, a mixture of nitric and hydrochloric acids that can dissolve gold, and left the orange liquid on a shelf. The Nazis searched the lab but ignored the jar. After the war the gold was recovered and the Nobel Foundation recast the medals.","q":"Why is gold so unreactive, and why can aqua regia dissolve it?"},{"id":"qnp-010","t":"Bohr's escape and the wrong bottle","s":"Physics","tp":"Atoms and radioactivity","sub":"Wartime science","lv":["GCSE","A-Level"],"who":"Niels Bohr","f":0,"loc":"Denmark / Sweden / UK","rg":["Europe"],"yr":1943,"era":"1900–1949","tag":"Wartime","x":"In 1943, warned he was about to be arrested, Bohr escaped by fishing boat to Sweden. There he urged the Swedish king to offer refuge to Danish Jews, and around 7,000 were helped across the sea to safety. Bohr was flown to Britain in the empty bomb bay of a Mosquito aircraft. According to a well-known account, he had brought a beer bottle he thought contained precious heavy water – it was beer. Worse, his flying helmet was too small for his large head, so he did not hear the pilot's instruction to put on his oxygen mask, and passed out until the plane flew lower.","q":"Why was heavy water important for wartime nuclear research?"},{"id":"qnp-011","t":"Harald Bohr, Olympic footballer","s":"Physics","tp":"How science works","sub":"Bohr","lv":["KS3","GCSE"],"who":"Harald Bohr, Niels Bohr","f":0,"loc":"Denmark / UK","rg":["Europe"],"yr":1908,"era":"1900–1949","tag":"Everyday","x":"Niels Bohr's brother Harald was a brilliant mathematician – and a footballer who won a silver medal for Denmark at the 1908 London Olympics, scoring in a 17–1 semi-final win over France. Niels played as a goalkeeper for the same club. A story says that during one match he was so busy working out a problem on the goalpost that he let in a goal.","q":"Do you think doing sport can help scientific thinking?"},{"id":"qnp-012","t":"Bohr's quick draw","s":"Biology","tp":"Nerves","sub":"Reaction time","lv":["KS3","GCSE"],"who":"Niels Bohr, George Gamow","f":0,"loc":"Denmark","rg":["Europe"],"yr":1930,"era":"1900–1949","tag":"Eccentric","x":"Bohr loved cowboy films but often lost track of the plot. He wondered why the hero always won a gunfight even though the villain drew first. His theory: the person who reacts is faster than the person who decides, because deciding takes extra time. George Gamow and colleagues tested it with toy pistols, ambushing Bohr – who 'shot' them all first. Scientists have since found evidence that reacting movements really can be slightly faster than planned ones.","q":"How could you test Bohr's idea with a ruler-drop experiment?"},{"id":"qnp-013","t":"Moon-dust fountains","s":"Physics","tp":"Quantum","sub":"Photoelectric effect","lv":["A-Level"],"who":"Eugene Cernan","f":0,"loc":"Moon / USA","rg":["Space","North & Central America"],"yr":1972,"era":"1950–1999","tag":"Nature","x":"Apollo astronauts orbiting the Moon, including Eugene Cernan on Apollo 17, sketched strange glowing streamers above the lunar horizon just before sunrise. One explanation is the photoelectric effect: ultraviolet and X-rays from the Sun knock electrons out of dust grains on the sunlit surface, leaving them positively charged. The grains repel each other and leap off the surface, perhaps kilometres high, scattering sunlight.","q":"Why would dust grains with the same charge leap away from each other?"},{"id":"qnp-014","t":"Photons, hornets and Bragg's joke","s":"Physics","tp":"Quantum","sub":"Wave–particle","lv":["A-Level"],"who":"Gilbert Lewis, William Henry Bragg","f":0,"loc":"USA / UK","rg":["North & Central America","Europe"],"yr":1926,"era":"1900–1949","tag":"Everyday","x":"Einstein never used the word 'photon': the chemist Gilbert Lewis coined it in 1926. The double nature of light puzzled everyone. William Henry Bragg joked that light behaved as waves on Mondays, Wednesdays and Fridays and as particles on Tuesdays, Thursdays and Saturdays. Even insects can join in: the yellow stripes of the Oriental hornet seem to generate a small voltage in sunlight.","q":"Which experiments show light as a wave, and which as particles?"},{"id":"qnp-015","t":"Heisenberg's hay fever holiday","s":"Physics","tp":"Quantum","sub":"Quantum mechanics","lv":["A-Level"],"who":"Werner Heisenberg, Wolfgang Pauli","f":0,"loc":"Germany","rg":["Europe"],"yr":1925,"era":"1900–1949","tag":"Discovery","x":"In June 1925, suffering terrible hay fever, Werner Heisenberg went to Helgoland, a rocky, almost pollen-free island in the North Sea. There, climbing rocks and reciting poetry, he worked out a completely new mathematics for atoms based only on things that can be measured. He was unsure whether to publish it or burn it, and sent it to his friend Wolfgang Pauli, who encouraged him. It became the foundation of quantum mechanics.","q":"Why did Heisenberg focus only on quantities that could be measured?"},{"id":"qnp-016","t":"The baseball spy and Heisenberg","s":"Physics","tp":"Atoms and radioactivity","sub":"Wartime science","lv":["GCSE","A-Level"],"who":"Werner Heisenberg, Moe Berg","f":0,"loc":"Switzerland / USA","rg":["North & Central America","Europe"],"yr":1944,"era":"1900–1949","tag":"Wartime","x":"Heisenberg led Germany's wartime nuclear research. In December 1944 the American spy agency sent Moe Berg – a former professional baseball catcher who spoke many languages – to a lecture by Heisenberg in Zurich, carrying a pistol. His orders were to shoot Heisenberg if he showed that Germany was close to an atomic bomb. Berg listened, then talked with him at a dinner, and decided Germany was nowhere near. He did not shoot.","q":"What would it take for a country to build a nuclear reactor or weapon?"},{"id":"qnp-017","t":"Heisenberg nearly fails his PhD","s":"Physics","tp":"Quantum","sub":"Quantum mechanics","lv":["A-Level"],"who":"Werner Heisenberg, Wilhelm Wien, Arnold Sommerfeld","f":0,"loc":"Germany","rg":["Europe"],"yr":1923,"era":"1900–1949","tag":"Eccentric","x":"At his doctoral exam in 1923, Heisenberg could not answer practical questions from the experimental physicist Wilhelm Wien – including how a telescope's resolving power works and how a battery functions. Wien wanted to fail him, but his theoretical supervisor Arnold Sommerfeld insisted he was a genius, and Heisenberg scraped through with the lowest pass. Sommerfeld was nominated for the Nobel Prize 84 times without winning, but many of his students won it.","q":"Why do both practical and theoretical skills matter in physics?"},{"id":"qnp-018","t":"De Broglie: the prince who made particles waves","s":"Physics","tp":"Quantum","sub":"Wave–particle","lv":["A-Level"],"who":"Louis de Broglie, Paul Langevin, Albert Einstein","f":0,"loc":"France","rg":["Europe"],"yr":1924,"era":"1900–1949","tag":"Discovery","x":"Louis de Broglie came from an aristocratic French family and first studied history. During the First World War he worked at the radio station on the Eiffel Tower, which sparked his interest in physics. In his 1924 PhD thesis, he suggested that particles like electrons also behave as waves, with a wavelength that depends on their momentum. His examiners were unsure, so Paul Langevin sent the thesis to Einstein, who praised it. Electron diffraction experiments soon proved de Broglie right.","q":"Why don't we notice the wavelength of a moving football?"},{"id":"qnp-019","t":"Lise Meitner's escape","s":"Physics","tp":"Atoms and radioactivity","sub":"Fission","lv":["GCSE","A-Level"],"who":"Lise Meitner, Otto Hahn, Otto Frisch, Dirk Coster","f":1,"loc":"Austria / Germany / Sweden","rg":["Europe"],"yr":1938,"era":"1900–1949","tag":"Hidden figure","x":"Lise Meitner was one of the first women to become a physics professor in Germany. Austrian and Jewish by birth, she was in danger when Germany took over Austria in 1938. Helped by colleagues including the Dutch physicist Dirk Coster, she escaped across the border with a few belongings. Months later, in Sweden, her former colleague Otto Hahn wrote to her about strange results: uranium bombarded with neutrons was producing barium. On a walk in the snow with her nephew Otto Frisch, she worked out that the uranium nucleus had split in two, and calculated the energy released using E = mc². She named the process 'fission'. Hahn alone received the Nobel Prize. Element 109, meitnerium, is named after her.","q":"Why was finding barium after bombarding uranium so surprising?"},{"id":"qnp-020","t":"Before E = mc²","s":"Physics","tp":"Atoms and radioactivity","sub":"Mass–energy","lv":["A-Level"],"who":"Isaac Newton, J. J. Thomson, Henri Poincaré, Friedrich Hasenöhrl","f":0,"loc":"UK / France / Austria","rg":["Europe"],"yr":1905,"era":"1900–1949","tag":"Discovery","x":"Einstein was not the first to link mass and energy. Newton wondered whether matter and light might turn into each other. In 1881 J. J. Thomson found that a moving charged sphere acts as if it has extra mass. Henri Poincaré and the Austrian Friedrich Hasenöhrl also derived similar formulas, though with the wrong numbers. Einstein's 1905 paper showed that the relationship E = mc² applies to all energy and all matter.","q":"Why is the energy released in nuclear reactions so huge compared to chemical ones?"},{"id":"qnp-021","t":"Rutherford's last potato","s":"Physics","tp":"Atoms and radioactivity","sub":"Nuclear model","lv":["KS3","GCSE","A-Level"],"who":"Ernest Rutherford","f":0,"loc":"New Zealand / UK","rg":["Oceania","Europe"],"yr":1895,"era":"1800s","tag":"Discovery","x":"Ernest Rutherford grew up on a farm in New Zealand. In 1895 he was digging potatoes when his mother brought news that he had won a scholarship to Cambridge. He reportedly threw down his spade and said that was the last potato he would ever dig. He went on to discover alpha and beta radiation, the concept of half-life, the atomic nucleus and the proton. During the First World War, he once missed a military committee meeting, explaining that if he had split the atom, that was more important than the war.","q":"How did Rutherford's model of the atom differ from the plum pudding model?"},{"id":"qnp-022","t":"Kapitsa and the crocodile","s":"Physics","tp":"Atoms and radioactivity","sub":"Rutherford","lv":["GCSE"],"who":"Pyotr Kapitsa, Ernest Rutherford, Eric Gill","f":0,"loc":"Russia / UK","rg":["Europe"],"yr":1921,"era":"1900–1949","tag":"Eccentric","x":"When the Russian physicist Pyotr Kapitsa asked to join Rutherford's lab in Cambridge in 1921, Rutherford said it was full. Kapitsa asked how accurate experiments there were – about 2 or 3 per cent – and replied that one extra researcher would be within the experimental error. He got the job. Kapitsa nicknamed Rutherford 'the Crocodile', because a crocodile can't turn its head and always goes straight forward, like science. The sculptor Eric Gill carved a crocodile on the wall of the laboratory built for Kapitsa, which can still be seen.","q":"What does 'within experimental error' mean?"},{"id":"qnp-023","t":"Leo Szilard's traffic-light idea","s":"Physics","tp":"Atoms and radioactivity","sub":"Chain reaction","lv":["GCSE","A-Level"],"who":"Leo Szilard","f":0,"loc":"Hungary / UK","rg":["Europe"],"yr":1933,"era":"1900–1949","tag":"Discovery","x":"In September 1933, the Hungarian physicist Leo Szilard, who had fled Nazi Germany to London, read in The Times that Rutherford dismissed atomic energy as 'moonshine'. Annoyed, he was waiting to cross Southampton Row when the lights changed, and the idea struck him: if a neutron splits an atom and releases two more neutrons, these could split two more – a chain reaction. Szilard liked to think in the bath; a hotel maid once knocked to check on him after three hours.","q":"Draw a diagram of a chain reaction. Why does it grow so fast?"},{"id":"qnp-024","t":"The elephant's foot of Chernobyl","s":"Physics","tp":"Atoms and radioactivity","sub":"Nuclear accidents","lv":["GCSE","A-Level"],"who":"","f":0,"loc":"Ukraine","rg":["Europe"],"yr":1986,"era":"1950–1999","tag":"Tragedy","x":"In the 1986 Chernobyl disaster, the reactor core melted and mixed with sand, concrete and steel to form a lava that flowed into the basement and solidified. One wrinkled black mass is called the 'elephant's foot'. Months after the accident it was so radioactive that standing near it for a few minutes would have been deadly; workers photographed it using cameras on wheels or quickly from around corners. Its activity has fallen a great deal since but it is still dangerous.","q":"Why does the activity of the elephant's foot decrease over time?"},{"id":"qnp-025","t":"Coal ash, radioactivity and helium","s":"Earth Science","tp":"Rocks and geology","sub":"Natural radiation","lv":["GCSE","A-Level"],"who":"","f":0,"loc":"Worldwide","rg":["Worldwide"],"yr":1978,"era":"1950–1999","tag":"Everyday","x":"Coal contains tiny amounts of uranium and thorium. Burning it concentrates them in the ash, so an old coal power station could release more radioactivity into its surroundings than a normally running nuclear power station, though both doses are tiny. The helium in party balloons also comes from radioactivity: almost all of it was made by alpha decay of uranium and thorium deep underground over millions of years, and is extracted from natural gas.","q":"How does alpha decay produce helium?"},{"id":"qnp-026","t":"The world's most expensive cocktail","s":"Chemistry","tp":"Atomic structure","sub":"Isotopes","lv":["GCSE","A-Level"],"who":"Gilbert Lewis, Ernest Lawrence","f":0,"loc":"USA","rg":["North & Central America"],"yr":1933,"era":"1900–1949","tag":"Eccentric","x":"In 1933 the chemist Gilbert Lewis made the first pure sample of heavy water, in which hydrogen atoms are replaced by deuterium, which has an extra neutron. To see if it was harmful, he fed his entire supply to a mouse. The mouse survived but reportedly seemed drunk. The physicist Ernest Lawrence, who had been waiting to use it in his particle accelerator, called it the most expensive cocktail any mouse had ever had.","q":"How is deuterium different from ordinary hydrogen?"},{"id":"qnp-027","t":"The demon core","s":"Physics","tp":"Atoms and radioactivity","sub":"Chain reaction","lv":["GCSE","A-Level"],"who":"Harry Daghlian, Louis Slotin","f":0,"loc":"USA","rg":["North & Central America"],"yr":1946,"era":"1900–1949","tag":"Tragedy","x":"At Los Alamos after the Second World War, a 6.2 kg sphere of plutonium was used to test how close to critical a bomb core could be. In 1945 Harry Daghlian accidentally dropped a neutron-reflecting brick onto it, starting a brief chain reaction; he died weeks later. In 1946 Louis Slotin was holding two halves of a reflecting shell apart with a screwdriver when it slipped. There was a blue flash and a wave of heat. Slotin flicked the shell off, saving the others in the room, but died nine days later. The core gained the name 'demon core' and such hands-on experiments were stopped.","q":"Why does surrounding plutonium with a neutron reflector make it more dangerous?"},{"id":"qnp-028","t":"Fermi's reactor in a balloon","s":"Physics","tp":"Atoms and radioactivity","sub":"Reactors","lv":["GCSE","A-Level"],"who":"Enrico Fermi, Laura Fermi, Norman Hilberry","f":1,"loc":"Italy / USA","rg":["North & Central America","Europe"],"yr":1942,"era":"1900–1949","tag":"Discovery","x":"On 2 December 1942, beneath the stands of a sports ground at the University of Chicago, Enrico Fermi's team started the first self-sustaining nuclear chain reaction in Chicago Pile-1, a stack of graphite blocks and uranium. The pile was built inside a giant square balloon from the Goodyear tyre company, in case air needed removing. Safety measures were basic: a control rod tied with rope, with Norman Hilberry standing by with an axe, and a 'suicide squad' ready to pour cadmium solution on top. Fermi, who was learning English from Winnie-the-Pooh, nicknamed some instruments Tigger, Piglet and Kanga. His wife Laura later wrote a book about their life and escape from Fascist Italy.","q":"What does a control rod do in a reactor?"},{"id":"qnp-029","t":"Fermi missed fission","s":"Physics","tp":"Atoms and radioactivity","sub":"Fission","lv":["A-Level"],"who":"Enrico Fermi, Ida Noddack","f":1,"loc":"Italy / Germany","rg":["Europe"],"yr":1934,"era":"1900–1949","tag":"Blunder","x":"In 1934 in Rome, Enrico Fermi fired neutrons at uranium and found new radioactive products. He thought he had made new, heavier elements. The German chemist Ida Noddack suggested that the nucleus might instead have broken into large pieces, but almost nobody took her seriously. Fermi later admitted they did not have enough imagination to think that uranium could behave so differently from other elements. Fission was finally recognised in 1938–39.","q":"Why might scientists ignore an idea that turns out to be right?"},{"id":"qnp-030","t":"Chernobyl's fatal shutdown","s":"Physics","tp":"Atoms and radioactivity","sub":"Reactors","lv":["A-Level"],"who":"","f":0,"loc":"Ukraine","rg":["Europe"],"yr":1986,"era":"1950–1999","tag":"Tragedy","x":"On 26 April 1986, during a safety test at Chernobyl's reactor 4, operators pressed the emergency shutdown button. The control rods had graphite tips, and as they started to enter the core, the graphite pushed out water that had been absorbing neutrons. For a few seconds the reaction speeded up instead of slowing down. Power surged far beyond normal, fuel ruptured and steam explosions lifted the reactor lid, weighing well over 1,000 tonnes. A poor design and unsafe test combined to cause the world's worst nuclear accident.","q":"Why did replacing water with graphite increase the reaction rate in this reactor?"},{"id":"qnp-031","t":"Chien-Shiung Wu: the mirror is broken","s":"Physics","tp":"Particle physics","sub":"Weak force","lv":["GCSE","A-Level"],"who":"Chien-Shiung Wu, Tsung-Dao Lee, Chen-Ning Yang","f":1,"loc":"China / USA","rg":["East Asia","North & Central America"],"yr":1956,"era":"1950–1999","tag":"Hidden figure","x":"Chien-Shiung Wu was born near Shanghai in 1912; her father ran a school for girls and encouraged her. She moved to the USA, worked on the Manhattan Project and became one of the world's best experimental nuclear physicists. Theorists Tsung-Dao Lee and Chen-Ning Yang suggested that radioactive decay might not behave identically in a mirror image. In 1956 Wu tested this with cobalt-60 atoms cooled almost to absolute zero and lined up in a magnetic field. Electrons came out preferentially in one direction: nature can tell left from right. Lee and Yang won the 1957 Nobel Prize; Wu was left out. She asked whether atoms and molecules have any preference for male or female treatment.","q":"What does it mean for a physical law to work the same in a mirror?"},{"id":"qnp-032","t":"Uranium glass","s":"Chemistry","tp":"Periodic table","sub":"Uranium","lv":["KS3","GCSE"],"who":"Martin Klaproth","f":0,"loc":"Germany / UK","rg":["Europe"],"yr":1789,"era":"1700s","tag":"Everyday","x":"The German chemist Martin Klaproth discovered uranium in 1789. Before anyone knew it was radioactive, uranium compounds were used to colour glass a yellow-green, popular from the 1830s to the 1930s. Under ultraviolet light, uranium glass glows a vivid green. It is only very slightly radioactive and safe to handle; collectors use UV torches to spot it in antique shops.","q":"Why does uranium glass glow under ultraviolet but not in normal light?"},{"id":"qnp-033","t":"The Nth Country Experiment","s":"Physics","tp":"Atoms and radioactivity","sub":"Weapons and policy","lv":["A-Level"],"who":"","f":0,"loc":"USA","rg":["North & Central America"],"yr":1964,"era":"1950–1999","tag":"Wartime","x":"In 1964 the US government secretly asked two young physics graduates, with no nuclear weapons experience, to design an atomic bomb using only published information. Within about two and a half years they produced a credible design. The test showed that the scientific knowledge could not be kept secret; the main barrier to stopping nuclear weapons spreading is controlling access to the materials.","q":"Why is controlling uranium and plutonium so important?"},{"id":"qnp-034","t":"A physicist founded Subway","s":"Physics","tp":"Atoms and radioactivity","sub":"Careers","lv":["KS3"],"who":"Peter Buck, Fred DeLuca","f":0,"loc":"USA","rg":["North & Central America"],"yr":1965,"era":"1950–1999","tag":"Everyday","x":"In 1965 the nuclear physicist Peter Buck lent $1,000 to a 17-year-old family friend, Fred DeLuca, to open a sandwich shop in Connecticut to help pay for university. The shop grew into Subway, which now has tens of thousands of branches. Physics graduates go into surprisingly varied careers.","q":"What skills from physics might help in business?"},{"id":"qnp-035","t":"Measuring radiation with coins","s":"Physics","tp":"Atoms and radioactivity","sub":"Half-life","lv":["A-Level"],"who":"","f":0,"loc":"Japan","rg":["East Asia"],"yr":2011,"era":"2000 onwards","tag":"Modern research","x":"Japanese 5-yen coins are made of brass containing zinc. When neutrons hit zinc, some atoms become radioactive zinc-65, which has a half-life of about 244 days. After earlier accidents and the 2011 Fukushima disaster, scientists collected coins from nearby homes and measured their radioactivity to work out how many neutrons had reached each place.","q":"How could you use the half-life to work back to the original activity?"},{"id":"qnp-036","t":"Radioactive streets and steel","s":"Physics","tp":"Atoms and radioactivity","sub":"Background radiation","lv":["GCSE"],"who":"","f":0,"loc":"USA / Taiwan","rg":["East Asia","North & Central America"],"yr":1982,"era":"1950–1999","tag":"Everyday","x":"In the early 1900s, Denver in Colorado had a factory extracting radium. Its waste ended up mixed into tarmac on several streets; decades later, the city spent millions removing it, although the dose to passers-by was small. In Taiwan in the 1980s, steel contaminated with cobalt-60 was used to make reinforcing bars for over 200 apartment and school buildings, exposing residents for years before it was discovered.","q":"How could you detect radioactive material in a building?"},{"id":"qnp-037","t":"The Radithor tragedy","s":"Physics","tp":"Atoms and radioactivity","sub":"Dangers of radiation","lv":["GCSE","A-Level"],"who":"Eben Byers","f":0,"loc":"USA","rg":["North & Central America"],"yr":1932,"era":"1900–1949","tag":"Tragedy","x":"In the 1920s, radium was sold as a health tonic. Eben Byers, a wealthy American golfer, drank around 1,400 bottles of 'Radithor', radium dissolved in water, after a doctor recommended it for an injured arm. The radium settled in his bones, which began to crumble; parts of his jaw had to be removed. He died in 1932 and was buried in a lead-lined coffin. A newspaper headline read that the radium water worked fine until his jaw came off. His death led to stricter control of medicines.","q":"Why does radium build up in bones?"},{"id":"qnp-038","t":"The atomic ring in a cereal box","s":"Physics","tp":"Atoms and radioactivity","sub":"Alpha particles","lv":["GCSE"],"who":"George Zweig","f":0,"loc":"USA","rg":["North & Central America"],"yr":1947,"era":"1900–1949","tag":"Everyday","x":"In 1947, a US cereal company offered an 'Atomic Bomb Ring' for 15 cents and a box top. Inside was a tiny spinthariscope: a speck of polonium and a fluorescent screen. In the dark, each alpha particle hitting the screen made a flash. A young George Zweig, who later co-invented the quark model, remembered sitting in a dark wardrobe watching it. Around the same time, the 'Gilbert U-238 Atomic Energy Lab' was sold as a children's toy, complete with radioactive samples and a Geiger counter.","q":"How does a scintillation screen detect alpha particles?"},{"id":"qnp-039","t":"Stanley Watras's radioactive home","s":"Physics","tp":"Atoms and radioactivity","sub":"Radon","lv":["GCSE"],"who":"Stanley Watras","f":0,"loc":"USA","rg":["North & Central America"],"yr":1984,"era":"1950–1999","tag":"Discovery","x":"In 1984 Stanley Watras, an engineer at a new nuclear power station in Pennsylvania, kept setting off the radiation alarms – but the plant had not started up yet. Investigators tested his house and found radon gas, seeping from uranium-rich rocks beneath it, at levels hundreds of times higher than normal. Breathing it was estimated to be as harmful as smoking well over a hundred packs of cigarettes a day. The family moved out while it was fixed, and radon testing of homes became widespread, including in parts of the UK such as Cornwall.","q":"Why is radon most dangerous when breathed in?"},{"id":"qnp-040","t":"Geiger, Marsden and the gold foil","s":"Physics","tp":"Atoms and radioactivity","sub":"Nuclear model","lv":["GCSE","A-Level"],"who":"Hans Geiger, Ernest Marsden","f":0,"loc":"UK / Germany / New Zealand","rg":["Oceania","Europe"],"yr":1909,"era":"1900–1949","tag":"Discovery","x":"In 1909 the 20-year-old Ernest Marsden and Hans Geiger fired alpha particles at thin gold foil in Manchester. Each one hitting a screen made a tiny flash, which had to be counted by eye in the dark, sometimes for hours. Geiger warned Marsden not to lean out of train windows in case soot damaged his eyes. A few alpha particles bounced back – Rutherford said it was like a shell bouncing off tissue paper – revealing the tiny, dense nucleus. In the First World War, Geiger and Marsden fought on opposite sides but exchanged letters through Niels Bohr in neutral Denmark.","q":"Why did most alpha particles go straight through the foil?"},{"id":"qnp-041","t":"Hiroshima's fogged X-ray plates","s":"Physics","tp":"Atoms and radioactivity","sub":"Nuclear weapons","lv":["GCSE"],"who":"","f":0,"loc":"Japan","rg":["East Asia"],"yr":1945,"era":"1900–1949","tag":"Tragedy","x":"After the atomic bomb exploded over Hiroshima on 6 August 1945, people in the city struggled to understand how one plane had caused such destruction. One of the first clues came from the Red Cross hospital, where unused X-ray films stored away from light had been fogged. Only intense radiation could have done that, pointing Japanese scientists to a nuclear weapon. A porcelain bowl from Hiroshima, with sand fused onto it by the heat, is kept in London's Science Museum.","q":"What can fog photographic film besides light?"},{"id":"qnp-042","t":"Roman lead for neutrino hunters","s":"Physics","tp":"Particle physics","sub":"Neutrinos","lv":["GCSE","A-Level"],"who":"","f":0,"loc":"Italy","rg":["Europe"],"yr":2010,"era":"2000 onwards","tag":"Modern research","x":"Detectors searching for rare particle events need shielding from background radiation, and lead is ideal. But freshly made lead contains radioactive lead-210, with a half-life of 22 years. Lead from a Roman ship that sank off Sardinia over 2,000 years ago has had time for nearly all its lead-210 to decay. In 2010, 120 Roman lead ingots were given to the underground Gran Sasso laboratory in Italy for an experiment. Some archaeologists objected to melting historical objects for science.","q":"How many half-lives of lead-210 have passed in 2,000 years?"},{"id":"qnp-043","t":"Father Wulf's Eiffel Tower experiment","s":"Physics","tp":"Particle physics","sub":"Cosmic rays","lv":["GCSE","A-Level"],"who":"Theodor Wulf, Victor Hess, Domenico Pacini","f":0,"loc":"Germany / France / Austria / Italy","rg":["Europe"],"yr":1912,"era":"1900–1949","tag":"Discovery","x":"Around 1910 people assumed background radiation came from rocks. The German Jesuit priest Theodor Wulf took an electroscope to the top of the Eiffel Tower, expecting the radiation to fall almost to zero 300 m up. It fell much less than expected. The Italian Domenico Pacini found that radiation decreased under water. Then in 1912 the Austrian Victor Hess carried detectors in a balloon to over 5 km and found radiation increased with height – even during a solar eclipse, so it wasn't from the Sun. He had discovered cosmic rays, and won a Nobel Prize in 1936.","q":"Why did measurements at height and underwater rule out rocks as the only source?"},{"id":"qnp-044","t":"The Lawrence brothers treat their mother","s":"Physics","tp":"Atoms and radioactivity","sub":"Medical physics","lv":["GCSE","A-Level"],"who":"John Lawrence, Ernest Lawrence, Gunda Lawrence","f":1,"loc":"USA","rg":["North & Central America"],"yr":1937,"era":"1900–1949","tag":"Invention","x":"Ernest Lawrence invented the cyclotron, a particle accelerator; his brother John was a doctor who used radioactive isotopes it produced to treat leukaemia – the start of nuclear medicine. In the late 1930s their mother, Gunda, was diagnosed with cancer that doctors said could not be operated on. The brothers treated her using a new high-energy X-ray machine, and she lived for many more years.","q":"Why are radioactive isotopes useful in medicine?"},{"id":"qnp-045","t":"Chadwick joined the wrong queue","s":"Physics","tp":"Atoms and radioactivity","sub":"Neutron","lv":["GCSE","A-Level"],"who":"James Chadwick, Charles Drummond Ellis","f":0,"loc":"UK / Germany","rg":["Europe"],"yr":1932,"era":"1900–1949","tag":"Accident","x":"James Chadwick meant to study mathematics at Manchester, but stood in the wrong queue and was too shy to say so – so he studied physics. He went to Berlin to work with Hans Geiger and was trapped there when the First World War began, interned for four years in a camp at a racecourse. He built experiments using a radioactive toothpaste that was popular at the time, and inspired a fellow prisoner, Charles Ellis, to become a physicist. In 1932 Chadwick discovered the neutron.","q":"Why was the neutron hard to detect?"},{"id":"qnp-046","t":"Pauli's 'desperate remedy'","s":"Physics","tp":"Particle physics","sub":"Neutrinos","lv":["A-Level"],"who":"Wolfgang Pauli, Enrico Fermi, Niels Bohr","f":0,"loc":"Austria / Switzerland / Italy","rg":["Europe"],"yr":1930,"era":"1900–1949","tag":"Discovery","x":"In beta decay, electrons came out with a range of energies, as if energy was disappearing. Bohr even suggested energy might not be conserved. In 1930 Wolfgang Pauli wrote an open letter beginning 'Dear Radioactive Ladies and Gentlemen', proposing a 'desperate remedy': an invisible, neutral particle carrying away the missing energy. He was too busy at a dance to attend the meeting himself. Fermi named it the neutrino, Italian for 'little neutral one'. It was finally detected in 1956.","q":"How does a third particle solve the missing-energy puzzle?"},{"id":"qnp-047","t":"The Pauli effect","s":"Physics","tp":"Particle physics","sub":"Pauli","lv":["GCSE","A-Level"],"who":"Wolfgang Pauli, Otto Stern","f":0,"loc":"Switzerland / Germany","rg":["Europe"],"yr":1930,"era":"1900–1949","tag":"Eccentric","x":"Wolfgang Pauli was a brilliant theorist, but equipment seemed to break whenever he was near. Colleagues joked about the 'Pauli effect'; the experimentalist Otto Stern reportedly banned him from his lab. Once an experiment in Göttingen failed at the exact moment Pauli's train stopped at the station. At a conference, colleagues rigged a chandelier to fall when he entered – but the mechanism jammed, which some took as further proof.","q":"Why is it important to be sceptical of stories like the Pauli effect?"},{"id":"qnp-048","t":"Becquerel's cloudy day","s":"Physics","tp":"Atoms and radioactivity","sub":"Discovery of radioactivity","lv":["KS3","GCSE","A-Level"],"who":"Henri Becquerel","f":0,"loc":"France","rg":["Europe"],"yr":1896,"era":"1800s","tag":"Accident","x":"In 1896 Henri Becquerel thought uranium salts absorbed sunlight and then gave off X-rays. He planned to put uranium crystals on photographic plates in the sun, but Paris was cloudy, so he put everything in a drawer. Days later he developed the plates anyway – and found strong images of the crystals. The uranium was emitting radiation all by itself. Marie and Pierre Curie went on to investigate this 'radioactivity'.","q":"Why was developing the plates anyway such an important decision?"},{"id":"qnp-049","t":"Anderson's accidental positron","s":"Physics","tp":"Particle physics","sub":"Antimatter","lv":["A-Level"],"who":"Carl Anderson, Paul Dirac, Chung-Yao Chao, Irène Joliot-Curie","f":1,"loc":"USA / UK / China / France","rg":["East Asia","North & Central America","Europe"],"yr":1932,"era":"1900–1949","tag":"Discovery","x":"In 1928 Paul Dirac's equation for the electron predicted an opposite particle with positive charge. In 1932 Carl Anderson, photographing cosmic rays in a cloud chamber in a magnetic field, saw a track curving the 'wrong' way for an electron. It was the positron, the first antimatter particle. Anderson said the discovery was accidental and he hadn't known of Dirac's theory. Earlier, the Chinese physicist Chung-Yao Chao had seen strange signals that hinted at positrons, and Irène and Frédéric Joliot-Curie had positron tracks on their photographs but thought they were protons.","q":"How does a magnetic field reveal the charge of a particle?"},{"id":"qnp-050","t":"Ettore Majorana vanishes","s":"Physics","tp":"Particle physics","sub":"Neutrinos","lv":["A-Level"],"who":"Ettore Majorana, Enrico Fermi","f":0,"loc":"Italy","rg":["Europe"],"yr":1938,"era":"1900–1949","tag":"Tragedy","x":"Ettore Majorana was so gifted that Enrico Fermi compared him to Galileo and Newton. He scribbled calculations on cigarette packets and threw them away. He suggested some particles might be their own antiparticles – 'Majorana particles' are still searched for today. In March 1938, aged 31, he withdrew money from his bank, boarded a ferry from Naples to Palermo and was never seen again. Theories include suicide, life as a monk and a new life in South America; the mystery has never been solved.","q":"What would it mean for a particle to be its own antiparticle?"},{"id":"qnp-051","t":"Bruno Pontecorvo defects","s":"Physics","tp":"Particle physics","sub":"Neutrinos","lv":["A-Level"],"who":"Bruno Pontecorvo","f":0,"loc":"Italy / UK / USSR","rg":["Europe"],"yr":1950,"era":"1950–1999","tag":"Wartime","x":"Bruno Pontecorvo, another of Fermi's students, worked on nuclear projects in Canada and Britain. In 1950, while on holiday in Italy, he and his family suddenly disappeared – reappearing years later in the Soviet Union. He may have been a spy. In the USSR he did important work on neutrinos, including the idea that neutrinos can change type as they travel, later confirmed and recognised with a Nobel Prize for others in 2015.","q":"Should scientific knowledge be shared between rival countries?"},{"id":"qnp-052","t":"Beer bottles in the accelerator","s":"Physics","tp":"Particle physics","sub":"Accelerators","lv":["GCSE"],"who":"","f":0,"loc":"Switzerland / France","rg":["Europe"],"yr":1996,"era":"1950–1999","tag":"Blunder","x":"In 1996, after an upgrade to CERN's Large Electron–Positron collider, the particle beam would not travel all the way around the 27 km ring. Engineers searched the beam pipe and found two beer bottles inside. Nobody ever found out who left them. In 2016 the Large Hadron Collider was briefly shut down when a weasel-like stone marten chewed through a high-voltage cable; its stuffed body is now in a Dutch museum.","q":"Why does a particle beam need a near-perfect vacuum?"},{"id":"qnp-053","t":"Pions on a mountain: Lattes, Occhialini and Powell","s":"Physics","tp":"Particle physics","sub":"Cosmic rays","lv":["A-Level"],"who":"César Lattes, Giuseppe Occhialini, Cecil Powell","f":0,"loc":"Brazil / Italy / UK / Bolivia / France","rg":["South America","Europe"],"yr":1947,"era":"1900–1949","tag":"Discovery","x":"Pions, particles that help hold nuclei together, are made when cosmic rays hit the atmosphere but decay quickly, so they are best found high up. In 1947 a Bristol team – the Brazilian César Lattes, the Italian Giuseppe Occhialini and the British Cecil Powell – exposed special photographic plates on the Pic du Midi in the French Pyrenees. Occhialini had been a mountain guide, which helped. Lattes then took plates to Mount Chacaltaya in Bolivia, at over 5,000 m, and found many more pions. Powell received the Nobel Prize; Lattes became a national hero in Brazil.","q":"Why are pions more likely to be detected on mountains?"},{"id":"qnp-054","t":"Three quarks for Muster Mark","s":"Physics","tp":"Particle physics","sub":"Quarks","lv":["GCSE","A-Level"],"who":"Murray Gell-Mann, George Zweig","f":0,"loc":"USA","rg":["North & Central America"],"yr":1964,"era":"1950–1999","tag":"Discovery","x":"In 1964 Murray Gell-Mann and George Zweig independently proposed that protons and neutrons are made of smaller particles. Gell-Mann chose the name 'quark', from a line in James Joyce's novel Finnegans Wake: 'Three quarks for Muster Mark'. Zweig called them 'aces', but his paper was rejected by a journal and the name never caught on. He later moved into neuroscience, studying how the ear works. Gell-Mann won the 1969 Nobel Prize.","q":"Which quarks make up a proton and a neutron?"},{"id":"qnp-055","t":"The Oh-My-God particle","s":"Physics","tp":"Particle physics","sub":"Cosmic rays","lv":["GCSE","A-Level"],"who":"","f":0,"loc":"USA","rg":["North & Central America"],"yr":1991,"era":"1950–1999","tag":"Discovery","x":"On 15 October 1991, a detector in the Utah desert recorded a cosmic ray with an energy of about 3 × 10²⁰ electronvolts – a single subatomic particle, probably a proton, carrying as much kinetic energy as a well-thrown cricket ball. Scientists nicknamed it the 'Oh-My-God particle'. Its origin is still unknown. In 2023 a Japanese-led team announced a similar particle, named Amaterasu after the Japanese sun goddess.","q":"How fast must a proton travel to carry that much energy?"},{"id":"qnp-056","t":"Comic Sans and the Higgs boson","s":"Physics","tp":"Particle physics","sub":"Higgs boson","lv":["GCSE","A-Level"],"who":"Fabiola Gianotti, Peter Higgs","f":1,"loc":"Switzerland / Italy / UK","rg":["Europe"],"yr":2012,"era":"2000 onwards","tag":"Everyday","x":"On 4 July 2012, CERN announced the discovery of the Higgs boson, predicted almost 50 years earlier. Peter Higgs wiped away a tear in the audience. The ATLAS results were presented by the Italian physicist Fabiola Gianotti, who later became CERN's first female Director-General – but online many people complained instead that her slides used the Comic Sans font. On April Fool's Day 2014, CERN announced that it was switching all its communications to Comic Sans.","q":"Why did it take so long t
