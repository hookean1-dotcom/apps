in Seoul began shaking up and down so much that thousands of people were evacuated. Investigators eventually traced the cause to a fitness class of about 20 people doing Tae Bo, a mix of martial arts and aerobics, on the 12th floor. The rhythm of their jumping matched a natural frequency of the building. When investigators recreated the workout, the 38th floor shook ten times more than expected.","q":"How could engineers stop a building resonating?"},{"id":"wav-084","t":"Your skull and your music taste","s":"Biology","tp":"Senses","sub":"Resonance","lv":["GCSE"],"who":"","f":0,"loc":"USA","rg":["North & Central America"],"yr":2004,"era":"2000 onwards","tag":"Modern research","x":"Researchers asked volunteers to tap their heads while microphones recorded the vibrations, finding skull resonant frequencies between about 35 and 65 Hz (higher on average in women, whose skulls tend to be smaller). They suggested this might affect which musical keys people prefer. Bone conduction through your skull is also why your recorded voice sounds strange to you: normally you hear yourself partly through your bones.","q":"Why does your recorded voice sound different from what you hear when you speak?"},{"id":"wav-085","t":"Peacock tails that vibrate","s":"Biology","tp":"Adaptations","sub":"Resonance","lv":["GCSE"],"who":"Roslyn Dakin","f":1,"loc":"Canada","rg":["North & Central America"],"yr":2016,"era":"2000 onwards","tag":"Modern research","x":"When a peacock shows off, it rattles its huge tail. A Canadian team led by Roslyn Dakin used high-speed video and found the feathers shake at about 26 Hz, close to their resonant frequency, getting the biggest movement for the least effort. Remarkably, the eyespots stay almost still while the rest of the feather shimmers around them, perhaps to hold the peahen's attention.","q":"Why is it efficient to vibrate something at its resonant frequency?"},{"id":"frc-001","t":"Cosmonauts who are slightly younger","s":"Physics","tp":"Forces and motion","sub":"Time and relativity","lv":["GCSE","A-Level"],"who":"Sergei Krikalev, Oleg Kononenko","f":0,"loc":"Russia","rg":["Europe"],"yr":2005,"era":"2000 onwards","tag":"Modern research","x":"Moving clocks run slow. Sergei Krikalev spent 803 days in orbit over six missions, and the time dilation from his high speed means he aged about two-hundredths of a second less than if he had stayed on Earth. In 2024 Oleg Kononenko became the first person to spend more than 1,000 days in space. Being further from Earth's gravity slightly speeds a clock up, but for the International Space Station the speed effect wins.","q":"Would a clock on a mountain top run faster or slower than one at sea level?"},{"id":"frc-002","t":"Days are getting longer","s":"Earth Science","tp":"Earth's structure and history","sub":"Time","lv":["GCSE","A-Level"],"who":"John Wells","f":0,"loc":"USA","rg":["North & Central America"],"yr":1963,"era":"1950–1999","tag":"Nature","x":"Corals lay down daily growth bands as well as yearly ones. In 1963 the palaeontologist John Wells counted the daily lines in 380-million-year-old fossil corals and found about 400 days in a year. Earth has been slowing because the tides, raised by the Moon, act like a brake; in return the Moon drifts about 4 cm further away each year. Today days lengthen by roughly 1.8 thousandths of a second per century. Atomic clocks are so precise that leap seconds have been added to keep them in step with Earth, though they are due to be scrapped by 2035.","q":"If the year has always been the same length, why did it once have more days?"},{"id":"frc-003","t":"The pitch drop experiment","s":"Physics","tp":"Matter","sub":"Viscosity","lv":["KS3","GCSE"],"who":"Thomas Parnell, John Mainstone","f":0,"loc":"Australia","rg":["Oceania"],"yr":1927,"era":"1900–1949","tag":"Eccentric","x":"In 1927 Professor Thomas Parnell at the University of Queensland heated some pitch – a tar-like substance that shatters when hit with a hammer – and poured it into a funnel to show students it is actually a very slow liquid. Drops fall about once a decade; the ninth fell in 2014. Nobody has ever watched one fall: his successor John Mainstone missed several, once by stepping out for a cup of tea, and a camera failed during another. The pitch is about 100 billion times more viscous than water. A webcam now watches for the tenth drop.","q":"Is pitch a solid or a liquid? What would you need to know to decide?"},{"id":"frc-004","t":"The bell that has rung since 1840","s":"Physics","tp":"Electricity","sub":"Batteries","lv":["KS3","GCSE"],"who":"Robert Walker","f":0,"loc":"UK / New Zealand","rg":["Oceania","Europe"],"yr":1840,"era":"1800s","tag":"Eccentric","x":"In a corridor at Oxford's Clarendon Laboratory sits the Oxford Electric Bell, set up around 1840. A tiny ball bounces between two bells powered by 'dry pile' batteries, so it has rung almost continuously for over 180 years, though it is too quiet to hear through its glass case. Nobody knows exactly what the batteries are made of, and no one wants to open them. In New Zealand, the Beverly Clock at the University of Otago has run since 1864 without being wound, powered by daily changes in air temperature and pressure.","q":"Where does the energy keeping the bell ringing come from?"},{"id":"frc-005","t":"When Bath was ten minutes behind London","s":"Physics","tp":"Forces and motion","sub":"Time","lv":["KS3"],"who":"","f":0,"loc":"UK","rg":["Europe"],"yr":1852,"era":"1800s","tag":"Everyday","x":"Before railways, every town set its clocks by the Sun, so noon in Bristol came about ten minutes after noon in London, and Exeter was around fourteen minutes behind. Fast trains made this confusing, and railway companies adopted London time. In Bristol, the Corn Exchange clock still has two minute hands, one for London time and one for local time. Britain only made Greenwich Mean Time the legal standard in 1880.","q":"Why would local noon be later in Bristol than London?"},{"id":"frc-006","t":"'Mr Clocks' flies around the world","s":"Physics","tp":"Forces and motion","sub":"Relativity","lv":["A-Level"],"who":"Joseph Hafele, Richard Keating","f":0,"loc":"USA","rg":["North & Central America"],"yr":1971,"era":"1950–1999","tag":"Discovery","x":"In 1971, Joseph Hafele and Richard Keating tested Einstein's prediction that moving clocks and clocks in weaker gravity run at different rates. They carried four atomic clocks on ordinary passenger flights around the world, once eastwards and once westwards, and compared them with clocks left at the US Naval Observatory. The clocks were so bulky they needed their own seats, booked under the name 'Mr Clocks'. The flown clocks differed by a few hundred billionths of a second – just as relativity predicted. The tickets cost about $7,600.","q":"Why would flying east give a different answer from flying west?"},{"id":"frc-007","t":"Mapping the world in travel time","s":"Earth Science","tp":"Rocks and geology","sub":"Speed","lv":["KS3"],"who":"Francis Galton","f":0,"loc":"UK","rg":["Europe"],"yr":1881,"era":"1800s","tag":"Invention","x":"In 1881 Francis Galton, a cousin of Charles Darwin, made an 'isochronic' map, colouring the world by how many days it took to travel from London. Much of Europe was under ten days, but inland Australia or parts of South America took over forty. A modern version of the map shows that nearly anywhere can now be reached in under two days.","q":"How has the speed of travel changed the way scientists work together?"},{"id":"frc-008","t":"Tom and Jerry weigh the Earth's ice","s":"Earth Science","tp":"Atmosphere and climate","sub":"Gravity","lv":["GCSE","A-Level"],"who":"","f":0,"loc":"USA / Germany","rg":["North & Central America","Europe"],"yr":2002,"era":"2000 onwards","tag":"Modern research","x":"In 2002 NASA and the German space agency launched GRACE: two satellites, nicknamed Tom and Jerry, chasing each other around Earth about 220 km apart. When the front satellite passes over a region of extra mass, such as a mountain range, it is pulled forward slightly and the gap changes. A microwave link measured the distance between them to a few thousandths of a millimetre. The mission mapped Earth's gravity in fine detail and showed ice sheets in Greenland and Antarctica losing hundreds of billions of tonnes a year. Its successor, GRACE-FO, launched in 2018.","q":"How can the gap between two satellites reveal melting ice?"},{"id":"frc-009","t":"Archimedes' impossible lever","s":"Physics","tp":"Forces and motion","sub":"Moments","lv":["KS3","GCSE"],"who":"Archimedes","f":0,"loc":"Sicily","rg":["Europe"],"yr":-250,"era":"Ancient","tag":"Eccentric","x":"Archimedes is supposed to have said that, given a lever long enough and a place to stand, he could move the Earth. Moments make it possible in principle. But for someone to lift Earth's mass by pushing with their own weight, calculations suggest the long arm of the lever would need to be longer than the observable universe – and you would need to push for a very long time to move it even a tiny distance.","q":"Using moments, explain why a longer lever lets you lift a heavier load."},{"id":"frc-010","t":"The bridge that missed by 54 cm","s":"Physics","tp":"Measurement","sub":"Errors","lv":["KS3","GCSE"],"who":"","f":0,"loc":"Germany / Switzerland","rg":["Europe"],"yr":2003,"era":"2000 onwards","tag":"Blunder","x":"Countries measure height above sea level from different reference points: Germany uses a level linked to Amsterdam, Switzerland one linked to Marseille on the Mediterranean, and Great Britain uses Newlyn in Cornwall. In 2003, engineers building a bridge across the Rhine between Laufenburg in Germany and Laufenburg in Switzerland knew the systems differed by 27 cm – but the correction was applied in the wrong direction, so the two halves were set to meet with a 54 cm difference. The mistake was spotted before the bridge was finished.","q":"Why is agreeing on a reference point essential in science?"},{"id":"frc-011","t":"The manhole cover that may have reached space","s":"Physics","tp":"Forces and motion","sub":"Speed","lv":["KS3","GCSE"],"who":"Robert Brownlee","f":0,"loc":"USA","rg":["North & Central America"],"yr":1957,"era":"1950–1999","tag":"Eccentric","x":"In 1957, during the Pascal-B underground nuclear test in Nevada, a 900 kg steel plate was welded over the top of the test shaft. The explosion blasted it upward. A high-speed camera caught it in only one frame, from which the test designer, Robert Brownlee, estimated it was travelling at around 66 km/s – about six times Earth's escape velocity. It was never found. It probably vaporised from air resistance before leaving the atmosphere, but it is sometimes jokingly called the first human-made object sent into space.","q":"Why does one frame of film give only a rough estimate of speed?"},{"id":"frc-012","t":"Terminal velocity in skydivers and raindrops","s":"Physics","tp":"Forces and motion","sub":"Terminal velocity","lv":["KS3","GCSE"],"who":"Felix Baumgartner","f":0,"loc":"USA","rg":["North & Central America"],"yr":2012,"era":"2000 onwards","tag":"Everyday","x":"A skydiver spread flat falls at around 200 km/h, and head-down nearer 300 km/h. Terminal velocity depends on air density, so higher up, where air is thinner, you fall faster: in 2012 Felix Baumgartner jumped from 39 km and broke the speed of sound in free fall. Under a parachute the large area brings speed down to around 5 m/s. Even raindrops can surprise: researchers in Mexico found that many small drops fall faster than their terminal velocity, probably because they are fragments of larger drops that broke up.","q":"Why does a skydiver go faster at high altitude?"},{"id":"frc-013","t":"Talking physics to avoid a fine","s":"Physics","tp":"Forces and motion","sub":"Speed","lv":["GCSE","A-Level"],"who":"Dmitri Krioukov","f":0,"loc":"USA","rg":["North & Central America"],"yr":2012,"era":"2000 onwards","tag":"Eccentric","x":"When the physicist Dmitri Krioukov was given a $400 ticket for not stopping at a stop sign in California, he wrote a four-page paper arguing the police officer had been fooled. The officer, he said, saw the car's angular speed across his field of view, not its actual speed, and a quick braking and acceleration just as another car blocked the view could look like steady motion. The judge dismissed the ticket. Separately, Leicester students calculated a car would need to travel at nearly a fifth of the speed of light to be red-shifted invisible to a speed camera.","q":"What is the difference between angular speed and linear speed?"},{"id":"frc-014","t":"Prince Rupert's drops","s":"Physics","tp":"Matter","sub":"Stress and strain","lv":["GCSE","A-Level"],"who":"Prince Rupert of the Rhine, Robert Hooke","f":0,"loc":"UK / Germany","rg":["Europe"],"yr":1660,"era":"1500–1699","tag":"Nature","x":"Drip molten glass into cold water and you get a tadpole-shaped drop. Its round head can survive a hammer blow, yet snapping its thin tail makes the whole drop explode into powder. Prince Rupert brought them to the court of Charles II in the 1660s, and Robert Hooke suggested the cause: the outside cools first and is squeezed tightly by the inside, which is left under tension. High-speed cameras show the crack racing through the glass at around 1.5 km/s.","q":"Why does the head resist being crushed but fail when the tail breaks?"},{"id":"frc-015","t":"The great molasses flood","s":"Physics","tp":"Matter","sub":"Fluids","lv":["KS3","GCSE"],"who":"","f":0,"loc":"USA","rg":["North & Central America"],"yr":1919,"era":"1900–1949","tag":"Tragedy","x":"On a mild January day in 1919, a huge tank of molasses burst in Boston's North End. A wave of syrup several metres high swept through the streets at around 50 km/h, wrecking buildings and killing 21 people and many horses. Rescuers struggled because the thick syrup grew more viscous as it cooled in the winter air. Residents claimed that on hot days the area still smelled of molasses decades later.","q":"Why does a viscous liquid become even harder to move through when it cools?"},{"id":"frc-016","t":"Swimming in syrup","s":"Physics","tp":"Forces and motion","sub":"Drag","lv":["GCSE"],"who":"Edward Cussler, Brian Gettelfinger","f":0,"loc":"USA","rg":["North & Central America"],"yr":2004,"era":"2000 onwards","tag":"Eccentric","x":"Would you swim faster or slower in a thicker liquid? Experts disagreed, so in 2004 chemical engineers at the University of Minnesota added about 300 kg of guar gum – a food thickener – to a swimming pool, making it twice as viscous as water. Swimmers' times hardly changed. Most drag on a swimmer comes from pushing water out of the way (form drag), not from viscosity, so the extra thickness made little difference. The work won an Ig Nobel prize.","q":"Name two kinds of drag force on a swimmer."},{"id":"frc-017","t":"Run or walk in the rain?","s":"Physics","tp":"Forces and motion","sub":"Speed","lv":["KS3","GCSE"],"who":"","f":0,"loc":"UK / Italy","rg":["Europe"],"yr":2012,"era":"2000 onwards","tag":"Everyday","x":"Should you run in the rain to stay drier? Walking means more time in the rain, but running means you sweep into more drops in front of you. Several mathematical analyses, and experiments with people walking and running in identical rain, conclude that running is better – you end up somewhat drier, especially when the rain is heavy. The exact answer depends on your shape and the wind.","q":"Design an experiment to test whether running keeps you drier."},{"id":"frc-018","t":"Footprints of a prehistoric sprinter","s":"Biology","tp":"Evolution","sub":"Speed","lv":["KS3","GCSE"],"who":"Steve Webb","f":0,"loc":"Australia","rg":["Oceania"],"yr":2006,"era":"2000 onwards","tag":"Discovery","x":"About 20,000 years ago, people walked and ran across a muddy lakeshore at Willandra Lakes in New South Wales, Australia. Their footprints were preserved and discovered in 2003. From the spacing of the steps, researchers estimated that one person, known as T8, was running barefoot at around 37 km/h – close to the pace of a modern elite sprinter. Dinosaur trackways can be analysed the same way: a 'stampede' of small dinosaur footprints at Lark Quarry in Queensland suggests speeds of up to about 15 km/h.","q":"How can stride length tell you how fast someone was moving?"},{"id":"frc-019","t":"John Stapp, the fastest man on Earth","s":"Physics","tp":"Forces and motion","sub":"Acceleration","lv":["GCSE","A-Level"],"who":"John Paul Stapp, Edward Murphy","f":0,"loc":"USA","rg":["North & Central America"],"yr":1954,"era":"1950–1999","tag":"Eccentric","x":"US Air Force doctor John Paul Stapp wanted to know how much deceleration a human could survive, so he used himself as the test subject. In December 1954 he rode a rocket sled to over 1,000 km/h and stopped in just 1.4 seconds, experiencing about 46 g. He suffered broken wrists, cracked ribs and burst blood vessels in his eyes, but recovered. His work led to better seat belts and car safety. On an earlier test, an engineer named Edward Murphy found sensors wired backwards, and his grumble about it may have given us 'Murphy's law': if something can go wrong, it will.","q":"Why does stopping in a shorter time mean a larger force?"},{"id":"frc-020","t":"Champion accelerators of the natural world","s":"Biology","tp":"Adaptations","sub":"Acceleration","lv":["GCSE"],"who":"","f":0,"loc":"Worldwide","rg":["Worldwide"],"yr":2009,"era":"2000 onwards","tag":"Nature","x":"Humans black out at a few g, but other living things go far beyond. A bladderwort, a carnivorous water plant, sucks in prey with an acceleration of about 600 g. Fungi that grow on animal dung fire their spores using fluid pressure, reaching up to 180,000 g. A mantis shrimp's club accelerates at over 10,000 g, enough to crack snail shells, and Japanese researchers have even grown bacteria at 400,000 g in an ultracentrifuge.","q":"Why can tiny things survive accelerations that would kill a human?"},{"id":"frc-021","t":"Why the biggest animals aren't the fastest","s":"Biology","tp":"Adaptations","sub":"Acceleration","lv":["GCSE"],"who":"Myriam Hirt","f":1,"loc":"Germany","rg":["Europe"],"yr":2017,"era":"2000 onwards","tag":"Modern research","x":"In 2017 a team led by Myriam Hirt in Germany asked why elephants are slower than cheetahs. Their model showed that animals accelerate using fast-twitch muscle, which tires quickly. Small animals accelerate well but have little top speed; very big animals run out of energy before reaching their potential top speed. Medium-sized animals such as cheetahs and marlins come out fastest. Applied to dinosaurs, the model suggests a Tyrannosaurus rex could only reach around 27 km/h.","q":"Could you outrun a T. rex? What does the model suggest?"},{"id":"frc-022","t":"Why your shoelaces come undone","s":"Physics","tp":"Forces and motion","sub":"Forces","lv":["KS3","GCSE"],"who":"Christine Gregg, Oliver O'Reilly","f":1,"loc":"USA","rg":["North & Central America"],"yr":2017,"era":"2000 onwards","tag":"Modern research","x":"Engineers at the University of California, Berkeley filmed shoelaces in slow motion as a runner jogged on a treadmill. Each footstrike hits the knot with an acceleration of about 7 g, loosening it, while the swinging ends of the laces whip back and forth and pull the knot apart. The failure happens suddenly, within a couple of strides, once it starts. A 'strong' version of the bow knot holds much better than the common weak version.","q":"Which forces act on a shoelace knot as you run?"},{"id":"frc-023","t":"Galileo, Descartes and the first law","s":"Physics","tp":"Forces and motion","sub":"Newton's laws","lv":["GCSE","A-Level"],"who":"Galileo Galilei, René Descartes, Leonhard Euler","f":0,"loc":"Italy / France","rg":["Europe"],"yr":1644,"era":"1500–1699","tag":"Discovery","x":"Newton's first law – objects keep moving in a straight line unless a force acts – grew from others' ideas. Galileo noted that a ball let go from a sling flies off at a tangent, and Descartes wrote that each bit of matter stays in its state until something changes it. Newton was both inspired and irritated by Descartes, and may have named his book Principia to rival Descartes' 'Principles of Philosophy'. Surprisingly, Newton never wrote F = ma: that form first appeared decades later in the work of Leonhard Euler.","q":"Why did people before Galileo think a moving object needs a force to keep it moving?"},{"id":"frc-024","t":"Forceful bites","s":"Biology","tp":"Adaptations","sub":"Forces","lv":["KS3","GCSE"],"who":"Gregory Erickson","f":0,"loc":"USA","rg":["North & Central America"],"yr":2012,"era":"2000 onwards","tag":"Nature","x":"Gregory Erickson and colleagues measured the bite force of every living crocodilian species. The saltwater crocodile won, at over 16,000 N – the strongest bite ever measured in a living animal – compared with around 4,500 N for a spotted hyena. For their size, black piranhas bite with about thirty times their own body weight. Fossil analysis suggests an extinct giant piranha could bite with nearly 10,000 N and a Tyrannosaurus rex perhaps over 30,000 N. At the gentle end, a Venus flytrap closes with less than half a newton.","q":"How could you measure an animal's bite force safely?"},{"id":"frc-025","t":"Rollercoaster physics","s":"Physics","tp":"Forces and motion","sub":"Forces","lv":["GCSE","A-Level"],"who":"","f":0,"loc":"USA / UK","rg":["North & Central America","Europe"],"yr":2000,"era":"2000 onwards","tag":"Everyday","x":"Where should you sit on a rollercoaster? The whole train moves together, so it is slowest when its centre of mass is at the top of a hill. Riders at the front go over the top while the train is still slowing; riders at the back are whipped over the top as the train speeds up, giving a stronger 'floating' feeling. At the bottom, the effect reverses. Some rides subject riders to 5–6 g for short moments.","q":"Why does the back seat give the biggest thrill on the way down?"},{"id":"frc-026","t":"The smallest force ever measured","s":"Physics","tp":"Forces and motion","sub":"Forces","lv":["A-Level"],"who":"Dan Stamper-Kurn","f":0,"loc":"USA","rg":["North & Central America"],"yr":2014,"era":"2000 onwards","tag":"Modern research","x":"Researchers at Berkeley trapped a cloud of ultracold atoms between mirrors and used laser light to detect tiny changes in how it oscillated. They measured a force of about 42 yoctonewtons – 42 × 10⁻²⁴ N. For comparison, the weight of a single bacterium is around a million million times larger.","q":"Why are very cold atoms useful for measuring tiny forces?"},{"id":"frc-027","t":"Newton's notebook of sins","s":"Physics","tp":"How science works","sub":"Newton","lv":["KS3","GCSE","A-Level"],"who":"Isaac Newton","f":0,"loc":"UK","rg":["Europe"],"yr":1662,"era":"1500–1699","tag":"Eccentric","x":"Aged about 19, Isaac Newton wrote down a list of his sins. They included making a mousetrap on a Sunday, punching his sister, stealing plums from his mother's box, and threatening to burn his mother and stepfather and the house over them. Newton was intense and often difficult. He pushed a blunt needle around the back of his eye to see what colours appeared, stared at the Sun until he damaged his vision, predicted that the world would not end before 2060, and as a Member of Parliament is said to have only spoken to ask for a window to be closed.","q":"Do you need to be a likeable person to be a great scientist?"},{"id":"frc-028","t":"Roger Babson's war on gravity","s":"Physics","tp":"Forces and motion","sub":"Gravity","lv":["KS3","GCSE"],"who":"Roger Babson, Clarence Birdseye","f":0,"loc":"USA","rg":["North & Central America"],"yr":1948,"era":"1900–1949","tag":"Eccentric","x":"Roger Babson, an American businessman, believed Newton's laws had helped him predict the 1929 stock market crash, and he collected Newton's manuscripts. Gravity, he felt, was his enemy: his sister had drowned when he was young. In 1948 he founded the Gravity Research Foundation to find a way to block it, backed by people including the frozen-food pioneer Clarence Birdseye. He paid for stone monuments at universities 'to remind students' of the blessings of an anti-gravity material. At Tufts University, students who earn a PhD in cosmology kneel by the stone while an apple is dropped on their heads. The foundation now runs a respected essay prize on gravity.","q":"Why is 'blocking' gravity not possible in the way you can block light?"},{"id":"frc-029","t":"Hooke's anagram","s":"Physics","tp":"Forces and motion","sub":"Hooke's law","lv":["GCSE","A-Level"],"who":"Robert Hooke","f":0,"loc":"UK","rg":["Europe"],"yr":1676,"era":"1500–1699","tag":"Rivalry","x":"In 1676, Robert Hooke published his law of springs as a puzzle: the scrambled letters 'ceiiinosssttuv'. Two years later he revealed the answer: 'ut tensio, sic vis' – as the extension, so the force. Anagrams let scientists claim priority for an idea without giving it away to rivals. Hooke was Robert Boyle's assistant and sometimes mixed up the springiness of air with that of springs.","q":"What does 'as the extension, so the force' mean in modern terms?"},{"id":"frc-030","t":"The EmDrive: too good to be true","s":"Physics","tp":"Forces and motion","sub":"Newton's laws","lv":["A-Level"],"who":"Martin Tajmar","f":0,"loc":"UK / USA / Germany","rg":["North & Central America","Europe"],"yr":2016,"era":"2000 onwards","tag":"Blunder","x":"The EmDrive was a claimed rocket engine with no fuel: microwaves bouncing inside a cone-shaped metal box were said to push it forward. That would break conservation of momentum and Newton's third law. In 2016 a small NASA team reported a tiny thrust. In 2021 a group led by Martin Tajmar at the Technical University of Dresden tested the device carefully and found the 'thrust' came from heating of the apparatus and from cables interacting with Earth's magnetic field. With these effects removed, the thrust disappeared.","q":"Why should we be especially careful with results that would overturn a well-tested law?"},{"id":"frc-031","t":"Pascal's horse-drawn buses","s":"Physics","tp":"Forces and motion","sub":"Pressure","lv":["KS3","GCSE"],"who":"Blaise Pascal, Gilberte Pascal","f":1,"loc":"France","rg":["Europe"],"yr":1662,"era":"1500–1699","tag":"Invention","x":"According to his sister Gilberte, who wrote his biography, Blaise Pascal's father refused to teach him geometry, so at about twelve he worked out geometry for himself. He went on to build one of the first mechanical calculators, investigated air pressure, and showed that pressure in a fluid acts equally in all directions. Shortly before his death in 1662, he started the world's first public bus service in Paris: horse-drawn carriages running on fixed routes and timetables, whether full or empty. The unit of pressure is named after him.","q":"Why is it useful that pressure in a liquid acts equally in all directions?"},{"id":"frc-032","t":"Weird science of forces","s":"Physics","tp":"Forces and motion","sub":"Friction","lv":["KS3","GCSE"],"who":"Kiyoshi Mabuchi","f":0,"loc":"Japan / Worldwide","rg":["East Asia"],"yr":2012,"era":"2000 onwards","tag":"Eccentric","x":"Scientists have studied some unusual forces. Kiyoshi Mabuchi in Japan measured the friction of a banana skin on a floor and found a coefficient of about 0.07, as slippery as ice – the work won an Ig Nobel prize. Other papers have calculated the forces in a ponytail and the force needed to drag a sheep over different surfaces. Two penguin researchers calculated the pressure penguins produce to shoot their droppings clear of their nests – about 60 kPa, flinging it up to 40 cm.","q":"How would you measure the coefficient of friction of a banana skin?"},{"id":"frc-033","t":"Weighing less in Hudson Bay","s":"Earth Science","tp":"Plate tectonics","sub":"Gravity","lv":["GCSE","A-Level"],"who":"","f":0,"loc":"Canada","rg":["North & Central America"],"yr":2007,"era":"2000 onwards","tag":"Nature","x":"Gravity is not quite the same everywhere. Satellites show it is slightly weaker around Hudson Bay in Canada. During the last ice age, a thick ice sheet pushed the land down; the crust is still slowly rising back, so there is less mass beneath the region than normal. Slow currents in the mantle also play a part. The effect on your weight is tiny – a few thousandths of a per cent.","q":"Why would less mass underneath you reduce your weight?"},{"id":"frc-034","t":"Interleaved phone books","s":"Physics","tp":"Forces and motion","sub":"Friction","lv":["KS3","GCSE"],"who":"","f":0,"loc":"France","rg":["Europe"],"yr":2015,"era":"2000 onwards","tag":"Everyday","x":"Shuffle the pages of two phone books together and they become almost impossible to pull apart – TV shows have used cars and even tanks to try. Physicists in France explained why: the pages are not perfectly parallel, so pulling on them squeezes the pages together, increasing the normal force and therefore the friction. The force needed grows dramatically with the number of pages.","q":"Try it with two exercise books. How many pages do you need before you can't pull them apart?"},{"id":"frc-035","t":"Physics at the cinema","s":"Physics","tp":"Forces and motion","sub":"Forces","lv":["GCSE"],"who":"","f":0,"loc":"UK","rg":["Europe"],"yr":2014,"era":"2000 onwards","tag":"Eccentric","x":"University of Leicester students publish short papers testing scenes from films and songs. One calculated that a person swinging into a wall 'like a wrecking ball' would decelerate at around 288 g and recommended choosing a different metaphor. Another found that a bullet from a James Bond film could not have broken a train coupling, and that the henchman launched from Bond's ejector seat in Goldfinger would probably have survived.","q":"Pick a film stunt. Can you estimate the forces involved?"},{"id":"frc-036","t":"From Aristotle's 'violent' motion to force","s":"Physics","tp":"Forces and motion","sub":"History of force","lv":["GCSE","A-Level"],"who":"Aristotle, Jean Buridan, Simon Stevin","f":0,"loc":"Greece / France / Netherlands","rg":["Europe"],"yr":1586,"era":"1500–1699","tag":"Discovery","x":"Aristotle taught that anything moving must be pushed by something. In the 1300s Jean Buridan suggested a thrown object carries an 'impetus' that keeps it going until resistance wears it away – close to inertia. In 1586 the Flemish engineer Simon Stevin dropped two lead balls, one ten times heavier, from about 9 m and heard them hit the floor together, a few years before Galileo's similar work. Stevin also described forces adding like the sides of a parallelogram, and built a sail-powered 'land yacht' that carried 28 people along a Dutch beach faster than a galloping horse.","q":"How would you explain to Aristotle why a ball keeps rolling?"},{"id":"frc-037","t":"The devil in the suitcase","s":"Physics","tp":"Forces and motion","sub":"Rotation","lv":["A-Level"],"who":"Jean Perrin","f":0,"loc":"France","rg":["Europe"],"yr":1920,"era":"1900–1949","tag":"Eccentric","x":"The physicist George Gamow told a story about Jean Perrin, the Nobel-winning French physicist who proved atoms exist. Perrin supposedly packed a spinning gyroscope from an aircraft into a suitcase and left it at a Paris railway station. When a porter carrying the case tried to turn a corner, it twisted strangely in his hand, resisting the change of direction. The porter shouted that the devil was inside, dropped it and ran.","q":"Why does a spinning gyroscope resist being turned?"},{"id":"frc-038","t":"Fixing wobbly tables","s":"Physics","tp":"Forces and motion","sub":"Equilibrium","lv":["KS3","GCSE"],"who":"André Martin","f":0,"loc":"Switzerland","rg":["Europe"],"yr":2006,"era":"2000 onwards","tag":"Eccentric","x":"André Martin, a physicist at CERN, was annoyed by wobbly café tables. He proved that, for a square table on uneven ground that isn't too steep, you can always stop the wobble by rotating the table by less than 90 degrees, until all four legs touch the ground. Mathematicians later extended the proof to rectangular tables. Next time a table wobbles, try turning it.","q":"Try it! Does turning a wobbly table really work?"},{"id":"frc-039","t":"How the airbag was born","s":"Chemistry","tp":"Chemical reactions","sub":"Gases","lv":["KS3","GCSE"],"who":"John Hetrick","f":0,"loc":"USA","rg":["North & Central America"],"yr":1952,"era":"1950–1999","tag":"Invention","x":"In 1952, engineer John Hetrick swerved into a ditch to avoid an obstacle in the road, and he and his wife threw their arms in front of their daughter. Remembering a torpedo whose compressed air had blasted its canvas cover across a workshop, he designed a bag that would inflate from the dashboard in a crash. His version used compressed air and was too slow, and he never earned money from it. Modern airbags fill in about 30 milliseconds using nitrogen gas made by a rapid chemical reaction. They increase the time over which a person stops, reducing the force.","q":"Why does increasing the stopping time reduce the force on a passenger?"},{"id":"frc-040","t":"Lana's vacuum airship","s":"Physics","tp":"Forces and motion","sub":"Upthrust","lv":["KS3","GCSE"],"who":"Francesco Lana de Terzi","f":0,"loc":"Italy","rg":["Europe"],"yr":1670,"era":"1500–1699","tag":"Invention","x":"In 1670 the Italian priest Francesco Lana de Terzi designed a flying boat lifted by four large copper spheres with all the air pumped out. In principle an empty sphere weighs less than the air it pushes aside, so it should rise. The problem: copper thin enough to be light would be crushed flat by atmospheric pressure. Engineers are still exploring whether modern materials could make a vacuum airship work.","q":"Why would the spheres collapse?"},{"id":"frc-041","t":"Murphy's law and buttered toast","s":"Physics","tp":"Forces and motion","sub":"Moments","lv":["GCSE"],"who":"Robert Matthews","f":0,"loc":"UK","rg":["Europe"],"yr":1995,"era":"1950–1999","tag":"Everyday","x":"Does toast really land butter-side down? In 1995 the British physicist Robert Matthews showed it does, more often than not. A slice tipping off a table starts to rotate, but from a normal table height it only has time to make half a turn before hitting the floor. Tables are the height they are because humans are the height they are – so, he joked, the laws of physics doom us to buttery carpets. His advice: swipe the falling toast forward to stop it rotating. Schoolchildren later dropped nearly 10,000 slices to confirm it.","q":"How high would a table need to be for toast to land butter-side up?"},{"id":"frc-042","t":"Tartaglia and the path of a cannonball","s":"Physics","tp":"Forces and motion","sub":"Projectiles","lv":["GCSE","A-Level"],"who":"Niccolò Tartaglia, Galileo Galilei, Guidobaldo del Monte","f":0,"loc":"Italy","rg":["Europe"],"yr":1537,"era":"1500–1699","tag":"Discovery","x":"In 1537 the Italian mathematician Niccolò Tartaglia, who stuttered after a childhood sword wound, published the first book on the science of gunnery. He said a cannon fires furthest at 45°, but drew the path as a straight line, then a circular arc, then a vertical drop. Decades later Galileo and his friend Guidobaldo del Monte rolled an inked ball across a tilted board and saw it trace a parabola, showing the true shape of a projectile's path without air resistance.","q":"Why is Tartaglia's path actually not a bad description when air resistance is large?"},{"id":"frc-043","t":"Falling cats","s":"Physics","tp":"Forces and motion","sub":"Rotation","lv":["GCSE","A-Level"],"who":"James Clerk Maxwell, Étienne-Jules Marey","f":0,"loc":"UK / France","rg":["Europe"],"yr":1894,"era":"1800s","tag":"Eccentric","x":"Cats dropped upside down land on their feet, which seems to break conservation of angular momentum: how can they rotate without anything to push against? In 1894 the French scientist Étienne-Jules Marey filmed a falling cat with a high-speed camera and showed it twists its front and back halves in opposite directions, so the total angular momentum stays zero. At Cambridge, James Clerk Maxwell was rumoured to throw cats from windows; he insisted he only dropped them gently from a few centimetres onto a bed.","q":"How does an ice skater use the same principle?"},{"id":"frc-044","t":"Erasmus Darwin's spinning couch","s":"Biology","tp":"Health","sub":"Circular motion","lv":["GCSE"],"who":"Erasmus Darwin, James Watt, Carl Clark","f":0,"loc":"UK / USA","rg":["North & Central America","Europe"],"yr":1795,"era":"1700s","tag":"Invention","x":"Charles Darwin's grandfather Erasmus Darwin designed a 'rotative couch' to spin patients, thinking it might help with illness and sleep; James Watt drew plans but it was never built. Later, human centrifuges became essential for training pilots and astronauts. In the 1950s American researchers spun people in water-filled capsules to see if being underwater helped them survive high g, and centrifuge officer Carl Clark spent 24 hours at 2 g, cooking, eating and sleeping as he went round.","q":"Why do pilots black out in very tight turns?"},{"id":"frc-045","t":"The Voyager grand tour","s":"Physics","tp":"Space","sub":"Gravity assist","lv":["GCSE","A-Level"],"who":"Gary Flandro, Gaetano Crocco","f":0,"loc":"USA / Italy","rg":["North & Central America","Europe"],"yr":1977,"era":"1950–1999","tag":"Discovery","x":"In 1965, NASA engineer Gary Flandro realised that in the late 1970s the outer planets would line up in a way that happens only once every 175 years or so. A spacecraft could swing past Jupiter, Saturn, Uranus and Neptune, gaining speed from each in a 'gravity assist'. Earlier, the Italian Gaetano Crocco had worked out similar slingshot routes. The Voyager probes launched in 1977, and Voyager 2 is still the only spacecraft to have visited Uranus and Neptune. Both Voyagers are now in interstellar space.","q":"How can a spacecraft gain speed by flying past a planet?"},{"id":"frc-046","t":"Yo-yo de-spin","s":"Physics","tp":"Space","sub":"Angular momentum","lv":["A-Level"],"who":"","f":0,"loc":"USA","rg":["North & Central America"],"yr":1959,"era":"1950–1999","tag":"Invention","x":"Spinning keeps a satellite stable, but sometimes it needs to stop spinning. The clever solution is the yo-yo de-spin: two weights on cables are released from opposite sides. As they unwind outwards, like a skater stretching out their arms, the spin slows dramatically. The cables are then cut. The technique has been used on spacecraft from the 1950s to Mars rovers.","q":"Explain the yo-yo de-spin using conservation of angular momentum."},{"id":"frc-047","t":"Apophis and gravitational keyholes","s":"Physics","tp":"Space","sub":"Asteroids","lv":["GCSE","A-Level"],"who":"","f":0,"loc":"USA","rg":["North & Central America"],"yr":2029,"era":"2000 onwards","tag":"Modern research","x":"On 13 April 2029 the asteroid Apophis, about 340 m across, will pass closer to Earth than some communication satellites and will be visible to the naked eye. When it was discovered in 2004, astronomers worried about 'keyholes' – tiny regions of space where Earth's gravity could nudge it onto a collision course in a later orbit. More precise observations have ruled out any impact for at least a century, and spacecraft are being prepared to study the close flyby.","q":"Why does a small change in path become a big difference many years later?"},{"id":"frc-048","t":"Newton's centrifugal confusion","s":"Physics","tp":"Forces and motion","sub":"Circular motion","lv":["A-Level"],"who":"Isaac Newton","f":0,"loc":"UK","rg":["Europe"],"yr":1666,"era":"1500–1699","tag":"Discovery","x":"Students often think of a 'centrifugal' force pushing outwards in circular motion. Newton had the same struggle. In his early notes he treated a circle as a series of bounces off the inside of a square, and for years he thought in terms of a force fleeing the centre. Only later did he describe a centripetal force pulling inwards towards the centre – the idea that let him explain the orbits of the planets.","q":"What provides the centripetal force on the Moon?"},{"id":"frc-049","t":"A kilogram of feathers or a kilogram of lead?","s":"Physics","tp":"Forces and motion","sub":"Mass and weight","lv":["KS3","GCSE"],"who":"","f":0,"loc":"","rg":["Worldwide"],"yr":2010,"era":"2000 onwards","tag":"Everyday","x":"The old riddle has a twist. On ordinary scales in air, a kilogram of feathers actually reads slightly lighter, because the much larger volume of feathers displaces more air and gets more upthrust. In experiments where blindfolded people lifted boxes of identical size and mass, most still judged the lead box heavier – perhaps because its mass was concentrated in one place, making it feel different to handle.","q":"In a vacuum, which reads heavier on a scale?"},{"id":"frc-050","t":"Mass: from lumps of dough to inertia","s":"Physics","tp":"Forces and motion","sub":"Mass and weight","lv":["A-Level"],"who":"Aristotle, Isaac Newton, Ernst Mach","f":0,"loc":"Greece / UK / Austria","rg":["Europe"],"yr":1687,"era":"1500–1699","tag":"Discovery","x":"The word 'mass' comes from the Latin massa, a lump of dough. Ancient thinkers did not have one idea of weight; Aristotle thought earth and water naturally move down while air and fire move up. Newton wrote about 'quantity of matter' but often used the word weight for it. Later Ernst Mach complained that Newton's definition – density times volume – was circular, since density is defined using mass. Defining mass well remains surprisingly tricky.","q":"Why is it hard to define mass without using mass?"},{"id":"frc-051","t":"The Gimli Glider","s":"Physics","tp":"Measurement","sub":"Units","lv":["KS3","GCSE"],"who":"Robert Pearson","f":0,"loc":"Canada","rg":["North & Central America"],"yr":1983,"era":"1950–1999","tag":"Blunder","x":"On 23 July 1983, an Air Canada Boeing 767 ran out of fuel at 12,000 m over Manitoba. Canada was switching to metric units, and when the fuel was calculated, the ground crew used the pounds-per-litre conversion instead of kilograms-per-litre, loading less than half the fuel needed. Captain Robert Pearson, an experienced glider pilot, glided the jet to a former air base at Gimli – where a car racing event was taking place on the old runway. Everyone on board survived.","q":"Why is it so important to include units in every calculation?"},{"id":"frc-052","t":"Could you jump into orbit?","s":"Physics","tp":"Space","sub":"Orbits","lv":["GCSE","A-Level"],"who":"","f":0,"loc":"UK","rg":["Europe"],"yr":2012,"era":"2000 onwards","tag":"Eccentric","x":"On Mars's tiny moon Deimos, escape velocity is only about 5.6 m/s, which a good sprinter could reach. Could you jump into orbit? Physicists calculated you could not get into a stable orbit by jumping from the surface – you would either come back down or escape completely – but you might from a high cliff. A pebble dropped from waist height there would take well over a minute to land.","q":"What is the difference between escape velocity and orbital velocity?"},{"id":"frc-053","t":"Negative mass in the lab","s":"Physics","tp":"Forces and motion","sub":"Newton's laws","lv":["A-Level"],"who":"Michael Forbes, Peter Engels","f":0,"loc":"USA","rg":["North & Central America"],"yr":2017,"era":"2000 onwards","tag":"Modern research","x":"In theory, negative mass would accelerate in the opposite direction to the force applied. In 2017, physicists at Washington State University cooled rubidium atoms to near absolute zero, forming a Bose–Einstein condensate, and used lasers to make them behave as if they had negative 'effective mass'. Pushed, the atoms moved backwards. As one researcher put it, it looked as if they had hit an invisible wall.","q":"What would happen if you pushed a negative mass?"},{"id":"frc-054","t":"Paying for your mass","s":"Physics","tp":"Forces and motion","sub":"Mass and weight","lv":["KS3"],"who":"","f":0,"loc":"Samoa","rg":["Oceania"],"yr":2013,"era":"2000 onwards","tag":"Everyday","x":"In 2013 the small airline Samoa Air began charging passengers by their total mass – body plus luggage – rather than by seat. The boss argued it was fairest because fuel use depends on mass. Prices ranged from about one to four US dollars per kilogram, depending on the route.","q":"Why does a heavier plane use more fuel?"},{"id":"frc-055","t":"Weighing the soul","s":"Biology","tp":"Health","sub":"Experiments","lv":["KS3","GCSE"],"who":"Duncan MacDougall","f":0,"loc":"USA","rg":["North & Central America"],"yr":1907,"era":"1900–1949","tag":"Blunder","x":"In 1907 a Massachusetts doctor, Duncan MacDougall, placed six dying patients on a large balance and claimed that some of them lost a small amount of mass at the moment of death – one supposedly by 21 g. He concluded it was the soul. Dogs, he said, showed no change. His sample was tiny, the measurements were inconsistent and he left out results that did not fit. The '21 grams' myth survives in popular culture, but the experiment is a classic example of poor science.","q":"List three reasons why MacDougall's results are not reliable."},{"id":"frc-056","t":"Galileo the prankster","s":"Physics","tp":"How science works","sub":"Galileo","lv":["KS3"],"who":"Galileo Galilei","f":0,"loc":"Italy","rg":["Europe"],"yr":1600,"era":"1500–1699","tag":"Eccentric","x":"Galileo had a mischievous side. While working in Venice and Padua, he and a friend wrote letters to a Jesuit priest pretending to be a wealthy widow troubled by religious doubts. Galileo also wrote to a fellow mathematics professor posing as an amateur who needed help with a problem. He later wrote poems mocking the academic gowns professors had to wear.","q":"Galileo used humour in his science writing too. Why might humour help explain ideas?"},{"id":"elm-001","t":"Van Marum's monster machine","s":"Physics","tp":"Electricity","sub":"Static electricity","lv":["KS3","GCSE"],"who":"Martinus van Marum","f":0,"loc":"Netherlands","rg":["Europe"],"yr":1784,"era":"1700s","tag":"Eccentric","x":"In 1784 the Dutch scientist Martinus van Marum had the largest electrostatic generator of its time built for the Teylers Museum in Haarlem, where it still stands. Its two glass discs were each about 1.65 m across, and it threw sparks over half a metre long. It shattered blocks of wood and vaporised metal wire. Van Marum also staged an indoor 'thunderstorm' using bladders of hydrogen given opposite charges: they floated up, drifted together and exploded when a spark jumped between them. Today the biggest Van de Graaff generator, at Boston's Museum of Science, can reach several million volts.","q":"Why do sparks jump further from a higher voltage?"},{"id":"elm-002","t":"The 'X-ray barbecue'","s":"Physics","tp":"Atoms and radioactivity","sub":"Medical physics","lv":["GCSE","A-Level"],"who":"Robert Van de Graaff, John G. Trump","f":0,"loc":"USA","rg":["North & Central America"],"yr":1937,"era":"1900–1949","tag":"Invention","x":"Robert Van de Graaff, inventor of the dome-topped generator, was so polite that colleagues joked it was impossible to get through a door after him. With the MIT engineer John G. Trump he turned high-voltage generators into machines for treating cancer. When a doctor asked for a 400 kV X-ray source, Trump replied that they would only be interested if it was a million volts. Their machines rotated the patient in front of the X-ray beam, so that tumours got a high dose and surrounding tissue less; a magazine nicknamed it the 'X-ray barbecue'. Trump's work helped extend the lives of many cancer patients.","q":"Why does rotating the patient protect healthy tissue?"},{"id":"elm-003","t":"Tesla's death-ray box","s":"Physics","tp":"Electricity","sub":"Circuits","lv":["KS3","GCSE"],"who":"Nikola Tesla","f":0,"loc":"USA","rg":["North & Central America"],"yr":1943,"era":"1900–1949","tag":"Eccentric","x":"Late in life, Nikola Tesla was penniless and living in New York hotels. He claimed to have invented a 'death ray' particle-beam weapon, and gave a hotel a locked box as security for an unpaid bill, warning that it would explode if anyone unauthorised opened it. After his death in 1943, the US government asked the engineer John G. Trump to examine his papers. When Trump opened the mysterious box, as agents nervously backed away, it turned out to contain an old resistance-measuring device – a Wheatstone bridge.","q":"What does a Wheatstone bridge actually do?"},{"id":"elm-004","t":"Pointed or round lightning rods?","s":"Physics","tp":"Electricity","sub":"Static electricity","lv":["KS3","GCSE"],"who":"Benjamin Franklin, Benjamin Wilson, King George III","f":0,"loc":"UK / USA","rg":["North & Central America","Europe"],"yr":1777,"era":"1700s","tag":"Rivalry","x":"Benjamin Franklin invented the lightning rod and recommended sharp points. After lightning damaged a gunpowder store in Purfleet, Essex, which had pointed rods, the British painter-scientist Benjamin Wilson argued that rounded ends were safer. In 1777 he built a vast demonstration hanging in London's Pantheon to show King George III. With America in revolt, the king backed Wilson, and Franklin's pointed rods became politically suspect. According to a popular story, the President of the Royal Society told the king he could not change the laws of nature. In practice, the shape makes little difference to protection.","q":"Why should politics never decide a scientific question?"},{"id":"elm-005","t":"Electrical party tricks","s":"Physics","tp":"Electricity","sub":"Static electricity","lv":["KS3","GCSE"],"who":"Stephen Gray, Georg Bose","f":0,"loc":"UK / Germany","rg":["Europe"],"yr":1730,"era":"1700s","tag":"Eccentric","x":"In the 1700s electricity was fashionable entertainment. In 1730 Stephen Gray hung a boy horizontally from silk threads, charged him and showed that paper scraps leapt up to his hands – the 'flying boy'. In Germany, a woman stood on an insulating stool and was charged; any gentleman who tried to kiss her got a painful spark, a trick known as the 'electric Venus'. Lecturers also showed model 'thunder houses' that exploded when struck by an artificial lightning spark, unless fitted with a lightning conductor.","q":"Why did the boy need to hang from silk threads?"},{"id":"elm-006","t":"Guericke's sulphur Earth","s":"Physics","tp":"Electricity","sub":"Static electricity","lv":["GCSE"],"who":"Otto von Guericke","f":0,"loc":"Germany","rg":["Europe"],"yr":1663,"era":"1500–1699","tag":"Invention","x":"Otto von Guericke, mayor of Magdeburg, made a ball of sulphur the size of a child's head, mounted it on a rod and rubbed it with his hand as it turned. It attracted feathers and bits of paper and even glowed in the dark – making it one of the first electrostatic generators. He thought it was a model of how Earth holds things down. He is more famous for his Magdeburg hemispheres: two copper half-spheres with the air pumped out, which teams of horses struggled to pull apart until he opened a valve.","q":"Why couldn't the horses pull the hemispheres apart?"},{"id":"elm-007","t":"Flat batteries bounce higher","s":"Chemistry","tp":"Electrochemistry","sub":"Batteries","lv":["GCSE","A-Level"],"who":"Daniel Steingart","f":0,"loc":"USA","rg":["North & Central America"],"yr":2015,"era":"2000 onwards","tag":"Modern research","x":"An old trick claims you can test an alkaline battery by dropping it: a flat one bounces. Researchers at Princeton found it is true. As the battery discharges, the zinc powder inside turns into zinc oxide, which forms bridges between particles and makes the inside stiffer, so it bounces better. Surprisingly, the bounce stops increasing once the battery is about half empty, so it isn't a perfect test.","q":"What chemical change happens inside a battery as it goes flat?"},{"id":"elm-008","t":"Bovril's electric name","s":"Physics","tp":"Electricity","sub":"Language of science","lv":["KS3"],"who":"Edward Bulwer-Lytton","f":0,"loc":"UK","rg":["Europe"],"yr":1871,"era":"1800s","tag":"Everyday","x":"In 1871 the novelist Edward Bulwer-Lytton wrote about an underground race with a mysterious energy called 'vril', a kind of electrical life-force. The book was so popular that when a beef extract drink needed a name, the makers combined 'bovine' with 'vril' to make Bovril.","q":"Can you think of other products named after science?"},{"id":"elm-009","t":"Fire extinguishers, sparks and grain silos","s":"Physics","tp":"Electricity","sub":"Static electricity","lv":["KS3","GCSE"],"who":"","f":0,"loc":"USA / UK","rg":["North & Central America","Europe"],"yr":1977,"era":"1950–1999","tag":"Everyday","x":"Static charge can be dangerous. A carbon dioxide fire extinguisher can charge up to many thousands of volts as flakes of dry ice rush through the nozzle. In the 1970s, dust explosions at grain storage elevators in the USA killed dozens of people: flowing grain dust picks up charge, and a tiny spark in air full of dust can ignite it. Engineers now earth pipes and use devices that let charge leak away safely. Operating theatres take similar care, as an explosion during an operation was once traced to a static spark.","q":"Why is a cloud of fine dust more explosive than a heap of the same material?"},{"id":"elm-010","t":"I for current: Ampère's intensité","s":"Physics","tp":"Electricity","sub":"Current","lv":["KS3","GCSE","A-Level"],"who":"André-Marie Ampère","f":0,"loc":"France","rg":["Europe"],"yr":1826,"era":"1800s","tag":"Symbol","x":"Why is current I and not C? The letter comes from French. In the 1820s André-Marie Ampère, building on Ørsted's discovery that a current deflects a compass needle, worked out the force between two wires carrying currents. He described how strong a current was as its 'intensité du courant' – current intensity. In his 1826 work he wrote the ratio of two current intensities as i and i′, and the letter stuck. C was later needed for coulombs and capacitance anyway. Because i means current, electrical engineers write the square root of −1 as j instead of i. The unit of current, the ampere, honours Ampère.","q":"Why might 'current intensity' be a better description of current than 'amount of current'?","sym":"I"},{"id":"elm-011","t":"Ampère: happy at last","s":"Physics","tp":"Magnetism","sub":"Electromagnetism","lv":["GCSE","A-Level"],"who":"André-Marie Ampère","f":0,"loc":"France","rg":["Europe"],"yr":1836,"era":"1800s","tag":"Tragedy","x":"Ampère's father let him educate himself in the family library, and by 12 he was studying advanced mathematics. But his life was marked by tragedy: his father was guillotined during the French Revolution, and his beloved first wife died young. He suggested that magnetism is caused by tiny currents circulating inside molecules – an idea not tested experimentally until 1915, in an experiment involving Einstein. His gravestone reads 'Tandem felix' – happy at last – and his name is one of 72 engraved on the Eiffel Tower.","q":"How is Ampère's idea of tiny currents similar to the modern model of magnetic domains?"},{"id":"elm-012","t":"Nollet's electrified monks","s":"Physics","tp":"Electricity","sub":"Current","lv":["KS3","GCSE"],"who":"Jean-Antoine Nollet","f":0,"loc":"France","rg":["Europe"],"yr":1746,"era":"1700s","tag":"Eccentric","x":"In 1746 the French priest and physicist Jean-Antoine Nollet wanted to know how fast electricity travels. He lined up around 200 monks in a circle over a kilometre around, each holding iron wires connecting them to their neighbours. When he discharged a Leyden jar into the line, every monk jumped at the same instant. Nollet concluded electricity travels extremely fast. He also shocked 180 royal guards in front of King Louis XV, who reportedly found it very entertaining.","q":"What would you expect to see if electricity travelled slowly?"},{"id":"elm-013","t":"Galvani's frogs and the race for batteries","s":"Biology","tp":"Nerves","sub":"Bioelectricity","lv":["KS3","GCSE","A-Level"],"who":"Luigi Galvani, Lucia Galeazzi, Alessandro Volta, Giovanni Aldini","f":1,"loc":"Italy","rg":["Europe"],"yr":1791,"era":"1700s","tag":"Rivalry","x":"In Bologna, Luigi Galvani and his wife Lucia Galeazzi, who helped in his laboratory, noticed that dissected frogs' legs twitched when touched with metal. Galvani believed animals contained a special 'animal electricity'. Scientists were so eager to repeat the experiments that frogs became scarce. Alessandro Volta disagreed: he thought the electricity came from the two different metals. To prove it, he built the first battery in 1800, the voltaic pile. Both were partly right – nerves really do use electrical signals. Galvani's nephew Giovanni Aldini went further, making the bodies of executed criminals twitch in public shows, possibly inspiring Mary Shelley's Frankenstein.","q":"What did the twitching frog's leg act as in Galvani's circuit?"},{"id":"elm-014","t":"How much current is dangerous?","s":"Physics","tp":"Electricity","sub":"Safety","lv":["GCSE"],"who":"","f":0,"loc":"","rg":["Worldwide"],"yr":1960,"era":"1950–1999","tag":"Everyday","x":"A mains current of 1 mA through the body is barely felt; 10 mA can be painful and stop you letting go of a wire; around 100 mA through the chest can make the heart quiver uncontrollably. Dry skin has a high resistance, perhaps 100,000 Ω, but wet skin is far lower, so the same voltage pushes a much bigger current – which is why water and electricity are such a dangerous mix. The most dangerous path is hand to hand or hand to foot, because it crosses the heart.","q":"Use V = IR to explain why wet hands are more dangerous."},{"id":"elm-015","t":"Johann Ritter marries his battery","s":"Physics","tp":"Waves","sub":"Ultraviolet","lv":["GCSE","A-Level"],"who":"Johann Wilhelm Ritter","f":0,"loc":"Germany","rg":["Europe"],"yr":1801,"era":"1800s","tag":"Tragedy","x":"In 1801, a year after William Herschel found infrared, the German physicist Johann Ritter found radiation beyond violet: it darkened silver chloride faster than visible light did. We now call it ultraviolet. Ritter became obsessed with batteries, once writing 'tomorrow I marry my battery' before building a huge pile. He connected himself to batteries to feel the effects on his eyes, ears, tongue and other parts of his body, and stared at the Sun until he damaged his sight. He died, poor and unwell, at just 33.","q":"How did Ritter detect a radiation he couldn't see?"},{"id":"elm-016","t":"The war of the currents","s":"Physics","tp":"Electricity","sub":"AC and DC","lv":["GCSE","A-Level"],"who":"Thomas Edison, George Westinghouse, Nikola Tesla, Harold Brown","f":0,"loc":"USA","rg":["North & Central America"],"yr":1888,"era":"1800s","tag":"Rivalry","x":"In the 1880s Thomas Edison built power stations supplying direct current at around 110 V, which could only reach customers a mile or so away. George Westinghouse, using Tesla's alternating-current motors and transformers, could step voltage up for long-distance transmission and down again for homes. Edison's camp fought back with a campaign claiming AC was deadly. Harold Brown, supported by Edison, publicly electrocuted animals with AC and pushed for it to be used in the new electric chair. AC still won, powering the 1893 Chicago World's Fair and the Niagara Falls hydroelectric plant.","q":"Why does transmitting at high voltage waste less energy?"},{"id":"elm-017","t":"Two electric fluids or one?","s":"Physics","tp":"Electricity","sub":"Static electricity","lv":["KS3","GCSE"],"who":"Charles du Fay, Benjamin Franklin","f":0,"loc":"France / USA","rg":["North & Central America","Europe"],"yr":1733,"era":"1700s","tag":"Discovery","x":"In 1733 the French scientist Charles du Fay found that gold leaf charged by rubbed glass was attracted to gold leaf charged by rubbed amber, but repelled by more glass-charged leaf. He decided there were two electric fluids, 'vitreous' and 'resinous'. Benjamin Franklin proposed a single fluid: charging moves it from one object to another, leaving one with too much (positive) and one with too little (negative). Franklin's guess about which way the fluid moves turned out to be the opposite of how electrons move – which is why conventional current flows from + to –.","q":"Why does conventional current point the 'wrong' way?"},{"id":"elm-018","t":"Franklin shocks himself while cooking a turkey","s":"Physics","tp":"Electricity","sub":"Static electricity","lv":["KS3","GCSE"],"who":"Benjamin Franklin","f":0,"loc":"USA","rg":["North & Central America"],"yr":1750,"era":"1700s","tag":"Accident","x":"Benjamin Franklin is remembered for his kite, but he also enjoyed electrical pranks: drinking glasses rigged to shock the drinker, an 'electric kiss', and a fake spider that twitched when charged. He experimented with killing turkeys by electric shock, believing it made the meat tender. In 1750, while preparing to kill a turkey for a Christmas dinner, he accidentally took the full shock from two large Leyden jars himself. Witnesses saw a great flash and heard a crack like a pistol; Franklin later wrote that his body felt numb from head to foot.","q":"What does a Leyden jar store?"},{"id":"elm-019","t":"Lichtenberg's electric stars","s":"Physics","tp":"Electricity","sub":"Static electricity","lv":["GCSE"],"who":"Georg Christoph Lichtenberg","f":0,"loc":"Germany","rg":["Europe"],"yr":1777,"era":"1700s","tag":"Accident","x":"In 1777 the German physicist Georg Christoph Lichtenberg built a large electrophorus, a device for building up static charge. It was dusty, and after a discharge he noticed the powder had settled into beautiful branching shapes like stars, ferns and galaxies. These Lichtenberg figures show the paths electrical discharges take. They are now made deliberately in blocks of acrylic, and sometimes appear briefly on the skin of people struck by lightning. Lichtenberg's dust patterns are also an ancestor of photocopying.","q":"Why does an electrical discharge branch like a tree?"},{"id":"elm-020","t":"Ørsted's lecture-room discovery","s":"Physics","tp":"Magnetism","sub":"Electromagnetism","lv":["KS3","GCSE"],"who":"Hans Christian Ørsted","f":0,"loc":"Denmark","rg":["Europe"],"yr":1820,"era":"1800s","tag":"Discovery","x":"In April 1820 the Danish physicist Hans Christian Ørsted was preparing a lecture in Copenhagen. Suspecting that a current might affect a compass, he tried it in front of his audience: the needle twitched when the current flowed. It was the first evidence that electricity and magnetism are linked. Within months, Ampère in Paris and Faraday in London were building on it, leading to electromagnets, motors and generators.","q":"How does a compass show there is a magnetic field around a wire?"},{"id":"elm-021","t":"Electric fish and the missing spark","s":"Biology","tp":"Nerves","sub":"Bioelectricity","lv":["GCSE","A-Level"],"who":"John Walsh, Henry Cavendish","f":0,"loc":"UK / France","rg":["Europe"],"yr":1772,"era":"1700s","tag":"Discovery","x":"Torpedo rays and electric eels give shocks, but in the 1700s many doubted the shocks were electrical, because there was no spark or crackle. The British scientist John Walsh studied torpedo rays on the French coast, carefully recording what conducted their shocks: metal spoons did, sealing wax did not. In London in 1776 he finally saw a tiny spark from an electric eel. Henry Cavendish then built an artificial torpedo from leather, metal plates and Leyden jars, soaked in salt water, which gave similar shocks without sparks, helping to separate the ideas of voltage and charge.","q":"Why would a fish shock be harder to see as a spark than a static shock?"},{"id":"elm-022","t":"Electric eels on Piccadilly","s":"Biology","tp":"Nerves","sub":"Bioelectricity","lv":["KS3","GCSE"],"who":"","f":0,"loc":"UK","rg":["Europe"],"yr":1776,"era":"1700s","tag":"Eccentric","x":"In 1776 a ship's captain exhibited live electric eels in rooms on Piccadilly in London. Visitors could dip a finger into the tank for a mild tingle, or – for the brave – grasp an eel by its head and tail, completing the circuit through their body. Some were knocked over or numbed for hours. Electric eels can produce about 600 V. Sharks and rays, meanwhile, sense tiny electric fields using jelly-filled pores on their snouts, and early undersea internet cables were bitten by sharks, possibly attracted by their fields.","q":"Why did holding both ends give a bigger shock?"},{"id":"elm-023","t":"Phones in thunderstorms","s":"Physics","tp":"Electricity","sub":"Safety","lv":["KS3","GCSE"],"who":"","f":0,"loc":"Australia / UK","rg":["Oceania","Europe"],"yr":1998,"era":"1950–1999","tag":"Everyday","x":"Lightning strikes on or near telephone lines can send surges of thousands of amps along them. Before mobile phones, dozens of people a year in Australia were injured using landline phones during storms, and UK doctors described a boy knocked unconscious when his phone was blown off the wall. When lightning strikes, the ground nearby is pushed to a high voltage, while the phone line is connected to distant ground – the difference drives a current through anyone holding the receiver.","q":"Why is a mobile phone safer than a corded phone in a storm?"},{"id":"elm-024","t":"The everlasting storm of Catatumbo","s":"Earth Science","tp":"Atmosphere and climate","sub":"Lightning","lv":["KS3","GCSE"],"who":"","f":0,"loc":"Venezuela","rg":["South America"],"yr":1800,"era":"1800s","tag":"Nature","x":"Where the Catatumbo River flows into Lake Maracaibo in Venezuela, thunderstorms happen on up to around 160 nights a year, often lasting most of the night, with dozens of flashes a minute. Warm, moist air from the lake meets cold winds from the Andes, building storm clouds. Sailors once used the constant flickering as a lighthouse. The area may be the lightning capital of the world.","q":"What conditions are needed for a thunderstorm?"},{"id":"elm-025","t":"Lightning facts: rockets, volcanoes and glass","s":"Earth Science","tp":"Atmosphere and climate","sub":"Lightning","lv":["KS3","GCSE"],"who":"","f":0,"loc":"Worldwide","rg":["Worldwide"],"yr":1990,"era":"1950–1999","tag":"Nature","x":"Most lightning never reaches the ground; it flashes inside or between clouds. Volcanic eruptions can make lightning as ash particles rub together and charge up. Scientists trigger lightning deliberately by firing small rockets trailing earthed wires into storm clouds. When lightning hits sand, it can heat it to tens of thousands of degrees, fusing it into hollow tubes of glass called fulgurites, or 'petrified lightning'. Lightning has also been detected on Jupiter by spacecraft.","q":"Why might a volcanic ash cloud become charged?"},{"id":"elm-026","t":"Arago: prisoner, slave and prime minister","s":"Physics","tp":"Magnetism","sub":"Induction","lv":["GCSE","A-Level"],"who":"François Arago","f":0,"loc":"France / Spain / Algeria","rg":["Africa","Europe"],"yr":1824,"era":"1800s","tag":"Eccentric","x":"François Arago noticed that a spinning copper disc under a compass makes the needle turn – Arago's disc, later explained by Faraday as eddy currents. His life was an adventure. While measuring the meridian in Spain in 1808 he was arrested as a spy, escaped by boat to Algeria, was captured by pirates, imprisoned in a windmill and a fortress, held as a slave in Algiers, and finally returned to France, carrying lions as a gift from the ruler of Algiers. He became briefly the head of the French government in 1848 and signed the decree abolishing slavery in French colonies. 135 bronze medallions in Paris mark his meridian line.","q":"Why does a moving copper disc affect a magnet if copper is not magnetic?"},{"id":"elm-027","t":"Bunsen and Kirchhoff read the Sun","s":"Chemistry","tp":"Atomic structure","sub":"Spectroscopy","lv":["GCSE","A-Level"],"who":"Robert Bunsen, Gustav Kirchhoff","f":0,"loc":"Germany","rg":["Europe"],"yr":1859,"era":"1800s","tag":"Discovery","x":"One evening in Heidelberg, Robert Bunsen and Gustav Kirchhoff watched a fire burning in the city of Mannheim, about 20 km away. Pointing their spectroscope at it, they spotted the coloured lines of barium and strontium. Bunsen wondered: if they could analyse a distant fire, why not the Sun? People would think they were mad. 'I have gone mad,' Kirchhoff joked; 'so have I,' replied Bunsen. Their work identified elements in the Sun from its dark spectral lines and discovered two new elements on Earth, caesium and rubidium, named after the blue and red colours of their spectra.","q":"How can you find out what something is made of without touching it?"},{"id":"elm-028","t":"Tasting electricity","s":"Biology","tp":"Senses","sub":"Bioelectricity","lv":["KS3","GCSE"],"who":"Johann Sulzer, Nimesha Ranasinghe","f":0,"loc":"Switzerland / Singapore","rg":["Europe"],"yr":1752,"era":"1700s","tag":"Discovery","x":"Around 1752 the Swiss scholar Johann Sulzer noticed that touching pieces of lead and silver together on his tongue produced a taste like iron sulphate – a tiny battery formed in his mouth. Today researchers including Nimesha Ranasinghe in Singapore have built a 'digital lollipop' and spoons that use small currents on the tongue to create salty, sour or bitter tastes, perhaps helping people on low-salt diets.","q":"Why would two different metals on your tongue make a current?"},{"id":"elm-029","t":"Anatoli Bugorski: struck by a proton beam","s":"Physics","tp":"Particle physics","sub":"Accelerators","lv":["GCSE","A-Level"],"who":"Anatoli Bugorski","f":0,"loc":"Russia","rg":["Europe"],"yr":1978,"era":"1950–1999","tag":"Accident","x":"In 1978, Anatoli Bugorski was checking a piece of equipment at the U-70 particle accelerator in Protvino, USSR, when safety systems failed and he put his head in the path of a beam of 76 GeV protons. He saw a flash 'brighter than a thousand suns' but felt no pain. The left side of his face swelled and later became paralysed, and he lost hearing in one ear, but he survived, finished his PhD and kept working as a scientist.","q":"Why might a narrow beam of protons cause less damage than expected?"},{"id":"elm-030","t":"Japan's two-frequency grid","s":"Physics","tp":"Electricity","sub":"AC and DC","lv":["GCSE"],"who":"","f":0,"loc":"Japan","rg":["East Asia"],"yr":1895,"era":"1800s","tag":"Everyday","x":"In 1895 Tokyo bought electricity generators from Germany, which ran at 50 Hz; Osaka bought from the USA, at 60 Hz. The choice stuck. Today eastern Japan uses 50 Hz and western Japan 60 Hz, and special converter stations are needed to share power between the halves – a problem after the 2011 earthquake, when the east lost nuclear power stations but could only receive limited help from the west.","q":"Why can't you just connect two grids with different frequencies?"},{"id":"elm-031","t":"The hum that dates recordings","s":"Physics","tp":"Electricity","sub":"AC and DC","lv":["GCSE","A-Level"],"who":"Catalin Grigoras","f":0,"loc":"UK / Romania","rg":["Europe"],"yr":2005,"era":"2000 onwards","tag":"Modern research","x":"Britain's mains supply alternates at about 50 Hz, but the exact frequency wobbles slightly as demand rises and falls. Electrical equipment picks up a faint hum at this frequency, which can get into audio recordings. Forensic scientists keep records of the grid frequency and can match a recording's hum pattern to the exact time it was made, a technique called electrical network frequency analysis, used in court cases.","q":"Why does the grid frequency drop slightly when demand suddenly rises?"},{"id":"elm-032","t":"Frog galvanometers","s":"Biology","tp":"Nerves","sub":"Bioelectricity","lv":["GCSE"],"who":"Carlo Matteucci","f":0,"loc":"Italy","rg":["Europe"],"yr":1840,"era":"1800s","tag":"Eccentric","x":"Before sensitive meters, scientists used animals as detectors. The Italian physiologist Carlo Matteucci put a frog's leg in a glass tube with its nerve sticking out; if the nerve touched a current, the leg twitched. He used this 'frog galvanoscope' to show that damaged muscle produces a small current. Others built batteries from stacked frog muscles.","q":"What does a galvanometer measure?"},{"id":"elm-033","t":"Fleming's 'happy thought'","s":"Physics","tp":"Magnetism","sub":"Motor effect","lv":["GCSE","A-Level"],"who":"John Ambrose Fleming","f":0,"loc":"UK","rg":["Europe"],"yr":1904,"era":"1900–1949","tag":"Invention","x":"John Ambrose Fleming had to leave university to earn money, worked as a clerk, finished his degree at evening classes and became a schoolteacher, before studying under Maxwell. He gave us the left-hand rule for motors – Force on the thumb, B field on the first finger, I current on the second finger – and in 1904 invented the thermionic valve, the first electronic device able to let current through in only one direction. He called its invention a 'sudden very happy thought'. Students said his lectures were clear but so fast they could hardly keep up.","q":"Use Fleming's left-hand rule (F B I) to predict which way a wire moves."},{"id":"elm-034","t":"Volta's pistol and the opera singer","s":"Chemistry","tp":"Organic chemistry","sub":"Methane","lv":["GCSE","A-Level"],"who":"Alessandro Volta","f":0,"loc":"Italy","rg":["Europe"],"yr":1776,"era":"1700s","tag":"Discovery","x":"In 1776 Alessandro Volta poked the mud of Lake Maggiore and collected the bubbles that rose: 'inflammable air from marshes' – methane. He built an electric pistol in which a spark ignited methane to fire a cork, and imagined triggering one in Milan by a wire from Como, an early idea of signalling at a distance. Volta also connected batteries to his ears and heard a sound like boiling soup. In his forties he fell in love with an opera singer, but his family refused to accept her. His 1800 battery, the voltaic pile, was inspired by the stacked cells in an electric ray.","q":"What is the chemical test for methane burning?"},{"id":"elm-035","t":"The man who set the carpet on fire","s":"Physics","tp":"Electricity","sub":"Static electricity","lv":["KS3","GCSE"],"who":"Frank Clewer","f":0,"loc":"Australia","rg":["Oceania"],"yr":2005,"era":"2000 onwards","tag":"Everyday","x":"In 2005, Frank Clewer walked into an office in Warrnambool, Australia, wearing a woollen shirt under a nylon jacket. Rubbing between the fabrics built up so much charge – firefighters measured about 40,000 V – that sparks scorched the carpet and the building was evacuated. Firefighters reported hearing crackling noises inside and outside. He had to hand over his jacket.","q":"Why do some pairs of materials charge up more than others?"},{"id":"elm-036","t":"Arrhenius and the electric classroom","s":"Chemistry","tp":"How science works","sub":"Fair testing","lv":["KS3","GCSE"],"who":"Svante Arrhenius, Nikola Tesla","f":0,"loc":"Sweden / USA","rg":["North & Central America","Europe"],"yr":1911,"era":"1900–1949","tag":"Blunder","x":"In 1911 newspapers worldwide reported that the Swedish chemist Svante Arrhenius had wired a classroom with high-frequency currents and the children grew taller and learned faster. Tesla excitedly proposed electrified schools in New York. But when asked for details, Arrhenius explained the real study was with babies in an orphanage – and a nurse had put the healthiest babies in the electrified group. When he repeated it fairly, the effect vanished. Arrhenius also won a Nobel Prize for explaining how salts split into ions, and was one of the first to calculate that carbon dioxide could warm the planet.","q":"How should the babies have been divided into groups?"},{"id":"elm-037","t":"Ballooning spiders ride electric fields","s":"Biology","tp":"Adaptations","sub":"Electric fields","lv":["GCSE","A-Level"],"who":"Erica Morley, Daniel Robert, Charles Darwin","f":1,"loc":"UK","rg":["Europe"],"yr":2018,"era":"2000 onwards","tag":"Modern research","x":"Spiderlings 'balloon' by releasing silk threads and floating away; Charles Darwin saw them landing on HMS Beagle far out to sea. But how do heavy spiders take off on calm days? In 2018, Erica Morley and Daniel Robert at the University of Bristol showed that spiders can sense Earth's atmospheric electric field with hairs on their legs. When the researchers switched on an electric field in the lab, spiders tiptoed, released silk and lifted off, even with no air movement. The negatively charged ground repels their charged silk upwards.","q":"Why would a charged silk thread be pushed up by Earth's electric field?"},{"id":"elm-038","t":"Cassini gets a shock from Hyperion","s":"Physics","tp":"Space","sub":"Static electricity","lv":["GCSE","A-Level"],"who":"","f":0,"loc":"USA / Europe","rg":["North & Central America","Europe"],"yr":2005,"era":"2000 onwards","tag":"Modern research","x":"In 2005, as the Cassini spacecraft flew past Saturn's spongy-looking moon Hyperion, it was hit by a beam of electrons. Hyperion's surface had built up a charge of about –200 V, from sunlight knocking out electrons and from charged particles trapped in Saturn's magnetic field. It was the first time a spacecraft had been 'zapped' by another world's static. Cassini was not damaged, but engineers now consider the risk for future missions.","q":"How can sunlight charge a surface?"},{"id":"elm-039","t":"Georg Ohm: unworthy to teach science","s":"Physics","tp":"Electricity","sub":"Resistance","lv":["KS3","GCSE","A-Level"],"who":"Georg Ohm","f":0,"loc":"Germany","rg":["Europe"],"yr":1827,"era":"1800s","tag":"Rivalry","x":"Georg Ohm, a locksmith's son, was pulled out of university by his father for spending too much time dancing, skating and playing billiards. He became a schoolteacher and, using his own carefully made wires, showed in 1827 that current is proportional to voltage for a conductor. His work was savagely attacked – one critic called it a web of naked fancies – and an education official reportedly said a teacher with such ideas was unworthy to teach science. Ohm resigned and spent years in poverty. Eventually his law was recognised, and he became a professor in Munich two years before he died. Henry Cavendish had found the same law decades earlier but never published it.","q":"Why was Ohm's law so hard to accept at the time?"},{"id":"elm-040","t":"Skin that remembers","s":"Biology","tp":"Body systems","sub":"Resistance","lv":["A-Level"],"who":"","f":0,"loc":"Norway","rg":["Europe"],"yr":2011,"era":"2000 onwards","tag":"Modern research","x":"A memristor is an electrical component whose resistance depends on the current that has flowed through it before – it 'remembers'. The idea was proposed in 1971, and the first one was built in 2008. Norwegian researchers found that human skin behaves like one: sweat ducts fill and empty depending on the voltage applied, so skin's resistance depends on what happened just before. Memristors may one day be used in computer memory that mimics the brain.","q":"Why might a component that remembers be useful in a computer?"},{"id":"elm-041","t":"Counting insulator discs","s":"Physics","tp":"Electricity","sub":"National grid","lv":["GCSE"],"who":"","f":0,"loc":"","rg":["Worldwide"],"yr":1950,"era":"1950–1999","tag":"Everyday","x":"Look up at an electricity pylon and you will see strings of glass or ceramic discs holding the cables. They stop current flowing into the metal tower. The higher the voltage, the more discs are needed, so you can estimate the line voltage by counting them. The dumbbell-shaped weights on cables are Stockbridge dampers, which stop the wind setting the cables vibrating.","q":"Why do higher voltages need longer insulator strings?"},{"id":"elm-042","t":"Why bulbs blow when you switch them on","s":"Physics","tp":"Electricity","sub":"Resistance","lv":["GCSE","A-Level"],"who":"","f":0,"loc":"","rg":["Worldwide"],"yr":1910,"era":"1900–1949","tag":"Everyday","x":"A cold tungsten filament has a much lower resistance than a hot one, so the moment you switch on a filament bulb, the current can be ten times bigger than normal. This surge
