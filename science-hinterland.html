o find the Higgs boson?"},{"id":"qnp-057","t":"Who ordered that?","s":"Physics","tp":"Particle physics","sub":"Leptons","lv":["A-Level"],"who":"Isidor Rabi, Leon Lederman","f":0,"loc":"USA","rg":["North & Central America"],"yr":1937,"era":"1900–1949","tag":"Blunder","x":"When the muon – a heavier version of the electron – was discovered in cosmic rays, it seemed to have no purpose. The physicist Isidor Rabi famously asked, 'Who ordered that?' Not all discoveries last: in 1976 Leon Lederman's team at Fermilab announced a new particle they called upsilon. It turned out to be a statistical fluke and was nicknamed the 'Oops-Leon'. Lederman's team did find a real upsilon particle the following year.","q":"Why do particle physicists need very large amounts of data before announcing a discovery?"},{"id":"qnp-058","t":"Astronauts see cosmic ray flashes","s":"Biology","tp":"Senses","sub":"Cosmic rays","lv":["GCSE","A-Level"],"who":"Buzz Aldrin","f":0,"loc":"Space / USA","rg":["Space","North & Central America"],"yr":1969,"era":"1950–1999","tag":"Discovery","x":"On Apollo 11 in 1969, Buzz Aldrin reported seeing flashes of light when his eyes were closed. Many astronauts since have seen streaks and stars in the dark. They are caused by cosmic ray particles passing through the eye and triggering the retina or the visual part of the brain. Experiments with particle beams on Earth have reproduced the effect.","q":"Why do astronauts receive a much higher radiation dose than people on Earth?"},{"id":"ast-001","t":"Mary Somerville, the first 'scientist'","s":"Physics","tp":"Space","sub":"Planets","lv":["KS3","GCSE","A-Level"],"who":"Mary Somerville, William Whewell","f":1,"loc":"Scotland","rg":["Europe"],"yr":1834,"era":"1800s","tag":"Hidden figure","x":"Mary Somerville grew up in Scotland at a time when girls were not meant to study mathematics. She taught herself from her brother's books, sometimes by candlelight after her family took her candles away. As a child she and her brother refused sugar in their tea in protest at the slave trade. She translated and explained Laplace's difficult work on planetary motion, and her 1834 book linking the physical sciences was a bestseller; it noted that wobbles in Uranus's orbit might reveal an unseen planet, a hint towards Neptune. Reviewing it, William Whewell coined the word 'scientist'. Her face appears on the Royal Bank of Scotland £10 note.","q":"Why might a word like 'scientist' have been needed in the 1830s?"},{"id":"ast-002","t":"Edwin Hubble: boxer, soldier, showman","s":"Physics","tp":"Space","sub":"Galaxies","lv":["GCSE","A-Level"],"who":"Edwin Hubble, Georges Lemaître","f":0,"loc":"USA / Belgium","rg":["North & Central America","Europe"],"yr":1929,"era":"1900–1949","tag":"Rivalry","x":"Edwin Hubble showed in the 1920s that the 'spiral nebulae' were separate galaxies, and that more distant galaxies are moving away faster. He also enjoyed telling dramatic stories about himself – some biographers think he exaggerated his boxing prowess and wartime adventures – and came back from Oxford with a British accent he kept for life. He was fiercely competitive. Yet the Belgian priest and physicist Georges Lemaître had published the same relationship two years before him, in French. In 2018 astronomers voted to rename it the Hubble–Lemaître law.","q":"Why does the expansion of the universe make distant galaxies recede faster?"},{"id":"ast-003","t":"Le Gentil: the unluckiest astronomer","s":"Physics","tp":"Space","sub":"Solar system","lv":["KS3","GCSE"],"who":"Guillaume Le Gentil","f":0,"loc":"France / India / Mauritius / Philippines","rg":["Africa","South Asia","Southeast Asia","Europe"],"yr":1769,"era":"1700s","tag":"Tragedy","x":"Transits of Venus across the Sun could be used to measure the size of the solar system. In 1760 the Frenchman Guillaume Le Gentil sailed to observe the 1761 transit from Pondicherry in India – but war with Britain meant he was still at sea on the day, rolling too much to measure. He decided to wait eight years for the next transit, in 1769, and built an observatory in Pondicherry. The morning was perfectly clear – until clouds covered the Sun for exactly the duration of the transit. Returning home after eleven years, he found he had been declared dead, his wife had remarried and his property had been divided up. He wrote a popular book about his adventures and eventually got his job back.","q":"How could the transit of Venus help measure the distance to the Sun?"},{"id":"ast-004","t":"Milton Humason: from mule driver to astronomer","s":"Physics","tp":"Space","sub":"Galaxies","lv":["KS3","GCSE"],"who":"Milton Humason, Edwin Hubble","f":0,"loc":"USA","rg":["North & Central America"],"yr":1917,"era":"1900–1949","tag":"Hidden figure","x":"Milton Humason left school at 14 and drove mule trains carrying building materials up Mount Wilson in California, where a great observatory was being built. He became a janitor there, then a night assistant, and taught himself astronomy. He became so skilled at photographing faint galaxy spectra that he measured most of the redshifts Hubble used to show the universe is expanding. He nearly discovered Pluto, too: it appeared on his plates, but once hidden near a bright star and once on a flaw in the photograph.","q":"What does redshift tell us about a galaxy?"},{"id":"ast-005","t":"Grote Reber's backyard radio telescope","s":"Physics","tp":"Space","sub":"Radio astronomy","lv":["GCSE","A-Level"],"who":"Grote Reber, Karl Jansky","f":0,"loc":"USA","rg":["North & Central America"],"yr":1937,"era":"1900–1949","tag":"Hidden figure","x":"In 1932 Karl Jansky discovered radio waves from the Milky Way but couldn't continue the work. Grote Reber, a radio engineer and amateur, built the first dish-shaped radio telescope in his garden in Illinois in 1937, a 9 m dish that neighbours found baffling. He tried several frequencies with no success before finally detecting the galaxy at 160 MHz, working at night to avoid interference from car spark plugs. He made the first radio map of the sky, and an astronomy journal sent experts to check his strange home-built instrument before publishing it.","q":"Why are radio telescopes so much larger than optical telescopes?"},{"id":"ast-006","t":"Alpher, Bethe, Gamow","s":"Physics","tp":"Space","sub":"Big Bang","lv":["A-Level"],"who":"Ralph Alpher, Hans Bethe, George Gamow","f":0,"loc":"USA","rg":["North & Central America"],"yr":1948,"era":"1900–1949","tag":"Eccentric","x":"In 1948 George Gamow and his student Ralph Alpher worked out how hydrogen and helium could have formed in the first minutes of the Big Bang. Gamow, a famous joker, added the name of Hans Bethe to the paper, even though Bethe had done no work on it, so the authors read 'Alpher, Bethe, Gamow' – like alpha, beta, gamma. The paper was published, appropriately, on 1 April. Alpher felt the joke overshadowed his own contribution.","q":"Why did the early universe make mostly hydrogen and helium?"},{"id":"ast-007","t":"Caroline Herschel: the first paid woman scientist","s":"Physics","tp":"Space","sub":"Comets","lv":["KS3","GCSE","A-Level"],"who":"Caroline Herschel, William Herschel","f":1,"loc":"Germany / UK","rg":["Europe"],"yr":1787,"era":"1700s","tag":"Hidden figure","x":"Caroline Herschel came to Bath from Germany in 1772 to train as a singer and keep house for her brother William, a musician. William became obsessed with astronomy, and Caroline was soon grinding mirrors, making moulds from horse dung, and writing down his observations through the night. After William discovered Uranus in 1781, Caroline began searching on her own and found eight comets and many nebulae. In 1787 King George III gave her a salary of £50 a year, making her the first woman known to be paid for scientific work. She later received the Gold Medal of the Royal Astronomical Society.","q":"How do you tell a comet from a star?"},{"id":"ast-008","t":"Schwarzschild solves Einstein at the front","s":"Physics","tp":"Space","sub":"Black holes","lv":["A-Level"],"who":"Karl Schwarzschild","f":0,"loc":"Germany / Russia","rg":["Europe"],"yr":1915,"era":"1900–1949","tag":"Wartime","x":"Karl Schwarzschild, director of the Potsdam observatory, volunteered for the German army in the First World War despite being over 40. Serving in an artillery unit on the Russian front, he read Einstein's newly published general relativity and, within weeks, found the first exact solution of its equations – describing the gravity around a star, and the radius now named after him at which nothing can escape. He wrote to Einstein that the war had let him take a walk in the land of Einstein's ideas. He fell ill with a rare skin disease and died in 1916.","q":"What is special about the Schwarzschild radius?"},{"id":"ast-009","t":"Cecilia Payne: what stars are made of","s":"Chemistry","tp":"Atomic structure","sub":"Spectroscopy","lv":["GCSE","A-Level"],"who":"Cecilia Payne-Gaposchkin, Henry Norris Russell, Arthur Eddington","f":1,"loc":"UK / USA","rg":["North & Central America","Europe"],"yr":1925,"era":"1900–1949","tag":"Hidden figure","x":"As a schoolgirl, Cecilia Payne tested prayer by praying before some exams and not others – and did better without it. After hearing Arthur Eddington lecture on relativity at Cambridge, she was so excited she could write the lecture down word for word. Cambridge would not give women degrees, so she moved to Harvard. In 1925, analysing star spectra, she showed that stars are made overwhelmingly of hydrogen and helium, not the same mix as Earth. The senior astronomer Henry Norris Russell persuaded her to call the result 'almost certainly not real'. A few years later he reached the same conclusion himself. Her thesis has been called the most brilliant ever written in astronomy.","q":"How can the spectrum of starlight reveal what a star is made of?"},{"id":"ast-010","t":"The Harvard computers","s":"Physics","tp":"Space","sub":"Stars","lv":["KS3","GCSE","A-Level"],"who":"Williamina Fleming, Annie Jump Cannon, Edward Pickering","f":1,"loc":"USA / Scotland","rg":["North & Central America","Europe"],"yr":1890,"era":"1800s","tag":"Hidden figure","x":"At Harvard College Observatory from the 1880s, director Edward Pickering employed a team of women, known as 'computers', to study hundreds of thousands of glass photographs of the sky – for about half a man's pay. Williamina Fleming had emigrated from Scotland, been abandoned by her husband, and was working as Pickering's maid when he gave her a job. She discovered the Horsehead Nebula and hundreds of variable stars. Annie Jump Cannon, who was almost deaf, could classify three stars a minute and catalogued around 350,000. She created the O, B, A, F, G, K, M spectral classes still used today.","q":"Make up a memorable phrase to remember O B A F G K M."},{"id":"ast-011","t":"Henrietta Leavitt's measuring stars","s":"Physics","tp":"Space","sub":"Galaxies","lv":["GCSE","A-Level"],"who":"Henrietta Swan Leavitt","f":1,"loc":"USA","rg":["North & Central America"],"yr":1912,"era":"1900–1949","tag":"Hidden figure","x":"Henrietta Swan Leavitt was another of Harvard's 'computers'. Women there were not allowed to use the telescopes, so she studied photographs. Looking at stars called Cepheids in the Small Magellanic Cloud, she noticed in 1912 that the brighter ones pulsed more slowly. Because those stars were all about the same distance from us, this meant a Cepheid's pulsing period reveals its true brightness – making it a 'standard candle' for measuring distance. Hubble used her discovery to show that Andromeda is a separate galaxy. Leavitt died in 1921, before a Swedish mathematician tried to nominate her for the Nobel Prize.","q":"How can knowing a star's true brightness tell you its distance?"},{"id":"ast-012","t":"The axis of evil","s":"Physics","tp":"Space","sub":"Cosmic microwave background","lv":["A-Level"],"who":"","f":0,"loc":"USA / Europe","rg":["North & Central America","Europe"],"yr":2003,"era":"2000 onwards","tag":"Modern research","x":"The cosmic microwave background is the faint afterglow of the Big Bang, almost the same in every direction. But maps from the WMAP and Planck satellites show odd features: some large-scale patterns seem to line up along one direction, nicknamed the 'axis of evil', and there is an unusually large 'cold spot'. They may just be chance, or they may hint at something missing from our models of the universe.","q":"Why is the microwave background almost the same everywhere?"},{"id":"ast-013","t":"Lemaître's cosmic egg and Hoyle's 'Big Bang'","s":"Physics","tp":"Space","sub":"Big Bang","lv":["GCSE","A-Level"],"who":"Georges Lemaître, Fred Hoyle","f":0,"loc":"Belgium / UK","rg":["Europe"],"yr":1949,"era":"1900–1949","tag":"Rivalry","x":"In 1927 the Belgian priest and physicist Georges Lemaître proposed that the universe is expanding and began from a 'primeval atom' or 'cosmic egg'. The British astronomer Fred Hoyle preferred a steady-state universe that had always existed, with new matter slowly appearing as it expanded. In a BBC radio talk in 1949 he called the rival idea the 'Big Bang' – not meant kindly – and the name stuck. The discovery of the cosmic microwave background in 1965 settled the debate in favour of the Big Bang.","q":"What evidence supports the Big Bang theory?"},{"id":"ast-014","t":"The planet Vulcan that never was","s":"Physics","tp":"Space","sub":"Solar system","lv":["GCSE","A-Level"],"who":"Urbain Le Verrier, Edmond Lescarbault, Albert Einstein","f":0,"loc":"France","rg":["Europe"],"yr":1859,"era":"1800s","tag":"Blunder","x":"In 1846 the French mathematician Urbain Le Verrier used wobbles in Uranus's orbit to predict Neptune, which was found within days. Mercury's orbit also had an unexplained wobble, so in 1859 he predicted another planet, closer to the Sun, named Vulcan. A country doctor, Edmond Lescarbault, claimed to have seen it cross the Sun, timing it with a watch that had lost a hand. Le Verrier believed him and died thinking Vulcan was real, and 'sightings' continued for decades. In 1915 Einstein's general relativity explained Mercury's orbit exactly – no extra planet needed.","q":"Why did the same method succeed for Neptune but fail for Vulcan?"},{"id":"ast-015","t":"Pigeons and the echo of the Big Bang","s":"Physics","tp":"Space","sub":"Cosmic microwave background","lv":["GCSE","A-Level"],"who":"Arno Penzias, Robert Wilson, Robert Dicke","f":0,"loc":"USA","rg":["North & Central America"],"yr":1964,"era":"1950–1999","tag":"Accident","x":"In 1964 Arno Penzias and Robert Wilson at Bell Labs in New Jersey were using a huge horn antenna and could not get rid of a faint hiss coming from every direction. They checked everything, including evicting a pair of pigeons and cleaning out what Penzias politely called 'white dielectric material'. The hiss remained. Just 60 km away, Robert Dicke's team at Princeton was building an instrument to look for leftover radiation from the Big Bang. When Penzias phoned him, Dicke reportedly told his colleagues, 'Boys, we've been scooped.' Penzias and Wilson won the Nobel Prize.","q":"Why does the Big Bang's afterglow now appear as microwaves?"},{"id":"ast-016","t":"The Milky Way tastes of raspberries","s":"Chemistry","tp":"Organic chemistry","sub":"Esters","lv":["GCSE","A-Level"],"who":"Arnaud Belloche","f":0,"loc":"Germany / Spain","rg":["Europe"],"yr":2009,"era":"2000 onwards","tag":"Modern research","x":"In 2009 astronomers using the IRAM radio telescope in Spain searched a giant dust cloud near the centre of our galaxy called Sagittarius B2. Among the molecules they detected was ethyl formate, the ester that gives raspberries part of their flavour – and which also smells of rum. Over 200 molecules have now been found in space, including alcohols, sugars and the building blocks of proteins.","q":"How do astronomers detect molecules from light-years away?"},{"id":"ast-017","t":"Pluto and the dwarf planets","s":"Physics","tp":"Space","sub":"Solar system","lv":["KS3","GCSE"],"who":"Clyde Tombaugh, Mike Brown, Venetia Burney","f":1,"loc":"USA / UK","rg":["North & Central America","Europe"],"yr":2006,"era":"2000 onwards","tag":"Discovery","x":"Pluto was discovered in 1930 by Clyde Tombaugh, a farm boy who had built his own telescopes. It was named by Venetia Burney, an 11-year-old girl in Oxford, who suggested the Roman god of the underworld. In 2005 Mike Brown's team found Eris, almost the same size. In 2006 astronomers decided that a planet must clear other objects from its orbit, so Pluto became a 'dwarf planet' alongside Eris, Ceres, Haumea and Makemake. Brown, sometimes called the man who killed Pluto, now searches for a possible 'Planet Nine' far beyond Neptune.","q":"Should Pluto be a planet? Argue both sides."},{"id":"ast-018","t":"Hubble destroys Shapley's universe","s":"Physics","tp":"Space","sub":"Galaxies","lv":["GCSE","A-Level"],"who":"Harlow Shapley, Heber Curtis, Edwin Hubble","f":0,"loc":"USA","rg":["North & Central America"],"yr":1920,"era":"1900–1949","tag":"Rivalry","x":"In 1920 Harlow Shapley and Heber Curtis held the 'Great Debate' on the size of the universe. Shapley argued that the spiral nebulae were clouds inside our own Milky Way; Curtis argued they were separate 'island universes'. In 1924 Hubble found Cepheid stars in the Andromeda nebula and, using Leavitt's method, showed it was far outside the Milky Way. Reading Hubble's letter, Shapley is said to have remarked that this was the letter that destroyed his universe.","q":"What would change if Andromeda were inside our galaxy?"},{"id":"ast-019","t":"Breathing in space","s":"Biology","tp":"Body systems","sub":"Space","lv":["KS3","GCSE"],"who":"","f":0,"loc":"International Space Station","rg":["Space"],"yr":2000,"era":"2000 onwards","tag":"Everyday","x":"On Earth, the warm carbon dioxide you breathe out drifts away by convection. In the weightlessness of the International Space Station, there is no convection, so exhaled carbon dioxide can form a bubble around a sleeping astronaut's head. That is why astronauts sleep near a fan or ventilation duct, to keep fresh air flowing.","q":"Why does convection need gravity?"},{"id":"ast-020","t":"Star birth is contagious","s":"Physics","tp":"Space","sub":"Nebulae","lv":["GCSE","A-Level"],"who":"Bart Bok","f":0,"loc":"Netherlands / USA","rg":["North & Central America","Europe"],"yr":1947,"era":"1900–1949","tag":"Nature","x":"Stars form when clouds of gas and dust collapse. Big new stars blast the surrounding gas with radiation, compressing it and triggering more star birth, and a supernova's shock wave can do the same. William Herschel saw dark patches in the sky he called 'holes in the heavens'; in the 1940s the Dutch-American astronomer Bart Bok suggested they were dense dark clouds where stars are forming, now called Bok globules. The Boomerang Nebula, a cloud of gas expanding from a dying star, is the coldest natural place known, about 1 K.","q":"Why does compressing a gas cloud help a star form?"},{"id":"ast-021","t":"The Pillars of Creation","s":"Physics","tp":"Space","sub":"Nebulae","lv":["KS3","GCSE"],"who":"","f":0,"loc":"Space","rg":["Space"],"yr":1995,"era":"1950–1999","tag":"Modern research","x":"The 'Pillars of Creation' in the Eagle Nebula are towering columns of cold gas and dust, several light-years tall, photographed by Hubble in 1995 and in infrared by the James Webb Space Telescope in 2022. Inside them new stars are forming. Some astronomers suggested a supernova may already have destroyed them, and we just haven't seen it yet because the light takes thousands of years to reach us; others disagree.","q":"How can we be looking at something that might no longer exist?"},{"id":"ast-022","t":"Why there are no green stars","s":"Physics","tp":"Space","sub":"Stars","lv":["GCSE","A-Level"],"who":"","f":0,"loc":"","rg":["Worldwide"],"yr":1900,"era":"1900–1949","tag":"Everyday","x":"Stars glow red, orange, yellow, white and blue, depending on their temperature. A star whose peak emission was green would be around 5,000–6,000 K – like the Sun. But such a star also gives out lots of red and blue light, and our eyes see the mix as white. So there are no green stars.","q":"Sketch the black-body curve of the Sun. Why does it look white?"},{"id":"ast-023","t":"Fabricius and the stolen goose","s":"Physics","tp":"Space","sub":"The Sun","lv":["KS3","GCSE"],"who":"David Fabricius, Johannes Fabricius","f":0,"loc":"Germany / Netherlands","rg":["Europe"],"yr":1611,"era":"1500–1699","tag":"Tragedy","x":"Sunspots were recorded by ancient Chinese astronomers. In 1611, the Frisian father and son David and Johannes Fabricius were among the first to observe them with a telescope, projecting the Sun's image. Johannes published the first account, before Galileo. Their story ended sadly: Johannes died young, and David was killed by a farmer he had accused of stealing a goose. Sunspots are actually cooler regions of the Sun, about 4,000 K, but would still glow brightly if seen on their own.","q":"Why do sunspots look dark if they are still thousands of degrees?"},{"id":"ast-024","t":"A photon's long journey out of the Sun","s":"Physics","tp":"Space","sub":"The Sun","lv":["GCSE","A-Level"],"who":"","f":0,"loc":"","rg":["Worldwide"],"yr":2000,"era":"2000 onwards","tag":"Nature","x":"Energy produced in the Sun's core by fusion is carried outwards by photons, but the interior is so dense that a photon travels only a tiny distance before being absorbed and re-emitted in a random direction. This 'random walk' means energy can take tens of thousands to hundreds of thousands of years to reach the surface. Once it escapes, the light reaches Earth in about eight minutes.","q":"Why does a random walk take so much longer than a straight path?"},{"id":"ast-025","t":"Tabby's star","s":"Physics","tp":"Space","sub":"Exoplanets","lv":["GCSE","A-Level"],"who":"Tabetha Boyajian","f":1,"loc":"USA","rg":["North & Central America"],"yr":2015,"era":"2000 onwards","tag":"Modern research","x":"In 2015 volunteers in the Planet Hunters project, led by astronomer Tabetha Boyajian, noticed that a star observed by the Kepler telescope dimmed irregularly by up to 22% – far too much for a planet. Some speculated about a giant alien 'megastructure'. Follow-up observations showed the dimming was stronger in blue light than red, suggesting fine dust rather than something solid. Boyajian's star is still not fully understood.","q":"Why should alien explanations be the last one scientists consider?"},{"id":"ast-026","t":"Giant stars and cannibal stars","s":"Physics","tp":"Space","sub":"Stars","lv":["GCSE","A-Level"],"who":"Anna Żytkow, Kip Thorne","f":1,"loc":"Poland / UK / USA","rg":["North & Central America","Europe"],"yr":1977,"era":"1950–1999","tag":"Discovery","x":"Some red supergiants are enormous: VY Canis Majoris placed at the centre of our solar system would extend beyond Jupiter. In 1977 the Polish astronomer Anna Żytkow and the American Kip Thorne predicted a strange object: a red supergiant that has swallowed a neutron star companion, now called a Thorne–Żytkow object. A few candidates have been found. Betelgeuse, the red supergiant in Orion's shoulder, spins surprisingly fast, perhaps because it swallowed a companion star.","q":"What will happen to Betelgeuse at the end of its life?"},{"id":"ast-027","t":"The Styrofoam planet","s":"Physics","tp":"Space","sub":"Exoplanets","lv":["KS3","GCSE"],"who":"","f":0,"loc":"USA","rg":["North & Central America"],"yr":2016,"era":"2000 onwards","tag":"Modern research","x":"The exoplanet KELT-11b is about 40% wider than Jupiter but has only a fifth of its mass, so its average density is about that of polystyrene foam. It orbits very close to its star, which is starting to swell into a red giant and will probably swallow the planet. Its puffy atmosphere makes it a great target for studying what exoplanet atmospheres are made of.","q":"Calculate the density of a planet from its mass and radius."},{"id":"ast-028","t":"Light echoes of V838 Monocerotis","s":"Physics","tp":"Space","sub":"Stars","lv":["GCSE"],"who":"","f":0,"loc":"Space","rg":["Space"],"yr":2002,"era":"2000 onwards","tag":"Discovery","x":"In 2002 the star V838 Monocerotis suddenly flared to hundreds of thousands of times the Sun's brightness. Over the following years, the Hubble telescope watched as the flash lit up surrounding shells of dust in an expanding 'light echo', like ripples spreading across a pond. The dust was not moving; light was simply reaching more distant parts of it over time.","q":"Why would the echo appear to expand faster than light?"},{"id":"ast-029","t":"Russell, Fleming and the first white dwarf","s":"Physics","tp":"Space","sub":"Stars","lv":["GCSE","A-Level"],"who":"Henry Norris Russell, Williamina Fleming, Edward Pickering","f":1,"loc":"USA","rg":["North & Central America"],"yr":1910,"era":"1900–1949","tag":"Discovery","x":"In 1910 Henry Norris Russell was studying faint stars when he asked Williamina Fleming to check the spectrum of a dim star called 40 Eridani B. She came back with the answer: it was type A – a hot, white star. Hot but faint meant it must be tiny. Russell was baffled; Pickering told him not to worry, since puzzles lead to progress. Russell later recalled that at that moment, the three of them were the only people in the world who knew white dwarfs existed.","q":"How can a star be both hot and dim?"},{"id":"ast-030","t":"Eddington's matchbox","s":"Physics","tp":"Space","sub":"White dwarfs","lv":["GCSE","A-Level"],"who":"Arthur Eddington, Ernst Öpik","f":0,"loc":"UK / Estonia","rg":["Europe"],"yr":1916,"era":"1900–1949","tag":"Discovery","x":"When astronomers calculated the density of Sirius B, the faint companion of the brightest star, they found it was enormous. The Estonian astronomer Ernst Öpik called his own result 'impossible'. Arthur Eddington joked that the star's message was that a ton of its material would fit into a matchbox, and that most astronomers replied, 'Don't talk nonsense.' White dwarfs really are that dense – a teaspoon would weigh several tonnes. Their cores may be crystals of carbon and oxygen, a little like a diamond.","q":"What force stops a white dwarf collapsing further?"},{"id":"ast-031","t":"Chandrasekhar's voyage and Eddington's scorn","s":"Physics","tp":"Space","sub":"White dwarfs","lv":["GCSE","A-Level"],"who":"Subrahmanyan Chandrasekhar, Arthur Eddington","f":0,"loc":"India / UK / USA","rg":["South Asia","North & Central America","Europe"],"yr":1930,"era":"1900–1949","tag":"Rivalry","x":"In 1930, aged 19, Subrahmanyan Chandrasekhar sailed from India to Cambridge. On the voyage he calculated that a white dwarf heavier than about 1.4 times the Sun's mass cannot support itself and must collapse further. In Cambridge he felt lonely and faced prejudice. In 1935 Eddington, the most powerful astronomer in Britain, ridiculed his result in public as 'stellar buffoonery', saying there should be a law of nature to stop a star behaving so absurdly. Chandrasekhar moved to the USA. He was right, and won the Nobel Prize in 1983; NASA's Chandra X-ray Observatory is named after him.","q":"What happens to a stellar core heavier than the Chandrasekhar limit?"},{"id":"ast-032","t":"Supernovae in Antarctic ice","s":"Earth Science","tp":"Atmosphere and climate","sub":"Ice cores","lv":["GCSE","A-Level"],"who":"","f":0,"loc":"Antarctica / Japan","rg":["Antarctica & Arctic","East Asia"],"yr":2009,"era":"2000 onwards","tag":"Modern research","x":"Radiation from a nearby supernova can produce nitrates in the upper atmosphere, which fall and get trapped in polar ice. Japanese researchers drilling Antarctic ice found nitrate spikes around 1006 and 1054 – the years Chinese, Japanese and Arab astronomers recorded brilliant 'guest stars'. The 1054 supernova left behind the Crab Nebula. Historical records from East Asia are among the best sources for ancient supernovae.","q":"How can ice record events in space?"},{"id":"ast-033","t":"Supernova 1987A and Caroline Moore","s":"Physics","tp":"Space","sub":"Supernovae","lv":["KS3","GCSE"],"who":"Ian Shelton, Caroline Moore","f":1,"loc":"Chile / USA","rg":["South America","North & Central America"],"yr":1987,"era":"1950–1999","tag":"Discovery","x":"On 24 February 1987 the Canadian astronomer Ian Shelton, working in Chile, noticed a new star on a photograph of the Large Magellanic Cloud – the first supernova visible to the naked eye since 1604. Hours before it brightened, detectors in Japan and the USA caught a burst of neutrinos from the collapsing core. In 2008, 14-year-old Caroline Moore from New York State became the youngest person to discover a supernova, using a small telescope; it was a strangely faint one that puzzled professionals.","q":"Why did the neutrinos arrive before the light?"},{"id":"ast-034","t":"Nuclear pasta in neutron stars","s":"Physics","tp":"Space","sub":"Neutron stars","lv":["A-Level"],"who":"","f":0,"loc":"","rg":["Worldwide"],"yr":2018,"era":"2000 onwards","tag":"Modern research","x":"A neutron star packs more than the Sun's mass into a ball about 20 km across. Its gravity is so strong that the tallest 'mountains' are probably only millimetres high. Deep in its crust, nuclear matter may form shapes that physicists call 'nuclear pasta' – sheets like lasagne and tubes like spaghetti. Computer simulations suggest this may be the strongest material in the universe.","q":"Estimate the density of a neutron star."},{"id":"ast-035","t":"Wanda Díaz-Merced listens to the stars","s":"Physics","tp":"Space","sub":"Data and senses","lv":["KS3","GCSE","A-Level"],"who":"Wanda Díaz-Merced","f":1,"loc":"Puerto Rico / South Africa","rg":["Africa"],"yr":2011,"era":"2000 onwards","tag":"Hidden figure","x":"Wanda Díaz-Merced, from Puerto Rico, lost her sight as a young astronomy student. Instead of giving up, she helped develop ways to turn astronomical data into sound – 'sonification'. Listening to data, she has picked out patterns in signals from exploding stars that graphs had hidden. She has worked on making astronomy accessible to blind and partially sighted scientists around the world, including at the International Astronomical Union's office in South Africa.","q":"What patterns might be easier to hear than to see?"},{"id":"ast-036","t":"Jocelyn Bell Burnell and 'Little Green Men'","s":"Physics","tp":"Space","sub":"Neutron stars","lv":["KS3","GCSE","A-Level"],"who":"Jocelyn Bell Burnell, Antony Hewish","f":1,"loc":"Northern Ireland / UK","rg":["Europe"],"yr":1967,"era":"1950–1999","tag":"Hidden figure","x":"As a PhD student in Cambridge, Jocelyn Bell helped hammer over a thousand posts into a field to build a radio telescope with 190 km of wire. In 1967, checking metres of paper chart by hand, she spotted a bit of 'scruff': a signal pulsing every 1.3 seconds. It was so regular it was jokingly labelled LGM-1, for Little Green Men. She found more, proving they were natural – rapidly spinning neutron stars, or pulsars. Reporters asked about her boyfriends and her height. The 1974 Nobel Prize went to her supervisor, not her. In 2018 she won a $3 million Breakthrough Prize and gave it all to fund students from under-represented groups to study physics.","q":"Why does a spinning neutron star appear to pulse?"},{"id":"ast-037","t":"Fritz Zwicky: right before anyone listened","s":"Physics","tp":"Space","sub":"Dark matter","lv":["GCSE","A-Level"],"who":"Fritz Zwicky, Walter Baade","f":0,"loc":"Bulgaria / Switzerland / USA","rg":["North & Central America","Europe"],"yr":1933,"era":"1900–1949","tag":"Eccentric","x":"Fritz Zwicky, a Swiss astronomer born in Bulgaria, made astonishing predictions. In 1933 he noticed that galaxies in a cluster moved too fast to be held together by visible matter and proposed invisible 'dark matter'. In 1934, with Walter Baade, he coined the word 'supernova' and suggested supernovae create neutron stars and cosmic rays. Newspapers mocked him. He was famously rude, calling enemies 'spherical' because they were unpleasant from every angle. He also fired the first human-made object out of Earth's gravity in 1957: pellets from a rocket-borne explosive charge.","q":"What evidence do we now have for dark matter?"},{"id":"ast-038","t":"Pulsars as a galactic sat-nav","s":"Physics","tp":"Space","sub":"Neutron stars","lv":["A-Level"],"who":"","f":0,"loc":"USA","rg":["North & Central America"],"yr":2017,"era":"2000 onwards","tag":"Modern research","x":"Some pulsars spin hundreds of times a second with clock-like regularity; the fastest known rotates 716 times a second. By timing X-ray pulses from several pulsars, a spacecraft could work out where it is anywhere in the solar system, like GPS. In 2017 a NASA experiment on the International Space Station called SEXTANT used pulsars to locate the station to within about 16 km (10 miles).","q":"How is pulsar navigation similar to GPS?"},{"id":"ast-039","t":"John Michell's dark stars","s":"Physics","tp":"Space","sub":"Black holes","lv":["GCSE","A-Level"],"who":"John Michell, John Wheeler","f":0,"loc":"UK / USA","rg":["North & Central America","Europe"],"yr":1783,"era":"1700s","tag":"Discovery","x":"In 1783 John Michell, an English country rector who also invented a balance for weighing the Earth, realised that a star massive enough would have an escape velocity faster than light, so no light could escape. He called these 'dark stars' and suggested finding them by their effect on companion stars – exactly how black holes are detected today. The name 'black hole' was popularised by the American physicist John Wheeler in 1967.","q":"Use the escape velocity idea to explain why light can't escape a black hole."},{"id":"ast-040","t":"Photographing a black hole","s":"Physics","tp":"Space","sub":"Black holes","lv":["KS3","GCSE","A-Level"],"who":"Katie Bouman","f":1,"loc":"Worldwide","rg":["Worldwide"],"yr":2019,"era":"2000 onwards","tag":"Modern research","x":"In April 2019, the Event Horizon Telescope team released the first image of a black hole: the glowing ring around the giant black hole at the centre of galaxy M87. Radio telescopes across the world, from Hawaii to Spain to the South Pole, observed together, acting like a single dish the size of Earth. The computer scientist Katie Bouman, who helped develop the imaging methods, became the public face of the effort. In 2022 the team released an image of Sagittarius A*, the black hole at the centre of our own Milky Way.","q":"Why does linking telescopes far apart give sharper images?"},{"id":"ast-041","t":"Black holes and your Wi-Fi","s":"Physics","tp":"Waves","sub":"Radio waves","lv":["GCSE","A-Level"],"who":"John O'Sullivan","f":0,"loc":"Australia","rg":["Oceania"],"yr":1992,"era":"1950–1999","tag":"Invention","x":"In the 1970s and 80s, the Australian radio astronomer John O'Sullivan was searching for radio flashes from tiny exploding black holes predicted by Stephen Hawking. He never found them, but developed mathematical techniques to clean up distorted radio signals. In the 1990s, his team at CSIRO realised the same ideas could solve a problem with indoor wireless networking, where signals bounce off walls and interfere. Their patent became a key part of Wi-Fi.","q":"Why do radio signals indoors interfere with themselves?"},{"id":"ast-042","t":"The note from a black hole","s":"Physics","tp":"Space","sub":"Black holes","lv":["GCSE"],"who":"","f":0,"loc":"USA","rg":["North & Central America"],"yr":2003,"era":"2000 onwards","tag":"Discovery","x":"In 2003, NASA's Chandra X-ray Observatory detected ripples in the hot gas around the supermassive black hole at the centre of the Perseus galaxy cluster. They are pressure waves – sound – with a period of millions of years, corresponding to a B-flat about 57 octaves below middle C. Of course, no one could ever hear it, but in 2022 NASA scaled it up into the audible range.","q":"Why can sound travel in a galaxy cluster but not through empty space?"},{"id":"ast-043","t":"Fears that CERN would make a black hole","s":"Physics","tp":"Particle physics","sub":"Accelerators","lv":["GCSE"],"who":"Frank Wilczek","f":0,"loc":"Switzerland","rg":["Europe"],"yr":2008,"era":"2000 onwards","tag":"Everyday","x":"Before the Large Hadron Collider started in 2008, sensational stories claimed it might create a black hole that would swallow the Earth. CERN received calls from frightened members of the public, and some physicists even received threats. Scientists explained that cosmic rays hitting Earth have far higher energies and have been doing so for billions of years without harm, and that any microscopic black holes would evaporate almost instantly.","q":"Why are cosmic ray collisions a good safety argument?"},{"id":"ast-044","t":"Seeing the back of your head","s":"Physics","tp":"Space","sub":"Black holes","lv":["A-Level"],"who":"","f":0,"loc":"","rg":["Worldwide"],"yr":1990,"era":"1950–1999","tag":"Everyday","x":"At 1.5 times the event-horizon radius of a black hole is the 'photon sphere', where gravity is so strong that light can travel in a circle. In principle, an astronaut there looking straight ahead could see the back of their own head, as light from it went all the way around the black hole. The astronaut would, of course, have other problems.","q":"Why must light bend in a gravitational field?"},{"id":"mat-001","t":"Thomas Young: the last man who knew everything","s":"Physics","tp":"Matter","sub":"Young modulus","lv":["GCSE","A-Level"],"who":"Thomas Young, Giordano Riccati, Claude-Louis Navier","f":0,"loc":"UK / Italy / France","rg":["Europe"],"yr":1807,"era":"1800s","tag":"Eccentric","x":"Thomas Young reportedly read at two and had read the Bible twice by four; at Cambridge he was nicknamed 'Phenomenon Young'. He worked as a doctor but was too cautious to be popular with patients. He showed light is a wave, explained colour vision and astigmatism, and helped decode Egyptian hieroglyphs. His definition of the stiffness of materials was so convoluted that the Admiralty said it was too learned to be understood. The Italian Giordano Riccati had measured elastic moduli decades earlier, and the clear modern definition – stress divided by strain – was given by the French engineer Claude-Louis Navier. Even so, it is called the Young modulus.","q":"Why is stress divided by strain a useful measure of stiffness?"},{"id":"mat-002","t":"The Young modulus of gummy bears","s":"Physics","tp":"Matter","sub":"Young modulus","lv":["KS3","GCSE","A-Level"],"who":"","f":0,"loc":"Worldwide","rg":["Worldwide"],"yr":2010,"era":"2000 onwards","tag":"Everyday","x":"Food scientists measure stiffness too. Tofu has a Young modulus of only about 10 kPa, marshmallow around 30 kPa, gummy bears about 70 kPa, cheddar a few hundred kPa, raw carrot several MPa and popcorn kernels hundreds of MPa. A frog's tongue is about ten times softer than a human's – so soft that it wraps around prey and stretches as it pulls back. Kangaroos store large amounts of elastic energy in their leg tendons, which is why hopping fast costs them barely more energy than hopping slowly.","q":"Rank some foods by how stiff you think they are, then test with weights."},{"id":"mat-003","t":"Pykrete: the ice aircraft carrier","s":"Physics","tp":"Matter","sub":"Materials","lv":["KS3","GCSE"],"who":"Geoffrey Pyke, Max Perutz, Louis Mountbatten","f":0,"loc":"UK / Canada","rg":["North & Central America","Europe"],"yr":1943,"era":"1900–1949","tag":"Wartime","x":"In the Second World War, the inventor Geoffrey Pyke proposed building an aircraft carrier out of ice mixed with wood pulp – 'pykrete' – which is much stronger and melts more slowly than plain ice. The young scientist Max Perutz tested it in a secret laboratory inside a London meat store, hidden behind frozen carcasses. Lord Mountbatten reportedly demonstrated it at a conference by firing a pistol at a block: the bullet bounced off and grazed someone. Pyke is said to have barged in on Churchill in his bath with a sample. A small prototype was built on a lake in Canada in 1943, but the full ship, nicknamed Habbakuk, was never made.","q":"Why does adding wood fibre make ice stronger?"},{"id":"mat-004","t":"Coulomb builds forts","s":"Physics","tp":"Matter","sub":"Friction","lv":["GCSE","A-Level"],"who":"Charles-Augustin de Coulomb","f":0,"loc":"France / Martinique","rg":["North & Central America","Europe"],"yr":1773,"era":"1700s","tag":"Discovery","x":"Before he measured electric forces, Charles-Augustin de Coulomb was an army engineer. In the 1760s he spent years building Fort Bourbon on the Caribbean island of Martinique, falling ill repeatedly. He used the work to study how soil and masonry fail under stress, developing ideas still used in structural engineering. He also studied friction, showing that sliding friction barely depends on speed. Back in France he endured seasickness to inspect a sea fort being built by a difficult aristocrat, and was rewarded with a gold watch with a second hand, which he used in experiments.","q":"Why would engineers need to know how much force makes a wall or slope fail?"},{"id":"mat-005","t":"Pliny's unbreakable diamond","s":"Chemistry","tp":"Bonding","sub":"Giant covalent structures","lv":["KS3","GCSE"],"who":"Pliny the Elder","f":0,"loc":"Roman Empire","rg":["Europe"],"yr":77,"era":"Ancient","tag":"Blunder","x":"The Roman writer Pliny the Elder claimed diamonds were so hard that a hammer blow would shatter the hammer and anvil – unless the diamond was first soaked in warm goat's blood. In fact diamond is hard but brittle: a sharp blow can shatter it, which is how diamonds are cut. Modern researchers have made diamond 'nanoneedles' so thin that they can bend surprisingly far without breaking.","q":"What is the difference between hard and tough?"},{"id":"mat-006","t":"Sugar glass and candy floss","s":"Chemistry","tp":"Particles","sub":"Glasses","lv":["KS3","GCSE"],"who":"","f":0,"loc":"","rg":["Worldwide"],"yr":1950,"era":"1950–1999","tag":"Everyday","x":"A glass is a solid whose particles are frozen in a disordered arrangement rather than a regular crystal. Boiled sweets and candy floss are glasses made of sugar. Film studios once made breakaway windows and bottles from sugar glass, which shatter realistically but safely. Humid air makes sugar glass go sticky, because water lowers the temperature at which it softens.","q":"Why does candy floss collapse on a humid day?"},{"id":"mat-007","t":"Do old windows flow?","s":"Physics","tp":"Matter","sub":"Solids and liquids","lv":["KS3","GCSE"],"who":"","f":0,"loc":"","rg":["Worldwide"],"yr":1998,"era":"1950–1999","tag":"Everyday","x":"A popular myth says glass is a slow-moving liquid, because old cathedral windows are thicker at the bottom. In fact, medieval glassmakers could not make perfectly even panes, and glaziers usually set the thick edge at the bottom for stability – some old panes are thicker at the top or sides. Calculations show room-temperature glass would take far longer than the age of the universe to flow noticeably.","q":"What evidence would you need to test the myth?"},{"id":"mat-008","t":"Liberty ships that snapped in half","s":"Physics","tp":"Matter","sub":"Brittle fracture","lv":["GCSE","A-Level"],"who":"Constance Tipper","f":1,"loc":"USA / UK","rg":["North & Central America","Europe"],"yr":1943,"era":"1900–1949","tag":"Blunder","x":"In the Second World War, American shipyards built about 2,700 'Liberty ships' quickly using welding instead of rivets. Hundreds developed cracks and some broke in two. In January 1943 the tanker SS Schenectady split almost in half while moored in calm water in Portland, Oregon, with a bang heard over a kilometre away. The Cambridge metallurgist Constance Tipper showed why: the steel became brittle in cold water, and cracks could run through welded plates unchecked. Her 'Tipper test' is still used to check steel toughness.","q":"Why would a riveted hull stop a crack better than a welded one?"},{"id":"mat-009","t":"The Titanic's brittle steel","s":"Physics","tp":"Matter","sub":"Brittle fracture","lv":["GCSE"],"who":"","f":0,"loc":"UK / North Atlantic","rg":["Antarctica & Arctic","Europe"],"yr":1912,"era":"1900–1949","tag":"Tragedy","x":"Steel samples recovered from the Titanic's wreck contain more sulphur and phosphorus and less manganese than modern ship steel. Tests show that at the icy sea temperature of the North Atlantic, around –2 °C, this steel was brittle, cracking rather than bending. The weak wrought-iron rivets used in parts of the hull may also have failed. Better steel might not have saved the ship, but it could have slowed the sinking.","q":"Why does temperature affect whether a material bends or snaps?"},{"id":"mat-010","t":"Captain Brown's wobbly railway bridge","s":"Physics","tp":"Matter","sub":"Elasticity","lv":["GCSE"],"who":"Samuel Brown, Robert Stephenson","f":0,"loc":"UK","rg":["Europe"],"yr":1830,"era":"1800s","tag":"Blunder","x":"Samuel Brown, a retired naval captain who made iron chains, designed one of the world's first suspension bridges to carry a railway, over the River Tees near Stockton. When the first coal train crossed in 1830, the deck sagged in a wave in front of the engine, which Robert Stephenson said rippled 'just like a carpet'. Wagons had to be spread out along a chain to cross, and the bridge was soon replaced by a stronger one.","q":"Why does a suspension bridge deck sag under a moving load?"},{"id":"mat-011","t":"Metal fatigue and the Versailles rail disaster","s":"Physics","tp":"Matter","sub":"Fatigue","lv":["GCSE","A-Level"],"who":"August Wöhler, William Rankine","f":0,"loc":"France / Germany / UK","rg":["Europe"],"yr":1842,"era":"1800s","tag":"Tragedy","x":"In May 1842, a train returning to Paris from celebrations at Versailles derailed when a locomotive axle snapped. The carriages caught fire, and because the doors were locked, at least 50 people died. Engineers, including the Scot William Rankine, began studying why metal parts break after many repeated stresses even when each load is well below the breaking strength. In Germany, August Wöhler tested axles millions of times and showed that below a certain stress some steels can last indefinitely – the basis of fatigue design today.","q":"Why does bending a paperclip back and forth eventually break it?"},{"id":"mat-012","t":"Roman concrete that heals itself","s":"Chemistry","tp":"Materials","sub":"Concrete","lv":["KS3","GCSE","A-Level"],"who":"Marie Jackson, Admir Masic","f":1,"loc":"Italy / USA","rg":["North & Central America","Europe"],"yr":2017,"era":"2000 onwards","tag":"Modern research","x":"Roman harbour walls built 2,000 years ago are still standing in seawater that destroys modern concrete in decades. In 2017 a team led by the geologist Marie Jackson showed that seawater reacts with the volcanic ash in Roman concrete to grow new crystals, such as aluminous tobermorite, that strengthen it over time. In 2023 Admir Masic's group found lumps of lime that dissolve and refill cracks when water gets in – self-healing concrete. Modern engineers are trying similar ideas, including adding bacteria that make limestone in cracks.","q":"Why does seawater normally damage concrete?"},{"id":"mat-013","t":"Marvin Pipkin and the 'impossible' frosted bulb","s":"Chemistry","tp":"Materials","sub":"Glass","lv":["KS3","GCSE"],"who":"Marvin Pipkin","f":0,"loc":"USA","rg":["North & Central America"],"yr":1925,"era":"1900–1949","tag":"Accident","x":"Early light bulbs had harsh, glaring light. At General Electric, new recruits were sometimes given an impossible task as a joke: frost the inside of a bulb without making it fragile. Nobody told the young chemist Marvin Pipkin it was impossible. He found that a second acid treatment smoothed the etched surface so it was no longer weak – according to one telling, he discovered this when a treated bulb rolled off the bench without breaking. His frosted bulbs were patented in 1925 and became standard.","q":"Why does a scratched or etched surface make glass weaker?"},{"id":"mat-014","t":"Materials that get fatter when stretched","s":"Physics","tp":"Matter","sub":"Elasticity","lv":["A-Level"],"who":"Roderic Lakes","f":0,"loc":"USA","rg":["North & Central America"],"yr":1987,"era":"1950–1999","tag":"Invention","x":"Pull a rubber band and it gets thinner. 'Auxetic' materials do the opposite: they get wider when stretched. In 1987 the American engineer Roderic Lakes made the first auxetic foam by squashing ordinary foam so its cells folded inwards like bow-ties. Auxetic materials absorb impacts well and are being used in protective sports gear and could make smart bandages that release drugs when a wound swells.","q":"Sketch a bow-tie shaped cell and show how stretching it makes it wider."},{"id":"mat-015","t":"Super balls and Silly Putty","s":"Chemistry","tp":"Polymers","sub":"Materials","lv":["KS3","GCSE"],"who":"James Wright, Norman Stingley","f":0,"loc":"USA / Australia","rg":["Oceania","North & Central America"],"yr":1943,"era":"1900–1949","tag":"Accident","x":"In 1943 the engineer James Wright at General Electric was trying to make synthetic rubber for the war effort. He mixed silicone oil with boric acid and got a goo that bounced, stretched, flowed and snapped if pulled quickly. Nobody could find a use until it was sold as a toy, Silly Putty, in 1950. In 1965 the chemist Norman Stingley invented the Super Ball, which bounces back with about 90% of its speed. A promotional giant Super Ball was reportedly dropped from a hotel in Australia and wrecked a parked car.","q":"How can a material be both a liquid and a solid?"},{"id":"mat-016","t":"Stookey's overheated glass","s":"Chemistry","tp":"Materials","sub":"Glass and ceramics","lv":["KS3","GCSE"],"who":"Donald Stookey","f":0,"loc":"USA","rg":["North & Central America"],"yr":1953,"era":"1950–1999","tag":"Accident","x":"In 1953, Donald Stookey at Corning Glass Works put a sample of special glass in a furnace set to 600 °C. The controller failed and the temperature rose to 900 °C. He expected a melted mess, but found a milky white solid. When he dropped it, it bounced. He had made the first glass-ceramic, much stronger and more heat-resistant than glass. It was used in rocket nose cones and the famous white CorningWare cookware. Corning's later research on strengthened glass led to Gorilla Glass, used in many phone screens.","q":"Why does a crystalline structure make glass-ceramic tougher?"},{"id":"mat-017","t":"Aerogel: frozen smoke","s":"Chemistry","tp":"Materials","sub":"Nanomaterials","lv":["KS3","GCSE"],"who":"Samuel Kistler","f":0,"loc":"USA","rg":["North & Central America"],"yr":1931,"era":"1900–1949","tag":"Invention","x":"Around 1931, Samuel Kistler reportedly bet a colleague he could replace the liquid in a jelly with gas without the jelly collapsing. He won, inventing aerogel. Silica aerogels are up to 99.8% air, the lightest solids ever made, and look like solid smoke. They are superb insulators – a thin layer can protect a flower from a blowtorch flame. NASA's Stardust spacecraft used aerogel to catch comet dust in 2004 without damaging the particles, and aerogel insulates Mars rovers.","q":"Why is a material made mostly of air such a good thermal insulator?"},{"id":"mat-018","t":"Spider silk and limpet teeth","s":"Biology","tp":"Adaptations","sub":"Materials","lv":["KS3","GCSE","A-Level"],"who":"Asa Barber","f":0,"loc":"UK / France","rg":["Europe"],"yr":2015,"era":"2000 onwards","tag":"Modern research","x":"Spider silk is tougher, weight for weight, than steel. Leicester students calculated that the silk in the Spider-Man film that stops a runaway train would cope with the stress. Silk also absorbs twisting, so a spider hanging on a thread doesn't spin round and round. But in 2015 a team led by Asa Barber at the University of Portsmouth found something stronger: the teeth of limpets, which scrape algae off rocks, contain fibres of an iron mineral and are the strongest known biological material.","q":"Why does a limpet need such strong teeth?"},{"id":"mat-019","t":"Starlite: the hairdresser's heat shield","s":"Chemistry","tp":"Materials","sub":"Polymers","lv":["KS3","GCSE"],"who":"Maurice Ward","f":0,"loc":"UK","rg":["Europe"],"yr":1990,"era":"1950–1999","tag":"Eccentric","x":"Maurice Ward, a hairdresser and amateur inventor from Hartlepool, made a plastic-like material in his kitchen that he called Starlite. On the BBC programme Tomorrow's World in 1990, an egg coated in Starlite was blasted with a blowtorch for minutes – and afterwards was still raw inside and barely warm. Military and aerospace researchers were amazed. Ward refused to patent it, fearing others would copy the recipe, and died in 2011 without revealing the formula publicly.","q":"What property must Starlite have to protect the egg?"},{"id":"mat-020","t":"Sophie Germain: Monsieur Le Blanc","s":"Physics","tp":"Waves","sub":"Vibrations","lv":["GCSE","A-Level"],"who":"Sophie Germain, Joseph-Louis Lagrange, Carl Friedrich Gauss","f":1,"loc":"France","rg":["Europe"],"yr":1816,"era":"1800s","tag":"Hidden figure","x":"During the French Revolution, the teenage Sophie Germain stayed indoors and taught herself mathematics from her father's library. Her parents took away her candles and clothes at night to stop her studying; she worked anyway, wrapped in blankets. Women could not attend the new École Polytechnique, so she obtained lecture notes and sent work to Joseph-Louis Lagrange under the name 'Monsieur Le Blanc'. Impressed, he insisted on meeting the author. In 1816, after three attempts, she won the Paris Academy's prize for explaining the vibrations of elastic plates – the patterns Ernst Chladni made by bowing sand-covered metal plates – becoming the first woman to win it.","q":"What causes sand to gather in lines on a vibrating plate?"},{"id":"mat-021","t":"Robert Hooke: brilliant and miserable","s":"Physics","tp":"Forces and motion","sub":"Hooke's law","lv":["GCSE","A-Level"],"who":"Robert Hooke, Samuel Pepys","f":0,"loc":"UK","rg":["Europe"],"yr":1665,"era":"1500–1699","tag":"Eccentric","x":"Robert Hooke was a genius and a hypochondriac who recorded headaches, nightmares and indigestion in his diary, treating himself with alarming medicines. Samuel Pepys called his 1665 book Micrographia, with its giant drawings of a flea and a louse, the most ingenious book he had ever read. To keep an ant still under his microscope, Hooke made it drunk with brandy. He sat inside a barrel while air was pumped out to see what low pressure did to people, losing some hearing. He also helped redesign London after the Great Fire and designed the Monument, which doubled as a giant vertical telescope.","q":"Why did Hooke's microscope drawings amaze people?"},{"id":"mat-022","t":"Hooke versus Newton","s":"Physics","tp":"Forces and motion","sub":"Gravity","lv":["GCSE","A-Level"],"who":"Robert Hooke, Isaac Newton, Edmond Halley","f":0,"loc":"UK","rg":["Europe"],"yr":1679,"era":"1500–1699","tag":"Rivalry","x":"In 1679 Hooke wrote to Newton suggesting that planets move in curved paths because they are attracted towards the Sun, and that the attraction might weaken with the square of the distance. Newton went on to prove this mathematically in the Principia. Hooke felt cheated; Newton, pushed by Halley, only grudgingly acknowledged him, and the two became bitter enemies. When Newton became President of the Royal Society after Hooke's death, Hooke's portrait went missing – no reliable portrait of him survives.","q":"Is having an idea the same as proving it?"},{"id":"mat-023","t":"Cauchy: four pages only","s":"Physics","tp":"Matter","sub":"Stress and strain","lv":["A-Level"],"who":"Augustin-Louis Cauchy","f":0,"loc":"France / Czech Republic","rg":["Europe"],"yr":1822,"era":"1800s","tag":"Eccentric","x":"Augustin-Louis Cauchy described stress and strain in three dimensions and made huge contributions to mathematics. He was also stubborn and prolific: he submitted so many long papers to the Paris Academy that it introduced a rule – still in force – that papers in its journal could be only four pages. A strict royalist, he refused to swear loyalty to new governments, went into exile, and tutored a young French prince in Prague, who teased him that he had begun his career in the sewers because he had once worked on Paris drains.","q":"Why is it useful to describe stress in three dimensions?"},{"id":"mat-024","t":"Counting atoms in incense","s":"Chemistry","tp":"Particles","sub":"Size of atoms","lv":["KS3","GCSE"],"who":"Johann Chrysostom Magnenus","f":0,"loc":"Italy / Germany","rg":["Europe"],"yr":1646,"era":"1500–1699","tag":"Discovery","x":"In 1646 the scholar Johann Chrysostom Magnenus lit a grain of incense in a church and noticed it could be smelled everywhere. He assumed at least one 'atom' of incense must reach every nose-sized space in the church, compared the volume of the church with that of his nose, and estimated a grain of incense contained at least about 7.8 × 10¹⁷ particles. It was one of the first attempts to estimate the number of atoms in anything – and far too small, but the reasoning was clever.","q":"How could you estimate the size of a molecule from a drop of oil on water?"},{"id":"mat-025","t":"Avogadro: the lawyer who counted molecules","s":"Chemistry","tp":"Atomic structure","sub":"The mole","lv":["GCSE","A-Level"],"who":"Amedeo Avogadro, André-Marie Ampère, Stanislao Cannizzaro","f":0,"loc":"Italy","rg":["Europe"],"yr":1811,"era":"1800s","tag":"Hidden figure","x":"Amedeo Avogadro trained as a church lawyer in Turin before turning to physics. In 1811 he proposed that equal volumes of gases at the same temperature and pressure contain equal numbers of particles. Almost nobody noticed: he worked far from the main scientific centres and did not clearly distinguish atoms from molecules. Ampère, who had a similar idea, even misspelled his name. Fifty years later, at a conference in Karlsruhe in 1860, his fellow Italian Stanislao Cannizzaro handed out a pamphlet championing the idea, and it finally caught on. Avogadro himself never knew the value of the constant named after him.","q":"Why does Avogadro's hypothesis help work out chemical formulas?"},{"id":"mat-026","t":"Robert Boyle's wish list","s":"Chemistry","tp":"Particles","sub":"Boyle's law","lv":["KS3","GCSE","A-Level"],"who":"Robert Boyle, Robert Hooke","f":0,"loc":"Ireland / UK","rg":["Europe"],"yr":1662,"era":"1500–1699","tag":"Eccentric","x":"Robert Boyle, the fourteenth child of the richest man in Ireland, did experiments with air pressure using a J-shaped tube taller than a person, filled with mercury, which he had to use in a stairwell. In 1662 he published that the volume of a gas halves when the pressure doubles. He also believed in alchemy, and wrote a list of hopes for future science that included prolonging life, flying, staying long underwater, 'the recovery of youth', growing to giant size and making armour light and very hard – many have come true.","q":"Which of Boyle's wishes have come true, and how?"},{"id":"mat-027","t":"Whose law is Boyle's law?","s":"Chemistry","tp":"Particles","sub":"Gas laws","lv":["GCSE","A-Level"],"who":"Richard Towneley, Henry Power, Edme Mariotte, Jacques Charles, Joseph Gay-Lussac","f":0,"loc":"UK / France","rg":["Europe"],"yr":1802,"era":"1800s","tag":"Rivalry","x":"Boyle's law was helped along by Richard Towneley and Henry Power, two Lancashire experimenters, and Robert Hooke built the air pump. In France it is called Mariotte's law, after Edme Mariotte, who found it independently 14 years later. Charles's law is similar: Jacques Charles found that gases expand evenly when heated but never published it. Joseph Gay-Lussac did publish in 1802, generously crediting Charles – so Charles got the name.","q":"Should a law be named after the first person to discover it or the first to publish?"},{"id":"mat-028","t":"Balloons, pitchforks and the gas laws","s":"Chemistry","tp":"Particles","sub":"Gas laws","lv":["KS3","GCSE"],"who":"Jacques Charles, Joseph Gay-Lussac, Jean-Baptiste Biot","f":0,"loc":"France","rg":["Europe"],"yr":1783,"era":"1700s","tag":"Eccentric","x":"In August 1783 Jacques Charles launched the first hydrogen balloon from Paris. It landed in a village, where terrified locals attacked it with pitchforks. In December he flew in one himself. In 1804 Joseph Gay-Lussac and Jean-Baptiste Biot rose in a balloon to measure the atmosphere, and Gay-Lussac alone later climbed to about 7 km, collecting air samples. Gay-Lussac also co-discovered boron and introduced the words 'pipette' and 'burette'.","q":"Why does a balloon expand as it rises?"},{"id":"mat-029","t":"Deflategate and the gas laws","s":"Physics","tp":"Matter","sub":"Gas laws","lv":["GCSE","A-Level"],"who":"","f":0,"loc":"USA","rg":["North & Central America"],"yr":2015,"era":"2000 onwards","tag":"Everyday","x":"In a 2015 American football play-off, the New England Patriots' footballs were found to be below the legal pressure, and the team was accused of deliberately letting air out. Physicists pointed out that balls inflated in a warm room and taken onto a cold, wet field will lose pressure naturally, as the gas laws predict. The official investigation concluded there had been tampering anyway, and the star quarterback was suspended; the debate made the pressure law famous.","q":"Calculate the pressure drop when a ball cools from 22 °C to 10 °C."},{"id":"mat-030","t":"Are cats liquids?","s":"Physics","tp":"Matter","sub":"States of matter","lv":["KS3","GCSE"],"who":"Marc-Antoine Fardin","f":0,"loc":"France","rg":["Europe"],"yr":2014,"era":"2000 onwards","tag":"Eccentric","x":"Prompted by photos of cats squeezed into bowls, jars and boxes, the French physicist Marc-Antoine Fardin wrote a serious paper on whether cats are liquids. In rheology, the science of flow, whether something behaves as a solid or a liquid depends on the timescale: on short timescales a cat behaves as a solid, but given time it flows to fill its container. His suggested method was simple: bring an empty box and wait. The work won an Ig Nobel prize in 2017.","q":"Is something a solid or liquid? Does it depend how long you look?"},{"id":"mat-031","t":"The Armstrong limit and the man who tasted vacuum","s":"Biology","tp":"Body systems","sub":"Pressure","lv":["GCSE","A-Level"],"who":"Harry Armstrong, Jim LeBlanc","f":0,"loc":"USA","rg":["North & Central America"],"yr":1966,"era":"1950–1999","tag":"Accident","x":"Above about 18–19 km, air pressure is so low that water boils at body temperature – the Armstrong limit, named after the US Air Force doctor Harry Armstrong. Unprotected, a person's saliva and tears would boil away. In 1966 NASA engineer Jim LeBlanc was testing a spacesuit in a vacuum chamber when a hose came loose. His suit pressure dropped to almost nothing in seconds. His last memory before passing out was the saliva on his tongue starting to bubble. Colleagues repressurised the chamber and he recovered fully.","q":"Why does water boil at a lower temperature when pressure is lower?"},{"id":"mat-032","t":"Moshers behave like gas molecules","s":"Physics","tp":"Matter","sub":"Kinetic theory","lv":["GCSE","A-Level"],"who":"Jesse Silverberg","f":0,"loc":"USA","rg":["North & Central America"],"yr":2013,"era":"2000 onwards","tag":"Modern research","x":"Physicists at Cornell University watched videos of heavy metal concerts and found that people in a mosh pit move like molecules in a gas: their speeds follow the same statistical distribution described by Maxwell and Boltzmann. Sometimes a 'circle pit' forms, with everyone running round together like a vortex. Their computer simulation of 'MASHers' (mobile active simulated humanoids) reproduced both states and may help make crowds safer.","q":"What do particles in a gas and people in a mosh pit have in common?"},{"id":"mat-033","t":"Boltzmann buys a cow","s":"Physics","tp":"Matter","sub":"Kinetic theory","lv":["GCSE","A-Level"],"who":"Ludwig Boltzmann, Lise Meitner","f":0,"loc":"Austria / USA","rg":["North & Central America","Europe"],"yr":1890,"era":"1800s","tag":"Eccentric","x":"Ludwig Boltzmann showed how the behaviour of gases comes from the statistics of countless moving particles. Lise Meitner, his student, said his lectures made her feel she was entering a wonderful new world. He could also be impractical: deciding his children needed fresh milk, he bought a cow at market, then asked a zoology professor how to milk it. Visiting California, he complained about American food and smuggled in wine. His ideas about atoms were attacked by many colleagues, which deeply distressed him.","q":"Why does a gas exert pressure on its container?"},{"id":"mat-034","t":"The shower curtain mystery","s":"Physics","tp":"Matter","sub":"Pressure","lv":["KS3","GCSE"],"who":"David Schmidt","f":0,"loc":"USA","rg":["North & Central America"],"yr":2001,"era":"2000 onwards","tag":"Everyday","x":"Why does a shower curtain billow inwards and cling to your legs? Many explanations were suggested: hot air rising, or the Bernoulli effect from fast-moving water. In 2001, David Schmidt at the University of Massachusetts used a computer simulation and found the falling spray drives a sideways vortex – a little whirlwind – with low pressure at its centre, pulling the curtain in. He won an Ig Nobel prize for the work.","q":"Design an experiment to test whether temperature causes the effect."},{"id":"uni-001","t":"The Mars Climate Orbiter's unit mix-up","s":"Physics","tp":"Measurement","sub":"Units","lv":["KS3","GCSE"],"who":"","f":0,"loc":"USA","rg":["North & Central America"],"yr":1999,"era":"1950–1999","tag":"Blunder","x":"In September 1999 NASA's Mars Climate Orbiter, a mission costing over $300 million, vanished as it arrived at Mars. Investigators found that software on the ground calculated thruster impulses in pound-force seconds, while the spacecraft's software expected newton seconds. One pound-force is about 4.45 newtons, so every correction was out by that factor. The orbiter flew far too low into the Martian atmosphere and was destroyed or skipped off into space.","q":"Why do scientists around the world agree to use SI units?"},{"id":"uni-002","t":"Two toolkits on the Space Station","s":"Physics","tp":"Measurement","sub":"Units","lv":["KS3"],"who":"","f":0,"loc":"International Space Station","rg":["Space"],"yr":1998,"era":"1950–1999","tag":"Everyday","x":"The International Space Station was built by many countries. American modules were designed using inches and pounds, while the Russian, European and Japanese parts use metric units. So astronauts carry two sets of tools – imperial and metric – and need to know which module they are working in before picking up a spanner.","q":"What problems might arise if different countries used different units?"},{"id":"uni-003","t":"The mistaken metre","s":"Physics","tp":"Measurement","sub":"SI units","lv":["KS3","GCSE","A-Level"],"who":"Pierre Méchain, Jean-Baptiste Delambre","f":0,"loc":"France / Spain","rg":["Europe"],"yr":1799,"era":"1700s","tag":"Blunder","x":"Before the French Revolution, France used perhaps a quarter of a million different weights and measures. In 1791 the new government defined the metre as one ten-millionth of the distance from the North Pole to the equator. The astronomers Pierre Méchain and Jean-Baptiste Delambre spent seven years measuring the meridian from Dunkirk to Barcelona by triangulation, being arrested as spies along the way. Méchain found a small inconsistency in his own data, kept it secret and was tormented by it until his death. The final metre is about 0.2 mm shorter than intended – but it was kept, because consistency matters more than the original definition. Since 1983 the metre has been defined using the speed of light.","q":"Why is a definition based on the speed of light better than one based on the Earth?"},{"id":"uni-004","t":"Lost pounds and ivory forks","s":"Physics","tp":"Measurement","sub":"Mass","lv":["KS3","GCSE"],"who":"James Watt","f":0,"loc":"UK","rg":["Europe"],"yr":1834,"era":"1800s","tag":"Everyday","x":"England had standard weights from before the Norman Conquest, and Magna Carta demanded standard measures for wine, ale and corn. James Watt complained about having to convert German measurements. In 1834 Britain's standard weights were destroyed when the Houses of Parliament burned down. New platinum standards were made, kept in a temperature-controlled vault and handled with an ivory fork. Until 2019 the world's kilogram was defined by a metal cylinder in a vault near Paris; it is now defined using Planck's constant.","q":"Why was it a problem to define the kilogram using one physical object?"},{"id":"uni-005","t":"From quecto to quetta","s":"Physics","tp":"Measurement","sub":"Prefixes","lv":["KS3","GCSE"],"who":"Austin Sendek","f":0,"loc":"USA / France","rg":["North & Central America","Europe"],"yr":2022,"era":"2000 onwards","tag":"Everyday","x":"SI prefixes go from tiny to huge: milli, micro, nano, pico… and kilo, mega, giga, tera. Teachers enjoy joke units: a 'microscope' is 10⁻⁶ scopes, a 'megaphone' 10⁶ phones. In 2010, the student Austin Sendek campaigned to make 'hella' the prefix for 10²⁷. It didn't win, but in 2022 the official international body did add new prefixes for very large and small amounts, as data storage was approaching the old limits: ronna (10²⁷) and quetta (10³⁰), ronto (10⁻²⁷) and quecto (10⁻³⁰).","q":"Invent a joke unit using a prefix. What does it mean?"},{"id":"uni-006","t":"The banana equivalent dose","s":"Physics","tp":"Atoms and radioactivity","sub":"Radiation dose","lv":["KS3","GCSE"],"who":"","f":0,"loc":"","rg":["Worldwide"],"yr":1995,"era":"1950–1999","tag":"Everyday","x":"Bananas contain potassium, a small fraction of which is radioactive potassium-40. Eating one gives a dose of about 0.1 microsievert, so some scientists use the 'banana equivalent dose' to make radiation figures understandable. A dental X-ray is around 50 bananas, a flight from London to New York a few hundred, and a year of natural background radiation in the UK about 27,000. The body keeps its potassium level steady, so in fact eating bananas does not build up a dose.","q":"Why is it helpful to compare radiation doses with familiar things?"},{"id":"uni-007","t":"Barns, shakes and crabs","s":"Physics","tp":"Measurement","sub":"Unusual units","lv":["GCSE","A-Level"],"who":"Marshall Holloway, Charles Baker","f":0,"loc":"USA","rg":["North & Central America"],"yr":1942,"era":"1900–1949","tag":"Eccentric","x":"During wartime nuclear research in 1942, Marshall Holloway and Charles Baker needed a unit for the effective target area of a nucleus. Uranium nuclei were such easy targets that they were 'as big as a barn', so they called 10⁻²⁸ m² a barn – the name also disguised what they were working on. Nuclear scientists also used the 'shake', 10 nanoseconds (from 'two shakes of a lamb's tail'), roughly the time between steps in a chain reaction. X-ray astronomers measure sources in 'crabs', comparing them with the Crab Nebula.","q":"Why do scientists invent new units?"},{"id":"uni-008","t":"Decimal time in revolutionary France","s":"Physics","tp":"Measurement","sub":"Time","lv":["KS3"],"who":"Pierre-Simon Laplace","f":0,"loc":"France","rg":["Europe"],"yr":1793,"era":"1700s","tag":"Eccentric","x":"In 1793, revolutionary France introduced decimal time: ten hours in a day, 100 minutes in an hour, 100 seconds in a minute. A decimal hour was 2.4 ordinary hours. Clockmakers built dual-faced clocks, and the mathematician Pierre-Simon Laplace had his watch converted. But people found it confusing, and it was abandoned after about two years. The metric system for length and mass survived; decimal time did not.","q":"Why do you think decimal time failed when the metre succeeded?"},{"id":"uni-009","t":"The Garn and other joke units","s":"Physics","tp":"Measurement","sub":"Unusual units","lv":["KS3","GCSE"],"who":"Jake Garn, Paul Dirac","f":0,"loc":"USA / UK","rg":["North & Central America","Europe"],"yr":1985,"era":"1950–1999","tag":"Eccentric","x":"US Senator Jake Garn flew on the Space Shuttle in 1985 and was so badly space-sick that NASA staff jokingly named a unit after him: one Garn is the most space-sick it is possible to be. Paul Dirac was famously quiet, so his Cambridge colleagues defined a 'Dirac' as one word per hour. A story says that a rival of Robert Millikan suggested a unit of conceit, the 'kan' – so large that everyday conceit would be measured in millikans.","q":"Invent a unit to measure something in your school."},{"id":"uni-010","t":"Gamow's cosmic units","s":"Physics","tp":"Space","sub":"Units","lv":["GCSE","A-Level"],"who":"George Gamow","f":0,"loc":"USA","rg":["North & Central America"],"yr":1968,"era":"1950–1999","tag":"Eccentric","x":"Shortly before he died in 1968, the cosmologist George Gamow suggested new units suited to the vast scales of the universe: the 'inferno' for a billion kelvin, the 'eon' for a billion years, and the 'Hubble' for a billion light-years. Astronomers do use similar shorthand: the light-year, the parsec and the astronomical unit.","q":"Why are ordinary units awkward for astronomy?"},{"id":"uni-011","t":"The micromort","s":"Biology","tp":"Health","sub":"Risk","lv":["KS3","GCSE"],"who":"Ronald Howard","f":0,"loc":"USA","rg":["North & Central America"],"yr":1970,"era":"1950–1999","tag":"Everyday","x":"The American decision scientist Ronald Howard proposed the micromort: a one-in-a-million chance of death. It lets people compare everyday risks. Travelling a few hundred miles by car, or a few miles on foot, carries roughly one micromort, and a hang-gliding flight several. Comparing risks this way helps people make decisions without either panicking or being careless.","q":"Why might people overestimate some risks and underestimate others?"},{"id":"uni-012","t":"The Smoot","s":"Physics","tp":"Measurement","sub":"Units","lv":["KS3"],"who":"Oliver Smoot","f":0,"loc":"USA","rg":["North & Central America"],"yr":1958,"era":"1950–1999","tag":"Eccentric","x":"In 1958, as part of a student prank, MIT fraternity members measured the Harvard Bridge in Boston using their shortest member, Oliver Smoot, who was 170 cm tall. They laid him down repeatedly and marked each length in paint: the bridge was 364.4 Smoots, plus or minus one ear. The marks are still repainted today. Smoot later became chairman of the American National Standards Institute and president of the International Organization for Standardization.","q":"Measure your classroom in a 'body unit'. How reliable is it?"},{"id":"uni-013","t":"Morgens and Manhattan","s":"Physics","tp":"Measurement","sub":"Units","lv":["KS3"],"who":"Peter Minuit","f":0,"loc":"Netherlands / USA","rg":["North & Central America","Europe"],"yr":1626,"era":"1500–1699","tag":"Everyday","x":"Many old units came from everyday life. A 'morgen', used in Germany and the Netherlands, was roughly the area a farmer could plough in a morning – and so varied from place to place. When the Dutch colonists acquired Manhattan from the Lenape people in 1626, its area was recorded in morgens. A furlong was the length of a furrow, and a foot was a foot.","q":"Why are units based on human activity unreliable?"},{"id":"chem-001","t":"Tapputi: the first named chemist","s":"Chemistry","tp":"Chemical analysis","sub":"Distillation","lv":["KS3","GCSE"],"who":"Tapputi-Belatekallim","f":1,"loc":"Mesopotamia (Iraq)","rg":["Middle East"],"yr":-1200,"era":"Ancient","tag":"Hidden figure","x":"The earliest chemist whose name we know was a woman. A clay tablet from about 1200 BCE, found in Assyria, describes Tapputi-Belatekallim, an overseer of perfume-making at the royal palace. She mixed flowers, oils, myrrh and balsam with water and other solvents, then distilled and filtered the mixture several times. The tablet also mentions a fellow perfumer whose name is only partly preserved. Techniques like hers – extraction, distillation, filtration – are still standard in chemistry labs.","q":"How does distillation separate the parts of a mixture?"},{"id":"chem-002","t":"Maria the Jewess and the bain-marie","s":"Chemistry","tp":"Chemical analysis","sub":"Apparatus","lv":["KS3","GCSE"],"who":"Maria the Jewess","f":1,"loc":"Egypt (Alexandria)","rg":["Africa"],"yr":250,"era":"Ancient","tag":"Hidden figure","x":"Maria the Jewess worked in Alexandria, probably in the first few centuries CE, and is known through later alchemical writings. She is credited with inventing apparatus including the tribikos, a three-armed still, and a gentle water-bath heater. Cooks still call a pan of food sitting in hot water a 'bain-marie' – Mary's bath – after her. Water baths are used in labs because they heat things evenly and never go above 100 °C.","q":"Why is a water bath safer than a flame for heating some substances?"},{"id":"chem-003","t":"Jabir and al-Razi: chemistry in Baghdad","s":"Chemistry","tp":"Chemical analysis","sub":"Distillation","lv":["KS3","GCSE"],"who":"Jabir ibn Hayyan, Abu Bakr al-Razi","f":0,"loc":"Iraq / Iran","rg":["Middle East"],"yr":900,"era":"Medieval","tag":"Discovery","x":"During the Islamic Golden Age, scholars in Baghdad and Persia turned alchemy into careful laboratory work. Writings attributed to Jabir ibn Hayyan describe crystallisation, distillation and the making of acids. The physician Abu Bakr al-Razi, around 900, classified substances into groups such as minerals, plants and animal products, described dozens of pieces of apparatus, and distilled petroleum. Words like 'alkali', 'alcohol' and 'alembic' come to us from Arabic.","q":"Which everyday chemistry words come from Arabic?"},{"id":"chem-004","t":"Gunpowder: an accident in search of immortality","s":"Chemistry","tp":"Chemical reactions","sub":"Combustion","lv":["KS3","GCSE"],"who":"","f":0,"loc":"China","rg":["East Asia"],"yr":850,"era":"Medieval","tag":"Accident","x":"Chinese alchemists in the Tang dynasty were searching for an elixir of eternal life. Around the 9th century, they found that mixing saltpetre (potassium nitrate), sulphur and charcoal produced a mixture that burned violently – one text warns that it singed beards and burned down houses. Gunpowder burns so fast because saltpetre supplies its own oxygen. It was soon used for fireworks, signals and weapons, and reached Europe centuries later.","q":"Why does a substance that contains oxygen burn faster than one that relies on air?"},{"id":"chem-005","t":"Kanada and the idea of atoms in ancient India","s":"Chemistry","tp":"Atomic structure","sub":"History of the atom","lv":["KS3","GCSE"],"who":"Kanada, Democritus","f":0,"loc":"India / Greece","rg":["South Asia","Europe"],"yr":-400,"era":"Ancient","tag":"Discovery","x":"The idea that matter is made of tiny indivisible particles arose more than once. In Greece, Leucippus and Democritus called them 'atomos', meaning uncuttable. In India, the philosopher Kanada, founder of the Vaisheshika school, taught that everything is built from eternal particles called 'paramanu', which combine in pairs and threes to form larger things. Neither had experimental evidence; the modern atomic theory came from John Dalton's chemistry in the 1800s.","q":"What is the difference between an idea and a scientific theory?"},{"id":"chem-006","t":"Hennig Brand boils urine and finds light","s":"Chemistry","tp":"Periodic table","sub":"Discovery of elements","lv":["KS3","GCSE"],"who":"Hennig Brand","f":0,"loc":"Germany","rg":["Europe"],"yr":1669,"era":"1500–1699","tag":"Eccentric","x":"In 1669 the Hamburg merchant and alchemist Hennig Brand hoped to make gold from urine, perhaps because of its golden colour. He collected huge amounts – reportedly around 1,500 litres – left it to rot, then boiled it down and heated the residue strongly. Instead of gold, he got a waxy white substance that glowed green in the dark
