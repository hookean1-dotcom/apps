tures of a skeleton show that an animal walked upright?"},{"id":"bio-033","t":"Homo naledi and the underground astronauts","s":"Biology","tp":"Evolution","sub":"Human evolution","lv":["GCSE","A-Level"],"who":"Lee Berger, Marina Elliott, K. Lindsay Hunter","f":1,"loc":"South Africa","rg":["Africa"],"yr":2013,"era":"2000 onwards","tag":"Discovery","x":"In 2013 cavers found bones deep in the Rising Star cave system in South Africa, reached through a chute only about 18 cm wide. Lee Berger advertised on social media for slim scientists with caving experience. Six women, including Marina Elliott, squeezed in and recovered over 1,500 fossils. They belonged to a new human species, Homo naledi – meaning 'star' in the Sesotho language – with a small brain but human-like hands and feet, living around 250,000 years ago.","q":"Why was it surprising to find a small-brained species living so recently?"},{"id":"bio-034","t":"Mary Anning, fossil hunter of Lyme Regis","s":"Earth Science","tp":"Fossils","sub":"Palaeontology","lv":["KS3","GCSE"],"who":"Mary Anning, Joseph Anning","f":1,"loc":"UK","rg":["Europe"],"yr":1811,"era":"1800s","tag":"Hidden figure","x":"Mary Anning grew up poor in Lyme Regis, Dorset, selling fossils from the crumbling cliffs to tourists. Around 1811, aged 12, she and her brother Joseph found the first complete ichthyosaur skeleton to be recognised. She later found the first complete plesiosaur and the first pterosaur in Britain. She was an expert at anatomy but, as a working-class woman, was excluded from the Geological Society and often not credited by the men who bought her finds. A statue of her was unveiled in Lyme Regis in 2022.","q":"How did fossils like Anning's change ideas about the history of life?"},{"id":"bio-035","t":"Marjorie Courtenay-Latimer and the living fossil","s":"Biology","tp":"Evolution","sub":"Classification","lv":["KS3","GCSE"],"who":"Marjorie Courtenay-Latimer, J. L. B. Smith","f":1,"loc":"South Africa","rg":["Africa"],"yr":1938,"era":"1900–1949","tag":"Discovery","x":"In December 1938, Marjorie Courtenay-Latimer, curator of a small museum in East London, South Africa, was checking a fishing boat's catch when she spotted a large blue fish with strange, limb-like fins. She took it back by taxi and tried to preserve it. The chemist and fish expert J. L. B. Smith identified it as a coelacanth, a group thought extinct for 66 million years. The fish was named Latimeria in her honour. Coelacanths have since been found living off the Comoros and Indonesia.","q":"What does it mean to call a species a 'living fossil'?"},{"id":"bio-036","t":"The platypus: a hoax?","s":"Biology","tp":"Classification","sub":"Mammals","lv":["KS3"],"who":"George Shaw","f":0,"loc":"Australia / UK","rg":["Oceania","Europe"],"yr":1799,"era":"1700s","tag":"Everyday","x":"When the first platypus specimen reached Britain from Australia in 1799, the zoologist George Shaw suspected it was a fake made by sewing a duck's bill onto a mammal's body – taxidermists in Asia were known for such tricks. He reportedly looked for stitches. The animal was real: a mammal with fur and milk that lays eggs, has a venomous spur and senses the electric fields of prey with its bill. It is a monotreme, an ancient branch of mammals.","q":"Which features make the platypus a mammal?"},{"id":"bio-037","t":"Maria Sibylla Merian's caterpillars","s":"Biology","tp":"Adaptations","sub":"Life cycles","lv":["KS3","GCSE"],"who":"Maria Sibylla Merian","f":1,"loc":"Germany / Netherlands / Suriname","rg":["South America","Europe"],"yr":1705,"era":"1700s","tag":"Hidden figure","x":"In the 1600s many people believed insects arose spontaneously from mud. Maria Sibylla Merian, a German artist, raised caterpillars from the age of 13 and painted every stage of their metamorphosis with the plants they fed on. In 1699, aged 52, she sailed with her daughter to Suriname in South America, a journey almost unheard of for a woman, to study tropical insects. Her 1705 book on the insects of Suriname was a masterpiece of science and art, and she is now seen as a founder of entomology and ecology.","q":"Why does drawing the food plant alongside an insect matter scientifically?"},{"id":"bio-038","t":"The Pfeilstorch: proof of migration","s":"Biology","tp":"Behaviour","sub":"Migration","lv":["KS3","GCSE"],"who":"","f":0,"loc":"Germany / Africa","rg":["Africa","Europe"],"yr":1822,"era":"1800s","tag":"Discovery","x":"Where do birds go in winter? People once believed swallows hibernated in mud at the bottom of ponds, and one 17th-century writer suggested birds flew to the Moon. In 1822, near the village of Klütz in Germany, a white stork was found with an African spear about 80 cm long through its neck. It had flown thousands of kilometres back from Africa despite its injury. Stuffed with the spear still in place, it is kept at the University of Rostock. Around 25 more 'Pfeilstörche' – arrow storks – have since been recorded.","q":"What modern methods do scientists use to track migrating birds?"},{"id":"bio-039","t":"Spallanzani's blindfolded bats","s":"Biology","tp":"Senses","sub":"Echolocation","lv":["KS3","GCSE"],"who":"Lazzaro Spallanzani, Donald Griffin","f":0,"loc":"Italy / USA","rg":["North & Central America","Europe"],"yr":1794,"era":"1700s","tag":"Discovery","x":"In 1794 the Italian priest and biologist Lazzaro Spallanzani found that bats could still avoid wires strung across a dark room when blindfolded – but crashed when their ears were plugged. He concluded they navigated by hearing, but nobody could hear any sound. In 1938, the American student Donald Griffin used an ultrasound detector and showed bats emit calls too high for humans to hear, listening to the echoes: echolocation. Spallanzani also swallowed linen bags of food on strings to study digestion.","q":"How does an echo tell a bat how far away an object is?"},{"id":"bio-040","t":"Karl von Frisch decodes the waggle dance","s":"Biology","tp":"Behaviour","sub":"Communication","lv":["KS3","GCSE"],"who":"Karl von Frisch","f":0,"loc":"Austria / Germany","rg":["Europe"],"yr":1945,"era":"1900–1949","tag":"Discovery","x":"How do honeybees tell each other where to find food? The Austrian biologist Karl von Frisch marked bees with paint and placed sugar water at different distances. He found that a returning bee performs a 'waggle dance' on the honeycomb: the angle of the waggle run relative to vertical shows the direction of the food relative to the Sun, and its length shows the distance. Many doubted bees could be so sophisticated, but he was proved right and shared the 1973 Nobel Prize.","q":"Why is the Sun used as a reference direction in the dance?"},{"id":"bio-041","t":"Jane Goodall and David Greybeard","s":"Biology","tp":"Behaviour","sub":"Primates","lv":["KS3","GCSE"],"who":"Jane Goodall, Louis Leakey","f":1,"loc":"Tanzania / UK","rg":["Africa","Europe"],"yr":1960,"era":"1950–1999","tag":"Discovery","x":"In 1960 Jane Goodall, a 26-year-old Londoner with no degree, began studying chimpanzees at Gombe in Tanzania, encouraged by the palaeontologist Louis Leakey. Within months she saw a chimp she called David Greybeard strip leaves from a twig and use it to fish termites from a mound – making and using a tool. Until then, toolmaking was thought to define humans. Leakey replied that we must now redefine 'tool', redefine 'man', or accept chimpanzees as humans. Goodall's study lasted over 60 years.","q":"Why was naming the chimps, rather than numbering them, controversial?"},{"id":"bio-042","t":"Wolves change rivers in Yellowstone","s":"Biology","tp":"Ecology","sub":"Food webs","lv":["KS3","GCSE","A-Level"],"who":"","f":0,"loc":"USA","rg":["North & Central America"],"yr":1995,"era":"1950–1999","tag":"Modern research","x":"Wolves were wiped out of Yellowstone National Park by the 1920s. Elk numbers then grew, and they grazed young willows and aspens along rivers heavily. In 1995 and 1996, 31 wolves from Canada were released there. The wolves hunted elk and changed where they grazed, and in some areas trees and beavers returned. This is called a trophic cascade. Scientists still debate how big the effect has been, as drought, bears and human hunting also play a part.","q":"Draw a food web showing how wolves might affect willow trees."},{"id":"bio-043","t":"Rachel Carson's Silent Spring","s":"Biology","tp":"Ecology","sub":"Pollution","lv":["KS3","GCSE"],"who":"Rachel Carson","f":1,"loc":"USA","rg":["North & Central America"],"yr":1962,"era":"1950–1999","tag":"Hidden figure","x":"Rachel Carson, a marine biologist and writer, published 'Silent Spring' in 1962. She showed how the pesticide DDT built up along food chains, accumulating to high concentrations in predatory birds and thinning their eggshells, and imagined a spring with no birdsong. Chemical companies attacked her viciously, but her careful evidence persuaded the public and US President Kennedy's scientific advisers. DDT was banned for farm use in the USA in 1972, and bald eagles and peregrine falcons recovered. Carson died of cancer in 1964.","q":"Why do top predators end up with the highest pesticide levels?"},{"id":"bio-044","t":"Wangari Maathai plants 30 million trees","s":"Biology","tp":"Ecology","sub":"Conservation","lv":["KS3","GCSE"],"who":"Wangari Maathai","f":1,"loc":"Kenya","rg":["Africa"],"yr":1977,"era":"1950–1999","tag":"Hidden figure","x":"Wangari Maathai was the first woman in East and Central Africa to earn a doctorate, in veterinary anatomy. She saw that deforestation in Kenya was drying up streams and making it harder for rural women to find firewood and food. In 1977 she founded the Green Belt Movement, paying women to grow seedlings and plant trees; tens of millions have been planted. She was beaten and arrested for opposing land-grabbing, but in 2004 became the first African woman to win the Nobel Peace Prize.","q":"How do trees help protect soil and water supplies?"},{"id":"bio-045","t":"Janaki Ammal: sweetening India's sugarcane","s":"Biology","tp":"Genetics","sub":"Selective breeding","lv":["GCSE","A-Level"],"who":"E. K. Janaki Ammal","f":1,"loc":"India / UK / USA","rg":["South Asia","North & Central America","Europe"],"yr":1934,"era":"1900–1949","tag":"Hidden figure","x":"E. K. Janaki Ammal from Kerala became one of the first Indian women to earn a PhD in botany, in Michigan in 1931. At the Sugarcane Breeding Institute in Coimbatore from 1934, she cross-bred sugarcane varieties to produce sweeter hybrids suited to Indian conditions, helping India reduce its reliance on imported sugar. In 1946 she became the first woman scientist employed by the Royal Horticultural Society at Wisley, where a magnolia she bred is named after her. Back in India, she campaigned to protect the Silent Valley rainforest.","q":"How does selective breeding produce a better crop?"},{"id":"bio-046","t":"Rita Levi-Montalcini's bedroom laboratory","s":"Biology","tp":"Nerves","sub":"Neurons","lv":["GCSE","A-Level"],"who":"Rita Levi-Montalcini, Stanley Cohen","f":1,"loc":"Italy / USA","rg":["North & Central America","Europe"],"yr":1952,"era":"1950–1999","tag":"Hidden figure","x":"In 1938 Fascist Italy banned Jewish people from universities. Rita Levi-Montalcini, a young doctor in Turin, set up a lab in her bedroom, using sewing needles as scalpels and eggs from local farmers to study how nerves grow in chick embryos. When bombing intensified, she moved her lab to the countryside. After the war, in the USA, she discovered nerve growth factor, a protein that makes nerve cells grow. She shared the 1986 Nobel Prize and lived to 103.","q":"Why do growing nerve cells need chemical signals?"},{"id":"bio-047","t":"Gerty Cori and the sugar cycle","s":"Biology","tp":"Body systems","sub":"Respiration","lv":["GCSE","A-Level"],"who":"Gerty Cori, Carl Cori","f":1,"loc":"Czech Republic / USA","rg":["North & Central America","Europe"],"yr":1947,"era":"1900–1949","tag":"Hidden figure","x":"Gerty and Carl Cori met at medical school in Prague and moved to the USA. Universities often refused to employ Gerty, or paid her a fraction of her husband's salary. Together they worked out how the body stores glucose as glycogen and how lactic acid made by working muscles is carried to the liver and turned back into glucose – the Cori cycle. In 1947 Gerty became the first woman to win the Nobel Prize in Physiology or Medicine.","q":"What happens to lactic acid after intense exercise?"},{"id":"bio-048","t":"Van Helmont's willow tree","s":"Biology","tp":"Plants","sub":"Photosynthesis","lv":["KS3","GCSE"],"who":"Jan Baptist van Helmont","f":0,"loc":"Belgium","rg":["Europe"],"yr":1648,"era":"1500–1699","tag":"Discovery","x":"Where does a tree's mass come from? In the 1600s the Flemish chemist Jan Baptist van Helmont planted a 2.3 kg willow in 90 kg of dried soil and added only rainwater for five years. The tree grew to about 77 kg, but the soil lost only around 60 g. He concluded the tree was made from water. He was partly right – but he missed that most of the mass comes from carbon dioxide in the air. Van Helmont also coined the word 'gas'.","q":"What did van Helmont miss, and how could he have tested it?"},{"id":"bio-049","t":"Ingenhousz: plants need light","s":"Biology","tp":"Plants","sub":"Photosynthesis","lv":["KS3","GCSE"],"who":"Jan Ingenhousz, Joseph Priestley","f":0,"loc":"Netherlands / UK","rg":["Europe"],"yr":1779,"era":"1700s","tag":"Discovery","x":"Priestley showed that plants 'restore' air. In 1779 the Dutch physician Jan Ingenhousz, working in England, did hundreds of experiments in a single summer. He showed that green parts of plants give off oxygen bubbles underwater only in sunlight; in the dark, plants, like animals, give off carbon dioxide. He had discovered the role of light in photosynthesis. Ingenhousz was also a pioneer of smallpox inoculation, and observed the jiggling of coal dust in alcohol, an early sighting of Brownian motion.","q":"How could you measure the rate of photosynthesis using pondweed?"},{"id":"bio-050","t":"Calvin's lollipop","s":"Biology","tp":"Plants","sub":"Photosynthesis","lv":["A-Level"],"who":"Melvin Calvin, Andrew Benson, James Bassham","f":0,"loc":"USA","rg":["North & Central America"],"yr":1950,"era":"1950–1999","tag":"Discovery","x":"How does a plant turn carbon dioxide into sugar? After the Second World War, radioactive carbon-14 became available. Melvin Calvin's team at Berkeley fed it to green algae in a flat glass vessel nicknamed the 'lollipop', then plunged the algae into boiling alcohol after a few seconds to stop reactions. Using chromatography, they tracked which compounds the radioactive carbon reached first, mapping the cycle of reactions now called the Calvin cycle. Calvin won the 1961 Nobel Prize.","q":"Why does using a radioactive tracer help follow a chemical pathway?"},{"id":"bio-051","t":"Penny Chisholm finds the most common photosynthesiser","s":"Biology","tp":"Plants","sub":"Photosynthesis","lv":["GCSE","A-Level"],"who":"Sallie (Penny) Chisholm, Robert Olson","f":1,"loc":"USA","rg":["North & Central America"],"yr":1988,"era":"1950–1999","tag":"Discovery","x":"In 1988, Penny Chisholm and colleagues at MIT used a new instrument to sort tiny particles in seawater and found a bacterium so small it had been overlooked: Prochlorococcus. It turned out to be the most abundant photosynthetic organism on Earth – there are around 10²⁷ of them – producing a significant share of the oxygen we breathe. Every other breath you take may come from ocean microbes.","q":"Why can tiny ocean microbes produce so much oxygen?"},{"id":"bio-052","t":"William Harvey and Ibn al-Nafis: the circulating blood","s":"Biology","tp":"Body systems","sub":"Circulation","lv":["KS3","GCSE"],"who":"William Harvey, Ibn al-Nafis, Galen","f":0,"loc":"UK / Syria / Egypt","rg":["Africa","Middle East","Europe"],"yr":1628,"era":"1500–1699","tag":"Discovery","x":"For 1,400 years doctors followed the Roman physician Galen, who taught that blood was constantly made in the liver and that it seeped through pores in the heart's central wall. In the 13th century, Ibn al-Nafis, a physician in Damascus and Cairo, wrote that the wall had no pores and blood must pass from the right side of the heart through the lungs to the left. In 1628 the English doctor William Harvey calculated that the heart pumps far more blood in an hour than the body could possibly make, so it must circulate. He showed the valves in veins only let blood flow towards the heart.","q":"How did Harvey's calculation show that blood must circulate?"},{"id":"bio-053","t":"Vivien Thomas and the blue babies","s":"Biology","tp":"Body systems","sub":"Heart","lv":["GCSE","A-Level"],"who":"Vivien Thomas, Alfred Blalock, Helen Taussig","f":1,"loc":"USA","rg":["North & Central America"],"yr":1944,"era":"1900–1949","tag":"Hidden figure","x":"Some babies are born with heart defects that stop enough blood reaching the lungs, so they turn blue. The cardiologist Helen Taussig, who was partly deaf and diagnosed heart sounds partly by touch, suggested an operation to fix it. Vivien Thomas, an African American lab technician with no college degree, developed the procedure on animals. In 1944, at Johns Hopkins, the surgeon Alfred Blalock performed the first operation on a baby girl with Thomas standing behind him on a stool, guiding each step. For years Thomas was paid as a janitor; in 1976 he received an honorary doctorate.","q":"Why would a lack of oxygenated blood turn skin blue?"},{"id":"bio-054","t":"Willem Kolff's sausage-skin kidney","s":"Biology","tp":"Body systems","sub":"Kidneys","lv":["GCSE"],"who":"Willem Kolff","f":0,"loc":"Netherlands / USA","rg":["North & Central America","Europe"],"yr":1945,"era":"1900–1949","tag":"Invention","x":"In the Nazi-occupied Netherlands, the young doctor Willem Kolff watched patients die of kidney failure. In a small hospital in Kampen, while also helping the resistance hide people, he built an artificial kidney from what he could find: cellophane sausage casing wrapped around a drum turning in a bath of salt solution, orange juice cans and parts of a washing machine. Waste in the blood diffused through the cellophane. His first 15 patients died, but in 1945 a 67-year-old woman recovered. After the war he gave his machines away and helped develop the artificial heart.","q":"Why can urea pass through the membrane but blood cells cannot?"},{"id":"bio-055","t":"Barry Marshall drinks bacteria","s":"Biology","tp":"Disease and immunity","sub":"Bacteria","lv":["GCSE","A-Level"],"who":"Barry Marshall, Robin Warren","f":0,"loc":"Australia","rg":["Oceania"],"yr":1984,"era":"1950–1999","tag":"Eccentric","x":"Doctors believed stomach ulcers were caused by stress and acid, as no bacteria could survive in the stomach. In Perth, the pathologist Robin Warren saw curved bacteria in ulcer samples, and the young doctor Barry Marshall grew them – helped when a lab culture was accidentally left over an Easter holiday. In 1984, unable to infect animals, Marshall drank a culture of Helicobacter pylori himself. Within days he was sick with stomach inflammation, which antibiotics cured. Ulcers became treatable with antibiotics, and they won the 2005 Nobel Prize.","q":"Was Marshall's self-experiment good science? Why?"},{"id":"bio-056","t":"James Lind's scurvy trial","s":"Biology","tp":"Nutrition","sub":"Vitamins","lv":["KS3","GCSE"],"who":"James Lind","f":0,"loc":"UK","rg":["Europe"],"yr":1747,"era":"1700s","tag":"Discovery","x":"Scurvy killed more sailors than battle. In 1747, aboard HMS Salisbury, the Scottish naval surgeon James Lind chose 12 sailors with scurvy, gave them the same diet, and divided them into six pairs, each given a different remedy: cider, vinegar, seawater, a spicy paste, dilute acid, or two oranges and a lemon. The pair given citrus recovered so quickly that one was fit for duty within a week. It is often called the first controlled clinical trial. We now know scurvy is caused by a lack of vitamin C.","q":"What made Lind's trial a fair test?"},{"id":"bio-057","t":"Eijkman's chickens and the discovery of vitamins","s":"Biology","tp":"Nutrition","sub":"Vitamins","lv":["GCSE","A-Level"],"who":"Christiaan Eijkman, Casimir Funk, Albert Szent-Györgyi","f":0,"loc":"Indonesia / Netherlands / Poland / Hungary","rg":["Southeast Asia","Europe"],"yr":1897,"era":"1800s","tag":"Accident","x":"In the 1890s in Java, the Dutch doctor Christiaan Eijkman was investigating beriberi, a nerve disease. His lab chickens developed similar symptoms, then mysteriously recovered. He discovered a new cook had stopped feeding them polished white rice from the hospital and switched to cheaper brown rice. Something in rice husks prevented disease. In 1912 the Polish biochemist Casimir Funk coined the term 'vitamine'. In 1932 the Hungarian Albert Szent-Györgyi isolated vitamin C, using paprika peppers from his home town of Szeged.","q":"How did a change of cook become a scientific breakthrough?"},{"id":"bio-058","t":"Werner Forssmann's catheter","s":"Biology","tp":"Body systems","sub":"Heart","lv":["GCSE"],"who":"Werner Forssmann, Gerda Ditzen","f":1,"loc":"Germany","rg":["Europe"],"yr":1929,"era":"1900–1949","tag":"Eccentric","x":"In 1929 Werner Forssmann, a 25-year-old trainee surgeon near Berlin, wanted to know if a thin tube could be passed through a vein into the heart. His boss refused permission. Forssmann persuaded nurse Gerda Ditzen to give him the supplies, then numbed his own arm and pushed a catheter about 65 cm up a vein. He walked to the X-ray department and took a picture showing the tube in his heart. He was disciplined, but his technique, cardiac catheterisation, is now used routinely. He shared the 1956 Nobel Prize.","q":"Why do scientists today need ethical approval for experiments on people?"},{"id":"bio-059","t":"Fingerprints: from Japan to Scotland Yard","s":"Biology","tp":"Genetics","sub":"Variation","lv":["KS3","GCSE"],"who":"Henry Faulds, Juan Vucetich, Azizul Haque, Hem Chandra Bose","f":0,"loc":"Japan / Scotland / Argentina / India","rg":["South Asia","East Asia","South America","Europe"],"yr":1880,"era":"1800s","tag":"Hidden figure","x":"While working as a missionary doctor in Tokyo, the Scottish physician Henry Faulds noticed fingerprints on ancient pottery and in 1880 proposed using them to identify criminals. In Argentina in 1892, Juan Vucetich used a bloody fingerprint to solve a murder – the first such case. The classification system used by Scotland Yard was largely worked out in British India by two Indian police officers, Azizul Haque and Hem Chandra Bose, though it carries the name of their boss, Edward Henry.","q":"Why are fingerprints unique, even for identical twins?"},{"id":"bio-060","t":"Alec Jeffreys and DNA fingerprinting","s":"Biology","tp":"Genetics","sub":"DNA profiling","lv":["GCSE","A-Level"],"who":"Alec Jeffreys","f":0,"loc":"UK","rg":["Europe"],"yr":1984,"era":"1950–1999","tag":"Discovery","x":"At 9.05 am on Monday 10 September 1984, in his lab at the University of Leicester, Alec Jeffreys looked at an X-ray film showing DNA from his technician's family and saw a unique pattern of bands – a genetic fingerprint. Within months it was used to settle an immigration dispute, reuniting a boy with his mother in the UK. In 1986–87 it was used in a murder investigation, clearing an innocent suspect and identifying the real culprit – the first criminal case solved using DNA. Jeffreys was knighted.","q":"Why does DNA profiling compare repeated sequences rather than whole genes?"},{"id":"bio-061","t":"Dolly the sheep","s":"Biology","tp":"Genetics","sub":"Cloning","lv":["KS3","GCSE"],"who":"Ian Wilmut, Keith Campbell","f":0,"loc":"UK","rg":["Europe"],"yr":1996,"era":"1950–1999","tag":"Discovery","x":"On 5 July 1996, at the Roslin Institute near Edinburgh, a lamb was born that had been cloned from a single cell of an adult sheep's udder. The team, led by Ian Wilmut and Keith Campbell, put the nucleus from that cell into an egg cell whose own nucleus had been removed. It took 277 attempts. They named her Dolly – a joke referring to the singer Dolly Parton, because the cell came from a mammary gland. Dolly had six lambs of her own and is now displayed at the National Museum of Scotland.","q":"Why is Dolly genetically identical to the sheep that gave the udder cell?"},{"id":"bio-062","t":"Shinya Yamanaka's four genes","s":"Biology","tp":"Cells","sub":"Stem cells","lv":["GCSE","A-Level"],"who":"Shinya Yamanaka, John Gurdon","f":0,"loc":"Japan / UK","rg":["East Asia","Europe"],"yr":2006,"era":"2000 onwards","tag":"Discovery","x":"As a surgeon in Japan, Shinya Yamanaka was so slow at operations that colleagues nicknamed him 'Jamanaka', a pun on a word meaning 'obstacle'. He switched to research. In 2006 he showed that switching on just four genes could turn ordinary adult skin cells back into stem cells able to become any cell type. He shared the 2012 Nobel Prize with John Gurdon, who had cloned frogs in Oxford in 1962 and whose school report once said that his ambition to become a scientist was quite ridiculous.","q":"Why are stem cells made from a patient's own skin useful?"},{"id":"bio-063","t":"Jean Purdy: the forgotten IVF pioneer","s":"Biology","tp":"Body systems","sub":"Reproduction","lv":["GCSE","A-Level"],"who":"Jean Purdy, Robert Edwards, Patrick Steptoe","f":1,"loc":"UK","rg":["Europe"],"yr":1978,"era":"1950–1999","tag":"Hidden figure","x":"Louise Brown, the first baby conceived by in vitro fertilisation, was born at Oldham General Hospital on 25 July 1978. The work was led by Robert Edwards, Patrick Steptoe and the nurse and embryologist Jean Purdy, who ran the lab, organised the records and was the first to see the cells of the embryo that became Louise dividing. When a plaque was put up, Purdy's name was left off, despite Edwards' protests. She died in 1985 aged 39. Edwards received the Nobel Prize in 2010; plaques now honour Purdy.","q":"Why does it matter who is recognised for a discovery?"},{"id":"bio-064","t":"Osamu Shimomura and the glowing jellyfish","s":"Biology","tp":"Adaptations","sub":"Bioluminescence","lv":["GCSE","A-Level"],"who":"Osamu Shimomura","f":0,"loc":"Japan / USA","rg":["East Asia","North & Central America"],"yr":1962,"era":"1950–1999","tag":"Discovery","x":"As a 16-year-old in 1945, Osamu Shimomura saw the flash of the atomic bomb over Nagasaki from about 15 km away. Later, as a chemist in the USA, he spent summers collecting jellyfish at Friday Harbor, Washington – around 850,000 over the years – to discover why they glow. In 1962 he isolated a protein that glows green under blue light: green fluorescent protein, GFP. Attached to other proteins, GFP lets scientists watch what happens inside living cells. He shared the 2008 Nobel Prize.","q":"How can a glowing protein help scientists study diseases?"},{"id":"bio-065","t":"The tardigrade: the toughest animal","s":"Biology","tp":"Adaptations","sub":"Extreme survival","lv":["KS3","GCSE"],"who":"Johann August Ephraim Goeze","f":0,"loc":"Germany / Space","rg":["Space","Europe"],"yr":2007,"era":"2000 onwards","tag":"Modern research","x":"Tardigrades, or 'water bears', are animals about half a millimetre long, first described in 1773 by the German pastor Johann Goeze. They live in moss, but when dried out they curl into a 'tun' state and can survive for years. In this state they have survived temperatures near absolute zero, heating above 100 °C and huge pressures. In 2007 the European Space Agency sent tardigrades into orbit outside a spacecraft; some survived the vacuum and radiation of space.","q":"Why might losing water help an organism survive extreme conditions?"},{"id":"bio-066","t":"Kingfisher-nosed bullet train","s":"Biology","tp":"Adaptations","sub":"Biomimicry","lv":["KS3","GCSE"],"who":"Eiji Nakatsu","f":0,"loc":"Japan","rg":["East Asia"],"yr":1997,"era":"1950–1999","tag":"Invention","x":"Japan's early bullet trains made a loud boom when they entered tunnels, as they pushed a wave of compressed air ahead of them. Eiji Nakatsu, an engineer and keen birdwatcher, thought of the kingfisher, which dives from air into water with hardly a splash. The 500 Series Shinkansen, launched in 1997, was given a long kingfisher-shaped nose. It was quieter, and used about 15% less electricity while travelling faster. Its pantographs were modelled on owl feathers to reduce noise.","q":"Why does the shape of the nose reduce the pressure wave?"},{"id":"bio-067","t":"Phineas Gage's iron rod","s":"Biology","tp":"Nerves","sub":"The brain","lv":["GCSE","A-Level"],"who":"Phineas Gage, John Harlow","f":0,"loc":"USA","rg":["North & Central America"],"yr":1848,"era":"1800s","tag":"Accident","x":"In September 1848, railway foreman Phineas Gage was packing explosive into a hole in Vermont with a 1.1-metre iron rod when it ignited. The rod shot through his left cheek and out of the top of his head, landing about 25 m away. Astonishingly, he survived and could speak within minutes. His doctor, John Harlow, reported that his personality changed, though later evidence suggests he partly recovered and worked as a stagecoach driver in Chile. His case helped show that particular brain regions have particular jobs.","q":"What does damage to one brain area tell us about its function?"},{"id":"bio-068","t":"Santiago Ramón y Cajal draws the brain","s":"Biology","tp":"Nerves","sub":"Neurons","lv":["GCSE","A-Level"],"who":"Santiago Ramón y Cajal, Camillo Golgi","f":0,"loc":"Spain / Italy","rg":["Europe"],"yr":1888,"era":"1800s","tag":"Discovery","x":"As a boy in Spain, Santiago Ramón y Cajal wanted to be an artist and was jailed for blowing up a neighbour's gate with a homemade cannon. He became a doctor and used Camillo Golgi's silver staining method to see individual nerve cells in the brain. His beautiful drawings showed that the brain is made of separate cells – neurons – that communicate across tiny gaps, not a single continuous web as Golgi believed. The two rivals shared the 1906 Nobel Prize and disagreed in their acceptance speeches.","q":"Why are the gaps between neurons important?"},{"id":"bio-069","t":"Roger Bannister: the doctor's four-minute mile","s":"Biology","tp":"Health","sub":"Respiration","lv":["KS3","GCSE"],"who":"Roger Bannister","f":0,"loc":"UK","rg":["Europe"],"yr":1954,"era":"1950–1999","tag":"Everyday","x":"Some experts claimed running a mile in under four minutes was beyond human physiology. On 6 May 1954, at Iffley Road in Oxford, Roger Bannister, a medical student, ran it in 3 minutes 59.4 seconds, paced by Chris Brasher and Chris Chataway. He had studied his own breathing and oxygen use in the lab. His record lasted just 46 days. Bannister went on to become a leading neurologist, and said his medical work mattered more to him than the record.","q":"What happens in muscles during the final sprint of a race?"},{"id":"bio2-001","t":"Charles Blagden's oven room","s":"Biology","tp":"Body systems","sub":"Homeostasis","lv":["KS3","GCSE"],"who":"Charles Blagden, Joseph Banks","f":0,"loc":"UK","rg":["Europe"],"yr":1775,"era":"1700s","tag":"Eccentric","x":"In 1775 Charles Blagden, later Secretary of the Royal Society, entered a room heated to well over 100 °C – hotter than boiling water – with friends, a dog and a raw steak. They stayed for around 15 minutes. The steak cooked, but the people's body temperatures barely rose, because sweating and evaporation kept them cool. An egg cooked hard in 20 minutes. It was a dramatic demonstration that the body can control its own temperature.","q":"Why does sweating cool you down, and why does it work less well in humid air?"},{"id":"bio2-002","t":"William Beaumont and the man with a hole in his stomach","s":"Biology","tp":"Body systems","sub":"Digestion","lv":["GCSE"],"who":"William Beaumont, Alexis St. Martin","f":0,"loc":"USA / Canada","rg":["North & Central America"],"yr":1822,"era":"1800s","tag":"Eccentric","x":"In 1822, the French-Canadian fur trader Alexis St. Martin was accidentally shot in the stomach at Mackinac Island. The army surgeon William Beaumont saved his life, but the wound healed leaving a permanent opening into his stomach. For years, Beaumont lowered pieces of food on strings into the hole and pulled them out to see how they were digested, and collected gastric juice to show digestion is a chemical process involving acid. St. Martin found the experiments uncomfortable and ran away more than once. Today such experiments would not be considered ethical.","q":"What evidence showed digestion is chemical, not just mechanical?"},{"id":"bio2-003","t":"Bayliss and Starling name 'hormones'","s":"Biology","tp":"Body systems","sub":"Hormones","lv":["GCSE","A-Level"],"who":"William Bayliss, Ernest Starling","f":0,"loc":"UK","rg":["Europe"],"yr":1902,"era":"1900–1949","tag":"Discovery","x":"In 1902, at University College London, the brothers-in-law William Bayliss and Ernest Starling found that when acid from the stomach enters the small intestine, the pancreas releases digestive juice – even when all the nerves to it were cut. Something chemical must travel in the blood. They called it secretin. In 1905 Starling coined the word 'hormone', from the Greek for 'to set in motion'. The same lab was at the centre of the 'Brown Dog affair', a fierce public row over animal experiments.","q":"How do hormones differ from nerve signals?"},{"id":"bio2-004","t":"Karl Landsteiner and the blood groups","s":"Biology","tp":"Body systems","sub":"Blood","lv":["GCSE","A-Level"],"who":"Karl Landsteiner, Charles Drew","f":0,"loc":"Austria / USA","rg":["North & Central America","Europe"],"yr":1901,"era":"1900–1949","tag":"Discovery","x":"Blood transfusions in the 1800s were dangerous: sometimes they worked, and sometimes patients died. In 1901 the Austrian doctor Karl Landsteiner mixed blood samples from himself and colleagues and saw that some combinations clumped together. He identified the A, B and O groups (AB was found soon after). Matching blood groups made transfusions safe. Later the African American surgeon Charles Drew developed ways to store blood plasma and organised the 'Blood for Britain' programme in 1940, sending plasma to wartime Britain.","q":"Why does mixing incompatible blood groups cause clumping?"},{"id":"bio2-005","t":"The first human heart transplant","s":"Biology","tp":"Body systems","sub":"Heart","lv":["KS3","GCSE"],"who":"Christiaan Barnard, Louis Washkansky, Denise Darvall","f":1,"loc":"South Africa","rg":["Africa"],"yr":1967,"era":"1950–1999","tag":"Discovery","x":"On 3 December 1967, at Groote Schuur Hospital in Cape Town, Christiaan Barnard's team transplanted the heart of 25-year-old Denise Darvall, who had died after a car accident, into 53-year-old Louis Washkansky. The operation was a success and made world headlines, but Washkansky died 18 days later of pneumonia, as the drugs to stop rejection also weakened his immune system. Today, with better anti-rejection drugs, many heart transplant patients live for decades.","q":"Why does the immune system attack a transplanted organ?"},{"id":"bio2-006","t":"The twins who made kidney transplants possible","s":"Biology","tp":"Body systems","sub":"Kidneys","lv":["GCSE"],"who":"Joseph Murray, Ronald Herrick, Richard Herrick","f":0,"loc":"USA","rg":["North & Central America"],"yr":1954,"era":"1950–1999","tag":"Discovery","x":"Transplanted organs were always rejected by the immune system. But identical twins have the same genes. On 23 December 1954, in Boston, the surgeon Joseph Murray transplanted a kidney from Ronald Herrick into his identical twin Richard, who was dying of kidney failure. Richard lived another eight years, married one of his nurses, and had two children. It was the first successful organ transplant. Murray later won the Nobel Prize.","q":"Why weren't the twins' immune systems a problem?"},{"id":"bio2-007","t":"Henrietta Lacks' immortal cells","s":"Biology","tp":"Cells","sub":"Cell culture","lv":["GCSE","A-Level"],"who":"Henrietta Lacks, George Gey","f":1,"loc":"USA","rg":["North & Central America"],"yr":1951,"era":"1950–1999","tag":"Hidden figure","x":"In 1951 Henrietta Lacks, a 31-year-old African American mother of five, was treated for cervical cancer at Johns Hopkins Hospital. Without her knowledge, cells from her tumour were given to the researcher George Gey. Unlike other human cells, they kept dividing in the lab indefinitely. These 'HeLa' cells were used to develop the polio vaccine and in countless studies, but her family were not told for over 20 years and received nothing. Her story led to changes in how patients' consent is sought. In 2023 her family reached a settlement with a company that profited.","q":"Why is informed consent important in medical research?"},{"id":"bio2-008","t":"Viruses: smaller than bacteria","s":"Biology","tp":"Microorganisms","sub":"Viruses","lv":["GCSE","A-Level"],"who":"Dmitri Ivanovsky, Martinus Beijerinck","f":0,"loc":"Russia / Netherlands","rg":["Europe"],"yr":1892,"era":"1800s","tag":"Discovery","x":"Tobacco mosaic disease mottled the leaves of tobacco plants. In 1892 the Russian botanist Dmitri Ivanovsky passed sap from sick plants through a porcelain filter fine enough to trap all bacteria – but the filtered sap still caused disease. He thought a toxin might be responsible. In 1898 the Dutch microbiologist Martinus Beijerinck repeated the experiment and concluded it was a new kind of infectious agent that could only multiply in living cells. He called it a virus. Viruses were first seen in 1939 with the electron microscope.","q":"Why couldn't viruses be seen with ordinary microscopes?"},{"id":"bio2-009","t":"Félix d'Hérelle and the bacteria-eaters","s":"Biology","tp":"Microorganisms","sub":"Bacteriophages","lv":["GCSE","A-Level"],"who":"Félix d'Hérelle, Frederick Twort, George Eliava","f":0,"loc":"France / Canada / UK / Georgia","rg":["North & Central America","Europe"],"yr":1917,"era":"1900–1949","tag":"Discovery","x":"In 1915 the British scientist Frederick Twort, and in 1917 the French-Canadian Félix d'Hérelle, found clear spots in bacterial cultures where something invisible was killing the bacteria. D'Hérelle named them bacteriophages – 'bacteria eaters' – viruses that infect bacteria. He used them to treat dysentery and cholera. In Tbilisi, Georgia, with George Eliava, he set up an institute for phage therapy that still operates. With bacteria becoming resistant to antibiotics, phage therapy is being studied again.","q":"How could viruses be useful in medicine?"},{"id":"bio2-010","t":"Paul Ehrlich and Sahachiro Hata's magic bullet","s":"Biology","tp":"Disease and immunity","sub":"Drugs","lv":["GCSE","A-Level"],"who":"Paul Ehrlich, Sahachiro Hata, Kitasato Shibasaburō","f":0,"loc":"Germany / Japan","rg":["East Asia","Europe"],"yr":1909,"era":"1900–1949","tag":"Discovery","x":"Paul Ehrlich dreamed of a 'magic bullet' – a chemical that would kill a microbe without harming the patient. His team in Frankfurt tested hundreds of arsenic compounds against syphilis. In 1909 the Japanese bacteriologist Sahachiro Hata, who had trained with Kitasato Shibasaburō, retested compound number 606 in rabbits and found it worked. It was sold as Salvarsan, the first modern synthetic antimicrobial drug. Kitasato himself had grown the tetanus bacterium in pure culture and helped develop antitoxin treatment.","q":"Why must an antimicrobial drug be selectively toxic?"},{"id":"bio2-011","t":"Linnaeus names everything","s":"Biology","tp":"Classification","sub":"Binomial naming","lv":["KS3","GCSE"],"who":"Carl Linnaeus","f":0,"loc":"Sweden","rg":["Europe"],"yr":1753,"era":"1700s","tag":"Discovery","x":"Before the 1750s, plants had long Latin descriptions as names – the tomato was called something like 'Solanum with smooth stems and pinnate leaves'. The Swedish botanist Carl Linnaeus introduced a simple two-part name for each species, genus first: Homo sapiens, Solanum lycopersicum. He sent students around the world to collect specimens; several died on the journeys. He had a sense of humour too, sometimes naming unpleasant weeds after critics. His system, with improvements, is still used today.","q":"Why are scientific names more useful than common names?"},{"id":"bio2-012","t":"Darwin's moth prediction","s":"Biology","tp":"Evolution","sub":"Coevolution","lv":["GCSE","A-Level"],"who":"Charles Darwin, Alfred Russel Wallace","f":0,"loc":"Madagascar / UK","rg":["Europe"],"yr":1862,"era":"1800s","tag":"Discovery","x":"In 1862 Darwin was sent an orchid from Madagascar, Angraecum sesquipedale, whose nectar lay at the bottom of a spur about 30 cm long. He predicted there must be a moth with a tongue long enough to reach it. People laughed. Wallace agreed and suggested a relative of a known African hawk-moth. In 1903 such a moth was found in Madagascar and named Xanthopan praedicta – 'predicted'. It was finally filmed feeding on the orchid in 1992.","q":"Why would a long nectar spur and a long tongue evolve together?"},{"id":"bio2-013","t":"Charles Elton's food chains on Bear Island","s":"Biology","tp":"Ecology","sub":"Food chains","lv":["KS3","GCSE"],"who":"Charles Elton, Victor Summerhayes","f":0,"loc":"Norway (Svalbard) / UK","rg":["Antarctica & Arctic","Europe"],"yr":1923,"era":"1900–1949","tag":"Discovery","x":"In 1921, Oxford student Charles Elton joined an expedition to Bear Island and Spitsbergen in the Arctic. With so few species there, he and Victor Summerhayes could map who ate whom, drawing one of the first food webs in 1923. Elton went on to describe food chains, the idea that there are fewer predators than prey – the pyramid of numbers – and the concept of an ecological niche. His work founded the science of animal ecology.","q":"Why are there fewer animals at the top of a food chain?"},{"id":"bio2-014","t":"Rothamsted's 170-year experiments","s":"Biology","tp":"Plants","sub":"Mineral ions","lv":["KS3","GCSE"],"who":"John Bennet Lawes, Joseph Henry Gilbert","f":0,"loc":"UK","rg":["Europe"],"yr":1843,"era":"1800s","tag":"Discovery","x":"In 1843 John Bennet Lawes, who made one of the first artificial fertilisers on his estate at Rothamsted, Hertfordshire, began field experiments with the chemist Joseph Henry Gilbert. Strips of wheat in the Broadbalk field have received the same fertiliser treatments every year since – one strip has had none at all. The Park Grass experiment, started in 1856, is the oldest ecological experiment in the world. They have shown how nitrogen, phosphorus and potassium affect crops and how fertilisers change plant diversity.","q":"Why are experiments that last for decades so valuable?"},{"id":"bio2-015","t":"Lynx, hares and fur traders","s":"Biology","tp":"Ecology","sub":"Predator–prey","lv":["GCSE","A-Level"],"who":"Charles Elton","f":0,"loc":"Canada","rg":["North & Central America"],"yr":1924,"era":"1900–1949","tag":"Discovery","x":"The Hudson's Bay Company kept records of the furs bought from trappers in Canada for over 200 years. In the 1920s ecologists including Charles Elton used these records to show that numbers of snowshoe hares and lynx rose and fell in cycles of about ten years, with lynx peaks following hare peaks. It became the classic example of predator–prey cycles, though later work showed the hares' food supply also matters.","q":"Why do predator numbers peak after prey numbers?"},{"id":"bio2-016","t":"Ötzi the Iceman's last meal","s":"Biology","tp":"Health","sub":"Ancient DNA","lv":["KS3","GCSE"],"who":"Erika Simon, Helmut Simon","f":1,"loc":"Italy / Austria","rg":["Europe"],"yr":1991,"era":"1950–1999","tag":"Discovery","x":"In September 1991, German hikers Erika and Helmut Simon found a body in melting ice high in the Ötztal Alps on the Austrian–Italian border. It was a man who had died around 5,300 years ago. Ötzi's body, clothes and copper axe were remarkably preserved. Scientists found an arrowhead in his shoulder, 61 tattoos possibly linked to treating joint pain, and the remains of his last meal of ibex meat, grains and fat. His DNA showed he was lactose intolerant and at risk of heart disease.","q":"What can scientists learn from a body preserved in ice?"},{"id":"bio2-017","t":"Pavlov's dogs and the bell that wasn't","s":"Biology","tp":"Behaviour","sub":"Learning","lv":["KS3","GCSE"],"who":"Ivan Pavlov","f":0,"loc":"Russia","rg":["Europe"],"yr":1902,"era":"1900–1949","tag":"Discovery","x":"Ivan Pavlov won the 1904 Nobel Prize for studying digestion in dogs. He noticed that dogs began to salivate before food arrived, when they saw the lab assistants. He showed that if a signal was repeatedly given before food, the dogs would salivate at the signal alone – a conditioned reflex. He often used a metronome, buzzer or electric shocks; the famous 'bell' may be a later simplification. Conditioning is part of how all animals, including us, learn.","q":"What is the difference between a reflex and a learned response?"},{"id":"bio2-018","t":"Ynés Mexía: plant hunter at 55","s":"Biology","tp":"Classification","sub":"Biodiversity","lv":["KS3","GCSE"],"who":"Ynés Mexía","f":1,"loc":"Mexico / USA / Peru / Brazil","rg":["South America","North & Central America"],"yr":1925,"era":"1900–1949","tag":"Hidden figure","x":"Ynés Mexía, a Mexican-American, began studying botany in her fifties after a difficult early life. From 1925 until her death in 1938, she travelled by canoe, on horseback and on foot through Mexico, the Amazon, the Andes and Alaska, collecting around 145,000 plant specimens. About 500 were new to science, and at least 50 species are named after her. She once fell off a cliff and broke her ribs, and spent months travelling up the Amazon by canoe.","q":"Why do scientists still collect and preserve plant specimens?"},{"id":"bio2-019","t":"Esther Lederberg's velvet stamp","s":"Biology","tp":"Microorganisms","sub":"Mutation","lv":["A-Level"],"who":"Esther Lederberg, Joshua Lederberg","f":1,"loc":"USA","rg":["North & Central America"],"yr":1952,"era":"1950–1999","tag":"Hidden figure","x":"Do bacteria become resistant to antibiotics because they are exposed to them, or were resistant mutants there all along? In 1952 Esther Lederberg and her husband Joshua developed 'replica plating': she pressed a velvet-covered block onto a plate of bacterial colonies, then stamped the same pattern onto plates with antibiotic. Resistant colonies grew in the same positions every time, showing the mutations existed before the antibiotic. Esther also discovered the lambda virus. Joshua shared a Nobel Prize in 1958; Esther was not included.","q":"How does replica plating show mutations are random?"},{"id":"bio2-020","t":"Dorothy Hodgkin: penicillin, B12 and insulin","s":"Chemistry","tp":"Bonding","sub":"X-ray crystallography","lv":["GCSE","A-Level"],"who":"Dorothy Crowfoot Hodgkin","f":1,"loc":"UK / Egypt","rg":["Africa","Europe"],"yr":1964,"era":"1950–1999","tag":"Hidden figure","x":"Dorothy Crowfoot grew up partly in Egypt and Sudan and fell in love with crystals as a child. Using X-ray crystallography in Oxford, she worked out the structure of penicillin in 1945, vitamin B12 in 1954 and, after 34 years of work, insulin in 1969. She developed rheumatoid arthritis in her twenties, which twisted her hands, yet she kept doing delicate experiments. In 1964 she became the only British woman to win a Nobel Prize in science. A newspaper headline announced it as 'Oxford housewife wins Nobel'.","q":"How can X-rays reveal the arrangement of atoms in a crystal?"},{"id":"bio2-021","t":"Ada Yonath's ribosome","s":"Chemistry","tp":"Bonding","sub":"X-ray crystallography","lv":["A-Level"],"who":"Ada Yonath","f":1,"loc":"Israel","rg":["Middle East"],"yr":2000,"era":"2000 onwards","tag":"Discovery","x":"Ada Yonath grew up in poverty in Jerusalem. In the late 1970s she set out to work out the structure of the ribosome, the giant molecular machine that makes proteins, which many thought was impossible to crystallise. Inspired partly by bears that hibernate with their ribosomes packed in neat arrays, she persisted for over 20 years, using bacteria from the Dead Sea and hot springs. In 2000 her team and others revealed the ribosome's atomic structure, helping to show how antibiotics work. She won the 2009 Nobel Prize in Chemistry.","q":"Why do many antibiotics target bacterial ribosomes?"},{"id":"bio2-022","t":"Elizabeth Blackburn and the shoelace tips of chromosomes","s":"Biology","tp":"Genetics","sub":"Chromosomes","lv":["A-Level"],"who":"Elizabeth Blackburn, Carol Greider, Jack Szostak","f":1,"loc":"Australia / USA","rg":["Oceania","North & Central America"],"yr":1984,"era":"1950–1999","tag":"Discovery","x":"Every time a cell copies its DNA, the ends of chromosomes get slightly shorter. Elizabeth Blackburn, from Tasmania, studied the protective caps called telomeres in a single-celled pond organism. On Christmas Day 1984, her PhD student Carol Greider detected the enzyme that rebuilds telomeres: telomerase. Telomeres act a bit like the plastic tips on shoelaces. Their work helps explain ageing and cancer. Blackburn, Greider and Jack Szostak shared the 2009 Nobel Prize – the first time two women shared a science Nobel.","q":"Why might shortening telomeres limit how many times a cell can divide?"},{"id":"bio2-023","t":"May-Britt Moser and the brain's GPS","s":"Biology","tp":"Nerves","sub":"The brain","lv":["GCSE","A-Level"],"who":"May-Britt Moser, Edvard Moser, John O'Keefe","f":1,"loc":"Norway / UK","rg":["Europe"],"yr":2005,"era":"2000 onwards","tag":"Discovery","x":"In 1971 John O'Keefe in London found 'place cells' in rats' brains that fire when the animal is in a particular spot. In 2005 the Norwegian husband-and-wife team May-Britt and Edvard Moser found 'grid cells' in a nearby brain region that fire in a regular triangular grid pattern as a rat explores, acting like co-ordinates on a map. The three shared the 2014 Nobel Prize. These are among the first brain areas to be affected in Alzheimer's disease, which may explain why people with the disease often get lost.","q":"How could a grid of cells help an animal find its way?"},{"id":"bio2-024","t":"Linda Buck and the smell receptors","s":"Biology","tp":"Senses","sub":"Smell","lv":["GCSE","A-Level"],"who":"Linda Buck, Richard Axel","f":1,"loc":"USA","rg":["North & Central America"],"yr":1991,"era":"1950–1999","tag":"Discovery","x":"How can we tell thousands of smells apart? In 1991 Linda Buck and Richard Axel discovered a family of around 1,000 genes in rats for smell receptors – about 3% of all the genes, the largest gene family. Humans have about 400 working smell receptor types. Each smell molecule activates a particular combination of receptors, like a chord on a piano, and the brain recognises the pattern. They won the 2004 Nobel Prize.","q":"Why do you lose your sense of taste when you have a cold?"},{"id":"bio2-025","t":"Christiane Nüsslein-Volhard's fruit flies","s":"Biology","tp":"Genetics","sub":"Development","lv":["A-Level"],"who":"Christiane Nüsslein-Volhard, Eric Wieschaus","f":1,"loc":"Germany","rg":["Europe"],"yr":1980,"era":"1950–1999","tag":"Discovery","x":"How does a single fertilised egg know which end will become the head? In 1980, Christiane Nüsslein-Volhard and Eric Wieschaus in Heidelberg mutated fruit flies and looked through thousands of embryos under a double microscope to find those with body plans gone wrong. They identified the key genes that lay out the body of the fly embryo. Similar genes were found in humans, showing a shared toolkit of development across animals. They shared the 1995 Nobel Prize.","q":"Why are fruit flies so useful for genetics research?"},{"id":"earth-001","t":"Eratosthenes measures the Earth with a shadow","s":"Earth Science","tp":"Earth's structure and history","sub":"Size of the Earth","lv":["KS3","GCSE"],"who":"Eratosthenes","f":0,"loc":"Egypt","rg":["Africa"],"yr":-240,"era":"Ancient","tag":"Discovery","x":"Around 240 BCE, Eratosthenes, librarian at Alexandria in Egypt, heard that at noon on midsummer's day the Sun shone straight down a well at Syene (modern Aswan), casting no shadow. On the same day in Alexandria, a vertical stick cast a shadow at about 7°, one-fiftieth of a circle. Since the cities were about 5,000 stadia apart, Earth's circumference must be about 250,000 stadia – within perhaps 2–15% of the true value, depending on the length of the stadion he used.","q":"Why does a difference in shadow angle reveal the Earth's curvature?"},{"id":"earth-002","t":"Al-Biruni measures the Earth from a mountain","s":"Earth Science","tp":"Earth's structure and history","sub":"Size of the Earth","lv":["GCSE","A-Level"],"who":"Abu Rayhan al-Biruni","f":0,"loc":"Pakistan / Uzbekistan","rg":["South Asia","Central Asia"],"yr":1020,"era":"Medieval","tag":"Discovery","x":"Around 1020, the Persian scholar al-Biruni, travelling in what is now Pakistan, devised a clever way to measure Earth using a single mountain. He measured the mountain's height using trigonometry, then climbed it and measured how far the horizon dipped below the horizontal. From these two measurements and some geometry, he calculated Earth's radius as about 6,340 km – remarkably close to the modern value of 6,371 km.","q":"Draw the geometry: how does the dip angle of the horizon depend on Earth's radius?"},{"id":"earth-003","t":"Zhang Heng's earthquake detector","s":"Earth Science","tp":"Earthquakes and volcanoes","sub":"Seismology","lv":["KS3","GCSE"],"who":"Zhang Heng","f":0,"loc":"China","rg":["East Asia"],"yr":132,"era":"Ancient","tag":"Invention","x":"In 132 CE, the Chinese astronomer and engineer Zhang Heng built the first known seismoscope: a bronze vessel with eight dragons around the outside, each holding a ball above an open-mouthed toad. When a tremor shook the ground, a pendulum inside tipped, and one dragon dropped its ball into a toad's mouth, showing the direction of the shaking. According to records, one day a ball dropped though no one in the capital had felt anything; days later a messenger arrived reporting an earthquake hundreds of kilometres away.","q":"How does a pendulum help detect ground movement?"},{"id":"earth-004","t":"Shen Kuo and the compass","s":"Earth Science","tp":"Earth's magnetism","sub":"Compasses","lv":["KS3","GCSE"],"who":"Shen Kuo","f":0,"loc":"China","rg":["East Asia"],"yr":1088,"era":"Medieval","tag":"Discovery","x":"Chinese scholars used lodestone, naturally magnetic rock, for divination: a spoon of lodestone balanced on a bronze plate would point south. In 1088 the polymath Shen Kuo described a magnetised needle suspended by a silk thread and noted it did not point exactly north–south but slightly east of south – the first description of magnetic declination. He also found fossil bamboo in a dry region and concluded the climate there had once been different, and suggested mountains were worn down to form land.","q":"Why doesn't a compass point exactly to true north?"},{"id":"earth-005","t":"Hutton's 'no vestige of a beginning'","s":"Earth Science","tp":"Rocks and geology","sub":"Deep time","lv":["KS3","GCSE"],"who":"James Hutton, John Playfair","f":0,"loc":"Scotland","rg":["Europe"],"yr":1788,"era":"1700s","tag":"Discovery","x":"In 1788 the Scottish geologist James Hutton took friends by boat to Siccar Point, a rocky headland in Berwickshire. There, nearly vertical layers of grey rock lie beneath gently sloping layers of red sandstone. Hutton explained that the lower layers had formed under the sea, been tilted and worn flat, and then buried by new layers – needing unimaginably long times. His friend John Playfair wrote that the mind seemed to grow giddy by looking so far into the abyss of time. Hutton concluded that Earth showed no vestige of a beginning and no prospect of an end.","q":"How does an unconformity show that a great deal of time has passed?"},{"id":"earth-006","t":"William Smith's map that changed the world","s":"Earth Science","tp":"Rocks and geology","sub":"Rock layers","lv":["KS3","GCSE"],"who":"William Smith","f":0,"loc":"UK","rg":["Europe"],"yr":1815,"era":"1800s","tag":"Hidden figure","x":"William Smith, the son of an Oxfordshire blacksmith, worked as a surveyor digging canals. He noticed that rock layers always appeared in the same order and that each layer contained its own characteristic fossils, so he could identify rocks across the country. In 1815 he published the first geological map of a whole country, hand-coloured, of England, Wales and part of Scotland. Others copied his work, he went bankrupt and spent time in a debtors' prison. Later he was finally honoured with the Geological Society's first Wollaston Medal.","q":"How can fossils help match rock layers in different places?"},{"id":"earth-007","t":"Alfred Wegener's drifting continents","s":"Earth Science","tp":"Plate tectonics","sub":"Continental drift","lv":["KS3","GCSE"],"who":"Alfred Wegener","f":0,"loc":"Germany / Greenland","rg":["Antarctica & Arctic","Europe"],"yr":1912,"era":"1900–1949","tag":"Tragedy","x":"In 1912 the German meteorologist Alfred Wegener proposed that the continents were once joined in a supercontinent he called Pangaea and had slowly drifted apart. His evidence included the jigsaw fit of South America and Africa, matching fossils such as the reptile Mesosaurus on both sides of the Atlantic, and matching rock types. But he could not explain what force moved continents, and many geologists mocked him. In 1930 he died on an expedition across the Greenland ice sheet. His ideas were vindicated in the 1960s by evidence from the ocean floor.","q":"Why did scientists reject Wegener's idea, even though his evidence was good?"},{"id":"earth-008","t":"Marie Tharp maps the ocean floor","s":"Earth Science","tp":"Plate tectonics","sub":"Mid-ocean ridges","lv":["KS3","GCSE","A-Level"],"who":"Marie Tharp, Bruce Heezen","f":1,"loc":"USA","rg":["North & Central America"],"yr":1953,"era":"1950–1999","tag":"Hidden figure","x":"In the 1950s women were not allowed on research ships, so Marie Tharp stayed in the lab at Columbia University turning sonar depth readings into maps of the sea floor. In 1953 she noticed a deep valley running down the middle of the Mid-Atlantic Ridge – a rift where the sea floor was splitting apart. Her colleague Bruce Heezen at first dismissed it as 'girl talk', but the valley lined up with earthquake locations. Her maps provided powerful evidence for plate tectonics. In 1977 they published a famous world map of the ocean floor.","q":"Why does a rift valley along the ridge support sea-floor spreading?"},{"id":"earth-009","t":"Inge Lehmann finds Earth's inner core","s":"Earth Science","tp":"Earthquakes and volcanoes","sub":"Earth's structure","lv":["GCSE","A-Level"],"who":"Inge Lehmann","f":1,"loc":"Denmark / New Zealand","rg":["Oceania","Europe"],"yr":1936,"era":"1900–1949","tag":"Hidden figure","x":"Seismologists knew Earth had a liquid outer core, because S-waves cannot pass through it, creating a 'shadow zone' on the far side of the planet from an earthquake. But some faint P-waves appeared in the shadow zone. The Danish seismologist Inge Lehmann, studying records from a large 1929 earthquake in New Zealand, kept her data on cards in oatmeal boxes. In 1936 she suggested the waves were reflecting off a solid inner core. She continued researching until her 90s and lived to 104.","q":"How do seismic waves tell us about the inside of the Earth?"},{"id":"earth-010","t":"Mohorovičić finds the base of the crust","s":"Earth Science","tp":"Earthquakes and volcanoes","sub":"Earth's structure","lv":["GCSE","A-Level"],"who":"Andrija Mohorovičić","f":0,"loc":"Croatia","rg":["Europe"],"yr":1909,"era":"1900–1949","tag":"Discovery","x":"In October 1909 an earthquake struck the Kupa valley near Zagreb, Croatia. The meteorologist and seismologist Andrija Mohorovičić noticed that stations far from the earthquake received two sets of waves: one that had travelled slowly through the upper rock and one that arrived early, having travelled faster through denser rock below. He concluded there is a boundary about 50 km down between the crust and the mantle. It is now called the Mohorovičić discontinuity, or just the Moho.","q":"Why do seismic waves speed up in denser rock?"},{"id":"earth-011","t":"Pliny the Younger watches Vesuvius erupt","s":"Earth Science","tp":"Earthquakes and volcanoes","sub":"Volcanoes","lv":["KS3","GCSE"],"who":"Pliny the Younger, Pliny the Elder","f":0,"loc":"Italy","rg":["Europe"],"yr":79,"era":"Ancient","tag":"Tragedy","x":"In 79 CE Mount Vesuvius erupted, burying Pompeii and Herculaneum. The 17-year-old Pliny the Younger watched from across the bay and later described a giant cloud shaped like an umbrella pine tree rising from the mountain. His uncle, Pliny the Elder, a naturalist and admiral, sailed towards the eruption to rescue friends and died on the shore. Eruptions with a towering column of gas and ash are now called 'Plinian' after the young eyewitness.","q":"What causes some volcanoes to erupt explosively?"},{"id":"earth-012","t":"Tambora and the year without a summer","s":"Earth Science","tp":"Earthquakes and volcanoes","sub":"Volcanoes and climate","lv":["KS3","GCSE"],"who":"Mary Shelley","f":1,"loc":"Indonesia / Europe","rg":["Southeast Asia","Europe"],"yr":1815,"era":"1800s","tag":"Tragedy","x":"In April 1815 Mount Tambora in Indonesia exploded in the largest eruption in recorded history, killing tens of thousands of people locally. Sulphur gases spread around the stratosphere and formed droplets that reflected sunlight. In 1816 Europe and North America had a 'year without a summer': crops failed and there was snow in June. Stuck indoors at a villa near Geneva by the gloomy weather, 18-year-old Mary Shelley began writing Frankenstein. The vivid sunsets of the time may appear in paintings by J. M. W. Turner.","q":"How can a volcano in Indonesia cool Europe?"},{"id":"earth-013","t":"Krakatoa's sound around the world","s":"Earth Science","tp":"Earthquakes and volcanoes","sub":"Volcanoes","lv":["KS3","GCSE"],"who":"","f":0,"loc":"Indonesia","rg":["Southeast Asia"],"yr":1883,"era":"1800s","tag":"Tragedy","x":"On 27 August 1883 the volcanic island of Krakatoa in Indonesia exploded. The bang was heard nearly 4,800 km away on the island of Rodrigues near Mauritius, where it sounded like distant gunfire. Barometers around the world recorded the pressure wave passing several times as it travelled round and round the Earth. Tsunamis killed over 36,000 people. Ash in the atmosphere caused brilliant red sunsets worldwide for months – some think it inspired the sky in Edvard Munch's The Scream.","q":"How could barometers detect a sound wave?"},{"id":"earth-014","t":"Mount St Helens: 'This is it!'","s":"Earth Science","tp":"Earthquakes and volcanoes","sub":"Volcanoes","lv":["KS3","GCSE"],"who":"David Johnston","f":0,"loc":"USA","rg":["North & Central America"],"yr":1980,"era":"1950–1999","tag":"Tragedy","x":"In spring 1980 the north side of Mount St Helens in Washington State was bulging outward by about 1.5 metres a day as magma pushed in. On 18 May an earthquake set off the largest landslide in recorded history, releasing the pressure in a sideways blast. The young volcanologist David Johnston, monitoring the volcano from a ridge about 10 km away, radioed 'Vancouver! Vancouver! This is it!' before he was killed. 57 people died, but monitoring and evacuation saved many more.","q":"Why did measuring the bulge help predict the eruption?"},{"id":"earth-015","t":"Tilly Smith's geography lesson","s":"Earth Science","tp":"Earthquakes and volcanoes","sub":"Tsunamis","lv":["KS3","GCSE"],"who":"Tilly Smith, Andrew Kearney","f":1,"loc":"Thailand / UK","rg":["Southeast Asia","Europe"],"yr":2004,"era":"2000 onwards","tag":"Everyday","x":"On 26 December 2004, ten-year-old Tilly Smith from Surrey was on Mai Khao beach in Phuket, Thailand, with her family. She saw the sea rush out and begin to froth and bubble. Two weeks earlier, her geography teacher Andrew Kearney had shown her class a video about tsunamis. She told her parents, who alerted hotel staff, and the beach was cleared minutes before the waves arrived. Around 100 people were saved, and no one on that beach died. The Indian Ocean tsunami killed around 230,000 people elsewhere.","q":"What warning signs show that a tsunami may be coming?"},{"id":"earth-016","t":"The Chicxulub crater and the dinosaurs","s":"Earth Science","tp":"Rocks and geology","sub":"Mass extinction","lv":["GCSE","A-Level"],"who":"Luis Alvarez, Walter Alvarez, Glen Penfield, Antonio Camargo","f":0,"loc":"USA / Italy / Mexico","rg":["North & Central America","Europe"],"yr":1980,"era":"1950–1999","tag":"Discovery","x":"In 1980 the geologist Walter Alvarez and his father, the physicist Luis Alvarez, found a thin layer of clay at Gubbio in Italy, laid down 66 million years ago when the dinosaurs died out, that was rich in iridium – rare on Earth but common in asteroids. They proposed an asteroid impact. Where was the crater? In 1978, geophysicists Glen Penfield and Antonio Camargo, working for Mexico's oil company, had found a huge buried circular structure under the Yucatán Peninsula. By 1991 it was confirmed as the 180 km Chicxulub crater.","q":"Why would an asteroid impact cause a mass extinction worldwide?"},{"id":"earth-017","t":"Tunguska: the forest flattened from the sky","s":"Earth Science","tp":"Rocks and geology","sub":"Impacts","lv":["KS3","GCSE"],"who":"Leonid Kulik","f":0,"loc":"Russia","rg":["Europe"],"yr":1908,"era":"1900–1949","tag":"Discovery","x":"On the morning of 30 June 1908, a huge explosion flattened about 80 million trees over 2,000 square kilometres of Siberian forest near the Tunguska River. People 60 km away were knocked down and felt intense heat. Night skies glowed in Europe. The first scientific expedition, led by Leonid Kulik, only reached the site in 1927. He found trees flattened outwards but no crater. Scientists now think a small asteroid or comet fragment exploded several kilometres above the ground.","q":"Why was there no crater?"},{"id":"earth-018","t":"Luke Howard names the clouds","s":"Earth Science","tp":"Atmosphere and climate","sub":"Clouds","lv":["KS3","GCSE"],"who":"Luke Howard","f":0,"loc":"UK","rg":["Europe"],"yr":1802,"era":"1800s","tag":"Discovery","x":"In 1802 Luke Howard, a Quaker pharmacist in London and amateur meteorologist, gave a lecture proposing Latin names for clouds: cirrus (curl of hair), cumulus (heap), stratus (layer) and nimbus (rain cloud), which could be combined, as in cirrostratus. Clouds had been thought too changeable to classify. His system was taken up around the world and is still used. The German poet Goethe was so impressed he wrote poems in Howard's honour.","q":"Look outside: what type of clouds can you see?"},{"id":"earth-019","t":"Wasaburo Ooishi's jet stream in Esperanto","s":"Earth Science","tp":"Atmosphere and climate","sub":"Jet stream","lv":["GCSE","A-Level"],"who":"Wasaburo Ooishi","f":0,"loc":"Japan","rg":["East Asia"],"yr":1926,"era":"1900–1949","tag":"Hidden figure","x":"From 1923 to 1925, Wasaburo Ooishi, director of Japan's Tateno aerological observatory, released over 1,200 small balloons and tracked them with a theodolite. He found persistent, extremely fast winds high above Japan, especially in winter – what we now call the jet stream. But Ooishi was also head of the Japanese Esperanto Society, and he published his reports in Esperanto, which almost no meteorologists abroad could read. The discovery was largely overlooked until American bomber pilots encountered fierce winds in the Second World War. Japan used his findings to send balloon bombs to North America.","q":"Why does the language used to publish science matter?"},{"id":"earth-020","t":"Eunice Foote: the first to show CO₂ traps heat","s":"Earth Science","tp":"Atmosphere and climate","sub":"Greenhouse effect","lv":["KS3","GCSE","A-Level"],"who":"Eunice Foote, John Tyndall","f":1,"loc":"USA / UK","rg":["North & Central America","Europe"],"yr":1856,"era":"1800s","tag":"Hidden figure","x":"In 1856 the American scientist and women's rights campaigner Eunice Foote filled glass cylinders with different gases, put thermometers in them and set them in the sunlight. The cylinder of carbon dioxide heated up most and stayed hot longest. She suggested that more carbon dioxide in the atmosphere would make the Earth warmer. Her paper was read at a scientific meeting by a man, Joseph Henry. Three years later, John Tyndall in Britain made more detailed measurements of how gases absorb infrared, and he is usually given credit. Foote's work was rediscovered in 2011.","q":"Design an experiment to compare how different gases warm in sunlight."},{"id":"earth-021","t":"Guy Callendar: the steam engineer who spotted warming","s":"Earth Science","tp":"Atmosphere and climate","sub":"Global warming","lv":["GCSE","A-Level"],"who":"Guy Callendar","f":0,"loc":"UK","rg":["Europe"],"yr":1938,"era":"1900–1949","tag":"Hidden figure","x":"In 1938 Guy Callendar, a British steam engineer and amateur meteorologist, collected temperature records from around the world and showed that the planet had warmed over the previous 50 years. He linked it to rising carbon dioxide from burning coal. Professional meteorologists were sceptical; one suggested the warming was just natural variation. Callendar thought a little warming might be good, delaying the next ice age. His analysis was remarkably accurate, and the link between carbon dioxide and warming is now called the Callendar effect.","q":"What evidence would convince you that the climate is changing?"},{"id":"earth-022","t":"Charles Keeling's curve","s":"Earth Science","tp":"Atmosphere and climate","sub":"Carbon dioxide","lv":["KS3","GCSE","A-Level"],"who":"Charles David Keeling","f":0,"loc":"USA","rg":["North & Central America"],"yr":1958,"era":"1950–1999","tag":"Discovery","x":"In 1958 Charles Keeling began measuring carbon dioxide in the air at Mauna Loa Observatory in Hawaiʻi, high above local pollution. He found two patterns: CO₂ rises and falls every year as plants in the Northern Hemisphere grow in summer and decay in winter, as if the planet were breathing; and the level climbs steadily year after year. From about 315 parts per million in 1958, it has passed 420 ppm. The 'Keeling Curve' is one of the most important graphs in science, and his son Ralph continues the measurements.","q":"Why does CO₂ fall in the northern summer?"},{"id":"earth-023","t":"Milanković's prison calculations","s":"Earth Science","tp":"Atmosphere and climate","sub":"Ice ages","lv":["A-Level"],"who":"Milutin Milanković","f":0,"loc":"Serbia / Hungary","rg":["Europe"],"yr":1914,"era":"1900–1949","tag":"Discovery","x":"When the First World War began, the Serbian scientist Milutin Milanković was on honeymoon in his home village, then in Austria-Hungary, and was arrested as an enemy citizen. Later released to Budapest under supervision, he spent his internment calculating, entirely by hand, how changes in Earth's orbit affect sunlight. He concluded that these cycles pace the ice ages. His ideas were confirmed in the 1970s from ocean sediment cores. A crater on the Moon and one on Mars are named after him.","q":"Which three orbital cycles did Milanković calculate?"},{"id":"earth-024","t":"Louis Agassiz and the ice age","s":"Earth Science","tp":"Atmosphere and climate","sub":"Glaciers","lv":["KS3","GCSE"],"who":"Louis Agassiz, Ignaz Venetz, Jean de Charpentier","f":0,"loc":"Switzerland / Scotland","rg":["Europe"],"yr":1837,"era":"1800s","tag":"Discovery","x":"Swiss farmers knew that huge boulders far from any mountain had been carried by glaciers, and the engineer Ignaz Venetz and the geologist Jean de Charpentier argued that the glaciers had once been far bigger. In 1837 Louis Agassiz went further, proposing a great ice age when ice covered much of northern Europe. Visiting Scotland in 1840, he recognised scratched rocks and moraines as glacial evidence there too. Agassiz later held deeply racist views, which are now widely condemned.","q":"What evidence do glaciers leave behind?"},{"id":"earth-025","t":"Polynesian wayfinders","s":"Earth Science","tp":"Oceans","sub":"Navigation","lv":["KS3","GCSE"],"who":"Mau Piailug, Nainoa Thompson","f":0,"loc":"Micronesia / Hawaiʻi / Tahiti","rg":["Oceania"],"yr":1976,"era":"1950–1999","tag":"Discovery","x":"Polynesian navigators settled islands across thousands of kilometres of Pacific Ocean without instruments, reading the rising points of stars, the shape of swells, wind, clouds and birds. Some historians doubted this was possible. In 1976 the master navigator Mau Piailug from Micronesia guided the voyaging canoe Hōkūleʻa from Hawaiʻi to Tahiti, about 4,000 km, using only traditional methods. He then taught the Hawaiian Nainoa Thompson, helping revive wayfinding. Hōkūleʻa has since sailed around the world.","q":"How can ocean swells tell a navigator where land is?"},{"id":"earth-026","t":"Benjamin Franklin maps the Gulf Stream","s":"Earth Science","tp":"Oceans","sub":"Currents","lv":["KS3","GCSE"],"who":"Benjamin Franklin, Timothy Folger","f":0,"loc":"USA / UK","rg":["North & Central America","Europe"],"yr":1770,"era":"1700s","tag":"Discovery","x":"As deputy postmaster for the American colonies, Benjamin Franklin wondered why mail ships from England took about two weeks longer than merchant ships. His cousin Timothy Folger, a Nantucket whaling captain, explained that whalers knew of a strong warm current flowing east across the Atlantic, and avoided sailing against it; British packet captains ignored them. Around 1770 Franklin published a chart of the Gulf Stream, and later measured water temperatures on his voyages to trace it.","q":"Why does the Gulf Stream make western Europe milder than Canada at the same latitude?"},{"id":"earth-027","t":"The Great Storm of 1987","s":"Earth Science","tp":"Atmosphere and climate","sub":"Weather forecasting","lv":["KS3"],"who":"Michael Fish","f":0,"loc":"UK","rg":["Europe"],"yr":1987,"era":"1950–1999","tag":"Everyday","x":"On 15 October 1987 the BBC weather forecaster Michael Fish told viewers a woman had phoned to say a hurricane was on the way, and that there wasn't. He was talking about a storm in the western Atlantic; but that night, an intense storm struck southern England with gusts over 100 mph, felling around 15 million trees and killing 18 people in England. The forecasting models had not handled the storm's path well. The event led to big improvements in UK weather forecasting and warnings.","q":"Why is the weather so hard to predict days in advance?"},{"id":"earth-028","t":"FitzRoy and the first weather forecasts","s":"Earth Science","tp":"Atmosphere and climate","sub":"Weather forecasting","lv":["KS3","GCSE"],"who":"Robert FitzRoy","f":0,"loc":"UK","rg":["Europe"],"yr":1861,"era":"1800s","tag":"Invention","x":"Robert FitzRoy captained HMS Beagle on the voyage that took Charles Darwin around the world. In 1854 he founded the department that became the Met Office. After a storm in 1859 sank the steamship Royal Charter off Anglesey with the loss of over 450 lives, he set up a network of telegraph stations reporting weather to London and began issuing storm warnings and, in 1861, the first public 'forecasts' – a word he coined – in The Times. Critics mocked forecasts that went wrong, causing him great distress.","q":"Why were telegraphs so important for forecasting?"},{"id":"earth-029","t":"The Ensisheim meteorite","s":"Earth Science","tp":"Rocks and geology","sub":"Meteorites","lv":["KS3"],"who":"","f":0,"loc":"France","rg":["Europe"],"yr":1492,"era":"Medieval","tag":"Discovery","x":"On 7 November 1492, a 127 kg stone fell from the sky into a wheat field near Ensisheim in Alsace, witnessed by a young boy. Townspeople broke off pieces as souvenirs, and it was chained up in the church to stop it flying away again. It is the oldest meteorite fall in Europe with surviving material. For centuries, many scientists refused to believe stones could fall from the sky; this changed only after a shower of meteorites at L'Aigle in France in 1803 was investigated by the physicist Jean-Baptiste Biot.","q":"How can you tell a meteorite from an ordinary rock?"},{"id":"earth-030","t":"Clair Patterson: Earth's age and the lead war","s":"Earth Science","tp":"Rocks and geology","sub":"Radiometric dating","lv":["GCSE","A-Level"],"who":"Clair Patterson","f":0,"loc":"USA","rg":["North & Central America"],"yr":1956,"era":"1950–1999","tag":"Discovery","x":"To find Earth's age, the American geochemist Clair Patterson measured lead isotopes from the Canyon Diablo meteorite, assumed to have formed with the Earth. His samples kept getting contaminated with lead from the environment, so he built one of the first ultra-clean laboratories. In 1956 he announced that Earth is about 4.55 billion years old – a figure still accepted. He then realised the lead contamination came from leaded petrol, which had spread lead everywhere, and campaigned for decades against powerful industries until it was banned.","q":"Why does radioactive decay act as a clock?"},{"id":"earth-031","t":"Arthur Holmes and the age of rocks","s":"Earth Science","tp":"Rocks and geology","sub":"Radiometric dating","lv":["GCSE","A-Level"],"who":"Arthur Holmes","f":0,"loc":"UK / Mozambique","rg":["Africa","Europe"],"yr":1913,"era":"1900–1949","tag":"Discovery","x":"Arthur Holmes, a British geologist, pioneered using radioactive decay to date rocks. He went on an expedition to Mozambique in 1911, where he nearly died of malaria. In 1913 he published 'The Age of the Earth', arguing it was at least 1.6 billion years old, far older than Kelvin had calculated. In the 1920s and 30s he suggested that slow convection currents in the mantle could move continents – the missing mechanism for Wegener's drift.","q":"How can convection in the mantle move plates?"},{"id":"earth-032","t":"Giant's Causeway: lava or giants?","s":"Earth Science","tp":"Rocks and geology","sub":"Igneous rock","lv":["KS3","GCSE"],"who":"","f":0,"loc":"Northern Ireland","rg":["Europe"],"yr":1771,"era":"1700s","tag":"Nature","x":"On the coast of County Antrim around 40,000 interlocking columns of dark rock, most with six sides, rise from the sea. Legend says the giant Finn McCool built them as a path to Scotland, where similar columns appear on the island of Staffa. Scientists argued whether they formed from water or fire. In 1771 the French geologist Nicolas Desmarest showed similar columns in France were volcanic. The columns formed about 60 million years ago when a thick lava flow cooled and contracted, cracking in a regular pattern.","q":"Why do cooling lava flows crack into hexagons?"},{"id":"earth-033","t":"The Hoba meteorite","s":"Earth Science","tp":"Rocks and geology","sub":"Meteorites","lv":["KS3"],"who":"Jacobus Hermanus Brits","f":0,"loc":"Namibia","rg":["Africa"],"yr":1920,"era":"1900–1949","tag":"Discovery","x":"In 1920 a farmer named Jacobus Brits was ploughing his land near Grootfontein in Namibia when his plough scraped on something metallic. It turned out to be the largest known meteorite on Earth: a slab of iron and nickel weighing about 60 tonnes. It is so heavy it has never been moved and lies where it fell around 80,000 years ago. It has no crater, perhaps because its flat shape made it skim through the atmosphere and land slowly.","q":"Why are iron meteorites more likely to survive than stony ones?"},{"id":"earth-034","t":"Aboriginal astronomers and the emu in the sky","s":"Physics","tp":"Space","sub":"Ancient astronomy","lv":["KS3","GCSE"],"who":"","f":0,"loc":"Australia","rg":["Oceania"],"yr":-1000,"era":"Ancient","tag":"Discovery","x":"Aboriginal Australians have watched the sky for tens of thousands of years and have some of the oldest astronomical traditions in the world. Instead of only joining bright stars, many groups see shapes in the
