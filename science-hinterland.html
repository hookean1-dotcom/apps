ons. When Queen Victoria accepted chloroform for the birth of Prince Leopold in 1853, it became respectable.","q":"Why was testing chemicals by sniffing them so dangerous?"},{"id":"bio3-048","t":"Lister's carbolic spray","s":"Biology","tp":"Disease and immunity","sub":"Antiseptics","lv":["KS3","GCSE"],"who":"Joseph Lister, Agnes Lister","f":1,"loc":"UK","rg":["Europe"],"yr":1867,"era":"1800s","tag":"Discovery","x":"In the 1860s around half of patients who had limbs amputated died of infection afterwards. In Glasgow, the surgeon Joseph Lister read Pasteur's work on germs and wondered whether microbes caused wound infections. Carbolic acid was being used to treat sewage, so in 1865 he used it to clean the wound of an 11-year-old boy with a broken leg, and it healed cleanly. He later used a carbolic spray in operating theatres. His wife Agnes helped with his experiments and wrote up his notes. Deaths after surgery fell dramatically.","q":"Why do surgeons now prefer sterile instruments to antiseptic sprays?"},{"id":"bio3-049","t":"Thomas Brock's hot spring bacterium","s":"Biology","tp":"Microorganisms","sub":"Extremophiles","lv":["GCSE","A-Level"],"who":"Thomas Brock, Hudson Freeze, Kary Mullis","f":0,"loc":"USA","rg":["North & Central America"],"yr":1969,"era":"1950–1999","tag":"Discovery","x":"In 1966 the microbiologist Thomas Brock and his student Hudson Freeze collected bacteria from Mushroom Spring in Yellowstone National Park, where the water is around 70 °C. In 1969 they described Thermus aquaticus, which thrives in near-boiling water. Its enzymes do not fall apart in heat. Years later, Kary Mullis's PCR technique for copying DNA needed repeated heating, and the heat-proof DNA polymerase from Thermus aquaticus, Taq, made PCR fast and cheap. It is used in COVID tests and forensics.","q":"Why would an enzyme from a hot spring be useful for copying DNA?"},{"id":"bio3-050","t":"Kary Mullis and PCR on a night drive","s":"Biology","tp":"Genetics","sub":"PCR","lv":["GCSE","A-Level"],"who":"Kary Mullis","f":0,"loc":"USA","rg":["North & Central America"],"yr":1983,"era":"1950–1999","tag":"Discovery","x":"One night in 1983, driving along a winding California road, the chemist Kary Mullis thought of a way to copy a chosen piece of DNA over and over: heat the DNA to separate the strands, cool it so short primers attach, then let an enzyme build new strands – and repeat. Each cycle doubles the DNA, so 30 cycles make about a billion copies. PCR transformed genetics, medicine and forensics and won him the 1993 Nobel Prize. Mullis also held many controversial and unscientific views.","q":"How many copies would 10 PCR cycles make from one DNA molecule?"},{"id":"bio3-051","t":"Fleming's runny nose and lysozyme","s":"Biology","tp":"Disease and immunity","sub":"Defences","lv":["GCSE"],"who":"Alexander Fleming, V. D. Allison","f":0,"loc":"UK","rg":["Europe"],"yr":1921,"era":"1900–1949","tag":"Accident","x":"In 1921, seven years before penicillin, Alexander Fleming had a cold. He added a drop of his nasal mucus to a dish of bacteria, and it killed them. He went on to find the same substance in tears, saliva and egg white, and called it lysozyme – an enzyme that breaks down bacterial cell walls. Lab colleagues were reportedly asked to cry, with lemon juice, to supply tears. Lysozyme is one of the body's natural defences, though it does not work on most dangerous bacteria.","q":"What other natural barriers protect the body from microbes?"},{"id":"bio3-052","t":"Hans Christian Gram's stain","s":"Biology","tp":"Microorganisms","sub":"Bacteria","lv":["GCSE","A-Level"],"who":"Hans Christian Gram","f":0,"loc":"Denmark / Germany","rg":["Europe"],"yr":1884,"era":"1800s","tag":"Discovery","x":"In 1884 the Danish doctor Hans Christian Gram, working in a Berlin morgue lab, was trying to make bacteria stand out in lung tissue. He found that after staining with crystal violet and iodine, then washing with alcohol, some bacteria stayed purple while others lost the colour. He modestly said his method was 'very defective'. The difference is caused by the thickness of bacterial cell walls, and the Gram stain is still the first test used to identify bacteria and choose antibiotics.","q":"Why would cell wall thickness affect which antibiotics work?"},{"id":"bio3-053","t":"Conan the bacterium","s":"Biology","tp":"Microorganisms","sub":"Extremophiles","lv":["GCSE"],"who":"Arthur Anderson","f":0,"loc":"USA","rg":["North & Central America"],"yr":1956,"era":"1950–1999","tag":"Discovery","x":"In 1956, at an agricultural lab in Oregon, Arthur Anderson was testing whether intense gamma radiation could sterilise tinned meat. One tin spoiled anyway. The culprit was a pink bacterium, Deinococcus radiodurans, which can survive radiation thousands of times stronger than would kill a human. It has nicknames like 'Conan the Bacterium'. It survives because it can rapidly repair its shattered DNA using multiple copies of its genome. Scientists have tested whether it could survive on the outside of the International Space Station.","q":"How can having extra copies of DNA help a cell repair damage?"},{"id":"bio3-054","t":"Ideonella: the plastic-eating bacterium","s":"Biology","tp":"Microorganisms","sub":"Biotechnology","lv":["GCSE","A-Level"],"who":"Kohei Oda, Shosuke Yoshida","f":0,"loc":"Japan","rg":["East Asia"],"yr":2016,"era":"2000 onwards","tag":"Modern research","x":"Plastic bottles made of PET were thought to be almost impossible for living things to digest. Researchers led by Kohei Oda collected 250 samples of sludge, soil and water from outside a bottle recycling plant in Sakai, Japan. In 2016 they reported a bacterium, Ideonella sakaiensis, that uses two enzymes to break PET down and feed on it. Scientists around the world are now improving those enzymes to recycle plastic more efficiently.","q":"Why might bacteria evolve to digest plastic only recently?"},{"id":"bio3-055","t":"Ge Hong's 'yellow soup'","s":"Biology","tp":"Health","sub":"Microbiome","lv":["GCSE","A-Level"],"who":"Ge Hong, Li Shizhen","f":0,"loc":"China","rg":["East Asia"],"yr":340,"era":"Ancient","tag":"Discovery","x":"Around the 4th century, the Chinese physician and alchemist Ge Hong described treating patients with severe diarrhoea with a 'yellow soup' made from human faeces. In the 16th century, Li Shizhen described similar preparations. Modern faecal transplants, which put healthy gut bacteria into a patient's intestine, are now used in hospitals to cure stubborn Clostridioides difficile infections, with success rates around 90%. Ge Hong also described the cold-water extraction of sweet wormwood that inspired Tu Youyou.","q":"Why might a healthy community of gut bacteria protect against harmful ones?"},{"id":"bio3-056","t":"Thomas Hunt Morgan's white-eyed fly","s":"Biology","tp":"Genetics","sub":"Sex linkage","lv":["GCSE","A-Level"],"who":"Thomas Hunt Morgan, Alfred Sturtevant, Calvin Bridges","f":0,"loc":"USA","rg":["North & Central America"],"yr":1910,"era":"1900–1949","tag":"Discovery","x":"In 1910, in a small, crowded lab at Columbia University called the 'Fly Room', Thomas Hunt Morgan bred fruit flies in milk bottles. One male had white eyes instead of red. When bred, the white-eye trait turned up almost only in males, so Morgan concluded the gene must be on the X chromosome – proof that genes sit on chromosomes. In 1913 his undergraduate student Alfred Sturtevant stayed up one night and made the first genetic map of a chromosome. Morgan won the 1933 Nobel Prize.","q":"Why do sex-linked conditions affect males more often?"},{"id":"bio3-057","t":"Griffith's mice and the transforming principle","s":"Biology","tp":"Genetics","sub":"DNA","lv":["A-Level"],"who":"Frederick Griffith, Oswald Avery, Colin MacLeod, Maclyn McCarty","f":0,"loc":"UK / USA","rg":["North & Central America","Europe"],"yr":1928,"era":"1900–1949","tag":"Discovery","x":"In 1928, the British medical officer Frederick Griffith injected mice with a harmless strain of pneumonia bacteria mixed with dead, heat-killed deadly bacteria. The mice died, and live deadly bacteria were found in them – something had transformed the harmless strain. In 1944 Oswald Avery, Colin MacLeod and Maclyn McCarty in New York showed that the 'transforming principle' was DNA. Many scientists still doubted that DNA, not protein, carried genes. Griffith was killed in the London Blitz in 1941.","q":"How did Avery's team show it was DNA and not protein?"},{"id":"bio3-058","t":"Martha Chase and the kitchen blender","s":"Biology","tp":"Genetics","sub":"DNA","lv":["A-Level"],"who":"Martha Chase, Alfred Hershey","f":1,"loc":"USA","rg":["North & Central America"],"yr":1952,"era":"1950–1999","tag":"Hidden figure","x":"In 1952 at Cold Spring Harbor, Alfred Hershey and his 24-year-old technician Martha Chase labelled viruses that infect bacteria with radioactive sulphur (in protein) or radioactive phosphorus (in DNA). After the viruses attached to bacteria, they shook them off in a Waring kitchen blender. The radioactive phosphorus ended up inside the bacteria, but the sulphur did not – showing that DNA is the genetic material that enters the cell. Hershey shared a Nobel Prize in 1969; Chase was not included.","q":"Why were two different radioactive labels needed?"},{"id":"bio3-059","t":"The most beautiful experiment in biology","s":"Biology","tp":"Genetics","sub":"DNA replication","lv":["A-Level"],"who":"Matthew Meselson, Franklin Stahl","f":0,"loc":"USA","rg":["North & Central America"],"yr":1958,"era":"1950–1999","tag":"Discovery","x":"How does DNA copy itself? In 1958 Matthew Meselson and Franklin Stahl grew bacteria on food containing heavy nitrogen-15, then moved them to normal nitrogen-14 and let them divide. Spinning the DNA in a dense salt solution separated heavy, medium and light DNA into bands. After one generation all the DNA was medium; after two, half medium and half light. Each new DNA molecule keeps one old strand: semi-conservative replication. The experiment is often called the most beautiful in biology.","q":"Predict the bands after three generations."},{"id":"bio3-060","t":"Fred Sanger: two Nobel Prizes","s":"Biology","tp":"Genetics","sub":"Sequencing","lv":["A-Level"],"who":"Frederick Sanger","f":0,"loc":"UK","rg":["Europe"],"yr":1977,"era":"1950–1999","tag":"Discovery","x":"Frederick Sanger, a Quaker from Gloucestershire who described himself as 'just a chap who messed about in a lab', worked out the sequence of amino acids in insulin in 1955, proving proteins have a precise sequence. He won the Nobel Prize in Chemistry in 1958. He then developed a method to read the sequence of DNA, published in 1977, and won a second Chemistry Nobel in 1980 – one of only five people to win two. He turned down a knighthood. The Sanger Institute near Cambridge is named after him.","q":"Why is knowing a gene's DNA sequence so useful?"},{"id":"bio3-061","t":"Nirenberg and Matthaei crack the first codon","s":"Biology","tp":"Genetics","sub":"Genetic code","lv":["A-Level"],"who":"Marshall Nirenberg, Heinrich Matthaei","f":0,"loc":"USA / Germany","rg":["North & Central America","Europe"],"yr":1961,"era":"1950–1999","tag":"Discovery","x":"At 3 am on 27 May 1961, at the US National Institutes of Health, the German postdoc Heinrich Matthaei added an artificial RNA made only of uracil (UUUUU…) to a mixture of cell extracts. It produced a protein made only of the amino acid phenylalanine. So the triplet UUU codes for phenylalanine – the first word of the genetic code was read. Within five years all 64 codons were decoded. Marshall Nirenberg shared the 1968 Nobel Prize; Matthaei was not included.","q":"How many different codons are possible with four bases in groups of three?"},{"id":"bio3-062","t":"Nancy Wexler and the villages of Lake Maracaibo","s":"Biology","tp":"Genetics","sub":"Inherited disorders","lv":["GCSE","A-Level"],"who":"Nancy Wexler, James Gusella","f":1,"loc":"Venezuela / USA","rg":["South America","North & Central America"],"yr":1983,"era":"1950–1999","tag":"Hidden figure","x":"Nancy Wexler's mother had Huntington's disease, an inherited brain disorder, so Nancy had a 50% chance of inheriting it. Around Lake Maracaibo in Venezuela, many families carry the faulty gene. From 1979 she led expeditions there, building a family tree of over 18,000 people and collecting blood samples. In 1983, using this data, James Gusella's team located the gene on chromosome 4 – one of the first disease genes found this way. It was identified exactly in 1993.","q":"Why are very large families useful for finding disease genes?"},{"id":"bio3-063","t":"Anthony Allison: sickle cells and malaria","s":"Biology","tp":"Evolution","sub":"Natural selection","lv":["GCSE","A-Level"],"who":"Anthony Allison","f":0,"loc":"Kenya / UK","rg":["Africa","Europe"],"yr":1954,"era":"1950–1999","tag":"Discovery","x":"Sickle cell anaemia is a serious inherited disease, so why is the gene common in parts of Africa? Anthony Allison, born in Kenya, noticed in the early 1950s that people carrying one copy of the sickle cell gene were common in areas with malaria. In 1954 he showed that carriers are partly protected from malaria. In those regions, carriers survive and have more children, so natural selection keeps the gene common. It became a classic example of a 'heterozygote advantage'.","q":"Why would a harmful gene stay common in a population?"},{"id":"bio3-064","t":"Marthe Gautier and the extra chromosome","s":"Biology","tp":"Genetics","sub":"Chromosomes","lv":["GCSE","A-Level"],"who":"Marthe Gautier, Jérôme Lejeune, Raymond Turpin","f":1,"loc":"France","rg":["Europe"],"yr":1959,"era":"1950–1999","tag":"Hidden figure","x":"In 1958, the French doctor Marthe Gautier set up a cell culture lab in Paris with almost no money, using her own salary to buy glassware. Growing cells from children with Down syndrome, she counted 47 chromosomes instead of 46. She handed her slides to a colleague, Jérôme Lejeune, to photograph. The 1959 paper announcing the extra chromosome 21 listed Lejeune as first author, and he received the credit and awards. Decades later, Gautier publicly told the story of how her role had been sidelined.","q":"How does an extra copy of a chromosome affect development?"},{"id":"bio3-065","t":"Vavilov's seed bank and the siege of Leningrad","s":"Biology","tp":"Genetics","sub":"Gene banks","lv":["GCSE","A-Level"],"who":"Nikolai Vavilov, Trofim Lysenko","f":0,"loc":"Russia","rg":["Europe"],"yr":1942,"era":"1900–1949","tag":"Tragedy","x":"Nikolai Vavilov travelled across five continents collecting crop seeds, building the world's largest seed bank in Leningrad to help breed better crops. But Stalin favoured Trofim Lysenko, who rejected genetics. Vavilov was arrested in 1940 and died of starvation in prison in 1943. During the 900-day siege of Leningrad, staff at his institute guarded the seeds from rats and starving people; several scientists starved to death surrounded by sacks of rice and grain they refused to eat. The collection survives.","q":"Why are seed banks important for the future of food?"},{"id":"bio3-066","t":"Svante Pääbo and the Neanderthal in us","s":"Biology","tp":"Evolution","sub":"Human evolution","lv":["GCSE","A-Level"],"who":"Svante Pääbo","f":0,"loc":"Sweden / Germany / Russia","rg":["Europe"],"yr":2010,"era":"2000 onwards","tag":"Discovery","x":"As a PhD student, Svante Pääbo secretly extracted DNA from an Egyptian mummy. Later, in Leipzig, he developed ways to read DNA from bones tens of thousands of years old. In 2010 his team published the Neanderthal genome and showed that most people of non-African descent carry about 1–2% Neanderthal DNA. The same year, DNA from a tiny finger bone found in Denisova Cave in Siberia revealed a previously unknown human group, the Denisovans. He won the 2022 Nobel Prize; his father had won one in 1982.","q":"What does shared DNA tell us about ancient human populations?"},{"id":"bio3-067","t":"Mary Leakey's footprints at Laetoli","s":"Biology","tp":"Evolution","sub":"Human evolution","lv":["KS3","GCSE"],"who":"Mary Leakey, Paul Abell","f":1,"loc":"Tanzania","rg":["Africa"],"yr":1978,"era":"1950–1999","tag":"Discovery","x":"Around 3.6 million years ago, a volcano near Laetoli in Tanzania covered the ground with ash, which rain turned into something like wet cement. Hominins walked across it and their footprints hardened. In 1976 members of Mary Leakey's team, larking about throwing elephant dung at each other, noticed animal prints; in 1978 Paul Abell found the first hominin footprints. The trail shows a big toe in line with the others and a heel strike – they walked upright like us. Mary Leakey had earlier found important fossils at Olduvai Gorge.","q":"What can footprints tell us that bones cannot?"},{"id":"bio3-068","t":"Kamoya Kimeu and Turkana Boy","s":"Biology","tp":"Evolution","sub":"Human evolution","lv":["KS3","GCSE"],"who":"Kamoya Kimeu, Richard Leakey, Alan Walker","f":0,"loc":"Kenya","rg":["Africa"],"yr":1984,"era":"1950–1999","tag":"Hidden figure","x":"Kamoya Kimeu, a Kenyan fossil hunter, found more important hominin fossils than almost anyone. In August 1984, near Lake Turkana, he spotted a small fragment of skull on a slope. Over five field seasons, the team uncovered the most complete early human skeleton ever found: a Homo erectus youth about 1.5 million years old, known as Turkana Boy or Nariokotome Boy. He was tall with long legs, built for walking and running in hot, open country. Kimeu received a special medal from the National Geographic Society, and a fossil primate, Kamoyapithecus, is named after him.","q":"How can a skeleton show that a species was adapted to a hot climate?"},{"id":"bio3-069","t":"Raymond Dart and the Taung Child","s":"Biology","tp":"Evolution","sub":"Human evolution","lv":["KS3","GCSE"],"who":"Raymond Dart, Josephine Salmons","f":1,"loc":"South Africa","rg":["Africa"],"yr":1924,"era":"1900–1949","tag":"Discovery","x":"In 1924 a student, Josephine Salmons, brought her anatomy professor Raymond Dart a fossil baboon skull from a quarry at Taung. Dart asked for more. A box of rocks arrived on the day he was due to be best man at a wedding; he found inside a natural cast of a brain and a child's skull. Using his wife's knitting needles, he spent weeks chipping it free. He named it Australopithecus africanus and argued humans evolved in Africa. Leading scientists dismissed it for over 20 years, partly because the fake Piltdown Man misled them.","q":"Why did many scientists expect human ancestors to be found in Europe or Asia?"},{"id":"bio3-070","t":"Piltdown Man: the 40-year hoax","s":"Biology","tp":"Health","sub":"Fraud","lv":["KS3","GCSE"],"who":"Charles Dawson, Kenneth Oakley","f":0,"loc":"UK","rg":["Europe"],"yr":1912,"era":"1900–1949","tag":"Blunder","x":"In 1912 the amateur collector Charles Dawson announced fossils from a gravel pit at Piltdown, Sussex: a human-like skull with an ape-like jaw, seemingly the 'missing link'. It fitted British scientists' expectations that a large brain evolved first. In 1953 tests showed it was a fake: a medieval human skull and an orangutan jaw, stained to look old, with teeth filed down. Fluorine dating by Kenneth Oakley helped expose it. The hoaxer was most likely Dawson himself.","q":"How did expectations help the hoax survive so long?"},{"id":"bio3-071","t":"Hydrothermal vents: life without sunlight","s":"Biology","tp":"Ecology","sub":"Food chains","lv":["KS3","GCSE"],"who":"Jack Corliss, Robert Ballard","f":0,"loc":"Ecuador (Galápagos Rift) / USA","rg":["South America","North & Central America"],"yr":1977,"era":"1950–1999","tag":"Discovery","x":"In February 1977 geologists in the submersible Alvin dived 2,500 m to the Galápagos Rift looking for hot water vents. They found them – and, to everyone's astonishment, thriving communities of giant tube worms, clams and crabs, in total darkness. No biologists were on board. These ecosystems depend not on sunlight but on bacteria that make food by chemosynthesis, using chemicals such as hydrogen sulphide from the vents. Some scientists think life on Earth may have begun at vents like these.","q":"What is at the bottom of a food chain where there is no sunlight?"},{"id":"bio3-072","t":"Robert Paine removes the starfish","s":"Biology","tp":"Ecology","sub":"Keystone species","lv":["GCSE","A-Level"],"who":"Robert Paine","f":0,"loc":"USA","rg":["North & Central America"],"yr":1963,"era":"1950–1999","tag":"Discovery","x":"From 1963, on the rocky shore of Mukkaw Bay in Washington State, the ecologist Robert Paine regularly prised purple starfish off one stretch of rocks and threw them into the sea, leaving a nearby stretch alone. Without the starfish, mussels took over, crowding out other species: diversity crashed from 15 species to 8. He coined the term 'keystone species' for a species whose effect on its ecosystem is far bigger than its numbers suggest. Sea otters, wolves and elephants are other examples.","q":"Why does removing one predator reduce biodiversity?"},{"id":"bio3-073","t":"Wilson and Simberloff fumigate islands","s":"Biology","tp":"Ecology","sub":"Biodiversity","lv":["A-Level"],"who":"E. O. Wilson, Daniel Simberloff","f":0,"loc":"USA","rg":["North & Central America"],"yr":1969,"era":"1950–1999","tag":"Eccentric","x":"How do species colonise new islands? In 1966–67, E. O. Wilson and his student Daniel Simberloff counted every insect and spider on several tiny mangrove islands in the Florida Keys, then hired a pest-control company to cover each island in a tent and fumigate it, killing all the arthropods. Over the next two years they watched life return. Islands closer to the mainland were recolonised faster, and each recovered to about its original number of species – supporting the theory of island biogeography.","q":"Why would islands closer to the mainland be recolonised faster?"},{"id":"bio3-074","t":"The Cuyahoga River catches fire","s":"Biology","tp":"Ecology","sub":"Pollution","lv":["KS3","GCSE"],"who":"","f":0,"loc":"USA","rg":["North & Central America"],"yr":1969,"era":"1950–1999","tag":"Tragedy","x":"Industrial waste and oil floating on the Cuyahoga River in Cleveland, Ohio, caught fire at least a dozen times from 1868 onwards. A fire on 22 June 1969 was small, but a magazine photo of a much larger 1952 fire made it a national symbol of pollution. Nearby Lake Erie was declared 'dead' as fertiliser and sewage caused huge algal blooms (eutrophication). The outrage helped lead to the US Clean Water Act. Fish have returned to the Cuyahoga.","q":"How do fertilisers running into lakes kill fish?"},{"id":"bio3-075","t":"The Red Kites of Wales","s":"Biology","tp":"Ecology","sub":"Conservation","lv":["KS3","GCSE"],"who":"","f":0,"loc":"Wales","rg":["Europe"],"yr":1990,"era":"1950–1999","tag":"Discovery","x":"Red kites were once common across Britain, even scavenging in London's streets, but persecution wiped them out from England and Scotland by the late 1800s. A tiny population survived in the remote valleys of mid-Wales, at one time perhaps only a few pairs, protected for decades by local landowners and volunteers who guarded nests from egg collectors. Combined with reintroductions in England and Scotland from 1989, the population has recovered to thousands of pairs, and the red kite is now a symbol of Wales.","q":"What threats do birds of prey face, and how can they be protected?"},{"id":"bio3-076","t":"Catalina Aguado finds the monarchs","s":"Biology","tp":"Behaviour","sub":"Migration","lv":["KS3","GCSE"],"who":"Catalina Aguado, Kenneth Brugger, Fred Urquhart, Norah Urquhart","f":1,"loc":"Mexico / Canada","rg":["North & Central America"],"yr":1975,"era":"1950–1999","tag":"Hidden figure","x":"Canadian zoologists Fred and Norah Urquhart spent decades tagging monarch butterflies with volunteers to find where eastern monarchs spend the winter. On 2 January 1975, Catalina Aguado and her partner Kenneth Brugger, exploring the mountains of Michoacán in Mexico, found fir trees draped with millions of orange butterflies, at over 3,000 m. Local people had long known they gathered there. Monarchs fly up to 4,000 km, a journey that takes several generations to complete.","q":"How can an insect navigate a route it has never flown?"},{"id":"bio3-077","t":"Katy Payne hears elephants 'speak' below hearing","s":"Biology","tp":"Senses","sub":"Infrasound","lv":["KS3","GCSE"],"who":"Katy Payne, Roger Payne","f":1,"loc":"USA / Kenya","rg":["Africa","North & Central America"],"yr":1984,"era":"1950–1999","tag":"Discovery","x":"In 1967 Roger and Katy Payne discovered that humpback whale songs have repeating themes, and their recording album helped launch the 'Save the Whales' movement; Katy later showed whale songs change over time. In 1984, standing near elephants at a zoo in Portland, Oregon, Katy felt a throbbing in the air, like the deep notes of a church organ. Recording with special equipment, she showed elephants communicate with infrasound, too low for humans to hear, which can travel several kilometres.","q":"Why does low-frequency sound travel further than high-frequency sound?"},{"id":"bio3-078","t":"Clever Hans, the horse who couldn't count","s":"Biology","tp":"Behaviour","sub":"Fair testing","lv":["KS3","GCSE"],"who":"Wilhelm von Osten, Oskar Pfungst","f":0,"loc":"Germany","rg":["Europe"],"yr":1907,"era":"1900–1949","tag":"Blunder","x":"In the early 1900s a horse in Berlin called Clever Hans became famous for tapping out the answers to sums with his hoof. His owner, a maths teacher, was not cheating. In 1907 the psychologist Oskar Pfungst showed that Hans got answers right only when the questioner knew the answer and Hans could see them. The horse was picking up tiny, unconscious changes in posture and expression when he reached the right number. 'Clever Hans effects' are why good experiments are run 'blind'.","q":"Why are experiments on animals or people often done 'blind'?"},{"id":"bio3-079","t":"Konrad Lorenz's goslings","s":"Biology","tp":"Behaviour","sub":"Imprinting","lv":["KS3","GCSE"],"who":"Konrad Lorenz, Niko Tinbergen","f":0,"loc":"Austria / Netherlands / UK","rg":["Europe"],"yr":1935,"era":"1900–1949","tag":"Discovery","x":"In the 1930s Konrad Lorenz showed that newly hatched greylag goslings follow the first moving object they see – usually their mother, but if it was Lorenz, they followed him everywhere, even swimming after him. He called this 'imprinting'. Lorenz, Niko Tinbergen (who showed herring gull chicks peck at the red spot on their parents' beaks) and Karl von Frisch shared the 1973 Nobel Prize for founding the study of animal behaviour. Lorenz's support for Nazi ideas in the war years has since been widely condemned.","q":"Why would imprinting usually help a gosling survive?"},{"id":"bio3-080","t":"The immortal jellyfish","s":"Biology","tp":"Cells","sub":"Ageing","lv":["KS3","GCSE"],"who":"Christian Sommer","f":0,"loc":"Italy / Germany","rg":["Europe"],"yr":1988,"era":"1950–1999","tag":"Discovery","x":"In 1988 the German marine biology student Christian Sommer was keeping tiny jellyfish called Turritopsis dohrnii, collected on the Italian Riviera, in his lab. He noticed some never seemed to die. When stressed or injured, the adult jellyfish turns back into a young polyp, reversing its life cycle, and can then grow up again – potentially indefinitely. Its cells transform from one type into another. In the wild most are still eaten or killed by disease.","q":"Why are scientists interested in cells that can change type?"},{"id":"bio3-081","t":"Edith Widder and the first giant squid video","s":"Biology","tp":"Adaptations","sub":"Bioluminescence","lv":["KS3","GCSE"],"who":"Edith Widder, Tsunemi Kubodera","f":1,"loc":"Japan / USA","rg":["East Asia","North & Central America"],"yr":2012,"era":"2000 onwards","tag":"Modern research","x":"The giant squid, the basis of sea monster legends, had never been filmed alive in the deep sea. Edith Widder, an expert in bioluminescence, reasoned that bright submarine lights scare animals away. She designed a camera using red light that most deep-sea animals cannot see, and a lure called the 'e-jelly' that flashed blue like a jellyfish under attack, attracting predators. In 2012, off Japan's Ogasawara Islands, with Japanese zoologist Tsunemi Kubodera, it worked: the first video of a live giant squid in its home.","q":"Why would a predator be attracted to a jellyfish's alarm signal?"},{"id":"chem3-001","t":"J. J. Thomson finds the electron","s":"Chemistry","tp":"Atomic structure","sub":"Electrons","lv":["GCSE","A-Level"],"who":"J. J. Thomson","f":0,"loc":"UK","rg":["Europe"],"yr":1897,"era":"1800s","tag":"Discovery","x":"In 1897 at the Cavendish Laboratory in Cambridge, J. J. Thomson bent cathode rays with electric and magnetic fields and worked out their charge-to-mass ratio. They were particles about 2,000 times lighter than a hydrogen atom, the same whatever metal or gas he used. Atoms were not indivisible after all. He proposed the 'plum pudding' model, with electrons dotted in a positive sphere. In 1937 his son George won a Nobel Prize for showing electrons also behave as waves.","q":"What evidence showed electrons were smaller than atoms?"},{"id":"chem3-002","t":"Frederick Soddy, Margaret Todd and the word 'isotope'","s":"Chemistry","tp":"Atomic structure","sub":"Isotopes","lv":["GCSE","A-Level"],"who":"Frederick Soddy, Margaret Todd","f":1,"loc":"UK","rg":["Europe"],"yr":1913,"era":"1900–1949","tag":"Hidden figure","x":"By 1913 Frederick Soddy in Glasgow had found that some radioactive substances were chemically identical but had different masses and radioactive properties. Explaining this at a dinner party at his father-in-law's house, he was given a name by Margaret Todd, a Scottish doctor and novelist: 'isotope', from the Greek for 'same place', because they occupy the same place in the periodic table. Soddy won the 1921 Nobel Prize in Chemistry.","q":"How do isotopes of the same element differ?"},{"id":"chem3-003","t":"Francis Aston weighs atoms","s":"Chemistry","tp":"Atomic structure","sub":"Mass spectrometry","lv":["GCSE","A-Level"],"who":"Francis Aston","f":0,"loc":"UK","rg":["Europe"],"yr":1919,"era":"1900–1949","tag":"Invention","x":"In 1919 Francis Aston, working at the Cavendish Laboratory, built a mass spectrograph that sorted charged atoms by mass using electric and magnetic fields, recording them as lines on a photographic plate. He found 212 naturally occurring isotopes and showed that most elements are mixtures, explaining why relative atomic masses like chlorine's 35.5 are not whole numbers. Aston was also a keen skier, golfer and amateur photographer. He won the 1922 Nobel Prize.","q":"Why is the relative atomic mass of chlorine 35.5?"},{"id":"chem3-004","t":"Döbereiner's triads","s":"Chemistry","tp":"Periodic table","sub":"History","lv":["GCSE"],"who":"Johann Döbereiner","f":0,"loc":"Germany","rg":["Europe"],"yr":1829,"era":"1800s","tag":"Discovery","x":"Johann Döbereiner, the son of a coachman who taught himself chemistry, noticed in 1829 that some elements came in groups of three with similar properties – such as chlorine, bromine and iodine, or calcium, strontium and barium – and that the middle element's atomic mass was roughly the average of the other two. These 'triads' were one of the first hints of a pattern among the elements. He also invented a lighter using hydrogen and a platinum catalyst, sold widely before matches.","q":"Check Döbereiner's idea using lithium, sodium and potassium."},{"id":"chem3-005","t":"Newlands' octaves: laughed out of the room","s":"Chemistry","tp":"Periodic table","sub":"History","lv":["GCSE"],"who":"John Newlands","f":0,"loc":"UK","rg":["Europe"],"yr":1865,"era":"1800s","tag":"Rivalry","x":"In 1865 the London chemist John Newlands arranged the known elements by atomic mass and noticed that every eighth element had similar properties, like octaves in music. When he presented his 'law of octaves' to the Chemical Society in 1866, one member sarcastically asked whether he had tried arranging the elements alphabetically. The society refused to publish his paper. Some of his groups did not work, but after Mendeleev's success the Royal Society gave Newlands the Davy Medal in 1887.","q":"Why did Newlands' pattern break down for heavier elements?"},{"id":"chem3-006","t":"Julia Lermontova and the platinum metals","s":"Chemistry","tp":"Periodic table","sub":"Transition metals","lv":["GCSE","A-Level"],"who":"Julia Lermontova, Dmitri Mendeleev","f":1,"loc":"Russia / Germany","rg":["Europe"],"yr":1874,"era":"1800s","tag":"Hidden figure","x":"Julia Lermontova could not study at a Russian university because she was a woman, so she went to Heidelberg, working with Bunsen, and then Göttingen, where in 1874 she became the first Russian woman to earn a doctorate in chemistry. Mendeleev asked her to help separate the difficult platinum-group metals – ruthenium, rhodium, palladium, osmium, iridium and platinum – to clarify where they belonged in his periodic table. She later worked on petroleum chemistry and ran a farm.","q":"Why were the platinum group metals hard to separate?"},{"id":"chem3-007","t":"Ytterby: one village, four elements","s":"Chemistry","tp":"Periodic table","sub":"Rare earths","lv":["KS3","GCSE"],"who":"Carl Axel Arrhenius, Johan Gadolin, Carl Mosander","f":0,"loc":"Sweden / Finland","rg":["Europe"],"yr":1794,"era":"1700s","tag":"Discovery","x":"In 1787 an army lieutenant, Carl Axel Arrhenius, found an unusually heavy black rock in a quarry at Ytterby, a village near Stockholm. The Finnish chemist Johan Gadolin analysed it and found a new earth, yttria. Over the next century, chemists extracted many rare earth elements from Ytterby minerals. Four are named after the village: yttrium, ytterbium, terbium and erbium. Gadolinium is named after Gadolin. Rare earths are now essential for magnets in wind turbines, phones and electric cars.","q":"Why are rare earth elements so important to modern technology?"},{"id":"chem3-008","t":"Iodine from seaweed and gunpowder","s":"Chemistry","tp":"Periodic table","sub":"Halogens","lv":["KS3","GCSE"],"who":"Bernard Courtois","f":0,"loc":"France","rg":["Europe"],"yr":1811,"era":"1800s","tag":"Accident","x":"During the Napoleonic Wars, France needed saltpetre for gunpowder. Bernard Courtois extracted it partly from seaweed ash. In 1811, while cleaning his vats with sulphuric acid, he added too much and saw a cloud of beautiful violet vapour rise, which condensed into dark shiny crystals on cold surfaces. It was a new element, named iodine from the Greek for violet. Iodine was soon used to treat goitre, a swelling of the thyroid gland caused by lack of iodine in the diet.","q":"What do you see when iodine is heated?"},{"id":"chem3-009","t":"Diamonds burned in Florence","s":"Chemistry","tp":"Bonding","sub":"Allotropes","lv":["KS3","GCSE"],"who":"Giuseppe Averani, Cipriano Targioni, Antoine Lavoisier, Smithson Tennant","f":0,"loc":"Italy / France / UK","rg":["Europe"],"yr":1694,"era":"1500–1699","tag":"Discovery","x":"In 1694, in Florence, Giuseppe Averani and Cipriano Targioni used a giant burning lens belonging to Grand Duke Cosimo III to focus sunlight on a diamond. It cracked, sparked and disappeared. In 1772 Lavoisier burned diamonds in sealed jars and found carbon dioxide was produced, and in 1797 Smithson Tennant showed that equal masses of diamond and charcoal produce the same amount of carbon dioxide. Diamond is just carbon arranged differently – an allotrope.","q":"Why are diamond and graphite so different if both are pure carbon?"},{"id":"chem3-010","t":"Scheele's green and Napoleon's wallpaper","s":"Chemistry","tp":"Chemical analysis","sub":"Toxicology","lv":["KS3","GCSE"],"who":"Carl Wilhelm Scheele, James Marsh","f":0,"loc":"Sweden / UK","rg":["Europe"],"yr":1775,"era":"1700s","tag":"Tragedy","x":"In 1775 Scheele made a vivid green pigment, copper arsenite. Scheele's green and the similar Paris green became hugely fashionable for wallpaper, dresses and even sweets in the 1800s. In damp rooms, moulds could release arsenic compounds, and many people fell ill. Napoleon's wallpaper on St Helena contained the pigment, and arsenic in his hair has fuelled theories, though most historians think he died of stomach cancer. In 1836 the British chemist James Marsh devised a sensitive test for arsenic.","q":"Why are chemical tests for poisons important?"},{"id":"chem3-011","t":"Tin pest: Napoleon's buttons and Scott's fuel","s":"Chemistry","tp":"Bonding","sub":"Allotropes","lv":["GCSE"],"who":"Robert Falcon Scott","f":0,"loc":"Russia / Antarctica","rg":["Antarctica & Arctic","Europe"],"yr":1912,"era":"1900–1949","tag":"Everyday","x":"Below 13 °C, shiny white tin can slowly change into a brittle grey powder – a different allotrope – called 'tin pest'. A famous story claims the tin buttons of Napoleon's soldiers crumbled in the Russian winter of 1812; historians doubt it. Scott's Antarctic expedition in 1912 did find that paraffin fuel had leaked from cans with soldered joints, though the cause may have been poor seals rather than tin pest. Modern solders contain additives to prevent it.","q":"What is an allotrope?"},{"id":"chem3-012","t":"Zinc from Zawar","s":"Chemistry","tp":"Reactivity","sub":"Extracting metals","lv":["GCSE"],"who":"","f":0,"loc":"India","rg":["South Asia"],"yr":1000,"era":"Medieval","tag":"Discovery","x":"Zinc boils at a fairly low temperature, so when its ore is heated with carbon, it escapes as a vapour and reoxidises. At Zawar in Rajasthan, India, by around the 9th–12th centuries, metalworkers solved this with downward distillation: they heated ore in hundreds of clay retorts placed upside down, so zinc vapour condensed in cooler pots below. It was the world's first large-scale zinc production. Europe only began making zinc industrially in the 1700s, and a Bristol patent of 1738 used a very similar method.","q":"Why does zinc's low boiling point make it difficult to extract?"},{"id":"chem3-013","t":"Tutankhamun's dagger from space","s":"Chemistry","tp":"Materials","sub":"Iron","lv":["KS3","GCSE"],"who":"Daniela Comelli","f":1,"loc":"Egypt / Italy","rg":["Africa","Europe"],"yr":2016,"era":"2000 onwards","tag":"Modern research","x":"Among the treasures in Tutankhamun's tomb was a dagger with a rust-free iron blade, made over 3,300 years ago, before iron smelting was common in Egypt. In 2016 a team including the Italian physicist Daniela Comelli used X-ray fluorescence and found the blade contains about 11% nickel plus cobalt – a chemical fingerprint of iron meteorites. Ancient Egyptians may have called it 'iron from the sky'. The metal had been worked at a fairly low temperature.","q":"How can the composition of iron reveal whether it came from a meteorite?"},{"id":"chem3-014","t":"William Gregor, the vicar who found titanium","s":"Chemistry","tp":"Periodic table","sub":"Transition metals","lv":["GCSE"],"who":"William Gregor, Martin Klaproth","f":0,"loc":"UK","rg":["Europe"],"yr":1791,"era":"1700s","tag":"Discovery","x":"William Gregor was a Cornish vicar and amateur mineralogist. In 1791 he analysed black sand from a stream in the Manaccan valley and found the oxide of an unknown metal, which he called manaccanite. Four years later the German chemist Martin Klaproth found the same element in another mineral and named it titanium, after the Titans of Greek mythology. Pure titanium was not made until 1910. It is now used in aircraft, hip replacements and white paint.","q":"Why is titanium useful for hip replacements?"},{"id":"chem3-015","t":"Van 't Hoff's 3D carbon, mocked by Kolbe","s":"Chemistry","tp":"Organic chemistry","sub":"Molecular shape","lv":["A-Level"],"who":"Jacobus van 't Hoff, Joseph Le Bel, Hermann Kolbe","f":0,"loc":"Netherlands / France / Germany","rg":["Europe"],"yr":1874,"era":"1800s","tag":"Rivalry","x":"In 1874 the 22-year-old Dutch student Jacobus van 't Hoff, and independently Joseph Le Bel in France, proposed that carbon's four bonds point to the corners of a tetrahedron – molecules are three-dimensional. The famous German chemist Hermann Kolbe attacked the idea viciously, mocking van 't Hoff as a vet-school teacher who had mounted Pegasus and flown into fantasy. The tetrahedral carbon explained mirror-image molecules perfectly. In 1901 van 't Hoff won the first-ever Nobel Prize in Chemistry.","q":"What shape is a methane molecule, and why?"},{"id":"chem3-016","t":"Pasteur sorts crystals with tweezers","s":"Chemistry","tp":"Organic chemistry","sub":"Chirality","lv":["A-Level"],"who":"Louis Pasteur","f":0,"loc":"France","rg":["Europe"],"yr":1848,"era":"1800s","tag":"Discovery","x":"In 1848, aged 25, Louis Pasteur studied crystals of a salt of tartaric acid from wine-making. Under a microscope he noticed two kinds of crystal that were mirror images of each other, like left and right hands. He separated them painstakingly with tweezers. Dissolved separately, one rotated polarised light clockwise, the other anticlockwise. He had discovered molecular chirality. It mattered: in the 1950s–60s, one form of the drug thalidomide is thought to have caused birth defects.","q":"Why might mirror-image molecules behave differently in the body?"},{"id":"chem3-017","t":"Wöhler makes urea without a kidney","s":"Chemistry","tp":"Organic chemistry","sub":"Vitalism","lv":["GCSE","A-Level"],"who":"Friedrich Wöhler, Jöns Jacob Berzelius","f":0,"loc":"Germany","rg":["Europe"],"yr":1828,"era":"1800s","tag":"Discovery","x":"Many chemists believed organic compounds could only be made by living things, through a 'vital force'. In 1828 Friedrich Wöhler heated ammonium cyanate, an inorganic salt, and obtained urea, a compound found in urine. He wrote excitedly to his mentor Berzelius that he could make urea without needing kidneys, whether of man or dog. Historians now think the death of vitalism was more gradual, but Wöhler's synthesis became a symbol of the start of organic chemistry.","q":"What is the difference between organic and inorganic chemistry today?"},{"id":"chem3-018","t":"Archibald Couper: the lines that weren't published","s":"Chemistry","tp":"Organic chemistry","sub":"Structural formulae","lv":["A-Level"],"who":"Archibald Scott Couper, August Kekulé, Charles-Adolphe Wurtz","f":0,"loc":"Scotland / France","rg":["Europe"],"yr":1858,"era":"1800s","tag":"Tragedy","x":"In 1858 the young Scottish chemist Archibald Scott Couper, working in Paris, proposed that carbon atoms link to each other in chains and drew bonds as lines between atoms – the structural formulae chemists use today. His supervisor Charles-Adolphe Wurtz delayed submitting the paper, and Kekulé published similar ideas first. Couper argued with Wurtz, was dismissed, suffered a breakdown, and never did chemistry again. His contribution was rediscovered decades later.","q":"Why are structural formulae more informative than molecular formulae?"},{"id":"chem3-019","t":"Sumio Iijima's nanotubes","s":"Chemistry","tp":"Bonding","sub":"Nanomaterials","lv":["GCSE","A-Level"],"who":"Sumio Iijima","f":0,"loc":"Japan","rg":["East Asia"],"yr":1991,"era":"1950–1999","tag":"Discovery","x":"In 1991 Sumio Iijima, an electron microscopist at the NEC company in Japan, examined soot made by passing an electric arc between graphite rods – the same method used to make buckyballs. He saw tiny hollow tubes of carbon, a few nanometres wide, made of rolled-up sheets of hexagons, nested inside each other. Carbon nanotubes are extremely strong for their weight and conduct electricity, and are being used in batteries, sensors and strong composites.","q":"How is a nanotube related to graphene?"},{"id":"chem3-020","t":"Dan Shechtman's 'impossible' crystals","s":"Chemistry","tp":"Bonding","sub":"Crystals","lv":["A-Level"],"who":"Dan Shechtman, Linus Pauling","f":0,"loc":"Israel / USA","rg":["Middle East","North & Central America"],"yr":1982,"era":"1950–1999","tag":"Rivalry","x":"On 8 April 1982 Dan Shechtman, studying a rapidly cooled aluminium–manganese alloy, saw an electron diffraction pattern with tenfold symmetry – which textbooks said was impossible for a crystal. He wrote '10 fold???' in his notebook. His group leader gave him a textbook and asked him to leave the team. Linus Pauling said there were no quasicrystals, only quasi-scientists. Shechtman persisted: these 'quasicrystals' are ordered but never repeat exactly, like Islamic tile patterns. He won the 2011 Nobel Prize in Chemistry.","q":"Why should scientists take unexpected results seriously?"},{"id":"chem3-021","t":"Faraday and Whewell invent electrolysis words","s":"Chemistry","tp":"Electrochemistry","sub":"Electrolysis","lv":["GCSE"],"who":"Michael Faraday, William Whewell","f":0,"loc":"UK","rg":["Europe"],"yr":1834,"era":"1800s","tag":"Discovery","x":"In 1833–34 Michael Faraday worked out the laws of electrolysis: the mass of a substance produced is proportional to the charge passed. He needed new words, and wrote to the Cambridge scholar William Whewell for help with Greek. Together they coined 'electrode', 'anode' (way up), 'cathode' (way down), 'electrolyte', 'ion' (wanderer), 'anion' and 'cation'. Whewell also invented the words 'scientist' and 'physicist'.","q":"Which ions move towards the cathode, and why?"},{"id":"chem3-022","t":"Davy protects the Navy's copper hulls","s":"Chemistry","tp":"Reactivity","sub":"Corrosion","lv":["GCSE"],"who":"Humphry Davy","f":0,"loc":"UK","rg":["Europe"],"yr":1824,"era":"1800s","tag":"Blunder","x":"Royal Navy ships had copper sheeting to stop shipworm and barnacles, but seawater corroded it. In 1824 Humphry Davy suggested attaching small blocks of more reactive iron or zinc, which would corrode instead of the copper – sacrificial protection. It worked brilliantly: the copper stopped corroding. But without the slow release of toxic copper, barnacles and weed grew freely, slowing the ships, and the Navy abandoned the idea. Sacrificial anodes are now used on ships, pipelines and boilers.","q":"Why does a more reactive metal protect a less reactive one?"},{"id":"chem3-023","t":"Harry Brearley's rustless steel","s":"Chemistry","tp":"Materials","sub":"Alloys","lv":["KS3","GCSE"],"who":"Harry Brearley","f":0,"loc":"UK","rg":["Europe"],"yr":1913,"era":"1900–1949","tag":"Accident","x":"In 1913 Harry Brearley, a Sheffield metallurgist who had left school at 12, was looking for a steel that would resist wear in gun barrels. He made a steel with about 13% chromium. When he tried to etch it with acid to look at its structure, it barely reacted – it didn't rust or stain. The chromium forms an invisible protective oxide layer. Sheffield cutlers turned it into 'stainless' knives. Popular stories say he found it on a scrap heap, but the details are disputed.","q":"Why does adding chromium stop steel rusting?"},{"id":"chem3-024","t":"The Statue of Liberty's green coat","s":"Chemistry","tp":"Reactivity","sub":"Corrosion","lv":["KS3","GCSE"],"who":"Gustave Eiffel, Frédéric Auguste Bartholdi","f":0,"loc":"France / USA","rg":["North & Central America","Europe"],"yr":1886,"era":"1800s","tag":"Everyday","x":"When it was unveiled in 1886, the Statue of Liberty was the reddish-brown of a new copper coin. Over about 30 years, reactions with oxygen, carbon dioxide, water and sulphur compounds turned it green, forming a patina of copper carbonates and sulphates that protects the metal beneath. Its inner frame, designed by Gustave Eiffel, was iron; where it touched the copper skin, the iron corroded badly. In the 1980s it was replaced with stainless steel.","q":"Why is the green patina helpful rather than harmful?"},{"id":"chem3-025","t":"The match girls' strike","s":"Chemistry","tp":"Periodic table","sub":"Phosphorus","lv":["KS3","GCSE"],"who":"Annie Besant","f":1,"loc":"UK","rg":["Europe"],"yr":1888,"era":"1800s","tag":"Tragedy","x":"Early matches used white phosphorus, which is highly toxic. Women and girls at the Bryant & May factory in Bow, London, worked long hours dipping matches, and some developed 'phossy jaw', in which the jawbone rotted. In 1888, after the campaigner Annie Besant wrote about their conditions, around 1,400 match girls went on strike and won better pay and conditions. White phosphorus matches were banned in Britain in 1910. Safety matches use red phosphorus on the side of the box instead.","q":"Why are safety matches safer than early matches?"},{"id":"chem3-026","t":"John Walker's friction match","s":"Chemistry","tp":"Chemical reactions","sub":"Combustion","lv":["KS3"],"who":"John Walker","f":0,"loc":"UK","rg":["Europe"],"yr":1826,"era":"1800s","tag":"Accident","x":"In 1826 John Walker, a chemist in Stockton-on-Tees, was stirring a mixture of chemicals with a stick when a blob dried on the end. Scraping it on his hearth, it burst into flame. He began selling 'friction lights' in 1827 – the first friction matches – but never patented them, saying it was a benefit to the public. Others copied his idea. His early matches threw off sparks and smelled awful.","q":"What are the three things a fire needs?"},{"id":"chem3-027","t":"Davy, Stephenson and the miners' lamp","s":"Chemistry","tp":"Chemical reactions","sub":"Combustion","lv":["KS3","GCSE"],"who":"Humphry Davy, George Stephenson","f":0,"loc":"UK","rg":["Europe"],"yr":1815,"era":"1800s","tag":"Rivalry","x":"Coal mines filled with 'firedamp', methane, which candle flames could ignite, causing deadly explosions; 92 men and boys died at Felling Colliery in 1812. In 1815 Humphry Davy designed a lamp whose flame was surrounded by fine wire gauze; the metal conducted heat away so the gas outside never got hot enough to ignite. At the same time, the mine engineer George Stephenson designed a similar lamp, the 'Geordie lamp'. Davy accused him of copying. Davy refused to patent his lamp. A flame in the lamp also changed when methane was present, warning miners.","q":"Why does wire gauze stop the flame igniting gas outside?"},{"id":"chem3-028","t":"The Leblanc process and the first pollution law","s":"Chemistry","tp":"Chemical reactions","sub":"Industrial chemistry","lv":["GCSE","A-Level"],"who":"Nicolas Leblanc, Ernest Solvay","f":0,"loc":"France / UK / Belgium","rg":["Europe"],"yr":1863,"era":"1800s","tag":"Tragedy","x":"Soda, sodium carbonate, was needed for glass and soap. In 1791 the Frenchman Nicolas Leblanc found a way to make it from salt, but the process released huge clouds of hydrogen chloride gas, killing fields around factories in Lancashire and Tyneside. Britain's 1863 Alkali Act, one of the world's first environmental laws, required factories to capture 95% of the gas. Leblanc lost his factory in the Revolution and died in poverty. In the 1860s the Belgian Ernest Solvay invented a cleaner process.","q":"Why did the Alkali Act need inspectors who were chemists?"},{"id":"chem3-029","t":"Abraham Gesner's kerosene saves the whales","s":"Chemistry","tp":"Organic chemistry","sub":"Crude oil","lv":["KS3","GCSE"],"who":"Abraham Gesner","f":0,"loc":"Canada","rg":["North & Central America"],"yr":1846,"era":"1800s","tag":"Invention","x":"In the 1800s, lamps burned whale oil, and whaling was devastating whale populations. In 1846 the Canadian geologist and doctor Abraham Gesner demonstrated a new lamp fuel distilled from coal and bitumen, which he called kerosene, from the Greek words for wax and oil. It burned cleanly and cheaply. After the first oil wells in the 1850s, kerosene from crude oil replaced whale oil worldwide. Fossil fuels have since created their own environmental problems.","q":"How is kerosene separated from crude oil?"},{"id":"chem3-030","t":"Vladimir Shukhov's cracking","s":"Chemistry","tp":"Organic chemistry","sub":"Cracking","lv":["GCSE"],"who":"Vladimir Shukhov, Sergey Gavrilov","f":0,"loc":"Russia / Azerbaijan","rg":["Europe"],"yr":1891,"era":"1800s","tag":"Invention","x":"In 1891 the Russian engineer Vladimir Shukhov, with Sergey Gavrilov, patented a process for thermal cracking: heating heavy oil under pressure to break long hydrocarbon molecules into shorter, more useful ones, such as petrol. He worked in Baku, then one of the world's biggest oil fields. Shukhov was also a brilliant architect who designed lightweight steel lattice towers, including the Shabolovka radio tower in Moscow.","q":"Why is cracking needed to meet demand for petrol?"},{"id":"chem3-031","t":"Saccharin: the unwashed hands","s":"Chemistry","tp":"Organic chemistry","sub":"Sweeteners","lv":["KS3","GCSE"],"who":"Constantin Fahlberg, Ira Remsen","f":0,"loc":"USA / Germany","rg":["North & Central America","Europe"],"yr":1879,"era":"1800s","tag":"Accident","x":"In 1879 Constantin Fahlberg, working in Ira Remsen's lab at Johns Hopkins University, went home for dinner without washing his hands. His bread tasted unusually sweet. He went back to the lab, tasted the contents of every beaker on his bench, and found the source: a coal tar derivative, saccharin, about 300 times sweeter than sugar. He patented it without Remsen, who was furious. Aspartame was found in 1965 in a similar way, when a chemist licked his finger to turn a page.","q":"Why is tasting lab chemicals extremely dangerous?"},{"id":"chem3-032","t":"Sucralose: 'test' or 'taste'?","s":"Chemistry","tp":"Organic chemistry","sub":"Sweeteners","lv":["KS3","GCSE"],"who":"Shashikant Phadnis, Leslie Hough","f":0,"loc":"UK / India","rg":["South Asia","Europe"],"yr":1976,"era":"1950–1999","tag":"Accident","x":"In 1975–76, at Queen Elizabeth College in London, the Indian chemistry student Shashikant Phadnis was working with chlorinated sugars for a project with Tate & Lyle. When his supervisor Leslie Hough asked him to 'test' a compound, Phadnis thought he said 'taste'. It was intensely sweet. Hough was horrified that he had tasted an unknown chemical. The compound, sucralose, is about 600 times sweeter than sugar and is now sold as Splenda.","q":"Why must new chemicals be tested for safety before tasting?"},{"id":"chem3-033","t":"Celluloid billiard balls that exploded","s":"Chemistry","tp":"Polymers","sub":"Plastics","lv":["KS3","GCSE"],"who":"John Wesley Hyatt","f":0,"loc":"USA","rg":["North & Central America"],"yr":1869,"era":"1800s","tag":"Invention","x":"Billiard balls were made of ivory, which was expensive and required killing elephants. A US company offered a $10,000 prize for a substitute. In 1869 the printer John Wesley Hyatt made balls coated with nitrocellulose and developed celluloid, one of the first plastics. But nitrocellulose is related to gun cotton. A billiard hall owner reportedly wrote to Hyatt that balls sometimes cracked loudly on impact, and every man in the room drew his gun. Celluloid was later used for film, which was highly flammable.","q":"Why did a synthetic replacement for ivory matter?"},{"id":"chem3-034","t":"Patsy Sherman spills on a trainer","s":"Chemistry","tp":"Polymers","sub":"Fluoropolymers","lv":["KS3","GCSE"],"who":"Patsy Sherman, Sam Smith","f":1,"loc":"USA","rg":["North & Central America"],"yr":1953,"era":"1950–1999","tag":"Accident","x":"In 1953, at the 3M company, an assistant spilled drops of a new fluorinated polymer that Patsy Sherman and Sam Smith were developing onto her canvas trainer. They could not wash it off with water or solvents – and the stained area stayed clean while the rest got dirty. Sherman and Smith realised it repelled both water and oil, and developed it into Scotchgard fabric protector. Chemicals like these, PFAS, are now under scrutiny because they persist in the environment.","q":"Why would a coating that repels both water and oil be useful?"},{"id":"chem3-035","t":"Hideki Shirakawa's thousandfold mistake","s":"Chemistry","tp":"Polymers","sub":"Conducting polymers","lv":["A-Level"],"who":"Hideki Shirakawa, Alan Heeger, Alan MacDiarmid","f":0,"loc":"Japan / USA / New Zealand","rg":["Oceania","East Asia","North & Central America"],"yr":1977,"era":"1950–1999","tag":"Accident","x":"Around 1967, at the Tokyo Institute of Technology, a visiting researcher working with Hideki Shirakawa added a thousand times too much catalyst to acetylene gas. Instead of black powder, a shiny silvery film of polyacetylene formed. Years later Shirakawa, Alan MacDiarmid from New Zealand and Alan Heeger found that adding iodine made it conduct electricity like a metal – a plastic that conducts. They shared the 2000 Nobel Prize, and conducting polymers are used in flexible displays and OLED screens.","q":"Why are plastics normally electrical insulators?"},{"id":"chem3-036","t":"Koichi Tanaka: the engineer's mistake that won a Nobel","s":"Chemistry","tp":"Chemical analysis","sub":"Mass spectrometry","lv":["A-Level"],"who":"Koichi Tanaka","f":0,"loc":"Japan","rg":["East Asia"],"yr":1985,"era":"1950–1999","tag":"Accident","x":"Big molecules like proteins fall apart in an ordinary mass spectrometer. In 1985, Koichi Tanaka, a 26-year-old engineer at the Shimadzu company in Kyoto with only a bachelor's degree, mixed ultrafine cobalt powder with glycerol by mistake instead of acetone. Rather than waste it, he used it anyway, and found a laser could lift whole protein molecules into the gas phase without breaking them. In 2002 he shared the Nobel Prize in Chemistry – a surprise to everyone, including himself. He continued working as an engineer.","q":"Why is it useful to measure the mass of a protein?"},{"id":"chem3-037","t":"Ahmed Zewail films a chemical reaction","s":"Chemistry","tp":"Rates and equilibrium","sub":"Reaction mechanisms","lv":["A-Level"],"who":"Ahmed Zewail","f":0,"loc":"Egypt / USA","rg":["Africa","North & Central America"],"yr":1987,"era":"1950–1999","tag":"Discovery","x":"Chemical bonds break and form in around 10–100 femtoseconds (a femtosecond is a millionth of a billionth of a second). Ahmed Zewail grew up in Egypt and studied at Alexandria University before moving to the USA. At Caltech in the late 1980s, he used ultrashort laser flashes to capture snapshots of molecules mid-reaction – like a super-slow-motion camera. He founded femtochemistry and in 1999 became the first Egyptian and first Arab scientist to win a Nobel Prize in Chemistry.","q":"Why are reactions so hard to observe directly?"},{"id":"chem3-038","t":"Kamala Sohonie: the woman Raman turned away","s":"Chemistry","tp":"Health and medicine","sub":"Biochemistry","lv":["GCSE","A-Level"],"who":"Kamala Sohonie, C. V. Raman","f":1,"loc":"India / UK","rg":["South Asia","Europe"],"yr":1939,"era":"1900–1949","tag":"Hidden figure","x":"In 1933 Kamala Sohonie applied to research at the Indian Institute of Science in Bangalore. Its director, C. V. Raman, refused to admit women. She protested, and was eventually allowed in on probation; her excellent work changed the policy. She then studied at Cambridge, where in 1939 she discovered that the enzyme cytochrome c is involved in respiration in plant cells, and became one of the first Indian women to earn a science PhD. Back in India she studied Neera, a palm sap drink, and showed it improved the nutrition of poor children and pregnant women.","q":"Why might a cheap traditional food be valuable for public health?"},{"id":"chem3-039","t":"Mary Engle Pennington and the cold chain","s":"Chemistry","tp":"Materials","sub":"Food chemistry","lv":["KS3","GCSE"],"who":"Mary Engle Pennington","f":1,"loc":"USA","rg":["North & Central America"],"yr":1905,"era":"1900–1949","tag":"Hidden figure","x":"Mary Engle Pennington completed a chemistry degree at the University of Pennsylvania in 1892 but was given a 'certificate of proficiency' instead of a degree because she was a woman. She earned a PhD anyway. Working for the US government from 1905, she showed how to keep milk, eggs, meat and fish safe using refrigeration, designing refrigerated railway cars and setting standards that cut food poisoning. She rode freight trains herself to check temperatures.","q":"Why does keeping food cold slow down spoilage?"},{"id":"chem3-040","t":"Edith Flanigen's molecular sieves","s":"Chemistry","tp":"Materials","sub":"Zeolites","lv":["A-Level"],"who":"Edith Flanigen","f":1,"loc":"USA","rg":["North & Central America"],"yr":1956,"era":"1950–1999","tag":"Hidden figure","x":"Zeolites are minerals full of tiny regular channels that let some molecules through and trap others, like a sieve for molecules. From 1956, at Union Carbide, Edith Flanigen invented more than 200 synthetic zeolites and related materials. Her zeolite Y became a key catalyst in refining crude oil into petrol, making the process cleaner and more efficient. She also made synthetic emeralds. In 2014 she was awarded the US National Medal of Technology and Innovation.","q":"How can a solid with tiny holes speed up a reaction?"},{"id":"chem3-041","t":"Omar Yaghi pulls water from desert air","s":"Chemistry","tp":"Materials","sub":"Porous materials","lv":["GCSE","A-Level"],"who":"Omar Yaghi, Susumu Kitagawa, Richard Robson","f":0,"loc":"Jordan / USA / Japan / Australia","rg":["Oceania","Middle East","East Asia","North & Central America"],"yr":2025,"era":"2000 onwards","tag":"Modern research","x":"Omar Yaghi grew up in Amman, Jordan, in a family of Palestinian refugees, in a home with no electricity and little water. In the 1990s, building on work by Richard Robson in Australia and Susumu Kitagawa in Japan, he developed metal–organic frameworks: crystals in which metal ions are linked by organic molecules, creating huge internal surfaces. A sugar-cube-sized piece can have the area of a football pitch inside. Some MOFs can capture carbon dioxide or harvest drinking water from desert air. The three shared the 2025 Nobel Prize in Chemistry.","q":"Why would a huge internal surface area help capture gases?"},{"id":"chem3-042","t":"Thalidomide and Frances Kelsey","s":"Chemistry","tp":"Health and medicine","sub":"Drug testing","lv":["GCSE","A-Level"],"who":"Frances Oldham Kelsey","f":1,"loc":"Canada / USA / Germany / UK","rg":["North & Central America","Europe"],"yr":1960,"era":"1950–1999","tag":"Hidden figure","x":"Thalidomide was sold from 1957, in Germany, Britain and dozens of other countries, as a sedative and to ease morning sickness. It caused severe birth defects in over 10,000 babies. In the USA, Frances Kelsey, a Canadian-born pharmacologist at the Food and Drug Administration, refused to approve it in 1960 because the evidence of its safety was weak, despite heavy pressure from the company. Her caution prevented a disaster in America and led to much stricter drug testing laws worldwide.","q":"Why must new medicines be tested on many people before approval?"},{"id":"chem3-043","t":"The Great Smog of London","s":"Chemistry","tp":"Atmosphere","sub":"Air pollution","lv":["KS3","GCSE"],"who":"","f":0,"loc":"UK","rg":["Europe"],"yr":1952,"era":"1950–1999","tag":"Tragedy","x":"On 5 December 1952, cold, still air trapped smoke from coal fires and power stations over London. For five days a thick yellow-black smog filled the streets; visibility fell to a few metres, buses were guided by people with torches, and smog seeped indoors, stopping theatre performances. Sulphur dioxide and soot caused breathing problems. Around 4,000 people died during the event, and recent estimates suggest up to 12,000 in total. It led to the Clean Air Act of 1956.","q":"What pollutants are produced when coal burns?"},{"id":"chem3-044","t":"Lake Nyos: the lake that suffocated a valley","s":"Earth Science","tp":"Earthquakes and volcanoes","sub":"Gases","lv":["GCSE"],"who":"","f":0,"loc":"Cameroon","rg":["Africa"],"yr":1986,"era":"1950–1999","tag":"Tragedy","x":"Lake Nyos in Cameroon lies in an old volcanic crater, and carbon dioxide from magma seeps into its deep water, where high pressure keeps it dissolved – like an unopened fizzy drink. On 21 August 1986, something, perhaps a landslide, disturbed the lake. A huge volume of carbon dioxide burst out and, being denser than air, flowed down the valleys, suffocating about 1,700 people and thousands of cattle. Since 2001, pipes have been installed to release the gas safely, creating a fountain.","q":"Why did the carbon dioxide flow downhill?"},{"id":"chem3-045","t":"Willard Libby and radiocarbon dating","s":"Chemistry","tp":"Atomic structure","sub":"Carbon dating","lv":["GCSE","A-Level"],"who":"Willard Libby","f":0,"loc":"USA","rg":["North & Central America"],"yr":1949,"era":"1900–1949","tag":"Discovery","x":"Cosmic rays create radioactive carbon-14 in the atmosphere, and living things take it in while they are alive. After death, carbon-14 decays with a half-life of about 5,730 years. In 1949 Willard Libby at the University of Chicago tested this using samples of known age, including acacia wood from an Egyptian pharaoh's tomb. The dates matched. Radiocarbon dating transformed archaeology. Nuclear bomb tests in the 1950s–60s nearly doubled atmospheric carbon-14, which scientists now use to date things from recent decades.","q":"Why can't carbon dating be used for dinosaur bones?"},{"id":"chem3-046","t":"Lucy Wills and her yeast extract","s":"Biology","tp":"Nutrition","sub":"Vitamins","lv":["GCSE","A-Level"],"who":"Lucy Wills","f":1,"loc":"UK / India","rg":["South Asia","Europe"],"yr":1931,"era":"1900–1949","tag":"Hidden figure","x":"In 1928 the British haematologist Lucy Wills travelled to Bombay to investigate a severe anaemia among pregnant textile workers. She found that their diets were poor and tested treatments on monkeys and rats. In 1931 she found that Marmite, a yeast extract, cured the anaemia. The active substance, then called the 'Wills factor', was later identified as folic acid. Folic acid is now recommended for women before and during pregnancy.","q":"Why are certain vitamins especially important in pregnancy?"},{"id":"chem3-047","t":"John Leal chlorinates Jersey City's water","s":"Chemistry","tp":"Chemical analysis","sub":"Water treatment","lv":["KS3","GCSE"],"who":"John Leal, Alexander Houston","f":0,"loc":"USA / UK","rg":["North & Central America","Europe"],"yr":1908,"era":"1900–1949","tag":"Discovery","x":"In 1908 the American doctor John Leal secretly began adding chlorine to the drinking water supply of Jersey City, New Jersey – the first continuous chlorination of a city's water in the USA. The water company was sued, and Leal had to defend his decision in court, using data showing bacteria counts fell dramatically. In Britain, Alexander Houston had used chlorination to end a typhoid outbreak in Lincoln in 1905. Chlorination has saved millions of lives.","q":"Why is chlorine added to drinking water?"},{"id":"chem3-048","t":"Fritz Pregl weighs a millionth of a gram","s":"Chemistry","tp":"Chemical analysis","sub":"Microanalysis","lv":["A-Level"],"who":"Fritz Pregl","f":0,"loc":"Slovenia / Austria","rg":["Europe"],"yr":1911,"era":"1900–1949","tag":"Invention","x":"Fritz Pregl, born in Ljubljana, studied bile acids but could only extract tiny amounts – too little for the analysis methods of the time, which needed about a gram. From 1910 he developed microbalances and miniature apparatus that could analyse a few milligrams of substance, weighing to within a millionth of a gram. His microanalysis methods transformed organic chemistry and won the 1923 Nobel Prize in Chemistry.","q":"Why would accurate measurement of tiny masses help chemists?"},{"id":"chem3-049","t":"Robert Borkenstein's Breathalyzer","s":"Chemistry","tp":"Chemical analysis","sub":"Redox","lv":["GCSE","A-Level"],"who":"Robert Borkenstein","f":0,"loc":"USA","rg":["North & Central America"],"yr":1954,"era":"1950–1999","tag":"Invention","x":"In 1954 Robert Borkenstein, a former police photographer at Indiana University, invented the Breathalyzer. A breath sample passed through orange potassium dichromate solution; alcohol reduced the dichromate, turning it green, and the colour change measured how much alcohol was in the breath, and so in the blood. Modern devices use infrared spectroscopy or fuel cells. Borkenstein campaigned for decades on road safety.","q":"Why does alcohol turn orange dichromate green?"},{"id":"chem3-050","t":"Mathieu Orfila, father of toxicology","s":"Chemistry","tp":"Chemical analysis","sub":"Forensics","lv":["GCSE"],"who":"Mathieu Orfila","f":0,"loc":"Spain (Menorca) / France","rg":["Europe"],"yr":1814,"era":"1800s","tag":"Discovery","x":"Mathieu Orfila was born on the Spanish island of Menorca and studied in Valencia and Barcelona before moving to Paris. In 1814 he published the first major book on poisons and how to detect them in the body, founding the science of toxicology. He showed that poisons such as arsenic spread through the body's organs, not just the stomach, and improved tests to find them. He became a celebrated expert witness in French courts.","q":"How can chemistry help solve crimes?"},{"id":"chem3-051","t":"Alice Hamilton and industrial poisons","s":"Chemistry","tp":"Health and medicine","sub":"Toxicology","lv":["KS3","GCSE"],"who":"Alice Hamilton","f":1,"loc":"USA","rg":["North & Central America"],"yr":1910,"era":"1900–1949","tag":"Hidden figure","x":"From 1910 Alice Hamilton, a doctor, investigated workers poisoned by lead, mercury and other chemicals in American factories, visiting smelters, paint works and mines. She traced illnesses to their causes and persuaded companies and governments to improve safety, founding the field of occupational health in the USA. In 1919 she became the first woman appointed to the faculty of Harvard University, though she was not allowed to march in graduation processions. She lived to 101.","q":"Why are some metals harmful even in small amounts?"},{"id":"chem3-052","t":"The radium girls","s":"Physics","tp":"Atoms and radioactivity","sub":"Dangers of radiation","lv":["KS3","GCSE"],"who":"Grace Fryer, Catherine Wolfe Donohue","f":1,"loc":"USA","rg":["North & Central America"],"yr":1928,"era":"1900–1949","tag":"Tragedy","x":"In the 1910s and 20s, young women in factories in New Jersey and Illinois painted watch dials with glowing radium paint. They were taught to shape the brush tips with their lips – 'lip, dip, paint'. They swallowed radium, which lodged in their bones. Many developed anaemia, bone fractures, jaw decay and cancers, while the companies denied responsibility. Grace Fryer and others sued in 1927–28, and Catherine Wolfe Donohue won her case in 1938, from her sickbed. Their fight led to workplace safety laws.","q":"Why is radium dangerous inside the body?"},{"id":"chem3-053","t":"Fritz Haber's search for gold in seawater","s":"Chemistry","tp":"Chemical analysis","sub":"Concentration","lv":["GCSE"],"who":"Fritz Haber","f":0,"loc":"Germany","rg":["Europe"],"yr":1923,"era":"1900–1949","tag":"Blunder","x":"After the First World War, Germany owed huge reparations. Fritz Haber read that seawater contained several milligrams of gold per tonne and hoped to extract enough to pay the debt. From 1920 to 1926 he secretly sampled seawater on ocean voyages. With better analysis, he found the true concentration was about a thousand times lower than reported – far too little to extract profitably. Earlier measurements had been contaminated. He abandoned the project.","q":"Why does contamination matter so much when measuring tiny concentrations?"},{"id":"chem3-054","t":"The Halifax explosion","s":"Chemistry","tp":"Chemical reactions","sub":"Explosives","lv":["KS3","GCSE"],"who":"","f":0,"loc":"Canada","rg":["North & Central America"],"yr":1917,"era":"1900–1949","tag":"Tragedy","x":"On 6 December 1917, in the harbour of Halifax, Nova Scotia, the French cargo ship SS Mont-Blanc, loaded with about 2,700 tonnes of wartime explosives, collided with another ship and caught fire. Twenty minutes later it exploded in the largest human-made explosion before nuclear weapons. Nearly 2,000 people died and much of the city was flattened. Halifax still sends a Christmas tree to Boston every year to thank the city for its help.","q":"Why do explosions release energy so quickly?"},{"id":"chem3-055","t":"Thermite welds the railways","s":"Chemistry","tp":"Reactivity","sub":"Displacement","lv":["GCSE"],"who":"Hans Goldschmidt","f":0,"loc":"Germany","rg":["Europe"],"yr":1895,"era":"1800s","tag":"Invention","x":"In 1893–95 the German chemist Hans Goldschmidt found that powdered aluminium reacts violently with iron oxide, producing aluminium oxide and molten iron at over 2,500 °C. The 'thermite' reaction is a dramatic displacement reaction. In 1899 it was used to weld tram rails in Essen, and it is still used to join railway tracks today. Goldschmidt was also trying to make pure metals without carbon contamination.","q":"Why can aluminium displace iron from iron oxide?"},{"id":"chem3-056","t":"Hydrogen and the Hindenburg","s":"Chemistry","tp":"Chemical reactions","sub":"Combustion","lv":["KS3","GCSE"],"who":"","f":0,"loc":"USA / Germany","rg":["North & Central America","Europe"],"yr":1937,"era":"1900–1949","tag":"Tragedy","x":"The airship Hindenburg was filled with 200,000 cubic metres of hydrogen, lighter than air but highly flammable. The USA controlled most of the world's helium and would not sell it to Nazi Germany. On 6 May 1937, landing at Lakehurst, New Jersey, the airship caught fire and was destroyed in about half a minute; 36 people died, while 62 survived. The cause is thought to be a static spark igniting leaking hydrogen. The disaster was filmed and ended the era of passenger airships.","q":"Why is helium safer than hydrogen for balloons?"},{"id":"chem3-057","t":"Ivy Mike's new elements","s":"Chemistry","tp":"Periodic table","sub":"Synthetic elements","lv":["GCSE","A-Level"],"who":"Albert Ghiorso, Glenn Seaborg","f":0,"loc":"USA / Marshall Islands","rg":["Oceania","North & Central America"],"yr":1952,"era":"1950–1999","tag":"Wartime","x":"On 1 November 1952, the USA tested the first hydrogen bomb, 'Ivy Mike', on Enewetak Atoll in the Pacific. Planes flew through the mushroom cloud with filter papers to collect debris. Analysing it at Berkeley, Albert Ghiorso's team found two new elements: 99 and 100, formed when uranium nuclei absorbed many neutrons in an instant. The discovery was kept secret for years; when announced, they were named einsteinium and fermium. The test vaporised an island, and nearby islanders suffered from the effects of nuclear testing.","q":"How can capturing neutrons produce heavier elements?"},{"id":"chem3-058","t":"Technetium: the first artificial element","s":"Chemistry","tp":"Periodic table","sub":"Synthetic elements","lv":["GCSE","A-Level"],"who":"Emilio Segrè, Carlo Perrier, Ernest Lawrence","f":0,"loc":"Italy / USA","rg":["North & Central America","Europe"],"yr":1937,"era":"1900–1949","tag":"Discovery","x":"Element 43 left a stubborn gap in the periodic table. In 1937 the Italian physicist Emilio Segrè visited Ernest Lawrence's cyclotron at Berkeley and asked for some old radioactive parts. Lawrence posted him a molybdenum deflector plate that had been bombarded with deuterons. In Palermo, Segrè and the chemist Carlo Perrier found it contained element 43. They named it technetium, from the Greek for 'artificial'. It is now used in millions of medical scans every year.","q":"Why are no stable isotopes of technetium found naturally?"},{"id":"chem3-059","t":"Gallium spoons that melt","s":"Chemistry","tp":"Periodic table","sub":"Metals","lv":["KS3","GCSE"],"who":"Paul-Émile Lecoq de Boisbaudran","f":0,"loc":"France","rg":["Europe"],"yr":1875,"era":"1800s","tag":"Everyday","x":"In 1875 Paul-Émile Lecoq de Boisbaudran found gallium using spectroscopy – one of the elements Mendeleev had predicted. Gallium melts at about 30 °C, so it melts in your hand. A popular prank is a gallium spoon that dissolves in hot tea. Mendeleev wrote that Lecoq's first density measurement must be wrong; when Lecoq purified his sample and measured again, the value matched Mendeleev's prediction. Gallium is now used in LEDs and solar cells.","q":"How can an element be a metal but melt in your hand?"},{"id":"chem3-060","t":"Darleane Hoffman finds plutonium in nature","s":"Chemistry","tp":"Periodic table","sub":"Radioactivity","lv":["A-Level"],"who":"Darleane Hoffman","f":1,"loc":"USA","rg":["North & Central America"],"yr":1971,"era":"1950–1999","tag":"Hidden figure","x":"Darleane Hoffman chose chemistry after a required college course; she had planned to study art. When she arrived at Los Alamos in 1953, she was told the radiochemistry group did not hire women; she was taken on anyway. In 1971 she found tiny traces of plutonium-244 in natural ore – evidence that this element, usually thought of as artificial, was formed in stars and still survives on Earth. She later confirmed the existence of element 106, seaborgium.","q":"Why would any plutonium from Earth's formation still survive?"},{"id":"chem3-061","t":"Ruth Benerito's wrinkle-free cotton","s":"Chemistry","tp":"Polymers","sub":"Cross-linking","lv":["KS3","GCSE"],"who":"Ruth Rogan Benerito","f":1,"loc":"USA","rg":["North & Central America"],"yr":1958,"era":"1950–1999","tag":"Hidden figure","x":"In the 1950s, synthetic fabrics such as polyester were threatening the cotton industry because they didn't crease. At the US Department of Agriculture in New Orleans, Ruth Benerito led work on treating cotton fibres chemically so their cellulose chains were cross-linked, helping the fabric spring back into shape. Her methods helped produce wash-and-wear cotton. She also developed a way to feed critically injured soldiers intravenously during the Korean War.","q":"How could cross-linking stop a fabric creasing?"},{"id":"chem3-062","t":"Bunsen nearly dies of arsenic","s":"Chemistry","tp":"Chemical analysis","sub":"Lab safety","lv":["GCSE"],"who":"Robert Bunsen","f":0,"loc":"Germany","rg":["Europe"],"yr":1843,"era":"1800s","tag":"Accident","x":"In the early 1840s, Robert Bunsen studied cacodyl compounds – arsenic-containing chemicals so foul-smelling that the name comes from the Greek for 'stinking'. They catch fire spontaneously in air. He nearly died from arsenic poisoning, and in 1843 a cacodyl cyanide sample exploded, blinding his right eye. Undeterred, he went on to develop the antidote for arsenic poisoning – iron oxide hydrate – and pioneered spectroscopy.","q":"Which safety equipment would have protected Bunsen?"},{"id":"phys3-001","t":"Millikan's oil drops","s":"Physics","tp":"Electricity","sub":"Charge","lv":["GCSE","A-Level"],"who":"Robert Millikan, Harvey Fletcher","f":0,"loc":"USA","rg":["North & Central America"],"yr":1909,"era":"1900–1949","tag":"Rivalry","x":"In 1909 at the University of Chicago, Robert Millikan and his student Harvey Fletcher sprayed tiny oil droplets between two charged metal plates and watched them through a microscope. By adjusting the voltage until a drop hovered, they could work out its charge. Every charge was a whole-number multiple of about 1.6 × 10⁻¹⁹ C – the charge of one electron. Fletcher suggested using oil instead of water, which evaporated, but agreed to let Millikan be sole author. Millikan won the 1923 Nobel Prize. His notebooks show he left out some drops he judged unreliable.","q":"What does it mean to say charge is quantised?"},{"id":"phys3-002","t":"Harriet Brooks and the recoiling atom","s":"Physics","tp":"Atoms and radioactivity","sub":"Decay","lv":["GCSE","A-Level"],"who":"Harriet Brooks, Ernest Rutherford","f":1,"loc":"Canada","rg":["North & Central America"],"yr":1901,"era":"1900–1949","tag":"Hidden figure","x":"Harriet Brooks was Ernest Rutherford's first graduate student at McGill University in Montreal. Around 1901 she showed that thorium gave off a radioactive gas, later identified as radon, which helped prove that radioactive elements transform into other elements. She was also among the first to notice that an atom recoils when it emits an alpha particle. When she became engaged in 1906, Barnard College told her she must resign, as married women could not teach there. She later left physics. Rutherford called her
