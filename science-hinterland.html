 the most outstanding woman physicist after Marie Curie.","q":"What happens to an atom when it emits an alpha particle?"},{"id":"phys3-003","t":"Buys Ballot's trumpeters on a train","s":"Physics","tp":"Waves","sub":"Doppler effect","lv":["GCSE","A-Level"],"who":"Christian Doppler, C. H. D. Buys Ballot","f":0,"loc":"Austria / Netherlands","rg":["Europe"],"yr":1845,"era":"1800s","tag":"Eccentric","x":"In 1842 Christian Doppler predicted that the frequency of a wave changes if its source moves towards or away from you. In 1845 the Dutch scientist Buys Ballot tested it with sound on the new railway between Utrecht and Maarssen. Trumpeters played a steady note on an open carriage pulled by a locomotive, while musicians with perfect pitch stood by the track. As the train approached, the note sounded higher; as it went away, lower. Doppler's idea is now used in police speed guns, ultrasound scans and to measure the expansion of the Universe.","q":"Why does a passing siren change pitch?"},{"id":"phys3-004","t":"Ibn Sahl's law of refraction","s":"Physics","tp":"Waves","sub":"Refraction","lv":["GCSE","A-Level"],"who":"Ibn Sahl, Willebrord Snell, René Descartes","f":0,"loc":"Iraq (Baghdad) / Netherlands","rg":["Middle East","Europe"],"yr":984,"era":"Medieval","tag":"Hidden figure","x":"The law relating the angles of incidence and refraction is usually named after Willebrord Snell (1621) or Descartes. But in 984 the mathematician Ibn Sahl in Baghdad wrote a treatise on burning mirrors and lenses that used the same geometric relationship to design lenses that focus light without distortion. His work was forgotten until a historian reconstructed it from manuscripts in Damascus and Tehran in 1990.","q":"Why does light bend when it enters glass?"},{"id":"phys3-005","t":"Fizeau's spinning cog wheel","s":"Physics","tp":"Waves","sub":"Speed of light","lv":["GCSE","A-Level"],"who":"Hippolyte Fizeau","f":0,"loc":"France","rg":["Europe"],"yr":1849,"era":"1800s","tag":"Discovery","x":"In 1849 Hippolyte Fizeau shone light through the gaps of a rapidly spinning toothed wheel at his father's house in Suresnes, to a mirror on Montmartre about 8.6 km away in Paris. At the right speed, light passing through one gap returned just as a tooth blocked it, and the reflection vanished. From the wheel's speed and number of teeth, he calculated the speed of light as about 313,000 km/s, within 5% of the true value – the first measurement not using astronomy.","q":"Why does the returning light disappear at a certain wheel speed?"},{"id":"phys3-006","t":"Rømer times Jupiter's moons","s":"Physics","tp":"Waves","sub":"Speed of light","lv":["GCSE","A-Level"],"who":"Ole Rømer","f":0,"loc":"Denmark / France","rg":["Europe"],"yr":1676,"era":"1500–1699","tag":"Discovery","x":"Jupiter's moon Io disappears behind the planet every 42.5 hours. In 1676 the Danish astronomer Ole Rømer, working in Paris, noticed that these eclipses came earlier when Earth was approaching Jupiter and later when it was moving away. He predicted an eclipse in November would be 10 minutes late – and it was. He realised light takes time to cross Earth's orbit: it has a finite speed. Many astronomers were unconvinced until the 1720s.","q":"Why do we see distant stars as they were in the past?"},{"id":"phys3-007","t":"Foucault's pendulum","s":"Physics","tp":"Space","sub":"Earth's rotation","lv":["KS3","GCSE"],"who":"Léon Foucault","f":0,"loc":"France","rg":["Europe"],"yr":1851,"era":"1800s","tag":"Discovery","x":"In 1851 Léon Foucault hung a 28 kg iron ball from a 67 m wire inside the Panthéon in Paris, with a pin underneath tracing lines in sand. As the pendulum swung, its plane of swing slowly turned, about 11° an hour. The pendulum itself was not turning – the Earth was turning beneath it. Crowds flocked to see the first direct demonstration that the Earth rotates. Foucault also measured the speed of light in water and named the gyroscope.","q":"How fast would a Foucault pendulum turn at the North Pole?"},{"id":"phys3-008","t":"Katharina Kepler's witch trial","s":"Physics","tp":"Space","sub":"Orbits","lv":["GCSE"],"who":"Johannes Kepler, Katharina Kepler","f":1,"loc":"Germany","rg":["Europe"],"yr":1620,"era":"1500–1699","tag":"Tragedy","x":"While Johannes Kepler was working on his laws of planetary motion, his elderly mother Katharina, a herbalist, was accused of witchcraft by a neighbour in Leonberg. She was arrested in 1620 and kept in chains for over a year, and threatened with torture. Kepler put his work aside, travelled to Württemberg and conducted her legal defence himself. She was released in 1621 but died six months later. Kepler had written a story, Somnium, about travelling to the Moon, which accusers used against her.","q":"Kepler's laws describe orbits as ellipses. What does that mean?"},{"id":"phys3-009","t":"Tycho Brahe's island observatory","s":"Physics","tp":"Space","sub":"Observation","lv":["KS3","GCSE"],"who":"Tycho Brahe, Sophie Brahe","f":1,"loc":"Denmark / Sweden","rg":["Europe"],"yr":1576,"era":"1500–1699","tag":"Eccentric","x":"Tycho Brahe lost part of his nose in a duel and wore a metal replacement. The King of Denmark gave him the island of Hven, where he built Uraniborg, an observatory-castle, in 1576. Without telescopes, using giant brass instruments, he measured star and planet positions more accurately than anyone before. His sister Sophie helped with observations. He kept a pet elk, which reportedly died after drinking too much beer and falling down stairs. His data allowed Kepler to discover that orbits are ellipses.","q":"Why was accurate data so important for Kepler?"},{"id":"phys3-010","t":"Herschel's thermometers find infrared","s":"Physics","tp":"Waves","sub":"Electromagnetic spectrum","lv":["KS3","GCSE"],"who":"William Herschel","f":0,"loc":"UK","rg":["Europe"],"yr":1800,"era":"1800s","tag":"Discovery","x":"In 1800 William Herschel, who had discovered Uranus, wanted to know which colours of sunlight carried most heat. He split sunlight with a prism and placed thermometers with blackened bulbs in each colour. The temperature rose from violet to red. Then he put a thermometer just beyond the red end, where there was no visible light – and it was hottest of all. He had found infrared radiation. A year later, Johann Ritter found ultraviolet beyond the violet end.","q":"Why did Herschel blacken the thermometer bulbs?"},{"id":"phys3-011","t":"Louis Essen's atomic clock","s":"Physics","tp":"Measurement","sub":"Time","lv":["GCSE","A-Level"],"who":"Louis Essen, Jack Parry","f":0,"loc":"UK","rg":["Europe"],"yr":1955,"era":"1950–1999","tag":"Invention","x":"In 1955 at the National Physical Laboratory in Teddington, Louis Essen and Jack Parry built the first accurate atomic clock, using the natural frequency of caesium atoms. It kept time to about one second in 300 years, better than the Earth's spin, which wobbles. In 1967 the second was redefined as 9,192,631,770 cycles of caesium radiation. Essen was a critic of Einstein's relativity, which did not help his career, though GPS relies on both atomic clocks and relativity.","q":"Why is the Earth's rotation not perfect for keeping time?"},{"id":"phys3-012","t":"Joseph Swan lights Cragside","s":"Physics","tp":"Electricity","sub":"Circuits","lv":["KS3","GCSE"],"who":"Joseph Swan, William Armstrong","f":0,"loc":"UK","rg":["Europe"],"yr":1878,"era":"1800s","tag":"Invention","x":"Joseph Swan, a chemist in Newcastle, demonstrated a working incandescent light bulb in 1878–79, before Thomas Edison's. In 1878 the industrialist William Armstrong's house, Cragside in Northumberland, became the first in the world lit by hydroelectricity, and from 1880 used Swan's bulbs. Mosley Street in Newcastle became the first street lit by electric bulbs. Edison and Swan later merged their British businesses rather than fight in court.","q":"Why does the filament of a bulb glow?"},{"id":"phys3-013","t":"Lewis Latimer's better filament","s":"Physics","tp":"Electricity","sub":"Circuits","lv":["KS3","GCSE"],"who":"Lewis Latimer","f":0,"loc":"USA","rg":["North & Central America"],"yr":1882,"era":"1800s","tag":"Hidden figure","x":"Lewis Latimer was the son of people who had escaped slavery. He taught himself technical drawing and drafted the patent drawings for Alexander Graham Bell's telephone. In 1882 he patented an improved way of making carbon filaments for light bulbs that made them last much longer, and supervised installing electric lighting in New York, Philadelphia and London. He was one of the original 'Edison Pioneers'. He also wrote poetry.","q":"Why does a longer-lasting filament matter?"},{"id":"phys3-014","t":"Shuji Nakamura's blue LED","s":"Physics","tp":"Electricity","sub":"LEDs","lv":["GCSE","A-Level"],"who":"Shuji Nakamura, Isamu Akasaki, Hiroshi Amano","f":0,"loc":"Japan","rg":["East Asia"],"yr":1993,"era":"1950–1999","tag":"Invention","x":"Red and green LEDs existed by the 1960s, but bright blue ones defeated big companies for decades, and without blue you cannot make white LED light. Isamu Akasaki and Hiroshi Amano at Nagoya made breakthroughs with gallium nitride in the 1980s. Shuji Nakamura, working at Nichia, a small chemical company in rural Japan, ignored his bosses' order to stop and built his own reactor, demonstrating a bright blue LED in 1993. His company paid him a bonus of about £100. All three shared the 2014 Nobel Prize.","q":"How does a white LED produce white light?"},{"id":"phys3-015","t":"Charles Kao and light in glass","s":"Physics","tp":"Waves","sub":"Optical fibres","lv":["GCSE","A-Level"],"who":"Charles Kao, George Hockham","f":0,"loc":"China / UK","rg":["East Asia","Europe"],"yr":1966,"era":"1950–1999","tag":"Discovery","x":"In 1966, at Standard Telecommunication Laboratories in Harlow, Essex, Charles Kao, born in Shanghai, and George Hockham showed that light was lost in glass fibres not because of glass itself but because of impurities. If very pure glass could be made, light could travel many kilometres, carrying huge amounts of data. Few believed it, but by 1970 Corning made such glass. Optical fibres now carry most of the world's internet traffic. Kao won the 2009 Nobel Prize.","q":"Why does light stay inside an optical fibre?"},{"id":"phys3-016","t":"Narinder Kapany bends light","s":"Physics","tp":"Waves","sub":"Total internal reflection","lv":["GCSE"],"who":"Narinder Singh Kapany, Harold Hopkins","f":0,"loc":"India / UK","rg":["South Asia","Europe"],"yr":1954,"era":"1950–1999","tag":"Hidden figure","x":"As a schoolboy in Dehradun, Narinder Singh Kapany was told by a teacher that light only travels in straight lines. He set out to prove otherwise. At Imperial College London in 1954, he and Harold Hopkins published a paper showing images could be transmitted through a bundle of thousands of glass fibres. This led to medical endoscopes, letting doctors see inside the body. Kapany is often called the father of fibre optics, and he also collected Sikh art.","q":"How can light travel around a bend in a fibre?"},{"id":"phys3-017","t":"Heike Kamerlingh Onnes and zero resistance","s":"Physics","tp":"Electricity","sub":"Resistance","lv":["GCSE","A-Level"],"who":"Heike Kamerlingh Onnes, Gilles Holst","f":0,"loc":"Netherlands","rg":["Europe"],"yr":1911,"era":"1900–1949","tag":"Discovery","x":"In 1908 Heike Kamerlingh Onnes in Leiden became the first to liquefy helium, at 4 K. In 1911 his team cooled mercury and measured its resistance. At about 4.2 K it suddenly dropped to zero: superconductivity. A current started in a superconducting loop can flow for years without a battery. His students and technicians, including Gilles Holst who did many of the measurements, were barely credited. Superconductors are now used in MRI scanners and at the Large Hadron Collider.","q":"Why is resistance usually lower in colder metals?"},{"id":"phys3-018","t":"Tim Berners-Lee at CERN","s":"Physics","tp":"How science works","sub":"Collaboration","lv":["KS3","GCSE"],"who":"Tim Berners-Lee, Robert Cailliau","f":0,"loc":"Switzerland / UK","rg":["Europe"],"yr":1989,"era":"1950–1999","tag":"Invention","x":"Thousands of physicists worked with CERN from around the world, and sharing information between different computers was a nightmare. In March 1989 Tim Berners-Lee, a British software engineer, wrote a proposal for a linked information system. His boss scribbled 'vague but exciting' on it. With Robert Cailliau he built the first web server and browser in 1990. In 1993 CERN made the web free for everyone to use.","q":"How does particle physics benefit people who never study it?"},{"id":"phys3-019","t":"Ray Davis counts neutrinos in a goldmine","s":"Physics","tp":"Space","sub":"The Sun","lv":["A-Level"],"who":"Raymond Davis Jr, John Bahcall","f":0,"loc":"USA","rg":["North & Central America"],"yr":1968,"era":"1950–1999","tag":"Discovery","x":"Neutrinos from the Sun pass through Earth almost without interacting. In the 1960s Ray Davis put a tank of 380,000 litres of dry-cleaning fluid 1.5 km down the Homestake gold mine in South Dakota, shielded from cosmic rays. About once every two days, a neutrino converted a chlorine atom to argon, which he extracted and counted. He found only a third of the neutrinos John Bahcall predicted – the 'solar neutrino problem'. It was solved in 2001: neutrinos change type as they travel. Davis won a Nobel Prize in 2002, aged 87.","q":"Why would a detector need to be deep underground?"},{"id":"phys3-020","t":"Queloz and Mayor find 51 Pegasi b","s":"Physics","tp":"Space","sub":"Exoplanets","lv":["GCSE","A-Level"],"who":"Didier Queloz, Michel Mayor","f":0,"loc":"Switzerland / France","rg":["Europe"],"yr":1995,"era":"1950–1999","tag":"Discovery","x":"In 1994 the PhD student Didier Queloz, using a spectrograph at the Haute-Provence Observatory in France, noticed that the star 51 Pegasi wobbled back and forth every 4.2 days. The Doppler shift of its light meant something was tugging it. In 1995 he and his supervisor Michel Mayor announced a planet half the mass of Jupiter orbiting closer to its star than Mercury is to the Sun – a 'hot Jupiter' nobody had expected. Thousands of exoplanets are now known. They shared the 2019 Nobel Prize.","q":"How can a planet make its star wobble?"},{"id":"phys3-021","t":"Challenger and the cold O-ring","s":"Physics","tp":"Matter","sub":"Properties","lv":["KS3","GCSE"],"who":"Richard Feynman, Roger Boisjoly","f":0,"loc":"USA","rg":["North & Central America"],"yr":1986,"era":"1950–1999","tag":"Tragedy","x":"On 28 January 1986, the Space Shuttle Challenger broke apart 73 seconds after launch, killing all seven crew including the teacher Christa McAuliffe. The night before, engineer Roger Boisjoly had warned that rubber O-ring seals in the boosters might fail in the freezing temperatures. At the inquiry, Richard Feynman dipped a piece of O-ring rubber in iced water and showed it stayed squashed and lost its springiness. A seal had failed, letting hot gas escape.","q":"Why do materials behave differently at low temperatures?"},{"id":"phys3-022","t":"Helen Sharman: Britain's first astronaut","s":"Physics","tp":"Space","sub":"Human spaceflight","lv":["KS3","GCSE"],"who":"Helen Sharman","f":1,"loc":"UK / Russia","rg":["Europe"],"yr":1991,"era":"1950–1999","tag":"Discovery","x":"In 1989 Helen Sharman, a chemist working for the Mars confectionery company in Slough, heard a radio advert: 'Astronaut wanted. No experience necessary.' She was chosen from 13,000 applicants. After 18 months' training in Russia, on 18 May 1991 she launched on a Soyuz rocket to the Mir space station, becoming the first British person in space. She grew plants, studied crystals and spoke to schoolchildren by radio. She later worked at Imperial College.","q":"Why do astronauts feel weightless in orbit?"},{"id":"phys3-023","t":"Hayabusa2 brings home an asteroid","s":"Physics","tp":"Space","sub":"Solar system","lv":["KS3","GCSE"],"who":"","f":0,"loc":"Japan / Australia","rg":["Oceania","East Asia"],"yr":2020,"era":"2000 onwards","tag":"Modern research","x":"In 2019 the Japanese space probe Hayabusa2 reached the asteroid Ryugu, over 300 million km from Earth. It fired a small projectile into the surface to collect dust, then used an explosive charge to blast a crater and collected material from underneath. In December 2020 its capsule landed in the Australian outback with about 5 g of asteroid. Scientists found amino acids and water-bearing minerals, supporting ideas that asteroids helped deliver life's ingredients to early Earth.","q":"Why would scientists want rock from below an asteroid's surface?"},{"id":"phys3-024","t":"DART knocks an asteroid off course","s":"Physics","tp":"Forces and motion","sub":"Momentum","lv":["GCSE","A-Level"],"who":"","f":0,"loc":"USA / Space","rg":["Space","North & Central America"],"yr":2022,"era":"2000 onwards","tag":"Modern research","x":"On 26 September 2022, NASA's DART spacecraft, about the mass of a small car, deliberately crashed into Dimorphos, a 160 m asteroid moon orbiting a larger asteroid, at about 6 km/s. Dimorphos's orbit shortened by 32 minutes – far more than expected, because the impact blasted out a huge plume of rock, adding extra momentum like a rocket's exhaust. It was the first test of a way to protect Earth from a dangerous asteroid.","q":"Why did the ejected debris increase the change in momentum?"},{"id":"phys3-025","t":"Robert Goddard and the New York Times","s":"Physics","tp":"Forces and motion","sub":"Rockets","lv":["KS3","GCSE"],"who":"Robert Goddard","f":0,"loc":"USA","rg":["North & Central America"],"yr":1926,"era":"1900–1949","tag":"Blunder","x":"On 16 March 1926, in a cabbage field in Auburn, Massachusetts, Robert Goddard launched the first liquid-fuelled rocket. It flew for 2.5 seconds and reached 12 m. In 1920 a New York Times editorial had mocked him for suggesting rockets could work in space, claiming they needed air to push against. In July 1969, as Apollo 11 headed for the Moon, the newspaper printed a correction, saying it regretted the error.","q":"Why does a rocket not need air to push against?"},{"id":"phys3-026","t":"The Carrington Event","s":"Physics","tp":"Space","sub":"The Sun","lv":["GCSE","A-Level"],"who":"Richard Carrington, Richard Hodgson","f":0,"loc":"UK","rg":["Europe"],"yr":1859,"era":"1800s","tag":"Discovery","x":"On 1 September 1859, the astronomer Richard Carrington was sketching sunspots at his observatory in Redhill, Surrey, when he saw two brilliant white flashes – the first solar flare ever observed. About 17 hours later, a huge magnetic storm hit Earth. Auroras were seen as far south as the Caribbean, people in the USA read newspapers by their light, and telegraph wires sparked and gave operators electric shocks. A storm like that today could damage satellites and power grids.","q":"How can a solar storm affect electrical systems on Earth?"},{"id":"phys3-027","t":"Nils Bohlin's three-point seat belt","s":"Physics","tp":"Forces and motion","sub":"Momentum and safety","lv":["KS3","GCSE"],"who":"Nils Bohlin","f":0,"loc":"Sweden","rg":["Europe"],"yr":1959,"era":"1950–1999","tag":"Invention","x":"Nils Bohlin had designed ejector seats for Saab aircraft. Joining Volvo in 1958, he designed a seat belt with a lap strap and a diagonal across the chest, both fastened at one point by the hip, which spread the force of a crash across the strong pelvis and ribcage and could be fastened with one hand. Volvo fitted it in 1959 and gave the patent away free so all manufacturers could use it. It is estimated to have saved over a million lives.","q":"How does a seat belt reduce the force on a person in a crash?"},{"id":"phys3-028","t":"The Montgolfier balloon's animal crew","s":"Physics","tp":"Matter","sub":"Density","lv":["KS3","GCSE"],"who":"Joseph-Michel Montgolfier, Jacques-Étienne Montgolfier","f":0,"loc":"France","rg":["Europe"],"yr":1783,"era":"1700s","tag":"Eccentric","x":"The Montgolfier brothers were paper makers who noticed hot smoke lifting fragments of paper. On 19 September 1783 at Versailles, before King Louis XVI, they launched a hot-air balloon carrying a sheep, a duck and a cockerel, to test whether living things could survive high in the air. The flight lasted about 8 minutes, and the animals landed safely. Two months later, on 21 November, two men made the first untethered human flight over Paris.","q":"Why does hot air rise?"},{"id":"phys3-029","t":"Périer carries a barometer up the Puy de Dôme","s":"Physics","tp":"Matter","sub":"Atmospheric pressure","lv":["KS3","GCSE"],"who":"Blaise Pascal, Florin Périer","f":0,"loc":"France","rg":["Europe"],"yr":1648,"era":"1500–1699","tag":"Discovery","x":"Torricelli had shown in 1643 that the atmosphere could hold up a column of mercury about 76 cm tall. Blaise Pascal reasoned that if air has weight, there should be less of it pressing down on a mountaintop. He asked his brother-in-law Florin Périer to test it. On 19 September 1648 Périer carried a mercury barometer up the Puy de Dôme, a volcano in central France. The mercury column dropped by about 8 cm at the top. The unit of pressure is named after Pascal.","q":"Why does atmospheric pressure decrease with height?"},{"id":"phys3-030","t":"Faust Vrančić's parachute","s":"Physics","tp":"Forces and motion","sub":"Air resistance","lv":["KS3"],"who":"Fausto Veranzio (Faust Vrančić)","f":0,"loc":"Croatia / Italy","rg":["Europe"],"yr":1615,"era":"1500–1699","tag":"Invention","x":"Leonardo da Vinci sketched a pyramid-shaped parachute around 1485 but never built it. Around 1615, Faust Vrančić, a Croatian bishop and inventor, published a design for a square sail-like parachute called Homo Volans – 'flying man'. Stories say he tested it himself by jumping from a tower in Venice, though this is not certain. Modern parachutes use a large canopy to increase air resistance so a falling person reaches a low terminal velocity.","q":"Why does a bigger parachute give a slower landing?"},{"id":"phys3-031","t":"James Blyth's wind turbine in Scotland","s":"Physics","tp":"Energy","sub":"Renewable energy","lv":["KS3","GCSE"],"who":"James Blyth","f":0,"loc":"UK","rg":["Europe"],"yr":1887,"era":"1800s","tag":"Invention","x":"In July 1887 James Blyth, a professor in Glasgow, built a 10 m wind turbine with cloth sails at his holiday cottage in Marykirk, Scotland. It charged batteries that lit his cottage – the first house in the world lit by wind-generated electricity. He offered to light the main street of the village, but villagers reportedly turned him down, thinking electricity was 'the work of the devil'. Wind now supplies a large fraction of the UK's electricity.","q":"What energy transfers happen in a wind turbine?"},{"id":"phys3-032","t":"Larderello: the first geothermal power station","s":"Physics","tp":"Energy","sub":"Renewable energy","lv":["KS3","GCSE"],"who":"Piero Ginori Conti","f":0,"loc":"Italy","rg":["Europe"],"yr":1904,"era":"1900–1949","tag":"Invention","x":"At Larderello in Tuscany, steam and hot gases have long hissed from the ground; locals called the valley 'the devil's valley'. In 1904 Prince Piero Ginori Conti used steam from the ground to drive a small engine and generator, lighting five bulbs. By 1913 a commercial geothermal power station was running there – the first in the world. Larderello still generates electricity today, as do power stations in Iceland, Kenya, New Zealand and elsewhere.","q":"Where does geothermal energy come from?"},{"id":"phys3-033","t":"Dinorwig: the Electric Mountain","s":"Physics","tp":"Energy","sub":"Energy storage","lv":["KS3","GCSE"],"who":"","f":0,"loc":"Wales","rg":["Europe"],"yr":1984,"era":"1950–1999","tag":"Invention","x":"Inside a mountain in Snowdonia, beside a former slate quarry, is Dinorwig power station, opened in 1984. When electricity is cheap and demand is low, it pumps water uphill from Llyn Peris to Marchlyn Mawr reservoir. When demand surges – such as when millions of kettles go on after a big TV event – the water rushes down through turbines and can reach full power in under 20 seconds. It stores energy as gravitational potential energy. The caverns inside are big enough to hold St Paul's Cathedral.","q":"Calculate the energy stored by raising 1 tonne of water 500 m."},{"id":"phys3-034","t":"Watson-Watt's Daventry experiment","s":"Physics","tp":"Waves","sub":"Radar","lv":["GCSE"],"who":"Robert Watson-Watt, Arnold Wilkins","f":0,"loc":"UK","rg":["Europe"],"yr":1935,"era":"1900–1949","tag":"Wartime","x":"In 1935 the British Air Ministry asked Robert Watson-Watt whether a radio 'death ray' could destroy aircraft. His assistant Arnold Wilkins calculated it was impossible, but suggested radio waves could detect planes. On 26 February 1935, near Daventry, they parked a van with receivers in a field while a Heyford bomber flew past through the BBC's radio beam. The reflected signal showed clearly on a screen. A chain of radar stations was built around Britain's coast before the Second World War.","q":"How does radar measure distance?"},{"id":"phys3-035","t":"Randall and Boot's cavity magnetron","s":"Physics","tp":"Waves","sub":"Microwaves","lv":["GCSE","A-Level"],"who":"John Randall, Harry Boot","f":0,"loc":"UK","rg":["Europe"],"yr":1940,"era":"1900–1949","tag":"Wartime","x":"In February 1940 at the University of Birmingham, John Randall and Harry Boot built a cavity magnetron: a copper block with holes drilled in it, inside a magnet, that produced powerful microwaves. It made compact, accurate radar possible in aircraft. In September 1940 a prototype was taken to the USA in the secret Tizard Mission. Percy Spencer, an American engineer making magnetrons, later noticed a chocolate bar melting in his pocket, leading to the microwave oven.","q":"Why are short wavelengths better for detecting small objects?"},{"id":"phys3-036","t":"Grace Hopper's moth","s":"Physics","tp":"Electricity","sub":"Computing","lv":["KS3","GCSE"],"who":"Grace Hopper","f":1,"loc":"USA","rg":["North & Central America"],"yr":1947,"era":"1900–1949","tag":"Everyday","x":"Grace Hopper was a mathematician and US Navy officer who worked on early computers. On 9 September 1947, operators of the Harvard Mark II found a moth trapped in a relay, and taped it into the logbook with the note 'first actual case of bug being found'. Engineers already used 'bug' for faults, but the story stuck. Hopper went on to develop the first compiler and helped create COBOL, an early programming language, so computers could be programmed in English-like words.","q":"How does a relay act as a switch?"},{"id":"phys3-037","t":"The Antikythera mechanism","s":"Physics","tp":"Space","sub":"Astronomy","lv":["KS3","GCSE"],"who":"Derek de Solla Price, Mike Edmunds","f":0,"loc":"Greece","rg":["Europe"],"yr":1901,"era":"1900–1949","tag":"Discovery","x":"In 1901 sponge divers found a Roman-era shipwreck off the Greek island of Antikythera. Among statues and coins was a corroded lump of bronze. Over a century, X-rays and CT scans revealed at least 30 interlocking gear wheels. Made around 2,100 years ago, it was a hand-cranked astronomical calculator that predicted eclipses, the Moon's phases and the positions of planets, and even the dates of the Olympic Games. Nothing as complex is known for another thousand years.","q":"How can gears model the motion of the Moon?"},{"id":"phys3-038","t":"Al-Jazari's elephant clock","s":"Physics","tp":"Energy","sub":"Machines","lv":["KS3"],"who":"Ismail al-Jazari","f":0,"loc":"Turkey / Iraq (Diyarbakır)","rg":["Middle East"],"yr":1206,"era":"Medieval","tag":"Invention","x":"In 1206 the engineer Ismail al-Jazari, working for the Artuqid rulers at Diyarbakır, wrote the 'Book of Knowledge of Ingenious Mechanical Devices', describing 100 machines with detailed instructions. They included a crankshaft-driven water pump, programmable musical automata and the elephant clock: a bowl sinking in a tank of water inside a model elephant triggered figures and a ball to fall every half hour, with features from India, Persia, Egypt, Greece and China.","q":"How can a sinking bowl measure time?"},{"id":"phys3-039","t":"Wang Zhenyi's lamp eclipse","s":"Physics","tp":"Space","sub":"Eclipses","lv":["KS3","GCSE"],"who":"Wang Zhenyi","f":1,"loc":"China","rg":["East Asia"],"yr":1790,"era":"1700s","tag":"Hidden figure","x":"Wang Zhenyi was born in 1768 during the Qing dynasty, when women were mostly kept from education. She read her grandfather's library of 75 bookcases, then studied astronomy and mathematics. To show how eclipses work, she set up a crystal lamp as the Sun, a round table as the Earth and a round mirror as the Moon in a garden pavilion, moving them to show when shadows fall. She wrote books simplifying mathematics and wrote poems about equality for women. She died aged 29.","q":"Why don't eclipses happen every month?"},{"id":"phys3-040","t":"Edith Clarke's calculator","s":"Physics","tp":"Electricity","sub":"National grid","lv":["GCSE"],"who":"Edith Clarke","f":1,"loc":"USA","rg":["North & Central America"],"yr":1921,"era":"1900–1949","tag":"Hidden figure","x":"Edith Clarke was orphaned at 12 and used her inheritance to study maths. She worked as a 'computer' doing calculations at General Electric, and in 1921 patented a graphical calculator that solved equations for long power lines ten times faster. In 1922 she became the first woman professionally employed as an electrical engineer in the USA, and later the first woman professor of electrical engineering. She helped design the power system for the Hoover Dam.","q":"Why is electricity transmitted at very high voltages?"},{"id":"phys3-041","t":"Edward Appleton finds the ionosphere","s":"Physics","tp":"Waves","sub":"Radio","lv":["GCSE"],"who":"Edward Appleton, Miles Barnett","f":0,"loc":"UK","rg":["Europe"],"yr":1924,"era":"1900–1949","tag":"Discovery","x":"How did Marconi's radio signals cross the Atlantic in 1901, when radio waves travel in straight lines? On 11 December 1924, Edward Appleton and Miles Barnett varied the frequency of the BBC transmitter at Bournemouth and received the signals in Oxford, detecting interference between waves travelling along the ground and waves reflected from high in the atmosphere. They measured a reflecting layer about 100 km up: the ionosphere. Appleton won the 1947 Nobel Prize.","q":"How does reflection let radio waves travel around the curved Earth?"},{"id":"earth2-001","t":"Surtsey: an island is born","s":"Earth Science","tp":"Earthquakes and volcanoes","sub":"Volcanic islands","lv":["KS3","GCSE"],"who":"Sturla Friðriksson","f":0,"loc":"Iceland","rg":["Europe"],"yr":1963,"era":"1950–1999","tag":"Nature","x":"On 14 November 1963 the crew of an Icelandic fishing boat noticed smoke rising from the sea south of Iceland. An undersea eruption was building a new island, Surtsey, which grew to about 2.7 km² by 1967. Scientists made it a protected natural laboratory, and only a few researchers may visit. They have watched life arrive from scratch: first bacteria and moulds, then seeds washed ashore or dropped by birds, then insects, seabirds and seals. Erosion means much of the island will eventually disappear.","q":"How might living things reach a brand-new island?"},{"id":"earth2-002","t":"Paricutín: the volcano in a cornfield","s":"Earth Science","tp":"Earthquakes and volcanoes","sub":"Volcanoes","lv":["KS3","GCSE"],"who":"Dionisio Pulido","f":0,"loc":"Mexico","rg":["North & Central America"],"yr":1943,"era":"1900–1949","tag":"Nature","x":"On 20 February 1943 the farmer Dionisio Pulido was preparing his cornfield near the village of Paricutín in Mexico when the ground cracked open, hissed and began to smoke. Within a day a cone of ash and rock was 50 m high; within a year, over 300 m. Lava eventually buried two villages, leaving only a church tower poking through the rock. It was the first time scientists could watch a volcano's whole life from birth to its end in 1952.","q":"Why is it rare for scientists to watch a volcano being born?"},{"id":"earth2-003","t":"Mount Pelée and the prisoner in the cell","s":"Earth Science","tp":"Earthquakes and volcanoes","sub":"Pyroclastic flows","lv":["KS3","GCSE"],"who":"Ludger Sylbaris","f":0,"loc":"Martinique","rg":["North & Central America"],"yr":1902,"era":"1900–1949","tag":"Tragedy","x":"In spring 1902, Mount Pelée on the Caribbean island of Martinique rumbled and rained ash, but officials told people in the town of Saint-Pierre to stay, as an election was due. On 8 May a glowing avalanche of hot gas and ash – a pyroclastic flow – swept down at over 100 km/h and destroyed the town in minutes, killing about 28,000 people. One survivor was Ludger Sylbaris, a prisoner in a thick-walled cell. Badly burned, he was rescued days later and toured with a circus.","q":"Why are pyroclastic flows so much more deadly than lava flows?"},{"id":"earth2-004","t":"Eyjafjallajökull grounds Europe's planes","s":"Earth Science","tp":"Earthquakes and volcanoes","sub":"Volcanic ash","lv":["KS3","GCSE"],"who":"","f":0,"loc":"Iceland","rg":["Europe"],"yr":2010,"era":"2000 onwards","tag":"Modern research","x":"In April 2010, the Icelandic volcano Eyjafjallajökull erupted beneath a glacier. Meltwater chilled the magma, shattering it into fine glassy ash that winds carried over Europe. Ash can melt inside jet engines and stick to the turbine blades, so most European airspace closed for six days, stranding millions of travellers – the biggest air-travel shutdown since the Second World War. Engineers have since set safe ash concentration limits for engines.","q":"Why is volcanic ash dangerous for jet engines?"},{"id":"earth2-005","t":"Magnetic stripes on the sea floor","s":"Earth Science","tp":"Plate tectonics","sub":"Sea-floor spreading","lv":["GCSE","A-Level"],"who":"Fred Vine, Drummond Matthews, Lawrence Morley","f":0,"loc":"UK / Canada","rg":["North & Central America","Europe"],"yr":1963,"era":"1950–1999","tag":"Discovery","x":"Ships towing magnetometers found that rocks on the ocean floor formed stripes of normal and reversed magnetism. In 1963, the Cambridge student Fred Vine and his supervisor Drummond Matthews explained this: new rock forms at mid-ocean ridges and records Earth's magnetic field as it cools; when the field flips, the next rock records the opposite direction. The stripes are symmetrical on either side of the ridge, like a tape recording. The Canadian Lawrence Morley had the same idea, but journals rejected his paper.","q":"Why would the stripes be symmetrical on either side of a ridge?"},{"id":"earth2-006","t":"Brunhes finds Earth's field flipped","s":"Earth Science","tp":"Earth's magnetism","sub":"Magnetic reversals","lv":["GCSE","A-Level"],"who":"Bernard Brunhes","f":0,"loc":"France","rg":["Europe"],"yr":1906,"era":"1900–1949","tag":"Discovery","x":"In 1906 the French physicist Bernard Brunhes studied clay baked by ancient lava flows in the Massif Central. When rock cools, magnetic minerals line up with Earth's magnetic field. He found some rocks magnetised in the opposite direction to today's field, and suggested Earth's field had once been reversed. Few believed it for decades. We now know it has flipped hundreds of times. The present period of 'normal' magnetism, which began with the last reversal about 780,000 years ago, is named the Brunhes chron after him.","q":"How can rocks record the direction of a magnetic field?"},{"id":"earth2-007","t":"Harry Reid and the elastic rebound","s":"Earth Science","tp":"Earthquakes and volcanoes","sub":"Faults","lv":["GCSE","A-Level"],"who":"Harry Fielding Reid","f":0,"loc":"USA","rg":["North & Central America"],"yr":1910,"era":"1900–1949","tag":"Discovery","x":"The San Francisco earthquake of 18 April 1906 destroyed much of the city, mainly through fires. Surveying the damage, Harry Fielding Reid noticed that fences and roads across the San Andreas Fault had been offset by up to 6 m. He proposed that rocks on either side are slowly bent as the plates move, storing energy like a bent ruler, until they suddenly snap back – 'elastic rebound'. This is still the basic explanation of how earthquakes happen.","q":"How is an earthquake like a bent ruler snapping?"},{"id":"earth2-008","t":"Lisbon 1755: the earthquake that shook philosophy","s":"Earth Science","tp":"Earthquakes and volcanoes","sub":"Earthquakes","lv":["KS3","GCSE"],"who":"Marquis of Pombal","f":0,"loc":"Portugal","rg":["Europe"],"yr":1755,"era":"1700s","tag":"Tragedy","x":"On the morning of 1 November 1755, All Saints' Day, a huge earthquake struck Lisbon while churches were full. A tsunami followed, and candles started fires that burned for days; tens of thousands died. The prime minister, the Marquis of Pombal, sent questionnaires to every parish asking when the shaking started, how long it lasted and what animals did – one of the first scientific surveys of an earthquake. He rebuilt Lisbon with some of the first earthquake-resistant buildings, tested by marching soldiers around models.","q":"How can buildings be designed to survive earthquakes?"},{"id":"earth2-009","t":"Charles Richter and Beno Gutenberg's scale","s":"Earth Science","tp":"Earthquakes and volcanoes","sub":"Measuring earthquakes","lv":["KS3","GCSE"],"who":"Charles Richter, Beno Gutenberg","f":0,"loc":"USA","rg":["North & Central America"],"yr":1935,"era":"1900–1949","tag":"Discovery","x":"In 1935 at Caltech, Charles Richter and the German seismologist Beno Gutenberg devised a scale to compare earthquakes in southern California, based on the size of the wiggles on a seismometer. It is logarithmic: each whole number step means ten times bigger shaking and about 32 times more energy. Richter got the fame, partly because Gutenberg was shy. Seismologists now use the moment magnitude scale, which works better for very big earthquakes.","q":"How much more energy does a magnitude 7 earthquake release than a magnitude 5?"},{"id":"earth2-010","t":"Tōhoku 2011: the earthquake that moved Japan","s":"Earth Science","tp":"Earthquakes and volcanoes","sub":"Tsunamis","lv":["KS3","GCSE"],"who":"","f":0,"loc":"Japan","rg":["East Asia"],"yr":2011,"era":"2000 onwards","tag":"Tragedy","x":"On 11 March 2011 a magnitude 9.0–9.1 earthquake struck off north-east Japan, the most powerful ever recorded there. The sea floor lurched upwards and sideways by tens of metres, creating a tsunami with waves up to 40 m high that swept inland, killing about 18,000 people and causing the meltdowns at Fukushima Daiichi nuclear plant. Parts of Japan moved 2.4 m east, and the Earth's day was shortened by about 1.8 microseconds. Japan's early warning system stopped trains and gave many people seconds to minutes of warning.","q":"Why do undersea earthquakes cause tsunamis?"},{"id":"earth2-011","t":"The Trieste dives to the deepest point","s":"Earth Science","tp":"Oceans","sub":"Pressure","lv":["KS3","GCSE"],"who":"Jacques Piccard, Don Walsh","f":0,"loc":"Pacific Ocean (Guam)","rg":["Oceania"],"yr":1960,"era":"1950–1999","tag":"Discovery","x":"On 23 January 1960, Jacques Piccard and Don Walsh sank to the bottom of the Challenger Deep in the Mariana Trench, nearly 11 km down, in the bathyscaphe Trieste. Its crew sphere had walls 13 cm thick to withstand over 1,000 times atmospheric pressure. At about 9 km, a window cracked with a bang but held. They spent 20 minutes on the bottom, but stirred-up silt hid the view. Nobody returned for 52 years, until film director James Cameron's solo dive in 2012.","q":"Calculate the pressure at 11 km depth in seawater."},{"id":"earth2-012","t":"HMS Challenger maps the oceans","s":"Earth Science","tp":"Oceans","sub":"Exploration","lv":["KS3","GCSE"],"who":"Charles Wyville Thomson, John Murray","f":0,"loc":"Worldwide","rg":["Worldwide"],"yr":1872,"era":"1800s","tag":"Discovery","x":"From 1872 to 1876, HMS Challenger sailed nearly 130,000 km on the first global ocean science expedition. The navy had removed most of its guns to make room for laboratories. Scientists lowered weighted ropes to measure depth, dredged the sea floor and recorded temperatures. They found the Mariana Trench and discovered thousands of new species. Their report filled 50 volumes and took 19 years to finish. The Challenger Deep and the Space Shuttle Challenger were named after the ship.","q":"How could you measure ocean depth using only a rope?"},{"id":"earth2-013","t":"Gilbert Walker's Southern Oscillation","s":"Earth Science","tp":"Atmosphere and climate","sub":"El Niño","lv":["GCSE","A-Level"],"who":"Gilbert Walker, Jacob Bjerknes","f":0,"loc":"India / Peru","rg":["South Asia","South America"],"yr":1924,"era":"1900–1949","tag":"Discovery","x":"After the monsoon failed in 1899, causing a terrible famine in India, the British mathematician Gilbert Walker was sent to predict the monsoon. Calculating correlations by hand with a team of clerks, he discovered in 1924 that air pressure across the Pacific see-saws between east and west – the 'Southern Oscillation'. Peruvian fishermen had long noticed warm water arriving around Christmas, calling it El Niño. In 1969 Jacob Bjerknes showed they were the same phenomenon, linking oceans and weather worldwide.","q":"How can warm water in one ocean affect weather on the other side of the world?"},{"id":"earth2-014","t":"Tina Negus and Charnia","s":"Earth Science","tp":"Fossils","sub":"Early life","lv":["KS3","GCSE"],"who":"Tina Negus, Roger Mason","f":1,"loc":"UK","rg":["Europe"],"yr":1957,"era":"1950–1999","tag":"Hidden figure","x":"In 1956 a 15-year-old schoolgirl, Tina Negus, noticed a fern-like fossil in rocks in Charnwood Forest, Leicestershire. The rocks were believed to be older than any complex life, so her geography teacher told her there could not be fossils in them. In 1957 the schoolboy Roger Mason found the same fossil and showed it to a geologist at the University of Leicester. Named Charnia, it was one of the first Precambrian fossils recognised anywhere, over 550 million years old. Tina Negus' role was finally recognised years later.","q":"Why did scientists think there could be no fossils in Precambrian rock?"},{"id":"earth2-015","t":"Mary Ann Mantell's Iguanodon tooth","s":"Earth Science","tp":"Fossils","sub":"Dinosaurs","lv":["KS3","GCSE"],"who":"Mary Ann Mantell, Gideon Mantell","f":1,"loc":"UK","rg":["Europe"],"yr":1822,"era":"1800s","tag":"Hidden figure","x":"In 1822, according to a famous story, Mary Ann Mantell found large fossil teeth in roadside stones near Cuckfield in Sussex while her husband, the doctor Gideon Mantell, visited a patient. Gideon noticed they resembled the teeth of an iguana, but much bigger, and named the animal Iguanodon in 1825 – one of the first dinosaurs to be named. Mary Ann also drew many illustrations for his books. Historians debate exactly who found the teeth first.","q":"What can teeth tell us about what an animal ate?"},{"id":"earth2-016","t":"Sue Hendrickson finds Sue the T. rex","s":"Earth Science","tp":"Fossils","sub":"Dinosaurs","lv":["KS3","GCSE"],"who":"Sue Hendrickson","f":1,"loc":"USA","rg":["North & Central America"],"yr":1990,"era":"1950–1999","tag":"Discovery","x":"On 12 August 1990 in South Dakota, the fossil hunter Sue Hendrickson's team had a flat tyre. While the others went to town to fix it, she walked to a cliff she had been curious about and found bones sticking out of the rock. They belonged to the largest, most complete Tyrannosaurus rex then known, about 90% complete, named 'Sue' after her. A legal dispute over who owned the land followed, and in 1997 the skeleton sold at auction for over $8 million to the Field Museum in Chicago.","q":"Why are complete dinosaur skeletons so rare?"},{"id":"earth2-017","t":"Sinosauropteryx: the feathered dinosaur","s":"Earth Science","tp":"Fossils","sub":"Evolution of birds","lv":["KS3","GCSE"],"who":"Li Yumin, Ji Qiang","f":0,"loc":"China","rg":["East Asia"],"yr":1996,"era":"1950–1999","tag":"Discovery","x":"In 1996 a farmer, Li Yumin, split open a slab of fine-grained rock in Liaoning province in China and found a small dinosaur surrounded by a halo of fuzzy filaments. Named Sinosauropteryx by Ji Qiang and colleagues, it was the first dinosaur found with feather-like structures. Volcanic ash had buried it quickly, preserving soft parts. Later studies of its fossil pigment showed it had a ginger-and-white striped tail. Many more feathered dinosaurs have since been found, showing birds are living dinosaurs.","q":"What evidence links birds and dinosaurs?"},{"id":"earth2-018","t":"Charles Walcott and the Burgess Shale","s":"Earth Science","tp":"Fossils","sub":"Cambrian explosion","lv":["KS3","GCSE"],"who":"Charles Walcott, Helena Walcott, Simon Conway Morris","f":1,"loc":"Canada","rg":["North & Central America"],"yr":1909,"era":"1900–1949","tag":"Discovery","x":"In 1909 the American palaeontologist Charles Walcott and his family were riding in the Canadian Rockies when, by family accounts, a horse stumbled on loose rocks, revealing fossils. Over many summers, with his wife Helena and their children, he collected over 65,000 specimens from the Burgess Shale, about 508 million years old. Soft-bodied animals were preserved in astonishing detail, including Hallucigenia, at first reconstructed upside down, and Opabinia, with five eyes. They showed an explosion of animal body plans in the Cambrian.","q":"Why are soft-bodied animals so rarely fossilised?"},{"id":"earth2-019","t":"Kristian Birkeland's terrella","s":"Physics","tp":"Magnetism","sub":"Aurora","lv":["GCSE","A-Level"],"who":"Kristian Birkeland","f":0,"loc":"Norway","rg":["Europe"],"yr":1900,"era":"1900–1949","tag":"Discovery","x":"The Norwegian physicist Kristian Birkeland led expeditions into the Arctic winter to study the northern lights. In his lab around 1900, he placed a magnetised metal sphere – a 'terrella', or little Earth – in a vacuum chamber and fired electrons at it. Glowing rings formed around its magnetic poles, just like auroras. He proposed that charged particles from the Sun cause the aurora, which was only confirmed by satellites in the 1960s. He also invented an electromagnetic cannon and a process for making fertiliser.","q":"Why do auroras appear mainly near the poles?"},{"id":"earth2-020","t":"Snowball Earth","s":"Earth Science","tp":"Earth's structure and history","sub":"Climate history","lv":["GCSE","A-Level"],"who":"Brian Harland, Joseph Kirschvink, Paul Hoffman","f":0,"loc":"UK / USA / Namibia","rg":["Africa","North & Central America","Europe"],"yr":1992,"era":"1950–1999","tag":"Discovery","x":"Geologists found rocks dumped by glaciers in places that were once near the equator, about 700 million years ago. The Cambridge geologist Brian Harland suggested in the 1960s that ice had covered almost the whole planet. In 1992 Joseph Kirschvink named it 'Snowball Earth' and explained how it might end: volcanoes kept releasing carbon dioxide, which built up until the greenhouse effect melted the ice. Paul Hoffman's work in Namibia found thick carbonate rocks lying right on top of glacial deposits, supporting the idea.","q":"Why would a frozen Earth reflect sunlight and stay frozen?"},{"id":"earth2-021","t":"Stromatolites: the oldest living rocks","s":"Earth Science","tp":"Earth's structure and history","sub":"Early life","lv":["KS3","GCSE"],"who":"","f":0,"loc":"Australia","rg":["Oceania"],"yr":1956,"era":"1950–1999","tag":"Nature","x":"Stromatolites are layered mounds built by mats of cyanobacteria, which trap sediment and grow upwards towards light. Fossil stromatolites over 3.4 billion years old are among the oldest evidence of life on Earth. Scientists thought they were extinct until, in 1956, living ones were found in the very salty water of Hamelin Pool at Shark Bay, Western Australia, where few animals can graze on them. Cyanobacteria like these released the oxygen that changed Earth's atmosphere.","q":"How did early bacteria change Earth's atmosphere?"},{"id":"earth2-022","t":"The Jack Hills zircons","s":"Earth Science","tp":"Earth's structure and history","sub":"Age of Earth","lv":["GCSE","A-Level"],"who":"Simon Wilde, John Valley","f":0,"loc":"Australia","rg":["Oceania"],"yr":2001,"era":"2000 onwards","tag":"Discovery","x":"The Jack Hills of Western Australia contain tiny crystals of zircon, smaller than a grain of sand. Zircons trap uranium when they form, which decays steadily into lead, so they act as clocks. In 2001 Simon Wilde and colleagues dated one at 4.4 billion years – only about 150 million years after Earth formed. Its oxygen isotopes suggest liquid water existed on Earth's surface by then, much earlier than people had thought.","q":"How can radioactive decay be used as a clock?"},{"id":"earth2-023","t":"The night Quebec went dark","s":"Physics","tp":"Space","sub":"Space weather","lv":["GCSE","A-Level"],"who":"","f":0,"loc":"Canada","rg":["North & Central America"],"yr":1989,"era":"1950–1999","tag":"Modern research","x":"On 13 March 1989, a powerful burst of charged particles from the Sun hit Earth's magnetic field. The changing field induced currents in long power lines in Quebec, Canada, tripping safety systems. Within about 90 seconds the whole grid collapsed, leaving six million people without electricity for up to nine hours in freezing weather. Auroras were seen as far south as Texas. Power companies now monitor space weather forecasts and can reduce loads on the grid ahead of solar storms.","q":"How can a changing magnetic field cause a current in a power line?"},{"id":"earth2-024","t":"Etheldred Benett, the fossil collector mistaken for a man","s":"Earth Science","tp":"Fossils","sub":"Collecting","lv":["KS3","GCSE"],"who":"Etheldred Benett","f":1,"loc":"UK","rg":["Europe"],"yr":1831,"era":"1800s","tag":"Hidden figure","x":"Etheldred Benett was one of the first women geologists in Britain. From her home in Wiltshire in the early 1800s, she built a huge collection of fossils, especially sponges and ammonites, and shared them with leading geologists. Several scientific papers relied on her specimens. In 1836 she was awarded an honorary doctorate in civil law, an honour then given only to men – reportedly because the people awarding it assumed 'Etheldred' was a man's name.","q":"Why do museum fossil collections matter to science?"},{"id":"earth2-025","t":"Florence Bascom maps the Piedmont","s":"Earth Science","tp":"Rocks and geology","sub":"Igneous and metamorphic rocks","lv":["KS3","GCSE"],"who":"Florence Bascom","f":1,"loc":"USA","rg":["North & Central America"],"yr":1896,"era":"1800s","tag":"Hidden figure","x":"At Johns Hopkins University, Florence Bascom had to sit behind a screen in lectures so the male students would not be distracted. In 1893 she became the first woman to earn a PhD there, and in 1896 the first woman to work for the US Geological Survey. She mapped the complex rocks of the Piedmont region, showing that some rocks thought to be sedimentary were metamorphosed lava. She trained many of the next generation of American women geologists at Bryn Mawr College.","q":"How can you tell a metamorphic rock from an igneous one?"},{"id":"earth2-026","t":"Dorothea Bate and the pygmy elephants","s":"Earth Science","tp":"Fossils","sub":"Island evolution","lv":["KS3","GCSE"],"who":"Dorothea Bate","f":1,"loc":"UK / Cyprus / Malta","rg":["Europe"],"yr":1902,"era":"1900–1949","tag":"Hidden figure","x":"Dorothea Bate had almost no formal schooling, but at 19 she talked her way into a job at the Natural History Museum in London, sorting bird skins. In 1901–02 she travelled alone to Cyprus, climbing cliffs and exploring caves, and found fossils of pygmy hippos and dwarf elephants only about a metre tall. She showed that large animals on islands often evolved to become smaller. She became one of the first women employed as a scientist by the museum.","q":"Why might large animals evolve to become smaller on islands?"},{"id":"earth2-027","t":"Ibn Sina explains mountains","s":"Earth Science","tp":"Rocks and geology","sub":"Rock cycle","lv":["KS3","GCSE"],"who":"Ibn Sina (Avicenna)","f":0,"loc":"Iran / Uzbekistan","rg":["Middle East","Central Asia"],"yr":1027,"era":"Medieval","tag":"Discovery","x":"In his Book of Healing, finished around 1027, the Persian scholar Ibn Sina, best known for medicine, discussed how mountains form. He suggested some were raised by earthquakes, while valleys were carved by water and wind wearing away softer rock, and that the process took immense periods of time. He noted that layered rocks with fossil sea creatures must once have been under the sea. These ideas anticipated modern geology by centuries.","q":"Why do softer rocks wear away faster than harder rocks?"},{"id":"earth2-028","t":"Nicolas Steno's tongue stones","s":"Earth Science","tp":"Rocks and geology","sub":"Sedimentary rocks","lv":["KS3","GCSE"],"who":"Nicolas Steno","f":0,"loc":"Denmark / Italy","rg":["Europe"],"yr":1667,"era":"1500–1699","tag":"Discovery","x":"'Tongue stones' were believed to fall from the sky or grow inside rocks. In 1666 fishermen near Livorno caught a huge shark, and its head was sent to the Danish anatomist Nicolas Steno in Florence. He noticed its teeth looked exactly like tongue stones, and concluded they were fossil shark teeth. He then worked out that sedimentary rock forms in layers, with the oldest at the bottom – the law of superposition, still a basic rule of geology. Steno later became a Catholic bishop.","q":"In a cliff of layered rock, which layer is oldest?"},{"id":"earth2-029","t":"Richard Oldham finds the core","s":"Earth Science","tp":"Earth's structure and history","sub":"Seismic waves","lv":["GCSE","A-Level"],"who":"Richard Dixon Oldham, Beno Gutenberg","f":0,"loc":"India / UK","rg":["South Asia","Europe"],"yr":1906,"era":"1900–1949","tag":"Discovery","x":"Working for the Geological Survey of India, Richard Dixon Oldham studied the great Assam earthquake of 1897 and was first to identify separate P, S and surface waves on seismograms. In 1906 he noticed that P waves travelling through the middle of the Earth arrived later than expected, and proposed a dense central core. In 1913 Beno Gutenberg calculated its depth at about 2,900 km, very close to today's value. Because S waves cannot pass through it, the outer core must be liquid.","q":"Why can't S waves travel through liquid?"},{"id":"earth2-030","t":"Darwin feels an earthquake in Chile","s":"Earth Science","tp":"Earthquakes and volcanoes","sub":"Uplift","lv":["KS3","GCSE"],"who":"Charles Darwin, Robert FitzRoy","f":0,"loc":"Chile","rg":["South America"],"yr":1835,"era":"1800s","tag":"Discovery","x":"On 20 February 1835, during the voyage of the Beagle, Charles Darwin was resting in a forest near Valdivia, Chile, when a huge earthquake struck. At nearby Concepción, he saw a city in ruins. Captain FitzRoy measured that the land around the bay had been raised by about 2.5 m – dead mussel beds now stood above the high-tide line. Darwin realised that repeated small uplifts could, over vast time, raise the Andes, and later found fossil seashells high in the mountains.","q":"How can fossil seashells end up on top of mountains?"},{"id":"earth2-031","t":"Friendly Floatees: rubber ducks map the oceans","s":"Earth Science","tp":"Oceans","sub":"Currents","lv":["KS3","GCSE"],"who":"Curtis Ebbesmeyer","f":0,"loc":"Pacific Ocean","rg":["Oceania"],"yr":1992,"era":"1950–1999","tag":"Everyday","x":"In January 1992, a container ship in a storm in the North Pacific lost a container of 28,800 plastic bath toys – yellow ducks, red beavers, blue turtles and green frogs. Ocean scientist Curtis Ebbesmeyer asked beachcombers to report where they washed up. They turned up in Alaska, Hawaii and South America; some drifted through the Arctic and reached the Atlantic years later. The reports helped test computer models of ocean currents. In 1997 a ship lost nearly 5 million Lego pieces off Cornwall, which are still washing up today.","q":"What do the toys' journeys tell us about plastic pollution?"},{"id":"earth2-032","t":"Claude Lorius and the ice in his whisky","s":"Earth Science","tp":"Atmosphere and climate","sub":"Ice cores","lv":["GCSE","A-Level"],"who":"Claude Lorius","f":0,"loc":"France / Antarctica","rg":["Antarctica & Arctic","Europe"],"yr":1965,"era":"1950–1999","tag":"Discovery","x":"In 1965 the French glaciologist Claude Lorius was celebrating with colleagues at an Antarctic base. He dropped a piece of ancient ice from an ice core into his whisky and watched tiny bubbles fizz out. He realised the bubbles were samples of air trapped thousands of years ago. Later, his team drilled deep at Vostok station; by 1987 they showed carbon dioxide levels and temperature had risen and fallen together over 160,000 years. Ice cores now reveal climate over 800,000 years.","q":"Why do ice cores contain samples of ancient air?"},{"id":"earth2-033","t":"Paul Crutzen blurts out 'Anthropocene'","s":"Earth Science","tp":"Earth's structure and history","sub":"Human impact","lv":["GCSE","A-Level"],"who":"Paul Crutzen, Eugene Stoermer","f":0,"loc":"Mexico / Netherlands","rg":["North & Central America","Europe"],"yr":2000,"era":"2000 onwards","tag":"Modern research","x":"At a conference in Cuernavaca, Mexico, in February 2000, the Dutch atmospheric chemist Paul Crutzen, who shared a Nobel Prize for work on the ozone layer, grew frustrated as colleagues kept describing the present as the Holocene. He burst out that we were no longer in the Holocene but the Anthropocene – an age shaped by humans. Eugene Stoermer had used the word before. In 2024 geologists voted not to make it an official unit of geological time, though the term remains widely used.","q":"What evidence might future geologists find of humans in rock layers?"},{"id":"earth2-034","t":"George Hadley and the trade winds","s":"Earth Science","tp":"Atmosphere and climate","sub":"Global winds","lv":["GCSE","A-Level"],"who":"George Hadley, Edmond Halley","f":0,"loc":"UK","rg":["Europe"],"yr":1735,"era":"1700s","tag":"Discovery","x":"Sailors relied on the trade winds blowing steadily from the north-east and south-east towards the equator. Edmond Halley explained in 1686 that hot air rises at the equator and cooler air flows in to replace it, but he could not explain why the winds blow at an angle. In 1735 the London lawyer George Hadley realised the Earth's rotation deflects them. His explanation was ignored for decades. The giant loops of rising and sinking air are now called Hadley cells.","q":"Why are many of the world's deserts found around 30° north and south?"},{"id":"earth2-035","t":"Wilson Bentley photographs snowflakes","s":"Earth Science","tp":"Atmosphere and climate","sub":"Ice crystals","lv":["KS3","GCSE"],"who":"Wilson Bentley, Ukichiro Nakaya","f":0,"loc":"USA / Japan","rg":["East Asia","North & Central America"],"yr":1885,"era":"1800s","tag":"Eccentric","x":"Wilson Bentley, a farmer in Vermont, attached a microscope to a bellows camera, and on 15 January 1885 took the first photograph of a single snowflake. He caught flakes on black velvet and worked fast before they melted, photographing over 5,000 in his life. In 1936 the Japanese physicist Ukichiro Nakaya grew the first artificial snowflakes in a cold room in Hokkaido and showed temperature and humidity decide their shape. He called snow 'a letter from the sky'.","q":"Why do snowflakes have six-fold symmetry?"},{"id":"earth2-036","t":"Vincent Schaefer makes a cloud snow","s":"Earth Science","tp":"Atmosphere and climate","sub":"Precipitation","lv":["KS3","GCSE"],"who":"Vincent Schaefer, Irving Langmuir, Bernard Vonnegut","f":0,"loc":"USA","rg":["North & Central America"],"yr":1946,"era":"1900–1949","tag":"Accident","x":"In July 1946, at General Electric, Vincent Schaefer was trying to make ice crystals form in a freezer full of supercooled cloud – water droplets below 0 °C that hadn't frozen. On a hot day, he dropped in some dry ice to cool it, and the cloud instantly sparkled with millions of ice crystals. In November he dropped dry ice from a plane over a cloud in Massachusetts and created snow. Bernard Vonnegut, brother of the novelist Kurt, later found silver iodide worked too. Cloud seeding is still used, with debated results.","q":"Why does supercooled water freeze so suddenly when seeded?"},{"id":"earth2-037","t":"Clement Wragge names cyclones after politicians","s":"Earth Science","tp":"Atmosphere and climate","sub":"Storms","lv":["KS3"],"who":"Clement Wragge","f":0,"loc":"Australia","rg":["Oceania"],"yr":1887,"era":"1800s","tag":"Eccentric","x":"Clement Wragge, an eccentric English-born meteorologist in Queensland, Australia, began giving names to tropical cyclones in the 1890s. He used letters of the Greek alphabet, figures from mythology – and the names of politicians he disliked, so he could announce that a particular politician was 'causing great distress' or 'wandering aimlessly about the Pacific'. Naming storms makes warnings clearer, and the World Meteorological Organization now uses lists of names in turn.","q":"Why is it useful to give storms names?"},{"id":"earth2-038","t":"The Kola Superdeep Borehole","s":"Earth Science","tp":"Earth's structure and history","sub":"The crust","lv":["KS3","GCSE"],"who":"","f":0,"loc":"Russia","rg":["Europe"],"yr":1989,"era":"1950–1999","tag":"Discovery","x":"From 1970 Soviet scientists drilled into the crust on the Kola Peninsula near the Arctic. By 1989 they had reached 12,262 m – still the deepest hole ever drilled – but less than a third of the way through the continental crust there. At the bottom the rock was about 180 °C, much hotter than expected, and behaved more like plastic than solid rock. They found water deep in the rock and microscopic fossils of plankton 6 km down. The hole was abandoned in the 1990s and is now sealed with a metal cap.","q":"Why does temperature increase with depth in the Earth?"},{"id":"earth2-039","t":"Harry Hess's sonar sea floor","s":"Earth Science","tp":"Plate tectonics","sub":"Sea-floor spreading","lv":["GCSE","A-Level"],"who":"Harry Hess","f":0,"loc":"USA / Pacific Ocean","rg":["Oceania","North & Central America"],"yr":1962,"era":"1950–1999","tag":"Wartime","x":"During the Second World War, the geologist Harry Hess commanded a US Navy transport ship, the USS Cape Johnson. He kept its echo sounder running across the Pacific, collecting sea-floor depth readings between battles. He found many flat-topped undersea mountains, which he called guyots. In 1962 he proposed that new sea floor forms at mid-ocean ridges and spreads outwards, sinking back into the mantle at trenches. He called his paper an 'essay in geopoetry', but it helped establish plate tectonics.","q":"How does an echo sounder measure the depth of the sea?"},{"id":"earth2-040","t":"Cambrian, Ordovician, Silurian: rocks named after Wales","s":"Earth Science","tp":"Rocks and geology","sub":"Geological time","lv":["KS3","GCSE"],"who":"Adam Sedgwick, Roderick Murchison, Charles Lapworth","f":0,"loc":"Wales","rg":["Europe"],"yr":1879,"era":"1800s","tag":"Rivalry","x":"In the 1830s, Adam Sedgwick studied ancient rocks in north Wales and named them Cambrian, after Cambria, the Latin name for Wales. Roderick Murchison studied rocks in south and mid-Wales and named them Silurian, after the Silures, an Iron Age tribe there. Their periods overlapped, and the friends became bitter rivals over who owned the rocks in the middle. In 1879 Charles Lapworth ended the dispute by creating a new period between them, the Ordovician, named after another Welsh tribe, the Ordovices.","q":"How do fossils help geologists divide rock into time periods?"},{"id":"earth2-041","t":"Darwin misses the glaciers in Snowdonia","s":"Earth Science","tp":"Rocks and geology","sub":"Glaciation","lv":["KS3","GCSE"],"who":"Charles Darwin, Adam Sedgwick","f":0,"loc":"Wales","rg":["Europe"],"yr":1842,"era":"1800s","tag":"Blunder","x":"In August 1831, just before the Beagle voyage, the young Charles Darwin toured north Wales with Adam Sedgwick, looking at rocks. Neither noticed the many signs of ancient glaciers. When Darwin returned to Cwm Idwal in 1842, he wrote that the scratched rocks, perched boulders and moraines were so plain that a house burned down by fire did not tell its story more clearly – yet he had walked past them without seeing them. It taught him how much observation depends on expecting to see something.","q":"What landforms show that glaciers once covered an area?"},{"id":"earth2-042","t":"The Murchison meteorite","s":"Earth Science","tp":"Space","sub":"Origins of life","lv":["GCSE","A-Level"],"who":"","f":0,"loc":"Australia","rg":["Oceania"],"yr":1969,"era":"1950–1999","tag":"Discovery","x":"On 28 September 1969, a fireball broke up over the town of Murchison in Victoria, Australia, scattering more than 100 kg of meteorite fragments, some of which smelled of methylated spirits. Scientists, newly prepared for Moon rocks from Apollo 11, analysed them quickly and found amino acids – the building blocks of proteins – including types rare on Earth, so they could not be contamination. Later studies found tens of thousands of organic compounds, and even sugars, supporting the idea that life's ingredients can form in space.","q":"How could scientists tell the amino acids were not Earth contamination?"},{"id":"earth2-043","t":"Aberfan, 1966","s":"Earth Science","tp":"Rocks and geology","sub":"Slope stability","lv":["KS3","GCSE"],"who":"","f":0,"loc":"Wales","rg":["Europe"],"yr":1966,"era":"1950–1999","tag":"Tragedy","x":"On the morning of 21 October 1966, after days of heavy rain, a colliery spoil tip above the village of Aberfan in south Wales slid down the mountainside. It had been built over a spring. A wave of saturated waste engulfed Pantglas Junior School and nearby houses, killing 144 people, 116 of them children. The inquiry blamed the National Coal Board, which had ignored warnings. The disaster led to new laws on the safety of tips. Studying slope stability and water in soils helps prevent landslides today.","q":"Why does water make a slope more likely to collapse?"},{"id":"chem4-001","t":"Paul Sabatier's nickel catalyst","s":"Chemistry","tp":"Rates and equilibrium","sub":"Catalysts","lv":["GCSE","A-Level"],"who":"Paul Sabatier, Jean-Baptiste Senderens","f":0,"loc":"France","rg":["Europe"],"yr":1897,"era":"1800s","tag":"Discovery","x":"In 1897 in Toulouse, Paul Sabatier and the priest-chemist Jean-Baptiste Senderens passed ethene and hydrogen over hot, finely divided nickel and found they combined to make ethane. Nickel catalysed the addition of hydrogen to double bonds – hydrogenation. The method was soon used to turn liquid vegetable oils into solid fats for margarine. Sabatier refused offers to move to Paris, preferring to stay in the south, and shared the 1912 Nobel Prize in Chemistry.","q":"Why does hydrogenating an oil make it more solid?"},{"id":"chem4-002","t":"Napoleon III's prize and the first margarine","s":"Chemistry","tp":"Organic chemistry","sub":"Fats","lv":["KS3","GCSE"],"who":"Hippolyte Mège-Mouriès","f":0,"loc":"France","rg":["Europe"],"yr":1869,"era":"1800s","tag":"Invention","x":"In 1866 Emperor Napoleon III offered a prize for a cheap substitute for butter for the army and the poor. In 1869 the chemist Hippolyte Mège-Mouriès won it with a spread made from beef fat churned with milk. He called it 'oleomargarine', from the Greek for pearl, because of its pearly droplets. Dairy farmers fought back; some US states made margarine sellers dye it pink so it could not pass for butter.","q":"Why might a cheap fat be important for an army?"},{"id":"chem4-003","t":"Rosalind Franklin's coal","s":"Chemistry","tp":"Bonding","sub":"Structure","lv":["GCSE","A-Level"],"who":"Rosalind Franklin","f":1,"loc":"UK","rg":["Europe"],"yr":1946,"era":"1900–1949","tag":"Hidden figure","x":"Before her famous DNA work, Rosalind Franklin spent the Second World War working for the British Coal Utilisation Research Association. She measured how tiny pores in different coals let gases through, explaining why some coals were better for gas masks and fuel. In Paris after the war she learned X-ray crystallography and showed why some carbons turn to graphite when heated and others never do. Her coal research earned her PhD and is still widely cited.","q":"Why would the pore size of coal matter in a gas mask?"},{"id":"chem4-004","t":"Gay-Lussac's balloon to 7,000 metres","s":"Chemistry","tp":"Atmosphere","sub":"Composition of air","lv":["KS3","GCSE"],"who":"Joseph Louis Gay-Lussac, Jean-Baptiste Biot","f":0,"loc":"France","rg":["Europe"],"yr":1804,"era":"1800s","tag":"Eccentric","x":"In 1804 Joseph Louis Gay-Lussac and Jean-Baptiste Biot rose in a hydrogen balloon to study the atmosphere. On a second, solo flight, Gay-Lussac reached about 7,000 m – a height record that stood for over 50 years. In thin, freezing air he measured temperature and magnetism and collected air samples in flasks. Back in Paris, he found air at that height had the same composition as at ground level. To gain height he threw out ballast – including, the story goes, a wooden chair, which landed near a startled shepherdess.","q":"Why does air get thinner as you go higher?"},{"id":"chem4-005","t":"Proust versus Berthollet","s":"Chemistry","tp":"Chemical reactions","sub":"Fixed proportions","lv":["GCSE"],"who":"Joseph Proust, Claude Berthollet","f":0,"loc":"France / Spain","rg":["Europe"],"yr":1799,"era":"1700s","tag":"Rivalry","x":"Do compounds always contain elements in the same proportions? Joseph Proust, a French chemist working in Spain, said yes: copper carbonate always contained the same proportions of copper, carbon and oxygen, however it was made. Claude Berthollet said compositions could vary. Their polite debate in journals ran from 1799 to 1806. Proust was largely right, and the law of definite proportions helped Dalton develop atomic theory. Berthollet was not entirely wrong: some solids, such as iron oxides, do vary slightly.","q":"How does atomic theory explain fixed proportions?"},{"id":"chem4-006","t":"Thomas Graham's diffusion and dialysis","s":"Chemistry","tp":"Particles","sub":"Diffusion","lv":["GCSE","A-Level"],"who":"Thomas Graham","f":0,"loc":"UK","rg":["Europe"],"yr":1833,"era":"1800s","tag":"Discovery","x":"The Glasgow chemist Thomas Graham studied how gases escape through tiny holes and spread out. In 1833 he showed that lighter gases diffuse faster – a gas's rate of diffusion is inversely proportional to the square root of its density. Later he showed that some dissolved substances pass through parchment membranes while others do not, a process he called dialysis, which is now used to clean the blood of people with kidney failure. He also coined the word 'colloid'. His father wanted him to be a minister.","q":"Why would hydrogen diffuse faster than oxygen?"},{"id":"chem4-007","t":"Superglue: rejected twice","s":"Chemistry","tp":"Polymers","sub":"Addition polymers","lv":["KS3","GCSE"],"who":"Harry Coover, Fred Joyner","f":0,"loc":"USA","rg":["North & Central America"],"yr":1951,"era":"1950–1999","tag":"Accident","x":"In 1942 Harry Coover was trying to make clear plastic gunsights and found cyanoacrylates stuck to everything – so he rejected them. In 1951, working on heat-resistant aircraft canopies, his colleague Fred Joyner spread a cyanoacrylate between two expensive prisms of a refractometer to measure it, and they were stuck fast and ruined. This time Coover realised he had a glue. It polymerises in seconds when it meets traces of water on surfaces. It was sold from 1958, and medics used sprays of it to seal wounds in the Vietnam War.","q":"Why does superglue set fastest in slightly damp conditions?"},{"id":"chem4-008","t":"Spencer Silver's weak glue and Art Fry's hymn book","s":"Chemistry","tp":"Polymers","sub":"Adhesives","lv":["KS3"],"who":"Spencer Silver, Art Fry","f":0,"loc":"USA","rg":["North & Central America"],"yr":1974,"era":"1950–1999","tag":"Accident","x":"In 1968 Spencer Silver at 3M was trying to make a strong adhesive and instead made one made of tiny sticky spheres that stuck lightly and peeled off cleanly. For years nobody found a use for it. In 1974 his colleague Art Fry, singing in his church choir, was annoyed that his paper bookmarks kept falling out of his hymn book. He remembered Silver's glue and put it on the bookmarks. The Post-it Note went on sale in 1980.","q":"Why might a 'failed' experiment still be useful?"},{"id":"chem4-009","t":"Bob Gore stretches PTFE","s":"Chemistry","tp":"Polymers","sub":"Properties","lv":["KS3","GCSE"],"who":"Bob Gore, Wilbert Gore, Genevieve Gore","f":1,"loc":"USA","rg":["North & Central America"],"yr":1969,"era":"1950–1999","tag":"Accident","x":"In 1969 Bob Gore was trying to stretch rods of PTFE slowly, but they kept snapping. In frustration he gave one a sudden, sharp yank – and it stretched to many times its length, becoming a strong material full of microscopic pores. The holes are too small for liquid water droplets to pass through but big enough for water vapour from sweat. His parents, Wilbert and Genevieve Gore, had founded the family company. Gore-Tex fabrics, medical grafts and guitar strings followed.","q":"How can a fabric be waterproof but let sweat escape?"},{"id":"chem4-010","t":"Frederic Kipping names the silicones","s":"Chemistry","tp":"Polymers","sub":"Silicones","lv":["GCSE","A-Level"],"who":"Frederic Kipping","f":0,"loc":"UK","rg":["Europe"],"yr":1901,"era":"1900–1949","tag":"Blunder","x":"From 1899 at University College Nottingham, Frederic Kipping made hundreds of compounds of silicon with carbon groups. He thought some were like ketones and named them 'silicones'. They were actually long chains of alternating silicon and oxygen atoms. Kipping himself thought they were sticky, useless goos and said in 1937 that he saw little prospect of any useful application. Silicones are now used in sealants, cookware, lubricants and medical implants.","q":"Why does silicone rubber withstand heat better than many carbon-based polymers?"},{"id":"chem4-011","t":"Bessie Littleton's Pyrex cake","s":"Chemistry","tp":"Materials","sub":"Glass","lv":["KS3","GCSE"],"who":"Bessie Littleton, Jesse Littleton","f":1,"loc":"USA","rg":["North & Central America"],"yr":1913,"era":"1900–1949","tag":"Hidden figure","x":"Corning made heat-resistant borosilicate glass for railway lanterns, which had to survive cold rain hitting the hot glass. In 1913 the Corning physicist Jesse Littleton's wife Bessie complained that her casserole dish had cracked in the oven. He brought home the cut-off bottom of a borosilicate battery jar, and she baked a sponge cake in it. It cooked evenly and you could see when it was done. Pyrex ovenware went on sale in 1915.","q":"Why does ordinary glass crack when heated unevenly?"},{"id":"chem4-012","t":"Reinitzer's cloudy liquid and George Gray's LCDs","s":"Chemistry","tp":"Materials","sub":"Liquid crystals","lv":["GCSE","A-Level"],"who":"Friedrich Reinitzer, Otto Lehmann, George Gray","f":0,"loc":"Austria / Germany / UK","rg":["Europe"],"yr":1888,"era":"1800s","tag":"Discovery","x":"In 1888 the Austrian botanist Friedrich Reinitzer, studying a compound from carrots, found it had two melting points: at 145 °C it became a cloudy liquid, and at 179 °C clear. The physicist Otto Lehmann called these materials 'liquid crystals' – they flow, but their molecules line up. In 1972 George Gray at the University of Hull made stable liquid crystals that worked at room temperature, the cyanobiphenyls, which made practical LCD screens possible.","q":"How can molecules be both ordered and able to flow?"},{"id":"chem4-013","t":"The guano age","s":"Chemistry","tp":"Chemical reactions","sub":"Fertilisers","lv":["GCSE"],"who":"Alexander von Humboldt","f":0,"loc":"Peru / Chile","rg":["South America"],"yr":1840,"era":"1800s","tag":"Tragedy","x":"Seabird droppings piled tens of metres deep on the dry Chincha Islands off Peru are rich in nitrogen and phosphorus. After Alexander von Humboldt brought samples to Europe in 1802, guano became one of the world's most valuable fertilisers from the 1840s. Thousands of indentured Chinese labourers dug it in brutal conditions. Spain seized the islands in 1864, and nations fought over Chile's nitrate deserts in the War of the Pacific from 1879. The Haber process later made such natural sources far less important.","q":"Why do plants need nitrogen?"},{"id":"chem4-014","t":"Robert Angus Smith names acid rain","s":"Chemistry","tp":"Atmosphere","sub":"Acid rain","lv":["KS3","GCSE"],"who":"Robert Angus Smith","f":0,"loc":"UK","rg":["Europe"],"yr":1852,"era":"1800s","tag":"Discovery","x":"In 1852 the Scottish chemist Robert Angus Smith analysed rain falling on Manchester, then thick with coal smoke, and found it contained sulphuric acid. He coined the term 'acid rain' and showed it damaged buildings, metals and plants. In 1872 he published a detailed book on the subject. He became the first chief Alkali Inspector, enforcing Britain's early pollution laws. Acid rain became an international issue in the 1970s–80s, when it killed fish in Scandinavian lakes.","q":"How does sulphur dioxide from coal become acid rain?"},{"id":"chem4-015","t":"Schönbein's apron explodes","s":"Chemistry","tp":"Chemical reactions","sub":"Explosives","lv":["KS3","GCSE"],"who":"Christian Schönbein","f":0,"loc":"Switzerland","rg":["Europe"],"yr":1845,"era":"1800s","tag":"Accident","x":"Christian Schönbein, a German chemist in Basel, had already discovered ozone in 1840 by its smell near electrical sparks, naming it from the Greek for 'to smell'. In 1845, the story goes, he was experimenting in his kitchen and spilled a mixture of nitric and sulphuric acid. He wiped it up with his wife's cotton apron and hung it by the stove to dry. It burned in a flash, leaving no smoke. He had made nitrocellulose, 'guncotton', which became an important explosive.","q":"Why are some substances explosive?"},{"id":"chem4-016","t":"Guldberg and Waage: the brothers-in-law of equilibrium","s":"Chemistry","tp":"Rates and equilibrium","sub":"Equilibrium","lv":["A-Level"],"who":"Cato Guldberg, Peter Waage","f":0,"loc":"Norway","rg":["Europe"],"yr":1864,"era":"1800s","tag":"Discovery","x":"In 1864 two Norwegian chemists in Christiania (now Oslo), Cato Guldberg and Peter Waage, who were friends and later brothers-in-law, published the law of mass action: the rate of a reaction depends on the concentrations of the reactants, and at equilibrium the forward and backward rates are equal. They published in Norwegian, so few chemists noticed until they republished in French in 1867 and German in 1879. Their law leads to the equilibrium constant, Kc.","q":"What does it mean for a reaction to be at equilibrium?"},{"id":"chem4-017","t":"Martin and Synge sort amino acids from wool","s":"Chemistry","tp":"Chemical analysis","sub":"Chromatography","lv":["GCSE","A-Level"],"who":"Archer Martin, Richard Synge","f":0,"loc":"UK","rg":["Europe"],"yr":1941,"era":"1900–1949","tag":"Invention","x":"At the Wool Industries Research Association in Leeds, Archer Martin and Richard Synge wanted to separate the amino acids in wool proteins. In 1941 they invented partition chromatography, in which substances separate because they share themselves differently between a moving solvent and a stationary liquid. It led to paper chromatography, now done in every school, and to gas chromatography. They shared the 1952 Nobel Prize in Chemistry.","q":"Why do different substances travel different distances on chromatography paper?"},{"id":"chem4-018","t":"Lauterbur, Mansfield and the MRI scanner","s":"Chemistry","tp":"Chemical analysis","sub":"Spectroscopy","lv":["A-Level"],"who":"Paul Lauterbur, Peter Mansfield, Raymond Damadian","f":0,"loc":"USA / UK","rg":["North & Central America","Europe"],"yr":1973,"era":"1950–1999","tag":"Discovery","x":"NMR spectroscopy uses magnetic fields and radio waves to study molecules. In 1
