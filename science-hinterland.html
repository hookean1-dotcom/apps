971, eating in a burger restaurant, Paul Lauterbur realised that varying the magnetic field across a sample could create an image. Nature initially rejected his 1973 paper. At Nottingham, Peter Mansfield, who had left school at 15, developed fast mathematical ways to turn the signals into images, and volunteered to be scanned in his prototype. They shared the 2003 Nobel Prize, angering Raymond Damadian, who claimed credit.","q":"Why are hydrogen atoms in water so useful for MRI scans?"},{"id":"chem4-019","t":"Mary Blandy and the arsenic trial","s":"Chemistry","tp":"Chemical analysis","sub":"Forensics","lv":["GCSE"],"who":"Mary Blandy, Anthony Addington","f":1,"loc":"UK","rg":["Europe"],"yr":1752,"era":"1700s","tag":"Tragedy","x":"In 1751 Mary Blandy of Henley-on-Thames gave her father a white powder in his tea and gruel, given to her by her suitor, who claimed it was a love potion. Her father died. At her trial in Oxford in 1752, the doctor Anthony Addington described heating the powder left in the pan and comparing its garlic smell and white fumes with known arsenic – one of the first times chemical evidence was used in a British court. She was convicted. Arsenic was called 'inheritance powder'.","q":"Why are reliable chemical tests essential in court cases?"},{"id":"chem4-020","t":"The nurse who had read Agatha Christie","s":"Chemistry","tp":"Chemical analysis","sub":"Toxicology","lv":["KS3","GCSE"],"who":"Agatha Christie, Marsha Maitland","f":1,"loc":"UK / Qatar","rg":["Middle East","Europe"],"yr":1977,"era":"1950–1999","tag":"Everyday","x":"Agatha Christie worked in a hospital pharmacy during both world wars and knew her poisons. In 1977 a 19-month-old girl from Qatar was flown to London's Hammersmith Hospital seriously ill with a mystery illness. A nurse, Marsha Maitland, was reading Christie's novel The Pale Horse, and noticed the child's symptoms, including hair loss, matched the fictional thallium poisoning. Tests confirmed thallium, probably from pesticide at home, and the child recovered.","q":"Why should poisons be stored securely at home?"},{"id":"chem4-021","t":"Minamata disease","s":"Chemistry","tp":"Health and medicine","sub":"Pollution","lv":["KS3","GCSE"],"who":"Hajime Hosokawa, W. Eugene Smith, Aileen Mioko Smith","f":1,"loc":"Japan","rg":["East Asia"],"yr":1956,"era":"1950–1999","tag":"Tragedy","x":"In the 1950s, cats in the fishing town of Minamata in Japan began convulsing and dying, and then people developed numbness, slurred speech and paralysis. The Chisso chemical factory had been discharging waste containing mercury into the bay, where it was converted into methylmercury and built up in fish and shellfish. The company doctor Hajime Hosokawa showed in 1959 that factory waste made cats ill, but the results were suppressed. Photographers W. Eugene Smith and Aileen Mioko Smith brought the story to the world. The Minamata Convention on mercury was signed in 2013.","q":"Why does mercury become more concentrated further up a food chain?"},{"id":"chem4-022","t":"Mad as a hatter","s":"Chemistry","tp":"Health and medicine","sub":"Toxic metals","lv":["KS3","GCSE"],"who":"","f":0,"loc":"UK / USA / France","rg":["North & Central America","Europe"],"yr":1860,"era":"1800s","tag":"Everyday","x":"In the 1700s and 1800s, hat makers used a solution of mercury nitrate to make animal fur matt together into felt for hats. Breathing mercury vapour in hot, poorly ventilated workshops caused tremors, irritability, shyness and memory loss – 'the hatter's shakes'. The phrase 'mad as a hatter' was in use before Lewis Carroll's Mad Hatter. In the USA, mercury was banned from hat making only in 1941, partly because it was needed for wartime detonators.","q":"Why is breathing in mercury vapour especially dangerous?"},{"id":"chem4-023","t":"Arsenic in Bangladesh's tube wells","s":"Chemistry","tp":"Chemical analysis","sub":"Water quality","lv":["GCSE"],"who":"Dipankar Chakraborti","f":0,"loc":"Bangladesh / India","rg":["South Asia"],"yr":1995,"era":"1950–1999","tag":"Tragedy","x":"From the 1970s, aid agencies helped drill millions of shallow tube wells across Bangladesh and West Bengal to give people water free from the germs in rivers and ponds, saving many lives from diarrhoeal disease. But in the 1990s, researchers including Dipankar Chakraborti in Kolkata found that groundwater in many wells contained natural arsenic from the rocks. Tens of millions of people were exposed, causing skin lesions and cancers. Wells are now tested and painted red or green to show whether they are safe.","q":"How could a well-meant solution create a new problem?"},{"id":"chem4-024","t":"Bhopal, 1984","s":"Chemistry","tp":"Chemical reactions","sub":"Industrial safety","lv":["GCSE"],"who":"","f":0,"loc":"India","rg":["South Asia"],"yr":1984,"era":"1950–1999","tag":"Tragedy","x":"On the night of 2–3 December 1984, water entered a storage tank of methyl isocyanate at the Union Carbide pesticide plant in Bhopal, India. The exothermic reaction raised the temperature and pressure, and about 40 tonnes of toxic gas escaped over the sleeping city. Safety systems were broken or switched off. Thousands died within days, and many more later; hundreds of thousands were injured. It is the world's worst industrial disaster and changed how chemical plants are regulated.","q":"Why can an exothermic reaction become dangerous in a sealed tank?"},{"id":"chem4-025","t":"Prussian blue: an accident with contaminated potash","s":"Chemistry","tp":"Chemical reactions","sub":"Pigments","lv":["KS3","GCSE"],"who":"Johann Jacob Diesbach, Johann Konrad Dippel","f":0,"loc":"Germany","rg":["Europe"],"yr":1706,"era":"1700s","tag":"Accident","x":"Around 1706 in Berlin, the colour maker Johann Jacob Diesbach was trying to make a red pigment from insects. He borrowed potash from the alchemist Johann Dippel, but it was contaminated with animal blood. Instead of red, he got a deep blue – iron hexacyanoferrate, Prussian blue, the first modern synthetic pigment. Hokusai used it in The Great Wave. In the 1840s, blueprints for engineering drawings used a related reaction, and Prussian blue is now a medicine for radioactive caesium poisoning.","q":"How can an impurity change the result of a reaction?"},{"id":"chem4-026","t":"Synthetic indigo and the farmers of Bengal","s":"Chemistry","tp":"Organic chemistry","sub":"Dyes","lv":["GCSE","A-Level"],"who":"Adolf von Baeyer","f":0,"loc":"Germany / India","rg":["South Asia","Europe"],"yr":1897,"era":"1800s","tag":"Discovery","x":"Indigo, the blue of jeans, came from plants grown in India. In the 1850s indigo farmers in Bengal were forced by British planters to grow it at a loss, leading to the Indigo Revolt of 1859. Adolf von Baeyer in Germany worked out indigo's structure and first synthesised it in 1880. From 1897 the company BASF produced it cheaply from coal tar chemicals. Within about 20 years the Indian indigo industry collapsed. Baeyer won the 1905 Nobel Prize.","q":"What are the benefits and costs of replacing a natural product with a synthetic one?"},{"id":"chem4-027","t":"Tyrian purple from 10,000 snails","s":"Chemistry","tp":"Organic chemistry","sub":"Dyes","lv":["KS3","GCSE"],"who":"Paul Friedländer","f":0,"loc":"Lebanon","rg":["Middle East"],"yr":1909,"era":"1900–1949","tag":"Everyday","x":"The ancient Phoenicians of Tyre, in modern Lebanon, made a purple dye from the glands of sea snails. It was so costly that it became a symbol of royalty; Roman law reserved certain purple garments for emperors. In 1909 the German chemist Paul Friedländer extracted the dye from about 12,000 snails to get just 1.4 g, and identified it as dibromoindigo – indigo with two bromine atoms. Piles of crushed shells still lie near ancient dye works.","q":"Why would a dye that takes thousands of snails become a status symbol?"},{"id":"chem4-028","t":"Cochineal: red from insects","s":"Chemistry","tp":"Organic chemistry","sub":"Dyes","lv":["KS3","GCSE"],"who":"","f":0,"loc":"Mexico / Peru","rg":["South America","North & Central America"],"yr":1550,"era":"1500–1699","tag":"Everyday","x":"For centuries, peoples of Mexico and Peru farmed tiny scale insects on prickly pear cacti and crushed them to produce a brilliant red dye, carminic acid. About 70,000 insects make a pound of dye. After the Spanish conquest, cochineal became one of the most valuable exports from the Americas, and the secret of where it came from was guarded. It coloured British soldiers' red coats. It is still used today as a food colouring, E120.","q":"How could you test whether a food contains a dye?"},{"id":"chem4-029","t":"The prize for synthetic ultramarine","s":"Chemistry","tp":"Chemical reactions","sub":"Pigments","lv":["KS3","GCSE"],"who":"Jean-Baptiste Guimet, Christian Gmelin","f":0,"loc":"France / Afghanistan","rg":["South Asia","Europe"],"yr":1826,"era":"1800s","tag":"Rivalry","x":"Ultramarine, made by grinding the gemstone lapis lazuli mined in the mountains of Afghanistan, was once more expensive than gold; painters saved it for the robes of the Virgin Mary. In 1824 a French society offered a 6,000-franc prize for a synthetic version. Jean-Baptiste Guimet claimed it in 1828, though the German chemist Christian Gmelin said he had made it first. Synthetic ultramarine, made by heating clay, soda, sulphur and charcoal, is now cheap.","q":"Why would artists value a cheap synthetic pigment?"},{"id":"chem4-030","t":"Louis-Camille Maillard browns the toast","s":"Chemistry","tp":"Chemical reactions","sub":"Food chemistry","lv":["KS3","GCSE"],"who":"Louis-Camille Maillard","f":0,"loc":"France","rg":["Europe"],"yr":1912,"era":"1900–1949","tag":"Everyday","x":"In 1912 the French physician and chemist Louis-Camille Maillard heated amino acids with sugars and found they turned brown and produced new aromas. This Maillard reaction, between amino acids and sugars at high temperatures, is what browns toast, roast meat, roasted coffee and chocolate, making hundreds of flavour molecules. It is different from caramelisation, which involves sugar alone. Chefs control it carefully, and it can also form acrylamide in over-browned foods.","q":"Why does food not brown when boiled in water?"},{"id":"chem4-031","t":"Kikunae Ikeda and the fifth taste","s":"Chemistry","tp":"Organic chemistry","sub":"Food chemistry","lv":["KS3","GCSE"],"who":"Kikunae Ikeda","f":0,"loc":"Japan","rg":["East Asia"],"yr":1908,"era":"1900–1949","tag":"Discovery","x":"In 1908 the Tokyo chemist Kikunae Ikeda wondered what gave his wife's kombu seaweed broth its delicious savoury taste, distinct from sweet, sour, salty and bitter. He evaporated large amounts of broth and isolated crystals of glutamic acid. He named the taste 'umami', meaning 'delicious taste', and patented a seasoning, monosodium glutamate (MSG). Western scientists doubted umami for decades until taste receptors for glutamate were found around 2000.","q":"How might you design a fair taste test?"},{"id":"chem4-032","t":"Runge isolates caffeine for Goethe","s":"Chemistry","tp":"Organic chemistry","sub":"Natural products","lv":["KS3","GCSE"],"who":"Friedlieb Ferdinand Runge, Johann Wolfgang von Goethe","f":0,"loc":"Germany","rg":["Europe"],"yr":1819,"era":"1800s","tag":"Eccentric","x":"In 1819 the young chemist Friedlieb Runge demonstrated to the poet Goethe how the extract of deadly nightshade dilated a cat's pupils. Impressed, Goethe handed him a box of rare coffee beans and suggested he analyse them. Runge isolated caffeine. He later invented an early form of paper chromatography, letting drops spread on blotting paper to make colourful patterns, and discovered several chemicals in coal tar.","q":"Why does caffeine make you feel more alert?"},{"id":"chem4-033","t":"Sertürner and morphine","s":"Chemistry","tp":"Organic chemistry","sub":"Natural products","lv":["GCSE"],"who":"Friedrich Sertürner","f":0,"loc":"Germany","rg":["Europe"],"yr":1804,"era":"1800s","tag":"Discovery","x":"In 1804, a 21-year-old pharmacist's apprentice in Paderborn, Friedrich Sertürner, isolated the main active substance from opium – the first alkaloid ever purified from a plant. He named it morphium after Morpheus, the Greek god of dreams. He tested it on dogs, then on himself and three friends, who became dangerously ill. Purified medicines allowed accurate dosing, but morphine is highly addictive and has been widely misused.","q":"Why is a purified drug easier to dose accurately than a plant extract?"},{"id":"chem4-034","t":"Quinine: from Peruvian bark to the first anti-malarial","s":"Chemistry","tp":"Organic chemistry","sub":"Medicines","lv":["GCSE"],"who":"Pierre Joseph Pelletier, Joseph Bienaimé Caventou","f":0,"loc":"Peru / France","rg":["South America","Europe"],"yr":1820,"era":"1800s","tag":"Discovery","x":"Quechua people in the Andes used the bark of the cinchona tree, and by the 1630s Jesuit missionaries were sending it to Europe as a cure for fevers. In 1820 Pierre Joseph Pelletier and Joseph Caventou in Paris isolated its active ingredient, quinine. They did not patent it, wishing it to be used freely. Quinine allowed Europeans to survive in malarial regions, aiding colonial expansion. British officers in India mixed it with gin and sugar, giving the gin and tonic.","q":"Why does tonic water glow under ultraviolet light?"},{"id":"chem4-035","t":"Albert Szent-Györgyi's 'Godnose' and Hungarian paprika","s":"Chemistry","tp":"Health and medicine","sub":"Vitamins","lv":["GCSE"],"who":"Albert Szent-Györgyi","f":0,"loc":"Hungary / UK","rg":["Europe"],"yr":1932,"era":"1900–1949","tag":"Eccentric","x":"In the 1920s, working at Cambridge, the Hungarian Albert Szent-Györgyi isolated a sugar-like acid from adrenal glands. Not knowing what it was, he wanted to call it 'ignose' and then 'godnose', but the journal editor objected. Back in Szeged in 1932, he showed it was vitamin C. Needing much more, he found a rich source at dinner when his wife served Hungarian paprika peppers – and extracted kilograms of it. He won the 1937 Nobel Prize and later helped the Hungarian resistance.","q":"Why do humans need vitamin C in their diet?"},{"id":"chem4-036","t":"Hevesy's radioactive pie","s":"Chemistry","tp":"Atomic structure","sub":"Tracers","lv":["GCSE","A-Level"],"who":"George de Hevesy","f":0,"loc":"UK / Hungary","rg":["Europe"],"yr":1911,"era":"1900–1949","tag":"Eccentric","x":"In 1911, the young Hungarian chemist George de Hevesy was lodging in a Manchester boarding house and suspected his landlady was reusing leftovers from previous meals. One evening he secretly sprinkled a tiny amount of a radioactive substance on the meat left on his plate. A few days later he tested a meat pie with an electroscope – it was radioactive. The landlady was not amused. Hevesy went on to develop radioactive tracers in science and medicine, and won the 1943 Nobel Prize.","q":"How are radioactive tracers used in medicine today?"},{"id":"chem4-037","t":"Neil Bartlett makes a noble gas react","s":"Chemistry","tp":"Periodic table","sub":"Noble gases","lv":["GCSE","A-Level"],"who":"Neil Bartlett","f":0,"loc":"UK / Canada","rg":["North & Central America","Europe"],"yr":1962,"era":"1950–1999","tag":"Discovery","x":"Textbooks said noble gases could not form compounds because their electron shells were full. In 1962 Neil Bartlett, a British chemist at the University of British Columbia, noticed that the powerful oxidising agent platinum hexafluoride could remove an electron from oxygen. Xenon's outer electron is almost as easy to remove, so he mixed the two gases. An orange-yellow solid formed immediately – the first noble gas compound. Many xenon compounds are now known.","q":"Why are noble gases so unreactive?"},{"id":"chem4-038","t":"The well that wouldn't burn","s":"Chemistry","tp":"Periodic table","sub":"Noble gases","lv":["KS3","GCSE"],"who":"Hamilton Cady, David McFarland","f":0,"loc":"USA","rg":["North & Central America"],"yr":1905,"era":"1900–1949","tag":"Discovery","x":"In 1903 a gas well at Dexter, Kansas, released a 'howling' gas. The town held a celebration and lit it, expecting a great flame, but the gas put out the burning bale of hay. In 1905 Hamilton Cady and David McFarland at the University of Kansas analysed it: it contained about 2% helium, which had been thought extremely rare on Earth. Natural gas fields became the world's source of helium, which forms from radioactive decay in rocks.","q":"Why did the gas put out the flame?"},{"id":"chem4-039","t":"Balard finds bromine; Liebig's cupboard of mistakes","s":"Chemistry","tp":"Periodic table","sub":"Halogens","lv":["GCSE"],"who":"Antoine Balard, Justus von Liebig","f":0,"loc":"France / Germany","rg":["Europe"],"yr":1826,"era":"1800s","tag":"Blunder","x":"In 1826 Antoine Balard, a 23-year-old pharmacy assistant in Montpellier, treated seaweed ash and salt-marsh brine with chlorine and obtained a dark red, foul-smelling liquid. It was a new element, bromine, from the Greek for 'stench'. Justus von Liebig, later one of the greatest chemists in Germany, had made the same liquid years earlier but labelled it 'liquid iodine chloride' and did not investigate. Afterwards he kept a 'cupboard of mistakes' to remind himself not to jump to conclusions.","q":"Why is bromine a liquid when chlorine is a gas?"},{"id":"chem4-040","t":"Yuri Oganessian: a living element","s":"Chemistry","tp":"Periodic table","sub":"Superheavy elements","lv":["GCSE","A-Level"],"who":"Yuri Oganessian","f":0,"loc":"Russia / USA","rg":["North & Central America","Europe"],"yr":2016,"era":"2000 onwards","tag":"Modern research","x":"Element 118 was made in 2002–2005 at Dubna in Russia by firing calcium-48 nuclei at californium in a collaboration with American scientists. Only five or six atoms have ever been detected, each lasting less than a millisecond. In 2016 it was named oganesson after Yuri Oganessian, the Armenian-Russian physicist who led the work for decades. He became only the second person, after Glenn Seaborg, to have an element named after them while alive. Its chemistry is predicted to be very strange.","q":"Why are superheavy elements so unstable?"},{"id":"chem4-041","t":"Nihonium: the first element found in Asia","s":"Chemistry","tp":"Periodic table","sub":"Superheavy elements","lv":["GCSE","A-Level"],"who":"Kosuke Morita","f":0,"loc":"Japan","rg":["East Asia"],"yr":2004,"era":"2000 onwards","tag":"Modern research","x":"From 2003 at the RIKEN laboratory near Tokyo, Kosuke Morita's team fired zinc nuclei at bismuth for months on end. They detected one atom of element 113 in 2004, another in 2005, and a third only in August 2012, after nine years of work. In 2016 it was named nihonium, from Nihon, one of the Japanese names for Japan – the first element discovered in an Asian country. It lasts around a few milliseconds.","q":"Why did it take so long to make just three atoms?"},{"id":"chem4-042","t":"Ludwig Mond's nickel works at Clydach","s":"Chemistry","tp":"Reactivity","sub":"Extracting metals","lv":["GCSE","A-Level"],"who":"Ludwig Mond, Carl Langer","f":0,"loc":"Wales","rg":["Europe"],"yr":1902,"era":"1900–1949","tag":"Discovery","x":"In 1890 in London, Ludwig Mond and Carl Langer found that carbon monoxide passed over nickel at about 50 °C formed a volatile gas, nickel carbonyl. At higher temperatures it decomposed back into very pure nickel. Lord Kelvin joked that Mond had given wings to a heavy metal. In 1902 the Mond Nickel Company opened a refinery at Clydach in the Swansea Valley, using the Mond process; nickel is still refined there today, more than a century later.","q":"Why does heating the gas release pure nickel?"},{"id":"chem4-043","t":"The Blaenavon cousins who changed steel","s":"Chemistry","tp":"Materials","sub":"Steel","lv":["GCSE"],"who":"Sidney Gilchrist Thomas, Percy Gilchrist, Henry Bessemer","f":0,"loc":"Wales","rg":["Europe"],"yr":1878,"era":"1800s","tag":"Discovery","x":"Henry Bessemer's converter, from 1856, blew air through molten iron to burn out carbon and make cheap steel, but it could not remove phosphorus, which made steel brittle. Most iron ores in Britain and Europe contained phosphorus. Sidney Gilchrist Thomas, a London court clerk who studied chemistry at night, worked it out with his cousin Percy Gilchrist, a chemist at the Blaenavon ironworks in south Wales. In 1878 they lined the converter with limestone-based material, which reacted with the acidic phosphorus oxides. The leftover slag was sold as fertiliser.","q":"Why does a basic lining remove an acidic impurity?"},{"id":"chem4-044","t":"Abraham Darby smelts iron with coke","s":"Chemistry","tp":"Reactivity","sub":"Extracting metals","lv":["GCSE"],"who":"Abraham Darby","f":0,"loc":"UK","rg":["Europe"],"yr":1709,"era":"1700s","tag":"Invention","x":"Iron ore was smelted with charcoal, and Britain's forests were being stripped bare. Coal contained sulphur that made iron brittle. In 1709 at Coalbrookdale in Shropshire, Abraham Darby, a Quaker, successfully used coke – coal baked to drive off impurities – to smelt iron. Cheap iron helped launch the Industrial Revolution. His grandson, Abraham Darby III, built the world's first cast iron bridge across the River Severn in 1779.","q":"What does carbon do in a blast furnace?"},{"id":"chem4-045","t":"Ida Freund's periodic table cakes","s":"Chemistry","tp":"Periodic table","sub":"Teaching chemistry","lv":["KS3","GCSE"],"who":"Ida Freund","f":1,"loc":"UK / Austria","rg":["Europe"],"yr":1904,"era":"1900–1949","tag":"Hidden figure","x":"Ida Freund, born in Austria, lost a leg in a childhood cycling accident and moved to England. In 1890 she became the first woman to be a university chemistry lecturer in the UK, at Girton College, Cambridge. She was known for inventive teaching: she reportedly baked cakes decorated with the periodic table, with sweets for the elements, and rewarded students who could identify them. She campaigned for women to be admitted to the Chemical Society, which finally happened in 1920.","q":"How would you design a periodic table that someone could eat?"},{"id":"chem4-046","t":"Marie Maynard Daly and cholesterol","s":"Chemistry","tp":"Health and medicine","sub":"Biochemistry","lv":["GCSE","A-Level"],"who":"Marie Maynard Daly","f":1,"loc":"USA","rg":["North & Central America"],"yr":1958,"era":"1950–1999","tag":"Hidden figure","x":"In 1947 Marie Maynard Daly became the first African American woman to earn a PhD in chemistry in the USA, at Columbia University. In the 1950s she showed a link between high cholesterol and blocked arteries, helping explain how heart attacks happen. She also studied the effects of sugar and cigarette smoking on arteries. She set up a scholarship fund for Black students studying science at Queens College in New York, in memory of her father, who had to leave his chemistry studies for lack of money.","q":"How can diet affect the health of the heart?"},{"id":"chem4-047","t":"Tebello Nyokong's light-activated cancer drugs","s":"Chemistry","tp":"Health and medicine","sub":"Photochemistry","lv":["GCSE","A-Level"],"who":"Tebello Nyokong","f":1,"loc":"Lesotho / South Africa","rg":["Africa"],"yr":2009,"era":"2000 onwards","tag":"Modern research","x":"Tebello Nyokong grew up in Lesotho herding sheep before going to university. At Rhodes University in South Africa she developed dye molecules called phthalocyanines that collect in cancer cells; when a laser shines on them, they release reactive oxygen that kills the cancer cells while sparing healthy tissue – photodynamic therapy. The same dyes can help clean polluted water. In 2009 she received the L'Oréal–UNESCO award for women in science, and she trains many African chemists.","q":"Why would a drug that only works when lit be safer?"},{"id":"chem4-048","t":"Alexei Ekimov's coloured glass and quantum dots","s":"Chemistry","tp":"Bonding","sub":"Nanoparticles","lv":["GCSE","A-Level"],"who":"Alexei Ekimov, Louis Brus, Moungi Bawendi","f":0,"loc":"Russia / USA / Tunisia","rg":["Africa","North & Central America","Europe"],"yr":1981,"era":"1950–1999","tag":"Discovery","x":"Medieval glassmakers coloured stained glass with metal particles without knowing why. In 1981 Alexei Ekimov in Leningrad found that tiny crystals of copper chloride in glass changed colour depending on their size. In 1983 Louis Brus at Bell Labs found the same effect in particles in liquid. These 'quantum dots' are so small that their size controls the energy of their electrons and the colour of light they emit. In 1993 Moungi Bawendi, born in Paris to a Tunisian father, made them precisely. The three shared the 2023 Nobel Prize; quantum dots are now used in TV screens.","q":"Why might smaller particles have different properties?"},{"id":"chem4-049","t":"AlphaFold and protein design","s":"Chemistry","tp":"Health and medicine","sub":"Structure","lv":["GCSE","A-Level"],"who":"Demis Hassabis, John Jumper, David Baker","f":0,"loc":"UK / USA","rg":["North & Central America","Europe"],"yr":2020,"era":"2000 onwards","tag":"Modern research","x":"A protein's job depends on how its chain of amino acids folds up, but working out a shape experimentally can take years. In 2020, at DeepMind in London, a team led by Demis Hassabis and John Jumper showed their AI program AlphaFold could predict most protein structures from the amino acid sequence alone. It has predicted structures for over 200 million proteins. David Baker in Seattle designed entirely new proteins not found in nature. The three shared the 2024 Nobel Prize in Chemistry.","q":"Why does a protein's shape matter for what it does?"},{"id":"chem4-050","t":"Francis Bacon's fuel cell goes to the Moon","s":"Chemistry","tp":"Electrochemistry","sub":"Fuel cells","lv":["GCSE","A-Level"],"who":"Francis Thomas Bacon","f":0,"loc":"UK / USA","rg":["North & Central America","Europe"],"yr":1959,"era":"1950–1999","tag":"Invention","x":"William Grove invented the fuel cell in 1839, but it produced little power. The Cambridge engineer Francis Thomas Bacon, a descendant of the philosopher Francis Bacon, spent from the 1930s to 1959 developing a practical alkaline hydrogen–oxygen fuel cell. NASA licensed the design for the Apollo spacecraft, where fuel cells produced electricity, and the water they made was used for drinking. President Nixon reportedly told him the Moon landing could not have happened without him.","q":"What is the only product of a hydrogen fuel cell?"},{"id":"chem4-051","t":"Böttger: the alchemist who made porcelain","s":"Chemistry","tp":"Materials","sub":"Ceramics","lv":["KS3","GCSE"],"who":"Johann Friedrich Böttger, Ehrenfried Walther von Tschirnhaus","f":0,"loc":"Germany / China","rg":["East Asia","Europe"],"yr":1708,"era":"1700s","tag":"Eccentric","x":"Chinese porcelain was so prized in Europe that it was called 'white gold', and nobody knew how to make it. The young alchemist Johann Böttger boasted that he could make gold, so Augustus the Strong, ruler of Saxony, imprisoned him and ordered him to do it. He failed, but with Ehrenfried von Tschirnhaus he experimented with clays and in 1708 made true hard-paste porcelain, using kaolin. The Meissen porcelain factory opened in 1710, and Böttger was kept almost a prisoner to protect the secret.","q":"Why does firing clay at high temperatures make it hard?"},{"id":"chem4-052","t":"Greek fire: the lost recipe","s":"Chemistry","tp":"Chemical reactions","sub":"Combustion","lv":["KS3","GCSE"],"who":"Kallinikos","f":0,"loc":"Turkey (Constantinople)","rg":["Middle East"],"yr":672,"era":"Medieval","tag":"Wartime","x":"Around 672 CE, an architect called Kallinikos, a refugee from Syria, gave the Byzantine Empire a weapon called Greek fire. Pumped through bronze tubes from ships, it burned fiercely even on water and was said to be hard to put out with water. It helped Constantinople survive sieges by Arab fleets. The recipe was a state secret known only to a few families, and it was eventually lost. Chemists think it may have contained crude oil, resin and quicklime, but nobody knows for sure.","q":"Why might water make some fires worse?"},{"id":"chem4-053","t":"Waldo Semon makes PVC useful","s":"Chemistry","tp":"Polymers","sub":"Plasticisers","lv":["KS3","GCSE"],"who":"Waldo Semon","f":0,"loc":"USA","rg":["North & Central America"],"yr":1926,"era":"1900–1949","tag":"Accident","x":"PVC had been made in the 1800s but was a hard, brittle solid nobody could use. In 1926 Waldo Semon at the BF Goodrich company was trying to make an adhesive to bond rubber to metal. He heated PVC with a high-boiling liquid and got a flexible, jelly-like material. He made it into shoe heels and golf balls, then shower curtains and raincoats. Adding plasticisers to separate polymer chains made PVC one of the world's most used plastics. He also made synthetic rubber during the Second World War.","q":"Why does a plasticiser make a polymer more flexible?"},{"id":"chem4-054","t":"Wilhelm Ostwald, catalysts and nitric acid","s":"Chemistry","tp":"Rates and equilibrium","sub":"Catalysts","lv":["GCSE","A-Level"],"who":"Wilhelm Ostwald","f":0,"loc":"Latvia / Germany","rg":["Europe"],"yr":1902,"era":"1900–1949","tag":"Wartime","x":"Wilhelm Ostwald, born in Riga, defined a catalyst as a substance that speeds up a reaction without being used up. In 1902 he patented a process for oxidising ammonia to nitric acid over a platinum gauze catalyst. When Britain blockaded Germany's supply of Chilean nitrates in the First World War, the Haber process combined with the Ostwald process let Germany keep making explosives and fertilisers. Ostwald won the 1909 Nobel Prize, and also had strong views on colour and promoted an international language.","q":"Why is a catalyst not used up in a reaction?"},{"id":"chem4-055","t":"Ellen Gleditsch measures radium's half-life","s":"Chemistry","tp":"Atomic structure","sub":"Half-life","lv":["GCSE","A-Level"],"who":"Ellen Gleditsch, Marie Curie","f":1,"loc":"Norway / France","rg":["Europe"],"yr":1915,"era":"1900–1949","tag":"Hidden figure","x":"Ellen Gleditsch was one of Norway's first women chemists. She worked with Marie Curie in Paris from 1907 to 1912, purifying radium salts. In 1913 she went to Yale, where in 1915 she made the best measurement yet of radium's half-life, about 1,690 years (the modern value is about 1,600). She became Norway's second woman professor and during the Nazi occupation hid resistance fighters and kept her laboratory running. The Gleditsch name lives on in scholarships for women scientists.","q":"What does half-life mean?"},{"id":"chem4-056","t":"Jingdezhen's porcelain secrets","s":"Chemistry","tp":"Materials","sub":"Ceramics","lv":["KS3","GCSE"],"who":"François Xavier d'Entrecolles","f":0,"loc":"China","rg":["East Asia"],"yr":1712,"era":"1700s","tag":"Everyday","x":"For centuries, the city of Jingdezhen in China produced the world's finest porcelain, using two local materials: kaolin, a fine white clay, and 'petuntse', a feldspar-rich stone. Fired at about 1,300 °C, the feldspar melts and fuses the clay into a glassy, translucent body. In 1712 and 1722, the French Jesuit missionary François Xavier d'Entrecolles sent letters to Europe describing the methods in detail – an early case of industrial espionage. Jingdezhen still makes porcelain today.","q":"What changes happen in clay when it is fired?"},{"id":"bio4-001","t":"Robert Brown names the nucleus","s":"Biology","tp":"Cells","sub":"The nucleus","lv":["KS3","GCSE"],"who":"Robert Brown","f":0,"loc":"UK","rg":["Europe"],"yr":1831,"era":"1800s","tag":"Discovery","x":"The Scottish botanist Robert Brown spent years studying orchids under his microscope. In 1831 he noticed that each cell in the outer layer of an orchid leaf contained a single round spot, and he named it the nucleus, from the Latin for 'kernel'. Others had seen such spots, but Brown recognised them as a regular feature of cells. Earlier, in 1827, he had seen tiny particles from pollen grains jiggling in water – Brownian motion, later explained by Einstein as molecules bumping into them.","q":"What does the nucleus contain?"},{"id":"bio4-002","t":"Christian de Duve's forgotten fridge","s":"Biology","tp":"Cells","sub":"Lysosomes","lv":["A-Level"],"who":"Christian de Duve","f":0,"loc":"Belgium","rg":["Europe"],"yr":1955,"era":"1950–1999","tag":"Accident","x":"In 1949 in Louvain, Belgium, Christian de Duve was studying an enzyme in liver cells broken up and spun in a centrifuge. When his team stored some samples in the fridge for five days and measured them again, the enzyme activity had increased. He realised the enzyme must have been trapped inside membrane bags that slowly leaked. In 1955 he named them lysosomes – the cell's recycling centres, full of digestive enzymes. He shared the 1974 Nobel Prize.","q":"Why must digestive enzymes in a cell be kept inside membranes?"},{"id":"bio4-003","t":"Walther Flemming watches chromosomes divide","s":"Biology","tp":"Cells","sub":"Mitosis","lv":["GCSE","A-Level"],"who":"Walther Flemming","f":0,"loc":"Germany","rg":["Europe"],"yr":1882,"era":"1800s","tag":"Discovery","x":"New synthetic dyes from the chemical industry let biologists stain parts of cells. Walther Flemming, in Kiel, used them on salamander cells, which have large nuclei. He found thread-like material that took up the dye strongly and called it chromatin, from the Greek for 'colour'. In 1882 he published detailed drawings of the threads splitting and moving apart as cells divide, and named the process mitosis, from the Greek for 'thread'. He did not know the threads carried genes.","q":"Why must chromosomes be copied before a cell divides?"},{"id":"bio4-004","t":"Leonard Hayflick's limit","s":"Biology","tp":"Cells","sub":"Ageing","lv":["GCSE","A-Level"],"who":"Leonard Hayflick, Paul Moorhead","f":0,"loc":"USA","rg":["North & Central America"],"yr":1961,"era":"1950–1999","tag":"Discovery","x":"Scientists believed that normal cells, grown in a lab, could divide forever. In 1961 Leonard Hayflick and Paul Moorhead showed that normal human cells divide only about 40–60 times and then stop. This 'Hayflick limit' is partly caused by the shortening of telomeres – protective caps on the ends of chromosomes. Cancer cells, such as HeLa cells, escape the limit. Hayflick's cell lines were also used to make many vaccines.","q":"How might the Hayflick limit relate to ageing?"},{"id":"bio4-005","t":"Till and McCulloch find stem cells","s":"Biology","tp":"Cells","sub":"Stem cells","lv":["GCSE","A-Level"],"who":"James Till, Ernest McCulloch","f":0,"loc":"Canada","rg":["North & Central America"],"yr":1961,"era":"1950–1999","tag":"Discovery","x":"In 1961 in Toronto, the physicist James Till and the doctor Ernest McCulloch injected bone marrow cells into mice whose own blood cells had been destroyed by radiation. Lumps appeared on the mice's spleens, and each lump came from a single cell that had produced many different types of blood cell. They had found the first proof of stem cells – cells that can divide to renew themselves and turn into other types. Bone marrow transplants for leukaemia use the same idea.","q":"What is the difference between a stem cell and a specialised cell?"},{"id":"bio4-006","t":"Martin Evans and the Cardiff stem cells","s":"Biology","tp":"Genetics","sub":"Stem cells","lv":["GCSE","A-Level"],"who":"Martin Evans, Matthew Kaufman, Mario Capecchi, Oliver Smithies","f":0,"loc":"UK / Wales","rg":["Europe"],"yr":1981,"era":"1950–1999","tag":"Discovery","x":"In 1981 Martin Evans and Matthew Kaufman in Cambridge became the first to grow embryonic stem cells from mice in the lab. Evans later moved to Cardiff University, where he continued the work. Using these cells, scientists could change a specific gene and breed 'knockout mice' to find out what that gene does. Evans shared the 2007 Nobel Prize with Mario Capecchi and Oliver Smithies. Thousands of knockout mouse strains are now used to study human diseases.","q":"Why are mice useful for studying human genes?"},{"id":"bio4-007","t":"Ernest Everett Just and the egg cell's surface","s":"Biology","tp":"Genetics","sub":"Fertilisation","lv":["GCSE","A-Level"],"who":"Ernest Everett Just","f":0,"loc":"USA / Germany / France","rg":["North & Central America","Europe"],"yr":1919,"era":"1900–1949","tag":"Hidden figure","x":"Ernest Everett Just, a Black American biologist, studied how sea urchin and marine worm eggs are fertilised at the Woods Hole laboratory every summer from 1909. He showed that the egg's outer membrane changes within seconds of the first sperm entering, blocking any others – the 'fast block'. He argued that the cell surface was active, not just a wall. Facing racism that kept him out of top US universities, he moved to Europe in the 1930s.","q":"Why must an egg stop more than one sperm entering?"},{"id":"bio4-008","t":"Charles Drew's blood bank","s":"Biology","tp":"Body systems","sub":"Blood","lv":["KS3","GCSE"],"who":"Charles Drew","f":0,"loc":"USA / UK","rg":["North & Central America","Europe"],"yr":1940,"era":"1900–1949","tag":"Hidden figure","x":"Charles Drew, an African American surgeon, showed that plasma – blood with the cells removed – could be stored much longer than whole blood. In 1940 he led the 'Blood for Britain' project, shipping plasma to treat Londoners wounded in the Blitz, then set up the American Red Cross blood bank, with mobile collection vans. He resigned when the military insisted on keeping blood from Black and white donors separate, a policy he said had no scientific basis.","q":"What are the main components of blood?"},{"id":"bio4-009","t":"James Blundell's first human blood transfusion","s":"Biology","tp":"Body systems","sub":"Blood","lv":["KS3","GCSE"],"who":"James Blundell, Jean-Baptiste Denis, Richard Lower","f":0,"loc":"UK / France","rg":["Europe"],"yr":1818,"era":"1800s","tag":"Discovery","x":"In the 1660s, Richard Lower in Oxford transfused blood between dogs, and Jean-Baptiste Denis in Paris transfused lamb's blood into people; after a patient died, transfusions were banned in France. In 1818 the London obstetrician James Blundell, horrified by mothers bleeding to death after childbirth, carried out the first recorded transfusion of human blood using a syringe. That patient died, but in 1829 he saved a woman bleeding after giving birth. Many transfusions still failed until Karl Landsteiner discovered blood groups in 1901.","q":"Why did some early blood transfusions kill the patient?"},{"id":"bio4-010","t":"Daniel Hale Williams operates on the heart","s":"Biology","tp":"Body systems","sub":"The heart","lv":["KS3","GCSE"],"who":"Daniel Hale Williams","f":0,"loc":"USA","rg":["North & Central America"],"yr":1893,"era":"1800s","tag":"Hidden figure","x":"Daniel Hale Williams founded Provident Hospital in Chicago in 1891, the first in the USA with a racially mixed staff and a training school for Black nurses. On 9 July 1893, a man named James Cornish arrived with a knife wound in the chest. Without X-rays, antibiotics or blood transfusion, Williams opened his chest and stitched the torn sac around the heart. Cornish recovered and went on to live for many more years. It was one of the first successful heart surgeries recorded.","q":"What does the pericardium protect?"},{"id":"bio4-011","t":"Elizabeth Blackwell, admitted as a joke","s":"Biology","tp":"Medicine","sub":"Doctors","lv":["KS3","GCSE"],"who":"Elizabeth Blackwell","f":1,"loc":"UK / USA","rg":["North & Central America","Europe"],"yr":1849,"era":"1800s","tag":"Hidden figure","x":"Elizabeth Blackwell, born in Bristol, was rejected by many medical schools in the USA. In 1847 Geneva Medical College in New York let the male students vote on admitting her, and they voted yes as a joke. She took it seriously and graduated top of her class in 1849, becoming the first woman to earn a medical degree in the USA. She opened a hospital for poor women and children in New York, and later helped found a medical school for women in London.","q":"Why does it matter who is allowed to train as a doctor?"},{"id":"bio4-012","t":"Mary Seacole's British Hotel","s":"Biology","tp":"Medicine","sub":"Nursing","lv":["KS3","GCSE"],"who":"Mary Seacole","f":1,"loc":"Jamaica / Ukraine (Crimea)","rg":["North & Central America","Europe"],"yr":1855,"era":"1800s","tag":"Hidden figure","x":"Mary Seacole learned herbal medicine from her mother in Kingston, Jamaica, and treated cholera and yellow fever in the Caribbean and Panama. When the Crimean War began, she applied to join Florence Nightingale's nurses but was turned down. She travelled to Crimea at her own expense and in 1855 set up the 'British Hotel' near Balaclava, providing food, supplies and care, and tending wounded soldiers on the battlefield. Her autobiography was a bestseller in 1857.","q":"How did knowledge of hygiene and diet help wounded soldiers survive?"},{"id":"bio4-013","t":"Ambroise Paré runs out of boiling oil","s":"Biology","tp":"Medicine","sub":"Surgery","lv":["KS3","GCSE"],"who":"Ambroise Paré","f":0,"loc":"France / Italy","rg":["Europe"],"yr":1537,"era":"1500–1699","tag":"Accident","x":"In 1537, serving as a young army surgeon at the siege of Turin, Ambroise Paré was taught to pour boiling oil into gunshot wounds, which were thought to be poisoned. One night he ran out of oil and instead used a soothing mixture of egg yolk, rose oil and turpentine. He slept badly, expecting his patients to die. In the morning, those treated with the ointment were in far less pain and healing better. He also revived tying off arteries instead of burning them.","q":"How did Paré's accident become an experiment?"},{"id":"bio4-014","t":"Al-Zahrawi's 200 surgical instruments","s":"Biology","tp":"Medicine","sub":"Surgery","lv":["KS3","GCSE"],"who":"Al-Zahrawi (Abulcasis)","f":0,"loc":"Spain (al-Andalus)","rg":["Europe"],"yr":1000,"era":"Medieval","tag":"Invention","x":"Around 1000 CE, the surgeon al-Zahrawi, working near Córdoba in Islamic Spain, completed a 30-volume medical encyclopedia, the Kitab al-Tasrif. Its final volume on surgery described and illustrated over 200 instruments, including scalpels, forceps, hooks and specula, many he designed himself. He described using catgut for internal stitches, which dissolves in the body. Translated into Latin, it was used in European medical schools for centuries.","q":"Why would stitches that dissolve be useful inside the body?"},{"id":"bio4-015","t":"Sushruta's nose reconstruction","s":"Biology","tp":"Medicine","sub":"Surgery","lv":["KS3","GCSE"],"who":"Sushruta","f":0,"loc":"India","rg":["South Asia"],"yr":-600,"era":"Ancient","tag":"Discovery","x":"The ancient Indian text Sushruta Samhita, associated with the physician Sushruta of Varanasi and compiled over many centuries, describes over 300 surgical procedures and 120 instruments. It explains how to rebuild a nose cut off as a punishment, using a flap of skin from the cheek or forehead – a technique still known as the 'Indian method'. It tells students to practise incisions on vegetables and leather bags of water before operating on people.","q":"Why would practising on vegetables be useful for surgical students?"},{"id":"bio4-016","t":"Vesalius corrects Galen","s":"Biology","tp":"Body systems","sub":"Anatomy","lv":["KS3","GCSE"],"who":"Andreas Vesalius, Galen","f":0,"loc":"Belgium / Italy","rg":["Europe"],"yr":1543,"era":"1500–1699","tag":"Discovery","x":"For 1,300 years, anatomy was taught from the writings of Galen, a Greek doctor in Rome who had mostly dissected apes and pigs. Professors read Galen aloud while assistants cut up bodies. Andreas Vesalius, a young Flemish professor in Padua, did his own dissections and found over 200 errors – for example, the human jawbone is one bone, not two. In 1543 he published De humani corporis fabrica, with stunning illustrations. Many colleagues attacked him for contradicting Galen.","q":"Why is it important to check claims for yourself rather than rely on authority?"},{"id":"bio4-017","t":"Galen, surgeon to the gladiators","s":"Biology","tp":"Body systems","sub":"Anatomy","lv":["KS3"],"who":"Galen","f":0,"loc":"Turkey / Italy","rg":["Middle East","Europe"],"yr":157,"era":"Ancient","tag":"Discovery","x":"In 157 CE, the young Greek physician Galen became doctor to the gladiators at Pergamon, in modern Turkey. Treating terrible wounds gave him a 'window into the body'. He claimed only five gladiators died under his care, compared with sixty under his predecessor. In Rome he showed that arteries carry blood, not air, and that cutting certain nerves silenced a squealing pig, proving the brain, not the heart, controls the voice. He also made errors that lasted 1,300 years.","q":"How did Galen show the brain controls the voice?"},{"id":"bio4-018","t":"Malpighi finds the capillaries","s":"Biology","tp":"Body systems","sub":"Circulation","lv":["KS3","GCSE"],"who":"Marcello Malpighi, William Harvey","f":0,"loc":"Italy","rg":["Europe"],"yr":1661,"era":"1500–1699","tag":"Discovery","x":"William Harvey showed in 1628 that blood circulates, leaving the heart in arteries and returning in veins, but he could not see how blood passed from one to the other. In 1661, Marcello Malpighi in Bologna examined the lungs of a frog through a microscope and saw tiny vessels, thinner than hairs, connecting arteries to veins: the capillaries. Harvey had died four years earlier. Malpighi also studied silkworms, chick embryos and kidneys.","q":"Why are capillary walls only one cell thick?"},{"id":"bio4-019","t":"Santorio weighs himself for 30 years","s":"Biology","tp":"Body systems","sub":"Metabolism","lv":["KS3","GCSE"],"who":"Santorio Santorio","f":0,"loc":"Italy","rg":["Europe"],"yr":1614,"era":"1500–1699","tag":"Eccentric","x":"Santorio Santorio, a physician in Padua, built a chair hanging from a giant balance so he could weigh himself, his food and his waste. For about 30 years he recorded everything. He found that the weight of what he ate and drank was more than the weight of what came out, and concluded that the body loses weight invisibly through the skin and breath – 'insensible perspiration'. He published his results in 1614. He also invented an early thermometer and a pulse-measuring pendulum.","q":"Where does the 'missing' mass go when you exercise?"},{"id":"bio4-020","t":"Lavoisier's guinea pig in ice","s":"Biology","tp":"Body systems","sub":"Respiration","lv":["GCSE"],"who":"Antoine Lavoisier, Pierre-Simon Laplace","f":0,"loc":"France","rg":["Europe"],"yr":1783,"era":"1700s","tag":"Discovery","x":"In 1782–83 Antoine Lavoisier and Pierre-Simon Laplace put a guinea pig inside a container surrounded by ice and measured how much ice its body heat melted in ten hours. They also measured how much carbon dioxide it breathed out. Comparing this with the heat from burning charcoal to make the same amount of carbon dioxide, they concluded that respiration is a slow form of combustion, using oxygen to release energy from food.","q":"How is respiration similar to burning?"},{"id":"bio4-021","t":"John Scott Haldane's canaries","s":"Biology","tp":"Body systems","sub":"Gas exchange","lv":["KS3","GCSE"],"who":"John Scott Haldane, J. B. S. Haldane","f":0,"loc":"UK","rg":["Europe"],"yr":1896,"era":"1800s","tag":"Eccentric","x":"After mine explosions, most miners died from carbon monoxide, not the blast. The Oxford physiologist John Scott Haldane experimented on himself, breathing carbon monoxide until his vision blurred, and showed how it binds to haemoglobin. In 1896 he proposed that miners carry small animals such as canaries or mice, which react to the gas faster than people. Canaries were used in British coal mines until 1986. His son, J. B. S. Haldane, also became a famous self-experimenting scientist.","q":"Why is carbon monoxide so dangerous?"},{"id":"bio4-022","t":"Augustus Waller's bulldog and the first ECG","s":"Biology","tp":"Body systems","sub":"The heart","lv":["GCSE"],"who":"Augustus Waller, Willem Einthoven","f":0,"loc":"UK / Netherlands","rg":["Europe"],"yr":1887,"era":"1800s","tag":"Eccentric","x":"In 1887 at St Mary's Hospital in London, Augustus Waller recorded the first human electrocardiogram, the electrical signal of the heart, using electrodes on the skin. He often demonstrated it on his bulldog Jimmy, who stood with his paws in jars of salt water. An MP complained in Parliament about cruelty, but Jimmy was unharmed. In 1903 the Dutch doctor Willem Einthoven built a much more sensitive machine and named the waves P, Q, R, S and T. He won the 1924 Nobel Prize.","q":"What does an ECG show about the heart?"},{"id":"bio4-023","t":"Spallanzani swallows bags of food","s":"Biology","tp":"Body systems","sub":"Digestion","lv":["KS3","GCSE"],"who":"Lazzaro Spallanzani, René de Réaumur","f":0,"loc":"Italy / France","rg":["Europe"],"yr":1780,"era":"1700s","tag":"Eccentric","x":"Is digestion mechanical grinding or chemical? In 1752 the French scientist René de Réaumur fed a pet kite bird small metal tubes with food inside, covered by mesh; when it coughed them up, the meat had partly dissolved. Around 1780 the Italian priest Lazzaro Spallanzani went further: he swallowed linen bags and perforated wooden tubes of food on strings and later pulled them back up or retrieved them. The food had been digested by gastric juice, proving chemical digestion.","q":"Why does the stomach need acid?"},{"id":"bio4-024","t":"Casimir Funk names 'vitamines'","s":"Biology","tp":"Nutrition","sub":"Vitamins","lv":["KS3","GCSE"],"who":"Casimir Funk","f":0,"loc":"Poland / UK","rg":["Europe"],"yr":1912,"era":"1900–1949","tag":"Discovery","x":"In 1912 the Polish biochemist Casimir Funk, working at the Lister Institute in London, was trying to purify the substance in rice husks that prevents beriberi. He suggested that several diseases, including beriberi, scurvy, pellagra and rickets, were caused by the lack of special substances in food. He thought they all contained nitrogen as amines and called them 'vital amines', or vitamines. When it turned out most did not, the 'e' was dropped.","q":"What is a deficiency disease?"},{"id":"bio4-025","t":"Frederick McKay and the Colorado brown stain","s":"Biology","tp":"Health","sub":"Teeth","lv":["KS3","GCSE"],"who":"Frederick McKay, G. V. Black, H. Trendley Dean","f":0,"loc":"USA","rg":["North & Central America"],"yr":1931,"era":"1900–1949","tag":"Discovery","x":"In 1901, the young dentist Frederick McKay moved to Colorado Springs and found that many local people had brown-stained teeth – yet these teeth rarely decayed. For decades he investigated, and in 1931 a chemist found high levels of fluoride in the local water. H. Trendley Dean worked out that a small amount of fluoride prevented decay without staining. In 1945 Grand Rapids, Michigan, became the first city to add fluoride to its water supply.","q":"How does fluoride help protect teeth?"},{"id":"bio4-026","t":"Doll and Hill: smoking and lung cancer","s":"Biology","tp":"Health","sub":"Non-communicable disease","lv":["GCSE"],"who":"Richard Doll, Austin Bradford Hill","f":0,"loc":"UK","rg":["Europe"],"yr":1950,"era":"1950–1999","tag":"Discovery","x":"Lung cancer was rising rapidly in Britain after the Second World War. Richard Doll and Austin Bradford Hill expected it was caused by car exhaust or road tar. In 1950 they interviewed patients in London hospitals and found smoking was by far the strongest link. In 1951 they began following over 40,000 British doctors; within a few years, doctors who smoked were dying of lung cancer far more often. Doll gave up smoking during the study. The British Doctors Study continued for 50 years.","q":"Why does a correlation not always prove causation?"},{"id":"bio4-027","t":"Jerry Morris and the London bus conductors","s":"Biology","tp":"Health","sub":"Exercise","lv":["GCSE"],"who":"Jerry Morris","f":0,"loc":"UK","rg":["Europe"],"yr":1953,"era":"1950–1999","tag":"Discovery","x":"In 1953 the epidemiologist Jerry Morris compared drivers and conductors on London's double-decker buses. The drivers sat all day; the conductors climbed up and down about 600 stairs per shift. Conductors had far fewer heart attacks, and when they did, were less likely to die. He found the same pattern for postmen who walked compared with office clerks. It was the first strong evidence that physical activity protects the heart.","q":"Why might the drivers and conductors differ in other ways too?"},{"id":"bio4-028","t":"Percivall Pott and the chimney sweeps","s":"Biology","tp":"Health","sub":"Cancer","lv":["GCSE"],"who":"Percivall Pott","f":0,"loc":"UK","rg":["Europe"],"yr":1775,"era":"1700s","tag":"Discovery","x":"In 18th-century London, young boys, some as young as four, were forced up chimneys to sweep them. In 1775 the surgeon Percivall Pott noticed that many former sweeps developed cancer of the scrotum in their twenties and thirties, and linked it to soot trapped in their skin. It was the first time a cancer was linked to something in the environment or workplace. Britain finally banned child sweeps in 1875.","q":"What are carcinogens?"},{"id":"bio4-029","t":"Alphonse Laveran sees the malaria parasite","s":"Biology","tp":"Disease and immunity","sub":"Protists","lv":["GCSE"],"who":"Alphonse Laveran","f":0,"loc":"Algeria / France","rg":["Africa","Europe"],"yr":1880,"era":"1800s","tag":"Discovery","x":"On 6 November 1880, the French army doctor Alphonse Laveran, working in Constantine, Algeria, examined a drop of blood from a feverish soldier and saw moving, crescent-shaped bodies inside red blood cells, some with whip-like threads. He realised he was seeing a parasite, not a bacterium. Most scientists, expecting a germ in the air, doubted him for years. The parasite, Plasmodium, was later shown to be carried by mosquitoes. Laveran won the 1907 Nobel Prize.","q":"Why does malaria cause repeated fevers?"},{"id":"bio4-030","t":"David and Mary Bruce and the tsetse fly","s":"Biology","tp":"Disease and immunity","sub":"Vectors","lv":["GCSE"],"who":"David Bruce, Mary Bruce","f":1,"loc":"South Africa / Uganda","rg":["Africa"],"yr":1895,"era":"1800s","tag":"Discovery","x":"In 1894, the army doctor David Bruce and his wife Mary, a skilled microscopist and artist, were sent to Zululand to investigate nagana, a disease killing cattle and horses. They found a parasite in the animals' blood – a trypanosome – and showed it was spread by tsetse flies. In 1903 in Uganda they showed a related trypanosome carried by tsetse flies caused human sleeping sickness. Mary worked alongside him throughout, though she was rarely named as a co-author.","q":"How could controlling tsetse flies reduce sleeping sickness?"},{"id":"bio4-031","t":"Typhoid Mary","s":"Biology","tp":"Disease and immunity","sub":"Carriers","lv":["GCSE"],"who":"Mary Mallon, George Soper","f":1,"loc":"USA / Ireland","rg":["North & Central America","Europe"],"yr":1907,"era":"1900–1949","tag":"Tragedy","x":"Mary Mallon, an Irish immigrant, was a cook for wealthy families in New York. In 1906 the investigator George Soper traced a series of typhoid outbreaks to her, but she had never felt ill. She was a healthy carrier, with bacteria living in her gall bladder. She refused to accept this and was held in isolation on North Brother Island from 1907 to 1910, released on condition she stopped cooking, then later found working as a cook again under a false name. She spent the rest of her life in quarantine.","q":"Why are people who carry a disease without symptoms a public health problem?"},{"id":"bio4-032","t":"Dorothy Horstmann finds polio in the blood","s":"Biology","tp":"Disease and immunity","sub":"Viruses","lv":["GCSE","A-Level"],"who":"Dorothy Horstmann, David Bodian","f":1,"loc":"USA","rg":["North & Central America"],"yr":1952,"era":"1950–1999","tag":"Hidden figure","x":"Scientists believed the polio virus travelled from the nose straight into the nerves, so antibodies in the blood would never reach it. In 1952 Dorothy Horstmann at Yale, and David Bodian at Johns Hopkins, found the virus in the blood of monkeys and chimpanzees early in infection, before paralysis appeared. This meant a vaccine causing antibodies in the blood could stop polio – making the Salk and Sabin vaccines possible. Horstmann became Yale's first woman professor of medicine.","q":"Why does a vaccine need to stimulate antibodies in the blood?"},{"id":"bio4-033","t":"Peter Piot and the thermos flask","s":"Biology","tp":"Disease and immunity","sub":"Viruses","lv":["GCSE"],"who":"Peter Piot, Jean-Jacques Muyembe-Tamfum","f":0,"loc":"DR Congo / Belgium","rg":["Africa","Europe"],"yr":1976,"era":"1950–1999","tag":"Discovery","x":"In 1976 a blue plastic thermos flask arrived at a lab in Antwerp containing blood samples from a Belgian nun who had died of a mysterious illness in Yambuku, Zaire (now the Democratic Republic of the Congo). One tube had broken. The 27-year-old Peter Piot and colleagues found a new virus, shaped like a long worm. Piot travelled to Yambuku, where the Congolese doctor Jean-Jacques Muyembe-Tamfum had already collected samples. They named it after the nearby Ebola River.","q":"How do scientists stop a new virus spreading?"},{"id":"bio4-034","t":"Baruch Blumberg's Australia antigen","s":"Biology","tp":"Disease and immunity","sub":"Viruses","lv":["GCSE","A-Level"],"who":"Baruch Blumberg, Irving Millman","f":0,"loc":"USA / Australia","rg":["Oceania","North & Central America"],"yr":1967,"era":"1950–1999","tag":"Discovery","x":"Baruch Blumberg was collecting blood from people around the world to study inherited differences. In 1964 he found an unusual protein in the blood of an Aboriginal Australian man and called it the 'Australia antigen'. He later showed it was part of the hepatitis B virus, which can cause liver cancer. With Irving Millman, he developed a blood test and the first hepatitis B vaccine in 1969 – the first vaccine against a cancer-causing virus. He won the 1976 Nobel Prize.","q":"How can a vaccine prevent cancer?"},{"id":"bio4-035","t":"Milstein and Köhler decide not to patent","s":"Biology","tp":"Disease and immunity","sub":"Monoclonal antibodies","lv":["GCSE","A-Level"],"who":"César Milstein, Georges Köhler","f":0,"loc":"UK / Argentina / Germany","rg":["South America","Europe"],"yr":1975,"era":"1950–1999","tag":"Discovery","x":"In 1975 at the Laboratory of Molecular Biology in Cambridge, the Argentine-born César Milstein and the German Georges Köhler fused antibody-producing white blood cells with cancer cells. The resulting hybridoma cells divide forever and pump out identical antibodies against one chosen target – monoclonal antibodies. They did not patent their method. Monoclonal antibodies are now used in pregnancy tests, COVID tests and cancer treatments, and form one of the biggest-selling classes of medicines.","q":"Why are monoclonal antibodies so specific?"},{"id":"bio4-036","t":"Peter Medawar and the burned pilots","s":"Biology","tp":"Disease and immunity","sub":"Transplants","lv":["GCSE","A-Level"],"who":"Peter Medawar, Rupert Billingham, Leslie Brent","f":0,"loc":"UK / Brazil","rg":["South America","Europe"],"yr":1953,"era":"1950–1999","tag":"Wartime","x":"In 1940 a bomber crashed near Peter Medawar's home in Oxford, and he saw how badly burned the airman was. Asked to help, he studied why skin grafts from other people are always rejected. He showed it was the immune system attacking 'foreign' tissue. In 1953, with Rupert Billingham and Leslie Brent, he showed that mice injected before birth with cells from another strain later accepted skin grafts from it – 'acquired immune tolerance'. Born in Brazil, Medawar shared the 1960 Nobel Prize.","q":"Why do transplant patients need drugs to suppress their immune system?"},{"id":"bio4-037","t":"Onesimus brings inoculation to Boston","s":"Biology","tp":"Disease and immunity","sub":"Vaccines","lv":["KS3","GCSE"],"who":"Onesimus, Cotton Mather, Zabdiel Boylston","f":0,"loc":"USA / West Africa","rg":["Africa","North & Central America"],"yr":1721,"era":"1700s","tag":"Hidden figure","x":"Onesimus was an enslaved West African man in Boston. Around 1706 he told the minister Cotton Mather that, as a child in Africa, he had been given a mild dose of smallpox through a cut in his skin, protecting him for life. When smallpox struck Boston in 1721, Mather persuaded the doctor Zabdiel Boylston to inoculate people, against fierce opposition; someone threw a bomb through Mather's window. About 2% of inoculated people died, compared with about 14% of those who caught smallpox naturally.","q":"What do the death rates suggest about inoculation?"},{"id":"bio4-038","t":"Mary Lyon and the calico cat","s":"Biology","tp":"Genetics","sub":"X chromosomes","lv":["A-Level"],"who":"Mary Lyon","f":1,"loc":"UK","rg":["Europe"],"yr":1961,"era":"1950–1999","tag":"Hidden figure","x":"Female mammals have two X chromosomes and males one. In 1961 Mary Lyon, working at Harwell in Oxfordshire, proposed that in each cell of a female, one X chromosome is randomly switched off early in development. This explains why female tortoiseshell and calico cats have patches of orange and black fur: in each patch, a different X is active, carrying a different fur colour gene. Almost all tortoiseshell cats are female. X-inactivation is sometimes called 'Lyonisation'.","q":"Why are almost all tortoiseshell cats female?"},{"id":"bio4-039","t":"Hardy, Punnett and a game of cricket","s":"Biology","tp":"Genetics","sub":"Population genetics","lv":["A-Level"],"who":"G. H. Hardy, Reginald Punnett, Wilhelm Weinberg","f":0,"loc":"UK / Germany","rg":["Europe"],"yr":1908,"era":"1900–1949","tag":"Discovery","x":"The geneticist Reginald Punnett, who invented the Punnett square, played cricket with the mathematician G. H. Hardy in Cambridge. Punnett asked why dominant alleles do not gradually take over a population. Hardy, who disliked applied maths, quickly worked out an equation showing that allele frequencies stay constant without selection or other forces. He published it in 1908, the same year as the German doctor Wilhelm Weinberg. The Hardy–Weinberg principle lets biologists estimate how many people carry a genetic condition.","q":"Why don't dominant alleles automatically become more common?"},{"id":"bio4-040","t":"Golden rice","s":"Biology","tp":"Genetics","sub":"Genetic engineering","lv":["GCSE"],"who":"Ingo Potrykus, Peter Beyer","f":0,"loc":"Switzerland / Germany / Philippines","rg":["Southeast Asia","Europe"],"yr":2000,"era":"2000 onwards","tag":"Modern research","x":"Lack of vitamin A causes blindness in hundreds of thousands of children a year in countries where rice is the main food. In 2000, Ingo Potrykus and Peter Beyer announced rice genetically modified with genes from daffodils and a bacterium to make beta-carotene, turning the grains golden. A later version used a maize gene and contained much more. It faced years of opposition and regulation, and in 2021 the Philippines became the first country to approve it for growing.","q":"What are the arguments for and against golden rice?"},{"id":"bio4-041","t":"John Sulston and the free human genome","s":"Biology","tp":"Genetics","sub":"Genomes","lv":["GCSE","A-Level"],"who":"John Sulston, Craig Venter","f":0,"loc":"UK / USA","rg":["North & Central America","Europe"],"yr":2000,"era":"2000 onwards","tag":"Rivalry","x":"The Human Genome Project, a public collaboration across six countries, set out to read all 3 billion letters of human DNA. In 1998, Craig Venter's private company Celera announced it would race to sequence the genome faster and patent genes. John Sulston, who led the British contribution at the Sanger Centre near Cambridge, insisted every sequence be published free online within 24 hours. A draft was announced jointly in 2000, and a near-complete sequence in 2003.","q":"Should genetic information be patented or free to all?"},{"id":"bio4-042","t":"The Wallace Line","s":"Biology","tp":"Evolution","sub":"Biogeography","lv":["GCSE","A-Level"],"who":"Alfred Russel Wallace","f":0,"loc":"Wales / Indonesia","rg":["Southeast Asia","Europe"],"yr":1859,"era":"1800s","tag":"Discovery","x":"Alfred Russel Wallace was born in Usk, Monmouthshire. Collecting in the Malay Archipelago in the 1850s, he noticed that the islands of Bali and Lombok, only 35 km apart, had very different animals: Asian species such as tigers and woodpeckers on one side, and Australian ones like cockatoos and marsupials on the other. He drew an invisible boundary, now the Wallace Line. Deep water there was never crossed by land bridges during ice ages, keeping the two groups apart.","q":"How can a narrow strait separate two groups of animals?"},{"id":"bio4-043","t":"Bates and Müller: butterflies that cheat","s":"Biology","tp":"Evolution","sub":"Mimicry","lv":["GCSE","A-Level"],"who":"Henry Walter Bates, Fritz Müller","f":0,"loc":"Brazil / UK / Germany","rg":["South America","Europe"],"yr":1862,"era":"1800s","tag":"Discovery","x":"Henry Walter Bates spent 11 years in the Amazon, collecting over 14,000 species, mostly insects, 8,000 of them new to science. He noticed some tasty butterflies looked almost identical to foul-tasting ones. In 1862 he explained that predators learn to avoid the nasty-tasting species, so harmless lookalikes survive – Batesian mimicry, one of the first examples of natural selection after Darwin. In 1878, the German Fritz Müller, living in Brazil, showed that two distasteful species can also evolve to look alike.","q":"How does natural selection produce mimicry?"},{"id":"bio4-044","t":"Lamarck's giraffes","s":"Biology","tp":"Evolution","sub":"Theories of evolution","lv":["GCSE"],"who":"Jean-Baptiste Lamarck","f":0,"loc":"France","rg":["Europe"],"yr":1809,"era":"1800s","tag":"Blunder","x":"In 1809 the French naturalist Jean-Baptiste Lamarck proposed that species change over time – a bold idea then. He suggested that organisms change by using or not using body parts, and pass on these acquired features: giraffes stretching for leaves would have offspring with longer necks. Experiments failed to support this. Darwin's natural selection explained it differently. Lamarck died poor and blind, and is often mocked, but he was one of the first to argue that life evolves.","q":"How would Darwin explain giraffes' long necks?"},{"id":"bio4-045","t":"Archaeopteryx arrives just in time","s":"Biology","tp":"Evolution","sub":"Evidence","lv":["KS3","GCSE"],"who":"Richard Owen, Thomas Henry Huxley","f":0,"loc":"Germany / UK","rg":["Europe"],"yr":1861,"era":"1800s","tag":"Discovery","x":"In 1861, two years after Darwin's On the Origin of Species, quarry workers at Solnhofen in Bavaria found a fossil with feathers and wings, but also teeth, claws on its wings and a long bony tail. Archaeopteryx seemed to be part reptile, part bird – just the kind of transitional fossil Darwin's theory predicted. The Natural History Museum in London bought it for £700. Thomas Henry Huxley later argued that birds evolved from dinosaurs.","q":"Why was Archaeopteryx good evidence for evolution?"},{"id":"bio4-046","t":"Ruth Harkness brings home a panda","s":"Biology","tp":"Ecology","sub":"Conservation","lv":["KS3"],"who":"Ruth Harkness, Quentin Young","f":1,"loc":"China / USA","rg":["East Asia","North & Central America"],"yr":1936,"era":"1900–1949","tag":"Eccentric","x":"Ruth Harkness was a New York fashion designer with no expedition experience. After her husband died in China while trying to capture a giant panda, she went in his place. In November 1936, with the Chinese-American explorer Quentin Young, she found a baby panda in the mountains of Sichuan and fed it with a baby's bottle. She called it Su Lin and carried it to the USA, where it became a sensation at Chicago's Brookfield Zoo. Today pandas are protected, and capturing them is banned.","q":"Why are pandas vulnerable to extinction?"},{"id":"bio4-047","t":"The Nile perch in Lake Victoria","s":"Biology","tp":"Ecology","sub":"Invasive species","lv":["GCSE"],"who":"","f":0,"loc":"Uganda / Kenya / Tanzania","rg":["Africa"],"yr":1954,"era":"1950–1999","tag":"Tragedy","x":"Lake Victoria in East Africa was home to hundreds of species of small cichlid fish, an extraordinary example of rapid evolution. In the 1950s, the large predatory Nile perch was introduced to boost fishing. By the 1980s its numbers exploded, and around 200 cichlid species are thought to have gone extinct – one of the biggest extinctions of vertebrates in modern times. The perch created a valuable export fishery, but the lake's ecology was transformed.","q":"Why can introduced predators be so destructive?"},{"id":"bio4-048","t":"Cane toads in Queensland","s":"Biology","tp":"Ecology","sub":"Invasive species","lv":["KS3","GCSE"],"who":"","f":0,"loc":"Australia","rg":["Oceania"],"yr":1935,"era":"1900–1949","tag":"Blunder","x":"In 1935, 102 cane toads from Hawaii were released in Queensland, Australia, to eat beetles that damaged sugarcane. The toads did not control the beetles, which live high on the cane. But they bred rapidly, with females laying up to 30,000 eggs at a time, and they are poisonous to many native predators such as quolls and snakes. There are now estimated to be over 200 million across northern Australia, spreading tens of kilometres a year. Toads at the front of the invasion have evolved longer legs.","q":"Why might toads at the edge of the invasion evolve longer legs?"},{"id":"bio4-049","t":"Myxomatosis and Australia's rabbits","s":"Biology","tp":"Ecology","sub":"Biological control","lv":["GCSE"],"who":"Thomas Austin, Frank Fenner","f":0,"loc":"Australia / UK","rg":["Oceania","Europe"],"yr":1950,"era":"1950–1999","tag":"Blunder","x":"In 1859 the settler Thomas Austin released 24 wild rabbits on his land in Victoria so he could hunt them. With few predators, they multiplied into hundreds of millions, stripping farmland. In 1950 scientists released the myxoma virus, which killed over 99% of infected rabbits. But within a few years, the virus evolved to be less deadly and rabbits evolved resistance, as Frank Fenner's team showed – a classic example of co-evolution. When the virus spread to Britain in 1953, it killed most of its rabbits too.","q":"Why would a less deadly virus spread better?"},{"id":"bio4-050","t":"The last dodo","s":"Biology","tp":"Ecology","sub":"Extinction","lv":["KS3","GCSE"],"who":"","f":0,"loc":"Mauritius","rg":["Africa"],"yr":1662,"era":"1500–1699","tag":"Tragedy","x":"The dodo was a large flightless pigeon found only on the island of Mauritius, with no natural predators and no fear of people. Dutch sailors arrived in 1598, bringing rats, pigs, monkeys and dogs, which ate the eggs laid on the ground. The last widely accepted sighting was in 1662, less than 70 years later. Almost no complete specimens were preserved. Recent studies suggest the dodo was more agile than old paintings of plump birds show.","q":"Why are island species especially vulnerable to extinction?"},{"id":"bio4-051","t":"Martha, the last passenger pigeon","s":"Biology","tp":"Ecology","sub":"Extinction","lv":["KS3","GCSE"],"who":"","f":0,"loc":"USA","rg":["North & Central America"],"yr":1914,"era":"1900–1949","tag":"Tragedy","x":"Passenger pigeons were once probably the most numerous birds in North America, numbering in the billions; flocks could take hours to fly overhead. They were hunted on a massive scale, shipped by train to cities as cheap meat, and their forests were cleared. They bred in huge colonies and struggled in small numbers. On 1 September 1914, the last one, a female named Martha, died at Cincinnati Zoo. Her body is preserved at the Smithsonian.","q":"Why might a species that lives in huge flocks crash quickly?"},{"id":"bio4-052","t":"Terry Erwin fogs the rainforest canopy","s":"Biology","tp":"Ecology","sub":"Biodiversity","lv":["GCSE"],"who":"Terry Erwin, Margaret Lowman","f":1,"loc":"Panama / Peru / Australia","rg":["Oceania","South America"],"yr":1982,"era":"1950–1999","tag":"Discovery","x":"In the 1970s, the entomologist Terry Erwin sprayed a fog of insecticide into the tops of 19 trees of a single species in Panama and collected the insects that rained down. He found about 1,200 species of beetles, many found only on that tree. In 1982 he estimated there could be 30 million species of insects on Earth, many more than believed. Botanist Margaret Lowman, nicknamed 'Canopy Meg', pioneered walkways and ropes to study the treetops, where much rainforest life lives.","q":"Why is it so difficult to count how many species exist?"},{"id":"bio4-053","t":"Biosphere 2 runs out of oxygen","s":"Biology","tp":"Ecology","sub":"Ecosystems","lv":["KS3","GCSE"],"who":"Jane Poynter, Mark Nelson","f":1,"loc":"USA","rg":["North & Central America"],"yr":1993,"era":"1950–1999","tag":"Blunder","x":"In 1991, eight people sealed themselves inside Biosphere 2 in the Arizona desert, a 1.3-hectare glass building with a rainforest, ocean, desert and farm, to live for two years on its recycled air, water and food. Oxygen levels fell steadily from 21% to about 14%, and the crew became breathless. Microbes in the rich soil were respiring fast, and the concrete was absorbing carbon dioxide. Oxygen had to be pumped in. Most pollinating insects died, and the crew were often hungry.","q":"What does Biosphere 2 show about how hard it is to build a balanced ecosystem?"},{"id":"bio4-054","t":"Alex the parrot","s":"Biology","tp":"Behaviour","sub":"Animal intelligence","lv":["KS3"],"who":"Irene Pepperberg","f":1,"loc":"USA","rg":["North & Central America"],"yr":1977,"era":"1950–1999","tag":"Discovery","x":"In 1977 Irene Pepperberg bought an African grey parrot from a pet shop in Chicago and named him Alex. Over 30 years of training, Alex learned over 100 words and could identify colours, shapes and materials, count up to six, and understand the concept of zero. When shown two objects he could say whether they were the same or different, and in what way. Many scientists had believed parrots only mimic. His last words to Pepperberg, in 2007, were 'You be good. See you tomorrow. I love you.'","q":"How could you test whether an animal really understands a word?"},{"id":"bio4-055","t":"B. F. Skinner's pigeon-guided missiles","s":"Biology","tp":"Behaviour","sub":"Learning","lv":["KS3","GCSE"],"who":"B. F. Skinner","f":0,"loc":"USA","rg":["North & Central America"],"yr":1943,"era":"1900–1949","tag":"Wartime","x":"During the Second World War, the psychologist B. F. Skinner trained pigeons to peck at an image of a target on a screen. In 'Project Pigeon', three pigeons inside a missile's nose cone would peck at the image of a ship, steering the missile. The pigeons performed well in tests, but the military cancelled the project in 1944, partly because nobody took it seriously. Skinner's work on rewarding behaviour, called operant conditioning, is used in animal training and education.","q":"How does rewarding behaviour change how animals act?"},{"id":"bio4-056","t":"Biruté Galdikas and the orangutans","s":"Biology","tp":"Behaviour","sub":"Primates","lv":["KS3","GCSE"],"who":"Biruté Galdikas, Dian Fossey, Louis Leakey","f":1,"loc":"Indonesia (Borneo)","rg":["Southeast Asia"],"yr":1971,"era":"1950–1999","tag":"Discovery","x":"The palaeontologist Louis Leakey encouraged three women to make long-term studies of great apes: Jane Goodall with chimpanzees, Dian Fossey with mountain gorillas in Rwanda, and Biruté Galdikas with orangutans. In 1971 Galdikas, a Canadian of Lithuanian descent, set up a camp in Borneo. Orangutans are solitary and live high in the trees, making them extremely hard to follow. She has studied them for over 50 years and campaigns against the forest clearance for palm oil plantations that threatens them.","q":"Why are long-term studies important in animal behaviour?"},{"id":"bio4-057","t":"Donald Griffin hears bats","s":"Biology","tp":"Senses","sub":"Echolocation","lv":["KS3","GCSE"],"who":"Donald Griffin, George Pierce, Robert Galambos","f":0,"loc":"USA","rg":["North & Central America"],"yr":1938,"era":"1900–1949","tag":"Discovery","x":"Spallanzani had shown in the 1790s that bats navigate using their ears, not their eyes, but nobody knew how. In 1938 the Harvard student Donald Griffin brought bats to the physicist George Pierce, who had built a detector for ultrasound. It picked up a stream of calls far above the range of human hearing. Griffin and Robert Galambos showed that bats find their way and catch insects by listening to the echoes – he coined the word 'echolocation'.","q":"How can an echo tell a bat how far away an insect is?"},{"id":"bio4-058","t":"Darwin's 'most wonderful plant'","s":"Biology","tp":"Plants","sub":"Adaptations","lv":["KS3","GCSE"],"who":"Charles Darwin","f":0,"loc":"UK / USA","rg":["North & Central America","Europe"],"yr":1875,"era":"1800s","tag":"Discovery","x":"Charles Darwin called the Venus flytrap, native to boggy areas of North and South Carolina, 'one of the most wonderful plants in the world'. In his 1875 book Insectivorous Plants, he described experiments feeding flytraps and sundews tiny pieces of meat, egg and glass. The traps closed and digested food but not glass. Flytraps snap shut only if a trigger hair is touched twice within about 20 seconds, so raindrops don't waste energy. They grow in poor soil and get nitrogen from insects.","q":"Why do carnivorous plants live in nutrient-poor soils?"},{"id":"bio4-059","t":"Jagadish Chandra Bose's crescograph","s":"Biology","tp":"Plants","sub":"Plant responses","lv":["KS3","GCSE"],"who":"Jagadish Chandra Bose","f":0,"loc":"India","rg":["South Asia"],"yr":1901,"era":"1900–1949","tag":"Discovery","x":"Jagadish Chandra Bose, the Indian physicist and pioneer of radio waves, became fascinated by plants. Around 1901 in Kolkata he built very sensitive instruments, including the crescograph, which could magnify the growth of a plant about 10,000 times. He showed that plants respond to stimuli such as touch, heat, light and chemicals with electrical signals, a bit like animal nerves. Some of his claims, that plants feel pain, went too far, but plant electrical signalling is now an active research area.","q":"How do plants respond to their environment without nerves?"},{"id":"bio4-060","t":"Norman Borlaug and the Green Revolution","s":"Biology","tp":"Plants","sub":"Selective breeding","lv":["GCSE"],"who":"Norman Borlaug, M. S. Swaminathan","f":0,"loc":"Mexico / India / Pakistan","rg":["South Asia","North & Central America"],"yr":1965,"era":"1950–1999","tag":"Discovery","x":"From 1944 in Mexico, the American plant scientist Norman Borlaug bred thousands of crosses of wheat to resist rust disease. He then bred in dwarf genes so the plants put energy into grain and didn't collapse under heavy heads. In 1965–66, as India and Pakistan faced famine, the agricultural scientist M. S. Swaminathan helped bring Borlaug's wheat to India. Harvests roughly doubled within a few years. Borlaug won the 1970 Nobel Peace Prize. Critics point to the heavy use of water, fertiliser and pesticides.","q":"Why are shorter wheat plants better for high yields?"},{"id":"bio4-061","t":"The potato blight","s":"Biology","tp":"Plants","sub":"Plant disease","lv":["GCSE"],"who":"Miles Joseph Berkeley","f":0,"loc":"Ireland","rg":["Europe"],"yr":1845,"era":"1800s","tag":"Tragedy","x":"In 1845, potato crops across Europe turned black and rotted in the fields. Ireland, where a third of the population relied on potatoes, mostly of a single variety, suffered most: around a million people died and a million emigrated. Many scientists blamed damp weather. The English clergyman and botanist Miles Joseph Berkeley argued that a mould was the cause, not the result, of the rot. It was later identified as Phytophthora infestans. Growing a single variety made the crop extremely vulnerable.","q":"Why does a lack of genetic variety make crops vulnerable?"},{"id":"bio4-062","t":"The banana that disappeared","s":"Biology","tp":"Plants","sub":"Plant disease","lv":["KS3","GCSE"],"wh
