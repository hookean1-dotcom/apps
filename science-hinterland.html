o":"","f":0,"loc":"Central America / Worldwide","rg":["North & Central America"],"yr":1950,"era":"1950–1999","tag":"Everyday","x":"Until the 1950s, almost all bananas exported to Europe and North America were a variety called Gros Michel. Bananas are grown from cuttings, so every plant is a clone. A soil fungus causing Panama disease spread through the plantations of Central America, and Gros Michel was wiped out commercially. It was replaced by the Cavendish, which resisted the fungus. Now a new strain, Tropical Race 4, is attacking Cavendish plantations worldwide.","q":"Why are clones especially vulnerable to disease?"},{"id":"bio4-063","t":"Suzanne Simard and the wood wide web","s":"Biology","tp":"Plants","sub":"Mycorrhiza","lv":["GCSE","A-Level"],"who":"Suzanne Simard","f":1,"loc":"Canada","rg":["North & Central America"],"yr":1997,"era":"1950–1999","tag":"Modern research","x":"Suzanne Simard grew up in a logging family in British Columbia. She suspected trees in a forest were connected. In experiments in the 1990s, she covered birch and Douglas fir seedlings with plastic bags and fed them carbon dioxide with different radioactive and stable carbon isotopes. Carbon moved between the trees through underground fungal networks – mycorrhizae – depending on which tree was shaded. Her 1997 paper in Nature was nicknamed the 'wood wide web'. How much trees 'share' is still debated.","q":"How do mycorrhizal fungi and trees both benefit?"},{"id":"bio4-064","t":"Methuselah: a date palm from a 2,000-year-old seed","s":"Biology","tp":"Plants","sub":"Seeds","lv":["KS3","GCSE"],"who":"Elaine Solowey, Sarah Sallon","f":1,"loc":"Israel","rg":["Middle East"],"yr":2005,"era":"2000 onwards","tag":"Modern research","x":"In the 1960s, archaeologists excavating King Herod's fortress at Masada found date seeds about 2,000 years old. In 2005 the botanist Elaine Solowey, working with the doctor Sarah Sallon, soaked three of them in water, fertiliser and hormones and planted them. One sprouted. The tree, named Methuselah, is a male Judean date palm, a type extinct for centuries. In 2020 they reported that more ancient seeds had grown, including a female, and Methuselah has produced pollen.","q":"How do seeds stay alive for so long?"},{"id":"bio4-065","t":"The Svalbard doomsday vault","s":"Biology","tp":"Genetics","sub":"Gene banks","lv":["KS3","GCSE"],"who":"Cary Fowler","f":0,"loc":"Norway","rg":["Europe"],"yr":2008,"era":"2000 onwards","tag":"Modern research","x":"In 2008 the Svalbard Global Seed Vault opened, dug 120 m into a mountain on an Arctic island in Norway. The permafrost keeps seeds cold even if power fails, and it sits high above sea level. It holds over a million samples of crop seeds sent from gene banks worldwide as a backup. In 2015, during the Syrian civil war, researchers made the first withdrawal to replace seeds from a gene bank in Aleppo that could no longer be used.","q":"Why store seeds from many varieties, not just the best ones?"},{"id":"bio4-066","t":"The tongue map myth","s":"Biology","tp":"Senses","sub":"Taste","lv":["KS3","GCSE"],"who":"David Hänig, Edwin Boring","f":0,"loc":"Germany / USA","rg":["North & Central America","Europe"],"yr":1901,"era":"1900–1949","tag":"Blunder","x":"Many textbooks once showed a 'tongue map', with sweet at the tip, bitter at the back and sour and salty at the sides. It came from a 1901 German study by David Hänig, which found small differences in sensitivity around the edge of the tongue. In 1942 the Harvard psychologist Edwin Boring turned his data into a graph that was misread as showing each taste in only one region. In fact, taste buds all over the tongue can detect all five basic tastes.","q":"How could you test whether the tongue map is true?"},{"id":"bio4-067","t":"Michel Siffre lives in a cave","s":"Biology","tp":"Body systems","sub":"Circadian rhythms","lv":["KS3","GCSE"],"who":"Michel Siffre","f":0,"loc":"France","rg":["Europe"],"yr":1962,"era":"1950–1999","tag":"Eccentric","x":"In 1962 the 23-year-old French geologist Michel Siffre lived for two months alone in the Scarasson cave, 130 m underground in the Alps, with no clock or daylight. He phoned the surface when he woke, ate and slept. When he emerged, he thought it was a month earlier than it really was: his days had stretched to just over 24 hours, and he had lost track. His experiments showed humans have an internal body clock, a circadian rhythm, which is normally reset by daylight.","q":"Why does daylight help keep your body clock in time?"},{"id":"bio4-068","t":"Is 37 °C really normal?","s":"Biology","tp":"Body systems","sub":"Body temperature","lv":["KS3","GCSE"],"who":"Carl Wunderlich","f":0,"loc":"Germany / USA","rg":["North & Central America","Europe"],"yr":1868,"era":"1800s","tag":"Everyday","x":"In 1868 the German doctor Carl Wunderlich published results from about 25,000 patients, taking millions of armpit readings, and declared 37 °C to be normal body temperature. Modern studies, using better thermometers, find the average is closer to 36.6 °C, and varies with time of day, age and person. A 2020 study of American records found average temperatures had fallen over 150 years, perhaps because of fewer chronic infections and warmer homes.","q":"Why does the body need to keep a steady temperature?"},{"id":"bio4-069","t":"Eero Mäntyranta's natural advantage","s":"Biology","tp":"Genetics","sub":"Mutations","lv":["GCSE","A-Level"],"who":"Eero Mäntyranta, Albert de la Chapelle","f":0,"loc":"Finland","rg":["Europe"],"yr":1993,"era":"1950–1999","tag":"Discovery","x":"The Finnish cross-country skier Eero Mäntyranta won seven Olympic medals in the 1960s, and his blood had unusually high levels of red blood cells, raising suspicions of doping. In 1993, the geneticist Albert de la Chapelle studied his family and found many relatives had a mutation in the gene for the receptor for EPO, the hormone that tells the body to make red blood cells. Their bodies made extra red cells naturally, carrying more oxygen to their muscles.","q":"Why do extra red blood cells help an endurance athlete?"},{"id":"bio4-070","t":"Tibetans and the Denisovan gene","s":"Biology","tp":"Evolution","sub":"Adaptation","lv":["GCSE","A-Level"],"who":"Emilia Huerta-Sánchez, Rasmus Nielsen","f":1,"loc":"China (Tibet)","rg":["East Asia"],"yr":2014,"era":"2000 onwards","tag":"Modern research","x":"Most people at altitude make extra red blood cells to cope with thin air, which thickens the blood. Tibetans, living above 4,000 m, don't – yet they thrive. Studies found a version of a gene called EPAS1 common in Tibetans that helps them cope with low oxygen. In 2014, Emilia Huerta-Sánchez, Rasmus Nielsen and colleagues showed this version almost exactly matches DNA from the Denisovans, an extinct human group. Tibetan ancestors seem to have inherited it by interbreeding with them.","q":"How might a gene from another human group spread by natural selection?"},{"id":"bio4-071","t":"Roger Sperry's split-brain patients","s":"Biology","tp":"Nerves","sub":"The brain","lv":["GCSE","A-Level"],"who":"Roger Sperry, Michael Gazzaniga","f":0,"loc":"USA","rg":["North & Central America"],"yr":1962,"era":"1950–1999","tag":"Discovery","x":"To treat severe epilepsy, some patients in the 1960s had the corpus callosum, the bundle of nerves joining the two halves of the brain, cut. Roger Sperry and his student Michael Gazzaniga tested them by showing a picture to only one half. If shown to the left hemisphere, the patient could name it. If shown to the right hemisphere, they could not say what it was – but could pick it out with their left hand. Each half of the brain had partly separate abilities. Sperry won the 1981 Nobel Prize.","q":"Why does the right hemisphere control the left hand?"},{"id":"bio4-072","t":"The Cairo toe","s":"Biology","tp":"Medicine","sub":"Prosthetics","lv":["KS3","GCSE"],"who":"","f":0,"loc":"Egypt","rg":["Africa"],"yr":-950,"era":"Ancient","tag":"Invention","x":"In a tomb near Luxor in Egypt, archaeologists found a mummy of a noblewoman, probably named Tabaketenmut, with an artificial big toe made of wood and leather, around 3,000 years old. The toe shows signs of wear and had been refitted several times. In 2011 researchers at the University of Manchester made replicas and asked volunteers with missing big toes to wear them in Egyptian-style sandals: they helped people walk well. It is one of the oldest known working prosthetics.","q":"Why is the big toe important for walking?"},{"id":"bio4-073","t":"The Physicians of Myddfai","s":"Biology","tp":"Medicine","sub":"Herbal medicine","lv":["KS3"],"who":"Rhiwallon Feddyg","f":0,"loc":"Wales","rg":["Europe"],"yr":1230,"era":"Medieval","tag":"Discovery","x":"In the 13th century, a family of healers lived at Myddfai in Carmarthenshire. Legend says their ancestor was the son of a fairy woman from the lake Llyn y Fan Fach, who taught him the healing powers of plants. Rhiwallon Feddyg and his sons served the Prince of Deheubarth, and their remedies, written down in Welsh, survive in the Red Book of Hergest. Their recipes used plants such as foxglove, garlic and willow, some of which contain chemicals used in modern medicines. The family is said to have produced doctors for centuries.","q":"How can scientists test whether a traditional herbal remedy works?"},{"id":"mix5-001","t":"St. Elmo Brady: the first Black chemistry PhD in the USA","s":"Chemistry","tp":"How science works","sub":"Teaching chemistry","lv":["KS3","GCSE"],"who":"St. Elmo Brady","f":0,"loc":"USA","rg":["North & Central America"],"yr":1916,"era":"1900–1949","tag":"Hidden figure","x":"In 1916 St. Elmo Brady became the first African American to earn a PhD in chemistry in the USA, at the University of Illinois, studying the acidity of organic compounds. Rather than take a research job, he chose to build chemistry departments at historically Black colleges, including Tuskegee, Howard and Fisk, at a time when segregation kept Black students out of many universities. He set up graduate programmes and trained generations of chemists, and helped start a summer school for chemistry teachers.","q":"Why are good teachers essential for the future of science?"},{"id":"mix5-002","t":"Rachel Lloyd and the sugar beet","s":"Chemistry","tp":"Organic chemistry","sub":"Agricultural chemistry","lv":["KS3","GCSE"],"who":"Rachel Lloyd","f":1,"loc":"USA / Switzerland","rg":["North & Central America","Europe"],"yr":1887,"era":"1800s","tag":"Hidden figure","x":"Rachel Lloyd was widowed young and turned to chemistry, but American universities did not award doctorates to women. She travelled to Zurich, and in 1887 became the first American woman to earn a PhD in chemistry. As a professor at the University of Nebraska, she analysed the sugar content of sugar beets grown in different parts of the state and showed Nebraska could grow them well, helping launch a sugar beet industry there. She was the first woman member of the American Chemical Society.","q":"How could chemical analysis help farmers choose what to grow?"},{"id":"mix5-003","t":"Sweetening Roman wine with lead","s":"Chemistry","tp":"Health and medicine","sub":"Toxic metals","lv":["KS3","GCSE"],"who":"Pliny the Elder","f":0,"loc":"Italy","rg":["Europe"],"yr":50,"era":"Ancient","tag":"Everyday","x":"Romans made a syrup called sapa or defrutum by boiling grape juice slowly in lead pots. It reacted to form lead acetate, which tastes sweet – later called 'sugar of lead'. Recipes used sapa to sweeten and preserve wine and food. Romans also used lead water pipes, though hard water coated them with mineral deposits. Some historians suggest lead poisoning harmed wealthy Romans, though most now think it was not a major cause of the empire's decline.","q":"Why is lead dangerous to the human body?"},{"id":"mix5-004","t":"George Ravenscroft's lead crystal","s":"Chemistry","tp":"Materials","sub":"Glass","lv":["KS3","GCSE"],"who":"George Ravenscroft","f":0,"loc":"UK / Italy","rg":["Europe"],"yr":1674,"era":"1500–1699","tag":"Invention","x":"Venice dominated fine glassmaking, and its secrets were closely guarded. The English merchant George Ravenscroft had lived in Venice and in 1674 set up a glassworks in London to compete. His early glass developed a cloud of fine cracks called 'crizzling'. He added lead oxide to the mixture and produced a heavy, brilliant glass that sparkled because lead increases the refractive index. Lead crystal became famous for chandeliers and wine glasses.","q":"Why does a higher refractive index make glass sparkle more?"},{"id":"mix5-005","t":"Alastair Pilkington washes up and invents float glass","s":"Chemistry","tp":"Materials","sub":"Glass","lv":["KS3","GCSE"],"who":"Alastair Pilkington, Kenneth Bickerstaff","f":0,"loc":"UK","rg":["Europe"],"yr":1959,"era":"1950–1999","tag":"Invention","x":"Making flat window glass used to require grinding and polishing, which was slow and wasted glass. The story goes that Alastair Pilkington had his idea while washing up, watching grease float on water. In 1952 at Pilkington in St Helens he and Kenneth Bickerstaff began developing a process to pour molten glass onto a bath of molten tin. The glass floats, spreading into a perfectly flat, smooth sheet. It took seven years and huge sums of money to perfect. Almost all flat glass is now made this way.","q":"Why does glass float on molten tin?"},{"id":"mix5-006","t":"The iron pillar of Delhi","s":"Chemistry","tp":"Reactivity","sub":"Corrosion","lv":["KS3","GCSE"],"who":"R. Balasubramaniam","f":0,"loc":"India","rg":["South Asia"],"yr":400,"era":"Ancient","tag":"Discovery","x":"In the Qutb complex in Delhi stands an iron pillar over 7 m tall, made around 1,600 years ago during the Gupta empire, and hardly rusted. Studies by the metallurgist R. Balasubramaniam and others found the iron contains a lot of phosphorus and very little sulphur. Over time a thin protective layer formed on its surface, containing a compound called misawite, which slows further corrosion. Delhi's fairly dry climate helps too. It shows the skill of ancient Indian ironworkers.","q":"Why does most iron rust, and how can rusting be slowed?"},{"id":"mix5-007","t":"Babylonian soap","s":"Chemistry","tp":"Acids and alkalis","sub":"Saponification","lv":["KS3","GCSE"],"who":"","f":0,"loc":"Iraq (Babylon)","rg":["Middle East"],"yr":-2200,"era":"Ancient","tag":"Everyday","x":"Clay tablets from Babylon, dating from around 2200 BCE, describe making soap by boiling fats with water and wood ash, which contains alkaline potassium carbonate. The alkali breaks down fats into soap – saponification. Ancient Egyptians used similar mixtures for washing and treating skin. Soap works because each molecule has one end that dissolves in water and another that dissolves in grease, so it can lift dirt and oil away when rinsed.","q":"How does soap help remove grease?"},{"id":"mix5-008","t":"Charles Tennant's bleaching powder and the Stalk","s":"Chemistry","tp":"Periodic table","sub":"Halogens","lv":["GCSE"],"who":"Charles Tennant, Claude Berthollet","f":0,"loc":"UK","rg":["Europe"],"yr":1799,"era":"1700s","tag":"Invention","x":"Linen and cotton were bleached by soaking in sour milk and laying them in fields in the sun for weeks. In 1785 Claude Berthollet found chlorine bleached cloth, but the gas was dangerous. In 1799 Charles Tennant in Glasgow patented bleaching powder, made by passing chlorine over slaked lime. It was cheap and safe to transport, transforming the textile industry. His St Rollox chemical works became one of the biggest in the world, and its 132 m chimney, 'Tennant's Stalk', was the tallest in the world when built in 1842.","q":"Why is bleaching powder easier to handle than chlorine gas?"},{"id":"mix5-009","t":"'Don't call it transmutation!'","s":"Chemistry","tp":"Atomic structure","sub":"Decay","lv":["GCSE","A-Level"],"who":"Ernest Rutherford, Frederick Soddy","f":0,"loc":"Canada","rg":["North & Central America"],"yr":1901,"era":"1900–1949","tag":"Discovery","x":"In 1901, at McGill University in Montreal, Ernest Rutherford and the young chemist Frederick Soddy were studying thorium. Soddy realised that radioactive thorium was turning itself into a different element. He later recalled shouting that this was transmutation, and Rutherford replying not to call it that, or they would be dismissed as alchemists. They called it 'transformation' instead. They showed that radioactive decay changes one element into another at a rate described by a half-life.","q":"How does alpha decay change the identity of an element?"},{"id":"mix5-010","t":"Cannizzaro's pamphlet at Karlsruhe","s":"Chemistry","tp":"Periodic table","sub":"Atomic masses","lv":["GCSE","A-Level"],"who":"Stanislao Cannizzaro, Dmitri Mendeleev, Lothar Meyer","f":0,"loc":"Germany / Italy","rg":["Europe"],"yr":1860,"era":"1800s","tag":"Discovery","x":"In 1860 about 140 chemists met in Karlsruhe for the first international chemistry conference, because they could not agree on atomic masses or even how to write formulae for water. The Italian chemist Stanislao Cannizzaro argued that Avogadro's forgotten hypothesis solved the problem. At the end, his friend handed out copies of Cannizzaro's pamphlet. Lothar Meyer said the scales fell from his eyes when he read it on the train home. Both Meyer and Mendeleev, who attended, went on to build periodic tables using the consistent atomic masses.","q":"Why did chemists need to agree on atomic masses?"},{"id":"mix5-011","t":"Elkington's electroplated silver","s":"Chemistry","tp":"Electrochemistry","sub":"Electroplating","lv":["GCSE"],"who":"George Elkington, Henry Elkington, John Wright","f":0,"loc":"UK","rg":["Europe"],"yr":1840,"era":"1800s","tag":"Invention","x":"In 1840 the Birmingham cousins George and Henry Elkington patented electroplating with silver, using a method suggested by the surgeon John Wright: a solution of silver in potassium cyanide. Passing a current through it deposited a thin, even coat of silver on a cheaper metal object connected as the cathode. 'Electroplated nickel silver' (EPNS) cutlery let ordinary families own shiny tableware. Their factory became one of Birmingham's largest employers.","q":"Which electrode should the object to be plated be connected to, and why?"},{"id":"mix5-012","t":"John Roebuck's lead chambers","s":"Chemistry","tp":"Chemical reactions","sub":"Industrial chemistry","lv":["GCSE","A-Level"],"who":"John Roebuck, Samuel Garbett","f":0,"loc":"UK","rg":["Europe"],"yr":1746,"era":"1700s","tag":"Invention","x":"Sulphuric acid was made in small glass jars, making it expensive. In 1746 the Birmingham doctor John Roebuck and his partner Samuel Garbett built chambers lined with lead sheets, which resist the acid, and burned sulphur with saltpetre inside them. They could make the acid in much larger quantities, and its price fell dramatically. Sulphuric acid became so central to industry that a country's production was once used as a measure of its economic strength.","q":"Why is lead suitable for lining acid chambers?"},{"id":"mix5-013","t":"Darwin's eight years of barnacles","s":"Biology","tp":"Classification","sub":"Classification","lv":["KS3","GCSE"],"who":"Charles Darwin","f":0,"loc":"UK","rg":["Europe"],"yr":1854,"era":"1800s","tag":"Eccentric","x":"Before publishing his theory of evolution, Charles Darwin spent eight years, from 1846 to 1854, studying barnacles. He dissected thousands under his microscope at Down House and found remarkable variation, including tiny 'dwarf males' living inside the shells of females. His children thought all fathers studied barnacles; one reportedly asked a friend where his father did his barnacles. The work gave Darwin a detailed understanding of variation and classification that strengthened On the Origin of Species.","q":"Why is variation within a species important for evolution?"},{"id":"mix5-014","t":"Jenner's cuckoo","s":"Biology","tp":"Behaviour","sub":"Instinct","lv":["KS3","GCSE"],"who":"Edward Jenner","f":0,"loc":"UK","rg":["Europe"],"yr":1788,"era":"1700s","tag":"Discovery","x":"Edward Jenner is famous for vaccination, but he was elected a Fellow of the Royal Society in 1789 for his study of cuckoos. Many believed the adult cuckoo removed the host bird's eggs. Jenner watched nests near Berkeley in Gloucestershire and saw that the newly hatched cuckoo chick, blind and naked, pushes the other eggs and chicks out of the nest using a hollow in its back. Some doubted him until photographs confirmed it in the 1920s.","q":"How does the cuckoo chick's behaviour help it survive?"},{"id":"mix5-015","t":"Emil von Behring's Christmas cure","s":"Biology","tp":"Disease and immunity","sub":"Antibodies","lv":["GCSE"],"who":"Emil von Behring, Kitasato Shibasaburō, Paul Ehrlich","f":0,"loc":"Germany / Japan","rg":["East Asia","Europe"],"yr":1891,"era":"1800s","tag":"Discovery","x":"Diphtheria killed thousands of children every year by blocking their airways. In 1890 Emil von Behring and Kitasato Shibasaburō in Berlin showed that serum from animals infected with weakened diphtheria or tetanus contained 'antitoxins' that neutralised the poison. According to a famous account, the first child was treated with diphtheria antitoxin over Christmas 1891 in Berlin. Paul Ehrlich helped standardise the doses. Behring won the first Nobel Prize in Physiology or Medicine in 1901; Kitasato was not included.","q":"How do antitoxins protect the body?"},{"id":"mix5-016","t":"Berthold's roosters","s":"Biology","tp":"Body systems","sub":"Hormones","lv":["GCSE","A-Level"],"who":"Arnold Berthold","f":0,"loc":"Germany","rg":["Europe"],"yr":1849,"era":"1800s","tag":"Discovery","x":"In 1849 Arnold Berthold in Göttingen removed the testes from young roosters. They grew up without the large red comb, crowing or fighting of normal roosters. In some, he transplanted a testis into the belly, where it had no nerve connections. These birds developed normally. He concluded the testes released something into the blood that controlled male features – the first experiment on what we now call hormones. The hormone, testosterone, was isolated in 1935.","q":"Why did the transplanted testis still work without nerves?"},{"id":"mix5-017","t":"Butenandt and half a million silk moths","s":"Biology","tp":"Behaviour","sub":"Pheromones","lv":["GCSE","A-Level"],"who":"Adolf Butenandt","f":0,"loc":"Germany","rg":["Europe"],"yr":1959,"era":"1950–1999","tag":"Discovery","x":"Male silk moths can detect females from far away. Adolf Butenandt in Germany spent around 20 years trying to identify the chemical signal. His team removed glands from about half a million female silk moths, and in 1959 isolated a few milligrams of the attractant, which he named bombykol. It was the first pheromone ever identified. The word 'pheromone' was coined the same year by Peter Karlson and Martin Lüscher. Pheromone traps are now used to monitor and control insect pests without spraying pesticides.","q":"How can pheromones control pests more safely than insecticides?"},{"id":"mix5-018","t":"Garner, Allard and the tobacco that wouldn't flower","s":"Biology","tp":"Plants","sub":"Photoperiodism","lv":["GCSE","A-Level"],"who":"Wightman Garner, Harry Allard","f":0,"loc":"USA","rg":["North & Central America"],"yr":1920,"era":"1900–1949","tag":"Discovery","x":"A new variety of tobacco called Maryland Mammoth grew huge but would not flower in summer, so no seed could be collected. In greenhouses in the winter, it flowered. In 1920 the US Department of Agriculture scientists Wightman Garner and Harry Allard moved plants into a dark shed each afternoon to shorten their days, and they flowered. Day length, not temperature, triggered flowering – photoperiodism. Plants were later shown to measure the length of the night. Growers now control the flowering of poinsettias and chrysanthemums this way.","q":"How could growers use day length to make plants flower at Christmas?"},{"id":"mix5-019","t":"Darwin plays the bassoon to worms","s":"Biology","tp":"Ecology","sub":"Decomposers","lv":["KS3","GCSE"],"who":"Charles Darwin, Francis Darwin","f":0,"loc":"UK","rg":["Europe"],"yr":1881,"era":"1800s","tag":"Eccentric","x":"Charles Darwin's last book, in 1881, was about earthworms. He kept worms in pots in his study at Down House and tested their senses: his son Francis played the bassoon to them, Darwin shouted at them and played the piano, but they ignored the noise – though they felt vibrations when the pots were placed on the piano. He measured how worms bury objects and showed they turn over huge amounts of soil, slowly burying ancient ruins. The book sold better than On the Origin of Species at first.","q":"Why are earthworms important for soil?"},{"id":"mix5-020","t":"Mortensen rings the starlings","s":"Biology","tp":"Behaviour","sub":"Migration","lv":["KS3","GCSE"],"who":"Hans Christian Cornelius Mortensen","f":0,"loc":"Denmark","rg":["Europe"],"yr":1899,"era":"1800s","tag":"Discovery","x":"In 1899 the Danish schoolteacher Hans Christian Mortensen fitted numbered aluminium rings to the legs of 164 starlings in Viborg, each with his address. When ringed birds were found and reported, he learned where and how far they travelled. He went on to ring storks, ducks and other birds. Bird ringing spread worldwide and has revealed migration routes, lifespans and population changes. Today tiny GPS trackers add even more detail.","q":"Why is it useful for ringed birds to be reported by members of the public?"},{"id":"mix5-021","t":"Arthur Tansley coins 'ecosystem'","s":"Biology","tp":"Ecology","sub":"Ecosystems","lv":["KS3","GCSE"],"who":"Arthur Tansley, Arthur Roy Clapham","f":0,"loc":"UK","rg":["Europe"],"yr":1935,"era":"1900–1949","tag":"Discovery","x":"The British ecologist Arthur Tansley studied how plant communities, such as chalk grassland and woodland, change over time. In 1935 he published a paper using the word 'ecosystem', suggested by his young colleague Arthur Roy Clapham, to describe the living organisms in an area together with the physical environment they interact with. Tansley also co-founded the British Ecological Society and campaigned for nature reserves, helping create the Nature Conservancy in 1949.","q":"What are the living and non-living parts of an ecosystem?"},{"id":"mix5-022","t":"Wildlife in the Chernobyl exclusion zone","s":"Biology","tp":"Ecology","sub":"Human impact","lv":["GCSE"],"who":"","f":0,"loc":"Ukraine / Belarus","rg":["Europe"],"yr":2015,"era":"2000 onwards","tag":"Modern research","x":"After the 1986 Chernobyl disaster, about 350,000 people were moved out of a zone around the power plant. Surveys in the following decades found the zone full of wildlife: elk, deer, wild boar, wolves, lynx, bears and endangered Przewalski's horses. A 2015 study found mammal numbers similar to nature reserves nearby, and wolves around seven times more common. Some studies find harmful effects of radiation on insects, birds and plants, but the absence of people seems to matter more for large animals.","q":"Why might wildlife thrive despite radiation?"},{"id":"mix5-023","t":"Eleanor Maguire and the taxi drivers' brains","s":"Biology","tp":"Nerves","sub":"The brain","lv":["GCSE","A-Level"],"who":"Eleanor Maguire","f":1,"loc":"UK / Ireland","rg":["Europe"],"yr":2000,"era":"2000 onwards","tag":"Modern research","x":"To get a licence, London taxi drivers must learn 'the Knowledge' – around 25,000 streets – which takes three to four years. In 2000 the Irish neuroscientist Eleanor Maguire, at University College London, scanned taxi drivers' brains and found the back of the hippocampus, important for spatial memory, was larger than in other people, and larger the longer they had driven. A later study followed trainees and found it grew in those who passed. The adult brain can change with learning.","q":"What does this suggest about learning and the brain?"},{"id":"mix5-024","t":"Patrick Manson's gardener and the mosquito","s":"Biology","tp":"Disease and immunity","sub":"Vectors","lv":["GCSE"],"who":"Patrick Manson, Hinlo","f":0,"loc":"China (Taiwan / Xiamen)","rg":["East Asia"],"yr":1877,"era":"1800s","tag":"Discovery","x":"Working as a doctor in Amoy (now Xiamen), China, the Scottish physician Patrick Manson studied elephantiasis, caused by tiny worms in the blood. In 1877 he let mosquitoes bite his gardener, Hinlo, who was infected, and then dissected them. He found the worms developing inside the mosquitoes. It was the first proof that an insect could carry a human disease. Manson later encouraged Ronald Ross to investigate mosquitoes and malaria, and founded the London School of Tropical Medicine.","q":"Why is it important to know an insect carries a disease?"},{"id":"sym-001","t":"p for momentum: nobody really knows","s":"Physics","tp":"Forces and motion","sub":"Momentum","lv":["GCSE","A-Level"],"who":"Leonhard Euler, William Rowan Hamilton","f":0,"loc":"Switzerland / Ireland","rg":["Europe"],"yr":1835,"era":"1800s","tag":"Symbol","x":"There is no 'p' in momentum, and no one has found a document where someone explains choosing it. You will often read that it comes from Latin words such as petere (to go towards), pellere (to push) or impetus, but these are guesses, not evidence. Euler, writing in Latin in the 1730s, used p for force (potentia). What is certain is that p for momentum, paired with q for position, became standard in the 'Hamiltonian' mechanics that grew from the Irish mathematician William Rowan Hamilton's work in the 1830s, and passed from there into quantum mechanics.","q":"Why might it be confusing to use m for momentum?","sym":"p"},{"id":"sym-002","t":"Q for charge: a 'quantity of electricity'","s":"Physics","tp":"Electricity","sub":"Charge","lv":["GCSE","A-Level"],"who":"Benjamin Franklin, Michael Faraday, James Clerk Maxwell","f":0,"loc":"UK / USA","rg":["North & Central America","Europe"],"yr":1873,"era":"1800s","tag":"Symbol","x":"For more than a century, scientists did not talk about 'charge' at all. Franklin, Faraday, Maxwell and J. J. Thomson wrote about a 'quantity of electricity', imagining electricity as a fluid that a body could have more or less of. The usual explanation of Q is that it stands for that quantity. Nobody seems to have recorded choosing the letter, so it is a sensible explanation rather than a proven one. It also avoided E and C, which were already busy. The unit, the coulomb, honours Charles-Augustin de Coulomb.","q":"Why did early scientists think of electricity as a fluid?","sym":"Q"},{"id":"sym-003","t":"c for the speed of light: 'constant' or 'celeritas'?","s":"Physics","tp":"Waves","sub":"Speed of light","lv":["GCSE","A-Level"],"who":"Wilhelm Weber, Rudolf Kohlrausch, Paul Drude, Albert Einstein","f":0,"loc":"Germany","rg":["Europe"],"yr":1907,"era":"1900–1949","tag":"Symbol","x":"Many books say c comes from celeritas, Latin for swiftness. The real story is messier. In 1856 Wilhelm Weber and Rudolf Kohlrausch used c for a constant in electrodynamics that later turned out to be √2 times the speed of light. Maxwell and most 19th-century physicists used V for the speed of light, and so did Einstein in his famous 1905 paper. In 1894 Paul Drude used c for the speed of electromagnetic waves, and by 1907, when Einstein switched to c, it had become the standard. So c may have meant 'constant' first and only later been read as celeritas.","q":"Why is the speed of light in a vacuum treated as a universal constant?","sym":"c"},{"id":"sym-004","t":"B, E and H: Maxwell's alphabet","s":"Physics","tp":"Magnetism","sub":"Magnetic flux density","lv":["A-Level"],"who":"James Clerk Maxwell","f":0,"loc":"UK","rg":["Europe"],"yr":1873,"era":"1800s","tag":"Symbol","x":"Why is magnetic flux density B, of all letters? In his 1873 Treatise on Electricity and Magnetism, James Clerk Maxwell needed labels for the new vector quantities he was using, so he simply went through the alphabet: A for vector potential, B for magnetic induction, C for current, D for electric displacement, E for 'electromotive intensity' (our electric field), F for mechanical force and H for 'magnetic force'. Most of his labels have survived for 150 years, which is why B has nothing to do with the word magnetism.","q":"What is the difference between a scalar and a vector quantity?","sym":"B"},{"id":"sym-005","t":"h: Planck's 'helping quantity'","s":"Physics","tp":"Quantum","sub":"Photons","lv":["A-Level"],"who":"Max Planck, Paul Dirac","f":0,"loc":"Germany / UK","rg":["Europe"],"yr":1900,"era":"1900–1949","tag":"Symbol","x":"In 1900 Max Planck found a formula that matched the measured spectrum of black-body radiation, but only if energy came in packets of size hf. He labelled the new constant h, thought to stand for Hilfsgrösse, German for 'auxiliary' or helping quantity – a mathematical trick he expected to remove later. It turned out to be the foundation of quantum physics. The crossed h, ħ ('h-bar', h divided by 2π), was popularised by the British physicist Paul Dirac in the 1920s. A popular story says h stands for 'Hilfe!' (help!), which is a joke, not history.","q":"Calculate the energy of a photon of frequency 5 × 10¹⁴ Hz.","sym":"h"},{"id":"sym-006","t":"The constant Boltzmann never wrote","s":"Physics","tp":"Matter","sub":"Kinetic theory","lv":["A-Level"],"who":"Ludwig Boltzmann, Max Planck","f":0,"loc":"Austria / Germany","rg":["Europe"],"yr":1900,"era":"1900–1949","tag":"Symbol","x":"Ludwig Boltzmann linked the energy of molecules to temperature and entropy to the number of ways particles can be arranged, but he never gave the constant a symbol or calculated its value. Max Planck did that in his 1900 work on radiation, writing it as k and calculating it from experiments, at the same time as he introduced h. It was soon named after Boltzmann. The equation S = k log W is now carved on Boltzmann's tombstone in Vienna, even though he never wrote it in that form.","q":"What does the Boltzmann constant link together?","sym":"k"},{"id":"sym-007","t":"G: a constant nobody used for 200 years","s":"Physics","tp":"Space","sub":"Gravitational fields","lv":["A-Level"],"who":"Henry Cavendish, Charles Vernon Boys, Alfred Cornu","f":0,"loc":"UK / France","rg":["Europe"],"yr":1894,"era":"1800s","tag":"Symbol","x":"Newton never wrote G. For about 200 years, gravity calculations were done with ratios, and Henry Cavendish's famous 1798 experiment was described as 'weighing the Earth' – finding its mean density. In 1873 the French physicists Alfred Cornu and Jean-Baptistin Baille mentioned a 'constant of attraction', and in the 1890s Charles Vernon Boys, who measured it using quartz fibres he made with a crossbow, argued strongly that this constant, G, was the real goal of such experiments. The modern way of writing Newton's law with G dates from then.","q":"Why is G so hard to measure accurately in a laboratory?","sym":"G"},{"id":"sym-008","t":"Ω for the ohm, and the mho","s":"Physics","tp":"Electricity","sub":"Resistance","lv":["GCSE","A-Level"],"who":"William Preece, Lord Kelvin","f":0,"loc":"UK","rg":["Europe"],"yr":1867,"era":"1800s","tag":"Symbol","x":"The ohm was agreed as the unit of resistance in the 1860s, when engineers needed to test telegraph cables. A capital O would have been mistaken for zero, so the Greek capital omega, Ω, which sounds like 'ohm', was used instead. The choice is usually credited to the British telegraph engineer William Preece in 1867. The unit of conductance was once the mho – ohm spelled backwards, a joke usually credited to Lord Kelvin – with the symbol ℧, an upside-down omega. It was replaced by the siemens, S, in 1971.","q":"Why must symbols for units never be confused with numbers?","sym":"Ω"},{"id":"sym-009","t":"L for inductance: Lenz, perhaps","s":"Physics","tp":"Magnetism","sub":"Inductance","lv":["A-Level"],"who":"Heinrich Lenz, Oliver Heaviside","f":0,"loc":"Russia (Estonia) / UK","rg":["Europe"],"yr":1884,"era":"1800s","tag":"Symbol","x":"The word 'inductance' was coined in the 1880s by the self-taught British engineer Oliver Heaviside as a shorter name for the 'coefficient of self-induction'. Its symbol, L, is very often said to honour Heinrich (Emil) Lenz, the Baltic German physicist whose 1834 law tells you the direction of an induced current – the minus sign in Faraday's law. It is a nice idea, but clear evidence of anyone choosing L for that reason is hard to find. Lenz also discovered the heating effect of a current independently of Joule.","q":"What does the minus sign in Faraday's law represent?","sym":"L"},{"id":"sym-010","t":"Young's modulus wasn't Young's","s":"Physics","tp":"Matter","sub":"Materials","lv":["A-Level"],"who":"Thomas Young, Leonhard Euler, Giordano Riccati","f":0,"loc":"UK / Switzerland / Italy","rg":["Europe"],"yr":1807,"era":"1800s","tag":"Symbol","x":"The stiffness of a material, stress divided by strain, is named after Thomas Young, who described it in 1807. But Leonhard Euler had used the idea in 1727, and the Italian Giordano Riccati did experiments with it in 1782. Young's own version was a confusing 'height of the modulus', not the quantity we use today. The symbol E most likely comes from 'elasticity' – in German it is the Elastizitätsmodul. Young was a remarkable polymath, but this is one thing that was named after the wrong person.","q":"Why is Young's modulus the gradient of the straight part of a stress–strain graph?","sym":"E"},{"id":"sym-011","t":"Clausius gives us U and Q","s":"Physics","tp":"Energy","sub":"Thermodynamics","lv":["A-Level"],"who":"Rudolf Clausius","f":0,"loc":"Germany","rg":["Europe"],"yr":1850,"era":"1800s","tag":"Symbol","x":"The first law of thermodynamics is written ΔU = Q + W (or Q = ΔU + W, depending on the sign convention you are taught). Much of this notation goes back to Rudolf Clausius in the 1850s. He used Q for quantities of heat and U for a function he described as the 'heat and work content' of a body – what we now call internal energy. He never explained why he chose U. Different textbooks and exam boards still disagree about whether W is work done on or by the gas, which is why the sign in the equation varies.","q":"What happens to the internal energy of a gas when it is compressed quickly?","sym":"U"},{"id":"sym-012","t":"Why there is no degree sign in K","s":"Physics","tp":"Matter","sub":"Temperature","lv":["GCSE","A-Level"],"who":"","f":0,"loc":"France","rg":["Europe"],"yr":1967,"era":"1950–1999","tag":"Symbol","x":"Until 1967 the absolute temperature scale was measured in 'degrees Kelvin', written °K. In 1967 the General Conference on Weights and Measures in Paris decided the kelvin was a unit like the metre or the second, not a step on a scale. From then on it was simply the kelvin, symbol K, with no degree sign and no capital letter when written in full. So 273 K is read as '273 kelvin', never '273 degrees kelvin'. The degree sign stayed for Celsius.","q":"Why is it meaningful to say 200 K is twice as hot as 100 K, but not that 20 °C is twice 10 °C?","sym":"K"},{"id":"sym-013","t":"W for weak, Z for the last one","s":"Physics","tp":"Particle physics","sub":"Exchange particles","lv":["A-Level"],"who":"Steven Weinberg, Carlo Rubbia, Simon van der Meer","f":0,"loc":"USA / Switzerland","rg":["North & Central America","Europe"],"yr":1983,"era":"1950–1999","tag":"Symbol","x":"The W bosons, which carry the weak force and change one type of quark into another in beta decay, are named after the weak force. In the 1960s, the theory of Sheldon Glashow, Abdus Salam and Steven Weinberg also needed a neutral partner. Weinberg called it the Z, later explaining that it was the last particle the model needed; it is also neutral, with zero charge. Both were discovered at CERN in 1983, including by a team led by Carlo Rubbia, using a technique for cooling antiprotons devised by Simon van der Meer.","q":"Draw the Feynman diagram for beta-minus decay using a W boson.","sym":"W Z"},{"id":"sym-014","t":"Up, down, strange, charm, bottom, top","s":"Physics","tp":"Particle physics","sub":"Quarks","lv":["A-Level"],"who":"Murray Gell-Mann, Sheldon Glashow, James Bjorken, Haim Harari","f":0,"loc":"USA / Israel","rg":["Middle East","North & Central America"],"yr":1975,"era":"1950–1999","tag":"Symbol","x":"The six quark 'flavours' have names chosen half seriously. Up and down came from a quantity called isospin. Strange came from 1950s 'strange particles' that lived oddly long. In 1964 Sheldon Glashow and James Bjorken proposed a fourth quark and called it charm, because it charmed away a problem in the theory. In 1975 the Israeli physicist Haim Harari named the last two top and bottom; some physicists preferred 'truth' and 'beauty', and 'beauty' is still used for some particles. Quark symbols are just their first letters: u, d, s, c, b, t.","q":"What is the quark structure of a proton?","sym":"u d s"},{"id":"sym-015","t":"Hadron, lepton, baryon, meson: naming the particle zoo","s":"Physics","tp":"Particle physics","sub":"Classification","lv":["A-Level"],"who":"Lev Okun, Abraham Pais, Léon Rosenfeld, Homi Bhabha","f":0,"loc":"Russia / Netherlands / Belgium / India","rg":["South Asia","Europe"],"yr":1962,"era":"1950–1999","tag":"Symbol","x":"The names for particle families were all made from Greek words for size. Lepton (light) was suggested by Léon Rosenfeld in 1948. Baryon (heavy) came from Abraham Pais in 1953. Meson (middle) grew out of 'mesotron', a name for particles of medium mass; the shorter 'meson' was suggested in 1939, and the Indian physicist Homi Bhabha argued for it. Hadron (bulky or strong) was coined by the Soviet physicist Lev Okun at a conference in 1962. The masses no longer quite match the names: the tau lepton is heavier than a proton.","q":"Why is a pion classed as a meson but a proton as a baryon?","sym":"π⁺"},{"id":"sym-016","t":"Alpha and beta: Rutherford's foils","s":"Physics","tp":"Atoms and radioactivity","sub":"Types of radiation","lv":["GCSE","A-Level"],"who":"Ernest Rutherford","f":0,"loc":"Canada / UK","rg":["North & Central America","Europe"],"yr":1899,"era":"1800s","tag":"Symbol","x":"In work begun in Cambridge and published in 1899, Ernest Rutherford covered uranium with thin layers of aluminium foil and measured the radiation getting through. A first type was stopped by just a few layers; a second type got through many more. Not knowing what they were, he simply named them after the first two letters of the Greek alphabet, alpha and beta. A third, even more penetrating type, found by Paul Villard in 1900, became gamma. Only later was alpha shown to be helium nuclei and beta to be fast electrons.","q":"How could you use absorbers to identify the type of radiation from a source?","sym":"α β"},{"id":"sym-017","t":"e: the number Euler didn't name after himself","s":"Physics","tp":"Atoms and radioactivity","sub":"Exponential decay","lv":["A-Level"],"who":"Leonhard Euler, Jacob Bernoulli","f":0,"loc":"Switzerland / Russia","rg":["Europe"],"yr":1736,"era":"1700s","tag":"Symbol","x":"Radioactive decay, capacitor discharge and damped oscillations all use the number e, about 2.718. Jacob Bernoulli met it in 1683 while studying compound interest. Leonhard Euler first used the letter e for it in a manuscript of about 1727, and in print in 1736. Euler was famously modest, and most historians doubt he chose e for 'Euler'; it may simply have been the next unused vowel, or stood for 'exponential'. Euler also popularised π, i and f(x).","q":"Why does e appear in any process where the rate of change is proportional to the amount present?","sym":"e"},{"id":"sym-018","t":"Parsec: a word made from two others","s":"Physics","tp":"Space","sub":"Distances","lv":["A-Level"],"who":"Herbert Hall Turner, Frank Dyson","f":0,"loc":"UK","rg":["Europe"],"yr":1913,"era":"1900–1949","tag":"Symbol","x":"Astronomers measured the distances to nearby stars from their parallax: the tiny shift in position seen from opposite sides of Earth's orbit. Distances were awkwardly described as the distance at which a star would have a parallax of one second of arc. In 1913 the British astronomer Herbert Hall Turner suggested a name for this: the parsec, from parallax and second. It was published in a paper by Frank Dyson. One parsec is about 3.26 light-years.","q":"Why does a larger parallax angle mean a closer star?","sym":"pc"},{"id":"sym-019","t":"The Sun's circled dot","s":"Physics","tp":"Space","sub":"Stars","lv":["A-Level"],"who":"","f":0,"loc":"Egypt / Greece","rg":["Africa","Europe"],"yr":-1000,"era":"Ancient","tag":"Symbol","x":"Astronomers write the mass of the Sun as M☉ and the radius of the Earth as R⊕. These symbols are very old. The circle with a dot was used for the Sun in ancient Greek manuscripts and has a close relative among ancient Egyptian hieroglyphs. Astronomers and alchemists also used symbols for planets, which are where the biological ♂ and ♀ come from. The International Astronomical Union still uses the Sun symbol, though it discourages most other planetary symbols.","q":"Why is it useful to give stellar masses in units of solar masses?","sym":"☉"},{"id":"sym-020","t":"The Plimsoll line in your chemistry","s":"Chemistry","tp":"Rates and equilibrium","sub":"Standard conditions","lv":["A-Level"],"who":"Samuel Plimsoll","f":0,"loc":"UK","rg":["Europe"],"yr":1876,"era":"1800s","tag":"Symbol","x":"The little symbol on ΔH⦵, ΔS⦵ and E⦵ means 'standard conditions'. It is often called the Plimsoll symbol because it looks like the Plimsoll line, the load mark painted on the side of ships. The MP Samuel Plimsoll campaigned against overloaded 'coffin ships' that sank and drowned sailors, and from 1876 British law required the mark. Chemists adopted a similar shape to show a reference level. IUPAC recommends it, but many textbooks use a simple degree sign, ° instead. Plimsoll shoes are named after the same line.","q":"Why do chemists need agreed standard conditions?","sym":"⊖"},{"id":"sym-021","t":"H is for heat content: Onnes names enthalpy","s":"Chemistry","tp":"Rates and equilibrium","sub":"Energetics","lv":["GCSE","A-Level"],"who":"Heike Kamerlingh Onnes, Alfred Porter, Josiah Willard Gibbs","f":0,"loc":"Netherlands / UK","rg":["Europe"],"yr":1909,"era":"1900–1949","tag":"Symbol","x":"Gibbs called the quantity U + pV the 'heat function for constant pressure', and others called it 'heat content' – hence the symbol H. The word 'enthalpy', from a Greek word for heating, was coined by Heike Kamerlingh Onnes in Leiden, the physicist who first liquefied helium. It reached English speakers through Alfred Porter in 1922, but was not widely used until the 1930s. Many older textbooks wrongly credit Clausius. The Gibbs free energy, G, is named after the American Josiah Willard Gibbs.","q":"What does a negative ΔH tell you about a reaction?","sym":"H"},{"id":"sym-022","t":"S for entropy: no one knows why","s":"Chemistry","tp":"Rates and equilibrium","sub":"Entropy","lv":["A-Level"],"who":"Rudolf Clausius","f":0,"loc":"Germany","rg":["Europe"],"yr":1865,"era":"1800s","tag":"Symbol","x":"In 1865 Rudolf Clausius named entropy, from a Greek word for transformation, deliberately making it sound like 'energy'. He had already been using the letter S for it, but never said why. Popular books often claim S honours Sadi Carnot, the French engineer whose work Clausius built on, but there is no evidence for this; it may have been an arbitrary letter. Gibbs and Planck used different symbols, but Clausius's S won. He summed up thermodynamics as: the energy of the universe is constant; the entropy of the universe tends to a maximum.","q":"Why does a gas have a higher entropy than a solid of the same substance?","sym":"S"},{"id":"sym-023","t":"pH: what does the p stand for?","s":"Chemistry","tp":"Acids and alkalis","sub":"pH","lv":["GCSE","A-Level"],"who":"Søren Sørensen","f":0,"loc":"Denmark","rg":["Europe"],"yr":1909,"era":"1900–1949","tag":"Symbol","x":"Søren Sørensen introduced pH in 1909 at the Carlsberg Laboratory in Copenhagen, writing it as pH with the H as a subscript. He never clearly explained the p. The most popular explanation is 'power': puissance in French, Potenz in German or potens in Danish, since he wrote concentrations as 10 to the power of −p. Other suggestions include 'potential', and that he simply labelled two solutions p and q in his calculations, as mathematicians often do. Today, a p in front of anything means minus log, as in pKa.","q":"If the pH falls by 2, how does the hydrogen ion concentration change?","sym":"pH"},{"id":"sym-024","t":"Ostwald's 'Mol'","s":"Chemistry","tp":"Atomic structure","sub":"Amount of substance","lv":["GCSE","A-Level"],"who":"Wilhelm Ostwald","f":0,"loc":"Germany","rg":["Europe"],"yr":1894,"era":"1800s","tag":"Symbol","x":"The word 'mole' was introduced around 1894 by the German chemist Wilhelm Ostwald, as 'Mol', short for Molekül, meaning the mass in grams numerically equal to a substance's molecular weight. Ostwald himself doubted that atoms and molecules were real for many years, and only accepted them after Einstein's and Perrin's work on Brownian motion. The mole became an SI base unit only in 1971, and since 2019 it has been defined as exactly 6.02214076 × 10²³ particles.","q":"How many moles are in 36 g of water?","sym":"mol"},{"id":"sym-025","t":"Avogadro's number: named by Perrin, first estimated by Loschmidt","s":"Chemistry","tp":"Atomic structure","sub":"Avogadro constant","lv":["GCSE","A-Level"],"who":"Jean Perrin, Josef Loschmidt, Amedeo Avogadro","f":0,"loc":"France / Austria / Italy","rg":["Europe"],"yr":1909,"era":"1900–1949","tag":"Symbol","x":"Avogadro never knew how many particles were in a mole. The first estimate of the size of molecules came from the Austrian Josef Loschmidt in 1865, which is why the constant was sometimes written L, and why some still use L today. In 1909 the French physicist Jean Perrin, measuring how tiny particles jiggle in water, proposed calling it 'Avogadro's number' in honour of the man whose 1811 hypothesis it rested on. Perrin's measurements convinced sceptics that atoms were real, and he won the 1926 Nobel Prize.","q":"Why is the Avogadro constant such a huge number?","sym":"Nᴀ"},{"id":"sym-026","t":"R, the gas constant: a mystery letter","s":"Chemistry","tp":"Particles","sub":"Ideal gases","lv":["A-Level"],"who":"Émile Clapeyron, August Horstmann, Dmitri Mendeleev, Victor Regnault","f":0,"loc":"France / Germany / Russia","rg":["Europe"],"yr":1874,"era":"1800s","tag":"Symbol","x":"You may hear that R honours Victor Regnault, the French scientist whose careful gas measurements were used to calculate it. It is a nice idea, but nobody has found evidence for it. R was first used by Émile Clapeyron in 1834 for a constant that was different for each gas, and he never explained the letter – it may have been arbitrary, or stood for 'ratio'. The universal gas constant per mole was introduced independently by August Horstmann in 1873 and Dmitri Mendeleev in 1874; Mendeleev calculated it to within 0.3% of today's value.","q":"How is R related to the Boltzmann constant and the Avogadro constant?","sym":"R"},{"id":"sym-027","t":"Z and A: German letters in the nucleus","s":"Chemistry","tp":"Atomic structure","sub":"Proton and nucleon number","lv":["GCSE","A-Level"],"who":"Henry Moseley, Arnold Sommerfeld, Niels Bohr","f":0,"loc":"Germany / UK","rg":["Europe"],"yr":1920,"era":"1900–1949","tag":"Symbol","x":"Z for atomic (proton) number makes little sense in English but plenty in German: it comes from Zahl, 'number', as in Atomzahl. Originally it was just an element's place in the periodic table. After Henry Moseley showed in 1913 that it matched the charge of the nucleus, it became a physical quantity. Much early atomic physics, including Arnold Sommerfeld's work, was published in German, and by the late 1920s Z was standard. A, for mass number, is usually linked to the German Atomgewicht, 'atomic weight'. Using N would have clashed with nitrogen.","q":"Write the symbol for an isotope of carbon with 8 neutrons.","sym":"Z A"},{"id":"sym-028","t":"Entgegen and zusammen; rectus and sinister","s":"Chemistry","tp":"Organic chemistry","sub":"Stereoisomerism","lv":["A-Level"],"who":"Robert Cahn, Christopher Ingold, Vladimir Prelog, John Blackwood","f":0,"loc":"UK / Switzerland / USA","rg":["North & Central America","Europe"],"yr":1968,"era":"1950–1999","tag":"Symbol","x":"Cis and trans, Latin for 'on this side' and 'across', work for simple molecules but fail when all four groups on a double bond are different. In 1956 Robert Cahn, Christopher Ingold and Vladimir Prelog published priority rules for ranking groups, using R (Latin rectus, right) and S (sinister, left) for chiral centres. In 1968 the same rules were applied to double bonds, using German: Z for zusammen, 'together', when the higher-priority groups are on the same side, and E for entgegen, 'opposite'. A tip many students use: Z = 'zame zide'.","q":"Name the E/Z isomers of but-2-ene.","sym":"E/Z"},{"id":"sym-029","t":"The first curly arrows","s":"Chemistry","tp":"Organic chemistry","sub":"Reaction mechanisms","lv":["A-Level"],"who":"Robert Robinson, William Kermack, Arthur Lapworth","f":0,"loc":"UK","rg":["Europe"],"yr":1922,"era":"1900–1949","tag":"Symbol","x":"Curly arrows showing electron pairs moving are a century old. In 1922 Robert Robinson, working with the Scottish chemist William Kermack, published a paper using them to explain reactions of conjugated molecules; the same year Arthur Lapworth used similar arrows. Robinson and Kermack seem never to have worked in the same laboratory. Two years later Kermack was blinded when caustic alkali exploded in his face; he went on to become a pioneer of mathematical models of epidemics. Robinson won the 1947 Nobel Prize.","q":"What does a curly arrow with a single barb on its head represent?","sym":"↷"},{"id":"sym-030","t":"Robinson's circle in the hexagon","s":"Chemistry","tp":"Organic chemistry","sub":"Benzene","lv":["A-Level"],"who":"Robert Robinson, Kathleen Lonsdale","f":1,"loc":"UK","rg":["Europe"],"yr":1925,"era":"1900–1949","tag":"Symbol","x":"Kekulé drew benzene with alternating single and double bonds, which could not explain why benzene doesn't react like an alkene. Robert Robinson, at St Andrews in the 1920s, proposed drawing a circle inside the hexagon to represent an 'aromatic sextet' of six electrons shared around the whole ring. In 1929 Kathleen Lonsdale used X-ray crystallography to show the benzene ring was flat with equal sides, supporting the idea. Both ways of drawing are still used: the circle shows delocalisation, and Kekulé's version helps with curly arrows.","q":"What evidence shows benzene doesn't have alternating single and double bonds?","sym":"⌬"},{"id":"sym-031","t":"δ+ and δ−: the Ingolds' footnote","s":"Chemistry","tp":"Bonding","sub":"Polarity","lv":["GCSE","A-Level"],"who":"Christopher Ingold, Hilda Ingold","f":1,"loc":"UK","rg":["Europe"],"yr":1926,"era":"1900–1949","tag":"Symbol","x":"After G. N. Lewis proposed the shared electron-pair bond in 1916, chemists realised electrons might be shared unequally, leaving small partial charges on atoms. The symbols δ+ and δ−, using the Greek letter delta for a small amount, were introduced by Christopher Ingold and his wife Edith Hilda Ingold, also a chemist, in a footnote to a 1926 paper on reactions of benzene compounds. Christopher Ingold later coined the terms nucleophile and electrophile. Hilda Ingold, née Usherwood, published many papers with her husband.","q":"Which atom in a C–Cl bond carries δ−, and why?","sym":"δ+"},{"id":"sym-032","t":"Van 't Hoff's double arrow","s":"Chemistry","tp":"Rates and equilibrium","sub":"Equilibrium","lv":["GCSE","A-Level"],"who":"Jacobus van 't Hoff, Antoine Lavoisier","f":0,"loc":"Netherlands / France","rg":["Europe"],"yr":1884,"era":"1800s","tag":"Symbol","x":"Early chemists wrote reactions like maths, with an equals sign, a habit that goes back to Lavoisier. But reactions have a direction, and some go both ways. In the 1880s the Dutch chemist Jacobus van 't Hoff, studying reaction rates and equilibria, is usually credited with replacing the equals sign with a pair of opposing arrows to show a reversible reaction. The single arrow came into general use afterwards. The modern symbol uses two half-arrows, ⇌.","q":"What is the difference between a reversible reaction and a dynamic equilibrium?","sym":"⇌"},{"id":"sym-033","t":"SN1 and SN2: Hughes, Ingold and a Welsh connection","s":"Chemistry","tp":"Organic chemistry","sub":"Nucleophilic substitution","lv":["A-Level"],"who":"Edward Hughes, Christopher Ingold","f":0,"loc":"UK / Wales","rg":["Europe"],"yr":1935,"era":"1900–1949","tag":"Symbol","x":"In SN2, S means substitution, N means nucleophilic, and 2 means two species take part in the rate-determining step; in SN1 only one does. The labels were devised by Christopher Ingold and Edward David Hughes, who worked together for over 30 years at University College London. Hughes was Welsh, born near Criccieth, and had studied at Bangor before joining Ingold. Their careful measurements of reaction rates in the 1930s showed how the structure of a haloalkane decides which mechanism it follows.","q":"Why do tertiary haloalkanes tend to react by SN1?","sym":"SN2"},{"id":"sym-034","t":"The ancient words in Na, K and Sb","s":"Chemistry","tp":"Periodic table","sub":"Element symbols","lv":["GCSE","A-Level"],"who":"Jöns Jacob Berzelius","f":0,"loc":"Egypt / Middle East / Sweden","rg":["Africa","Europe"],"yr":1814,"era":"1800s","tag":"Symbol","x":"Some element symbols hide words thousands of years old. Na comes from natrium, from natron, a mineral salt from Egyptian lake beds used to mummify bodies. K comes from kalium, related to the Arabic al-qali, 'plant ashes', which also gave us the word alkali. Sb is from stibium, the Latin name for a mineral used for black eye make-up (kohl) in ancient Egypt and the Middle East. Hg is from hydrargyrum, 'liquid silver'. Berzelius chose Latin names so that symbols would work in every language.","q":"Why is the word alkali linked to plant ashes?","sym":"Na K"},{"id":"sym-035","t":"D: the only isotope with its own symbol","s":"Chemistry","tp":"Atomic structure","sub":"Isotopes","lv":["GCSE","A-Level"],"who":"Harold Urey, Ferdinand Brickwedde, George Murphy","f":0,"loc":"USA","rg":["North & Central America"],"yr":1931,"era":"1900–1949","tag":"Symbol","x":"In 1931 Harold Urey and colleagues slowly evaporated litres of liquid hydrogen to concentrate any heavier atoms left behind, and detected hydrogen with mass 2 in its spectrum. Urey named it deuterium, from the Greek for 'second', and it is the only isotope regularly given its own chemical symbol, D (with T for tritium). Heavy water, D₂O, became important for nuclear reactors and was the target of wartime sabotage in Norway. Urey won the 1934 Nobel Prize.","q":"Why does deuterium have almost the same chemistry as ordinary hydrogen?","sym":"D"},{"id":"sym-036","t":"Linnaeus borrows the planets","s":"Biology","tp":"Genetics","sub":"Plant reproduction","lv":["KS3","GCSE"],"who":"Carl Linnaeus","f":0,"loc":"Sweden","rg":["Europe"],"yr":1751,"era":"1700s","tag":"Symbol","x":"The symbols ♂ and ♀ were ancient shorthand for the planets Mars and Venus, which alchemists also used for iron and copper. In 1751 the Swedish botanist Carl Linnaeus began using them to mark male flowers (stamens only) and female flowers (pistil only), and Mercury's symbol for flowers with both. Biologists soon used them for animals too. The popular idea that ♂ is Mars's shield and spear and ♀ is Venus's mirror is rejected by most historians; the symbols probably grew from abbreviations of the planets' Greek names.","q":"What are the male and female parts of a flower?","sym":"♂ ♀"},{"id":"sym-037","t":"F₁ and F₂: Bateson and Saunders","s":"Biology","tp":"Genetics","sub":"Inheritance","lv":["GCSE","A-Level"],"who":"William Bateson, Edith Rebecca Saunders","f":1,"loc":"UK","rg":["Europe"],"yr":1902,"era":"1900–1949","tag":"Symbol","x":"When Mendel's work was rediscovered in 1900, the Cambridge biologist William Bateson became its champion in Britain. In 1902, with the botanist Edith Rebecca Saunders, he published breeding experiments in a report to the Royal Society. In it they introduced the symbols F₁ and F₂ for the first and second filial (offspring) generations, and the words homozygote, heterozygote and allelomorph, later shortened to allele. Bateson coined the word 'genetics' in 1905. Saunders, known as the 'mother of British plant genetics', ran many of the experiments.","q":"In a monohybrid cross, what ratio of phenotypes do you expect in the F₂?","sym":"F₁"},{"id":"sym-038","t":"Mendel's capital letters","s":"Biology","tp":"Genetics","sub":"Alleles","lv":["GCSE","A-Level"],"who":"Gregor Mendel, Reginald Punnett","f":0,"loc":"Czech Republic / UK","rg":["Europe"],"yr":1866,"era":"1800s","tag":"Symbol","x":"The habit of using a capital letter for a dominant allele and the lower-case letter for the recessive one goes back to Gregor Mendel himself. In his 1866 paper, he wrote A for the dominant form, a for the recessive and Aa for the hybrid, and expressed the offspring of a cross as A + 2Aa + a. The grid used to predict offspring, the Punnett square, was introduced later by the Cambridge geneticist Reginald Punnett to make the combinations easy to see.","q":"Use a Punnett square to predict the offspring of Aa × aa.","sym":"A a"},{"id":"sym-039","t":"Ψ for water potential","s":"Biology","tp":"Plants","sub":"Osmosis","lv":["A-Level"],"who":"Ralph Slatyer, Sterling Taylor, R. K. Schofield","f":0,"loc":"Australia / USA / UK","rg":["Oceania","North & Central America","Europe"],"yr":1960,"era":"1950–1999","tag":"Symbol","x":"For decades plant biologists described water movement with a confusing mix of terms such as 'suction pressure' and 'diffusion pressure deficit'. The phrase 'water potential' was used by the soil scientist R. K. Schofield at a meeting at Rothamsted in 1949. It spread after the Australian plant ecologist Ralph Slatyer and the American soil scientist Sterling Taylor argued for it in a 1960 paper in Nature, using the Greek letter psi, Ψ. Pure water has Ψ = 0, so the water potential of any solution is negative.","q":"Why does water move from a dilute solution to a concentrated one?","sym":"Ψ"},{"id":"sym-040","t":"Rf: born in a wool laboratory","s":"Biology","tp":"Plants","sub":"Chromatography","lv":["GCSE","A-Level"],"who":"Archer Martin, Richard Synge, Raphael Consden, A. H. Gordon","f":0,"loc":"UK","rg":["Europe"],"yr":1944,"era":"1900–1949","tag":"Symbol","x":"Rf values let you identify a substance by how far it travels compared with the solvent front. The idea came from the development of paper chromatography in 1944 by Raphael Consden, A. H. Gordon and Archer Martin, after Martin and Richard Synge's work separating amino acids from wool in Leeds. They defined RF as the ratio of the distance moved by a spot to the distance moved by the solvent. Usually read as 'retardation factor' or 'ratio to front', the symbol is used for separating chlorophylls in A-level biology.","q":"Why must the starting line be drawn in pencil, not ink?","sym":"Rf"},{"id":"sym-041","t":"Karl Pearson's χ² and σ","s":"Biology","tp":"Statistics","sub":"Chi-squared test","lv":["A-Level"],"who":"Karl Pearson","f":0,"loc":"UK","rg":["Europe"],"yr":1900,"era":"1900–1949","tag":"Symbol","x":"In 1900 the London statistician Karl Pearson published the chi-squared test, using the Greek letter chi, to measure how far observed results differ from expected ones, for example the ratios in a genetics cross. He had already coined the term 'standard deviation' in 1894 and the symbol σ for it. Pearson was a brilliant founder of modern statistics, but he was also a leading supporter of eugenics, and University College London has since renamed buildings that carried his name.","q":"When would you reject a null hypothesis using a chi-squared value?","sym":"χ²"},{"id":"sym-042","t":"Student's t-test and Guinness","s":"Biology","tp":"Statistics","sub":"t-test","lv":["A-Level"],"who":"William Sealy Gosset","f":0,"loc":"Ireland / UK","rg":["Europe"],"yr":1908,"era":"1900–1949","tag":"Symbol","x":"William Sealy Gosset was a chemist and brewer at the Guinness brewery in Dublin, working out how to choose the best barley using very small samples. Guinness had banned its staff from publishing after another employee revealed trade secrets, but Gosset was allowed to publish as long as he used a pen name. In 1908 he published his method under the name 'Student'. It is still called Student's t-test. He later became head brewer at Guinness's brewery at Park Royal in London.","q":"Why are small samples a problem for statistical tests?","sym":"t"},{"id":"sym-043","t":"Simpson's index: from Bletchley Park to biodiversity","s":"Biology","tp":"Ecology","sub":"Biodiversity","lv":["A-Level"],"who":"Edward Simpson, Alan Turing","f":0,"loc":"UK","rg":["Europe"],"yr":1949,"era":"1900–1949","tag":"Symbol","x":"Edward Simpson, from Ballymena in Northern Ireland, worked as a codebreaker at Bletchley Park from 1942, on Italian and Japanese naval codes. The statistical thinking used to break ciphers, partly developed by Alan Turing, influenced him. In 1949 he published a short paper in Nature describing a measure of diversity based on the probability that two individuals picked at random belong to the same group. Simpson's index of diversity is now used in every A-level ecology fieldwork course. He later became a senior civil servant.","q":"Why does a community with many evenly spread species have a high diversity index?","sym":"D"},{"id":"sym-044","t":"Spearman's rank and the 'g' factor","s":"Biology","tp":"Statistics","sub":"Correlation","lv":["A-Level"],"who":"Charles Spearman","f":0,"loc":"UK","rg":["Europe"],"yr":1904,"era":"1900–1949","tag":"Symbol","x":"Charles Spearman served as an army officer for about 15 years before turning to psychology, studying in Leipzig. In 1904 he published a way of measuring how well two sets of data correlate by ranking them, rather than using raw values – Spearman's rank correlation coefficient, rₛ. The same year he proposed a general factor of intelligence, 'g', which remains controversial. Biologists use his test to look for links, such as between light intensity and plant height, without assuming the data follow a normal distribution.","q":"Does a strong correlation prove that one variable causes the other?","sym":"rₛ"},{"id":"sym-045","t":"Q₁₀ and the 10-degree rule","s":"Biology","tp":"Enzymes","sub":"Temperature","lv":["A-Level"],"who":"Jacobus van 't Hoff","f":0,"loc":"Netherlands","rg":["Europe"],"yr":1884,"era":"1800s","tag":"Symbol","x":"In 1884 Jacobus van 't Hoff noted that many chemical reactions roughly double or triple in rate for every 10 °C rise in temperature. Biologists adopted the temperature coefficient, Q₁₀, the factor by which a rate increases over a 10 °C rise, to describe how enzyme-controlled processes such as respiration speed up when warmer. A Q₁₀ of about 2 is typical. Above an enzyme's optimum, the rule fails as the enzyme denatures. Van 't Hoff won the first Nobel Prize in Chemistry in 1901.","q":"If Q₁₀ = 2 and a rate is 5 units at 20 °C, what is it at 30 °C?","sym":"Q₁₀"},{"id":"sym-046","t":"Guano, glands and the thymus: naming the DNA bases","s":"Biology","tp":"Genetics","sub":"DNA structure","lv":["GCSE","A-Level"],"who":"Julius Bodo Unger, Albrecht Kossel","f":0,"loc":"Germany","rg":["Europe"],"yr":1894,"era":"1800s","tag":"Symbol","x":"The four letters of DNA come from odd places. Guanine was first isolated in 1844 from guano, the droppings of seabirds. Adenine was named by the German biochemist Albrecht Kossel in 1885 from the Greek aden, 'gland', because he extracted it from the pancreas. Thymine came from the thymus gland of calves, and cytosine from the Greek for 'cell'. Kossel isolated several of these from cell nuclei and won the 1910 Nobel Prize; nobody yet knew that their order spelled out genetic information.","q":"Which bases pair together in DNA, and why?","sym":"A T C G"},{"id":"sym-047","t":"ATP: discovered twice in 1929","s":"Biology","tp":"Cells","sub":"Respiration","lv":["A-Level"],"who":"Yellapragada SubbaRow, Cyrus Fiske, Karl Lohmann","f":0,"loc":"USA / India / Germany","rg":["South Asia","North & Central America","Europe"],"yr":1929,"era":"1900–1949","tag":"Symbol","x":"Adenosine triphosphate was discovered almost at the same time by two teams in 1929: Karl Lohmann in Heidelberg, and Cyrus Fiske and his Indian student Yellapragada SubbaRow at Harvard Medical School. SubbaRow had trained in medicine in Madras before moving to the USA. Their method for measuring phosphate made the discovery possible, but textbooks often credited only Lohmann. SubbaRow was denied a permanent post at Harvard; he went on to lead research at the Lederle company that produced the cancer drug methotrexate, and his department discovered the antibiotic Aureomycin.","q":"Why is ATP described as the energy currency of the cell?","sym":"ATP"},{"id":"sym-048","t":"Rubisco: a name invented as a joke","s":"Biology","tp":"Plants","sub":"Photosynthesis","lv":["A-Level"],"who":"David Eisenberg, Sam Wildman","f":0,"loc":"USA","rg":["North & Central America"],"yr":1979,"era":"1950–1999","tag":"Symbol","x":"The most abundant protein on Earth was first found in 1947 by Sam Wildman as a mysterious 'Fraction I protein' in spinach leaves. It turned out to be the enzyme that fixes carbon dioxide in the Calvin cycle, ribulose bisphosphate carboxylase/oxygenase. In 1979, at Wildman's retirement celebration, the biochemist David Eisenberg jokingly shortened this to 'rubisco', which sounded like the American biscuit company Nabisco. The joke stuck and is now in every textbook. Rubisco is famously slow and sometimes grabs oxygen instead of carbon dioxide.","q":"Why does rubisco reacting with oxygen reduce photosynthesis?","sym":"Rubisco"},{"id":"sym-049","t":"Margaret Dayhoff's one-letter code","s":"Biology","tp":"Genetics","sub":"Proteins","lv":["A-Level"],"who":"Margaret Oakley Dayhoff","f":1,"loc":"USA","rg":["North & Central America"],"yr":1968,"era":"1950–1999","tag":"Symbol","x":"In the 1960s, Margaret Dayhoff compiled the Atlas of Protein Sequence and Structure, the first collection of known protein sequences, using early computers and punched cards. Writing each amino acid with three letters, such as Gly or Leu, took up a lot of space, so she devised the one-letter code. Where she could, she used the first letter of the name, giving it to the more common amino acid; others got sound-alike letters, such as F for phenylalanine and R for arginine. She is often called the founder of bioinformatics.","q":"Why is a single-letter code useful for storing protein sequences?","sym":"M L K"},{"id":"sym-050","t":"A, B, O – and why not C?","s":"Biology","tp":"Body systems","sub":"Blood groups","lv":["GCSE","A-Level"],"who":"Karl Landsteiner, Alexander Wiener","f":0,"loc":"Austria / USA","rg":["North & Central America","Europe"],"yr":1901,"era":"1900–1949","tag":"Symbol","x":"When Karl Landsteiner first described blood groups in 1901, he called them A, B and C. The third group, whose red cells carry neither A nor B antigens, was later renamed O. It is often said that O means zero, or the German ohne, 'without', but the exact reason is unclear. In 1940 Landsteiner and Alexander Wiener found another antigen by injecting rhesus monkey blood into rabbits, so it was named Rh, for rhesus. The human antigen turned out to be slightly different, but the name stayed.","q":"Why can people with group O blood donate to more people?","sym":"A B O"}];
const IMG_DIR = 'images/';
const IMAGES = new Set([]);

const SUBJ = {'Physics':'phy','Chemistry':'che','Biology':'bio','Earth Science':'ear'};
const LEVELS = ['KS3','GCSE','A-Level'];
const COLS = [['symbols','Where symbols come from'],['women','Women in science'],['hidden','Hidden figures'],['wales','Made in Wales'],['global','Beyond Europe and the USA'],['saved','My saved stories']];
const root = document.getElementById('sh');
/* embedding: tell the host page how tall the app is, and where to scroll */
const EMBED = window.parent !== window;
let lastH = 0;
const postH = () => { if (!EMBED) return; const h = Math.ceil(root.getBoundingClientRect().height) + 4; if (Math.abs(h - lastH) > 2) { lastH = h; try { parent.postMessage({ type: 'ety-height', height: h }, '*'); } catch (e) {} } };
if (EMBED) { new ResizeObserver(postH).observe(root); addEventListener('load', postH); }
const goTo = (el, block) => {
  if (!el) return;
  if (EMBED) { const r = el.getBoundingClientRect(); try { parent.postMessage({ type: 'ety-scroll', top: Math.max(0, r.top + scrollY), h: r.height, mode: block === 'center' ? 'center' : 'start' }, '*'); } catch (e) {} }
  else el.scrollIntoView({ block });
};
const shareBase = () => { try { if (EMBED && document.referrer) return document.referrer.split('#')[0]; } catch (e) {} return location.href.split('#')[0]; };
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fold = s => String(s).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'');
const col = s => `var(--${SUBJ[s]})`;
const yearTxt = y => y == null ? '' : y < 0 ? `c. ${-y} BCE` : y < 1000 ? `c. ${y} CE` : String(y);

let saved = new Set();
try { saved = new Set(JSON.parse(localStorage.getItem('sh-saved') || '[]')); } catch (e) {}
const persist = () => { try { localStorage.setItem('sh-saved', JSON.stringify([...saved])); } catch (e) {} };

for (const d of DATA) {
  d.h = fold([d.t, d.who, d.loc, d.tp, d.sub, d.tag, d.x, d.q, d.s, d.rg.join(' '), d.sym ? d.sym + ' symbol symbols letter notation' : ''].join(' '));
  d.ht = fold(d.t); d.hw = fold(d.who);
  d.wales = /wales|welsh/i.test(d.loc + ' ' + d.x) ? 1 : 0;
  d.global = d.rg.some(r => !['Europe','North & Central America','Worldwide'].includes(r)) ? 1 : 0;
}
const byId = new Map(DATA.map(d => [d.id, d]));

const st = {q:'', subj:new Set(), lv:new Set(), col:new Set(), tp:'', tag:'', rg:'', era:'', sort:'rel', shown:36, seed:1};

/* tally */
const countries = new Set();
DATA.forEach(d => d.loc.split('/').forEach(c => { c = c.replace(/\(.*?\)/g,'').trim(); if (c && !/worldwide|space/i.test(c)) countries.add(c); }));
$('tally').innerHTML = [[DATA.length,'stories'],[DATA.filter(d=>d.f).length,'feature women'],[countries.size,'countries and regions']].map(([n,l]) => `<div><b>${n}</b>${l}</div>`).join('');
$('key').innerHTML = Object.keys(SUBJ).map(s => `<span><i style="background:${col(s)}"></i>${s}</span>`).join('');

/* chips + selects */
const chip = (group, val, label, dot) => `<button type="button" class="chip" data-g="${group}" data-v="${esc(val)}" aria-pressed="false">${dot ? `<i style="background:${dot}"></i>` : ''}${esc(label)}</button>`;
$('subjRow').insertAdjacentHTML('beforeend', Object.keys(SUBJ).map(s => chip('subj', s, s, col(s))).join(''));
$('lvRow').insertAdjacentHTML('beforeend', LEVELS.map(l => chip('lv', l, l)).join(''));
$('colRow').insertAdjacentHTML('beforeend', COLS.map(([v,l]) => chip('col', v, l)).join(''));
const uniq = (f) => [...new Set(DATA.flatMap(f))].sort((a,b)=>a.localeCompare(b));
const fill = (id, all, vals) => { $(id).innerHTML = `<option value="">${all}</option>` + vals.map(v => `<option>${esc(v)}</option>`).join(''); };
const fillTopics = () => {
  const pool = st.subj.size ? DATA.filter(d => st.subj.has(d.s)) : DATA;
  const vals = [...new Set(pool.map(d => d.tp))].sort((a,b)=>a.localeCompare(b));
  if (!vals.includes(st.tp)) st.tp = '';
  fill('tp', 'All topics', vals); $('tp').value = st.tp;
};
fillTopics();
fill('tag', 'All kinds', uniq(d => [d.tag]));
fill('rg', 'Anywhere', uniq(d => d.rg));
const ERAS = ['Ancient','Medieval','1500–1699','1700s','1800s','1900–1949','1950–1999','2000 onwards'];
fill('era', 'Any time', ERAS.filter(e => DATA.some(d => d.era === e)));

/* filtering */
function score(d, terms) {
  let s = 0;
  for (const t of terms) {
    if (!d.h.includes(t)) return -1;
    s += (d.ht.includes(t) ? 6 : 0) + (d.hw.includes(t) ? 4 : 0) + 1;
  }
  return s;
}
function results() {
  const terms = fold(st.q).split(/\s+/).filter(Boolean);
  const out = [];
  for (const d of DATA) {
    if (st.subj.size && !st.subj.has(d.s)) continue;
    if (st.lv.size && !d.lv.some(l => st.lv.has(l))) continue;
    if (st.col.has('women') && !d.f) continue;
    if (st.col.has('hidden') && d.tag !== 'Hidden figure') continue;
    if (st.col.has('symbols') && d.tag !== 'Symbol') continue;
    if (st.col.has('wales') && !d.wales) continue;
    if (st.col.has('global') && !d.global) continue;
    if (st.col.has('saved') && !saved.has(d.id)) continue;
    if (st.tp && d.tp !== st.tp) continue;
    if (st.tag && d.tag !== st.tag) continue;
    if (st.rg && !d.rg.includes(st.rg)) continue;
    if (st.era && d.era !== st.era) continue;
    const s = terms.length ? score(d, terms) : 0;
    if (s < 0) continue;
    out.push([d, s]);
  }
  const yr = d => d.yr ?? 9999;
  const rnd = d => { let h = st.seed; for (const c of d.id) h = (h * 31 + c.charCodeAt(0)) >>> 0; return h; };
  const sorts = {
    rel: (a,b) => b[1]-a[1] || yr(a[0])-yr(b[0]),
    old: (a,b) => yr(a[0])-yr(b[0]), new: (a,b) => yr(b[0])-yr(a[0]),
    az: (a,b) => a[0].t.localeCompare(b[0].t), shuf: (a,b) => rnd(a[0])-rnd(b[0])
  };
  out.sort(sorts[st.sort]);
  return out.map(x => x[0]);
}
const isFiltered = () => st.q || st.subj.size || st.lv.size || st.col.size || st.tp || st.tag || st.rg || st.era;

/* card art: a quiet generated pattern until real images arrive */
function art(d, big) {
  if (IMAGES.has(d.id)) return `<img src="${IMG_DIR}${esc(d.id)}.webp" alt="" loading="lazy">`;
  let h = 7; for (const c of d.id) h = (h * 33 + c.charCodeAt(0)) >>> 0;
  const r = () => (h = (h * 1103515245 + 12345) >>> 0) / 4294967296;
  const c = col(d.s); let g = '';
  if (d.s === 'Physics') for (let i = 0; i < 7; i++) { const y = 20 + i * 18, a = 4 + r() * 9, f = .03 + r() * .03; let p = `M0 ${y}`; for (let x = 0; x <= 300; x += 10) p += ` L${x} ${(y + a * Math.sin(x * f + i)).toFixed(1)}`; g += `<path d="${p}" fill="none" stroke="${c}" stroke-width="2" opacity="${(.25 + r() * .5).toFixed(2)}"></path>`; }
  else if (d.s === 'Chemistry') for (let i = 0; i < 9; i++) { const cx = r() * 300, cy = r() * 200, s = 12 + r() * 22; let p = ''; for (let k = 0; k < 6; k++) { const an = Math.PI / 3 * k; p += `${k ? 'L' : 'M'}${(cx + s * Math.cos(an)).toFixed(1)} ${(cy + s * Math.sin(an)).toFixed(1)}`; } g += `<path d="${p}Z" fill="none" stroke="${c}" stroke-width="2" opacity="${(.25 + r() * .5).toFixed(2)}"></path>`; }
  else if (d.s === 'Biology') for (let i = 0; i < 11; i++) { const cx = r() * 300, cy = r() * 200, s = 8 + r() * 26; g += `<circle cx="${cx.toFixed(0)}" cy="${cy.toFixed(0)}" r="${s.toFixed(0)}" fill="${c}" fill-opacity="${(.06 + r() * .12).toFixed(2)}" stroke="${c}" stroke-opacity=".45" stroke-width="1.5"></circle><circle cx="${cx.toFixed(0)}" cy="${cy.toFixed(0)}" r="${(s / 4).toFixed(0)}" fill="${c}" fill-opacity=".5"></circle>`; }
  else { let y = 0; while (y < 200) { const t = 10 + r() * 26; g += `<rect x="0" y="${y.toFixed(0)}" width="300" height="${t.toFixed(0)}" fill="${c}" opacity="${(.06 + r() * .28).toFixed(2)}"></rect>`; y += t + 3; } }
  return `<svg viewBox="0 0 300 200" preserveAspectRatio="xMidYMid slice" aria-hidden="true">${g}</svg><span class="ov" style="color:${c}">${d.sym ? `<b class="sym">${esc(d.sym)}</b>` : `<b>${esc(yearTxt(d.yr))}</b>`}<em>${esc(d.tag === 'Symbol' ? 'Symbol story' : d.tag)}</em></span>`;
}
const meta = d => [d.who.split(',')[0], d.loc.split('/')[0].trim(), yearTxt(d.yr)].filter(Boolean).map(esc).join(', ');
