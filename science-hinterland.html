 and burst into flame in air: phosphorus. He was the first person known to discover a new element.","q":"Why must white phosphorus be stored under water?"},{"id":"chem-007","t":"Lavoisier, Marie-Anne and the guillotine","s":"Chemistry","tp":"Chemical reactions","sub":"Conservation of mass","lv":["KS3","GCSE","A-Level"],"who":"Antoine Lavoisier, Marie-Anne Paulze Lavoisier","f":1,"loc":"France","rg":["Europe"],"yr":1789,"era":"1700s","tag":"Tragedy","x":"Antoine Lavoisier weighed everything before and after reactions and showed that mass is conserved; he explained combustion as combination with oxygen, which he named, and helped create modern chemical names. His wife Marie-Anne Paulze was his partner in the work: she translated English papers, recorded experiments, and drew the detailed engravings of apparatus in his textbook. Lavoisier also collected taxes for the king, and during the Revolution he was guillotined in 1794. A mathematician friend lamented that it took only a moment to cut off that head, but a century might not produce another like it.","q":"Why is it important to do reactions in a sealed container to show conservation of mass?"},{"id":"chem-008","t":"Scheele tasted everything","s":"Chemistry","tp":"Periodic table","sub":"Discovery of elements","lv":["GCSE","A-Level"],"who":"Carl Wilhelm Scheele, Joseph Priestley","f":0,"loc":"Sweden / UK","rg":["Europe"],"yr":1772,"era":"1700s","tag":"Tragedy","x":"Carl Wilhelm Scheele, a Swedish pharmacist, discovered oxygen around 1772 – before Joseph Priestley in England – but his book was delayed and Priestley published first. Scheele also discovered or helped discover chlorine, barium, manganese, molybdenum and tungsten, and many acids. He had the dangerous habit of smelling and tasting the chemicals he made, including hydrogen cyanide. He died in 1786 aged 43, possibly from poisoning by the substances he studied.","q":"What safety rules would have protected Scheele?"},{"id":"chem-009","t":"Priestley's mice and fizzy water","s":"Chemistry","tp":"Atmosphere","sub":"Gases","lv":["KS3","GCSE"],"who":"Joseph Priestley","f":0,"loc":"UK","rg":["Europe"],"yr":1772,"era":"1700s","tag":"Discovery","x":"Joseph Priestley, a minister from Yorkshire, lived next to a brewery in Leeds and studied the gas over the fermenting vats. He found that dissolving it in water made a pleasant fizzy drink – inventing soda water in 1772. He found a mouse could survive longer in a jar of the gas from heated mercury oxide than in air, and that a sprig of mint could 'restore' air in which a candle had burned out – an early clue to photosynthesis. His support for the French Revolution made him unpopular, and a mob burned his house and laboratory in Birmingham in 1791.","q":"What gas makes drinks fizzy, and how can you test for it?"},{"id":"chem-010","t":"Cavendish: the shy weigher of the world","s":"Chemistry","tp":"Periodic table","sub":"Hydrogen","lv":["GCSE","A-Level"],"who":"Henry Cavendish","f":0,"loc":"UK","rg":["Europe"],"yr":1766,"era":"1700s","tag":"Eccentric","x":"Henry Cavendish was so shy that he ordered dinner by leaving notes for his housekeeper and had a separate staircase built so he would not meet servants. He identified hydrogen, calling it 'inflammable air', in 1766, and showed that burning it produces water. In 1798 he used a delicate torsion balance to measure the tiny gravitational pull between lead balls, and from it calculated Earth's density – the 'weighing the world' experiment.","q":"What is the word equation for hydrogen burning?"},{"id":"chem-011","t":"John Dalton's colour-blind eyes","s":"Chemistry","tp":"Atomic structure","sub":"History of the atom","lv":["KS3","GCSE","A-Level"],"who":"John Dalton","f":0,"loc":"UK","rg":["Europe"],"yr":1808,"era":"1800s","tag":"Discovery","x":"John Dalton, a Quaker teacher in Manchester, proposed in 1808 that each element is made of identical atoms with their own mass, and that compounds form when atoms combine in simple ratios. He was also colour-blind and wrote the first scientific description of it; red–green colour blindness is still sometimes called Daltonism. He thought the fluid in his eyes was tinted blue and asked for his eyes to be examined after his death. They were preserved, and in 1995 DNA tests showed he lacked the green-sensitive pigment.","q":"How did Dalton's atomic model differ from today's?"},{"id":"chem-012","t":"Humphry Davy's laughing gas parties","s":"Chemistry","tp":"Electrochemistry","sub":"Electrolysis","lv":["KS3","GCSE","A-Level"],"who":"Humphry Davy, Jane Marcet","f":1,"loc":"UK","rg":["Europe"],"yr":1807,"era":"1800s","tag":"Eccentric","x":"As a young man in Bristol, Humphry Davy breathed nitrous oxide and found it made him giddy and euphoric; friends including the poets Coleridge and Southey tried it too. In 1807, at the Royal Institution, he used a huge battery to pass electricity through molten potash and saw globules of a new metal that burst into flame on water – potassium. Within days he had found sodium too, and later calcium, magnesium and barium. His lectures were so popular that the street outside became one of London's first one-way streets. Jane Marcet's bestselling book 'Conversations on Chemistry', inspired by his lectures, later inspired Michael Faraday.","q":"Why couldn't potassium be extracted by heating with carbon?"},{"id":"chem-013","t":"Jane Marcet inspires Faraday","s":"Chemistry","tp":"How science works","sub":"Communicating science","lv":["KS3","GCSE"],"who":"Jane Marcet, Michael Faraday","f":1,"loc":"UK / Switzerland","rg":["Europe"],"yr":1805,"era":"1800s","tag":"Hidden figure","x":"In 1805 Jane Marcet, a Swiss-British writer, published 'Conversations on Chemistry', in which a teacher explains chemistry to two curious young women. It sold widely and was used in schools for decades. A teenage bookbinder's apprentice, Michael Faraday, read it while binding a copy and began doing experiments. He later said it gave him his foundation in chemistry and called her his first instructor. Faraday went on to become one of the greatest scientists of all time.","q":"Why might a book written as a conversation be easier to learn from?"},{"id":"chem-014","t":"Mendeleev's patience cards","s":"Chemistry","tp":"Periodic table","sub":"Mendeleev","lv":["KS3","GCSE","A-Level"],"who":"Dmitri Mendeleev, Paul-Émile Lecoq de Boisbaudran, Clemens Winkler","f":0,"loc":"Russia / France / Germany","rg":["Europe"],"yr":1869,"era":"1800s","tag":"Discovery","x":"In 1869, while writing a chemistry textbook in St Petersburg, Dmitri Mendeleev wrote each element and its properties on a card and arranged them like a game of patience. He ordered them by atomic mass but grouped similar elements together, and boldly left gaps for elements not yet discovered, predicting their properties. When gallium was found in France in 1875 and germanium in Germany in 1886, they matched his predictions remarkably well. Mendeleev reportedly cut his hair only once a year.","q":"Why was leaving gaps such a bold idea?"},{"id":"chem-015","t":"Lady chemists of the periodic table: Noddack and Perey","s":"Chemistry","tp":"Periodic table","sub":"Discovery of elements","lv":["GCSE","A-Level"],"who":"Ida Noddack, Marguerite Perey, Berta Karlik","f":1,"loc":"Germany / France / Austria","rg":["Europe"],"yr":1939,"era":"1900–1949","tag":"Hidden figure","x":"Several elements were discovered by women. In 1925 Ida Noddack, with Walter Noddack and Otto Berg, found rhenium, one of the last stable elements to be discovered. In 1939 Marguerite Perey, who had joined Marie Curie's lab as a 19-year-old assistant, discovered francium, the last naturally occurring element found. She became the first woman elected to the French Academy of Sciences, in 1962. The Austrian physicist Berta Karlik showed in the 1940s that astatine occurs in nature.","q":"Why were the last natural elements so hard to find?"},{"id":"chem-016","t":"Marie Curie: two Nobel Prizes and glowing notebooks","s":"Chemistry","tp":"Atomic structure","sub":"Radium and polonium","lv":["KS3","GCSE","A-Level"],"who":"Marie Skłodowska-Curie, Pierre Curie","f":1,"loc":"Poland / France","rg":["Europe"],"yr":1898,"era":"1800s","tag":"Hidden figure","x":"Maria Skłodowska grew up in Russian-ruled Poland, where women could not go to university, so she studied at a secret 'Flying University' before moving to Paris. With Pierre Curie, she processed tonnes of pitchblende ore in a leaky shed to isolate two new elements: polonium, named after Poland, and radium. She coined the word 'radioactivity'. She won the Nobel Prize in Physics in 1903 and in Chemistry in 1911, and is still the only person to win Nobels in two different sciences. Her notebooks are still so radioactive that they are kept in lead-lined boxes.","q":"Why are Curie's notebooks still radioactive after over a century?"},{"id":"chem-017","t":"Kekulé's dream of a snake","s":"Chemistry","tp":"Organic chemistry","sub":"Benzene","lv":["A-Level"],"who":"August Kekulé, Kathleen Lonsdale","f":1,"loc":"Germany / Ireland / UK","rg":["Europe"],"yr":1865,"era":"1800s","tag":"Discovery","x":"Benzene, C₆H₆, puzzled chemists: how could six carbons and six hydrogens fit together? In 1865 August Kekulé proposed a ring. Twenty-five years later he said the idea came to him in a daydream by the fire, of a snake biting its own tail. Some historians doubt the story. In 1929 the Irish-born crystallographer Kathleen Lonsdale used X-ray diffraction to prove that the benzene ring is flat and its bonds are all the same length. In 1945 she became one of the first two women elected Fellows of the Royal Society.","q":"Why do all the bonds in benzene have the same length?"},{"id":"chem-018","t":"William Perkin's accidental purple","s":"Chemistry","tp":"Organic chemistry","sub":"Dyes","lv":["KS3","GCSE"],"who":"William Henry Perkin","f":0,"loc":"UK","rg":["Europe"],"yr":1856,"era":"1800s","tag":"Accident","x":"In 1856, 18-year-old William Perkin was trying to make quinine, a malaria medicine, in a makeshift lab at home in London during the Easter holidays. His attempt produced a black sludge – but washing out the flask with alcohol gave a brilliant purple solution. He realised it could dye silk, left college, and opened a factory making 'mauveine'. Purple had been the most expensive colour, made from sea snails; suddenly everyone could wear it, including Queen Victoria. His discovery launched the synthetic dye industry and modern organic chemistry.","q":"Why is it worth investigating failed experiments?"},{"id":"chem-019","t":"Alfred Nobel reads his own obituary","s":"Chemistry","tp":"Chemical reactions","sub":"Explosives","lv":["KS3","GCSE"],"who":"Alfred Nobel","f":0,"loc":"Sweden / France","rg":["Europe"],"yr":1888,"era":"1800s","tag":"Tragedy","x":"Nitroglycerine is a powerful but dangerously unstable explosive; an accident at the Nobel family factory in 1864 killed Alfred Nobel's younger brother. Nobel found that soaking it into a type of clay made a stable paste – dynamite – used to blast tunnels and mines. In 1888, when his brother Ludvig died, a French newspaper mistakenly published Alfred's obituary, calling him a 'merchant of death'. Shocked at how he would be remembered, he left most of his fortune to fund the Nobel Prizes.","q":"How can a dangerous substance be made safer to handle?"},{"id":"chem-020","t":"Aluminium: more precious than gold","s":"Chemistry","tp":"Reactivity","sub":"Extracting metals","lv":["GCSE"],"who":"Charles Martin Hall, Paul Héroult, Julia Hall","f":1,"loc":"USA / France","rg":["North & Central America","Europe"],"yr":1886,"era":"1800s","tag":"Discovery","x":"Aluminium is the most common metal in Earth's crust, but it is so reactive that it is very hard to extract. In the 1850s it was rarer than gold: Napoleon III reportedly served his most honoured guests with aluminium cutlery while others used gold, and the Washington Monument was capped with aluminium in 1884. In 1886, two 22-year-olds – Charles Martin Hall in the USA, helped by his sister Julia, and Paul Héroult in France – independently discovered how to extract it by electrolysis of aluminium oxide dissolved in molten cryolite. The price collapsed. Both men were born in 1863 and died in 1914.","q":"Why can't aluminium be extracted by heating with carbon?"},{"id":"chem-021","t":"The Haber process: bread and bombs","s":"Chemistry","tp":"Rates and equilibrium","sub":"Haber process","lv":["GCSE","A-Level"],"who":"Fritz Haber, Carl Bosch, Clara Immerwahr","f":1,"loc":"Germany","rg":["Europe"],"yr":1909,"era":"1900–1949","tag":"Tragedy","x":"In 1909 the German chemist Fritz Haber found how to combine nitrogen from the air with hydrogen to make ammonia, using high pressure, heat and an iron catalyst. Carl Bosch scaled it up to an industrial process. Ammonia fertilisers now help feed around half the world's population. But Haber also led Germany's poison gas programme in the First World War. His wife, Clara Immerwahr, the first woman to gain a doctorate in chemistry at the University of Breslau, opposed his weapons work; she died in 1915. Haber, who was Jewish, was forced out of Germany in 1933.","q":"Why is the Haber process run at a compromise temperature?"},{"id":"chem-022","t":"Thomas Midgley: leaded petrol and CFCs","s":"Chemistry","tp":"Atmosphere","sub":"Pollution","lv":["GCSE","A-Level"],"who":"Thomas Midgley Jr","f":0,"loc":"USA","rg":["North & Central America"],"yr":1921,"era":"1900–1949","tag":"Blunder","x":"In the 1920s the American engineer Thomas Midgley found that adding tetraethyl lead to petrol stopped engines 'knocking'. He later developed CFCs, which seemed perfectly safe refrigerants. Both caused enormous harm: leaded petrol spread toxic lead worldwide, and CFCs destroyed the ozone layer. To show leaded petrol was safe, Midgley once washed his hands in it at a press conference, though he had been ill from lead poisoning himself. One historian said he had more impact on the atmosphere than any other single organism in Earth's history.","q":"Why didn't anyone realise CFCs were harmful at first?"},{"id":"chem-023","t":"The ozone hole","s":"Chemistry","tp":"Atmosphere","sub":"Ozone","lv":["GCSE","A-Level"],"who":"Joseph Farman, Brian Gardiner, Jonathan Shanklin, Mario Molina, Sherwood Rowland","f":0,"loc":"UK / Antarctica / Mexico / USA","rg":["Antarctica & Arctic","North & Central America","Europe"],"yr":1985,"era":"1950–1999","tag":"Discovery","x":"In 1974 the Mexican chemist Mario Molina and Sherwood Rowland predicted that CFCs could destroy ozone high in the atmosphere. In 1985 Joseph Farman, Brian Gardiner and Jonathan Shanklin of the British Antarctic Survey, using an old ground-based instrument at Halley station, reported that ozone over Antarctica had fallen dramatically each spring. Satellites had missed it because their software had been set to reject such low readings as errors. The 1987 Montreal Protocol banned CFCs, and the ozone layer is slowly recovering.","q":"Why is the ozone layer important for life?"},{"id":"chem-024","t":"Teflon: the gas that disappeared","s":"Chemistry","tp":"Polymers","sub":"Addition polymers","lv":["KS3","GCSE"],"who":"Roy Plunkett","f":0,"loc":"USA","rg":["North & Central America"],"yr":1938,"era":"1900–1949","tag":"Accident","x":"In 1938 the DuPont chemist Roy Plunkett opened the valve on a cylinder of tetrafluoroethylene gas and nothing came out – yet the cylinder still weighed as if it were full. He sawed it open and found a slippery white powder: the gas had polymerised inside. The new plastic, PTFE or Teflon, resists almost all chemicals and heat, and is incredibly slippery. It was first used in the Manhattan Project and later in non-stick pans.","q":"How did weighing the cylinder show that the gas had not leaked?"},{"id":"chem-025","t":"Stephanie Kwolek's cloudy solution","s":"Chemistry","tp":"Polymers","sub":"Materials","lv":["KS3","GCSE"],"who":"Stephanie Kwolek","f":1,"loc":"USA","rg":["North & Central America"],"yr":1965,"era":"1950–1999","tag":"Hidden figure","x":"In 1965 the DuPont chemist Stephanie Kwolek was trying to make a strong, light fibre for car tyres. One polymer solution came out thin and cloudy – the kind normally thrown away. She persuaded a reluctant colleague to spin it into fibre anyway. It was astonishingly strong: five times stronger than steel for the same weight. This was Kevlar, now used in bulletproof vests, helmets, ropes and spacecraft. Kwolek had hoped to become a doctor and took the job to save money for medical school, but stayed for over 40 years.","q":"Why does lining up long polymer chains make a fibre stronger?"},{"id":"chem-026","t":"Graphene and sticky tape","s":"Chemistry","tp":"Bonding","sub":"Giant covalent structures","lv":["GCSE","A-Level"],"who":"Andre Geim, Konstantin Novoselov","f":0,"loc":"UK / Russia / Netherlands","rg":["Europe"],"yr":2004,"era":"2000 onwards","tag":"Discovery","x":"At the University of Manchester, Andre Geim and Konstantin Novoselov held 'Friday night experiments' to try odd ideas. In 2004 they used ordinary sticky tape to peel layers off graphite again and again until they had a sheet just one atom thick: graphene. It is incredibly strong, conducts electricity and heat superbly, and is almost transparent. They won the 2010 Nobel Prize in Physics. Geim had earlier won an Ig Nobel prize for levitating a frog in a magnetic field, making him the only person to win both.","q":"How does the structure of graphite explain why it flakes onto paper?"},{"id":"chem-027","t":"Buckyballs from the stars","s":"Chemistry","tp":"Bonding","sub":"Fullerenes","lv":["GCSE","A-Level"],"who":"Harry Kroto, Richard Smalley, Robert Curl","f":0,"loc":"UK / USA","rg":["North & Central America","Europe"],"yr":1985,"era":"1950–1999","tag":"Discovery","x":"Harry Kroto at the University of Sussex wanted to understand the long carbon molecules found in space around red giant stars. In 1985 he joined Richard Smalley and Robert Curl in Texas, where they blasted graphite with a laser. A molecule of exactly 60 carbon atoms kept appearing. Its shape, they realised, was like a football – 12 pentagons and 20 hexagons. They named it buckminsterfullerene after the architect Buckminster Fuller, whose domes it resembled. In 2010 astronomers found buckyballs in space.","q":"How many atoms does each carbon in C₆₀ bond to?"},{"id":"chem-028","t":"The Lycurgus Cup: Roman nanotechnology","s":"Chemistry","tp":"Materials","sub":"Nanoparticles","lv":["GCSE","A-Level"],"who":"","f":0,"loc":"Roman Empire / UK","rg":["Europe"],"yr":350,"era":"Ancient","tag":"Discovery","x":"The Lycurgus Cup, a 4th-century Roman glass cup in the British Museum, looks jade green when lit from the front but glows ruby red when lit from behind. In 1990 scientists found why: the glass contains tiny particles of gold and silver only about 50–100 nanometres across. Particles this small scatter and absorb light differently from bulk metal. The Roman glassmakers probably did not understand it, but it is one of the oldest examples of nanotechnology.","q":"Why do nanoparticles behave differently from larger pieces of the same material?"},{"id":"chem-029","t":"Maya blue: the colour that wouldn't fade","s":"Chemistry","tp":"Materials","sub":"Pigments","lv":["KS3","GCSE"],"who":"","f":0,"loc":"Mexico / Central America","rg":["North & Central America"],"yr":800,"era":"Medieval","tag":"Discovery","x":"The ancient Maya painted murals and pottery with a brilliant turquoise called Maya blue, which has survived centuries of tropical heat and rain. Chemists found it is made by heating indigo dye from plants with a special clay called palygorskite. The indigo molecules lodge inside tiny channels in the clay, protecting them. Ancient Egyptians also invented a synthetic pigment, Egyptian blue, made from copper, sand and lime – and it glows in infrared, helping archaeologists find traces of it on ancient objects.","q":"Why might trapping a dye inside a mineral protect it?"},{"id":"chem-030","t":"Mesoamerican rubber and Goodyear's accident","s":"Chemistry","tp":"Polymers","sub":"Cross-linking","lv":["GCSE","A-Level"],"who":"Charles Goodyear","f":0,"loc":"Mexico / USA","rg":["North & Central America"],"yr":1839,"era":"1800s","tag":"Accident","x":"More than 3,000 years ago, the Olmec and later peoples of Mesoamerica mixed latex from rubber trees with juice from morning glory vines to make bouncy balls for their ball game, sandals and waterproof items – by varying the recipe, they controlled how stiff it was. In Europe and the USA, natural rubber went sticky in summer and brittle in winter. In 1839 Charles Goodyear accidentally dropped a mixture of rubber and sulphur on a hot stove and found it charred but stayed flexible. This 'vulcanisation' cross-links the polymer chains. Goodyear died in debt.","q":"How do cross-links between chains change a polymer's properties?"},{"id":"chem-031","t":"Alice Ball's leprosy treatment","s":"Chemistry","tp":"Organic chemistry","sub":"Esters","lv":["GCSE","A-Level"],"who":"Alice Ball, Arthur Dean, Harry Hollmann","f":1,"loc":"USA (Hawaiʻi)","rg":["Oceania","North & Central America"],"yr":1915,"era":"1900–1949","tag":"Hidden figure","x":"Leprosy patients in Hawaiʻi were forced into isolated settlements. Chaulmoogra oil, a traditional remedy from India and Southeast Asia, helped a little but was thick and hard to inject. In 1915, Alice Ball, a 23-year-old African American chemist at the College of Hawaiʻi, converted the oil's fatty acids into ethyl esters that could be injected and absorbed. She died in 1916, aged 24. The college president, Arthur Dean, continued the work and published it without crediting her, but her colleague Harry Hollmann named it the 'Ball Method'. It was the best leprosy treatment until antibiotics in the 1940s.","q":"Why does turning fatty acids into esters make them easier to inject?"},{"id":"chem-032","t":"Gertrude Elion: the Nobel winner without a PhD","s":"Chemistry","tp":"Health and medicine","sub":"Drug design","lv":["GCSE","A-Level"],"who":"Gertrude Elion, George Hitchings","f":1,"loc":"USA","rg":["North & Central America"],"yr":1988,"era":"1950–1999","tag":"Hidden figure","x":"When Gertrude Elion was 15, her grandfather died of cancer and she decided to fight the disease. Despite top grades, she could not get a research job because she was a woman, and worked as a lab assistant and teacher. At Burroughs Wellcome she and George Hitchings designed drugs by studying how cells copy DNA, creating treatments for leukaemia, gout, malaria, herpes and organ rejection. She never completed a PhD, but won the Nobel Prize in Medicine in 1988.","q":"What does it mean to design a drug rather than discover it by chance?"},{"id":"chem-033","t":"Tu Youyou and the ancient recipe","s":"Chemistry","tp":"Health and medicine","sub":"Natural products","lv":["GCSE","A-Level"],"who":"Tu Youyou","f":1,"loc":"China","rg":["East Asia"],"yr":1972,"era":"1950–1999","tag":"Hidden figure","x":"In 1969 China set up a secret project to find new malaria drugs, and the pharmacologist Tu Youyou led a team that studied thousands of traditional remedies. Sweet wormwood looked promising but gave inconsistent results. She found a 1,600-year-old text by Ge Hong that said to soak the herb in cold water – and realised heat might be destroying the active ingredient. Extracting it at low temperature worked. She tested it on herself before patients. The drug, artemisinin, has saved millions of lives. In 2015 she became the first Chinese woman to win a Nobel Prize in science.","q":"Why would heating an extract destroy some medicines?"},{"id":"chem-034","t":"Asima Chatterjee: medicines from Indian plants","s":"Chemistry","tp":"Organic chemistry","sub":"Natural products","lv":["GCSE","A-Level"],"who":"Asima Chatterjee","f":1,"loc":"India","rg":["South Asia"],"yr":1944,"era":"1900–1949","tag":"Hidden figure","x":"Asima Chatterjee grew up in Calcutta and in 1944 became the first woman to be awarded a Doctor of Science degree by an Indian university. She spent her career studying the chemistry of medicinal plants of the Indian subcontinent, including vinca alkaloids from the periwinkle used in cancer treatment. Her work led to the anti-epileptic drug Ayush-56 and to anti-malarial medicines, and she published around 400 papers. She was the first woman to lead the Indian Science Congress.","q":"Why are plants such a rich source of medicines?"},{"id":"chem-035","t":"Mikhail Tsvet's coloured bands","s":"Chemistry","tp":"Chemical analysis","sub":"Chromatography","lv":["KS3","GCSE"],"who":"Mikhail Tsvet","f":0,"loc":"Italy / Russia / Poland","rg":["Europe"],"yr":1903,"era":"1900–1949","tag":"Discovery","x":"Mikhail Tsvet, an Italian-born Russian botanist working in Warsaw, wanted to separate the pigments in leaves. In 1903 he poured a leaf extract through a glass tube packed with powdered chalk and washed it with solvent. The pigments moved at different speeds and separated into coloured bands of green and yellow. He named it chromatography – 'colour writing'. Fittingly, 'tsvet' means colour in Russian. Chromatography is now used everywhere, from testing for drugs in sport to analysing food.","q":"Why do different substances travel different distances in chromatography?"},{"id":"chem-036","t":"Søren Sørensen and the pH scale","s":"Chemistry","tp":"Acids and alkalis","sub":"pH","lv":["KS3","GCSE"],"who":"Søren Sørensen, Margrethe Sørensen","f":1,"loc":"Denmark","rg":["Europe"],"yr":1909,"era":"1900–1949","tag":"Discovery","x":"The pH scale was invented in a brewery laboratory. In 1909, Søren Sørensen, head of chemistry at the Carlsberg Laboratory in Copenhagen, was studying how acidity affects proteins and enzymes, which matter in brewing. He introduced pH as a simple way to express the concentration of hydrogen ions. His wife Margrethe Høyrup Sørensen, also a chemist, worked with him on protein research. Litmus, a much older indicator, is made from lichens and was described in medieval times.","q":"Why does a change of one pH unit mean a tenfold change in acidity?"},{"id":"chem-037","t":"Red cabbage and other indicators","s":"Chemistry","tp":"Acids and alkalis","sub":"Indicators","lv":["KS3"],"who":"Robert Boyle","f":0,"loc":"UK","rg":["Europe"],"yr":1664,"era":"1500–1699","tag":"Everyday","x":"In 1664 Robert Boyle described how syrup of violets turns red in acid and green in alkali – one of the first acid–base indicators. Many plant pigments called anthocyanins change colour with pH. Boil red cabbage and the purple juice turns pink with lemon juice and green or yellow with bicarbonate of soda. Hydrangeas even change flower colour depending on soil acidity – blue in acidic soil and pink in alkaline soil.","q":"Make your own indicator and test five household liquids."},{"id":"chem-038","t":"Agnes Pockels: science at the kitchen sink","s":"Chemistry","tp":"Particles","sub":"Surface tension","lv":["GCSE","A-Level"],"who":"Agnes Pockels, Lord Rayleigh","f":1,"loc":"Germany / UK","rg":["Europe"],"yr":1891,"era":"1800s","tag":"Hidden figure","x":"Agnes Pockels was not allowed to attend university in Germany, but she read her brother's physics textbooks. Washing dishes, she noticed how soap and grease changed the surface of water, and built a 'trough' with a sliding barrier to measure surface tension precisely. In 1891 she wrote to the famous British physicist Lord Rayleigh about her results. He was so impressed that he sent her letter to the journal Nature, which published it. Her method led to the modern Langmuir–Blodgett trough and to estimating the size of molecules.","q":"How can a thin film of oil on water tell you the size of a molecule?"},{"id":"chem-039","t":"Elizabeth Fulhame and the first idea of catalysis","s":"Chemistry","tp":"Rates and equilibrium","sub":"Catalysts","lv":["A-Level"],"who":"Elizabeth Fulhame, Jöns Jacob Berzelius","f":1,"loc":"UK / Sweden","rg":["Europe"],"yr":1794,"era":"1700s","tag":"Hidden figure","x":"In 1794 the Scottish chemist Elizabeth Fulhame published a book on using chemistry to dye cloth with gold and silver patterns. Her experiments led her to suggest that water takes part in many reactions and is regenerated at the end – one of the first descriptions of what we now call catalysis. She also did early work on light-sensitive silver salts. She expected criticism as a woman and wrote that some people were struck dumb by female writing on science. The term 'catalysis' was coined by the Swedish chemist Berzelius in 1835.","q":"How does a catalyst speed up a reaction without being used up?"},{"id":"chem-040","t":"Glenn Seaborg and the superheavy elements","s":"Chemistry","tp":"Periodic table","sub":"Synthetic elements","lv":["GCSE","A-Level"],"who":"Glenn Seaborg, Kosuke Morita, Yuri Oganessian","f":0,"loc":"USA / Japan / Russia","rg":["East Asia","North & Central America","Europe"],"yr":2016,"era":"2000 onwards","tag":"Discovery","x":"Glenn Seaborg's team made plutonium in 1941 and nine more elements heavier than uranium; he reorganised the periodic table to fit them, and element 106 became seaborgium while he was still alive. Elements beyond uranium are made by smashing nuclei together. In 2016, element 113 was named nihonium after Japan – the first element discovered in Asia, by Kosuke Morita's team at RIKEN after nine years of experiments. Element 118, oganesson, is named after the Russian physicist Yuri Oganessian, still alive at the time of naming.","q":"Why do superheavy elements decay so quickly?"},{"id":"chem-041","t":"Helium found in the Sun first","s":"Chemistry","tp":"Periodic table","sub":"Noble gases","lv":["GCSE","A-Level"],"who":"Jules Janssen, Norman Lockyer, William Ramsay","f":0,"loc":"India / France / UK","rg":["South Asia","Europe"],"yr":1868,"era":"1800s","tag":"Discovery","x":"During a total solar eclipse in 1868, the French astronomer Jules Janssen, observing from Guntur in India, saw a bright yellow line in the spectrum of the Sun's outer layers that matched no known element. The British astronomer Norman Lockyer studied it and named the new element helium, after Helios, the Greek Sun god. It was only found on Earth in 1895, when William Ramsay released it from a uranium mineral. Helium is the only element discovered in space before it was found on Earth.","q":"How can a line in a spectrum reveal a new element?"},{"id":"chem-042","t":"Ramsay and the 'lazy' gases","s":"Chemistry","tp":"Periodic table","sub":"Noble gases","lv":["GCSE","A-Level"],"who":"William Ramsay, Lord Rayleigh, Morris Travers","f":0,"loc":"UK","rg":["Europe"],"yr":1894,"era":"1800s","tag":"Discovery","x":"Lord Rayleigh noticed that nitrogen taken from air was slightly denser than nitrogen made by chemical reactions. Working with William Ramsay, he found the difference was caused by a new, unreactive gas, discovered in 1894 and named argon, from the Greek for 'lazy'. Ramsay and Morris Travers then found neon, krypton and xenon by cooling air until it liquefied and boiling off each gas in turn – their names mean 'new', 'hidden' and 'stranger'. Ramsay added a whole new group to the periodic table.","q":"Why are the noble gases so unreactive?"},{"id":"chem-043","t":"Moissan and the fluorine martyrs","s":"Chemistry","tp":"Periodic table","sub":"Halogens","lv":["GCSE","A-Level"],"who":"Henri Moissan","f":0,"loc":"France / Ireland / Belgium","rg":["Europe"],"yr":1886,"era":"1800s","tag":"Tragedy","x":"Fluorine is the most reactive element: it attacks glass and most metals and reacts explosively with many substances. For decades chemists tried to isolate it, and several were injured or killed, earning them the name 'fluorine martyrs'. In 1886 the French chemist Henri Moissan succeeded by electrolysing a cooled mixture in apparatus made of platinum and fluorite. He won the Nobel Prize in 1906. Today small amounts of fluoride in toothpaste help protect teeth.","q":"Why is fluorine more reactive than chlorine?"},{"id":"chem-044","t":"Polythene: a lucky leak","s":"Chemistry","tp":"Polymers","sub":"Addition polymers","lv":["KS3","GCSE"],"who":"Eric Fawcett, Reginald Gibson","f":0,"loc":"UK","rg":["Europe"],"yr":1933,"era":"1900–1949","tag":"Accident","x":"In 1933, chemists Eric Fawcett and Reginald Gibson at ICI in Northwich, Cheshire, heated ethene gas with benzaldehyde at extremely high pressure. They found a waxy white solid – polyethylene. The result was hard to repeat until 1935, when they realised a tiny leak in the equipment had let in a little oxygen, which started the reaction. Polythene insulated radar cables in the Second World War and is now the most common plastic in the world.","q":"Draw how ethene molecules join to form poly(ethene)."},{"id":"chem-045","t":"Nylon and Wallace Carothers","s":"Chemistry","tp":"Polymers","sub":"Condensation polymers","lv":["GCSE","A-Level"],"who":"Wallace Carothers, Julian Hill","f":0,"loc":"USA","rg":["North & Central America"],"yr":1935,"era":"1900–1949","tag":"Discovery","x":"Wallace Carothers led a DuPont team researching how small molecules link into giant chains. In 1934 his colleague Julian Hill pulled a glass rod from a sticky polymer and found it stretched into a long silky thread; they raced each other down the corridor to see how far it would stretch. In 1935 Carothers made nylon, a condensation polymer. Nylon stockings caused queues when they went on sale in 1940. Carothers suffered from severe depression and did not live to see nylon's success.","q":"What small molecule is released when a condensation polymer forms?"},{"id":"chem-046","t":"Bakelite and the plastics age","s":"Chemistry","tp":"Polymers","sub":"Thermosets","lv":["KS3","GCSE"],"who":"Leo Baekeland, Alexander Parkes","f":0,"loc":"Belgium / USA / UK","rg":["North & Central America","Europe"],"yr":1907,"era":"1900–1949","tag":"Invention","x":"In 1862 Alexander Parkes of Birmingham showed 'Parkesine', the first human-made plastic, made from cellulose. In 1907 the Belgian-American chemist Leo Baekeland made Bakelite from phenol and formaldehyde – the first fully synthetic plastic. Once set, it could not be melted, so it was perfect for electrical insulators, telephones and radios. Today plastics are everywhere, and their pollution is one of the great challenges for chemists.","q":"What is the difference between a thermoplastic and a thermoset?"},{"id":"chem-047","t":"Lithium batteries and a 97-year-old Nobel winner","s":"Chemistry","tp":"Electrochemistry","sub":"Cells and batteries","lv":["GCSE","A-Level"],"who":"John Goodenough, Stanley Whittingham, Akira Yoshino","f":0,"loc":"USA / UK / Japan","rg":["East Asia","North & Central America","Europe"],"yr":2019,"era":"2000 onwards","tag":"Invention","x":"In the 1970s oil crisis, Stanley Whittingham in the USA made a battery using lithium, but it could catch fire. In 1980 John Goodenough, working at Oxford, found a better cathode material, cobalt oxide, giving much higher voltage. In 1985 Akira Yoshino in Japan replaced pure lithium with a carbon material, making it safe enough to sell. Lithium-ion batteries now power phones, laptops and electric cars. In 2019 the three shared the Nobel Prize in Chemistry; Goodenough, at 97, was the oldest winner ever.","q":"Why are lithium-ion batteries rechargeable?"},{"id":"chem-048","t":"Velcro from burdock burrs","s":"Biology","tp":"Adaptations","sub":"Biomimicry","lv":["KS3","GCSE"],"who":"George de Mestral","f":0,"loc":"Switzerland","rg":["Europe"],"yr":1941,"era":"1900–1949","tag":"Invention","x":"In 1941 the Swiss engineer George de Mestral came back from a walk in the Alps with his dog and found both covered in burdock burrs. Under a microscope he saw that the burrs had tiny hooks that caught on loops in fabric and fur. It took him years to copy it in nylon, but in 1955 he patented 'Velcro', from the French velours (velvet) and crochet (hook). Copying designs from nature is called biomimicry.","q":"What advantage does having hooks give a burdock plant?"},{"id":"chem-049","t":"Le Chatelier and the fizzy drink","s":"Chemistry","tp":"Rates and equilibrium","sub":"Equilibrium","lv":["GCSE","A-Level"],"who":"Henry Le Chatelier","f":0,"loc":"France","rg":["Europe"],"yr":1884,"era":"1800s","tag":"Everyday","x":"In 1884 the French chemist Henry Le Chatelier stated that if you change the conditions of a reaction at equilibrium, it shifts to counteract the change. A fizzy drink shows it: opening the bottle lowers the pressure, so dissolved carbon dioxide comes out of solution. Le Chatelier also tried to make ammonia from nitrogen and hydrogen before Haber, but an explosion nearly killed his assistant and he gave up. He later said that letting this discovery slip was the greatest blunder of his career.","q":"Why does a warm fizzy drink go flat faster than a cold one?"},{"id":"chem-050","t":"Swansea, Copperopolis","s":"Chemistry","tp":"Reactivity","sub":"Extracting metals","lv":["KS3","GCSE"],"who":"","f":0,"loc":"Wales","rg":["Europe"],"yr":1850,"era":"1800s","tag":"Everyday","x":"In the 1800s, the lower Swansea valley in Wales smelted most of the world's copper, earning the nickname 'Copperopolis'. Ore came from Cornwall, Anglesey, Chile and Cuba, and the furnaces used local coal. The smelting released sulphur dioxide and other fumes that killed vegetation and made the valley one of the most polluted places in Europe. From the 1960s, a major project cleaned up the land, and much of it is green again.","q":"What gas is produced when copper sulphide ores are roasted, and why is it harmful?"},{"id":"chem-051","t":"Ellen Swallow Richards: first woman at MIT","s":"Chemistry","tp":"Chemical analysis","sub":"Water testing","lv":["KS3","GCSE"],"who":"Ellen Swallow Richards","f":1,"loc":"USA","rg":["North & Central America"],"yr":1873,"era":"1800s","tag":"Hidden figure","x":"In 1870 Ellen Swallow became the first woman admitted to the Massachusetts Institute of Technology – as a 'special student' who did not pay fees, so the college could deny she was officially a student if anyone objected. She graduated in chemistry in 1873. She went on to carry out a massive survey of water quality in Massachusetts, testing tens of thousands of samples, which led to the first state water-quality standards in the USA. She founded a women's laboratory at MIT.","q":"What tests could you do to check if water is safe to drink?"},{"id":"chem-052","t":"Fireworks colours","s":"Chemistry","tp":"Chemical analysis","sub":"Flame tests","lv":["KS3","GCSE"],"who":"","f":0,"loc":"China / Worldwide","rg":["East Asia"],"yr":1830,"era":"1800s","tag":"Everyday","x":"Firework colours come from metal ions heated until their electrons jump to higher energy levels and then fall back, emitting light of particular colours. Strontium gives red, sodium yellow-orange, barium green, copper blue and lithium crimson. Blue is the hardest colour to make well, because the copper compounds break down if the flame is too hot. The same principle lets chemists identify metals in flame tests.","q":"Why does each metal give a different flame colour?"},{"id":"chem-053","t":"Percy Julian's soybean chemistry","s":"Chemistry","tp":"Organic chemistry","sub":"Synthesis","lv":["GCSE","A-Level"],"who":"Percy Julian","f":0,"loc":"USA","rg":["North & Central America"],"yr":1935,"era":"1900–1949","tag":"Hidden figure","x":"Percy Julian, grandson of enslaved people, had to leave the USA to complete his doctorate in Vienna because of racial barriers. In 1935 he synthesised physostigmine, a drug for the eye disease glaucoma, proving a famous Oxford chemist's claims wrong. Then, at a company making soybean products, he found ways to make cheap hormones such as progesterone and cortisone from soybeans, making treatments for arthritis far more affordable. He held over 100 patents, despite facing racist attacks, including the firebombing of his home.","q":"Why is making a drug from a cheap starting material so important?"},{"id":"chem-054","t":"Mendeleev and the measuring of vodka? A myth","s":"Chemistry","tp":"How science works","sub":"Myths","lv":["KS3","GCSE"],"who":"Dmitri Mendeleev","f":0,"loc":"Russia","rg":["Europe"],"yr":1865,"era":"1800s","tag":"Everyday","x":"A popular story claims Mendeleev invented the standard 40% strength of Russian vodka. His doctoral thesis in 1865 was indeed about mixtures of alcohol and water – he studied how their volume shrinks when mixed – but historians have found no evidence he set the vodka standard, which existed before his work. It is a good reminder to check the evidence behind famous science stories.","q":"Why does mixing alcohol and water give less volume than you expect?"},{"id":"chem2-001","t":"Del Río's vanadium – discovered, then denied","s":"Chemistry","tp":"Periodic table","sub":"Discovery of elements","lv":["GCSE","A-Level"],"who":"Andrés Manuel del Río, Nils Sefström","f":0,"loc":"Mexico / Spain / Sweden","rg":["North & Central America","Europe"],"yr":1801,"era":"1800s","tag":"Blunder","x":"In 1801 Andrés Manuel del Río, a Spanish-born professor at the mining school in Mexico City, found a new element in a lead ore. Because its salts showed many colours, he called it panchromium, later erythronium. A French chemist wrongly told him it was just impure chromium, and del Río withdrew his claim. In 1831 the Swedish chemist Nils Sefström rediscovered it and named it vanadium after the Norse goddess Vanadís. It was then shown to be identical to del Río's element.","q":"Why might a scientist give up on a correct result?"},{"id":"chem2-002","t":"The Elhuyar brothers and tungsten","s":"Chemistry","tp":"Periodic table","sub":"Discovery of elements","lv":["GCSE"],"who":"Juan José Elhuyar, Fausto Elhuyar","f":0,"loc":"Spain","rg":["Europe"],"yr":1783,"era":"1700s","tag":"Discovery","x":"In 1783 the Spanish brothers Juan José and Fausto Elhuyar, working at a seminary in Bergara in the Basque Country, isolated a new metal from the mineral wolframite by heating its oxide with charcoal. They called it wolfram, which is why its symbol is W. In English it is usually called tungsten, from the Swedish for 'heavy stone'. Tungsten has the highest melting point of any metal, which is why it was used for light-bulb filaments.","q":"Why does a high melting point make tungsten good for filaments?"},{"id":"chem2-003","t":"Platinum: 'little silver' from South America","s":"Chemistry","tp":"Periodic table","sub":"Transition metals","lv":["GCSE"],"who":"Antonio de Ulloa","f":0,"loc":"Colombia / Ecuador / Spain","rg":["South America","Europe"],"yr":1748,"era":"1700s","tag":"Discovery","x":"Indigenous metalworkers in what is now Ecuador and Colombia worked with platinum alloys for centuries. Spanish gold miners found grains of a heavy white metal mixed with gold in rivers and called it platina – little silver – and considered it a nuisance, sometimes throwing it back. The Spanish naval officer Antonio de Ulloa described it in 1748, sparking scientific interest in Europe. Platinum is now used in catalytic converters, jewellery and medical implants.","q":"Why is platinum used as a catalyst in car exhausts?"},{"id":"chem2-004","t":"Nok ironworkers of West Africa","s":"Chemistry","tp":"Reactivity","sub":"Extracting metals","lv":["KS3","GCSE"],"who":"","f":0,"loc":"Nigeria","rg":["Africa"],"yr":-500,"era":"Ancient","tag":"Discovery","x":"The Nok culture of what is now central Nigeria is famous for its terracotta sculptures, and it was also smelting iron by around 500 BCE or earlier. Iron smelting may have developed independently in parts of Africa. Smelters built clay furnaces and used bellows to blast air through burning charcoal and iron ore, so that carbon monoxide reduced the iron oxide to metal. Some traditional African furnaces even preheated the air, reaching very high temperatures.","q":"Write a word equation for reducing iron oxide with carbon monoxide."},{"id":"chem2-005","t":"Wootz steel and Damascus blades","s":"Chemistry","tp":"Materials","sub":"Alloys","lv":["GCSE","A-Level"],"who":"","f":0,"loc":"India / Sri Lanka / Syria","rg":["Middle East","South Asia"],"yr":300,"era":"Ancient","tag":"Discovery","x":"Over 2,000 years ago, smiths in southern India and Sri Lanka made 'wootz' steel by melting iron with plant material in sealed clay crucibles. Traded to the Middle East, it was forged into Damascus swords with wavy patterns that were famously sharp and tough. The secret was lost around the 1700s. In 2006 a team in Germany found carbon nanotubes and nanowires inside a 17th-century Damascus sabre, which may explain its properties.","q":"Why are alloys often harder than pure metals?"},{"id":"chem2-006","t":"Cai Lun and paper","s":"Chemistry","tp":"Materials","sub":"Natural polymers","lv":["KS3"],"who":"Cai Lun","f":0,"loc":"China","rg":["East Asia"],"yr":105,"era":"Ancient","tag":"Invention","x":"Around 105 CE, Cai Lun, an official at the Han dynasty court, improved papermaking by pulping tree bark, hemp waste, old rags and fishing nets, then spreading the mush thinly on screens to dry. Fragments of earlier paper exist, but he made it practical and is honoured in China as its inventor. Paper is made of cellulose fibres – a natural polymer – that bond together as the water dries. The technique reached the Islamic world around 751 and Europe centuries later.","q":"Why do cellulose fibres stick together as paper dries?"},{"id":"chem2-007","t":"Chika Kuroda: Japan's first woman chemistry graduate","s":"Chemistry","tp":"Organic chemistry","sub":"Natural products","lv":["GCSE","A-Level"],"who":"Chika Kuroda, Riko Majima","f":1,"loc":"Japan","rg":["East Asia"],"yr":1916,"era":"1900–1949","tag":"Hidden figure","x":"In 1913 Chika Kuroda became one of the first three women admitted to a Japanese imperial university, Tohoku. She graduated in chemistry in 1916, the first Japanese woman to earn a science degree. She determined the structures of natural pigments, including carthamin from safflower, used as a red dye and in lipstick, and shikonin from purple gromwell. She later studied compounds in onion skins and developed a treatment for high blood pressure.","q":"How do chemists work out the structure of a natural pigment?"},{"id":"chem2-008","t":"Irène Joliot-Curie makes radioactivity","s":"Chemistry","tp":"Atomic structure","sub":"Artificial radioactivity","lv":["GCSE","A-Level"],"who":"Irène Joliot-Curie, Frédéric Joliot-Curie","f":1,"loc":"France","rg":["Europe"],"yr":1934,"era":"1900–1949","tag":"Discovery","x":"Marie Curie's daughter Irène and her husband Frédéric bombarded aluminium foil with alpha particles in 1934. When they removed the alpha source, the foil kept giving off radiation, which fell away with a half-life of about three minutes. They had made a radioactive isotope of phosphorus that does not exist naturally – the first artificial radioactivity. Marie Curie lived just long enough to hear of it. They won the 1935 Nobel Prize in Chemistry. Today artificial isotopes are used in medicine and industry.","q":"How could they tell the radiation came from a new isotope, not the alpha source?"},{"id":"chem2-009","t":"Gilbert Lewis: the cubic atom and no Nobel","s":"Chemistry","tp":"Bonding","sub":"Covalent bonding","lv":["GCSE","A-Level"],"who":"Gilbert N. Lewis, Irving Langmuir","f":0,"loc":"USA","rg":["North & Central America"],"yr":1916,"era":"1900–1949","tag":"Discovery","x":"In 1902 Gilbert Lewis sketched atoms as cubes with electrons at the corners, and in 1916 he proposed that atoms can share pairs of electrons – the covalent bond – drawing the dot diagrams students still use. He also coined the word 'photon' and made the first pure heavy water. He was nominated for the Nobel Prize 41 times but never won. In 1946 he was found dead in his lab after working with hydrogen cyanide; the cause was never fully explained.","q":"Draw a dot-and-cross diagram for a water molecule."},{"id":"chem2-010","t":"Linus Pauling: two unshared Nobel Prizes","s":"Chemistry","tp":"Bonding","sub":"Electronegativity","lv":["A-Level"],"who":"Linus Pauling, Ava Helen Pauling","f":1,"loc":"USA","rg":["North & Central America"],"yr":1954,"era":"1950–1999","tag":"Discovery","x":"Linus Pauling explained chemical bonds using quantum mechanics and created the electronegativity scale, which tells how strongly atoms attract shared electrons. He showed that proteins fold into helices and that sickle cell anaemia is caused by a faulty haemoglobin molecule. He won the 1954 Nobel Prize in Chemistry. Encouraged by his wife, Ava Helen, he campaigned against nuclear weapons tests and won the 1962 Nobel Peace Prize – the only person to win two unshared Nobel Prizes. He also raced Watson and Crick to DNA's structure and proposed a wrong triple helix.","q":"How does electronegativity explain why water molecules are polar?"},{"id":"chem2-011","t":"Frances Arnold: evolution in a test tube","s":"Chemistry","tp":"Rates and equilibrium","sub":"Enzymes","lv":["GCSE","A-Level"],"who":"Frances Arnold","f":1,"loc":"USA","rg":["North & Central America"],"yr":1993,"era":"1950–1999","tag":"Modern research","x":"Enzymes are amazing catalysts, but designing new ones from scratch is extremely hard. In 1993 Frances Arnold tried a different approach: make random mutations in the gene for an enzyme, test the variants, keep the best, and repeat – evolution by artificial selection in the lab. Her 'directed evolution' produces enzymes that make medicines, biofuels and greener chemicals. In 2018 she became the fifth woman to win the Nobel Prize in Chemistry. She has said she doesn't try to understand every detail; she lets evolution do the design work.","q":"How is directed evolution like selective breeding?"},{"id":"chem2-012","t":"Carolyn Bertozzi's chemistry inside living cells","s":"Chemistry","tp":"Organic chemistry","sub":"Reactions","lv":["A-Level"],"who":"Carolyn Bertozzi, Morten Meldal, Barry Sharpless","f":1,"loc":"USA / Denmark","rg":["North & Central America","Europe"],"yr":2004,"era":"2000 onwards","tag":"Modern research","x":"Barry Sharpless and Morten Meldal developed 'click chemistry': reactions that snap molecules together quickly and reliably, like buckles. But the copper catalyst they used is toxic to cells. Carolyn Bertozzi found a way to make click reactions work without copper, inside living organisms, without disturbing the cell's own chemistry – 'bioorthogonal' chemistry. It is used to track molecules in cells and to develop targeted cancer treatments. The three shared the 2022 Nobel Prize in Chemistry; Sharpless had already won in 2001.","q":"Why would a reaction that works inside cells be useful in medicine?"},{"id":"chem2-013","t":"Berzelius gives elements their letters","s":"Chemistry","tp":"Atomic structure","sub":"Symbols and formulae","lv":["KS3","GCSE"],"who":"Jöns Jacob Berzelius","f":0,"loc":"Sweden","rg":["Europe"],"yr":1813,"era":"1800s","tag":"Invention","x":"Dalton drew elements as circles with symbols inside, which were hard to print. In 1813 the Swedish chemist Jöns Jacob Berzelius proposed using one or two letters from each element's Latin name: H, O, C, and Na from natrium, K from kalium, Fe from ferrum, Pb from plumbum. He accurately measured the atomic masses of dozens of elements, discovered silicon, selenium, thorium and cerium, and coined the words 'catalysis', 'polymer' and 'protein'.","q":"Why do some elements have symbols that don't match their English names?"},{"id":"chem2-014","t":"Svante Arrhenius: the thesis nearly failed","s":"Chemistry","tp":"Electrochemistry","sub":"Ions","lv":["GCSE","A-Level"],"who":"Svante Arrhenius","f":0,"loc":"Sweden","rg":["Europe"],"yr":1884,"era":"1800s","tag":"Discovery","x":"In 1884 Svante Arrhenius submitted his PhD thesis proposing that salts dissolved in water split into charged particles – ions – even without electricity. His examiners in Uppsala thought it so unlikely they gave him the lowest possible pass. He kept developing the idea, explaining acids as substances that release hydrogen ions. In 1903 he won the Nobel Prize in Chemistry for the same theory. In 1896 he also calculated that doubling atmospheric carbon dioxide would warm Earth by several degrees.","q":"Why does salt water conduct electricity but pure water barely does?"},{"id":"chem2-015","t":"The Bunsen burner wasn't Bunsen's","s":"Chemistry","tp":"Chemical analysis","sub":"Apparatus","lv":["KS3"],"who":"Robert Bunsen, Peter Desaga, Michael Faraday","f":0,"loc":"Germany","rg":["Europe"],"yr":1855,"era":"1800s","tag":"Everyday","x":"Robert Bunsen needed a hot, clean, nearly colourless flame for studying the colours of heated elements. In 1855 his technician at Heidelberg, Peter Desaga, built a burner based on Bunsen's design, which mixed gas and air before burning; Michael Faraday had used a similar burner earlier. Desaga sold them widely and the name Bunsen burner stuck. Bunsen refused to patent it. He lost the sight of one eye in an explosion of an arsenic compound.","q":"Why does opening the air hole make the flame hotter and blue?"},{"id":"bio-001","t":"Leeuwenhoek's 'animalcules'","s":"Biology","tp":"Cells","sub":"Microscopy","lv":["KS3","GCSE"],"who":"Antonie van Leeuwenhoek","f":0,"loc":"Netherlands","rg":["Europe"],"yr":1676,"era":"1500–1699","tag":"Discovery","x":"Antonie van Leeuwenhoek was a cloth merchant in Delft with no university training. He ground tiny, near-perfect glass lenses to inspect fabric, and his single-lens microscopes magnified up to about 270 times. In 1676 he wrote to the Royal Society in London describing 'animalcules' swimming in pond water, and later in the plaque scraped from his own teeth – the first descriptions of bacteria and protists. The Royal Society sent observers to check. He kept his lens-making method secret until his death.","q":"Why did microorganisms remain unknown until the 1600s?"},{"id":"bio-002","t":"Schleiden, Schwann and Virchow: everything is cells","s":"Biology","tp":"Cells","sub":"Cell theory","lv":["GCSE","A-Level"],"who":"Matthias Schleiden, Theodor Schwann, Rudolf Virchow, Robert Remak","f":0,"loc":"Germany / Poland","rg":["Europe"],"yr":1839,"era":"1800s","tag":"Discovery","x":"In 1838 the botanist Matthias Schleiden concluded that plants are made of cells. Over dinner, he discussed it with Theodor Schwann, who realised animal tissues he had seen looked similar, and in 1839 he proposed that all living things are made of cells. They thought new cells might crystallise out of fluid. Robert Remak showed that cells come from other cells by division, and Rudolf Virchow popularised the idea in 1855 with the phrase 'omnis cellula e cellula' – every cell from a cell – without crediting Remak.","q":"What are the three main ideas of cell theory?"},{"id":"bio-003","t":"Lynn Margulis and the cells within cells","s":"Biology","tp":"Cells","sub":"Organelles","lv":["GCSE","A-Level"],"who":"Lynn Margulis","f":1,"loc":"USA","rg":["North & Central America"],"yr":1967,"era":"1950–1999","tag":"Hidden figure","x":"Mitochondria and chloroplasts have their own DNA, divide like bacteria and have double membranes. In 1967 Lynn Margulis argued that they were once free-living bacteria that were swallowed by larger cells and stayed on as partners – endosymbiosis. Her paper was reportedly rejected by around 15 journals before it was published. Many biologists dismissed the idea, but DNA evidence later proved her right. It is now a central idea in biology.","q":"What evidence suggests mitochondria were once bacteria?"},{"id":"bio-004","t":"Carl Woese finds a new domain of life","s":"Biology","tp":"Classification","sub":"Domains","lv":["GCSE","A-Level"],"who":"Carl Woese, George Fox","f":0,"loc":"USA","rg":["North & Central America"],"yr":1977,"era":"1950–1999","tag":"Discovery","x":"Living things were once divided into prokaryotes (bacteria) and eukaryotes. In 1977, Carl Woese and George Fox compared the RNA in ribosomes of many microbes and found that some methane-producing microbes were as different from bacteria as bacteria are from humans. They called them archaea. Many live in extreme places such as hot springs and salt lakes. Life is now usually divided into three domains: Bacteria, Archaea and Eukarya. Many scientists rejected Woese's idea at first.","q":"Why did comparing molecules reveal differences that microscopes could not?"},{"id":"bio-005","t":"Pasteur's swan-neck flasks","s":"Biology","tp":"Microorganisms","sub":"Germ theory","lv":["KS3","GCSE"],"who":"Louis Pasteur","f":0,"loc":"France","rg":["Europe"],"yr":1859,"era":"1800s","tag":"Discovery","x":"Many people believed that microbes appeared spontaneously in rotting food. In 1859 Louis Pasteur boiled broth in flasks with long, S-shaped 'swan necks'. Air could reach the broth, but dust and microbes got trapped in the bend. The broth stayed clear for months – some of his flasks are still sterile today. When he snapped the neck off, the broth soon went cloudy with microbes. Pasteur went on to develop pasteurisation and vaccines for anthrax and rabies.","q":"What was the control in Pasteur's experiment?"},{"id":"bio-006","t":"Semmelweis: wash your hands","s":"Biology","tp":"Disease and immunity","sub":"Infection control","lv":["KS3","GCSE"],"who":"Ignaz Semmelweis","f":0,"loc":"Hungary / Austria","rg":["Europe"],"yr":1847,"era":"1800s","tag":"Tragedy","x":"In 1840s Vienna, mothers giving birth in a ward run by doctors died of fever far more often than those in a ward run by midwives. The Hungarian doctor Ignaz Semmelweis noticed that doctors came straight from dissecting corpses. When a colleague died after cutting his finger during a dissection, Semmelweis realised 'cadaverous particles' were being carried on hands. He made staff wash their hands in chlorinated lime, and deaths fell dramatically. But other doctors were offended, and he was ridiculed. He died in an asylum in 1865, just before germ theory proved him right.","q":"Why might people reject evidence that they are causing harm?"},{"id":"bio-007","t":"Florence Nightingale's statistics","s":"Biology","tp":"Health","sub":"Data","lv":["KS3","GCSE"],"who":"Florence Nightingale","f":1,"loc":"UK / Turkey","rg":["Middle East","Europe"],"yr":1858,"era":"1800s","tag":"Hidden figure","x":"Florence Nightingale is famous as 'the lady with the lamp' who nursed soldiers in the Crimean War, but she was also a pioneering statistician. At the military hospital in Scutari, Turkey, she found that far more soldiers were dying from diseases caused by poor hygiene than from wounds. She presented her data in striking 'rose' diagrams that politicians could understand at a glance, helping bring in sanitary reforms. In 1859 she became the first woman elected to the Royal Statistical Society.","q":"Why might a diagram persuade people better than a table?"},{"id":"bio-008","t":"John Snow and the Broad Street pump","s":"Biology","tp":"Disease and immunity","sub":"Epidemiology","lv":["KS3","GCSE"],"who":"John Snow","f":0,"loc":"UK","rg":["Europe"],"yr":1854,"era":"1800s","tag":"Discovery","x":"In 1854 cholera killed over 600 people in a few weeks in Soho, London. Most doctors believed it spread through 'bad air'. The physician John Snow marked each death on a map and found they clustered around a water pump on Broad Street. Workers at a nearby brewery, who drank beer, were mostly spared. He persuaded officials to remove the pump handle. It was later found the well was contaminated by a cesspit nearby. Snow's map is a founding moment of epidemiology.","q":"What sort of evidence did Snow use to identify the cause?"},{"id":"bio-009","t":"Lady Mary Wortley Montagu and the Ottoman inoculation","s":"Biology","tp":"Disease and immunity","sub":"Vaccination","lv":["KS3","GCSE"],"who":"Lady Mary Wortley Montagu, Onesimus","f":1,"loc":"Turkey / UK / USA","rg":["Middle East","North & Central America","Europe"],"yr":1721,"era":"1700s","tag":"Hidden figure","x":"Smallpox killed millions. Living in Constantinople as wife of the British ambassador, Lady Mary Wortley Montagu – who had survived smallpox herself – saw older women deliberately infect healthy people with a little material from a mild case, usually giving lifelong protection. She had her son inoculated there and, back in London in 1721, her daughter. In Boston the same year, an enslaved West African man named Onesimus told the minister Cotton Mather that he had been inoculated in Africa, and Mather promoted it during an epidemic. Inoculation had been practised in China, India and Africa for centuries.","q":"Why does exposure to a mild infection protect against a severe one?"},{"id":"bio-010","t":"Edward Jenner and the milkmaid","s":"Biology","tp":"Disease and immunity","sub":"Vaccination","lv":["KS3","GCSE"],"who":"Edward Jenner, Sarah Nelmes, James Phipps","f":1,"loc":"UK","rg":["Europe"],"yr":1796,"era":"1700s","tag":"Discovery","x":"Country people believed that milkmaids who caught cowpox, a mild disease, never got smallpox. In May 1796, the Gloucestershire doctor Edward Jenner took fluid from a cowpox sore on the hand of the milkmaid Sarah Nelmes, who had caught it from a cow named Blossom, and scratched it into the arm of eight-year-old James Phipps. Later he exposed James to smallpox, and the boy did not fall ill. Jenner called the process vaccination, from the Latin vacca, cow. Smallpox was declared eradicated in 1980 – the only human disease ever wiped out.","q":"Would Jenner's experiment be allowed today? Why not?"},{"id":"bio-011","t":"Fleming's mouldy plate – and the team that made penicillin","s":"Biology","tp":"Disease and immunity","sub":"Antibiotics","lv":["KS3","GCSE","A-Level"],"who":"Alexander Fleming, Howard Florey, Ernst Chain, Norman Heatley, Mary Hunt","f":1,"loc":"UK / USA","rg":["North & Central America","Europe"],"yr":1928,"era":"1900–1949","tag":"Accident","x":"In September 1928 Alexander Fleming returned from holiday to find mould growing on a dish of bacteria in his London lab – and around it, the bacteria had died. He named the substance penicillin but could not purify it. A decade later at Oxford, Howard Florey, Ernst Chain and Norman Heatley found how to extract it, using bedpans, milk churns and bathtubs, with a team of 'penicillin girls' tending the cultures. Mass production in the USA needed a better mould; the best strain came from a mouldy cantaloupe at a market in Peoria, Illinois, brought in by lab worker Mary Hunt, nicknamed 'Mouldy Mary'.","q":"Why did it take so long to turn Fleming's discovery into a medicine?"},{"id":"bio-012","t":"Fanny Hesse's jelly","s":"Biology","tp":"Microorganisms","sub":"Culturing","lv":["KS3","GCSE"],"who":"Fanny Angelina Hesse, Walther Hesse, Robert Koch","f":1,"loc":"Germany / USA / Indonesia","rg":["Southeast Asia","North & Central America","Europe"],"yr":1881,"era":"1800s","tag":"Hidden figure","x":"In 1881 Walther Hesse was growing bacteria in Robert Koch's lab in Berlin, but the gelatine he used melted in warm weather and some microbes digested it. His wife Fanny, who drew illustrations for his research, suggested agar, a seaweed jelly she used for jams and puddings; she had learned about it from a Dutch neighbour who had lived in Java. Agar stays solid at body temperature and microbes cannot eat it. Koch used it to grow the tuberculosis bacterium. Agar plates – usually in Julius Petri's dishes – are still used in every microbiology lab.","q":"Why must a culture medium stay solid at 37 °C?"},{"id":"bio-013","t":"Robert Koch's postulates","s":"Biology","tp":"Disease and immunity","sub":"Germ theory","lv":["GCSE","A-Level"],"who":"Robert Koch","f":0,"loc":"Germany","rg":["Europe"],"yr":1882,"era":"1800s","tag":"Discovery","x":"Robert Koch was a country doctor in Germany when, using a microscope his wife gave him for his birthday, he showed that anthrax is caused by a particular bacterium. In 1882 he announced that he had found the bacterium causing tuberculosis, then responsible for one in seven deaths in Europe. He set out rules, Koch's postulates, for proving that a microbe causes a disease: find it in every case, grow it pure, cause the disease with it, and recover it again. He won the Nobel Prize in 1905.","q":"Why is it important to grow a pure culture of a microbe?"},{"id":"bio-014","t":"Ilya Mechnikov and the starfish thorn","s":"Biology","tp":"Disease and immunity","sub":"White blood cells","lv":["GCSE","A-Level"],"who":"Ilya Mechnikov","f":0,"loc":"Russia / Italy / France","rg":["Europe"],"yr":1882,"era":"1800s","tag":"Discovery","x":"In 1882, at his home lab in Messina, Sicily, the Russian zoologist Ilya Mechnikov was watching transparent starfish larvae under a microscope. He wondered if their mobile cells defended them against invaders, so he pushed rose thorns into the larvae. The next morning, the thorns were surrounded by cells trying to engulf them. He named these cells phagocytes – 'eating cells' – the basis of our white blood cell defences. He shared the 1908 Nobel Prize.","q":"How do phagocytes protect the body?"},{"id":"bio-015","t":"Katalin Karikó: demoted, then a Nobel","s":"Biology","tp":"Disease and immunity","sub":"Vaccines","lv":["GCSE","A-Level"],"who":"Katalin Karikó, Drew Weissman","f":1,"loc":"Hungary / USA","rg":["North & Central America","Europe"],"yr":2005,"era":"2000 onwards","tag":"Hidden figure","x":"Katalin Karikó left Hungary in 1985 with her family and their savings hidden in her daughter's teddy bear. In the USA she worked for decades on messenger RNA, believing it could instruct cells to make medicines, but grants kept being rejected and she was demoted. Injected mRNA caused dangerous inflammation. With immunologist Drew Weissman, she found in 2005 that a small chemical change to one of the RNA building blocks stopped this. That work made the COVID-19 mRNA vaccines possible, and they won the 2023 Nobel Prize.","q":"How does an mRNA vaccine teach the immune system?"},{"id":"bio-016","t":"Jonas Salk: could you patent the sun?","s":"Biology","tp":"Disease and immunity","sub":"Vaccines","lv":["KS3","GCSE"],"who":"Jonas Salk, Albert Sabin","f":0,"loc":"USA","rg":["North & Central America"],"yr":1955,"era":"1950–1999","tag":"Discovery","x":"Polio paralysed hundreds of thousands of children a year. In 1954 Jonas Salk's injected vaccine, made from killed virus, was tested on over a million American children – one of the largest medical trials ever. When it was declared safe in 1955, church bells rang. Asked who owned the patent, Salk replied that there was none: could you patent the sun? Albert Sabin later made a cheaper oral vaccine given on a sugar lump. Polio is now close to being eradicated.","q":"Why might a scientist choose not to patent an invention?"},{"id":"bio-017","t":"Françoise Barré-Sinoussi and HIV","s":"Biology","tp":"Disease and immunity","sub":"Viruses","lv":["GCSE","A-Level"],"who":"Françoise Barré-Sinoussi, Luc Montagnier","f":1,"loc":"France","rg":["Europe"],"yr":1983,"era":"1950–1999","tag":"Discovery","x":"In the early 1980s a mysterious illness was destroying people's immune systems. In 1983 Françoise Barré-Sinoussi, working with Luc Montagnier at the Pasteur Institute in Paris, isolated a virus from a patient's lymph node and showed it was a retrovirus: HIV. Their discovery made blood tests and treatments possible. Barré-Sinoussi shared the 2008 Nobel Prize and has worked for decades with doctors in Africa and Asia.","q":"Why does a virus that attacks immune cells make other infections dangerous?"},{"id":"bio-018","t":"Ronald Ross and the mosquito","s":"Biology","tp":"Disease and immunity","sub":"Malaria","lv":["GCSE"],"who":"Ronald Ross, Alphonse Laveran","f":0,"loc":"India / UK / France / Algeria","rg":["Africa","South Asia","Europe"],"yr":1897,"era":"1800s","tag":"Discovery","x":"In 1880 the French army doctor Alphonse Laveran, in Algeria, saw the malaria parasite in a patient's blood. But how did it spread? Ronald Ross, a British army doctor in India, dissected hundreds of mosquitoes. On 20 August 1897 in Secunderabad, he found the parasite in the stomach of an Anopheles mosquito that had fed on an infected patient. He later showed how birds' malaria is passed on by mosquitoes. Ross won the Nobel Prize in 1902 and also wrote poetry and novels.","q":"Why is killing mosquitoes a way to control malaria?"},{"id":"bio-019","t":"Insulin: from a dog lab to a dying boy","s":"Biology","tp":"Body systems","sub":"Hormones","lv":["KS3","GCSE"],"who":"Frederick Banting, Charles Best, James Collip, John Macleod","f":0,"loc":"Canada","rg":["North & Central America"],"yr":1922,"era":"1900–1949","tag":"Discovery","x":"Before 1922, type 1 diabetes was a death sentence; doctors could only prescribe starvation diets. In Toronto, Frederick Banting and student Charles Best extracted a substance from dog pancreases that lowered blood sugar. Biochemist James Collip purified it. In January 1922, 14-year-old Leonard Thompson, near death, received insulin and recovered. A story tells of Banting's team going round a ward of comatose children, injecting them one by one, as the first woke before the last was injected. Banting sold the patent for one dollar so it could be made widely.","q":"How does insulin control blood glucose?"},{"id":"bio-020","t":"Miescher finds DNA in pus","s":"Biology","tp":"Genetics","sub":"DNA","lv":["GCSE","A-Level"],"who":"Friedrich Miescher","f":0,"loc":"Switzerland / Germany","rg":["Europe"],"yr":1869,"era":"1800s","tag":"Discovery","x":"In 1869 the young Swiss doctor Friedrich Miescher was studying white blood cells, which he collected from pus-soaked bandages from a nearby hospital in Tübingen. He found a substance in the cell nuclei that was not protein and was rich in phosphorus. He called it 'nuclein'. It was DNA. Almost no one realised its importance for over 70 years, and most scientists assumed proteins must carry genetic information.","q":"Why did scientists think proteins, not DNA, carried genes?"},{"id":"bio-021","t":"Rosalind Franklin and Photo 51","s":"Biology","tp":"Genetics","sub":"DNA structure","lv":["GCSE","A-Level"],"who":"Rosalind Franklin, Raymond Gosling, Maurice Wilkins, James Watson, Francis Crick","f":1,"loc":"UK","rg":["Europe"],"yr":1953,"era":"1950–1999","tag":"Hidden figure","x":"At King's College London in 1952, Rosalind Franklin and her student Raymond Gosling took superb X-ray diffraction images of DNA, including 'Photo 51', whose X-shaped pattern showed DNA is a helix. Without her knowledge, Maurice Wilkins showed it to James Watson, and Franklin's data also reached Watson and Crick in a report. In 1953 they built their double helix model. Franklin went on to do important work on viruses and died of cancer in 1958, aged 37. The 1962 Nobel Prize went to Watson, Crick and Wilkins; Nobels are not awarded after death.","q":"Is it fair to use another scientist's data without permission?"},{"id":"bio-022","t":"Mendel's peas and forgotten genetics","s":"Biology","tp":"Genetics","sub":"Inheritance","lv":["KS3","GCSE"],"who":"Gregor Mendel","f":0,"loc":"Czech Republic","rg":["Europe"],"yr":1866,"era":"1800s","tag":"Discovery","x":"Gregor Mendel, a monk in Brno, failed his teaching exam twice but became a pioneering scientist. Between 1856 and 1863 he grew around 28,000 pea plants in the monastery garden, carefully cross-breeding them and counting their offspring. He found that traits such as flower colour are passed on as separate 'factors' in predictable ratios, like 3:1. His 1866 paper was ignored; when he tried the same with hawkweed, it seemed not to work. In 1900 three botanists independently rediscovered his results, and genetics began.","q":"What does a 3:1 ratio in offspring tell you about the parents?"},{"id":"bio-023","t":"Nettie Stevens and the Y chromosome","s":"Biology","tp":"Genetics","sub":"Sex determination","lv":["GCSE","A-Level"],"who":"Nettie Stevens","f":1,"loc":"USA","rg":["North & Central America"],"yr":1905,"era":"1900–1949","tag":"Hidden figure","x":"How is sex decided? Many thought it depended on the mother's diet or temperature. In 1905 Nettie Stevens, who had worked as a teacher and librarian to save for university, studied mealworm cells under the microscope and noticed that males had a small chromosome that females lacked – the Y chromosome. She concluded that sex is decided by chromosomes. Edmund Wilson reached a similar idea at the same time and often got the credit. Stevens died of cancer in 1912.","q":"Which parent's chromosome decides the sex of a baby mammal?"},{"id":"bio-024","t":"Barbara McClintock's jumping genes","s":"Biology","tp":"Genetics","sub":"Mutation","lv":["A-Level"],"who":"Barbara McClintock","f":1,"loc":"USA","rg":["North & Central America"],"yr":1951,"era":"1950–1999","tag":"Hidden figure","x":"Barbara McClintock studied the speckled colours of maize kernels. In the 1940s she found that some pieces of DNA can move from one position on a chromosome to another, switching genes on or off – 'jumping genes', or transposons. When she presented the idea in 1951, scientists were baffled and she stopped publishing much of her work. Decades later, jumping genes were found in bacteria, animals and humans. She won the Nobel Prize in 1983, aged 81, alone.","q":"How could a moving gene produce speckled kernels?"},{"id":"bio-025","t":"CRISPR: a gene editor from salt marsh microbes","s":"Biology","tp":"Genetics","sub":"Genetic engineering","lv":["GCSE","A-Level"],"who":"Francisco Mojica, Emmanuelle Charpentier, Jennifer Doudna","f":1,"loc":"Spain / France / USA","rg":["North & Central America","Europe"],"yr":2012,"era":"2000 onwards","tag":"Discovery","x":"In the 1990s, Francisco Mojica at the University of Alicante noticed strange repeated sequences in the DNA of microbes from salt marshes. He realised they were a kind of immune system: bacteria store snippets of virus DNA so they can recognise and cut up the virus next time. In 2012, Emmanuelle Charpentier and Jennifer Doudna showed this CRISPR system could be turned into a precise tool for cutting any DNA sequence. It is now used to treat sickle cell disease. They won the 2020 Nobel Prize in Chemistry.","q":"Why is gene editing controversial?"},{"id":"bio-026","t":"Darwin, Wallace and the race to publish","s":"Biology","tp":"Evolution","sub":"Natural selection","lv":["KS3","GCSE","A-Level"],"who":"Charles Darwin, Alfred Russel Wallace","f":0,"loc":"UK / Wales / Indonesia","rg":["Southeast Asia","Europe"],"yr":1858,"era":"1800s","tag":"Rivalry","x":"Charles Darwin had worked on natural selection for 20 years without publishing. In 1858 a letter arrived from Alfred Russel Wallace, born in Usk in Monmouthshire, who was collecting animals in what is now Indonesia. During a bout of malarial fever, Wallace had worked out the same theory. Darwin's friends arranged for both men's ideas to be presented together at the Linnean Society, and Darwin rushed out 'On the Origin of Species' in 1859. Wallace was generous, calling the theory 'Darwinism', and identified the 'Wallace Line' dividing Asian and Australian animals.","q":"Why might two people make the same discovery at the same time?"},{"id":"bio-027","t":"Darwin's tasting menu","s":"Biology","tp":"Evolution","sub":"Darwin","lv":["KS3","GCSE"],"who":"Charles Darwin","f":0,"loc":"UK / Galápagos","rg":["South America","Europe"],"yr":1835,"era":"1800s","tag":"Eccentric","x":"As a student at Cambridge, Charles Darwin belonged to the Glutton Club, which ate unusual animals such as hawk and bittern. On the Beagle voyage he ate armadillo, puma and rhea, and in the Galápagos he ate giant tortoise. He also once put a beetle in his mouth because both hands were full of other beetles – it squirted acid and he lost all three. Back home he bred fancy pigeons to study variation and even played the bassoon to earthworms to test whether they could hear.","q":"How did breeding pigeons help Darwin think about natural selection?"},{"id":"bio-028","t":"The Grants and Darwin's finches","s":"Biology","tp":"Evolution","sub":"Natural selection","lv":["GCSE","A-Level"],"who":"Rosemary Grant, Peter Grant","f":1,"loc":"Galápagos (Ecuador) / UK","rg":["South America","Europe"],"yr":1977,"era":"1950–1999","tag":"Modern research","x":"From 1973, Rosemary and Peter Grant spent part of every year for 40 years on the tiny Galápagos island of Daphne Major, catching, measuring and tagging nearly every finch. In a drought in 1977, small seeds ran out, and finches with bigger, stronger beaks survived to breed; the next generation had measurably bigger beaks. They watched evolution happen in real time. They even saw a new lineage form after a male from another island arrived in 1981 – the 'Big Bird' lineage.","q":"Why did beak size change after the drought?"},{"id":"bio-029","t":"Peppered moths and the industrial revolution","s":"Biology","tp":"Evolution","sub":"Natural selection","lv":["KS3","GCSE"],"who":"Bernard Kettlewell, Michael Majerus","f":0,"loc":"UK","rg":["Europe"],"yr":1955,"era":"1950–1999","tag":"Discovery","x":"Peppered moths are usually pale and speckled, camouflaged on lichen-covered trees. In industrial Manchester in the 1800s, soot blackened the trees and a dark form became common – by 1895 about 98% of moths there were dark. In the 1950s Bernard Kettlewell showed birds ate more of the moths that stood out. His methods were criticised, so from 2001 Michael Majerus ran a careful seven-year study in Cambridge, which confirmed that bird predation drives the change. Since clean air laws, pale moths have returned.","q":"Explain the rise and fall of dark peppered moths using natural selection."},{"id":"bio-030","t":"Lenski's 75,000 generations","s":"Biology","tp":"Evolution","sub":"Natural selection","lv":["A-Level"],"who":"Richard Lenski","f":0,"loc":"USA","rg":["North & Central America"],"yr":1988,"era":"1950–1999","tag":"Modern research","x":"In 1988 Richard Lenski started 12 flasks of identical E. coli bacteria, and his team has transferred them to fresh food every day since – over 75,000 generations. Samples are frozen regularly, creating a 'fossil record' that can be revived. Around generation 31,500, one population evolved the ability to feed on citrate, something E. coli normally can't do in oxygen. By replaying evolution from frozen samples, the team showed this depended on earlier chance mutations.","q":"Why do bacteria let us watch evolution so much faster than animals?"},{"id":"bio-031","t":"Tiktaalik: the fish with a neck","s":"Biology","tp":"Evolution","sub":"Fossils","lv":["GCSE","A-Level"],"who":"Neil Shubin, Edward Daeschler, Farish Jenkins","f":0,"loc":"Canada (Nunavut)","rg":["North & Central America"],"yr":2004,"era":"2000 onwards","tag":"Discovery","x":"How did fish give rise to land animals? Neil Shubin and colleagues predicted that transitional fossils should be found in rocks about 375 million years old laid down in shallow streams. Studying geological maps, they chose Ellesmere Island in Arctic Canada and searched for four summers. In 2004 they found Tiktaalik: a fish with scales and gills, but also a flat head, a neck and sturdy fins with wrist-like bones. The name, chosen with local Inuit elders, means 'large freshwater fish'.","q":"How did the team use rock age to decide where to dig?"},{"id":"bio-032","t":"Lucy, Dinkinesh","s":"Biology","tp":"Evolution","sub":"Human evolution","lv":["KS3","GCSE"],"who":"Donald Johanson, Tom Gray","f":0,"loc":"Ethiopia","rg":["Africa"],"yr":1974,"era":"1950–1999","tag":"Discovery","x":"In November 1974, at Hadar in Ethiopia, Donald Johanson and Tom Gray spotted a fragment of arm bone. Over the following weeks the team recovered about 40% of a skeleton of a 3.2-million-year-old female Australopithecus afarensis. That evening they played a Beatles song that gave her the name Lucy; in Ethiopia she is called Dinkinesh, meaning 'you are marvellous' in Amharic. Her knees and pelvis show she walked upright, though her brain was ape-sized.","q":"What fea
