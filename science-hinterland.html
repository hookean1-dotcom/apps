const pills = d => d.lv.map(l => `<span class="pill">${l}</span>`).join('') + (d.f ? '<span class="pill w">Woman scientist</span>' : '');
const cardHTML = d => `<button type="button" class="card" data-id="${d.id}"><span class="art">${art(d)}</span><span class="cbody"><span class="subj"><i style="background:${col(d.s)}"></i>${esc(d.s)}, ${esc(d.tp)}</span><h3>${esc(d.t)}</h3><span class="subj">${meta(d)}</span><p>${esc(d.x)}</p><span class="pills">${pills(d)}</span></span></button>`;

let current = [];
function render() {
  current = results();
  const n = current.length;
  $('count').textContent = n === DATA.length ? `Showing all ${n} stories` : n ? `${n} ${n === 1 ? 'story matches' : 'stories match'}` : '';
  const today = !isFiltered() ? DATA[Math.floor(Date.now() / 864e5) % DATA.length] : null;
  $('todayWrap').innerHTML = today ? `<button type="button" class="today" data-id="${today.id}"><span class="art" style="aspect-ratio:auto;min-height:220px">${art(today)}</span><span class="cbody"><span class="subj"><i style="background:${col(today.s)}"></i>Story of the day: ${esc(today.s)}, ${esc(today.tp)}</span><h3>${esc(today.t)}</h3><span class="subj">${meta(today)}</span><p>${esc(today.x)}</p><span class="pills">${pills(today)}</span></span></button>` : '';
  $('grid').innerHTML = n ? current.slice(0, st.shown).map(cardHTML).join('') : `<div class="empty"><p>No stories match all of these filters.</p><button class="btn" type="button" data-reset>Clear all filters</button></div>`;
  $('moreBtn').classList.toggle('hide', n <= st.shown);
  $('moreBtn').textContent = `Show more stories (${n - Math.min(n, st.shown)} more)`;
  const on = new Set(current.map(d => d.id));
  for (const c of dots) c.classList.toggle('off', !on.has(c.dataset.id));
}

/* timeline */
const SEG = [[-1300,1500,.14],[1500,1800,.2],[1800,1900,.22],[1900,2030,.44]];
const xOf = (y, W) => { let acc = 0; for (const [a,b,w] of SEG) { if (y <= b) return (acc + w * (Math.max(y, a) - a) / (b - a)) * W; acc += w; } return W; };
let dots = [];
const svg = $('tl'), fig = $('fig'), tip = $('tip');
function layout(W, r) {
  const step = r * 2 + 1, cols = new Map(); let maxStack = 1;
  const pos = TL.map(d => { const cx = Math.round(xOf(d.yr, W - 2 * r) / step); const k = cols.get(cx) || 0; cols.set(cx, k + 1); if (k + 1 > maxStack) maxStack = k + 1; return [d, cx * step + r, k]; });
  return {pos, maxStack, step};
}
const TL = DATA.filter(d => d.yr != null).sort((a,b) => a.yr - b.yr || a.s.localeCompare(b.s));
function drawTimeline() {
  const W = fig.clientWidth, H = fig.clientHeight, base = H - 30;
  let r = 7, L = layout(W, r);
  while (r > 2.2 && L.maxStack * L.step > base - 6) { r -= .25; L = layout(W, r); }
  const vstep = Math.min(L.step, (base - 6) / L.maxStack);
  const pri = [[1900,'1900'],[2000,'2000'],[1800,'1800'],[1500,'1500'],[1950,'1950'],[1700,'1700'],[-1000,'1000 BCE'],[0,'0'],[1850,'1850'],[1000,'1000'],[1600,'1600'],[1925,'1925'],[1975,'1975']];
  const placed = [], gap = W < 520 ? 52 : 64;
  for (const [y,l] of pri) { const x = xOf(y, W - 2 * r) + r; if (placed.every(p => Math.abs(p[0] - x) > gap + (l.length > 4 ? 18 : 0))) placed.push([x, l]); }
  let s = `<line x1="0" x2="${W}" y1="${base + 4}" y2="${base + 4}" stroke="currentColor" stroke-width="1.5"></line>`;
  s += placed.map(([x,l]) => `<line x1="${x}" x2="${x}" y1="${base + 4}" y2="${base + 10}" stroke="currentColor"></line><text x="${x}" y="${base + 25}" font-size="13" text-anchor="${x < 34 ? 'start' : x > W - 34 ? 'end' : 'middle'}" fill="currentColor">${l}</text>`).join('');
  s += L.pos.map(([d,x,k]) => `<circle data-id="${d.id}" cx="${x.toFixed(1)}" cy="${(base - r - k * vstep).toFixed(1)}" r="${r.toFixed(2)}" fill="${col(d.s)}"></circle>`).join('');
  svg.innerHTML = s;
  dots = [...svg.querySelectorAll('circle')];
  const on = new Set(current.map(d => d.id));
  for (const c of dots) c.classList.toggle('off', !on.has(c.dataset.id));
}
const tlObs = new ResizeObserver(drawTimeline); tlObs.observe(fig);
svg.addEventListener('mousemove', e => {
  const c = e.target.closest('circle'); if (!c) { tip.classList.remove('on'); return; }
  const d = byId.get(c.dataset.id), b = fig.getBoundingClientRect();
  tip.innerHTML = `<b>${esc(d.t)}</b><br>${esc(yearTxt(d.yr))}`;
  const x = e.clientX - b.left, y = e.clientY - b.top;
  tip.style.left = Math.min(Math.max(x - 130, 0), b.width - 260) + 'px'; tip.style.top = Math.max(y - 64, 0) + 'px';
  tip.classList.add('on');
});
svg.addEventListener('mouseleave', () => tip.classList.remove('on'));
svg.addEventListener('click', e => { const c = e.target.closest('circle'); if (c) openStory(c.dataset.id); });

/* reader */
function related(d) {
  const w = d.who.split(',').map(s => s.trim()).filter(Boolean);
  return DATA.filter(o => o !== d).map(o => [o, (o.tp === d.tp ? 3 : 0) + (o.s === d.s ? 1 : 0) + (w.some(n => o.who.includes(n)) ? 6 : 0) + (o.sub === d.sub ? 2 : 0)])
    .filter(x => x[1] >= 4).sort((a,b) => b[1] - a[1]).slice(0, 5).map(x => x[0]);
}
let present = false;
function openStory(id, keepScroll) {
  const d = byId.get(id); if (!d) return;
  const list = current.length ? current : DATA;
  const i = list.indexOf(d), prev = i > 0 ? list[i - 1] : null, next = i >= 0 && i < list.length - 1 ? list[i + 1] : null;
  const facts = [['People', d.who], ['Where', d.loc], ['When', yearTxt(d.yr)], ['Topic', `${d.s}: ${d.tp}${d.sub ? ', ' + d.sub : ''}`], ['Kind', d.tag], ['Levels', d.lv.join(', ')]].filter(f => f[1]);
  $('reader').innerHTML = `
    <div class="rnav"><button class="btn" type="button" data-back>Back to all stories</button><span class="row">${prev ? `<button class="btn" type="button" data-open="${prev.id}">Previous</button>` : ''}${next ? `<button class="btn" type="button" data-open="${next.id}">Next</button>` : ''}</span></div>
    <article class="rgrid ${present ? '' : ''}">
      <div>
        <span class="subj"><i style="background:${col(d.s)}"></i>${esc(d.s)}, ${esc(d.tp)}</span>
        <h2>${esc(d.t)}</h2>
        <p class="story">${esc(d.x)}</p>
        ${d.q ? `<div class="ask"><h3>Ask your class</h3><p>${esc(d.q)}</p></div>` : ''}
        <div class="acts">
          <button class="btn" type="button" data-copy>Copy story</button>
          <button class="btn" type="button" data-save aria-pressed="${saved.has(d.id)}">${saved.has(d.id) ? 'Saved' : 'Save story'}</button>
          <button class="btn" type="button" data-present>${present ? 'Leave presenting view' : 'Present to class'}</button>
          <button class="btn" type="button" data-link>Copy link</button>
        </div>
      </div>
      <div>
        <span class="art" style="border-radius:14px;aspect-ratio:2/1">${art(d)}</span>
        <dl class="facts">${facts.map(([k,v]) => `<div><dt>${k}</dt><dd>${esc(v)}</dd></div>`).join('')}</dl>
        ${(r => r.length ? `<div class="related"><h3>Related stories</h3><div class="rel">${r.map(o => `<button type="button" data-open="${o.id}"><i style="background:${col(o.s)}"></i>${esc(o.t)}</button>`).join('')}</div></div>` : '')(related(d))}
      </div>
    </article>`;
  $('reader').classList.toggle('present', present);
  $('reader').classList.remove('hide'); $('browse').classList.add('hide');
  $('reader').dataset.id = d.id;
  try { if (location.hash !== '#' + d.id) history.replaceState(null, '', '#' + d.id); } catch (e) {}
  if (!keepScroll) goTo($('reader'), 'start');
  $('reader').querySelector('h2').setAttribute('tabindex','-1'); $('reader').querySelector('h2').focus({preventScroll:true});
}
function closeStory() {
  const id = $('reader').dataset.id;
  $('reader').classList.add('hide'); $('browse').classList.remove('hide');
  try { history.replaceState(null, '', location.pathname + location.search); } catch (e) {}
  const c = $('grid').querySelector(`[data-id="${id}"]`);
  if (c) { goTo(c, 'center'); c.focus({preventScroll:true}); } else goTo($('browse'), 'start');
}
let tt; const toast = (m) => { const t = $('toast'); t.textContent = m; const r = $('reader').classList.contains('hide') ? $('browse') : $('reader'); t.style.top = (r.offsetTop + 12) + 'px'; t.classList.add('on'); clearTimeout(tt); tt = setTimeout(() => t.classList.remove('on'), 1800); };
const copy = async (text, ok) => { try { await navigator.clipboard.writeText(text); toast(ok); } catch (e) { toast('Copying was blocked by the browser'); } };

root.addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  if (b.dataset.g) {
    const set = st[b.dataset.g], v = b.dataset.v;
    set.has(v) ? set.delete(v) : set.add(v);
    b.setAttribute('aria-pressed', set.has(v));
    if (b.dataset.g === 'subj') fillTopics();
    st.shown = 36; render(); return;
  }
  if (b.dataset.id) { openStory(b.dataset.id); return; }
  if (b.dataset.open) { openStory(b.dataset.open); return; }
  if ('back' in b.dataset) { closeStory(); return; }
  if ('reset' in b.dataset || b.id === 'reset') { resetAll(); return; }
  const d = byId.get($('reader').dataset.id);
  if ('copy' in b.dataset && d) copy(`${d.t}\n\n${d.x}${d.q ? `\n\nAsk your class: ${d.q}` : ''}`, 'Story copied');
  if ('link' in b.dataset && d) copy(shareBase() + '#' + d.id, 'Link copied');
  if ('save' in b.dataset && d) { saved.has(d.id) ? saved.delete(d.id) : saved.add(d.id); persist(); b.textContent = saved.has(d.id) ? 'Saved' : 'Save story'; b.setAttribute('aria-pressed', saved.has(d.id)); toast(saved.has(d.id) ? 'Saved to My saved stories' : 'Removed from My saved stories'); }
  if ('present' in b.dataset && d) { present = !present; openStory(d.id, true); if (present) { try { root.requestFullscreen && root.requestFullscreen().catch(() => {}); } catch (e) {} } else if (document.fullscreenElement) { document.exitFullscreen().catch(() => {}); } }
});
function resetAll() {
  st.q = ''; $('q').value = ''; ['subj','lv','col'].forEach(g => st[g].clear());
  root.querySelectorAll('.chip').forEach(c => c.setAttribute('aria-pressed','false'));
  st.tp = st.tag = st.rg = st.era = ''; ['tag','rg','era'].forEach(id => $(id).value = ''); st.sort = 'rel'; $('sort').value = 'rel';
  fillTopics(); st.shown = 36; render();
}
let qt; $('q').addEventListener('input', e => { clearTimeout(qt); qt = setTimeout(() => { st.q = e.target.value; st.shown = 36; render(); }, 120); });
for (const id of ['tp','tag','rg','era','sort']) $(id).addEventListener('change', e => { st[id] = e.target.value; if (id === 'sort' && st.sort === 'shuf') st.seed = (Math.random() * 1e9) | 0; st.shown = 36; render(); });
$('moreBtn').addEventListener('click', () => { st.shown += 36; render(); });
$('surprise').addEventListener('click', () => { const pool = current.length ? current : DATA; openStory(pool[(Math.random() * pool.length) | 0].id); });
root.addEventListener('keydown', e => {
  if ($('reader').classList.contains('hide')) return;
  if (e.target.matches('input,select')) return;
  const nb = $('reader').querySelectorAll('.rnav [data-open]');
  if (e.key === 'Escape') closeStory();
  if (e.key === 'ArrowRight') { const n = [...nb].find(b => b.textContent === 'Next'); n && n.click(); }
  if (e.key === 'ArrowLeft') { const p = [...nb].find(b => b.textContent === 'Previous'); p && p.click(); }
});
document.addEventListener('fullscreenchange', () => { if (!document.fullscreenElement && present) { present = false; const id = $('reader').dataset.id; if (id) openStory(id, true); } });
const fromHash = () => { const h = decodeURIComponent(location.hash.slice(1)); if (byId.has(h)) openStory(h); };
window.addEventListener('hashchange', fromHash);

render(); drawTimeline(); fromHash();
}
</script>
</body>
</html>
