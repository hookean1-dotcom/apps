  const METHODS={
    balance:{n:'Balance method',s:'Do the same operation to both sides, written out in full, until the target is on its own.',x:'F = m × a → F ÷ a = (m × a) ÷ a → m = F ÷ a',d:'Every step is written on both sides of the equals sign before it is tidied up, so you can see the equation stay balanced.'},
    undo:{n:'Inverse operations',s:'Undo one operation at a time, in reverse order, writing only the tidied line each time.',x:'Ek = 1/2 × m × v² → multiply by 2 → divide by m → square root',d:'Shorter working than the balance method. Use it once you trust yourself to do the same thing to both sides without writing it out.'},

  /* ---------- helpers -------------------------------------------------- */
  const SUBS=['Ep','Ek','Ee','Vp','Vs','Np','Ns','Ip','Is','Rtotal','R1','R2'];
  const SUBRE=new RegExp('(^|[^A-Za-z0-9_])('+SUBS.join('|')+')(?![A-Za-z0-9_])','g');
  function fmt(s){return String(s).replace(SUBRE,function(m,a,b){
    var i=b==='Rtotal'?1:1;return a+b.slice(0,i)+'<sub>'+b.slice(i)+'</sub>';});}
  function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
  function sg(x,d){return String(Number(Number(x).toPrecision(d)));}
  function nP(x){
    if(x===null||x===undefined||!isFinite(x))return '—';
    if(x===0)return '0';
    return sg(x,4);
  }
  function n(x){
    if(x===null||x===undefined||!isFinite(x))return '—';
    if(x===0)return '0';

    if(a>=1e5||a<1e-3){var e=Math.floor(Math.log10(a));return sg(x/Math.pow(10,e),3)+' × 10<sup>'+e+'</sup>';}

  function shuffle(a){for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}return a;}
  function subst(str,map){
    var keys=Object.keys(map).sort(function(a,b){return b.length-a.length;})
      .map(function(k){return k.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');});
    if(!keys.length)return str;
    var re=new RegExp('(^|[^A-Za-z0-9_])('+keys.join('|')+')(?![A-Za-z0-9_])','g');
    return String(str).replace(re,function(m,a,b){return a+map[b];});
  }
  function evalTask(task,vals){
    var names=Object.keys(vals);
    try{
      var fn=new Function(names,'return ('+task.ex+');');
      return fn.apply(null,names.map(function(k){return vals[k];}));
    }catch(e){return NaN;}
  }
  function parseNum(s){
    s=String(s).trim().toLowerCase();
    if(!s)return NaN;
    var sup={'⁰':'0','¹':'1','²':'2','³':'3','⁴':'4','⁵':'5','⁶':'6','⁷':'7','⁸':'8','⁹':'9','⁻':'-'};
    s=s.replace(/[⁰¹²³⁴-⁹⁻]/g,function(c){return sup[c];});
    s=s.replace(/,/g,'').replace(/\s+/g,'').replace(/[−–]/g,'-');
    s=s.replace(/(?:x|×|\*)10\^?/g,'e').replace(/\^/g,'e');
    var m=s.match(/^-?\d*\.?\d+(?:e-?\d+)?$/);
    return m?Number(s):NaN;
  }

  /* ---------- step wording, plans and options -------------------------- */
  function sayFor(op){
    switch(op.k){
      case '÷': return 'Divide both sides by '+op.by;
      case '×': return 'Multiply both sides by '+op.by;
      case '+': return 'Add '+op.by+' to both sides';
      case '−': return 'Subtract '+op.by+' from both sides';
      case '√': return 'Take the square root of both sides';
      case 'sq': return 'Square both sides';
      case 'cross': return 'Cross-multiply to clear both fractions';
      case 'sub': return state.method==='numbers'
        ? 'Substitute the numbers into the original equation'
        : 'Substitute the numbers into the rearranged equation';
      case 'simp': return 'Simplify the number part';
      case 'calc': return 'Work out the answer';
    }
    return '';
  }
  function wrapSide(s,k){
    if(k!=='÷'&&k!=='×')return s;
    if(!/\s/.test(s))return s;
    if(/^\(.*\)$/.test(s))return s;
    return '('+s+')';
  }
  function bothSides(prev,op){
    var i=String(prev).indexOf('=');
    if(i<0)return null;
    var L=prev.slice(0,i).trim(),R=prev.slice(i+1).trim();
    if(op.k==='√')return '√('+L+') = √('+R+')';
    if(op.k==='cross')return null;
    if(op.k==='×')return op.by+' × '+wrapSide(L,op.k)+' = '+op.by+' × '+wrapSide(R,op.k);
    if(op.k==='÷')return wrapSide(L,op.k)+' ÷ '+op.by+' = '+wrapSide(R,op.k)+' ÷ '+op.by;
    return L+' '+op.k+' '+op.by+' = '+R+' '+op.k+' '+op.by;
  }
  function symbolsIn(task){
    return Object.keys(task.lb);
  }
  function optionsFor(task,step){
    var op=step.op, tg=task.tg, correct=sayFor(op), wrong=[];
    var others=symbolsIn(task).filter(function(s){return s!==tg&&s!==op.by;});
    function add(txt,why){
      if(!txt||txt===correct)return;
      for(var i=0;i<wrong.length;i++){if(wrong[i].t===txt)return;}
      wrong.push({t:txt,w:why});
    }
    if(op.k==='÷'||op.k==='×'){
      var opp=op.k==='÷'?'×':'÷';
      add(sayFor({k:opp,by:op.by}), op.by+' is '+(op.k==='÷'?'multiplying':'dividing')+' here, so you undo it with the opposite operation, not the same one.');
      add(sayFor({k:op.k,by:tg}), 'Never '+(op.k==='÷'?'divide':'multiply')+' by '+tg+'. That is the quantity you are trying to leave on its own.');
      if(others.length) add(sayFor({k:'−',by:others[0]}), others[0]+' is not added or subtracted in this equation, so subtracting it will not remove anything.');
      add((op.k==='÷'?'Divide':'Multiply')+' only the left-hand side by '+op.by, 'Whatever you do to one side you must do to the other, or the two sides stop being equal.');
      if(/²/.test(task.f)) add('Divide both sides by 2', 'Dividing by 2 halves the quantity. It does not undo a square — that needs a square root.');
    } else if(op.k==='+'||op.k==='−'){
      var opp2=op.k==='+'?'−':'+';
      add(sayFor({k:opp2,by:op.by}), op.by+' is currently '+(op.k==='+'?'subtracted':'added')+', so you undo it the other way round.');
      add(sayFor({k:'÷',by:op.by}), op.by+' is added or subtracted here, not multiplied, so dividing will not remove it cleanly.');
      add(sayFor({k:'×',by:tg}), 'Multiplying by '+tg+' puts the unknown on both sides and makes the equation harder, not easier.');
      add((op.k==='+'?'Add ':'Subtract ')+op.by+(op.k==='+'?' to the left-hand side only':' from the left-hand side only'), 'Whatever you do to one side you must do to the other, or the two sides stop being equal.');
    } else if(op.k==='√'){
      add('Divide both sides by 2', 'Dividing by 2 halves the quantity. To undo a square you take the square root.');
      add('Square both sides', 'The unknown is already squared. Squaring again makes it a fourth power.');
      add('Multiply both sides by 2', 'Multiplying by 2 doubles the quantity. It has no effect on the square.');
      add('Take the square root of the left-hand side only', 'Whatever you do to one side you must do to the other, or the two sides stop being equal.');
    } else if(op.k==='cross'){
      add('Multiply the two top numbers together and the two bottom numbers together', 'That is not cross-multiplying. The top of one side multiplies the bottom of the other.');
      add('Add the two fractions together', 'The two sides are already equal to each other. There is nothing to add.');
      add('Cancel '+symbolsIn(task)[0]+' from both fractions', 'You can only cancel a quantity that appears as a factor on both sides in the same place.');
      add('Turn both sides upside down and stop there', 'Inverting both sides is allowed, but it does not clear the fractions or isolate '+tg+'.');
    }
    shuffle(wrong);
    var picked=wrong.slice(0,3);
    var all=picked.map(function(w){return {t:w.t,w:w.w,ok:false};});
    all.push({t:correct,w:'',ok:true});
    return shuffle(all);
  }
  function parseStep(txt,op){
    var raw=String(txt),s=raw.toLowerCase();

    pats.forEach(function(pp){var i=s.search(pp[1]);if(i>=0&&i<bi){bi=i;k=pp[0];}});
    var by=null;
    if(op.by){
      var e=String(op.by).replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
      if(new RegExp('(^|[^A-Za-z0-9_])'+e+'(?![A-Za-z0-9_])').test(raw))by=op.by;
    }
    return {k:k,by:by};
  }

  /* ---------- state and session ---------------------------------------- */
  var state={};
  function blank(){

  function isFrac(t){return t.f.indexOf('÷')>=0 && (t.pl[0][0]==='×'||t.pl[0][0]==='cross');}

  const STARTERS=['Fma_a','Fma_m','svt_v','svt_t','ohm_R','PIV_I','wave_lambda','charge_t','moment_d','latent_L','work_Fd_F','QV_Q'];
  function buildSession(mk,len){
    var pool=eligible(mk);

    var core=shuffle(pool.filter(function(t){return t.id.indexOf('_prefix')<0;}));
    var want=Math.min(len,pool.length);
    var open=[];
    if(mk==='balance'||mk==='undo'){

    }
    var used={};open.forEach(function(t){used[t.id]=1;});
    var nPre=Math.min(Math.max(1,Math.round(want*0.25)),pre.length,Math.max(0,want-open.length-1));
    var mid=core.filter(function(t){return !used[t.id];}).slice(0,Math.max(0,want-open.length-nPre));
    nPre=Math.min(pre.length,Math.max(nPre,want-open.length-mid.length));
    return open.concat(mid,pre.slice(0,nPre));
  }
  function chooseValues(task){
    var raw=task.sets[Math.floor(Math.random()*task.sets.length)];
    var keys=Object.keys(task.lb).filter(function(k){return k!==task.tg;});
    var vals={},disp={};
    keys.forEach(function(k,i){
      var it=raw[i];
      if(it&&typeof it==='object'&&'c' in it){vals[k]=it.c;disp[k]=it.d;}
      else {vals[k]=it;disp[k]=nP(it)+(task.un[k]?' '+task.un[k]:'');}
    });
    state.disp=disp;
    return vals;
  }
  function valueMap(task){
    var m={},pre=task.id.indexOf('_prefix')>=0;
    Object.keys(state.vals).forEach(function(k){
      m[k]=pre?state.disp[k]:nP(state.vals[k]);
    });
    return m;
  }
  function currentTask(){return state.session[state.idx];}
  function currentRec(){return state.recs[state.idx];}

  function buildSteps(task){
    var v=state.vals,out=[],prev;
    if(state.method==='numbers'){
      var f=NF[task.id](v),tgs=task.tg+(f.sq?'²':'');
      out.push({op:{k:'sub'},out:subst(task.f,valueMap(task)),auto:1});
      out.push({op:{k:'simp'},out:n(f.A)+' = '+n(f.C)+' × '+tgs,auto:1});
      prev=nP(f.A)+' = '+nP(f.C)+' × '+tgs;
      out.push({op:{k:'÷',by:nP(f.C)},out:n(f.A/f.C)+' = '+tgs,prev:prev});
      if(f.sq)out.push({op:{k:'√',by:''},out:task.tg+' = '+n(Math.sqrt(f.A/f.C)),prev:nP(f.A/f.C)+' = '+task.tg+'²'});
    } else {
      prev=task.f;
      task.pl.forEach(function(p){
        out.push({op:{k:p[0],by:p[1]},out:p[2],prev:prev});
        prev=p[2];
      });
      out.push({op:{k:'sub'},out:subst(task.pl[task.pl.length-1][2],valueMap(task)),auto:1});
      if(SIMP[task.id])out.push({op:{k:'simp'},out:SIMP[task.id](v),auto:1});
    }
    out.push({op:{k:'calc'},out:task.tg+' = '+n(evalTask(task,v))+(task.un[task.tg]?' '+task.un[task.tg]:''),ans:1});
    return out;
  }

  /* ---------- flow ------------------------------------------------------ */
  function hist(add){
    try{
      var k='eqApp12',h=JSON.parse(localStorage.getItem(k)||'[]');
      if(add){h.unshift(add);h=h.slice(0,5);localStorage.setItem(k,JSON.stringify(h));}
      return h;
    }catch(e){return [];}
  }
  function startSession(mk){
    var len=state.len;
    state=blank();state.len=len;state.method=mk;state.view='quiz';
    state.session=buildSession(mk,len);
    state.recs=state.session.map(function(t){return {id:t.id,nm:t.nm,tg:t.tg,f:t.f,errs:0,hints:0,ok:0};});
    newQuestion();
  }
  function newQuestion(){
    var t=currentTask();
    state.step=0;state.opts=null;state.used=[];state.fb=null;state.ansText='';
    state.freeText='';state.calcOpen=false;state.calcText='';state.revealed=0;state.focus='step';
    state.vals=chooseValues(t);
    render();
  }
  function levelFor(){return state.level;}
  function advance(){
    var steps=buildSteps(currentTask());
    state.step++;state.opts=null;state.used=[];state.fb=null;state.focus='step';
    if(state.step>=steps.length){
      var r=currentRec();
      r.ok=(r.errs===0&&r.hints===0)?1:0;
      if(r.errs===0&&r.hints===0){state.streak++;if(state.streak>=2&&state.level<2){state.level++;state.streak=0;}}
      else if(r.errs>=2){state.level=Math.max(0,state.level-1);state.streak=0;}
      else {state.streak=0;}
    }
    render();
  }
  function nextQuestion(){
    if(state.idx<state.session.length-1){state.idx++;newQuestion();}
    else{
      state.view='done';
      var got=state.recs.filter(function(r){return r.ok;}).length;
      hist({d:new Date().toISOString().slice(0,10),m:METHODS[state.method].n,s:got,t:state.recs.length});
      render();
    }
  }
  function pickOption(i){
    var o=state.opts[i];
    if(!o||state.used.indexOf(i)>=0)return;
    if(o.ok){advance();return;}
    state.used.push(i);currentRec().errs++;
    state.fb={t:'no',m:o.w};
    render();
  }
  function revealStep(){
    currentRec().hints++;state.revealed=1;
    var steps=buildSteps(currentTask());
    state.fb={t:'yes',m:'The step is: '+sayFor(steps[state.step].op)+'.'};
    render();
  }
  function checkFree(){
    var steps=buildSteps(currentTask()),op=steps[state.step].op;
    var got=parseStep(state.freeText,op);
    if(!got.k){
      currentRec().errs++;
      state.fb={t:'no',m:'I could not find an operation in that. Start with a word such as divide, multiply, add, subtract or square root.'};
      state.focus='free';render();return;
    }
    if(got.k===op.k&&(!op.by||got.by===op.by)){advance();return;}
    currentRec().errs++;
    var msg;
    if(got.k===op.k&&op.by)msg='Right operation, wrong quantity. Look at what is attached to '+currentTask().tg+' and remove that one.';
    else if((got.k==='÷'&&op.k==='×')||(got.k==='×'&&op.k==='÷'))msg='That is the opposite of what is needed. Check whether '+(op.by||'the term')+' is multiplying or dividing at the moment.';
    else if(got.k==='÷'&&op.k==='√')msg='Dividing will not undo a square. Use a square root.';
    else msg='That operation will not remove anything from this side. Look at how the terms are joined: multiplied, divided, added or subtracted.';
    state.fb={t:'no',m:msg};state.focus='free';render();
  }
  function checkAnswer(){
    var t=currentTask(),exp=evalTask(t,state.vals),got=parseNum(state.ansText),r=currentRec();
    if(isNaN(got)){
      state.fb={t:'no',m:'Type a number. A power of ten can be written 5e14 or 5 × 10^14.'};
      state.focus='ans';render();return;
    }
    if(Math.abs(got-exp)<=Math.max(Math.abs(exp)*0.006,1e-9)){advance();return;}
    r.errs++;
    var msg='Not quite. ',ra=exp!==0?got/exp:0;
    if(Math.abs(ra-1000)<1||Math.abs(ra-0.001)<1e-6||Math.abs(ra-1e6)<10||Math.abs(ra-1e-6)<1e-9)
      msg+='You are out by a factor of a thousand or a million, so check the prefix conversion before you calculate.';
    else if(exp!==0&&Math.abs(got-1/exp)<=Math.abs(1/exp)*0.01)
      msg+='You have divided the wrong way round.';
    else if(Math.abs(got-exp*exp)<=Math.abs(exp*exp)*0.01)
      msg+='That is the square of the answer, so you still need the square root.';
    else if(exp>0&&Math.abs(got-Math.sqrt(exp))<=Math.sqrt(exp)*0.01)
      msg+='You have taken a square root that was not needed.';
    else msg+='Check the calculation against the line above, keying it in one part at a time.';
    if(r.errs>=3&&!state.revealed){
      state.revealed=1;
      msg+=' The answer is '+n(exp)+(t.un[t.tg]?' '+t.un[t.tg]:'')+'.';
    }
    state.fb={t:'no',m:msg};state.focus='ans';render();
  }
  function pressCalc(b){
    if(b==='C')state.calcText='';
    else if(b==='⌫')state.calcText=state.calcText.slice(0,-1);
    else if(b==='='){
      try{
        var e=state.calcText.replace(/×/g,'*').replace(/÷/g,'/').replace(/−/g,'-').replace(/√/g,'Math.sqrt');
        if(/[^0-9+\-*/().eMathsqrt ]/.test(e))throw 0;
        var r=Function('"use strict";return ('+e+')')();
        state.calcText=isFinite(r)?nP(r):'Error';
      }catch(err){state.calcText='Error';}
    }
    else if(b==='x²')state.calcText+='**2';
    else state.calcText+=b;
    state.focus='calc';render();
  }

  /* ---------- rendering ------------------------------------------------- */
  function h(s){return s;}
  function methodCard(k){
    var m=METHODS[k];
    return '<div class="eq-card"><h3>'+m.n+'</h3><p class="eq-sm">'+m.s+'</p>'+
      '<p class="eq-sm eq-mut"><b>Example:</b> '+fmt(m.x)+'</p>'+
      '<p class="eq-sm eq-mut">'+m.d+'</p>'+
      '<button class="eq-btn eq-go" data-method="'+k+'">Use this method</button></div>';
  }
  function renderHome(){
    var hs=hist(),hh='';
    if(hs.length){
      hh='<div class="eq-card"><h3>Your last sessions</h3><div class="eq-scroll"><table class="eq-tbl">'+
        '<tr><th>Date</th><th>Method</th><th>First time right</th></tr>'+
        hs.map(function(r){return '<tr><td>'+esc(r.d)+'</td><td>'+esc(r.m)+'</td><td>'+r.s+' of '+r.t+'</td></tr>';}).join('')+
        '</table></div></div>';
    }
    root.innerHTML=
      '<div class="eq-card"><div class="eq-title">Rearranging equations in GCSE physics</div>'+
      '<p class="eq-lead">Four methods your department accepts, and no formula triangles. '+
      'You choose the step, you do the algebra, and you work out the answer yourself. '+
      'The support fades as you get them right, and comes back if you slip.</p>'+
      '<p class="eq-sm"><b>Questions in this session:</b></p>'+
      '<div class="eq-seg" role="group" aria-label="Session length">'+
      [8,12,20].map(function(v){return '<button class="eq-btn eq-tiny'+(state.len===v?' eq-go':'')+'" data-len="'+v+'">'+v+'</button>';}).join('')+
      '</div></div>'+
      '<div class="eq-methods">'+Object.keys(METHODS).map(methodCard).join('')+'</div>'+hh;
  }
  function workingHTML(steps){
    var out='',i;
    for(i=0;i<state.step&&i<steps.length;i++){
      var s=steps[i];
      if(state.method==='balance'&&s.prev&&'÷×+−√'.indexOf(s.op.k)>=0){
        var b=bothSides(s.prev,s.op);
        if(b)out+='<div class="eq-work eq-bal">'+fmt(b)+'</div>';
      }
      out+='<div class="eq-work">'+fmt(s.out)+'</div>';
    }
    return out||'<p class="eq-mut eq-sm">Your working will appear here, one line at a time.</p>';
  }
  function stepControls(steps){
    if(state.step>=steps.length){
      return '<p><b>Question complete.</b> The full working is on the right.</p>'+
        '<button class="eq-btn eq-go" id="eq-focus" data-act="next">'+
        (state.idx===state.session.length-1?'Finish and see my summary':'Next equation')+'</button>';
    }
    var s=steps[state.step],op=s.op,lev=levelFor(),o='';
    if(op.k==='calc'){
      var t=currentTask();
      o='<p>Work out the answer from the line above and type it in. Round sensibly and check the unit.</p>'+
        '<div class="eq-ansrow"><label class="eq-eqn" style="margin:0" for="eq-ans">'+fmt(t.tg)+' =</label>'+
        '<input class="eq-in" id="eq-ans" inputmode="decimal" autocomplete="off" value="'+esc(state.ansText)+'" placeholder="number">'+
        '<span class="eq-unit">'+(t.un[t.tg]||'')+'</span>'+
        '<button class="eq-btn eq-go" data-act="ans">Check my answer</button></div>';
      return o;
    }
    if(op.k==='sub'||op.k==='simp'){
      return '<p>'+(op.k==='sub'
          ?'Now put the numbers in. Convert any prefixes as you go.'
          :'Tidy the numbers up before you reach for the calculator.')+'</p>'+
        '<button class="eq-btn eq-go" id="eq-focus" data-act="step">'+sayFor(op)+'</button>';
    }
    if(lev===0){
      return '<p class="eq-mut eq-sm">Worked example — read the step, then press it.</p>'+
        '<button class="eq-btn eq-go" id="eq-focus" data-act="step">'+fmt(sayFor(op))+'</button>';
    }
    if(lev===1){
      if(!state.opts)state.opts=optionsFor(currentTask(),s);
      return '<p>Which step keeps the equation balanced and gets you closer to '+fmt(currentTask().tg)+'?</p>'+
        '<div class="eq-opts" id="eq-focus" tabindex="-1">'+
        state.opts.map(function(o2,i){
          var used=state.used.indexOf(i)>=0;
          return '<button class="eq-btn" data-o="'+i+'"'+(used?' disabled':'')+'>'+fmt(o2.t)+'</button>';
        }).join('')+'</div>'+
        '<div class="eq-row"><button class="eq-btn eq-quiet eq-tiny" data-act="reveal">Show me this step</button></div>';
    }
    return '<p>Type the next step in your own words, for example <i>divide both sides by m</i>.</p>'+
      '<div class="eq-ansrow"><input class="eq-in" id="eq-free" style="max-width:340px" autocomplete="off" value="'+esc(state.freeText)+'" placeholder="divide both sides by ...">'+
      '<button class="eq-btn eq-go" data-act="free">Check my step</button>'+
      '<button class="eq-btn eq-quiet" data-act="reveal">Show me this step</button></div>';
  }
  function calcHTML(){
    if(!state.calcOpen)return '';
    var keys=['7','8','9','÷','4','5','6','×','1','2','3','−','0','.','(',')'];
    var t=currentTask();
    if(t.ex.indexOf('+')>=0)keys.push('+');
    if(t.ex.indexOf('Math.sqrt')>=0)keys.push('√');
    if(/v\*v|t\*t|u\*u/.test(t.ex))keys.push('x²');
    keys.push('C','⌫','=');
    return '<div class="eq-calc"><div class="eq-disp" aria-live="off">'+esc(state.calcText||'0')+'</div>'+
      '<div class="eq-pad">'+keys.map(function(k){return '<button class="eq-key" data-key="'+esc(k)+'">'+esc(k)+'</button>';}).join('')+'</div></div>';
  }
  function renderQuiz(){
    var t=currentTask(),steps=buildSteps(t),pct=Math.round((state.idx/state.session.length)*100);
    var levName=['worked example','choose the step','write the step'][levelFor()];
    var fb=state.fb?'<div class="eq-fb eq-'+(state.fb.t==='no'?'no':'yes')+'">'+fmt(state.fb.m)+'</div>':'';
    root.innerHTML=
      '<div class="eq-card"><div class="eq-hd"><div><div class="eq-title" style="font-size:20px;margin:0">'+METHODS[state.method].n+'</div>'+
      '<p class="eq-sm eq-mut" style="margin:2px 0 0">Question '+(state.idx+1)+' of '+state.session.length+' · support level: '+levName+'</p></div>'+
      '<button class="eq-btn eq-tiny" data-act="home">Change method</button></div>'+
      '<div class="eq-bar" style="margin-top:10px"><i style="width:'+pct+'%"></i></div></div>'+
      '<div class="eq-two"><div class="eq-card">'+
      '<span class="eq-badge">'+t.tp+'</span><span class="eq-badge">'+t.nm+'</span>'+
      '<div class="eq-eqn">'+fmt(t.f)+'</div>'+
      '<p>Find <b>'+fmt(t.tg)+'</b> — '+t.lb[t.tg]+'.</p>'+
      '<div class="eq-known">'+Object.keys(state.vals).map(function(k){
        return '<div><b>'+fmt(k)+'</b> = '+esc(state.disp[k])+'<br><span class="eq-sm eq-mut">'+t.lb[k]+'</span></div>';}).join('')+'</div>'+
      '<div class="eq-row"><button class="eq-btn eq-quiet eq-tiny" data-act="calc">'+(state.calcOpen?'Hide':'Show')+' calculator</button></div>'+calcHTML()+
      '</div><div class="eq-card"><h3>Your working</h3>'+workingHTML(steps)+'</div></div>'+
      '<div class="eq-card"><h3 tabindex="-1"'+(state.step>=steps.length?'':' id="eq-head"')+'>Step '+Math.min(state.step+1,steps.length)+' of '+steps.length+'</h3>'+
      stepControls(steps)+'<div aria-live="polite">'+fb+'</div></div>';
  }
  function renderDone(){
    var got=state.recs.filter(function(r){return r.ok;}).length;
    var slips=state.recs.filter(function(r){return !r.ok;});
    root.innerHTML=
      '<div class="eq-card"><div class="eq-title">Session summary</div>'+
      '<p class="eq-big">'+got+' <span class="eq-mut" style="font-size:20px">of '+state.recs.length+' right first time</span></p>'+
      '<p class="eq-sm eq-mut">Method: '+METHODS[state.method].n+'. First time right means no wrong steps, no wrong answers and no hints used.</p></div>'+
      (slips.length?'<div class="eq-card"><h3>Worth another look</h3><div class="eq-scroll"><table class="eq-tbl">'+
        '<tr><th>Equation</th><th>Finding</th><th>Wrong steps</th><th>Hints</th></tr>'+
        slips.map(function(r){return '<tr><td>'+fmt(r.f)+'</td><td>'+fmt(r.tg)+'</td><td>'+r.errs+'</td><td>'+r.hints+'</td></tr>';}).join('')+
        '</table></div></div>'
        :'<div class="eq-card"><h3>Clean sweep</h3><p>Every equation right first time. Try a longer session or a different method.</p></div>')+
      '<div class="eq-card"><div class="eq-row">'+
      (slips.length?'<button class="eq-btn eq-go" data-act="redo">Practise the ones I missed</button>':'')+
      '<button class="eq-btn" data-act="again">New session, same method</button>'+
      '<button class="eq-btn" data-act="home">Choose another method</button></div></div>';
  }
  function redo(){
    var ids={};state.recs.forEach(function(r){if(!r.ok)ids[r.id]=1;});
    var list=TASKS.filter(function(t){return ids[t.id];});
    if(!list.length){startSession(state.method);return;}
    var mk=state.method,len=state.len;
    state=blank();state.len=len;state.method=mk;state.view='quiz';
    state.session=shuffle(list);
    state.recs=state.session.map(function(t){return {id:t.id,nm:t.nm,tg:t.tg,f:t.f,errs:0,hints:0,ok:0};});
    newQuestion();
  }
  function render(){
    if(state.view==='home')renderHome();
    else if(state.view==='done')renderDone();
    else renderQuiz();
    bind();
    var el=null;
    if(state.focus==='free')el=root.querySelector('#eq-free');
    else if(state.focus==='ans')el=root.querySelector('#eq-ans');
    else if(state.view==='quiz')el=root.querySelector('#eq-head')||root.querySelector('#eq-focus');
    if(el){
      try{el.focus({preventScroll:true});}catch(e){try{el.focus();}catch(e2){}}
      if(el.tagName==='INPUT'){try{var v=el.value;el.value='';el.value=v;}catch(e3){}}
    }
  }
  function bind(){
    root.querySelectorAll('[data-method]').forEach(function(b){b.onclick=function(){startSession(b.getAttribute('data-method'));};});
    root.querySelectorAll('[data-len]').forEach(function(b){b.onclick=function(){state.len=Number(b.getAttribute('data-len'));render();};});
    root.querySelectorAll('[data-o]').forEach(function(b){b.onclick=function(){pickOption(Number(b.getAttribute('data-o')));};});
    root.querySelectorAll('[data-key]').forEach(function(b){b.onclick=function(){pressCalc(b.getAttribute('data-key'));};});
    root.querySelectorAll('[data-act]').forEach(function(b){
      b.onclick=function(){
        var a=b.getAttribute('data-act');
        if(a==='home'){var l=state.len;state=blank();state.len=l;render();}
        else if(a==='step')advance();
        else if(a==='next')nextQuestion();
        else if(a==='reveal')revealStep();
        else if(a==='free'){var f=root.querySelector('#eq-free');state.freeText=f?f.value:'';checkFree();}
        else if(a==='ans'){var i=root.querySelector('#eq-ans');state.ansText=i?i.value:'';checkAnswer();}
        else if(a==='calc'){state.calcOpen=!state.calcOpen;state.focus='none';render();}
        else if(a==='again')startSession(state.method);
        else if(a==='redo')redo();
      };
    });
    var fi=root.querySelector('#eq-free');
    if(fi)fi.onkeydown=function(e){if(e.key==='Enter'){e.preventDefault();state.freeText=fi.value;checkFree();}};
    var ai=root.querySelector('#eq-ans');
    if(ai)ai.onkeydown=function(e){if(e.key==='Enter'){e.preventDefault();state.ansText=ai.value;checkAnswer();}};
  }

  state=blank();
  render();
})();
</script>
