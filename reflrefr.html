<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Refraction Lab</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=IBM+Plex+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
#rfx-lab{
  --page:#eef3f6; --bg:#ffffff; --panel:#ffffff; --ink:#14213d; --muted:#55667c; --line:#d6dfe7;
  --accent:#2453d6; --accent-ink:#ffffff; --accent-soft:#e6ecfc;
  --ray:#e3172d; --normal:#7d8aa0; --iarc:#2453d6; --rarc:#0a7f55; --tir:#b4235a;
  --glass-edge:#2f7489; --prot-fill:rgba(255,250,232,0.62); --prot-edge:#9a7a2a; --prot-ink:#3a3122;
  --wave:rgba(20,33,61,0.42); --halo:rgba(255,255,255,0.92); --box:#1d2738; --box-hi:#3a475d;
  --tint:rgba(36,83,214,0.035);
  font-family:'Atkinson Hyperlegible',system-ui,sans-serif; color:var(--ink); background:var(--page);
  width:100%; height:100%; min-height:640px; padding:12px; box-sizing:border-box; line-height:1.35;
}
#rfx-lab.rfx-night{
  --page:#0b1220; --bg:#111a2b; --panel:#152036; --ink:#e8eef7; --muted:#9aabc2; --line:#2a3a55;
  --accent:#5b8cff; --accent-ink:#0b1220; --accent-soft:#1d2c4c;
  --ray:#ff4d5e; --normal:#7f90ab; --iarc:#7ea6ff; --rarc:#3fd59a; --tir:#ff7aa8;
  --glass-edge:#6fc3dc; --prot-fill:rgba(40,52,74,0.6); --prot-edge:#d7b25a; --prot-ink:#f1e6c8;
  --wave:rgba(232,238,247,0.42); --halo:rgba(17,26,43,0.92); --box:#cfd8e6; --box-hi:#ffffff;
  --tint:rgba(91,140,255,0.05);
}
#rfx-lab *{box-sizing:border-box}
#rfx-lab .rfx-wrap{max-width:1180px;margin:0 auto}
#rfx-lab .rfx-top{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;margin-bottom:10px}
#rfx-lab .rfx-title{font-weight:700;font-size:1.15rem;letter-spacing:.01em;margin-right:auto}
#rfx-lab .rfx-title span{color:var(--accent)}
#rfx-lab .rfx-tabs{display:flex;flex-wrap:wrap;gap:4px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:4px}
#rfx-lab .rfx-tab{font:inherit;font-size:.86rem;font-weight:700;border:0;background:transparent;color:var(--muted);padding:7px 12px;border-radius:7px;cursor:pointer}
#rfx-lab .rfx-tab:hover{color:var(--ink);background:var(--accent-soft)}
#rfx-lab .rfx-tab[aria-selected="true"]{background:var(--accent);color:var(--accent-ink)}
#rfx-lab .rfx-theme{display:flex;gap:4px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:4px}
#rfx-lab .rfx-theme button{font:inherit;font-size:.8rem;font-weight:700;border:0;background:transparent;color:var(--muted);padding:6px 10px;border-radius:7px;cursor:pointer}
#rfx-lab .rfx-theme button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
#rfx-lab .rfx-stage{position:relative;width:100%;aspect-ratio:16/9;background:var(--bg);border:1px solid var(--line);border-radius:12px;overflow:hidden;touch-action:none}
#rfx-lab canvas{position:absolute;inset:0;width:100%;height:100%;display:block;outline:none}
#rfx-lab canvas:focus-visible{box-shadow:inset 0 0 0 3px var(--accent)}
#rfx-lab .rfx-hint{position:absolute;right:10px;bottom:8px;font-size:.78rem;color:var(--muted);background:var(--halo);padding:3px 8px;border-radius:6px;pointer-events:none}
#rfx-lab .rfx-panel{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:12px;margin-top:12px}
@media (max-width:780px){#rfx-lab .rfx-panel{grid-template-columns:minmax(0,1fr)}}
@media (max-width:600px){#rfx-lab .rfx-hint{display:none}}
#rfx-lab .rfx-card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
#rfx-lab .rfx-h{font-size:.72rem;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:0 0 8px}
#rfx-lab .rfx-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px 16px}
#rfx-lab .rfx-field label{display:block;font-size:.82rem;font-weight:700;margin-bottom:4px}
#rfx-lab select{width:100%;font:inherit;font-size:.92rem;padding:8px 10px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
#rfx-lab .rfx-row{display:flex;align-items:center;gap:10px}
#rfx-lab input[type=range]{flex:1;accent-color:var(--accent);min-width:0}
#rfx-lab .rfx-val{font-family:'IBM Plex Mono',ui-monospace,monospace;font-size:.85rem;min-width:62px;text-align:right}
#rfx-lab .rfx-custom{margin-top:6px}
#rfx-lab .rfx-check{display:flex;align-items:center;gap:8px;font-size:.85rem;margin-top:6px;cursor:pointer}
#rfx-lab .rfx-check input{accent-color:var(--accent);width:16px;height:16px}
#rfx-lab .rfx-sep{height:1px;background:var(--line);margin:14px 0}
#rfx-lab .rfx-chips{display:flex;flex-wrap:wrap;gap:6px}
#rfx-lab .rfx-chip{font:inherit;font-size:.84rem;font-weight:700;padding:6px 12px;border-radius:999px;border:1px solid var(--line);background:var(--bg);color:var(--muted);cursor:pointer}
#rfx-lab .rfx-chip[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
#rfx-lab .rfx-chip:disabled{opacity:.4;cursor:not-allowed}
#rfx-lab .rfx-btns{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
#rfx-lab .rfx-btn{font:inherit;font-size:.85rem;font-weight:700;padding:8px 14px;border-radius:8px;border:1px solid var(--accent);background:var(--accent);color:var(--accent-ink);cursor:pointer}
#rfx-lab .rfx-btn.rfx-ghost{background:transparent;color:var(--accent)}
#rfx-lab .rfx-btn:disabled{opacity:.4;cursor:not-allowed}
#rfx-lab .rfx-ev{border-left:3px solid var(--accent);padding:6px 0 6px 10px;margin-bottom:8px}
#rfx-lab .rfx-ev.rfx-tirrow{border-left-color:var(--tir)}
#rfx-lab .rfx-ev-h{font-size:.82rem;font-weight:700;color:var(--muted)}
#rfx-lab .rfx-ev-h b{color:var(--ink)}
#rfx-lab .rfx-mono{font-family:'IBM Plex Mono',ui-monospace,monospace;font-size:.88rem}
#rfx-lab .rfx-big{font-size:1.02rem;font-weight:600}
#rfx-lab .rfx-i{color:var(--iarc)} #rfx-lab .rfx-r{color:var(--rarc)} #rfx-lab .rfx-t{color:var(--tir);font-weight:700}
#rfx-lab .rfx-foot{border-top:1px solid var(--line);margin-top:10px;padding-top:10px;font-size:.88rem}
#rfx-lab .rfx-foot div{margin-bottom:4px}
#rfx-lab .rfx-note{font-size:.8rem;color:var(--muted)}
#rfx-lab [hidden]{display:none !important}
</style>
</head>
<body style="margin:0">
<div id="rfx-lab">
 <div class="rfx-wrap">
  <div class="rfx-top">
   <div class="rfx-title">Refraction <span>Lab</span></div>
   <div class="rfx-tabs" role="tablist" aria-label="Experiment">
    <button class="rfx-tab" role="tab" data-mode="boundary">Single boundary</button>
    <button class="rfx-tab" role="tab" data-mode="rect">Rectangular block</button>
    <button class="rfx-tab" role="tab" data-mode="semi">Semicircular block</button>
    <button class="rfx-tab" role="tab" data-mode="tri">Triangular prism</button>
    <button class="rfx-tab" role="tab" data-mode="right">Right-angled prism</button>
   </div>
   <div class="rfx-theme">
    <button data-theme="day" aria-pressed="true">Day</button>
    <button data-theme="night" aria-pressed="false">Night</button>
   </div>
  </div>

  <div class="rfx-stage">
   <canvas tabindex="0" aria-label="Ray diagram. Drag the ray box to change the angle; use the left and right arrow keys for fine adjustment."></canvas>
   <div class="rfx-hint" data-id="hint"></div>
  </div>

  <div class="rfx-panel">
   <div class="rfx-card">
    <div class="rfx-grid">
     <div class="rfx-field">
      <label data-id="matLabel" for="rfx-mat">Block material</label>
      <select id="rfx-mat" data-id="mat"></select>
      <div class="rfx-row rfx-custom" data-id="matCustomRow" hidden>
       <input type="range" min="1" max="2.5" step="0.01" data-id="matCustom" aria-label="Custom refractive index">
       <span class="rfx-val" data-id="matCustomVal"></span>
      </div>
     </div>
     <div class="rfx-field">
      <label data-id="surLabel" for="rfx-sur">Surroundings</label>
      <select id="rfx-sur" data-id="sur"></select>
      <div class="rfx-row rfx-custom" data-id="surCustomRow" hidden>
       <input type="range" min="1" max="2.5" step="0.01" data-id="surCustom" aria-label="Custom refractive index">
       <span class="rfx-val" data-id="surCustomVal"></span>
      </div>
     </div>
     <div class="rfx-field">
      <label data-id="angLabel">Angle of incidence</label>
      <div class="rfx-row">
       <input type="range" data-id="ang" aria-label="Ray angle">
       <span class="rfx-val" data-id="angVal"></span>
      </div>
      <label class="rfx-check" data-id="pivotRow"><input type="checkbox" data-id="pivot"> Aim at a fixed point on the surface</label>
     </div>
     <div class="rfx-field" data-id="rotRow">
      <label>Block rotation</label>
      <div class="rfx-row">
       <input type="range" min="-180" max="180" step="1" data-id="rot" aria-label="Block rotation">
       <span class="rfx-val" data-id="rotVal"></span>
      </div>
     </div>
    </div>
    <div class="rfx-sep"></div>
    <div class="rfx-h">Show</div>
    <div class="rfx-chips">
     <button class="rfx-chip" data-opt="prot">Protractor</button>
     <button class="rfx-chip" data-opt="normals">Normals</button>
     <button class="rfx-chip" data-opt="values">Angle values</button>
     <button class="rfx-chip" data-opt="partial">Partial reflection</button>
     <button class="rfx-chip" data-opt="waves">Wavefronts</button>
     <button class="rfx-chip" data-opt="white">White light</button>
    </div>
    <div class="rfx-btns">
     <button class="rfx-btn" data-id="snap">Place protractor on ray</button>
     <button class="rfx-btn rfx-ghost" data-id="reset">Reset this experiment</button>
    </div>
   </div>
   <div class="rfx-card">
    <div class="rfx-h">Measurements</div>
    <div data-id="readout"></div>
   </div>
  </div>
 </div>
</div>

<script>
(function(){
'use strict';
const root=document.getElementById('rfx-lab');
const $=id=>root.querySelector('[data-id="'+id+'"]');
const cv=root.querySelector('canvas');
const ctx=cv.getContext('2d');
const stage=root.querySelector('.rfx-stage');
const W=1600,H=900,D2R=Math.PI/180,R2D=180/Math.PI;

/* ---------- vectors ---------- */
const add=(a,b)=>[a[0]+b[0],a[1]+b[1]], sub=(a,b)=>[a[0]-b[0],a[1]-b[1]], mul=(a,k)=>[a[0]*k,a[1]*k];
const dot=(a,b)=>a[0]*b[0]+a[1]*b[1], cross=(a,b)=>a[0]*b[1]-a[1]*b[0];
const len=a=>Math.hypot(a[0],a[1]), norm=a=>{const l=len(a)||1;return [a[0]/l,a[1]/l];};
const rot=(v,a)=>{const c=Math.cos(a),s=Math.sin(a);return [v[0]*c-v[1]*s,v[0]*s+v[1]*c];};
const clamp=(x,a,b)=>Math.max(a,Math.min(b,x));

/* ---------- materials ---------- */
const MATS={
 air:{name:'Air',n:1.00,V:0,tint:null},
 water:{name:'Water',n:1.33,V:56,tint:[70,150,225,0.16]},
 perspex:{name:'Perspex',n:1.49,V:58,tint:[120,190,210,0.24]},
 crown:{name:'Crown glass',n:1.52,V:59,tint:[95,190,175,0.24]},
 flint:{name:'Flint glass',n:1.62,V:36,tint:[120,140,215,0.26]},
 diamond:{name:'Diamond',n:2.42,V:44,tint:[175,185,235,0.34]},
 custom:{name:'Custom',n:1.60,V:50,tint:[150,160,190,0.24]}
};
const EXAG=3; // dispersion exaggeration for visibility
const WAVES=[{l:680,c:'#e0262b'},{l:615,c:'#f07a14'},{l:580,c:'#e6b800'},{l:530,c:'#1f9e45'},{l:475,c:'#1f63d6'},{l:425,c:'#7a2fd0'}];

/* ---------- scenes ---------- */
const DEF={
 boundary:{shape:{type:'half'},pos:[800,450],rot:0,pivot:{p:[0,0],n:[0,1]},a:35,R:360,usePivot:true,mat:'perspex',sur:'air',waves:true},
 rect:{shape:{type:'rect',w:560,h:300},pos:[830,500],rot:0,pivot:{p:[-150,-150],n:[0,-1]},a:-40,R:300,usePivot:true,mat:'crown',sur:'air',waves:false},
 semi:{shape:{type:'semi',r:250},pos:[800,320],rot:0,pivot:{p:[0,0],n:[0,1]},a:30,R:440,usePivot:true,mat:'perspex',sur:'air',waves:false},
 tri:{shape:{type:'tri',s:420},pos:[820,520],rot:0,pivot:null,a:-49,R:330,usePivot:true,mat:'crown',sur:'air',waves:false},
 right:{shape:{type:'right',a:320},pos:[820,540],rot:0,pivot:{p:[0,-160],n:[0,-1]},a:0,R:240,usePivot:true,mat:'crown',sur:'air',waves:false}
};
(function(){ // pivot for triangle: midpoint of left face
 const s=DEF.tri.shape.s,h=s*Math.sqrt(3)/2;
 const top=[0,-2*h/3],left=[-s/2,h/3];
 DEF.tri.pivot={p:mul(add(top,left),0.5),n:[-Math.cos(30*D2R),-Math.sin(30*D2R)]};
})();
const HINTS={
 boundary:'Drag below the boundary to swing the ray · ← → for fine steps',
 rect:'Drag the ray box to aim · drag the block to move it',
 semi:'Ray aims at the centre of the flat face · find the critical angle',
 tri:'Try white light to see dispersion',
 right:'Rotate the prism to see total internal reflection turn the ray'
};
function freshScene(k){
 const d=DEF[k];
 const s=JSON.parse(JSON.stringify(d));
 s.custom={mat:1.60,sur:1.00};
 s.white=false;
 const P=pivotWorld(s);
 const u=rot(P.n,s.a*D2R);
 const f=add(P.p,mul(u,s.R));
 s.free={x:f[0],y:f[1],ang:Math.atan2(-u[1],-u[0])};
 return s;
}
const S={}; for(const k in DEF) S[k]=freshScene(k);
const O={mode:'boundary',theme:'day',prot:false,normals:true,values:true,partial:false,
 protX:800,protY:450,protPhi:-Math.PI/2,phase:0};
const sc=()=>S[O.mode];

function pivotWorld(s){
 return {p:add(s.pos,rot(s.pivot.p,s.rot*D2R)), n:rot(s.pivot.n,s.rot*D2R)};
}
function nOf(key,which,s,lam){
 const base= key==='custom' ? s.custom[which] : MATS[key].n;
 if(!lam||base<=1.0001) return base;
 const V= MATS[key].V||50;
 const B=(base-1)/V/(1/(486.1*486.1)-1/(656.3*656.3))*EXAG;
 return base+B*(1/(lam*lam)-1/(589.3*589.3));
}
const nameOf=(key,s,which)=>key==='custom'?'Custom (n = '+s.custom[which].toFixed(2)+')':MATS[key].name;

/* ---------- geometry ---------- */
let G=null;
function buildGeom(s){
 const r=s.rot*D2R, P=s.pos, sh=s.shape;
 const toW=v=>add(P,rot(v,r));
 const g={edges:[],type:sh.type};
 if(sh.type==='half'){
  const y=P[1];
  g.edges.push({k:'seg',a:[-6000,y],b:[7600,y],n:[0,1]});
  g.contains=p=>p[1]>y;
  g.path=c=>{c.rect(-10,y,W+20,H-y+10);};
  return g;
 }
 if(sh.type==='semi'){
  const R=sh.r, C=P.slice();
  const a=toW([-R,0]), b=toW([R,0]);
  g.edges.push({k:'seg',a,b,n:rot([0,-1],r)});
  g.edges.push({k:'arc',c:C,r:R,rot:r});
  g.contains=p=>{const q=rot(sub(p,C),-r);return q[1]>=0&&len(q)<R;};
  g.path=c=>{c.moveTo(a[0],a[1]);c.lineTo(b[0],b[1]);c.arc(C[0],C[1],R,r,r+Math.PI,false);c.closePath();};
  g.verts=[a,b];
  return g;
 }
 let loc;
 if(sh.type==='rect'){const w=sh.w/2,h=sh.h/2;loc=[[-w,-h],[w,-h],[w,h],[-w,h]];}
 else if(sh.type==='tri'){const s2=sh.s,h=s2*Math.sqrt(3)/2;loc=[[0,-2*h/3],[s2/2,h/3],[-s2/2,h/3]];}
 else {const a=sh.a/2;loc=[[-a,-a],[a,-a],[a,a]];}
 const V=loc.map(toW);
 const cen=V.reduce((acc,v)=>add(acc,mul(v,1/V.length)),[0,0]);
 for(let i=0;i<V.length;i++){
  const a=V[i],b=V[(i+1)%V.length];
  let n=norm([b[1]-a[1],-(b[0]-a[0])]);
  if(dot(n,sub(mul(add(a,b),0.5),cen))<0) n=mul(n,-1);
  g.edges.push({k:'seg',a,b,n});
 }
 g.contains=p=>{let c=false;for(let i=0,j=V.length-1;i<V.length;j=i++){const vi=V[i],vj=V[j];if(((vi[1]>p[1])!==(vj[1]>p[1]))&&(p[0]<(vj[0]-vi[0])*(p[1]-vi[1])/(vj[1]-vi[1])+vi[0]))c=!c;}return c;};
 g.path=c=>{c.moveTo(V[0][0],V[0][1]);for(let i=1;i<V.length;i++)c.lineTo(V[i][0],V[i][1]);c.closePath();};
 g.verts=V;
 return g;
}
function nearest(p,d){
 let best=null;
 for(const e of G.edges){
  let t=null,n=null;
  if(e.k==='seg'){
   const r=sub(e.b,e.a),den=cross(d,r);
   if(Math.abs(den)<1e-12) continue;
   const ap=sub(e.a,p),t1=cross(ap,r)/den,u=cross(ap,d)/den;
   if(t1>1e-6&&u>=-1e-9&&u<=1+1e-9){t=t1;n=e.n;}
  } else {
   const oc=sub(p,e.c),b=dot(oc,d),c=dot(oc,oc)-e.r*e.r,disc=b*b-c;
   if(disc<0) continue;
   const sq=Math.sqrt(disc);
   for(const tt of [-b-sq,-b+sq]){
    if(tt>1e-6&&(t===null||tt<t)){
     const q=add(p,mul(d,tt)),lq=rot(sub(q,e.c),-e.rot);
     if(lq[1]>=-1e-6){t=tt;n=norm(sub(q,e.c));}
    }
   }
  }
  if(t!==null&&(!best||t<best.t)) best={t,n,pt:add(p,mul(d,t))};
 }
 return best;
}

/* ---------- ray tracing ---------- */
function laserPose(s){
 if(s.usePivot){
  const P=pivotWorld(s),u=rot(P.n,s.a*D2R);
  return {front:add(P.p,mul(u,s.R)),d:mul(u,-1)};
 }
 return {front:[s.free.x,s.free.y],d:[Math.cos(s.free.ang),Math.sin(s.free.ang)]};
}
function trace(s,start,dir,lam,partial){
 const nIn=nOf(s.mat,'mat',s,lam), nOut=nOf(s.sur,'sur',s,lam);
 const segs=[],events=[];
 const stack=[{p:start,d:dir,I:1,primary:true,depth:0}];
 let count=0;
 while(stack.length&&count<120){
  const r=stack.pop();count++;
  const hit=nearest(r.p,r.d);
  const end=hit?hit.pt:add(r.p,mul(r.d,4000));
  const mid=hit?mul(add(r.p,hit.pt),0.5):add(r.p,mul(r.d,2));
  const inside=G.contains(mid);
  const n1=inside?nIn:nOut, n2=inside?nOut:nIn;
  segs.push({a:r.p,b:end,I:r.I,primary:r.primary,n:n1,inside,d:r.d});
  if(!hit||r.depth>40) continue;
  let N=hit.n; if(dot(r.d,N)>0) N=mul(N,-1); // N points back into incident medium
  const cosi=clamp(-dot(r.d,N),0,1), eta=n1/n2, k=1-eta*eta*(1-cosi*cosi);
  const refl=norm(add(r.d,mul(N,2*cosi)));
  const iDeg=Math.acos(cosi)*R2D;
  const from=inside?'in':'out';
  if(k<0){
   if(r.primary) events.push({pt:hit.pt,N,din:r.d,dout:refl,i:iDeg,r:iDeg,n1,n2,from,tir:true,c:Math.asin(n2/n1)*R2D});
   stack.push({p:add(hit.pt,mul(refl,0.01)),d:refl,I:r.I,primary:r.primary,depth:r.depth+1});
  } else {
   const cost=Math.sqrt(k);
   const t=norm(add(mul(r.d,eta),mul(N,eta*cosi-cost)));
   const rs=((n1*cosi-n2*cost)/(n1*cosi+n2*cost))**2, rp=((n1*cost-n2*cosi)/(n1*cost+n2*cosi))**2;
   const Rf=(rs+rp)/2;
   if(r.primary) events.push({pt:hit.pt,N,din:r.d,dout:t,i:iDeg,r:Math.acos(cost)*R2D,n1,n2,from,tir:false,c:n1>n2?Math.asin(n2/n1)*R2D:null,Rf});
   if(partial&&r.I*Rf>0.012) stack.push({p:add(hit.pt,mul(refl,0.01)),d:refl,I:r.I*Rf,primary:false,depth:r.depth+1});
   stack.push({p:add(hit.pt,mul(t,0.01)),d:t,I:partial?r.I*(1-Rf):r.I,primary:r.primary,depth:r.depth+1});
  }
 }
 return {segs,events};
}

/* ---------- theme colours ---------- */
let C={};
function readColours(){
 const cs=getComputedStyle(root);
 ['bg','ink','muted','line','accent','ray','normal','iarc','rarc','tir','glass-edge','prot-fill','prot-edge','prot-ink','wave','halo','box','box-hi','tint']
  .forEach(k=>C[k]=cs.getPropertyValue('--'+k).trim());
}

/* ---------- drawing helpers ---------- */
const FONT="'Atkinson Hyperlegible',system-ui,sans-serif", MONO="'IBM Plex Mono',ui-monospace,monospace";
function text(str,x,y,opt){
 opt=opt||{};
 ctx.font=(opt.weight||'700')+' '+(opt.size||26)+'px '+(opt.mono?MONO:FONT);
 ctx.textAlign=opt.align||'center';ctx.textBaseline=opt.base||'middle';
 ctx.lineJoin='round';ctx.lineWidth=opt.halo||7;ctx.strokeStyle=C.halo;ctx.strokeText(str,x,y);
 ctx.fillStyle=opt.col||C.ink;ctx.fillText(str,x,y);
}
function tintFor(key){
 const m=MATS[key];if(!m.tint) return null;
 const t=m.tint, a=O.theme==='night'?t[3]*1.25:t[3];
 return 'rgba('+t[0]+','+t[1]+','+t[2]+','+a+')';
}
let placed=[];
function angArc(pt,u,v,r,col,label){
 const a1=Math.atan2(u[1],u[0]),a2=Math.atan2(v[1],v[0]);
 let d=a2-a1;while(d>Math.PI)d-=2*Math.PI;while(d<-Math.PI)d+=2*Math.PI;
 ctx.strokeStyle=col;ctx.lineWidth=3.5;
 if(Math.abs(d)>0.01){ctx.beginPath();ctx.arc(pt[0],pt[1],r,a1,a1+d,d<0);ctx.stroke();}
 const am=a1+d/2,bw=label.length*13+10,bh=32;
 let lr=r+(label.length>3?52:30),x,y;
 for(let k=0;k<10;k++){
  x=pt[0]+Math.cos(am)*lr;y=pt[1]+Math.sin(am)*lr;
  if(!placed.some(b=>Math.abs(b[0]-x)<(b[2]+bw)/2&&Math.abs(b[1]-y)<(b[3]+bh)/2)) break;
  lr+=22;
 }
 placed.push([x,y,bw,bh]);
 text(label,x,y,{col,size:25});
}
function fmt(x){return O.values?x.toFixed(1)+'°':'?';}

/* ---------- main draw ---------- */
let lastReadout='';
function draw(){
 const s=sc();
 G=buildGeom(s);
 ctx.fillStyle=C.bg;ctx.fillRect(0,0,W,H);

 // surroundings tint
 const st=tintFor(s.sur);
 if(st){ctx.fillStyle=st;ctx.fillRect(0,0,W,H);}
 // faint grid
 ctx.strokeStyle=C.tint;ctx.lineWidth=2;ctx.beginPath();
 for(let x=0;x<=W;x+=50){ctx.moveTo(x,0);ctx.lineTo(x,H);}
 for(let y=0;y<=H;y+=50){ctx.moveTo(0,y);ctx.lineTo(W,y);}
 ctx.stroke();

 // block / lower medium
 ctx.beginPath();G.path(ctx);
 if(st){ctx.fillStyle=C.bg;ctx.fill();}
 const mt=tintFor(s.mat)||'rgba(128,128,128,0.06)';
 ctx.fillStyle=mt;ctx.fill();
 if(s.shape.type!=='half'){
  ctx.save();ctx.clip();
  // gentle sheen
  const gr=ctx.createLinearGradient(s.pos[0]-300,s.pos[1]-300,s.pos[0]+300,s.pos[1]+300);
  gr.addColorStop(0,'rgba(255,255,255,0.35)');gr.addColorStop(0.5,'rgba(255,255,255,0)');gr.addColorStop(1,'rgba(255,255,255,0.12)');
  ctx.fillStyle=gr;ctx.fillRect(0,0,W,H);ctx.restore();
 }
 ctx.beginPath();G.path(ctx);ctx.strokeStyle=C['glass-edge'];ctx.lineWidth=s.shape.type==='half'?3:4;
 if(s.shape.type==='half'){ctx.beginPath();ctx.moveTo(0,s.pos[1]);ctx.lineTo(W,s.pos[1]);}
 ctx.stroke();

 // medium labels
 const surN=nOf(s.sur,'sur',s), matN=nOf(s.mat,'mat',s);
 if(s.shape.type==='half'){
  text(nameOf(s.sur,s,'sur')+'   n = '+surN.toFixed(2),30,40,{align:'left',size:26,col:C.muted});
  text(nameOf(s.mat,s,'mat')+'   n = '+matN.toFixed(2),30,H-40,{align:'left',size:26,col:C.muted});
 } else {
  text('Block: '+nameOf(s.mat,s,'mat')+'  n = '+matN.toFixed(2),30,40,{align:'left',size:24,col:C.muted});
  text('Surroundings: '+nameOf(s.sur,s,'sur')+'  n = '+surN.toFixed(2),30,76,{align:'left',size:24,col:C.muted});
 }

 // protractor (under rays)
 if(O.prot) drawProtractor();

 // rays
 const pose=laserPose(s);
 let mono=null,colourRuns=null;
 if(s.white){
  colourRuns=WAVES.map(w=>({w,res:trace(s,pose.front,pose.d,w.l,false)}));
  mono=trace(s,pose.front,pose.d,589.3,false);
 } else {
  mono=trace(s,pose.front,pose.d,0,O.partial);
 }
 const ev=mono.events;

 // normals
 if(O.normals){
  ctx.setLineDash([14,10]);ctx.strokeStyle=C.normal;ctx.lineWidth=2.5;
  ev.slice(0,6).forEach(e=>{const a=add(e.pt,mul(e.N,150)),b=add(e.pt,mul(e.N,-150));ctx.beginPath();ctx.moveTo(a[0],a[1]);ctx.lineTo(b[0],b[1]);ctx.stroke();});
  ctx.setLineDash([]);
 }

 // wavefronts
 if(s.waves&&!s.white) drawWaves(mono.segs.filter(x=>x.primary));

 ctx.lineCap='round';ctx.lineJoin='round';
 if(s.white){
  const first=mono.segs[0];
  ctx.strokeStyle=O.theme==='night'?'#f5f7fb':'#3a4252';ctx.lineWidth=6;
  ctx.beginPath();ctx.moveTo(first.a[0],first.a[1]);ctx.lineTo(first.b[0],first.b[1]);ctx.stroke();
  ctx.globalAlpha=0.92;ctx.lineWidth=3.2;
  colourRuns.forEach(cr=>{
   ctx.strokeStyle=cr.w.c;
   cr.res.segs.forEach((g,i)=>{if(i===0)return;ctx.beginPath();ctx.moveTo(g.a[0],g.a[1]);ctx.lineTo(g.b[0],g.b[1]);ctx.stroke();});
  });
  ctx.globalAlpha=1;
  const p=add(first.a,mul(first.d,70));
  text('white light',p[0],p[1]-34,{size:22,col:C.muted});
 } else {
  mono.segs.slice().sort((a,b)=>a.I-b.I).forEach(g=>{
   ctx.globalAlpha=g.primary?Math.max(0.55,g.I):clamp(0.15+g.I*2.2,0.15,0.95);
   ctx.strokeStyle=C.ray;ctx.lineWidth=g.primary?5:3;
   ctx.beginPath();ctx.moveTo(g.a[0],g.a[1]);ctx.lineTo(g.b[0],g.b[1]);ctx.stroke();
   // direction arrow at the middle of finite segments
   const L=len(sub(g.b,g.a));
   if(L>90&&L<3900){
    const m=mul(add(g.a,g.b),0.5),dd=g.d,pp=[-dd[1],dd[0]];
    ctx.fillStyle=C.ray;ctx.beginPath();
    const tip=add(m,mul(dd,13));
    ctx.moveTo(tip[0],tip[1]);
    const l1=add(sub(m,mul(dd,9)),mul(pp,10)),l2=sub(sub(m,mul(dd,9)),mul(pp,10));
    ctx.lineTo(l1[0],l1[1]);ctx.lineTo(l2[0],l2[1]);ctx.closePath();ctx.fill();
   } else if(L>=3900){
    const m=add(g.a,mul(g.d,170)),dd=g.d,pp=[-dd[1],dd[0]];
    if(m[0]>0&&m[0]<W&&m[1]>0&&m[1]<H){
     ctx.fillStyle=C.ray;ctx.beginPath();const tip=add(m,mul(dd,13));ctx.moveTo(tip[0],tip[1]);
     const l1=add(sub(m,mul(dd,9)),mul(pp,10)),l2=sub(sub(m,mul(dd,9)),mul(pp,10));
     ctx.lineTo(l1[0],l1[1]);ctx.lineTo(l2[0],l2[1]);ctx.closePath();ctx.fill();
    }
   }
  });
  ctx.globalAlpha=1;
 }

 // angle arcs
 placed=[];
 ev.slice(0,6).forEach((e,idx)=>{
  if(e.i<0.05) return;
  if(e.pt[0]<-50||e.pt[0]>W+50||e.pt[1]<-50||e.pt[1]>H+50) return;
  const back=mul(e.din,-1);
  const r0=58;
  angArc(e.pt,e.N,back,r0,C.iarc,O.values?'i = '+e.i.toFixed(1)+'°':'i');
  if(e.tir){
   angArc(e.pt,e.N,e.dout,r0+26,C.tir,O.values?'r = '+e.r.toFixed(1)+'°':'r');
  } else {
   angArc(e.pt,mul(e.N,-1),e.dout,r0,C.rarc,O.values?'r = '+e.r.toFixed(1)+'°':'r');
  }
  if(e.tir){
   const p=add(e.pt,mul(e.N,-46));
   text('TIR',p[0],p[1],{size:22,col:C.tir});
  }
 });

 drawLaser(s,pose);
 updateReadout(s,mono,colourRuns,pose);
}

function drawWaves(segs){
 const lam0=58;let L=0;
 ctx.lineWidth=2.4;ctx.strokeStyle=C.wave;
 segs.forEach(g=>{
  const sLen=len(sub(g.b,g.a)),n=g.n,dd=g.d,pp=[-dd[1],dd[0]];
  ctx.save();ctx.beginPath();
  if(g.inside){G.path(ctx);ctx.clip();}
  else {ctx.rect(-10,-10,W+20,H+20);G.path(ctx);ctx.clip('evenodd');}
  ctx.beginPath();
  let k=Math.ceil((L-O.phase)/lam0);
  for(let guard=0;guard<400;guard++,k++){
   const x=(k*lam0+O.phase-L)/n;
   if(x>sLen) break;
   if(x<0) continue;
   const c=add(g.a,mul(dd,x)),a=add(c,mul(pp,46)),b=sub(c,mul(pp,46));
   ctx.moveTo(a[0],a[1]);ctx.lineTo(b[0],b[1]);
  }
  ctx.stroke();ctx.restore();
  L+=n*Math.min(sLen,4000);
 });
}

function drawLaser(s,pose){
 const f=pose.front,d=pose.d,b=mul(d,-1),p=[-d[1],d[0]];
 const len0=130,w=22;
 const back=add(f,mul(b,len0));
 // knob (free mode)
 if(!s.usePivot){
  const k=add(f,mul(b,len0+34));
  ctx.strokeStyle=C.box;ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(back[0],back[1]);ctx.lineTo(k[0],k[1]);ctx.stroke();
  ctx.fillStyle=C.accent;ctx.beginPath();ctx.arc(k[0],k[1],16,0,Math.PI*2);ctx.fill();
  ctx.strokeStyle=C.bg;ctx.lineWidth=3;ctx.beginPath();ctx.arc(k[0],k[1],8,0.3,Math.PI*1.6);ctx.stroke();
 }
 const c1=add(f,mul(p,w)),c2=sub(f,mul(p,w)),c3=sub(back,mul(p,w)),c4=add(back,mul(p,w));
 ctx.fillStyle=C.box;ctx.beginPath();ctx.moveTo(c1[0],c1[1]);ctx.lineTo(c2[0],c2[1]);ctx.lineTo(c3[0],c3[1]);ctx.lineTo(c4[0],c4[1]);ctx.closePath();ctx.fill();
 ctx.strokeStyle=C['box-hi'];ctx.lineWidth=2;ctx.stroke();
 // label band
 const m1=add(add(f,mul(b,40)),mul(p,w)),m2=sub(add(f,mul(b,40)),mul(p,w));
 ctx.strokeStyle=C['box-hi'];ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(m1[0],m1[1]);ctx.lineTo(m2[0],m2[1]);ctx.stroke();
 // aperture glow
 ctx.fillStyle=s.white?'#ffffff':C.ray;
 ctx.beginPath();ctx.arc(f[0],f[1],6,0,Math.PI*2);ctx.fill();
}

function drawProtractor(){
 const cx=O.protX,cy=O.protY,R=190,phi=O.protPhi;
 ctx.save();
 ctx.fillStyle=C['prot-fill'];ctx.strokeStyle=C['prot-edge'];ctx.lineWidth=2.5;
 ctx.beginPath();ctx.arc(cx,cy,R,0,Math.PI*2);ctx.fill();ctx.stroke();
 ctx.beginPath();ctx.arc(cx,cy,R-62,0,Math.PI*2);ctx.lineWidth=1.2;ctx.stroke();
 ctx.strokeStyle=C['prot-ink'];
 for(let dgr=0;dgr<360;dgr++){
  const a=phi+dgr*D2R,tl=dgr%10===0?24:(dgr%5===0?15:8);
  ctx.lineWidth=dgr%10===0?2:1;
  ctx.beginPath();ctx.moveTo(cx+Math.cos(a)*R,cy+Math.sin(a)*R);ctx.lineTo(cx+Math.cos(a)*(R-tl),cy+Math.sin(a)*(R-tl));ctx.stroke();
 }
 ctx.font='700 16px '+MONO;ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillStyle=C['prot-ink'];
 for(let dgr=0;dgr<360;dgr+=10){
  let v=dgr%180;v=v<=90?v:180-v;
  const a=phi+dgr*D2R;
  ctx.fillText(String(v),cx+Math.cos(a)*(R-40),cy+Math.sin(a)*(R-40));
 }
 // zero line (along normal) and 90 line
 ctx.lineWidth=1.5;ctx.strokeStyle=C['prot-edge'];
 const u=[Math.cos(phi),Math.sin(phi)],v=[-u[1],u[0]];
 ctx.beginPath();ctx.moveTo(cx-u[0]*(R-62),cy-u[1]*(R-62));ctx.lineTo(cx+u[0]*(R-62),cy+u[1]*(R-62));
 ctx.moveTo(cx-v[0]*(R-62),cy-v[1]*(R-62));ctx.lineTo(cx+v[0]*(R-62),cy+v[1]*(R-62));ctx.stroke();
 ctx.beginPath();ctx.arc(cx,cy,5,0,Math.PI*2);ctx.stroke();
 // rotate knob at 0° mark
 const k=[cx+u[0]*(R+26),cy+u[1]*(R+26)];
 ctx.fillStyle=C['prot-edge'];ctx.beginPath();ctx.arc(k[0],k[1],14,0,Math.PI*2);ctx.fill();
 ctx.strokeStyle=C.bg;ctx.lineWidth=3;ctx.beginPath();ctx.arc(k[0],k[1],7,0.3,Math.PI*1.6);ctx.stroke();
 ctx.restore();
}

/* ---------- readout ---------- */
function mName(e,s,isFrom){
 const inside=(e.from==='in')===isFrom;
 return inside?nameOf(s.mat,s,'mat'):nameOf(s.sur,s,'sur');
}
function updateReadout(s,mono,colourRuns,pose){
 const ev=mono.events;let h='';
 if(!ev.length) h+='<div class="rfx-note">The ray does not meet a surface. Aim the ray box at the block.</div>';
 ev.slice(0,7).forEach((e,k)=>{
  const from=mName(e,s,true),to=mName(e,s,false);
  if(e.tir){
   h+='<div class="rfx-ev rfx-tirrow"><div class="rfx-ev-h">Surface '+(k+1)+' · <b>'+from+' → '+to+'</b></div>'+
    '<div class="rfx-t">Total internal reflection</div>'+
    '<div class="rfx-mono rfx-big"><span class="rfx-i">i = '+fmt(e.i)+'</span> &nbsp; <span class="rfx-t">r = '+fmt(e.r)+'</span></div>'+
    '<div class="rfx-mono">i '+(O.values?'> c = '+e.c.toFixed(1)+'°':'> c')+'</div></div>';
  } else {
   const L1=e.n1*Math.sin(e.i*D2R),L2=e.n2*Math.sin(e.r*D2R);
   h+='<div class="rfx-ev"><div class="rfx-ev-h">Surface '+(k+1)+' · <b>'+from+' → '+to+'</b></div>'+
    '<div class="rfx-mono rfx-big"><span class="rfx-i">i = '+fmt(e.i)+'</span> &nbsp; <span class="rfx-r">r = '+fmt(e.r)+'</span></div>'+
    (O.values?'<div class="rfx-mono">'+e.n1.toFixed(2)+' × sin '+e.i.toFixed(1)+'° = '+L1.toFixed(3)+' &nbsp;|&nbsp; '+e.n2.toFixed(2)+' × sin '+e.r.toFixed(1)+'° = '+L2.toFixed(3)+'</div>':'')+
    (e.i<0.05?'<div class="rfx-note">Along the normal: the ray does not change direction.</div>':'')+
    (O.partial&&e.Rf!==undefined&&O.values?'<div class="rfx-note">Reflected: '+(e.Rf*100).toFixed(1)+'% of the light</div>':'')+
    '</div>';
  }
 });
 h+='<div class="rfx-foot">';
 const nm=nOf(s.mat,'mat',s),ns=nOf(s.sur,'sur',s);
 const a=s.shape.type==='half'?'lower → upper':nameOf(s.mat,s,'mat').toLowerCase()+' → '+nameOf(s.sur,s,'sur').toLowerCase();
 if(nm>ns+1e-9){
  const c=Math.asin(ns/nm)*R2D;
  h+='<div>Critical angle ('+a+'): <b class="rfx-mono">c = '+fmt(c)+'</b></div>';
  if(O.values) h+='<div class="rfx-note rfx-mono">sin c = '+ns.toFixed(2)+' / '+nm.toFixed(2)+' = '+(ns/nm).toFixed(3)+'</div>';
 } else {
  h+='<div class="rfx-note">No critical angle '+(s.shape.type==='half'?'for this ray: it travels into an equally or more optically dense medium.':'here: the block is not more optically dense than its surroundings.')+'</div>';
 }
 if(s.shape.type!=='half'){
  const dev=r=>{const segs=r.segs.filter(x=>x.primary),last=segs[segs.length-1];if(!last||last.inside||segs.length<2)return null;
   const d0=segs[0].d,d1=last.d;return Math.acos(clamp(dot(d0,d1),-1,1))*R2D;};
  if(colourRuns){
   const dr=dev(colourRuns[0].res),dv=dev(colourRuns[colourRuns.length-1].res);
   if(dr!==null&&dv!==null) h+='<div>Deviation: <b class="rfx-mono" style="color:#d2232a">red '+fmt(dr)+'</b> · <b class="rfx-mono" style="color:#7a2fd0">violet '+fmt(dv)+'</b></div><div class="rfx-note">Colour spread is enlarged ×'+EXAG+' so it is easy to see.</div>';
  } else {
   const dm=dev(mono);
   if(dm!==null) h+='<div>Total deviation of the emerging ray: <b class="rfx-mono">'+fmt(dm)+'</b>'+(dm<0.05&&s.shape.type==='rect'?' <span class="rfx-note">(emerges parallel to the incident ray)</span>':'')+'</div>';
  }
 }
 h+='</div>';
 if(h!==lastReadout){$('readout').innerHTML=h;lastReadout=h;}
 // slider sync when not being dragged by the slider
 if(document.activeElement!==$('ang')) syncAngle();
}

/* ---------- UI ---------- */
function fillSelect(sel){
 sel.innerHTML='';
 for(const k in MATS){const o=document.createElement('option');o.value=k;o.textContent=k==='custom'?'Custom…':MATS[k].name+' ('+MATS[k].n.toFixed(2)+')';sel.appendChild(o);}
}
fillSelect($('mat'));fillSelect($('sur'));

function syncAngle(){
 const s=sc(),el=$('ang');
 if(s.usePivot){
  el.min=-89;el.max=89;el.step=0.5;el.value=s.a;
  $('angLabel').textContent=s.shape.type==='half'?'Angle of incidence':'Ray angle to the normal at the aiming point';
  $('angVal').textContent=Math.abs(s.a).toFixed(1)+'°';
 } else {
  el.min=-180;el.max=180;el.step=0.5;
  let deg=-s.free.ang*R2D;while(deg>180)deg-=360;while(deg<=-180)deg+=360;
  el.value=deg;$('angLabel').textContent='Ray box direction';$('angVal').textContent=deg.toFixed(1)+'°';
 }
}
function syncUI(){
 const s=sc(),half=s.shape.type==='half';
 root.querySelectorAll('.rfx-tab').forEach(b=>b.setAttribute('aria-selected',String(b.dataset.mode===O.mode)));
 root.querySelectorAll('.rfx-theme button').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.theme===O.theme)));
 $('matLabel').textContent=half?'Lower medium (ray starts here)':'Block material';
 $('surLabel').textContent=half?'Upper medium':'Surroundings';
 $('mat').value=s.mat;$('sur').value=s.sur;
 $('matCustomRow').hidden=s.mat!=='custom';$('surCustomRow').hidden=s.sur!=='custom';
 $('matCustom').value=s.custom.mat;$('matCustomVal').textContent='n = '+s.custom.mat.toFixed(2);
 $('surCustom').value=s.custom.sur;$('surCustomVal').textContent='n = '+s.custom.sur.toFixed(2);
 $('pivotRow').hidden=half;$('pivot').checked=s.usePivot;
 $('rotRow').hidden=half;$('rot').value=s.rot;$('rotVal').textContent=Math.round(s.rot)+'°';
 const chip=(k,on,dis)=>{const b=root.querySelector('[data-opt="'+k+'"]');b.setAttribute('aria-pressed',String(!!on));b.disabled=!!dis;};
 chip('prot',O.prot);chip('normals',O.normals);chip('values',O.values);
 chip('partial',O.partial&&!s.white,s.white);chip('waves',s.waves&&!s.white,s.white);chip('white',s.white);
 $('snap').disabled=false;
 $('hint').textContent=HINTS[O.mode];
 syncAngle();
}
root.querySelectorAll('.rfx-tab').forEach(b=>b.addEventListener('click',()=>{O.mode=b.dataset.mode;if(O.prot)snapProt();syncUI();}));
root.querySelectorAll('.rfx-theme button').forEach(b=>b.addEventListener('click',()=>{
 O.theme=b.dataset.theme;root.classList.toggle('rfx-night',O.theme==='night');readColours();syncUI();}));
$('mat').addEventListener('change',e=>{sc().mat=e.target.value;syncUI();});
$('sur').addEventListener('change',e=>{sc().sur=e.target.value;syncUI();});
$('matCustom').addEventListener('input',e=>{sc().custom.mat=parseFloat(e.target.value);syncUI();});
$('surCustom').addEventListener('input',e=>{sc().custom.sur=parseFloat(e.target.value);syncUI();});
$('ang').addEventListener('input',e=>{
 const s=sc(),v=parseFloat(e.target.value);
 if(s.usePivot){s.a=v;$('angVal').textContent=Math.abs(v).toFixed(1)+'°';}
 else {s.free.ang=-v*D2R;$('angVal').textContent=v.toFixed(1)+'°';}
});
$('rot').addEventListener('input',e=>{sc().rot=parseFloat(e.target.value);$('rotVal').textContent=Math.round(sc().rot)+'°';});
$('pivot').addEventListener('change',e=>{
 const s=sc();
 if(!e.target.checked){const p=laserPose(s);s.free={x:p.front[0],y:p.front[1],ang:Math.atan2(p.d[1],p.d[0])};}
 s.usePivot=e.target.checked;syncUI();
});
root.querySelectorAll('.rfx-chip').forEach(b=>b.addEventListener('click',()=>{
 const k=b.dataset.opt,s=sc();
 if(k==='prot'){O.prot=!O.prot;if(O.prot)snapProt();}
 else if(k==='waves') s.waves=!s.waves;
 else if(k==='white') s.white=!s.white;
 else O[k]=!O[k];
 syncUI();
}));
function snapProt(){
 const s=sc();G=buildGeom(s);
 const pose=laserPose(s),r=trace(s,pose.front,pose.d,0,false);
 const evs=r.events.filter(e=>e.i>0.5&&e.pt[0]>0&&e.pt[0]<W&&e.pt[1]>0&&e.pt[1]<H);
 if(evs.length||r.events.length){const e=evs[0]||r.events[0];O.protX=e.pt[0];O.protY=e.pt[1];O.protPhi=Math.atan2(e.N[1],e.N[0]);}
 else {O.protX=W/2;O.protY=H/2;O.protPhi=-Math.PI/2;}
}
$('snap').addEventListener('click',()=>{O.prot=true;snapProt();syncUI();});
$('reset').addEventListener('click',()=>{S[O.mode]=freshScene(O.mode);if(O.prot)snapProt();syncUI();});

/* ---------- pointer interaction ---------- */
let drag=null;
function toWorld(e){const r=cv.getBoundingClientRect();return [(e.clientX-r.left)*W/r.width,(e.clientY-r.top)*H/r.height];}
function hitLaser(s,w){
 const p=laserPose(s),b=mul(p.d,-1),rel=sub(w,p.front);
 const along=dot(rel,b),perp=Math.abs(cross(b,rel));
 if(!s.usePivot){const k=add(p.front,mul(b,164));if(len(sub(w,k))<26) return 'knob';}
 if(along>-14&&along<144&&perp<32) return 'body';
 return null;
}
function pivotAngleFrom(s,w){
 const P=pivotWorld(s),v=sub(w,P.p);
 if(len(v)<5) return null;
 const a=Math.atan2(cross(P.n,v),dot(P.n,v))*R2D;
 return clamp(a,-89,89);
}
function pick(w){
 const s=sc(),hl=hitLaser(s,w);
 if(hl==='knob') return {k:'laserRot'};
 if(hl==='body') return s.usePivot?{k:'aim'}:{k:'laserMove',off:sub([s.free.x,s.free.y],w)};
 if(O.prot){
  const u=[Math.cos(O.protPhi),Math.sin(O.protPhi)],kp=[O.protX+u[0]*216,O.protY+u[1]*216];
  if(len(sub(w,kp))<24) return {k:'protRot'};
  if(len(sub(w,[O.protX,O.protY]))<190) return {k:'protMove',off:sub([O.protX,O.protY],w)};
 }
 G=buildGeom(s);
 if(s.shape.type!=='half'&&G.contains(w)) return {k:'block',off:sub(s.pos,w)};
 if(s.usePivot){const P=pivotWorld(s);if(dot(sub(w,P.p),P.n)>0) return {k:'aim'};}
 return null;
}
cv.addEventListener('pointerdown',e=>{
 const w=toWorld(e);drag=pick(w);
 if(drag){cv.setPointerCapture(e.pointerId);e.preventDefault();move(w);cv.style.cursor='grabbing';}
 cv.focus({preventScroll:true});
});
function move(w){
 const s=sc();
 if(!drag) return;
 if(drag.k==='aim'){const a=pivotAngleFrom(s,w);if(a!==null)s.a=Math.round(a*2)/2;}
 else if(drag.k==='laserMove'){const p=add(w,drag.off);s.free.x=clamp(p[0],0,W);s.free.y=clamp(p[1],0,H);}
 else if(drag.k==='laserRot'){const f=[s.free.x,s.free.y],v=sub(f,w);s.free.ang=Math.atan2(v[1],v[0]);}
 else if(drag.k==='protMove'){const p=add(w,drag.off);O.protX=clamp(p[0],0,W);O.protY=clamp(p[1],0,H);}
 else if(drag.k==='protRot'){O.protPhi=Math.atan2(w[1]-O.protY,w[0]-O.protX);}
 else if(drag.k==='block'){const p=add(w,drag.off);s.pos=[clamp(p[0],60,W-60),clamp(p[1],60,H-60)];}
}
cv.addEventListener('pointermove',e=>{
 const w=toWorld(e);
 if(drag){move(w);return;}
 const p=pick(w);
 cv.style.cursor=!p?'default':(p.k==='aim'?'crosshair':(p.k.indexOf('Rot')>0?'alias':'grab'));
});
const end=()=>{drag=null;cv.style.cursor='default';};
cv.addEventListener('pointerup',end);cv.addEventListener('pointercancel',end);
cv.addEventListener('keydown',e=>{
 const s=sc(),st=e.shiftKey?5:0.5;
 let d=0;if(e.key==='ArrowLeft')d=-st;else if(e.key==='ArrowRight')d=st;else return;
 e.preventDefault();
 if(s.usePivot) s.a=clamp(s.a+d,-89,89); else s.free.ang-=d*D2R;
});

/* ---------- sizing & loop ---------- */
function resize(){
 const r=stage.getBoundingClientRect(),dpr=Math.min(window.devicePixelRatio||1,2);
 cv.width=Math.max(1,Math.round(r.width*dpr));cv.height=Math.max(1,Math.round(r.height*dpr));
 ctx.setTransform(cv.width/W,0,0,cv.height/H,0,0);
}
new ResizeObserver(resize).observe(stage);
readColours();resize();syncUI();
if(document.fonts&&document.fonts.ready) document.fonts.ready.then(()=>{lastReadout='';});
function loop(){O.phase+=1.1;draw();requestAnimationFrame(loop);}
loop();
})();
</script>
</body>
</html>
